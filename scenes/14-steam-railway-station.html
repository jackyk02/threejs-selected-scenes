<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Marchwood Terminus — Victorian Railway Terminus</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0f0e;height:100%;font-family:Georgia,'Times New Roman',serif;}
  canvas{display:block;}
  .plaque{
    position:absolute;z-index:10;color:#e9dcba;
    background:linear-gradient(180deg, rgba(22,26,22,.82), rgba(12,14,12,.82));
    border:1px solid #c8a562;box-shadow:0 0 0 3px rgba(10,10,10,.55),0 6px 22px rgba(0,0,0,.55), inset 0 0 18px rgba(200,165,98,.12);
    border-radius:3px;padding:8px 14px;pointer-events:none;
  }
  #title{top:14px;left:16px;}
  #title h1{margin:0;font-size:19px;letter-spacing:.22em;font-variant:small-caps;color:#f0e2b6;text-shadow:0 2px 3px #000;}
  #title p{margin:2px 0 0;font-size:10.5px;letter-spacing:.14em;color:#b9a878;font-style:italic;}
  #help{top:14px;right:16px;font-size:11.5px;letter-spacing:.08em;text-align:right;line-height:1.65;}
  #help b{color:#ffd98a;border:1px solid #c8a562;border-radius:3px;padding:0 5px;font-family:Georgia;font-size:10px;background:#241f14;}
  #recordBtn{
    position:absolute;z-index:11;bottom:18px;left:50%;transform:translateX(-50%);
    cursor:pointer;color:#f3e6bd;background:linear-gradient(180deg,#3a2c1c,#20160d);
    border:1px solid #d8b56a;border-radius:4px;padding:11px 26px;font-family:Georgia;font-size:14px;
    letter-spacing:.14em;font-variant:small-caps;box-shadow:0 4px 18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,225,150,.35);
    transition:all .2s;
  }
  #recordBtn:hover{background:linear-gradient(180deg,#54401f,#2c2012);box-shadow:0 4px 26px rgba(255,205,110,.25), inset 0 1px 0 rgba(255,225,150,.5);}
  #recordBtn:disabled{opacity:.7;cursor:default;}
  #badge{bottom:14px;right:16px;font-size:10px;letter-spacing:.15em;color:#8d8272;}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

</head>
<body>
<div class="plaque" id="title"><h1>Marchwood Terminus</h1><p>Great Western joint line · Est. 1866 &nbsp;—&nbsp; iron-&amp;-glass train shed</p></div>
<div class="plaque" id="help"><b>SPACE</b> dispatch &nbsp;·&nbsp; <b>C</b> cab ride &nbsp;·&nbsp; <b>T</b> gaslight<br/>drag to orbit · scroll to zoom</div>
<button id="recordBtn">⏺&ensp;Record Showcase (.webm)</button>
<div class="plaque" id="badge">No. 371 · “MARCHWOOD &amp; WESTERN”</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================ TOP-LEVELS */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.target.set(0, 2.6, 2);
controls.minDistance = 2.2; controls.maxDistance = 70; controls.maxPolarAngle = 1.53;

window.scene = scene; window.camera = camera; window.renderer = renderer; window.controls = controls;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.38, 0.72, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================ HELPERS */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const easeSmoother = t => t*t*t*(t*(t*6-15)+10);
function mulberry32(seed){ return function(){ seed|=0; seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^(seed>>>15),1|seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
let rng = mulberry32(20240613);

function canvasTex(w,h,fn,rep){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); fn(g,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); }
  return t;
}
const M = (color,rough,metal,extra={}) => new THREE.MeshStandardMaterial(Object.assign({color,roughness:rough,metalness:metal},extra));

/* ============================================================ PROCEDURAL TEXTURES */
const brickTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#5f4034'; g.fillRect(0,0,w,h);
  const bw=64,bh=26;
  for(let y=0;y<h;y+=bh){
    const off=(y/bh)%2?bw/2:0;
    for(let x=-bw;x<w+bw;x+=bw){
      const v=0.82+Math.random()*0.36;
      g.fillStyle=`rgb(${Math.floor(112*v)},${Math.floor(71*v)},${Math.floor(54*v)})`;
      g.fillRect(x+off+2,y+2,bw-4,bh-4);
      g.fillStyle='rgba(255,220,190,0.05)'; g.fillRect(x+off+2,y+2,bw-4,5);
    }
  }
  g.strokeStyle='#40332a'; g.lineWidth=2;
  for(let y=0;y<=h;y+=bh){ g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke(); }
},[0.14,0.14]);

const slabTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#8d867b'; g.fillRect(0,0,w,h);
  const s=128;
  for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){
    const v=0.85+Math.random()*0.3;
    g.fillStyle=`rgb(${Math.floor(140*v)},${Math.floor(133*v)},${Math.floor(121*v)})`;
    g.fillRect(x+3,y+3,s-6,s-6);
    // speckle
    for(let i=0;i<220;i++){ g.fillStyle=`rgba(40,36,30,${Math.random()*0.25})`; g.fillRect(x+Math.random()*s,y+Math.random()*s,2,2); }
  }
  g.strokeStyle='#57534a'; g.lineWidth=4;
  for(let y=0;y<=h;y+=s){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  for(let x=0;x<=w;x+=s){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
},[6,14]);

const ballastTex = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#2e2a26'; g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){
    const v=0.5+Math.random()*0.9;
    g.fillStyle=`rgb(${Math.floor(58*v)},${Math.floor(54*v)},${Math.floor(48*v)})`;
    const r=1+Math.random()*3.4; g.beginPath(); g.arc(Math.random()*w,Math.random()*h,r,0,7); g.fill();
  }
},[3,40]);

const signTex = canvasTex(1024,220,(g,w,h)=>{
  g.fillStyle='#16301f'; g.fillRect(0,0,w,h);
  g.strokeStyle='#d8b56a'; g.lineWidth=10; g.strokeRect(14,14,w-28,h-28);
  g.lineWidth=3; g.strokeRect(30,30,w-60,h-60);
  g.fillStyle='#ecd9a0'; g.font='small-caps bold 96px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('MARCHWOOD TERMINUS', w/2, h/2+6);
});

const clockTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#221d16'; g.fillRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  const rad=g.createRadialGradient(cx,cy,30,cx,cy,205);
  rad.addColorStop(0,'#f5ecd6'); rad.addColorStop(0.85,'#e6d9b8'); rad.addColorStop(1,'#b9a982');
  g.fillStyle=rad; g.beginPath(); g.arc(cx,cy,200,0,7); g.fill();
  g.strokeStyle='#1c1712'; g.lineWidth=14; g.beginPath(); g.arc(cx,cy,196,0,7); g.stroke();
  g.fillStyle='#241f18';
  const romans=['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
  g.font='bold 44px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2 - Math.PI/2;
    g.fillText(romans[i], cx+Math.cos(a)*146, cy+Math.sin(a)*146);
  }
  g.font='small-caps 22px Georgia'; g.fillStyle='#4a3f2c';
  g.fillText('M & W RY', cx, cy-62); g.fillText('EST · 1866', cx, cy+64);
  for(let i=0;i<60;i++){
    const a=i/60*Math.PI*2;
    g.save(); g.translate(cx+Math.cos(a)*178, cy+Math.sin(a)*178); g.rotate(a);
    g.fillStyle='#241f18'; g.fillRect(-2, i%5?-8:-14, 4, i%5?16:28); g.restore();
  }
});

const plate371 = canvasTex(256,160,(g,w,h)=>{
  g.fillStyle='#3d1a12'; g.fillRect(0,0,w,h);
  g.strokeStyle='#d8b56a'; g.lineWidth=8; g.strokeRect(8,8,w-16,h-16);
  g.fillStyle='#ecd27f'; g.font='bold 96px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('371', w/2, h/2+4);
});
const tenderTex = canvasTex(1024,256,(g,w,h)=>{
  g.fillStyle='#173326'; g.fillRect(0,0,w,h);
  g.fillStyle='#e7d191'; g.font='bold 108px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('MARCHWOOD & WESTERN', w/2, h/2-16);
  g.font='small-caps 40px Georgia'; g.fillText('— RAILWAY —', w/2, h/2+72);
});
const softCircle = canvasTex(128,128,(g,w,h)=>{
  const gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.35,'rgba(255,255,255,.72)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
const sparkTex = canvasTex(64,64,(g,w,h)=>{
  const gr=g.createRadialGradient(32,32,1,32,32,30);
  gr.addColorStop(0,'rgba(255,255,230,1)'); gr.addColorStop(0.3,'rgba(255,220,130,.95)'); gr.addColorStop(1,'rgba(255,140,40,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
const shaftTex = canvasTex(128,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'rgba(255,244,214,0.9)'); gr.addColorStop(0.55,'rgba(255,244,214,0.35)'); gr.addColorStop(1,'rgba(255,244,214,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  const side=g.createLinearGradient(0,0,w,0);
  side.addColorStop(0,'rgba(0,0,0,1)'); side.addColorStop(0.25,'rgba(0,0,0,0)'); side.addColorStop(0.75,'rgba(0,0,0,0)'); side.addColorStop(1,'rgba(0,0,0,1)');
  g.globalCompositeOperation='destination-out'; g.fillStyle=side; g.fillRect(0,0,w,h);
});
const glowTex = canvasTex(128,128,(g,w,h)=>{
  const gr=g.createRadialGradient(64,64,2,64,64,60);
  gr.addColorStop(0,'rgba(255,235,180,1)'); gr.addColorStop(0.4,'rgba(255,205,120,.5)'); gr.addColorStop(1,'rgba(255,205,120,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
const skyGradTex = canvasTex(64,256,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#dfe9e6'); gr.addColorStop(0.55,'#f6ecd2'); gr.addColorStop(1,'#fff6da');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
const sideGradTex = canvasTex(64,256,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#5c6a66'); gr.addColorStop(0.8,'#a9b6ac'); gr.addColorStop(1,'#cfc9b2');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});

/* ============================================================ CONSTANTS / LAYOUT */
const HALF_SPAN=23, SPRING_Y=5.5, ARCH_RISE=9.5;
const yRoof=(x)=> SPRING_Y + ARCH_RISE*Math.sqrt(Math.max(0,1-(x*x)/(HALF_SPAN*HALF_SPAN)));
const Z_MIN=-53, Z_MAX=48, BUF_Z=41.5, STOP_FRONT=36;
const START_FRONT = STOP_FRONT - (15*1.2 + 15*15/(2*2.6)); // ≈ -25.3
const COACH_LEN=10.8, COACH_GAP=0.75, COACH_PITCH=COACH_LEN+COACH_GAP, FIRST_COACH_FRONT=17.0;
const coachCenterLocal = i => -(FIRST_COACH_FRONT + i*COACH_PITCH) - COACH_LEN/2;
const DOOR_OFFSETS=[-3.35, 0, 3.35];
const DRIVER_R=0.78, AXLE_Y=0.28+DRIVER_R;
const TRACKS=[-7,0,7];

/* ============================================================ LIGHTS */
const hemi = new THREE.HemisphereLight(0xbfd6dd, 0x4a4036, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe8c4, 2.7);
sun.position.set(14,30,-6);
sun.target.position.set(0,0,6);
sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096);
sun.shadow.camera.left=-58; sun.shadow.camera.right=58; sun.shadow.camera.top=58; sun.shadow.camera.bottom=-58;
sun.shadow.camera.near=1; sun.shadow.camera.far=95;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03;
scene.add(sun); scene.add(sun.target);
const bounce = new THREE.DirectionalLight(0xcfd8d2, 0.5); bounce.position.set(-18,12,24); scene.add(bounce);

scene.fog = new THREE.Fog(0x9fb4b2, 58, 250);
scene.background = new THREE.Color(0x8fa3a0);

/* ============================================================ MATERIAL PALETTE */
const ironGreen = M(0x22332a,0.52,0.62);
const ironDark  = M(0x181d1c,0.6,0.55);
const cream     = M(0xd8cdb0,0.55,0.15);
const brass     = M(0xb08a3e,0.28,1.0);
const brassOld  = M(0x7d6132,0.42,0.95);
const brickMat  = new THREE.MeshStandardMaterial({map:brickTex, roughness:0.92, metalness:0.02});
const slabMat   = new THREE.MeshStandardMaterial({map:slabTex, roughness:0.95, metalness:0.02});
const ballastMat= new THREE.MeshStandardMaterial({map:ballastTex, roughness:1.0, metalness:0.0});
const railMat   = M(0xb9c1c4,0.18,0.95);
const timberMat = M(0x4f3823,0.8,0.05);
const leatherMat= M(0x5d4028,0.7,0.1);
const greenLoco = M(0x1c352a,0.38,0.55);
const smokeboxMat=M(0x141518,0.55,0.65);
const redBeam   = M(0x8e2418,0.55,0.25);
const coachCrim = M(0x641f1c,0.42,0.22);
const coachCream= M(0xe4d5a8,0.5,0.1);
const coachRoof = M(0x8a8d88,0.7,0.2);
const winMat    = new THREE.MeshStandardMaterial({color:0x27333a, roughness:0.08, metalness:0.4, emissive:0xffc06a, emissiveIntensity:0.0});
const coalMat   = M(0x0e0e10,0.95,0.05);

/* ============================================================ BUILD: SHED SHELL */
const shed = new THREE.Group(); scene.add(shed);

// -- roof glass (elliptical barrel vault)
{
  const nu=56, nv=30, pos=[], uv=[], idx=[];
  for(let i=0;i<=nu;i++){
    const th=Math.PI*i/nu, x=HALF_SPAN*Math.cos(th), y=yRoof(x);
    for(let j=0;j<=nv;j++){
      const z=Z_MIN+(Z_MAX-Z_MIN)*j/nv;
      pos.push(x,y,z); uv.push(i/nu*8, j/nv*16);
    }
  }
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
    const a=i*(nv+1)+j, b=a+nv+1; idx.push(a,b,a+1,b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  const glass=new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color:0xa9c6c4, roughness:0.06, metalness:0.0, transparent:true, opacity:0.30,
    side:THREE.DoubleSide, depthWrite:false, emissive:0x9fb8ad, emissiveIntensity:0.06
  }));
  shed.add(glass);
}
// -- arch ribs + purlins + portal arches
const archCurve=(()=>{ const pts=[]; for(let i=0;i<=40;i++){ const th=Math.PI*i/40; pts.push(new THREE.Vector3(HALF_SPAN*Math.cos(th), SPRING_Y+ARCH_RISE*Math.sin(th), 0)); } return new THREE.CatmullRomCurve3(pts); })();
{
  const ribGeo=new THREE.TubeGeometry(archCurve, 48, 0.10, 6, false);
  for(let z=Z_MIN+2; z<=Z_MAX-1; z+=6.4){
    const rib=new THREE.Mesh(ribGeo, ironGreen); rib.position.z=z; rib.castShadow=true; shed.add(rib);
  }
  const ribBig=new THREE.TubeGeometry(archCurve, 64, 0.42, 10, false);
  const p1=new THREE.Mesh(ribBig, ironGreen); p1.position.z=Z_MIN+0.4; p1.castShadow=true; shed.add(p1);
  const p2=new THREE.Mesh(ribBig, ironGreen); p2.position.z=Z_MAX-0.4; p2.castShadow=true; shed.add(p2);
  // purlins (longitudinal)
  for(let k=0;k<9;k++){
    const th=0.28+k*(Math.PI-0.56)/8;
    const x=HALF_SPAN*Math.cos(th), y=yRoof(x)-0.12;
    const len=Z_MAX-Z_MIN;
    const purlin=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.16,len), ironGreen);
    purlin.position.set(x,y,(Z_MIN+Z_MAX)/2); shed.add(purlin);
  }
  // ridge cresting
  const ridge=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.22,Z_MAX-Z_MIN), ironGreen);
  ridge.position.set(0,SPRING_Y+ARCH_RISE+0.02,(Z_MIN+Z_MAX)/2); shed.add(ridge);
}
// -- gable walls (brick) : end wall solid with big clock; entrance wall with arch hole
function gableShape(scaleHole){
  const s=new THREE.Shape();
  s.moveTo(-HALF_SPAN-0.4,0); s.lineTo(HALF_SPAN+0.4,0); s.lineTo(HALF_SPAN+0.4,SPRING_Y);
  s.absellipse(0,SPRING_Y,HALF_SPAN+0.4,ARCH_RISE+0.4,0,Math.PI,false);
  s.closePath(); return s;
}
function addGable(zPos, withHole){
  const shape=gableShape();
  if(withHole){
    const hole=new THREE.Path();
    hole.moveTo(-19.4,0); hole.lineTo(19.4,0); hole.lineTo(19.4,SPRING_Y);
    hole.absellipse(0,SPRING_Y,19.4,ARCH_RISE-0.9,0,Math.PI,false);
    hole.closePath(); shape.holes.push(hole);
  }
  const geo=new THREE.ExtrudeGeometry(shape,{depth:0.8,bevelEnabled:false,curveSegments:40});
  const m=new THREE.Mesh(geo, brickMat);
  m.position.set(0,0,zPos); m.castShadow=true; m.receiveShadow=true; shed.add(m);
}
addGable(Z_MAX-0.4,false);
addGable(Z_MIN-0.4,true);

// -- entrance portal glow plane (bright world beyond)
const portalGlow = new THREE.Mesh(new THREE.PlaneGeometry(56,17),
  new THREE.MeshBasicMaterial({map:skyGradTex, color:0xffffff, fog:false}));
portalGlow.position.set(0,8.5,Z_MIN-8); shed.add(portalGlow);

// -- side screens (gradient planes catching the light)
const sideGradMat = new THREE.MeshBasicMaterial({map:sideGradTex, color:0xdfe8e2, fog:false});
[-1,1].forEach(s=>{
  const p=new THREE.Mesh(new THREE.PlaneGeometry(120,17), sideGradMat);
  p.position.set(s*40,7.6,-2); p.rotation.y=-s*Math.PI/2; shed.add(p);
});

// -- low brick side walls + pilasters + coping
[-1,1].forEach(s=>{
  const wall=new THREE.Mesh(new THREE.BoxGeometry(1.1,3.3,Z_MAX-Z_MIN), brickMat);
  wall.position.set(s*(HALF_SPAN-0.45),1.65,(Z_MIN+Z_MAX)/2); wall.receiveShadow=true; wall.castShadow=true; shed.add(wall);
  const coping=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.22,Z_MAX-Z_MIN), cream);
  coping.position.set(s*(HALF_SPAN-0.45),3.42,(Z_MIN+Z_MAX)/2); shed.add(coping);
  for(let z=Z_MIN+2; z<=Z_MAX-2; z+=7.4){
    const pil=new THREE.Mesh(new THREE.BoxGeometry(1.5,3.6,0.9), brickMat);
    pil.position.set(s*(HALF_SPAN-0.42),1.8,z); pil.castShadow=true; shed.add(pil);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.24,1.1), cream);
    cap.position.set(s*(HALF_SPAN-0.42),3.68,z); shed.add(cap);
  }
});

/* -- cast-iron columns with ornate volute brackets (spring the arch) */
function makeColumn(){

const clocks=[];
function makeClockFace(r){

  const mkHand=(len,wid,mat)=>{ const p=new THREE.Group(); const h=new THREE.Mesh(new THREE.BoxGeometry(wid,len,0.02),mat); h.position.y=len/2-wid; p.add(h); g.add(p); return p; };
  const hour=mkHand(r*0.5,r*0.075,ironDark), minute=mkHand(r*0.74,r*0.055,ironDark);

}

smoke.mat=new THREE.ShaderMaterial({
  uniforms:{uMap:{value:softCircle}, uTint:{value:new THREE.Color(1,1,1)}},
  vertexShader:`attribute float aSize; attribute float aAlpha; attribute float aShade;
    varying float vA; varying float vS;
    void main(){ vA=aAlpha; vS=aShade;
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize = aSize*(340.0/max(1.0,-mv.z));
      gl_Position = projectionMatrix*mv; }`,
  fragmentShader:`uniform sampler2D uMap; uniform vec3 uTint; varying float vA; varying float vS;
    void main(){
      float d=length(gl_PointCoord-0.5)*2.0;
      float soft=smoothstep(1.0,0.12,d);
      vec3 steam=vec3(0.93,0.91,0.86); vec3 soot=vec3(0.16,0.15,0.14);
      vec3 col=mix(soot,steam,clamp(vS,0.0,1.0))*uTint;
      gl_FragColor=vec4(col, vA*soft); }`,

smoke.points=new THREE.Points(smoke.geo,smoke.mat); smoke.points.frustumCulled=false; smoke.points.renderOrder=8; scene.add(smoke.points);

function spawnSmoke(x,y,z,vx,vy,vz,life,size,alpha,shade){
  if(smoke.count>=SMOKE_CAP) return;
  const i=smoke.count++;
  smoke.px[i]=x;smoke.py[i]=y;smoke.pz[i]=z; smoke.vx[i]=vx;smoke.vy[i]=vy;smoke.vz[i]=vz;
  smoke.life[i]=life; smoke.maxLife[i]=life; smoke.size[i]=size; smoke.baseA[i]=alpha; smoke.shade[i]=shade; smoke.seed[i]=rng()*100;
}
function spawnAmbientHaze(){
  for(let i=0;i<1500;i++){
    const x=(rng()-0.5)*40, z=Z_MIN+rng()*(Z_MAX-Z_MIN);
    spawnSmoke(x, yRoof(x)-1-rng()*5, z, (rng()-0.5)*0.2, 0.04+rng()*0.05, (rng()-0.5)*0.2,
      22+rng()*10, 2.4+rng()*2.4, 0.14+rng()*0.08, 0.45+rng()*0.4);
  }
}
function updateSmoke(dt){
  let i=0;
  while(i<smoke.count){
    smoke.life[i]-=dt;
    if(smoke.life[i]<=0){
      const l=--smoke.count;
      smoke.px[i]=smoke.px[l];smoke.py[i]=smoke.py[l];smoke.pz[i]=smoke.pz[l];
      smoke.vx[i]=smoke.vx[l];smoke.vy[i]=smoke.vy[l];smoke.vz[i]=smoke.vz[l];
      smoke.life[i]=smoke.life[l];smoke.maxLife[i]=smoke.maxLife[l];
      smoke.size[i]=smoke.size[l];smoke.baseA[i]=smoke.baseA[l];smoke.shade[i]=smoke.shade[l];smoke.seed[i]=smoke.seed[l];
      continue;
    }
    const idx=i;
    // buoyancy fades with age; drag; gentle turbulence
    const lifeFrac=smoke.life[idx]/smoke.maxLife[idx];
    smoke.vy[idx]+= 0.5*lifeFrac*dt;
    const drag=1-0.62*dt;
    smoke.vx[idx]*=drag; smoke.vy[idx]*=(1-0.25*dt); smoke.vz[idx]*=drag;
    smoke.vx[idx]+=Math.sin(smoke.seed[idx]*12.9+performanceTime*0.6)*0.22*dt;
    smoke.vz[idx]+=Math.cos(smoke.seed[idx]*7.7+performanceTime*0.5)*0.22*dt;
    // roof pooling: hit the glass, spread outward and linger
    const yR=yRoof(smoke.px[idx])-0.55;
    if(smoke.py[idx]>yR){
      smoke.py[idx]=yR;
      if(smoke.vy[idx]>0) smoke.vy[idx]*=-0.08;
      const sx=Math.sign(smoke.px[idx])||(rng()<0.5?-1:1);
      smoke.vx[idx]+=sx*1.5*dt; smoke.vz[idx]+=(rng()-0.5)*0.8*dt;
      smoke.shade[idx]=Math.max(0,smoke.shade[idx]-0.05*dt);
    }
    smoke.px[idx]+=smoke.vx[idx]*dt; smoke.py[idx]+=smoke.vy[idx]*dt; smoke.pz[idx]+=smoke.vz[idx]*dt;
    i++;
  }
  // write attributes
  for(let k=0;k<smoke.count;k++){
    const lifeFrac=smoke.life[k]/smoke.maxLife[k];
    const grow=1+(1-lifeFrac)*2.3;
    smoke.aPos.setXYZ(k,smoke.px[k],smoke.py[k],smoke.pz[k]);
    smoke.aSize.setX(k,smoke.size[k]*grow);
    const fadeIn=clamp((smoke.maxLife[k]-smoke.life[k])/0.35,0,1);
    const fadeOut=clamp(lifeFrac/0.32,0,1);
    smoke.aAlpha.setX(k,smoke.baseA[k]*fadeIn*fadeOut);
    smoke.aShade.setX(k,smoke.shade[k]);
  }
  smoke.aPos.needsUpdate=true; smoke.aSize.needsUpdate=true; smoke.aAlpha.needsUpdate=true; smoke.aShade.needsUpdate=true;
  smoke.geo.setDrawRange(0,smoke.count);
}
// ---- sparks (additive)
const sparks={count:0};
sparks.px=new Float32Array(SPARK_CAP); sparks.py=new Float32Array(SPARK_CAP); sparks.pz=new Float32Array(SPARK_CAP);
sparks.vx=new Float32Array(SPARK_CAP); sparks.vy=new Float32Array(SPARK_CAP); sparks.vz=new Float32Array(SPARK_CAP);
sparks.life=new Float32Array(SPARK_CAP); sparks.maxLife=new Float32Array(SPARK_CAP); sparks.size=new Float32Array(SPARK_CAP);
sparks.geo=new THREE.BufferGeometry();
sparks.aPos=new THREE.BufferAttribute(new Float32Array(SPARK_CAP*3),3).setUsage(THREE.DynamicDrawUsage);
sparks.aSize=new THREE.BufferAttribute(new Float32Array(SPARK_CAP),1).setUsage(THREE.DynamicDrawUsage);
sparks.aHeat=new THREE.BufferAttribute(new Float32Array(SPARK_CAP),1).setUsage(THREE.DynamicDrawUsage);
sparks.geo.setAttribute('position',sparks.aPos); sparks.geo.setAttribute('aSize',sparks.aSize); sparks.geo.setAttribute('aHeat',sparks.aHeat);
sparks.mat=new THREE.ShaderMaterial({
  uniforms:{uMap:{value:sparkTex}},
  vertexShader:`attribute float aSize; attribute float aHeat; varying float vH;
    void main(){ vH=aHeat; vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aSize*(300.0/max(1.0,-mv.z)); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`uniform sampler2D uMap; varying float vH;
    void main(){ vec4 tex=texture2D(uMap,gl_PointCoord);
      vec3 col=mix(vec3(1.0,0.35,0.08),vec3(1.0,0.9,0.55),vH);
      gl_FragColor=vec4(col*tex.rgb*1.6, tex.a*vH); }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
sparks.points=new THREE.Points(sparks.geo,sparks.mat); sparks.points.frustumCulled=false; sparks.points.renderOrder=10; scene.add(sparks.points);
function spawnSpark(x,y,z,vx,vy,vz){
  if(sparks.count>=SPARK_CAP) return;
  const i=sparks.count++;
  sparks.px[i]=x;sparks.py[i]=y;sparks.pz[i]=z; sparks.vx[i]=vx;sparks.vy[i]=vy;sparks.vz[i]=vz;
  sparks.life[i]=0.5+rng()*0.7; sparks.maxLife[i]=sparks.life[i]; sparks.size[i]=0.28+rng()*0.3;
}
function updateSparks(dt){
  let i=0;
  while(i<sparks.count){
    sparks.life[i]-=dt;
    if(sparks.life[i]<=0 || sparks.py[i]<0.05){
      const l=--sparks.count;
      sparks.px[i]=sparks.px[l];sparks.py[i]=sparks.py[l];sparks.pz[i]=sparks.pz[l];
      sparks.vx[i]=sparks.vx[l];sparks.vy[i]=sparks.vy[l];sparks.vz[i]=sparks.vz[l];
      sparks.life[i]=sparks.life[l];sparks.maxLife[i]=sparks.maxLife[l];sparks.size[i]=sparks.size[l];
      continue;
    }
    sparks.vy[i]-=7.5*dt;
    sparks.px[i]+=sparks.vx[i]*dt; sparks.py[i]+=sparks.vy[i]*dt; sparks.pz[i]+=sparks.vz[i]*dt;
    i++;
  }
  for(let k=0;k<sparks.count;k++){
    sparks.aPos.setXYZ(k,sparks.px[k],sparks.py[k],sparks.pz[k]);
    sparks.aSize.setX(k,sparks.size[k]);
    sparks.aHeat.setX(k,clamp(sparks.life[k]/sparks.maxLife[k],0,1));
  }
  sparks.aPos.needsUpdate=true; sparks.aSize.needsUpdate=true; sparks.aHeat.needsUpdate=true;
  sparks.geo.setDrawRange(0,sparks.count);
}

/* ============================================================ SIMULATION STATE */
const SHOWCASE_DURATION=12.0;
let simTime=0, performanceTime=0;
let trainFrontZ=START_FRONT, trainV=15, wheelAngle=0, wheelAngVel=15/DRIVER_R;
let simState='arrive';          // arrive | stopped | slip | depart | gone
let stopTime=0, doorOpenTime=999, dispatchTime=0, goneTimer=0;
let doorAmount=0, doorTarget=0;
let slipGrip=0;                 // 0 slip … 1 grip
let chimneyAcc=0, cylAcc=0, sparkAcc=0, whistleFlash=0;
let eveningT=0, eveningTarget=0;
let disembarkedCount=0;
let cacheT=0;
let cabView=false, showcaseMode=false, recording=false;

const lampGlassBase=[];
lampGlass.forEach(m=>lampGlassBase.push(m));

function resetSim(preserveEvening){
  simTime=0; performanceTime=0;
  trainFrontZ=START_FRONT; trainV=15; wheelAngle=0; wheelAngVel=15/DRIVER_R;
  simState='arrive'; stopTime=0; doorOpenTime=999; dispatchTime=0; goneTimer=0;
  doorAmount=0; doorTarget=0; slipGrip=0;
  chimneyAcc=0; cylAcc=0; sparkAcc=0; whistleFlash=0; disembarkedCount=0;
  if(!preserveEvening){ eveningT=0; eveningTarget=0; }
  smoke.count=0; sparks.count=0; rng=mulberry32(20240613);
  spawnAmbientHaze();
  carts.forEach(c=>{ c.wheelRot=0; });
  trainGroup.position.z=trainFrontZ;
  cacheT=0;
}
function dispatchTrain(){
  if(simState!=='stopped') return;
  simState='slip'; dispatchTime=simTime; doorTarget=0; slipGrip=0;
}
function toggleEvening(){
  if(showcaseMode) return;
  eveningTarget = eveningTarget>0.5 ? 0 : 1;
}

const A_BRAKE=2.6, V0=15, COAST_END=1.2;
const CHIMNEY_LOCAL=new THREE.Vector3(0,4.5,-1.95);
const CYL_LOCAL_X=1.15, CYL_LOCAL_Y=1.02, CYL_LOCAL_Z=-1.35;
const DRIVER_LOCAL=[-4.9,-6.75];

function stepSim(dt){
  simTime+=dt; performanceTime+=dt;
  // ---- showcase forces gaslight around t=8
  if(showcaseMode) eveningTarget = (simTime>=8.0)?1:0;
  eveningT += clamp(eveningTarget-eveningT, -dt*0.55, dt*0.55);

  // ---- longitudinal train physics
  const prevZ=trainFrontZ;
  if(simState==='arrive'){
    if(simTime>COAST_END) trainV=Math.max(0, trainV - A_BRAKE*dt);
    trainFrontZ += trainV*dt;
    wheelAngVel = trainV/DRIVER_R;
    if(trainV<=0 && simTime>COAST_END){
      trainV=0; simState='stopped'; stopTime=simTime; doorOpenTime=simTime+0.75; doorTarget=0;
    }
  } else if(simState==='stopped'){
    doorTarget = (simTime>=doorOpenTime)?1:0;
    wheelAngVel=0;
  } else if(simState==='slip'){
    // wheels spin freely, train barely creeps; steam blow-off; then grip
    slipGrip=clamp((simTime-dispatchTime)/1.9, 0, 1);
    wheelAngVel = lerp(15, 2.4, easeSmoother(slipGrip));
    trainV = -lerp(0.35, 1.5, easeSmoother(slipGrip)); // creep backward out of the shed
    trainFrontZ += trainV*dt;
    if(slipGrip>=1){ simState='depart'; }
  } else if(simState==='depart'){
    slipGrip=1;
    trainV = Math.max(-9.5, trainV - 1.9*dt);
    trainFrontZ += trainV*dt;
    wheelAngVel = -trainV/DRIVER_R;
    if(trainFrontZ < Z_MIN-75){ simState='gone'; goneTimer=0; }
  } else if(simState==='gone'){
    goneTimer+=dt; wheelAngVel=0; trainV=0;
    if(goneTimer>8 && !showcaseMode) resetSim(true);
  }
  wheelAngle += wheelAngVel*dt;

  // doors: open slowly after stop, slam shut on dispatch
  const rate = (doorTarget>doorAmount) ? 0.85 : 1.6;
  doorAmount += clamp(doorTarget-doorAmount, -rate*dt, rate*dt);
  doorAmount = clamp(doorAmount,0,1);
  for(const d of doorPivots){
    const p=sstep(d.stagger, d.stagger+0.75, doorAmount*1.55);
    d.pivot.rotation.y = -d.side * p * 1.62;
  }

  // ---- emissions
  const vAbs=Math.abs(trainV);
  let chimRate=0;
  if(simState==='arrive') chimRate = simTime<COAST_END ? 340 : (trainV>0.5? 560 : 0);
  else if(simState==='stopped') chimRate=150;
  else if(simState==='slip') chimRate=1900;
  else if(simState==='depart') chimRate=640;
  chimneyAcc+=chimRate*dt;
  while(chimneyAcc>=1){
    chimneyAcc-=1;
    const soot = simState==='depart'? 0.15 : (simState==='arrive' && simTime>COAST_END ? 0.38 : 0.22);
    const shade = rng()<soot ? (0.08+rng()*0.25) : (0.72+rng()*0.3);
    spawnSmoke(trainFrontZ*0+ (rng()-0.5)*0.24, CHIMNEY_LOCAL.y, trainFrontZ+CHIMNEY_LOCAL.z+(rng()-0.5)*0.24,
      (rng()-0.5)*0.7, 2.6+rng()*1.4+(simState==='slip'?1.6:0), trainV*0.55+(rng()-0.5)*0.7,
      9+rng()*7, 0.55+rng()*0.5+(simState==='slip'?0.35:0), 0.5+rng()*0.15, shade);
  }
  // cylinder drains / blow-off at the slip
  let cylRate=0;
  if(simState==='slip') cylRate=1750;
  else if(simState==='stopped') cylRate=26;
  cylAcc+=cylRate*dt;
  while(cylAcc>=1){
    cylAcc-=1;
    const s=rng()<0.5?-1:1;
    spawnSmoke(s*CYL_LOCAL_X, CYL_LOCAL_Y+rng()*0.3, trainFrontZ+CYL_LOCAL_Z+(rng()-0.5)*0.4,
      s*(2.6+rng()*1.8), 0.7+rng()*0.9, -1.6-rng()*1.2+trainV*0.4,
      2.0+rng()*1.4, 0.42+rng()*0.3, 0.6+rng()*0.18, 0.88+rng()*0.12);
  }
  // brake / slip sparks at driver tyres
  let sparkRate=0;
  if(simState==='arrive' && simTime>COAST_END && trainV>1.5) sparkRate=170;
  else if(simState==='slip') sparkRate=280;
  sparkAcc+=sparkRate*dt;
  while(sparkAcc>=1){
    sparkAcc-=1;
    const s=rng()<0.5?-1:1;
    const dz=DRIVER_LOCAL[rng()<0.5?0:1];
    spawnSpark(s*0.8, 0.16, trainFrontZ+dz+(rng()-0.5)*0.3,
      s*(0.6+rng()*1.6), 1.4+rng()*2.4, -(3.5+rng()*4.5)+trainV*0.5);
  }
  updateSmoke(dt); updateSparks(dt);

  // ---- passengers disembarking (pure function of simTime)
  const t0=doorOpenTime;
  disembarkedCount=0;
  for(const p of passengers){
    const tA=t0+0.12+p.delay, el=simTime-tA;
    const fx=p.side; // +1 right platform, -1 left
    const doorWorldZ=trainFrontZ + (coachCenterLocal(p.coachIdx)) + p.door;
    let px,py,pz,rotY,swing=0,visible=true;
    if(el<0){ px=fx*1.34; py=1.35; pz=doorWorldZ; rotY=fx>0?Math.PI/2:-Math.PI/2; }
    else if(el<0.7){ const u=el/0.7; px=lerp(fx*1.34,fx*1.58,u); py=lerp(1.35,1.05,u); pz=doorWorldZ; rotY=fx>0?Math.PI/2:-Math.PI/2; }
    else if(el<2.0){ const u=(el-0.7)/1.3; const e=u*u*(3-2*u); px=lerp(fx*1.58,fx*3.05,e); py=1.05; pz=doorWorldZ; rotY=fx>0?Math.PI/2:-Math.PI/2; swing=Math.sin(el*9+p.phase)*0.55; disembarkedCount++; }
    else {
      const d=(el-2.0)*p.speed;
      px=fx*(3.05+0.25*Math.sin(p.phase)); py=1.05; pz=doorWorldZ + p.dir*d;
      rotY=p.dir>0?0:Math.PI; swing=Math.sin(el*4.6*p.speed+p.phase)*0.62;
      if(Math.abs(pz)>46) visible=false;
      disembarkedCount++;
    }
    const bob=Math.abs(Math.sin(el*4.6*p.speed+p.phase))*0.045*(el>0.7?1:0);
    p.fig.group.visible=visible;
    if(visible){
      p.fig.group.position.set(px,py+bob,pz);
      p.fig.group.rotation.y=rotY;
      if(p.fig.legL && p.fig.legL.isGroup!==false){ p.fig.legL.rotation.x=swing; p.fig.legR.rotation.x=-swing; }
    }
  }

  // ---- porters shunting luggage carts (ping-pong along platforms)
  for(const c of carts){
    const z=c.z0 + c.amp*Math.sin((simTime+c.phase)*c.w*Math.PI*0.5);
    const dz=z-c.group.position.z;
    c.wheelRot -= dz/0.26;
    c.group.position.z=z;
    c.group.rotation.y = Math.cos((simTime+c.phase)*c.w*Math.PI*0.5) >= 0 ? 0 : Math.PI;
    c.wheels.forEach(w=>{ w.rotation.x=c.wheelRot; });
    // porter pushes from behind
    const back=(Math.cos((simTime+c.phase)*c.w*Math.PI*0.5) >= 0)?1:-1;
    c.porter.group.position.set(c.x, 1.05+Math.abs(Math.sin(simTime*6+c.phase))*0.025, z - back*1.75);
    c.porter.group.rotation.y = back>0 ? 0 : Math.PI;
    c.porter.group.rotation.x = 0.16; // lean into the push
    c.porter.legL.rotation.x = Math.sin(simTime*6+c.phase)*0.5;
    c.porter.legR.rotation.x = -Math.sin(simTime*6+c.phase)*0.5;
  }

  // ---- clock hands (station time 16:41 + elapsed)
  const baseSecs=16*3600+41*60+20+simTime;
  for(const c of clocks){
    c.second.rotation.z=-(baseSecs%60)/60*Math.PI*2;
    c.minute.rotation.z=-((baseSecs/60)%60)/60*Math.PI*2;
    c.hour.rotation.z=-((baseSecs/3600)%12)/12*Math.PI*2;
  }

  // ---- drive train group + rods + wheels
  trainGroup.position.z=trainFrontZ;
  for(const w of driverWheels){ w.mesh.rotation.x = w.bogie ? wheelAngle*(DRIVER_R/w.r) : wheelAngle; }
  updateRods(wheelAngle);
}

/* ============================================================ EVENING / LIGHTING BLEND */
const fogA=new THREE.Color(0x9fb4b2), fogE=new THREE.Color(0x141d27);
const bgA=new THREE.Color(0x8fa3a0), bgE=new THREE.Color(0x0b1018);
const sunA=new THREE.Color(0xffe8c4), sunE=new THREE.Color(0xff8f4d);
const hemiSkyA=new THREE.Color(0xbfd6dd), hemiSkyE=new THREE.Color(0x2c3e52);
const hemiGndA=new THREE.Color(0x4a4036), hemiGndE=new THREE.Color(0x1a1611);
const portalA=new THREE.Color(0xffffff), portalE=new THREE.Color(0xff9d55);
const sunPosA=new THREE.Vector3(14,30,-6), sunPosE=new THREE.Vector3(-7,10.5,-46);
function applyLighting(){
  const t=eveningT;
  scene.fog.color.lerpColors(fogA,fogE,t);
  scene.background.lerpColors(bgA,bgE,t);
  sun.color.lerpColors(sunA,sunE,t);
  sun.intensity=lerp(2.7,0.55,t);
  sun.position.lerpVectors(sunPosA,sunPosE,t);
  hemi.color.lerpColors(hemiSkyA,hemiSkyE,t);
  hemi.groundColor.lerpColors(hemiGndA,hemiGndE,t);
  hemi.intensity=lerp(0.62,0.36,t);
  bounce.intensity=lerp(0.5,0.18,t);
  portalGlow.material.color.lerpColors(portalA,portalE,t);
  sideGradMat.color.lerpColors(new THREE.Color(0xdfe8e2), new THREE.Color(0x1c242e), t);
  for(const s of shafts) s.material.opacity=lerp(0.34,0.10,t)*(s.material.userData.k||1);
  dust.mat.opacity=lerp(0.7,0.25,t);
  for(const L of lampLights) L.intensity=t*30;
  for(const g of lampGlows) g.opacity=t*0.85;
  for(const m of lampGlass){ m.emissiveIntensity=lerp(0.18,2.6,t); }
  winMat.emissiveIntensity=t*1.9;
  for(const m of headlampMats) m.emissiveIntensity=lerp(0.4,2.4,t);
  bloom.strength=lerp(0.32,0.55,t);
  renderer.toneMappingExposure=lerp(1.12,1.0,t);
}

/* ============================================================ SHOWCASE CAMERA */
const camKeys=[
  {t:0.0, p:[6.4,3.4,-12.2],  l:[0,2.7,3.0]},
  {t:2.6, p:[9.5,2.05,5.0],   l:[0,1.8,11.0]},
  {t:4.4, p:[5.0,1.7,23.6],   l:[0,1.5,30.8]},
  {t:6.9, p:[-8.1,5.7,8.6],   l:[0,2.4,16.5]},
  {t:8.5, p:[6.8,1.95,2.6],   l:[0,1.65,8.4]},
  {t:10.3,p:[-7.6,2.7,26.2],  l:[0,2.5,34.2]},
  {t:12.0,p:[11.8,6.6,-13.0], l:[0,3.0,8.0]}
];
const _v1=new THREE.Vector3(), _v2=new THREE.Vector3();
function showcaseCam(t){
  let i=0; while(i<camKeys.length-2 && t>camKeys[i+1].t) i++;
  const a=camKeys[i], b=camKeys[i+1];
  const u=easeSmoother(clamp((t-a.t)/(b.t-a.t),0,1));
  _v1.set(lerp(a.p[0],b.p[0],u),lerp(a.p[1],b.p[1],u),lerp(a.p[2],b.p[2],u));
  _v2.set(lerp(a.l[0],b.l[0],u),lerp(a.l[1],b.l[1],u),lerp(a.l[2],b.l[2],u));
  camera.position.copy(_v1);
  camera.lookAt(_v2);
  controls.target.copy(_v2);
}
function seek(t){
  t=clamp(t,0,SHOWCASE_DURATION);
  if(t<cacheT){ resetSim(false); }
  const DT=1/60;
  while(cacheT+DT<=t+1e-9){ stepSim(DT); cacheT+=DT; }
  showcaseCam(t);
  applyLighting();
  updateBench();
  composer.render();
}
function updateBench(){
  window.__bench.trainSpeed=Math.abs(trainV);
  window.__bench.steamParticles=smoke.count;
  window.__bench.passengers=disembarkedCount;
  window.__bench.wheelAngle=wheelAngle;
}
window.__bench={trainSpeed:0,steamParticles:0,passengers:0,wheelAngle:0};
window.showcase={ duration:SHOWCASE_DURATION, seek };

/* ============================================================ DEFAULT CAMERA */
function resetCamera(){
  camera.position.set(14,6.2,-30);
  controls.target.set(0,2.6,2);
  controls.update();
}

/* ============================================================ MAIN LOOP */
const clock=new THREE.Clock();
resetSim(false);
resetCamera();
applyLighting();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!recording){
    stepSim(dt);
    // showcase auto-dispatch beat
    if(showcaseMode && simState==='stopped' && simTime>=10.55) dispatchTrain();
    applyLighting();
    if(cabView){
      const bob=Math.sin(wheelAngle*2)*0.018 + (simState==='arrive'?Math.sin(performanceTime*23)*0.008*Math.min(1,Math.abs(trainV)/8):0);
      camera.position.set(0.55,3.32+bob,trainFrontZ-8.35);
      camera.lookAt(0.25,2.35+bob*0.5,trainFrontZ+9);
      controls.target.set(0.25,2.35,trainFrontZ+9);
    } else if(!showcaseMode){
      controls.update();
    } else {
      showcaseCam(simTime);
    }
    updateBench();
  }
  composer.render();
}
animate();

/* ============================================================ RECORD BUTTON */
const recordBtn=document.getElementById('recordBtn');
const originalBtn=recordBtn.textContent;
recordBtn.addEventListener('click',()=>{
  if(recording) return;
  recording=true; showcaseMode=true;
  controls.enabled=false; cabView=false;
  resetSim(false);
  const fps=30, frames=Math.round(SHOWCASE_DURATION*fps);
  let stream; try{ stream=renderer.domElement.captureStream(0); }catch(err){ recording=false; showcaseMode=false; controls.enabled=true; return; }
  let mime='video/webm;codecs=vp9';
  if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
  const rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:12000000});
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='marchwood-terminus-showcase.webm'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    recording=false; showcaseMode=false; controls.enabled=true;
    resetSim(false); resetCamera(); applyLighting();
    recordBtn.textContent=originalBtn; recordBtn.disabled=false;
  };
  rec.start(200);
  recordBtn.textContent='● Recording showcase…'; recordBtn.disabled=true;
  const track=stream.getVideoTracks()[0];
  let i=0;
  const stepFrame=()=>{
    if(i>frames){ try{rec.stop();}catch(_){} return; }
    seek(i/fps);
    if(track.requestFrame) track.requestFrame();
    i++;
    setTimeout(stepFrame, 1000/fps);
  };
  stepFrame();
});
</script>

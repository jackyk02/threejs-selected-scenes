<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weihnachtsmarkt — Winter Christmas Market at Night</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0d1524; height:100%;
               font-family: Georgia, 'Times New Roman', serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  #ui {
    position:fixed; top:14px; left:18px; z-index:10; color:#f3e6c8;
    pointer-events:none; text-shadow:0 2px 8px #000;
  }
  #ui h1 { margin:0; font-size:22px; letter-spacing:2px; font-weight:normal;
           font-variant: small-caps; color:#ffd98a; }
  #ui p  { margin:4px 0 0; font-size:12px; opacity:.85; letter-spacing:.4px; }
  #ui b  { color:#ffe9b0; }

  #recBtn {
    position:fixed; top:14px; right:18px; z-index:10;
    background: linear-gradient(#8a2f23,#5e1d14);
    color:#ffe1b0; border:1px solid #d9a45b; border-radius:6px;
    padding:10px 18px; font-family:Georgia,serif; font-size:14px;
    letter-spacing:1px; cursor:pointer;
    box-shadow:0 0 14px rgba(255,180,90,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s, box-shadow .15s;
  }
  #recBtn:hover { transform:translateY(-1px); box-shadow:0 0 22px rgba(255,190,100,.55); }
  #recBtn:disabled { opacity:.6; cursor:default; }

  #patternToast {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    color:#ffe9b0; background:rgba(20,14,8,.72); border:1px solid rgba(255,217,138,.4);
    padding:6px 18px; border-radius:20px; font-size:13px; letter-spacing:1px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:10;
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="ui">
  <h1>Weihnachtsmarkt</h1>
  <p><b>Space</b> carousel &nbsp;·&nbsp; <b>L</b> light pattern &nbsp;·&nbsp; <b>↑ / ↓</b> snowfall &nbsp;·&nbsp; drag to orbit, wheel to zoom</p>
</div>
<button id="recBtn">⏺&nbsp; Record showcase (.webm)</button>

<!-- ============ THREE.js r128 + OrbitControls + postprocessing (CDN) ============ -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* ================================================================
   WEIHNACHTSMARKT — a winter Christmas market town square at night
   All geometry & textures are built procedurally. No external assets.
   ================================================================ */
'use strict';

// ---------- deterministic-ish helpers ----------
const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth= t => t * t * (3 - 2 * t);
const TAU = Math.PI * 2;

// ---------- top-level scene handles (required) ----------
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x0d1524);
scene.fog        = new THREE.FogExp2(0x0d1524, 0.0115);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
camera.position.set(17, 9, 19);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.outputEncoding    = THREE.sRGBEncoding;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 44;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------- post-processing : bloom ----------
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.65, 0.72);
composer.addPass(bloom);

/* ================================================================
   PROCEDURAL CANVAS TEXTURES
   ================================================================ */
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  return t;
}
const softDotTex = makeCanvas(64, 64, ctx => {
  const g = ctx.createRadialGradient(32,32,2, 32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.4,'rgba(255,255,255,.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
});
const woodTex = makeCanvas(256, 256, (ctx,w,h) => {
  ctx.fillStyle = '#5d4128'; ctx.fillRect(0,0,w,h);
  for (let p = 0; p < 8; p++) {
    ctx.fillStyle = p % 2 ? '#634631' : '#563c26';
    ctx.fillRect(0, p*32, w, 32);
    ctx.fillStyle = 'rgba(30,18,8,.8)'; ctx.fillRect(0, p*32, w, 2);
    for (let i = 0; i < 26; i++) {
      ctx.strokeStyle = `rgba(${rand(20,60)|0},${rand(12,35)|0},10,${rand(.15,.4)})`;
      ctx.lineWidth = rand(.5,1.6); ctx.beginPath();
      const y = p*32 + rand(4,28); ctx.moveTo(0,y);
      ctx.bezierCurveTo(w*.3, y+rand(-3,3), w*.7, y+rand(-3,3), w, y); ctx.stroke();
    }
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;

const groundTex = makeCanvas(2048, 2048, (ctx,w,h) => {
  // base snow
  const g = ctx.createRadialGradient(w/2,h/2,80, w/2,h/2,w*.75);
  g.addColorStop(0,'#e9edf3'); g.addColorStop(.55,'#dfe5ec'); g.addColorStop(1,'#c9d2dd');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  // sparkle noise
  for (let i=0;i<14000;i++){
    ctx.fillStyle = `rgba(${Math.random()<.5?255:170},${Math.random()<.5?255:180},255,${rand(.05,.35)})`;
    ctx.fillRect(rand(0,w), rand(0,h), rand(1,2.4), rand(1,2.4));
  }
  const cx = w/2, cy = h/2, pxPerM = w / 116; // ground plane 116m
  // trampled centre
  ctx.fillStyle = 'rgba(96,84,70,.16)';
  ctx.beginPath(); ctx.ellipse(cx, cy, 13*pxPerM, 13*pxPerM, 0, 0, TAU); ctx.fill();
  // walking loop strokes (match visitor routes)
  ctx.strokeStyle = 'rgba(92,80,66,.22)'; ctx.lineCap = 'round';
  ctx.lineWidth = 1.7*pxPerM;
  ctx.beginPath(); ctx.ellipse(cx, cy, 11.5*pxPerM, 8*pxPerM, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 9*pxPerM, 0, TAU); ctx.stroke();
  // carousel trample
  const carX = cx + 6.5*pxPerM, carY = cy - 2.5*pxPerM;
  ctx.fillStyle = 'rgba(92,80,66,.3)';
  ctx.beginPath(); ctx.arc(carX, carY, 5.6*pxPerM, 0, TAU); ctx.fill();
  // footprints (pairs of ovals along the loops)
  function printRow(rx, ry, count, rotAmp) {
    for (let i=0;i<count;i++){
      const a = (i/count)*TAU + rand(-.04,.04);
      const px = cx + Math.cos(a)*rx, py = cy + Math.sin(a)*ry;
      const tang = Math.atan2(Math.cos(a)*ry, -Math.sin(a)*rx) + Math.PI/2;
      for (const s of [-1,1]) {
        const off = s * 5;
        const nx = Math.cos(a), ny = Math.sin(a);
        ctx.save();
        ctx.translate(px + nx*off, py + ny*off);
        ctx.rotate(tang + rand(-.25,.25));
        ctx.fillStyle = 'rgba(58,50,44,.55)';
        ctx.beginPath(); ctx.ellipse(0, 0, 3.4, 9, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  }
  printRow(9*pxPerM, 9*pxPerM, 130);
  printRow(11.5*pxPerM, 8*pxPerM, 110);
  // tree-ward scuff
  ctx.strokeStyle='rgba(92,80,66,.25)'; ctx.lineWidth=2.2*pxPerM;
  ctx.beginPath(); ctx.moveTo(cx-5.5*pxPerM, cy+2.5*pxPerM); ctx.lineTo(cx+2*pxPerM, cy); ctx.stroke();
});

function windowsTex(variant) {
  return makeCanvas(256, 256, (ctx,w,h) => {
    ctx.fillStyle = '#05070c'; ctx.fillRect(0,0,w,h);
    const cols = 4, rows = 6, ww = 34, wh = 24, gx = (w - cols*ww)/(cols+1), gy = (h - rows*wh)/(rows+1);
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
      const lit = Math.random() < (variant ? 0.62 : 0.45);
      if (lit) {
        const warm = pick(['#ffd489','#ffc06a','#fff0b8','#ffab52']);
        ctx.fillStyle = warm;
        ctx.shadowColor = warm; ctx.shadowBlur = 12;
        ctx.fillRect(gx + c*(ww+gx), gy + r*(wh+gy), ww, wh);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(120,70,20,.9)';
        ctx.fillRect(gx + c*(ww+gx) + ww/2 - 1.5, gy + r*(wh+gy), 3, wh);
        ctx.fillRect(gx + c*(ww+gx), gy + r*(wh+gy) + wh/2 - 1.5, ww, 3);
      } else {
        ctx.fillStyle = '#121a28'; ctx.fillRect(gx + c*(ww+gx), gy + r*(wh+gy), ww, wh);
      }
    }
  });
}
const winTexA = windowsTex(0), winTexB = windowsTex(1);

const stripeTexRed = makeCanvas(512, 128, (ctx,w,h) => {
  const n = 16, sw = w/n;
  for (let i=0;i<n;i++){
    ctx.fillStyle = i%2 ? '#e8dcc4' : '#a83a30';
    ctx.fillRect(i*sw, 0, sw, h);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(i*sw, h*.72, sw, h*.28);
  }
});
stripeTexRed.wrapS = stripeTexRed.wrapT = THREE.RepeatWrapping;

const mirrorTex = makeCanvas(256, 256, (ctx,w,h) => {
  const panels = 6, pw = w/panels;
  for (let i=0;i<panels;i++){
    const g = ctx.createLinearGradient(i*pw, 0, (i+1)*pw, 0);
    g.addColorStop(0,'#3a2c14'); g.addColorStop(.28,'#d8c88f'); g.addColorStop(.42,'#fff8dc');
    g.addColorStop(.58,'#8f7c46'); g.addColorStop(1,'#2c2210');
    ctx.fillStyle = g; ctx.fillRect(i*pw, 0, pw, h);
    ctx.fillStyle = '#1c140a'; ctx.fillRect(i*pw, 0, 2, h);
  }
});
mirrorTex.wrapS = mirrorTex.wrapT = THREE.RepeatWrapping;
mirrorTex.repeat.set(2, 1);

const clockTex = makeCanvas(128, 128, ctx => {
  ctx.fillStyle = '#101820'; ctx.beginPath(); ctx.arc(64,64,62,0,TAU); ctx.fill();
  ctx.fillStyle = '#f4e9c8'; ctx.beginPath(); ctx.arc(64,64,52,0,TAU); ctx.fill();
  ctx.strokeStyle = '#2a2015'; ctx.lineWidth = 4;
  for (let i=0;i<12;i++){
    const a = i/12*TAU;
    ctx.beginPath();
    ctx.moveTo(64+Math.cos(a)*42, 64+Math.sin(a)*42);
    ctx.lineTo(64+Math.cos(a)*48, 64+Math.sin(a)*48);
    ctx.stroke();
  }
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(64,64); ctx.lineTo(64+18, 64-22); ctx.stroke(); // hour
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(64,64); ctx.lineTo(64-8, 64-40); ctx.stroke();   // minute ~ 11:55
  ctx.fillStyle = '#2a2015'; ctx.beginPath(); ctx.arc(64,64,4,0,TAU); ctx.fill();
});

function makeSignTex(text, accent) {
  return makeCanvas(512, 128, (ctx,w,h) => {
    ctx.fillStyle = '#241610'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = accent; ctx.lineWidth = 8; ctx.strokeRect(8,8,w-16,h-16);
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.strokeRect(16,16,w-32,h-32);
    ctx.fillStyle = '#ffd98a';
    ctx.font = 'bold 44px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff9d2e'; ctx.shadowBlur = 14;
    ctx.fillText(text, w/2, h/2 + 2);
  });
}

/* ================================================================
   LIGHTING
   ================================================================ */
scene.add(new THREE.HemisphereLight(0x35486e, 0x191009, 0.75));
const moonLight = new THREE.DirectionalLight(0xa9c0e8, 0.55);
moonLight.position.set(-28, 34, -18);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(4096, 4096);
moonLight.shadow.camera.left = -34; moonLight.shadow.camera.right = 34;
moonLight.shadow.camera.top  =  34; moonLight.shadow.camera.bottom = -34;
moonLight.shadow.camera.far  = 90;
moonLight.shadow.bias = -0.0004;
moonLight.shadow.radius = 4;
scene.add(moonLight);
const warmBounce = new THREE.AmbientLight(0x40301e, 0.5);
scene.add(warmBounce);

/* ================================================================
   SHARED GEOMETRY / MATERIALS
   ================================================================ */
const G = {
  postCyl:   new THREE.CylinderGeometry(0.09, 0.1, 2.3, 8),
  counterTop:new THREE.BoxGeometry(3.0, 0.12, 0.66),
  counterFront: new THREE.BoxGeometry(3.0, 0.95, 0.09),
  sideWall:  new THREE.BoxGeometry(0.09, 1.55, 1.8),
  backWall:  new THREE.BoxGeometry(2.75, 2.0, 0.09),
  shelf:     new THREE.BoxGeometry(2.4, 0.07, 0.34),
  slab:      new THREE.BoxGeometry(3.55, 0.09, 1.38),
  snowSlab:  new THREE.BoxGeometry(3.62, 0.08, 1.3),
  ridgeSnow: new THREE.CylinderGeometry(0.13, 0.13, 3.6, 8),
  sign:      new THREE.BoxGeometry(2.25, 0.46, 0.07),
  lantern:   new THREE.BoxGeometry(0.22, 0.3, 0.22),
  apple:     new THREE.SphereGeometry(0.09, 10, 8),
  mug:       new THREE.CylinderGeometry(0.06, 0.05, 0.13, 8),
  gift:      new THREE.BoxGeometry(0.18, 0.16, 0.18),
  crate:     new THREE.BoxGeometry(0.5, 0.3, 0.38),
  sphereHi:  new THREE.SphereGeometry(0.11, 10, 8),
  coneGood:  new THREE.ConeGeometry(0.1, 0.3, 8)
};
const M = {
  wood:      new THREE.MeshLambertMaterial({ map: woodTex, color: 0xb99672 }),
  woodDark:  new THREE.MeshLambertMaterial({ map: woodTex, color: 0x8a6b4d }),
  snow:      new THREE.MeshLambertMaterial({ color: 0xeef2f8, emissive: 0x1c2430, emissiveIntensity: 0.35 }),
  roofRed:   new THREE.MeshLambertMaterial({ color: 0x6e3226 }),
  roofGreen: new THREE.MeshLambertMaterial({ color: 0x2e4034 }),
  roofBrown: new THREE.MeshLambertMaterial({ color: 0x4a3320 }),
  gold:      new THREE.MeshStandardMaterial({ color: 0xd8b25a, metalness: 0.85, roughness: 0.3, emissive: 0x332200, emissiveIntensity: 0.4 }),
  darkIron:  new THREE.MeshStandardMaterial({ color: 0x23262c, metalness: 0.7, roughness: 0.5 }),
  lantern:   new THREE.MeshBasicMaterial({ color: 0xffd27a }),
  pine:      new THREE.MeshStandardMaterial({ color: 0x182c1e, roughness: 0.9, flatShading: true }),
  trunk:     new THREE.MeshLambertMaterial({ color: 0x3a2716 })
};
function addMesh(parent, geo, mat, x, y, z, opts) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (opts) {
    if (opts.rx) m.rotation.x = opts.rx;
    if (opts.ry) m.rotation.y = opts.ry;
    if (opts.rz) m.rotation.z = opts.rz;
    if (opts.sx || opts.sy || opts.sz) m.scale.set(opts.sx||1, opts.sy||1, opts.sz||1);
    if (opts.shadow === false) { m.castShadow = false; } else { m.castShadow = true; m.receiveShadow = true; }
  }
  parent.add(m);
  return m;
}

/* ================================================================
   GROUND  (snow + footprints)
   ================================================================ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(58, 56),
  new THREE.MeshLambertMaterial({ map: groundTex, color: 0xffffff })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ================================================================
   STALLS — 18 of them, snow-capped peaked roofs, goods, signs, lights
   ================================================================ */
const TREE_POS = new THREE.Vector3(-5.5, 0, -2.5);
const CAROUSEL_POS = new THREE.Vector3(6.5, 0, 2.5);
const STALL_R = 14.5;

const STALL_DEFS = [
  { name:'GLÜHWEIN',     accent:'#c0392b', goods:'mugs'   },
  { name:'LEBKUCHEN',    accent:'#d4a017', goods:'gifts'  },
  { name:'KÄSE & WURST', accent:'#c0392b', goods:'spheres'},
  { name:'WAFFELN',      accent:'#d4a017', goods:'cones'  },
  { name:'PUNSCH',       accent:'#b03a5b', goods:'mugs'   },
  { name:'HANDWERK',     accent:'#3a7bd5', goods:'gifts'  },
  { name:'SPIELZEUG',    accent:'#2ea85e', goods:'cones'  },
  { name:'KERZEN',       accent:'#e0c060', goods:'cones'  },
  { name:'HONIG & TEE',  accent:'#d4a017', goods:'mugs'   },
  { name:'MARONEN',      accent:'#c0392b', goods:'spheres'},
  { name:'SÜSSWAREN',    accent:'#b03a5b', goods:'gifts'  },
  { name:'GESCHENKE',    accent:'#3a7bd5', goods:'gifts'  },
  { name:'PLÜSCHTIERE',  accent:'#2ea85e', goods:'spheres'},
  { name:'IMBISS',       accent:'#c0392b', goods:'spheres'},
  { name:'TEEWURST',     accent:'#d4a017', goods:'mugs'   },
  { name:'Nüsse & FRÜCHTE', accent:'#b03a5b', goods:'spheres'},
  { name:'WEIHNACHTSBIER', accent:'#3a7bd5', goods:'mugs' },
  { name:'KLEINÖDFIGUREN', accent:'#2ea85e', goods:'cones'}
];
const stallAnchors = [];   // [{pos, roofY, angle}]

function buildGoods(group, kind) {
  const goodsMats = [
    new THREE.MeshStandardMaterial({ color: 0xc23a2e, roughness: .35 }),
    new THREE.MeshStandardMaterial({ color: 0xd8832e, roughness: .35 }),
    new THREE.MeshStandardMaterial({ color: 0x8a1f2e, roughness: .3 }),
    new THREE.MeshStandardMaterial({ color: 0x3f7bd0, roughness: .35 }),
    new THREE.MeshStandardMaterial({ color: 0x2ea85e, roughness: .35 }),
    new THREE.MeshStandardMaterial({ color: 0xe8dcc4, roughness: .5 }),
    new THREE.MeshStandardMaterial({ color: 0xd4a017, roughness: .25, metalness: .6 })
  ];
  // counter display
  for (let i = 0; i < 8; i++) {
    const x = -1.15 + i * 0.33 + rand(-0.05, 0.05);
    const z = rand(-0.05, 0.18);
    let m;
    if (kind === 'mugs')         m = addMesh(group, G.mug,   pick(goodsMats), x, 1.18, z);
    else if (kind === 'gifts')   m = addMesh(group, G.gift,  pick(goodsMats), x, 1.19, z, { ry: rand(0, TAU) });
    else if (kind === 'cones')   m = addMesh(group, G.coneGood, pick(goodsMats), x, 1.24, z);
    else                         m = addMesh(group, G.apple, pick(goodsMats), x, 1.17, z);
  }
  // shelf display
  for (let i = 0; i < 7; i++) {
    const x = -1.0 + i * 0.34 + rand(-0.05, 0.05);
    const m = addMesh(group,
      kind === 'mugs' ? G.mug : (kind === 'gifts' ? G.gift : G.sphereHi),
      pick(goodsMats), x, 1.62, -0.68, { ry: rand(0, TAU) });
  }
  // crates beside counter
  for (let i = 0; i < 3; i++) {
    addMesh(group, G.crate, M.woodDark, -1.0 + i*1.0 + rand(-.1,.1), 0.15, 0.95, { ry: rand(-.3,.3) });
    addMesh(group, G.apple, pick(goodsMats), -1.0 + i*1.0, 0.36, 0.95);
    if (Math.random() < .6) addMesh(group, G.apple, pick(goodsMats), -0.9 + i*1.0, 0.34, 0.9);
  }
}

function buildStall(def, angle) {
  const g = new THREE.Group();
  const R = STALL_R;
  const px = Math.cos(angle) * R, pz = Math.sin(angle) * R;
  g.position.set(px, 0, pz);
  g.rotation.y = Math.atan2(-px, -pz);   // local +z faces the square

  const roofMat = pick([M.roofRed, M.roofGreen, M.roofBrown]);

  // posts
  for (const sx of [-1.35, 1.35]) for (const sz of [-0.85, 0.85])
    addMesh(g, G.postCyl, M.woodDark, sx, 1.15, sz);
  // counter
  addMesh(g, G.counterTop,   M.wood, 0, 1.06, 0.82);
  addMesh(g, G.counterFront, M.wood, 0, 0.56, 0.86);
  // side + back walls
  addMesh(g, G.sideWall, M.wood, -1.33, 0.78, 0);
  addMesh(g, G.sideWall, M.wood,  1.33, 0.78, 0);
  addMesh(g, G.backWall, M.wood,  0, 1.0, -0.83);
  // shelf
  addMesh(g, G.shelf, M.woodDark, 0, 1.44, -0.62);
  // roof slabs (front & back) with snow caps
  const slope = Math.atan2(0.7, 1.15);
  addMesh(g, G.slab,     roofMat, 0, 2.6,  0.575, { rx:  slope });
  addMesh(g, G.slab,     roofMat, 0, 2.6, -0.575, { rx: -slope });
  addMesh(g, G.snowSlab, M.snow,  0, 2.6 + 0.068,  0.575 + 0.042, { rx:  slope });
  addMesh(g, G.snowSlab, M.snow,  0, 2.6 + 0.068, -0.575 - 0.042, { rx: -slope });

const bulbPositions = [], bulbColors = [], bulbPhases = [], bulbUs = [];
const wireMat = new THREE.LineBasicMaterial({ color: 0x141009 });

function catenaryPoints(p0, p1, sag, segments) {
  const pts = [];
  const mid = p0.clone().lerp(p1, 0.5); mid.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(p0, mid, p1);
  for (let i = 0; i <= segments; i++) pts.push(curve.getPoint(i / segments));
  return { curve, pts };
}
const BULB_COLORS = [
  [1.0, 0.72, 0.33], [1.0, 0.72, 0.33], [1.0, 0.72, 0.33],  // bias warm
  [1.0, 0.28, 0.22], [0.32, 1.0, 0.4], [0.38, 0.6, 1.0], [1.0, 0.9, 0.55], [0.95, 0.45, 1.0]
];
function addStrand(p0, p1, sag, spacing) {
  const { curve, pts } = catenaryPoints(p0, p1, sag, 28);
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
  const len = curve.getLength();
  const n = Math.max(4, Math.floor(len / spacing));
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const p = curve.getPoint(u);
    bulbPositions.push(p.x, p.y - 0.09, p.z);
    const c = BULB_COLORS[(Math.random() * BULB_COLORS.length) | 0];
    bulbColors.push(c[0], c[1], c[2]);
    bulbPhases.push(Math.random());
    bulbUs.push(u);
  }
}

// shared uniforms for bulbs & tree lights
const lightUniforms = {
  uTime:    { value: 0 },
  uPattern: { value: 0 },
  uSize:    { value: 1.0 }
};
const bulbVert = `
  attribute float aPhase;
  attribute float aU;
  attribute vec3 aColor;
  varying float vPhase, vU;
  varying vec3 vColor;
  void main() {
    vPhase = aPhase; vU = aU; vColor = aColor;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = 150.0 / -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;
const bulbFrag = `
  uniform float uTime, uPattern;
  varying float vPhase, vU;
  varying vec3 vColor;
  void main() {
    vec2 d = gl_PointCoord - 0.5;
    float dist = length(d);
    if (dist > 0.5) discard;
    float b;
    if (uPattern < 0.5)      b = 0.55 + 0.45 * sin(uTime * 2.3 + vPhase * 6.2831);
    else if (uPattern < 1.5) b = 0.32 + 0.68 * pow(0.5 + 0.5 * sin(vU * 22.0 - uTime * 3.2), 5.0);
    else if (uPattern < 2.5) b = 0.60 + 0.40 * sin(uTime * 3.6 + vU * 46.0 + vPhase * 3.0);
    else                     b = 0.78 + 0.22 * sin(uTime * 9.0 + vPhase * 6.2831);
    float core  = smoothstep(0.5, 0.05, dist);
    float heart = smoothstep(0.16, 0.0, dist);
    vec3 col = vColor * (0.28 + 1.5 * b) * core + vColor * heart * (0.6 + b);
    gl_FragColor = vec4(col, core);
  }`;
const bulbMat = new THREE.ShaderMaterial({
  uniforms: lightUniforms, vertexShader: bulbVert, fragmentShader: bulbFrag,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
function makeBulbPoints(pos, col, phase, u) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aColor',   new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('aPhase',   new THREE.Float32BufferAttribute(phase, 1));
  geo.setAttribute('aU',       new THREE.Float32BufferAttribute(u, 1));
  const pts = new THREE.Points(geo, bulbMat);
  pts.frustumCulled = false;
  return pts;
}

  m.castShadow = true;
  parent.add(m);
  return m;
}
const visitors = [];
function buildVisitor() {
  const g = new THREE.Group();
  const coat = pick(COATS), skin = pick(SKINS), hat = pick(HATS);
  const cm = cachedMat(coat), sm = cachedMat(skin), hm = cachedMat(hat);
  // legs & boots
  addMesh(g, visitorGeo.leg, cachedMat(0x24201c), -0.085, 0.21, 0);
  addMesh(g, visitorGeo.leg, cachedMat(0x24201c),  0.085, 0.21, 0);
  // coat
  addMesh(g, visitorGeo.coat, cm, 0, 0.74, 0);
  // scarf
  addMesh(g, visitorGeo.scarf, cachedMat(pick([0xc0392b, 0xd4a017, 0x3a7bd5, 0xe8e4da])), 0, 1.08, 0, { shadow: false });
  // head + hat
  addMesh(g, visitorGeo.head, sm, 0, 1.2, 0);
  if (Math.random() < 0.72) addMesh(g, visitorGeo.hat, hm, 0, 1.36, 0);
  else addMesh(g, visitorGeo.brim, hm, 0, 1.29, 0, { shadow: false });
  // arms reaching forward to hold the cup
  cylinderBetween(g, visitorGeo.arm, cm, new THREE.Vector3(-0.17, 1.0, 0.02), new THREE.Vector3(-0.075, 0.9, 0.17));
  cylinderBetween(g, visitorGeo.arm, cm, new THREE.Vector3( 0.17, 1.0, 0.02), new THREE.Vector3( 0.075, 0.9, 0.17));
  // cup
  addMesh(g, visitorGeo.cup, cachedMat(pick([0xc0392b, 0xe8e4da, 0x2e5a8a])), 0, 0.925, 0.185, { shadow: false });
  const s = rand(0.88, 1.12);
  g.scale.setScalar(s);
  scene.add(g);
  return g;
}
// route assignment: walkers on two loops, orbiters around carousel, browsers at stalls
const browserSpots = stallAnchors.map(s => {
  const dir = s.pos.clone().multiplyScalar(-1).normalize();    // toward centre
  const p = s.pos.clone().addScaledVector(dir, 1.9);           // just in front of stall
  return { pos: p, face: Math.atan2(s.pos.x - p.x, s.pos.z - p.z) };
});
for (let i = 0; i < 58; i++) {
  const g = buildVisitor();
  let v;
  if (i < 24)      v = { kind: 'walkA', offset: rand(0, TAU), speed: rand(0.32, 0.45), phase: rand(0, TAU) };   // circle r9
  else if (i < 34) v = { kind: 'walkB', offset: rand(0, TAU), speed: rand(0.26, 0.36), phase: rand(0, TAU) };   // ellipse
  else if (i < 46) v = { kind: 'carousel', offset: rand(0, TAU), speed: rand(0.18, 0.3), phase: rand(0, TAU) }; // carousel orbit
  else             v = { kind: 'browse', spot: browserSpots[i - 46], phase: rand(0, TAU) };                     // at stall
  v.group = g;
  visitors.push(v);
}
function updateVisitors(t) {
  for (const v of visitors) {
    let x, z, facing, bob;
    if (v.kind === 'walkA') {
      const a = v.offset + v.speed * t * (9 / 9) / 9 * 9; // angular: speed in rad/s scaled
      const ang = v.offset + (v.speed * t) / 3.1;
      x = Math.cos(ang) * 9; z = Math.sin(ang) * 9;
      facing = Math.atan2(-(z), -(x)) + Math.PI / 2 * 0; // tangent:
      facing = Math.atan2(-Math.sin(ang), Math.cos(ang));
      facing = Math.atan2(Math.cos(ang), -Math.sin(ang));
      bob = Math.abs(Math.sin(t * 5.2 + v.phase)) * 0.055;
    } else if (v.kind === 'walkB') {
      const ang = v.offset + (v.speed * t) / 4.2;
      x = Math.cos(ang) * 11.5; z = Math.sin(ang) * 8.0;
      facing = Math.atan2(Math.cos(ang) * 8.0, -Math.sin(ang) * 11.5) + Math.PI;
      bob = Math.abs(Math.sin(t * 4.6 + v.phase)) * 0.055;
    } else if (v.kind === 'carousel') {
      const ang = v.offset + (v.speed * t) / 5.6;
      x = CAROUSEL_POS.x + Math.cos(ang) * 5.55;
      z = CAROUSEL_POS.z + Math.sin(ang) * 5.55;
      facing = Math.atan2(-Math.sin(ang), Math.cos(ang)) + Math.PI / 2;
      bob = Math.abs(Math.sin(t * 4.9 + v.phase)) * 0.05;
    } else {
      x = v.spot.pos.x + Math.sin(t * 0.5 + v.phase) * 0.12;
      z = v.spot.pos.z + Math.cos(t * 0.4 + v.phase) * 0.12;
      facing = v.spot.face + Math.sin(t * 0.7 + v.phase) * 0.3;
      bob = Math.sin(t * 1.4 + v.phase) * 0.02;
    }
    v.group.position.set(x, bob, z);
    v.group.rotation.y = facing;
    v.group.rotation.z = Math.sin(t * 2.1 + v.phase) * 0.03;
  }
}

/* ================================================================
   STEAM — CPU-updated Points rising from every cup
   ================================================================ */
const STEAM_PER = 3, STEAM_COUNT = visitors.length * STEAM_PER;
const steamPos = new Float32Array(STEAM_COUNT * 3);
const steamSeed = new Float32Array(STEAM_COUNT);
for (let i = 0; i < STEAM_COUNT; i++) steamSeed[i] = Math.random();
const steamGeo = new THREE.BufferGeometry();
steamGeo.setAttribute('position', new THREE.BufferAttribute(steamPos, 3));
const steam = new THREE.Points(steamGeo, new THREE.PointsMaterial({
  map: softDotTex, color: 0xf2f6ff, size: 0.17, transparent: true,
  opacity: 0.38, depthWrite: false, sizeAttenuation: true
}));
steam.frustumCulled = false;
scene.add(steam);
const _cup = new THREE.Vector3(), _fwd = new THREE.Vector3();
function updateSteam(t) {
  let i3 = 0;
  for (const v of visitors) {
    const g = v.group;
    _fwd.set(Math.sin(g.rotation.y), 0, Math.cos(g.rotation.y));
    for (let p = 0; p < STEAM_PER; p++) {
      const seed = steamSeed[i3 / 3];
      const age = (t * 0.42 + seed * 7.13 + p * 0.33) % 1;
      _cup.copy(g.position).addScaledVector(_fwd, 0.185 * g.scale.x);
      _cup.y += 0.985 * g.scale.y;
      steamPos[i3++] = _cup.x + Math.sin(t * 1.7 + seed * 20 + age * 4) * 0.05 * age;
      steamPos[i3++] = _cup.y + age * 0.55;
      steamPos[i3++] = _cup.z + Math.cos(t * 1.5 + seed * 17 + age * 4) * 0.05 * age;
    }
  }
  steamGeo.attributes.position.needsUpdate = true;
}

/* ================================================================
   SNOW — 32,000 flakes, GPU-simulated drift & swirl
   ================================================================ */
const SNOW_COUNT = 32000;
const snowSeed = new Float32Array(SNOW_COUNT * 4);
for (let i = 0; i < SNOW_COUNT * 4; i++) snowSeed[i] = Math.random();
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SNOW_COUNT * 3), 3)); // dummy
snowGeo.setAttribute('aSeed', new THREE.BufferAttribute(snowSeed, 4));
const snowUniforms = {
  uTime:  { value: 0 },
  uSnow:  { value: 0.75 },
  uPixel: { value: renderer.getPixelRatio() }
};
const snowMat = new THREE.ShaderMaterial({
  uniforms: snowUniforms,
  transparent: true, depthWrite: false,
  vertexShader: `
    attribute vec4 aSeed;
    uniform float uTime, uPixel;
    varying float vA;
    void main() {
      float H = 24.0;
      float fall = 1.05 + aSeed.w * 0.9;
      float y = mod(aSeed.y * H - uTime * fall, H);
      float x = (aSeed.x - 0.5) * 110.0 + sin(uTime * 0.55 + aSeed.z * 6.2831) * 2.1
                                          + sin(uTime * 1.6  + aSeed.z * 18.0) * 0.55;
      float z = (fract(aSeed.z * 7.31 + 0.37) - 0.5) * 110.0 + cos(uTime * 0.5 + aSeed.x * 6.2831) * 2.1
                                          + cos(uTime * 1.35 + aSeed.x * 15.0) * 0.55;
      vA = aSeed.w;
      vec4 mv = modelViewMatrix * vec4(x, y - 0.5, z, 1.0);
      gl_PointSize = (1.4 + aSeed.w * 2.4) * uPixel * (46.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uSnow;
    varying float vA;
    void main() {
      if (vA > uSnow) discard;                 // Up/Down controls real density
      vec2 d = gl_PointCoord - 0.5;
      float dist = length(d);
      if (dist > 0.5) discard;
      float a = smoothstep(0.5, 0.05, dist) * 0.9;
      gl_FragColor = vec4(0.92, 0.95, 1.0, a);
    }`
});
const snowfall = new THREE.Points(snowGeo, snowMat);
snowfall.frustumCulled = false;
scene.add(snowfall);

/* ================================================================
   MOON + STARS  (fog-free so they stay visible)
   ================================================================ */
{
  const moon = new THREE.Mesh(new THREE.CircleGeometry(2.6, 32),
    new THREE.MeshBasicMaterial({ color: 0xe9edf6, fog: false }));
  moon.position.set(-70, 64, -95); moon.lookAt(camera.position);
  scene.add(moon);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: softDotTex, color: 0xcfd9ee, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  halo.position.copy(moon.position); halo.scale.set(16, 16, 1);
  scene.add(halo);
  const starPos = [];
  for (let i = 0; i < 500; i++) {
    const a = Math.random() * TAU, e = rand(0.12, 1.35), r = 210;
    starPos.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.55, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.85 })));
}

/* ================================================================
   STATE + INPUT
   ================================================================ */
const PATTERN_NAMES = ['Warm Twinkle', 'Chasing Wave', 'Market Shimmer', 'Candlelight Flicker'];
let lightPattern = 0;
let snowLevel = 0.75;
let simTime = 0;
let showcaseActive = false;

const patternToast = document.getElementById('patternToast');
let toastTimer = null;
function showToast(msg) {
  patternToast.textContent = msg;
  patternToast.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => patternToast.style.opacity = 0, 1600);
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    carouselState.on = !carouselState.on;
    showToast(carouselState.on ? 'Carousel starting…' : 'Carousel coasting down…');
  } else if (e.code === 'KeyL') {
    lightPattern = (lightPattern + 1) % 4;
    lightUniforms.uPattern.value = lightPattern;
    showToast('Lights: ' + PATTERN_NAMES[lightPattern]);
  } else if (e.code === 'ArrowUp') {
    e.preventDefault();
    snowLevel = clamp(snowLevel + 0.15, 0, 1);
    snowUniforms.uSnow.value = snowLevel;
    showToast('Snowfall: ' + Math.round(snowLevel * 100) + '%');
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    snowLevel = clamp(snowLevel - 0.15, 0, 1);
    snowUniforms.uSnow.value = snowLevel;
    showToast('Snowfall: ' + Math.round(snowLevel * 100) + '%');
  }
});

/* ================================================================
   WINDOW.__bench  (required, updated every frame)
   ================================================================ */
window.__bench = { visitors: visitors.length, snowflakes: SNOW_COUNT, carouselSpeed: 0, lights: TOTAL_LIGHTS };
function updateBench() {
  window.__bench.visitors = visitors.length;
  window.__bench.snowflakes = SNOW_COUNT;
  window.__bench.carouselSpeed = carouselState.speed;
  window.__bench.lights = TOTAL_LIGHTS;
}

/* ================================================================
   SHOWCASE — 12 s scripted camera flight, fully deterministic seek(t)
   ================================================================ */
const SHOWCASE_DURATION = 12;
const CAM_KEYS = [
  { t: 0.0,  pos: [27.5, 14.5, 25.5], tgt: [0, 2.2, 0]    },
  { t: 2.4,  pos: [15.0, 6.8, 17.5],  tgt: [-1.5, 2.6, -1]},
  { t: 4.7,  pos: [10.8, 2.3, 6.2],   tgt: [12.6, 1.9, -7.3] },  // stall close-up
  { t: 7.0,  pos: [1.6, 1.75, 8.6],   tgt: [6.5, 2.3, 2.5]  },   // carousel low pass
  { t: 9.3,  pos: [1.2, 3.6, 11.5],   tgt: [6.5, 3.6, 2.5]  },   // carousel + canopy
  { t: 12.0, pos: [25.0, 15.0, 24.0], tgt: [0, 2.4, 0]    }
];
function sampleKeys(t) {
  let i = 0;
  while (i < CAM_KEYS.length - 2 && t > CAM_KEYS[i + 1].t) i++;
  const a = CAM_KEYS[i], b = CAM_KEYS[i + 1];
  const f = smooth(clamp((t - a.t) / (b.t - a.t), 0, 1));
  const pos = new THREE.Vector3().fromArray(a.pos).lerp(new THREE.Vector3().fromArray(b.pos), f);
  const tgt = new THREE.Vector3().fromArray(a.tgt).lerp(new THREE.Vector3().fromArray(b.tgt), f);
  return { pos, tgt };
}
// deterministic carousel integration for the showcase: on from t=0.6s, ramp with accel
function showcaseCarousel(t) {
  let speed = 0, angle = 0;
  const dt = 1 / 240, onTime = 0.6;
  for (let s = 0; s < t; s += dt) {
    const target = s >= onTime ? carouselState.maxSpeed : 0;
    if (speed < target) speed = Math.min(target, speed + carouselState.accel * dt);
    angle += speed * dt;
  }
  return { speed, angle };
}
const SHOWCASE = {
  duration: SHOWCASE_DURATION,
  seek(t) {
    t = clamp(t, 0, SHOWCASE_DURATION);
    simTime = t;
    // fixed showcase art direction
    lightUniforms.uTime.value = t;
    lightUniforms.uPattern.value = 1;         // chasing wave reads beautifully on video
    snowUniforms.uTime.value = t;
    snowUniforms.uSnow.value = 0.8;
    // carousel
    const cs = showcaseCarousel(t);
    carouselSpin.rotation.y = cs.angle;
    carouselState.speed = cs.speed;
    carouselState.angle = cs.angle;
    for (let i = 0; i < horses.length; i++) {
      horses[i].position.y = 1.0 + Math.sin(t * 2.15 + i * 1.05) * 0.32;
      horses[i].rotation.z = Math.sin(t * 2.15 + i * 1.05 + 0.6) * 0.06;
    }
    // tree star pulse
    star.material.color.setHSL(0.13, 0.9, 0.62 + 0.28 * Math.sin(t * 3.1));
    starLight.intensity = 1.1 + 0.6 * Math.sin(t * 3.1);
    // camera
    const { pos, tgt } = sampleKeys(t);
    camera.position.copy(pos);
    camera.lookAt(tgt);
    controls.target.copy(tgt);
    // simulation state
    updateVisitors(t);
    updateSteam(t);
    updateBench();
    composer.render();
  }
};
window.showcase = SHOWCASE;

/* ================================================================
   INTERACTIVE FRAME LOOP
   ================================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (showcaseActive) return;               // showcase drives rendering itself
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;
  // carousel spin-up / coast-down
  const target = carouselState.on ? carouselState.maxSpeed : 0;
  if (carouselState.speed < target) carouselState.speed = Math.min(target, carouselState.speed + carouselState.accel * dt);
  else if (carouselState.speed > target) carouselState.speed = Math.max(target, carouselState.speed - carouselState.decel * dt);
  carouselState.angle += carouselState.speed * dt;
  carouselSpin.rotation.y = carouselState.angle;
  for (let i = 0; i < horses.length; i++) {
    horses[i].position.y = 1.0 + Math.sin(simTime * 2.15 + i * 1.05) * 0.32;
    horses[i].rotation.z = Math.sin(simTime * 2.15 + i * 1.05 + 0.6) * 0.06;
  }
  // tree star pulse
  star.material.color.setHSL(0.13, 0.9, 0.62 + 0.28 * Math.sin(simTime * 3.1));
  starLight.intensity = 1.1 + 0.6 * Math.sin(simTime * 3.1);
  // uniforms
  lightUniforms.uTime.value = simTime;
  snowUniforms.uTime.value = simTime;
  // crowd & steam
  updateVisitors(simTime);
  updateSteam(simTime);
  controls.update();
  updateBench();
  composer.render();
}

/* ================================================================
   RECORD BUTTON — plays showcase 0→duration, saves .webm
   ================================================================ */
const recBtn = document.getElementById('recBtn');
let recording = false;
recBtn.addEventListener('click', () => {
  if (recording) return;
  recording = true;
  showcaseActive = true;
  controls.enabled = false;
  recBtn.disabled = true;
  recBtn.textContent = '● Recording…';
  const stream = renderer.domElement.captureStream(60);
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14e6 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'weihnachtsmarkt-showcase.webm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    recBtn.disabled = false;
    recBtn.innerHTML = '⏺&nbsp; Record showcase (.webm)';
    recording = false;
    showcaseActive = false;
    controls.enabled = true;
    clock.getDelta();          // flush stale delta
  };
  rec.start(250);
  const t0 = performance.now();
  (function frame() {
    const t = Math.min((performance.now() - t0) / 1000, SHOWCASE_DURATION);
    SHOWCASE.seek(t);
    if (t < SHOWCASE_DURATION) requestAnimationFrame(frame);
    else rec.stop();
  })();
});

/* ================================================================
   RESIZE
   ================================================================ */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  snowUniforms.uPixel.value = renderer.getPixelRatio();
});

// first frame
updateVisitors(0);
updateSteam(0);
animate();
</script>

<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#120d0a;font-family:Georgia,'Times New Roman',serif;height:100%;}

  #titleCard{top:18px;left:20px;max-width:340px;}

  #titleCard .sub{font-size:11px;letter-spacing:2px;color:#a98d5b;text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid rgba(216,180,106,0.3);padding-bottom:6px;}

<body>
<div id="app"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ============================================================================
   AURELIA & CO. — Self-Playing Upright Piano · Victorian Parlour
   Everything procedural: geometry, textures, audio (Karplus-Strong), tune data.
   ========================================================================== */
'use strict';

/* ---------------- bench (must exist & update every frame) ---------------- */
const bench = { notesPlayed: 0, activeKeys: 0, tempo: 96, rollPosition: 0 };
window.__bench = bench;

/* ==========================================================================
   1. CANVAS TEXTURE HELPERS
   ========================================================================== */
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function cnv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(c, srgb){ const t=new THREE.CanvasTexture(c); if(srgb!==false) t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t; }

/* --- walnut / wood grain (vertical) --- */
function makeWood(base, dark, light, seed, planks){
  const s = mulberry32(seed||7), c = cnv(512,512), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,512,512);
  if(planks){
    const rows = 7, ph = 512/rows;
    for(let r=0;r<rows;r++){
      g.fillStyle = 'rgba('+(20+s()*30|0)+','+(12+s()*18|0)+',8,'+(0.18+s()*0.22)+')';
      g.fillRect(0, r*ph, 512, ph);
      g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=3;
      g.beginPath(); g.moveTo(0,r*ph); g.lineTo(512,r*ph); g.stroke();
      const seam = s()*512;
      g.beginPath(); g.moveTo(seam, r*ph); g.lineTo(seam, (r+1)*ph); g.stroke();
      for(let i=0;i<26;i++){ // horizontal grain
        g.strokeStyle = s()<0.5 ? 'rgba(0,0,0,'+(0.08+s()*0.14)+')' : 'rgba(255,220,170,'+(0.04+s()*0.07)+')';
        g.lineWidth = 0.6 + s()*1.6;
        const y = r*ph + s()*ph; g.beginPath(); g.moveTo(0,y);
        for(let x=0;x<=512;x+=32) g.lineTo(x, y + Math.sin(x*0.02 + s()*9)*2.2 + (s()-0.5)*2);
        g.stroke();
      }
    }
  } else {
    for(let i=0;i<210;i++){ // vertical grain
      const x0 = s()*512;
      g.strokeStyle = s()<0.62 ? 'rgba('+dark+','+(0.10+s()*0.28)+')' : 'rgba('+light+','+(0.05+s()*0.12)+')';
      g.lineWidth = 0.6 + s()*2.6;
      g.beginPath(); g.moveTo(x0, -10);
      for(let y=0;y<=522;y+=24) g.lineTo(x0 + Math.sin(y*0.018 + i*1.7)*6 + (s()-0.5)*5, y);
      g.stroke();
    }
    for(let k=0;k<5;k++){ // knots
      const kx=s()*512, ky=s()*512;
      for(let r=9;r>0;r-=2){ g.strokeStyle='rgba('+dark+','+(0.28)+')'; g.lineWidth=1.4;
        g.beginPath(); g.ellipse(kx,ky,r*1.7,r,0,0,Math.PI*2); g.stroke(); }
    }
    const grad = g.createLinearGradient(0,0,512,0); // soft polish sheen
    grad.addColorStop(0,'rgba(255,235,200,0.10)'); grad.addColorStop(0.25,'rgba(0,0,0,0.06)');
    grad.addColorStop(0.5,'rgba(255,235,200,0.12)'); grad.addColorStop(0.78,'rgba(0,0,0,0.09)'); grad.addColorStop(1,'rgba(255,235,200,0.06)');
    g.fillStyle=grad; g.fillRect(0,0,512,512);
  }
  return c;
}

/* --- wallpaper: deep green damask --- */
function makeWallpaper(){
  const c=cnv(512,512), g=c.getContext('2d');
  g.fillStyle='#26382d'; g.fillRect(0,0,512,512);
  for(let x=0;x<512;x+=64){ g.fillStyle='rgba(255,255,255,0.035)'; g.fillRect(x,0,10,512); g.fillStyle='rgba(0,0,0,0.12)'; g.fillRect(x+34,0,6,512); }
  const motif=(cx,cy,s)=>{
    g.save(); g.translate(cx,cy); g.scale(s,s);
    g.strokeStyle='rgba(203,171,94,0.34)'; g.fillStyle='rgba(203,171,94,0.16)'; g.lineWidth=2;
    for(let p=0;p<6;p++){ g.rotate(Math.PI/3); g.beginPath(); g.ellipse(0,-13,5.2,11,0,0,Math.PI*2); g.fill(); g.stroke(); }
    g.beginPath(); g.arc(0,0,5,0,Math.PI*2); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(0,-26); g.quadraticCurveTo(8,-33,0,-40); g.quadraticCurveTo(-8,-33,0,-26); g.fill(); g.stroke();
    g.restore();
  };
  for(let ry=0;ry<4;ry++) for(let rx=0;rx<4;rx++){
    const ox = (ry%2)? 64 : 0;
    motif(rx*128 + ox + 32, ry*128 + 46, 1.0);
    motif(rx*128 + ox + 96, ry*128 + 110, 0.55);
  }
  // subtle grime
  const vg=g.createRadialGradient(256,256,80,256,256,360); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.28)');
  g.fillStyle=vg; g.fillRect(0,0,512,512);
  return c;
}

/* --- Persian rug --- */
function makeRug(){
  const c=cnv(1024,704), g=c.getContext('2d'), s=mulberry32(99);
  g.fillStyle='#57201d'; g.fillRect(0,0,1024,704);
  // mottled field
  for(let i=0;i<2600;i++){ g.fillStyle='rgba('+(s()<0.5?'0,0,0':'255,210,160')+','+(0.03+s()*0.06)+')'; g.fillRect(s()*1024, s()*704, 3+s()*4, 2+s()*3); }
  // borders
  g.strokeStyle='#c8a24a'; g.lineWidth=14; g.strokeRect(26,26,972,652);
  g.strokeStyle='#22392e'; g.lineWidth=30; g.strokeRect(52,52,920,600);
  g.strokeStyle='#c8a24a'; g.lineWidth=4;  g.strokeRect(70,70,884,564);
  // greek key-ish tick border
  g.fillStyle='#c8a24a';
  for(let x=84;x<940;x+=34){ g.fillRect(x,40,16,8); g.fillRect(x,656,16,8); }
  for(let y=84;y<620;y+=34){ g.fillRect(40,y,8,16); g.fillRect(976,y,8,16); }
  // central medallion
  g.save(); g.translate(512,352);
  const med=(rx,ry,fill,stroke,lw)=>{ g.beginPath(); g.ellipse(0,0,rx,ry,0,0,Math.PI*2); if(fill){g.fillStyle=fill;g.fill();} if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||4;g.stroke();} };
  med(300,190,'#22392e','#c8a24a',6);
  med(240,146,'#6e2a24','#c8a24a',3);
  med(150,96,'#c8a24a','#57201d',3);
  med(88,56,'#57201d','#c8a24a',4);
  med(34,22,'#c8a24a',null);
  for(let p=0;p<12;p++){ g.rotate(Math.PI/6); g.beginPath(); g.ellipse(0,-122,10,34,0,0,Math.PI*2); g.fillStyle='#c8a24a'; g.fill(); g.strokeStyle='#22392e'; g.lineWidth=2; g.stroke(); }
  g.restore();
  // corner spandrels
  const corner=(x,y,fx,fy)=>{ g.save(); g.translate(x,y); g.scale(fx,fy);
    g.beginPath(); g.moveTo(0,0); g.lineTo(190,0); g.quadraticCurveTo(150,60,60,150); g.lineTo(0,190); g.closePath();
    g.fillStyle='#22392e'; g.fill(); g.strokeStyle='#c8a24a'; g.lineWidth=4; g.stroke();
    g.beginPath(); g.ellipse(56,56,26,16,Math.PI/4,0,Math.PI*2); g.fillStyle='#c8a24a'; g.fill();
    g.restore(); };
  corner(70,70,1,1); corner(954,70,-1,1); corner(70,634,1,-1); corner(954,634,-1,-1);
  return c;
}

/* --- lamp shade: warm stripes --- */
function makeShade(){
  const c=cnv(512,256), g=c.getContext('2d');
  for(let x=0;x<512;x+=42){ g.fillStyle=(x/42)%2? '#f0cd92':'#dfa860'; g.fillRect(x,0,42,256); }
  g.fillStyle='rgba(120,60,20,0.25)'; g.fillRect(0,236,512,20);
  g.strokeStyle='#8a4a1e'; g.lineWidth=3;
  for(let x=21;x<512;x+=84){ g.beginPath(); g.arc(x,180,10,0,Math.PI*2); g.stroke(); g.beginPath(); g.arc(x,180,3.4,0,Math.PI*2); g.fillStyle='#8a4a1e'; g.fill(); }
  return c;
}

/* --- paintings --- */
function makePaintingLandscape(){
  const c=cnv(512,384), g=c.getContext('2d');
  const sky=g.createLinearGradient(0,0,0,250); sky.addColorStop(0,'#e9c47e'); sky.addColorStop(0.6,'#b4784a'); sky.addColorStop(1,'#5e3a28');
  g.fillStyle=sky; g.fillRect(0,0,512,384);
  g.fillStyle='#f7e2ac'; g.beginPath(); g.arc(352,158,34,0,Math.PI*2); g.fill(); // low sun
  g.fillStyle='#3a2a20'; g.beginPath(); g.moveTo(0,238);
  for(let x=0;x<=512;x+=32) g.lineTo(x, 238 - Math.abs(Math.sin(x*0.011+1.2))*66 - Math.sin(x*0.05)*7);
  g.lineTo(512,384); g.lineTo(0,384); g.fill();
  g.fillStyle='#241812'; g.beginPath(); g.moveTo(0,292);
  for(let x=0;x<=512;x+=24) g.lineTo(x, 292 - Math.abs(Math.sin(x*0.017+4.0))*44);
  g.lineTo(512,384); g.lineTo(0,384); g.fill();
  g.strokeStyle='rgba(20,12,8,0.8)'; g.lineWidth=2;
  [[120,120],[150,104],[205,132],[300,96]].forEach(p=>{ g.beginPath(); g.moveTo(p[0]-9,p[1]); g.quadraticCurveTo(p[0],p[1]-7,p[0],p[1]); g.quadraticCurveTo(p[0],p[1]-7,p[0]+9,p[1]); g.stroke(); });
  return c;
}
function makePaintingPortrait(){
  const c=cnv(384,512), g=c.getContext('2d');
  g.fillStyle='#241c26'; g.fillRect(0,0,384,512);
  const halo=g.createRadialGradient(192,206,20,192,206,190); halo.addColorStop(0,'rgba(214,178,110,0.5)'); halo.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=halo; g.fillRect(0,0,384,512);
  g.fillStyle='#120d12'; g.beginPath(); g.ellipse(192,368,120,150,0,Math.PI,0); g.fill(); // shoulders
  g.beginPath(); g.ellipse(192,196,74,96,0,0,Math.PI*2); g.fill(); // head
  g.strokeStyle='rgba(226,200,140,0.65)'; g.lineWidth=5;
  g.beginPath(); g.ellipse(192,196,74,96,0,-0.7,1.15); g.stroke(); // rim light
  g.fillStyle='#e8e0d0'; g.beginPath(); g.moveTo(160,372); g.lineTo(192,318); g.lineTo(224,372); g.closePath(); g.fill(); // collar
  return c;
}

/* --- sheet music for the desk --- */
function makeSheetMusic(){
  const c=cnv(512,384), g=c.getContext('2d'), s=mulberry32(31);
  g.fillStyle='#f2e9d2'; g.fillRect(0,0,512,384);
  g.fillStyle='#2a2118'; g.font='italic 26px Georgia'; g.textAlign='center'; g.fillText('Ode to Joy',256,42);
  g.font='12px Georgia'; g.fillStyle='#6a5a40'; g.fillText('L. v. Beethoven',256,62);
  for(let sys=0;sys<3;sys++){
    const y0=96+sys*96;
    for(let l=0;l<5;l++){ g.strokeStyle='#241c12'; g.lineWidth=1.4; g.beginPath(); g.moveTo(30,y0+l*9); g.lineTo(482,y0+l*9); g.stroke(); }
    for(let n=0;n<14;n++){
      const x=44+n*32, y=y0+36-s()*52, open=s()<0.24;
      g.fillStyle='#241c12';
      g.save(); g.translate(x,y); g.rotate(-0.32);
      if(open){ g.strokeStyle='#241c12'; g.lineWidth=2; g.beginPath(); g.ellipse(0,0,5.6,4.1,0,0,Math.PI*2); g.stroke(); }
      else { g.beginPath(); g.ellipse(0,0,5.6,4.1,0,0,Math.PI*2); g.fill(); }
      g.restore();
      g.strokeStyle='#241c12'; g.lineWidth=1.8; g.beginPath(); g.moveTo(x+5.2,y); g.lineTo(x+5.2,y-26-s()*10); g.stroke();
    }
  }
  g.strokeStyle='rgba(90,70,40,0.5)'; g.lineWidth=6; g.strokeRect(2,2,508,380);
  return c;
}

/* --- tracker bar face: brass with 88 holes --- */
function makeTracker(){
  const c=cnv(1024,64), g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,64); gr.addColorStop(0,'#8a6a30'); gr.addColorStop(0.4,'#e8c878'); gr.addColorStop(0.65,'#a8843e'); gr.addColorStop(1,'#5e4620');
  g.fillStyle=gr; g.fillRect(0,0,1024,64);
  for(let i=0;i<88;i++){ const x=14+i*(996/87); g.fillStyle='#100c08'; g.beginPath(); g.arc(x,34,5.2,0,Math.PI*2); g.fill(); g.strokeStyle='#f4dc9a'; g.lineWidth=1; g.beginPath(); g.arc(x,33,5.6,Math.PI*1.05,Math.PI*1.95); g.stroke(); }
  return c;
}

/* --- nameboard decal --- */
function makeDecal(){
  const c=cnv(1024,128), g=c.getContext('2d');
  g.clearRect(0,0,1024,128);
  g.textAlign='center'; g.fillStyle='#d8b46a';
  g.font='44px Georgia'; g.save(); g.shadowColor='#5e4620'; g.shadowBlur=6;
  g.fillText('A U R E L I A   &   C O .',512,58);
  g.font='17px Georgia'; g.fillStyle='#b89468'; g.fillText('· L O N D O N ·',512,100); g.restore();
  return c;
}

/* --- radial glow sprite --- */
function makeGlow(){
  const c=cnv(128,128), g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,2,64,64,64);
  gr.addColorStop(0,'rgba(255,235,190,1)'); gr.addColorStop(0.25,'rgba(255,210,140,0.55)'); gr.addColorStop(0.6,'rgba(255,180,100,0.14)'); gr.addColorStop(1,'rgba(255,160,80,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  return c;
}

/* ==========================================================================
   2. SONG DATA — "Ode to Joy" arranged (≥60 notes, chords), pitch from name
   ========================================================================== */
const NOTE_NAMES = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function nameToMidi(n){ const m = n.match(/^([A-G][#b]?)(-?\d+)$/); return NOTE_NAMES[m[1]] + (parseInt(m[2],10)+1)*12; }
const SCALE = [0,2,4,5,7,9,11];
function diatonicStepsDown(midi, k){ let cur=midi; for(let i=0;i<k;i++){ cur--; while(SCALE.indexOf(((cur%12)+12)%12)===-1) cur--; } return cur; }

const NOTES = [];
const _mel = [
  [0,'E4',1],[1,'E4',1],[2,'F4',1],[3,'G4',1],
  [4,'G4',1],[5,'F4',1],[6,'E4',1],[7,'D4',1],
  [8,'C4',1],[9,'C4',1],[10,'D4',1],[11,'E4',1],
  [12,'E4',1.5],[13.5,'D4',1.5],[15,'D4',1.7],
  [16,'E4',1],[17,'E4',1],[18,'F4',1],[19,'G4',1],
  [20,'G4',1],[21,'F4',1],[22,'E4',1],[23,'D4',1],
  [24,'C4',1],[25,'C4',1],[26,'D4',1],[27,'E4',1],
  [28,'D4',1.5],[29.5,'C4',1.5],[31,'C4',1.7],
  [32,'E4',1],[33,'E4',1],[34,'F4',1],[35,'G4',1],
  [36,'G4',1],[37,'F4',1],[38,'E4',1],[39,'D4',1],
  [40,'C4',1],[41,'C4',1],[42,'D4',1],[43,'E4',1],
  [44,'E4',1.5],[45.5,'D4',1.5],[47,'D4',1.7],
  [48,'E4',1],[49,'E4',1],[50,'F4',1],[51,'G4',1],
  [52,'G4',1],[53,'F4',1],[54,'E4',1],[55,'D4',1],
  [56,'C4',1],[57,'C4',1],[58,'D4',1],[59,'E4',1],
  [60,'D4',1.5],[61.5,'C4',1.5],[63,'C4',2.6],
];
_mel.forEach(n=>{
  const midi = nameToMidi(n[1]);
  const accent = (n[0] % 4 === 0) ? 0.95 : 0.78;
  NOTES.push({ beat:n[0], midi:midi, dur:n[2], vel:accent });            // melody
  NOTES.push({ beat:n[0], midi:diatonicStepsDown(midi,2), dur:Math.max(0.6,n[2]*0.9), vel:0.42 }); // alto third below
});
// bass line, one root per bar (16 bars) + fifths on phrase downbeats
const BASS = [48,43,48,43, 48,43,48,48, 48,43,48,43, 48,43,48,48];
BASS.forEach((root,bar)=>{
  NOTES.push({ beat:bar*4, midi:root, dur:3.5, vel:0.62 });
  if(bar%4===0) NOTES.push({ beat:bar*4+2, midi:root+7, dur:1.5, vel:0.45 });

// final grand chord — the big payoff

/* ==========================================================================
   7. AUDIO — Karplus-Strong pluck, correct pitch (A4 = 440 Hz)
   ========================================================================== */
let audioCtx = null, masterGain = null, compNode = null, mediaDest = null;
const noteBuffers = {};
function initAudio(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.85;
  compNode = audioCtx.createDynamicsCompressor();
  compNode.threshold.value = -14; compNode.knee.value = 22; compNode.ratio.value = 5;
  masterGain.connect(compNode); compNode.connect(audioCtx.destination);
  mediaDest = audioCtx.createMediaStreamDestination();
  compNode.connect(mediaDest);
}
function ksBuffer(midi){
  if(noteBuffers[midi]) return noteBuffers[midi];
  const sr = audioCtx.sampleRate, freq = midiToFreq(midi);
  const dur = 3.4, len = Math.floor(sr*dur), N = Math.max(2, Math.round(sr/freq));
  const buf = audioCtx.createBuffer(1, len, sr);
  const out = buf.getChannelData(0);
  for(let i=0;i<N;i++) out[i] = (Math.random()*2-1) * (1 - 0.25*i/N);
  for(let i=N;i<len;i++){
    const a = out[i-N], b = out[i-N+1 < len ? i-N+1 : i];
    out[i] = 0.996 * 0.5 * (a + b);
  }
  // gentle attack de-click + long release fade
  const atk = Math.floor(sr*0.004);
  for(let i=0;i<atk;i++) out[i] *= i/atk;
  const rel = Math.floor(sr*0.6);
  for(let i=0;i<rel;i++) out[len-1-i] *= i/rel;
  // normalize
  let peak = 0; for(let i=0;i<len;i++){ const a = Math.abs(out[i]); if(a>peak) peak = a; }
  const norm = peak > 0 ? 0.9/peak : 1;
  for(let i=0;i<len;i++) out[i] *= norm;
  noteBuffers[midi] = buf;
  return buf;
}
function playNoteSound(midi, vel){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = ksBuffer(midi);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0012, vel*0.9), t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 3.3);
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(12000, 900 + vel*5200 + (midi-21)*38), t);
  lp.Q.value = 0.6;
  src.connect(lp); lp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 3.4);
}

/* ==========================================================================
   8. SIMULATION STATE & NOTE ENGINE
   ========================================================================== */
const sim = {
  time: 0,            // seconds since sim reset
  songBeats: 0,       // position in the tune (beats)
  playing: true,      // UI wants playback
  nextIdx: 0,
  pedalIdx: 0,
  pedalDown: false,
  active: [],         // sounding notes {midi, endBeat, manual, endTime}
  notesPlayed: 0,
};
function resetSimulation(){
  sim.time = 0; sim.songBeats = 0; sim.nextIdx = 0; sim.pedalIdx = 0; sim.pedalDown = false;
  sim.active.length = 0; sim.notesPlayed = 0;
  hammerTrig.fill(-1e9);
  strings.forEach(s=> s.energy = 0);
  keyTarget.fill(0); keyPress.fill(0); damperPos.fill(0);
  for(let m=21;m<=108;m++) keyGroups[m].rotation.x = 0;
}
function currentPedal(beat){
  let down = false;
  for(let i=0;i<PEDAL_EVENTS.length;i++){ if(PEDAL_EVENTS[i].beat <= beat + 1e-6) down = PEDAL_EVENTS[i].down; else break; }
  return down;
}
function triggerNote(midi, vel, durBeats, manual){
  sim.notesPlayed++;
  const i = midi - 21;
  hammerTrig[i] = sim.time;
  keyTarget[i] = 1;
  (stringsByNote[midi] || []).forEach(si => { strings[si].energy = 1; });
  sim.active.push({ midi:midi, endBeat: sim.songBeats + durBeats, manual: !!manual, endTime: sim.time + (durBeats ? 0 : 1.5) });
  playNoteSound(midi, vel);
  if(bench) bench.notesPlayed = sim.notesPlayed;
}
function releaseNote(note){
  const i = note.midi - 21;
  const stillHeld = sim.active.some(n => n !== note && n.midi === note.midi);
  if(!stillHeld && !note._pedalHeld) keyTarget[i] = 0;
}
function simulate(dt, opts){
  opts = opts || {};
  const silent = !!opts.silent, force = !!opts.force;
  sim.time += dt;
  const advancing = sim.playing || force;
  if(advancing) sim.songBeats += dt * (bench.tempo / 60);
  // fire due notes
  while(sim.nextIdx < NOTES.length && NOTES[sim.nextIdx].beat <= sim.songBeats + 1e-9){
    const n = NOTES[sim.nextIdx++];
    if(silent){ // visual-only trigger (seek) — still count & animate
      sim.notesPlayed++;
      const i = n.midi - 21;
      hammerTrig[i] = sim.time; keyTarget[i] = 1;
      (stringsByNote[n.midi]||[]).forEach(si => strings[si].energy = 1);
      sim.active.push({ midi:n.midi, endBeat:n.beat + n.dur, manual:false, endTime:0 });
    } else {
      triggerNote(n.midi, n.vel, n.dur, false);
    }
  }
  // pedal state
  sim.pedalDown = currentPedal(sim.songBeats);
  // note endings
  for(let i=sim.active.length-1; i>=0; i--){
    const n = sim.active[i];
    const over = n.manual ? (sim.time >= n.endTime) : (sim.songBeats >= n.endBeat);
    if(over){
      if(sim.pedalDown && !n.manual){ n._pedalHeld = true; sim.active[i] = n; if(sim.active.length){ /* keep */ } n.endBeat = Infinity; continue; }
      releaseNote(n); sim.active.splice(i,1);
    }
  }
  // sustained notes release when pedal lifts
  if(!sim.pedalDown){
    for(let i=sim.active.length-1; i>=0; i--){
      const n = sim.active[i];
      if(n._pedalHeld){ releaseNote(n); sim.active.splice(i,1); }
    }
  }
  // decay string energies (bass rings longer)
  for(let i=0;i<strings.length;i++){
    const s = strings[i];
    if(s.energy > 0.004) s.energy *= Math.exp(-dt * (0.55 + ((s.note-21)/87)*0.85));
    else s.energy = 0;
  }
  // smooth keys
  const k = Math.min(1, dt*11);
  for(let i=0;i<88;i++) keyPress[i] += (keyTarget[i]-keyPress[i])*k;
  // smooth dampers
  const dk = Math.min(1, dt*9);
  for(let i=0;i<88;i++){
    const target = (keyTarget[i] > 0.5 || sim.pedalDown) ? 1 : 0;
    damperPos[i] += (target - damperPos[i])*dk;
  }
}
const easeOutCubic = u => 1 - Math.pow(1-u, 3);
function updateVisuals(){
  // keys
  for(let m=21;m<=108;m++){
    const i = m-21;
    keyGroups[m].rotation.x = keyPress[i] * 0.030;
  }
  // hammers
  for(let i=0;i<88;i++){
    const p = sim.time - hammerTrig[i];
    let ang = HAMMER_REST;
    if(p >= 0 && p < 1.4){
      if(p < 0.07) ang = HAMMER_REST + (HAMMER_STRIKE-HAMMER_REST)*easeOutCubic(p/0.07);
      else ang = HAMMER_REST + (HAMMER_STRIKE-HAMMER_REST)*Math.exp(-(p-0.07)*6.2)*Math.cos((p-0.07)*17.5);
    }
    hammers[i].rotation.x = ang;
  }
  // dampers
  for(let i=0;i<88;i++) dampers[i].head.position.y = dampers[i].baseY + damperPos[i]*0.030;
  // strings — vibrate the overlay lines
  for(let i=0;i<strings.length;i++){
    const s = strings[i], line = vibLines[i];
    if(s.energy < 0.012){ line.material.opacity = 0; continue; }
    const pos = line.geometry.attributes.position;
    const amp = (s.wound ? 0.0062 : 0.0034) * s.energy;
    const visFreq = 9 + (s.note-21)*0.55;
    for(let j=0;j<VIB_N;j++){
      const f = j/(VIB_N-1);
      const env = Math.sin(f*Math.PI);
      const w = Math.sin(sim.time*visFreq + s.phase + f*Math.PI*2.2) * env * amp;
      const w2 = Math.cos(sim.time*visFreq*0.83 + s.phase*1.7 + f*Math.PI*1.4) * env * amp * 0.5;
      pos.setXYZ(j, s.p1.x + (s.p2.x-s.p1.x)*f + w, s.p1.y + (s.p2.y-s.p1.y)*f, s.p1.z + w2);
    }
    pos.needsUpdate = true;
    line.material.opacity = Math.min(0.9, s.energy*1.05);
  }
  // paper roll scroll + spools
  const prog = Math.max(0, Math.min(1, sim.songBeats / TOTAL_BEATS));
  rollTex.offset.y = 1 - ROLL_WIN - prog * (1 - ROLL_WIN);
  spoolTop.rotation.x = -prog * Math.PI * 7;
  spoolBottom.rotation.x = -prog * Math.PI * 9;
  // sustain pedal lyre
  const pedalTarget = sim.pedalDown ? 0.21 : 0;
  SUSTAIN_PEDAL.rotation.x += (pedalTarget - SUSTAIN_PEDAL.rotation.x) * 0.18;
  // candle flicker (deterministic in sim time)
  candleLight.intensity = 0.52 + 0.11*Math.sin(sim.time*11.3) + 0.06*Math.sin(sim.time*23.7 + 1.7) + 0.04*Math.sin(sim.time*5.1 + 0.4);
}

/* ==========================================================================
   9. SHOWCASE — cinematic 12 s camera path, deterministic seek()
   ========================================================================== */
const SHOWCASE_DURATION = 12.0;
const camPath = [
  { t:0.0,  pos:[ 3.6, 2.15,  2.6], tgt:[0, 1.02, -1.0] },   // wide parlour establishing
  { t:2.1,  pos:[ 1.7, 1.45,  1.15], tgt:[0, 0.92, -1.15] }, // approach three-quarter
  { t:4.0,  pos:[ 0.42, 0.98, 0.28], tgt:[0, 0.88, -0.95] }, // keys & hammers close-up
  { t:6.1,  pos:[-0.62, 1.16, -0.12], tgt:[0, 1.07, -0.93] },// paper roll / tracker close-up
  { t:8.0,  pos:[ 1.28, 1.28, -0.55], tgt:[0, 1.06, -1.1] }, // dampers & strings side angle
  { t:10.0, pos:[-2.35, 1.55, 1.35], tgt:[0, 0.98, -1.0] },  // lamp-side wide
  { t:12.0, pos:[ 3.05, 1.9,  2.75], tgt:[0, 1.0, -1.0] },   // hero pull-back
];
const smooth = u => u*u*(3-2*u);
const _vA = new THREE.Vector3(), _vB = new THREE.Vector3(), _tA = new THREE.Vector3(), _tB = new THREE.Vector3();
function showcaseCamAt(t){
  t = Math.max(0, Math.min(SHOWCASE_DURATION, t));
  let i = 0;
  while(i < camPath.length-2 && camPath[i+1].t < t) i++;
  const a = camPath[i], b = camPath[i+1];
  const u = smooth(Math.max(0, Math.min(1, (t - a.t) / (b.t - a.t))));
  _vA.fromArray(a.pos); _vB.fromArray(b.pos); _tA.fromArray(a.tgt); _tB.fromArray(b.tgt);
  camera.position.lerpVectors(_vA, _vB, u);
  _tA.lerp(_tB, u);
  camera.lookAt(_tA);
  return _tA;
}
let showcaseMode = false; // true while record-playing the showcase live
function applyBench(){
  bench.notesPlayed = sim.notesPlayed;
  let active = 0; for(let i=0;i<88;i++) if(keyTarget[i] > 0.5) active++;
  bench.activeKeys = active;
  bench.rollPosition = Math.max(0, Math.min(1, sim.songBeats / TOTAL_BEATS));
  // (bench.tempo already mirrors UI tempo)
}
function seek(t){
  t = Math.max(0, Math.min(SHOWCASE_DURATION, t || 0));
  const wasPlaying = sim.playing;
  resetSimulation();
  sim.playing = true;                       // force advance during fast-forward
  const step = 1/240;
  let acc = 0;
  while(acc < t - 1e-9){
    const dt = Math.min(step, t - acc);
    simulate(dt, { silent:true, force:true });
    acc += dt;
  }
  sim.playing = wasPlaying && false;        // leave paused; seek renders a still
  updateVisuals();
  controls.enabled = false;
  showcaseCamAt(t);
  applyBench();
  renderer.render(scene, camera);           // exactly one frame
  return true;
}
window.showcase = { duration: SHOWCASE_DURATION, seek: seek };

/* ==========================================================================
   10. INTERACTION — Space, arrows, A–K, click-to-play, record button
   ========================================================================== */
const playBtn = document.getElementById('playBtn');
const recordBtn = document.getElementById('recordBtn');
const tempoVal = document.getElementById('tempoVal');
const notesVal = document.getElementById('notesVal');
const keysVal = document.getElementById('keysVal');

const keySoundMap = { KeyA:60, KeyW:61, KeyS:62, KeyE:63, KeyD:64, KeyF:65, KeyT:66, KeyG:67, KeyY:68, KeyH:69, KeyU:70, KeyJ:71, KeyK:72 };
function manualNote(midi){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  triggerNote(midi, 0.82, 0, true);
}
function togglePlay(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  sim.playing = !sim.playing;
  playBtn.innerHTML = sim.playing ? '❚❚ Pause' : '▶ Play';
}
window.addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); if(document.activeElement) document.activeElement.blur(); togglePlay(); return; }
  if(e.code === 'ArrowUp'){ e.preventDefault(); bench.tempo = Math.min(208, bench.tempo + 4); tempoVal.textContent = bench.tempo; return; }
  if(e.code === 'ArrowDown'){ e.preventDefault(); bench.tempo = Math.max(48, bench.tempo - 4); tempoVal.textContent = bench.tempo; return; }
  const midi = keySoundMap[e.code];
  if(midi !== undefined && !e.repeat){ e.preventDefault(); manualNote(midi); }
});
// click a key to play it
const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e=>{
  const r = renderer.domElement.getBoundingClientRect();
  pointerNdc.x = ((e.clientX - r.left)/r.width)*2 - 1;
  pointerNdc.y = -((e.clientY - r.top)/r.height)*2 + 1;
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObjects(clickTargets, false);
  if(hits.length) manualNote(hits[0].object.userData.midi);
});
playBtn.addEventListener('click', ()=>{ playBtn.blur(); togglePlay(); });

// record showcase → webm (canvas stream + synthesized audio track)
let recording = false, recordT = 0, mediaRecorder = null, recordedChunks = [];
recordBtn.addEventListener('click', ()=>{
  recordBtn.blur();
  if(recording) return;
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  const canvasStream = renderer.domElement.captureStream(30);
  const tracks = canvasStream.getVideoTracks().concat(mediaDest ? mediaDest.stream.getAudioTracks() : []);
  const stream = new MediaStream(tracks);
  let mime = 'video/webm;codecs=vp9';
  if(!MediaRecorder.isTypeSupported || !MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
  try { mediaRecorder = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond: 12000000 }); }
  catch(err){ mediaRecorder = new MediaRecorder(stream); }
  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = ()=>{
    const blob = new Blob(recordedChunks, { type:'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'aurelia-showcase.webm';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    recording = false; showcaseMode = false;
    recordBtn.disabled = false; recordBtn.textContent = '⏺ Record Video';
    playBtn.innerHTML = sim.playing ? '❚❚ Pause' : '▶ Play';
    controls.enabled = true;
  };
  // reset the world and roll the showcase
  resetSimulation();
  sim.playing = false;            // we drive the sim manually below
  recordT = 0; showcaseMode = true; recording = true;
  controls.enabled = false;
  recordBtn.disabled = true; recordBtn.textContent = '● Recording…';
  mediaRecorder.start(250);
});

/* ==========================================================================
   11. MAIN LOOP
   ========================================================================== */
resetSimulation();
sim.playing = true;
const clock = new THREE.Clock();
let domTick = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if(recording && showcaseMode){
    recordT += dt;
    const t = Math.min(recordT, SHOWCASE_DURATION);
    simulate(dt, { silent:false, force:true });
    showcaseCamAt(t);
    if(recordT >= SHOWCASE_DURATION + 0.08){
      updateVisuals(); applyBench();
      renderer.render(scene, camera);
      if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      return;
    }
  } else {
    simulate(dt, { silent:false, force:false });
    if(controls.enabled) controls.update();
  }
  updateVisuals();
  applyBench();

  domTick++;
  if(domTick % 12 === 0){
    notesVal.textContent = bench.notesPlayed;
    keysVal.textContent = bench.activeKeys;
    if(tempoVal.textContent !== String(bench.tempo)) tempoVal.textContent = bench.tempo;
  }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Der Schwarzwald-Kuckuck — Chalet Cuckoo Clock</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#151009;font-family:Georgia,'Times New Roman',serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .panel{
    position:fixed;z-index:10;color:#e8d9b8;
    background:linear-gradient(160deg,rgba(38,26,16,.82),rgba(22,15,9,.82));
    border:1px solid rgba(214,178,106,.35);border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,235,190,.12);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:12px 16px;user-select:none;
  }
  #titleCard{top:16px;left:16px;max-width:330px;}
  #titleCard h1{margin:0 0 2px;font-size:19px;letter-spacing:.12em;font-variant:small-caps;color:#f3e3bd;text-shadow:0 2px 6px #000;}
  #titleCard p{margin:0 0 8px;font-size:11px;letter-spacing:.08em;color:#b79a63;font-style:italic;}
  #readout{display:flex;align-items:center;gap:12px;border-top:1px solid rgba(214,178,106,.28);padding-top:8px;}
  #clockTime{font-size:26px;letter-spacing:.14em;color:#ffd98a;text-shadow:0 0 14px rgba(255,190,90,.35);font-variant-numeric:tabular-nums;}
  #cuckooCount{font-size:12px;color:#d8c49a;letter-spacing:.06em;}
  #ffBadge{display:none;font-size:11px;color:#1d130a;background:#ffd98a;border-radius:5px;padding:2px 7px;letter-spacing:.1em;font-weight:bold;box-shadow:0 0 12px rgba(255,217,138,.6);}
  #hints{left:16px;bottom:16px;font-size:11.5px;line-height:1.85;color:#cbb684;letter-spacing:.03em;}
  #hints b{color:#f0dfae;font-variant:small-caps;letter-spacing:.08em;}
  kbd{display:inline-block;min-width:16px;text-align:center;background:#3a2a1b;border:1px solid rgba(214,178,106,.45);border-bottom-width:3px;border-radius:5px;padding:0 5px;font-size:10.5px;color:#ffe6a8;font-family:Georgia;}
  #recordBtn{
    position:fixed;z-index:11;top:16px;right:16px;cursor:pointer;
    font-family:Georgia,serif;font-size:13px;letter-spacing:.14em;font-variant:small-caps;
    color:#2a1a0c;padding:12px 20px;border-radius:10px;border:1px solid #8a6a2f;
    background:linear-gradient(180deg,#f4cd7d 0%,#d9a94f 45%,#a97a2e 100%);
    box-shadow:0 6px 22px rgba(0,0,0,.6), inset 0 1px 0 #fff3cf, inset 0 -3px 6px rgba(90,55,10,.5);
    transition:transform .15s, filter .15s;
  }
  #recordBtn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  #recordBtn:active{transform:translateY(1px);}
  #recordBtn.recording{background:linear-gradient(180deg,#e08a7a,#b6503c);color:#ffe9e2;border-color:#7c2f22;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,110,80,.7), inset 0 1px 0 #ffd2c4;}50%{box-shadow:0 0 26px 6px rgba(230,110,80,.55), inset 0 1px 0 #ffd2c4;}}
  #toast{
    position:fixed;z-index:12;top:70px;left:50%;transform:translate(-50%,-14px);
    color:#ffe9b0;background:rgba(30,20,12,.88);border:1px solid rgba(214,178,106,.4);
    padding:8px 18px;border-radius:24px;font-size:12px;letter-spacing:.1em;font-variant:small-caps;
    opacity:0;pointer-events:none;transition:opacity .3s, transform .3s;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
  @media (max-width:760px){ #hints{display:none;} #titleCard{max-width:230px;} }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>
<body>
<div id="app"></div>

<div id="titleCard" class="panel">
  <h1>Der Schwarzwald-Kuckuck</h1>
  <p>Chalet cuckoo clock · Black Forest, c. 1862</p>
  <div id="readout">
    <span id="clockTime">2:59</span>
    <span id="ffBadge">60×</span>
    <span id="cuckooCount">Cuckoos called: 0</span>
  </div>
</div>
<div id="hints" class="panel">
  <b>The Clockmaker’s Bench</b><br/>
  <kbd>Drag</kbd> the minute hand to set the time<br/>
  <kbd>F</kbd> toggle 60× fast-forward<br/>
  <kbd>Click</kbd> the cuckoo door for a call<br/>
  <kbd>Pull</kbd> a chain downward to rewind its weight<br/>
  <kbd>Drag</kbd> / <kbd>scroll</kbd> to orbit &amp; zoom the room
</div>
<button id="recordBtn">⏺&ensp;Record Showcase · 12 s</button>
<div id="toast"></div>

<script>
'use strict';
/* ============================================================================
   DER SCHWARZWALD-KUCKUCK
   A carved chalet cuckoo clock in a cosy wood-panelled room.
   Pendulum: T = 2*PI*sqrt(L/g) with L = 0.248 m  ->  T ~= 1.00 s.
   Gear train ratios derived from shaft bookkeeping; minute arbor = clock time.
   ========================================================================== */

// ---------- tiny helpers ----------
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(x,a,b)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const smooth01=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const TAU=Math.PI*2;

// ---------- procedural canvas textures ----------
function canvasTexture(size, draw, repeat){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d'); draw(ctx,size);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=8; t.encoding=THREE.sRGBEncoding;
  if(repeat) t.repeat.set(repeat[0],repeat[1]);
  return t;
}
function makeWoodTex(){
  return canvasTexture(512,(ctx,s)=>{
    const g=ctx.createLinearGradient(0,0,s,0);
    g.addColorStop(0,'#6e4a2a');g.addColorStop(.22,'#7f5734');g.addColorStop(.45,'#5d3e23');
    g.addColorStop(.68,'#7d5433');g.addColorStop(.85,'#66452a');g.addColorStop(1,'#6b4628');
    ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
    for(let i=0;i<110;i++){
      ctx.strokeStyle='rgba(42,23,11,'+(0.07+Math.random()*0.2)+')';
      ctx.lineWidth=0.6+Math.random()*2.4; ctx.beginPath();
      let y=Math.random()*s; ctx.moveTo(0,y);
      for(let x=0;x<=s;x+=24){ ctx.lineTo(x, y+Math.sin(x*0.018+i*1.7)*7+(Math.random()-0.5)*5); }
      ctx.stroke();
    }
    for(let i=0;i<8;i++){ const x=Math.random()*s,y=Math.random()*s;
      for(let r=2;r<17;r+=2.5){ ctx.strokeStyle='rgba(43,24,12,'+(0.4-r*0.022)+')'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.ellipse(x,y,r*1.7,r,0.3,0,7); ctx.stroke(); } }
    for(let i=0;i<1600;i++){ ctx.fillStyle='rgba('+(Math.random()>.5?'255,226,178':'18,10,5')+','+(Math.random()*0.055)+')';
      ctx.fillRect(Math.random()*s,Math.random()*s,2,2); }
  });
}
function makeFloorTex(){
  return canvasTexture(1024,(ctx,s)=>{
    ctx.fillStyle='#583a22'; ctx.fillRect(0,0,s,s);
    const rows=9, rh=s/rows;
    for(let r=0;r<rows;r++){
      const y=r*rh; const l=0.86+Math.random()*0.35;
      const g=ctx.createLinearGradient(0,y,0,y+rh);
      g.addColorStop(0,'rgb('+(96*l|0)+','+(63*l|0)+','+(36*l|0)+')');
      g.addColorStop(.5,'rgb('+(120*l|0)+','+(80*l|0)+','+(46*l|0)+')');
      g.addColorStop(1,'rgb('+(88*l|0)+','+(57*l|0)+','+(32*l|0)+')');
      ctx.fillStyle=g; ctx.fillRect(0,y,s,rh-3);
      ctx.fillStyle='rgba(20,10,4,.9)'; ctx.fillRect(0,y+rh-3,s,3);
      // plank butt joints
      let x=Math.random()*200;
      while(x<s){ ctx.fillRect(x,y,3,rh-3); x+=260+Math.random()*260; }
      // grain
      for(let i=0;i<26;i++){ ctx.strokeStyle='rgba(40,22,10,'+(0.1+Math.random()*0.2)+')';
        ctx.lineWidth=0.7+Math.random()*1.4; ctx.beginPath();
        const gy=y+Math.random()*rh; ctx.moveTo(0,gy);
        for(let px=0;px<=s;px+=40) ctx.lineTo(px,gy+Math.sin(px*0.02+i)*3); ctx.stroke(); }
    }
  },[2.4,2.4]);
}
function makePanelTex(){
  return canvasTexture(512,(ctx,s)=>{
    ctx.fillStyle='#65452b'; ctx.fillRect(0,0,s,s);
    const pw=128;
    for(let x=0;x<s;x+=pw){
      const l=0.88+Math.random()*0.28;
      const g=ctx.createLinearGradient(x,0,x+pw,0);
      g.addColorStop(0,'rgb('+(52*l|0)+','+(35*l|0)+','+(20*l|0)+')');
      g.addColorStop(.12,'rgb('+(108*l|0)+','+(74*l|0)+','+(44*l|0)+')');
      g.addColorStop(.5,'rgb('+(126*l|0)+','+(88*l|0)+','+(52*l|0)+')');
      g.addColorStop(.88,'rgb('+(104*l|0)+','+(70*l|0)+','+(41*l|0)+')');
      g.addColorStop(1,'rgb('+(48*l|0)+','+(32*l|0)+','+(18*l|0)+')');
      ctx.fillStyle=g; ctx.fillRect(x,0,pw,s);
      for(let i=0;i<20;i++){ ctx.strokeStyle='rgba(46,28,14,'+(0.15+Math.random()*0.25)+')';
        ctx.lineWidth=0.6; ctx.beginPath(); const gx=x+Math.random()*pw;
        ctx.moveTo(gx,0); ctx.lineTo(gx+(Math.random()-0.5)*14,s); ctx.stroke(); }
    }
  },[4,1]);
}
function makeShingleTex(){
  return canvasTexture(512,(ctx,s)=>{
    ctx.fillStyle='#2c2018'; ctx.fillRect(0,0,s,s);
    const rh=52, sw=58;
    for(let row=0;row<11;row++){
      const y=row*rh, off=(row%2)*sw*0.5;
      for(let x=-sw;x<s+sw;x+=sw){
        const l=0.75+Math.random()*0.5;
        const g=ctx.createLinearGradient(0,y,0,y+rh);
        g.addColorStop(0,'rgb('+(74*l|0)+','+(52*l|0)+','+(34*l|0)+')');
        g.addColorStop(.82,'rgb('+(56*l|0)+','+(38*l|0)+','+(24*l|0)+')');
        g.addColorStop(1,'rgb(22,14,8)');
        ctx.fillStyle=g; ctx.fillRect(x+off+1,y,sw-2,rh-2);
        ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(x+off+1,y+rh-7,sw-2,5);
      }
    }
  },[3,1.6]);
}
function makeDialTex(){
  const c=document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(256,256,30,256,256,256);
  g.addColorStop(0,'#f7eed8'); g.addColorStop(.72,'#eee0bf'); g.addColorStop(.93,'#d9c69c'); g.addColorStop(1,'#b3a074');
  ctx.fillStyle=g; ctx.fillRect(0,0,512,512);
  // aged blotches
  for(let i=0;i<26;i++){ ctx.fillStyle='rgba(150,120,70,'+(0.04+Math.random()*0.07)+')';
    ctx.beginPath(); ctx.ellipse(Math.random()*512,Math.random()*512,20+Math.random()*70,14+Math.random()*50,Math.random()*3,0,7); ctx.fill(); }
  // outer rings
  ctx.strokeStyle='#7a5a22'; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(256,256,238,0,7); ctx.stroke();
  ctx.strokeStyle='#c8a24a'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(256,256,224,0,7); ctx.stroke();
  // minute track
  for(let i=0;i<60;i++){ const a=i/60*TAU, big=i%5===0;
    ctx.save(); ctx.translate(256,256); ctx.rotate(a);
    ctx.fillStyle= big?'#241608':'#4a3418';
    ctx.fillRect(big?-2.6:-1.1, -210, big?5.2:2.2, big?26:12); ctx.restore(); }
  // roman numerals
  const numerals=['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
  ctx.fillStyle='#241408'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 44px Georgia';
  for(let i=0;i<12;i++){ const a=i/12*TAU;
    ctx.save(); ctx.translate(256+Math.sin(a)*168, 256-Math.cos(a)*168); ctx.fillText(numerals[i],0,2); ctx.restore(); }
  // brand
  ctx.font='small-caps bold 21px Georgia'; ctx.fillStyle='#4a3414';
  ctx.fillText('S C H W A R Z W A L D',256,158);
  ctx.font='italic 15px Georgia'; ctx.fillStyle='#6a5024';
  ctx.fillText('— geschnitzt · 1862 —',256,360);
  const t=new THREE.CanvasTexture(c); t.anisotropy=8; t.encoding=THREE.sRGBEncoding; return t;
}
function makePineTex(){
  return canvasTexture(256,(ctx,s)=>{
    ctx.fillStyle='#3c2412'; ctx.fillRect(0,0,s,s);
    for(let row=0;row<8;row++){ const y=row*34; const off=(row%2)*26;
      for(let x=-26;x<s+26;x+=52){
        const g=ctx.createRadialGradient(x+off+26,y+16,2,x+off+26,y+16,26);
        g.addColorStop(0,'#6b4423'); g.addColorStop(.6,'#4a2c15'); g.addColorStop(1,'#241205');
        ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x+off+26,y+15,24,15,0,0,7); ctx.fill();
        ctx.strokeStyle='rgba(20,10,4,.7)'; ctx.lineWidth=1.5; ctx.stroke();
      } }
  });
}
function makeRugTex(){
  return canvasTexture(512,(ctx,s)=>{
    ctx.fillStyle='#6d2620'; ctx.fillRect(0,0,s,s);
    ctx.strokeStyle='#c8a24a'; ctx.lineWidth=14; ctx.strokeRect(18,18,s-36,s-36);
    ctx.strokeStyle='#2e4a3a'; ctx.lineWidth=6; ctx.strokeRect(44,44,s-88,s-88);
    ctx.strokeStyle='#c8a24a'; ctx.lineWidth=3; ctx.strokeRect(58,58,s-116,s-116);
    // medallion
    ctx.save(); ctx.translate(s/2,s/2);
    for(let i=3;i>=0;i--){ ctx.rotate(Math.PI/4);
      ctx.strokeStyle=i%2?'#c8a24a':'#2e4a3a'; ctx.lineWidth=5;
      ctx.strokeRect(-(30+i*42),-(30+i*42),(30+i*42)*2,(30+i*42)*2); }
    ctx.restore();
    ctx.fillStyle='#c8a24a'; ctx.beginPath(); ctx.arc(s/2,s/2,26,0,7); ctx.fill();
    ctx.fillStyle='#2e4a3a'; ctx.beginPath(); ctx.arc(s/2,s/2,15,0,7); ctx.fill();
    // corner motifs
    [[80,80],[s-80,80],[80,s-80],[s-80,s-80]].forEach(([x,y])=>{
      ctx.fillStyle='#c8a24a'; ctx.beginPath(); ctx.ellipse(x,y,26,13,0,0,7); ctx.fill(); });
    for(let i=0;i<900;i++){ ctx.fillStyle='rgba(0,0,0,'+Math.random()*0.08+')'; ctx.fillRect(Math.random()*s,Math.random()*s,2,2); }
  });
}
function makeSkyTex(){
  return canvasTexture(512,(ctx,s)=>{
    const g=ctx.createLinearGradient(0,0,0,s);
    g.addColorStop(0,'#8fc3e8'); g.addColorStop(.42,'#bcd9ec'); g.addColorStop(.68,'#f2ddb0'); g.addColorStop(.82,'#f7c98a'); g.addColorStop(1,'#e8b070');
    ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
    // sun
    const sg=ctx.createRadialGradient(s*0.68,s*0.62,4,s*0.68,s*0.62,110);
    sg.addColorStop(0,'rgba(255,252,230,1)'); sg.addColorStop(.35,'rgba(255,238,190,.9)'); sg.addColorStop(1,'rgba(255,238,190,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,0,s,s);
    // far hills
    ctx.fillStyle='#7d8f74'; ctx.beginPath(); ctx.moveTo(0,s*0.72);
    ctx.bezierCurveTo(s*0.2,s*0.6,s*0.34,s*0.74,s*0.52,s*0.66);
    ctx.bezierCurveTo(s*0.68,s*0.6,s*0.8,s*0.73,s,s*0.68); ctx.lineTo(s,s); ctx.lineTo(0,s); ctx.fill();
    // birds
    ctx.strokeStyle='rgba(40,40,40,.75)'; ctx.lineWidth=2;
    [[0.22,0.3],[0.3,0.24],[0.6,0.2]].forEach(([bx,by])=>{
      ctx.beginPath(); ctx.moveTo(s*bx-9,s*by); ctx.quadraticCurveTo(s*bx,s*by-7,s*bx+9,s*by); ctx.stroke(); });
  });
}
function makePaintingTex(){
  return canvasTexture(256,(ctx,s)=>{
    const g=ctx.createLinearGradient(0,0,0,s);
    g.addColorStop(0,'#a8c8dd'); g.addColorStop(.55,'#e8d3a0'); g.addColorStop(.62,'#5a7050'); g.addColorStop(1,'#33402c');
    ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
    ctx.fillStyle='#43543a';
    ctx.beginPath(); ctx.moveTo(0,150); ctx.lineTo(70,88); ctx.lineTo(128,150); ctx.lineTo(185,102); ctx.lineTo(256,150); ctx.lineTo(256,168); ctx.lineTo(0,168); ctx.fill();
    ctx.fillStyle='#22301e'; ctx.beginPath(); ctx.ellipse(190,196,26,52,0,Math.PI,0); ctx.fill();
    ctx.fillRect(186,196,8,30);
  });
}
function radialSpriteTex(inner, outer){
  const c=document.createElement('canvas'); c.width=c.height=128; const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,inner); g.addColorStop(1,outer);
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
const woodTex=makeWoodTex(), floorTex=makeFloorTex(), panelTex=makePanelTex(),
      shingleTex=makeShingleTex(), dialTex=makeDialTex(), pineTex=makePineTex(),
      rugTex=makeRugTex(), skyTex=makeSkyTex(), paintingTex=makePaintingTex();
const glowTex=radialSpriteTex('rgba(255,244,214,1)','rgba(255,244,214,0)');
const smokeTex=radialSpriteTex('rgba(206,202,196,.85)','rgba(206,202,196,0)');
const flameTex=radialSpriteTex('rgba(255,226,150,1)','rgba(255,140,40,0)');

// ---------- renderer / scene / camera ----------
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x120c07);
scene.fog=new THREE.FogExp2(0x181009,0.045);

const camera=new THREE.PerspectiveCamera(46,window.innerWidth/window.innerHeight,0.05,60);
camera.position.set(2.0,2.12,1.62);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.92,-1.8);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.minDistance=0.55; controls.maxDistance=5.2;
controls.maxPolarAngle=Math.PI*0.62; controls.minPolarAngle=Math.PI*0.18;
controls.enablePan=false;
controls.update();

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xbccfdd,0x4a3423,0.5));
const fill=new THREE.DirectionalLight(0xa8c0d8,0.28); fill.position.set(1.5,2.5,4.5); scene.add(fill);

const sun=new THREE.DirectionalLight(0xffe6bd,1.5);           // daylight through the window
sun.position.set(-2.7,2.55,-0.15); sun.target.position.set(0.4,1.75,-1.95);
sun.castShadow=true; sun.shadow.mapSize.set(4096,4096);
sun.shadow.camera.near=0.5; sun.shadow.camera.far=9;
sun.shadow.camera.left=-2.6; sun.shadow.camera.right=2.6;
sun.shadow.camera.top=3.2; sun.shadow.camera.bottom=-1.2;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun); scene.add(sun.target);

const lampLight=new THREE.PointLight(0xffb066,1.25,7,2);      // warm lamp
lampLight.position.set(2.12,1.14,0.55); scene.add(lampLight);
const lampSpot=new THREE.SpotLight(0xffc98a,0.85,6,Math.PI/4.6,0.5,1.6);
lampSpot.position.set(2.12,1.28,0.55); lampSpot.target.position.set(2.12,0,0.55);
lampSpot.castShadow=true; lampSpot.shadow.mapSize.set(1024,1024);
lampSpot.shadow.bias=-0.0004; lampSpot.shadow.normalBias=0.02;
scene.add(lampSpot); scene.add(lampSpot.target);

// ---------- materials ----------
const MAT={
  wood:new THREE.MeshStandardMaterial({map:woodTex,roughness:0.72,metalness:0.04}),

function makeGearGeo(teeth,module_,thickness,spokeHoles){
  const rPitch=module_*teeth/2, rOut=rPitch+module_*0.92, rRoot=rPitch-module_*0.78;
  const s=new THREE.Shape(); const step=TAU/teeth;
  for(let i=0;i<teeth;i++){
    const a=i*step;
    const pts=[[a,rRoot],[a+step*0.24,rRoot],[a+step*0.32,rOut],[a+step*0.52,rOut],[a+step*0.60,rRoot]];
    pts.forEach(([ang,r],j)=>{
      const x=Math.cos(ang)*r, y=Math.sin(ang)*r;
      if(i===0&&j===0) s.moveTo(x,y); else s.lineTo(x,y);
    });
  }
  s.closePath();
  // hub hole
  const hub=new THREE.Path(); hub.absarc(0,0,Math.max(0.011,rPitch*0.16),0,TAU,true); s.holes.push(hub);
  // spoke holes
  if(spokeHoles&&rPitch>0.055){
    const n=4, ringR=rPitch*0.55, holeR=rPitch*0.21;
    for(let i=0;i<n;i++){ const a=i/n*TAU+0.4;
      const p=new THREE.Path(); p.absarc(Math.cos(a)*ringR,Math.sin(a)*ringR,holeR,0,TAU,true); s.holes.push(p); }
  }
  const g=new THREE.ExtrudeGeometry(s,{depth:thickness,bevelEnabled:true,bevelThickness:0.004,bevelSize:0.004,bevelSegments:1,curveSegments:10});
  g.center(); return g;
}

const SMOKE_N=42;
const smokePool=[];
for(let i=0;i<SMOKE_N;i++){
  const m=new THREE.SpriteMaterial({map:smokeTex,color:0xcfc9c0,transparent:true,depthWrite:false,opacity:0});
  const sp=new THREE.Sprite(m); sp.visible=false; scene.add(sp);
  smokePool.push({sprite:sp,active:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,birth:0,life:1,size:0.05,seed:0});
}
function spawnSmoke(n){
  for(let i=0;i<n;i++){
    const p=smokePool.find(q=>!q.active); if(!p) return;
    p.active=true; p.birth=S.simT;
    p.x=CHIMNEY.x+(Math.random()-0.5)*0.03; p.y=CHIMNEY.topY; p.z=CHIMNEY.z+(Math.random()-0.5)*0.03;
    p.vx=(Math.random()-0.5)*0.05+0.02; p.vy=0.16+Math.random()*0.09; p.vz=(Math.random()-0.5)*0.04;
    p.life=1.5+Math.random()*0.7; p.size=0.05+Math.random()*0.035; p.seed=Math.random()*10;
  }
}
function clearSmoke(){ smokePool.forEach(p=>{p.active=false;p.sprite.visible=false;}); }
function updateSmoke(){
  for(const p of smokePool){
    if(!p.active){ p.sprite.visible=false; continue; }
    const age=S.simT-p.birth;
    if(age>p.life){ p.active=false; p.sprite.visible=false; continue; }
    const u=age/p.life;
    p.sprite.visible=true;
    p.sprite.position.set(
      p.x+p.vx*age+Math.sin(age*3.1+p.seed)*0.028,
      p.y+p.vy*age+0.045*age*age,
      p.z+p.vz*age);
    const sc=p.size*(1+age*2.1); p.sprite.scale.set(sc,sc,1);
    p.sprite.material.opacity=0.62*(1-u)*(u<0.12?u/0.12:1);
  }
}

const SHOWCASE_START_MIN=179.1667;   // 2:59:10 — strike lands early in the show
const SHOW_DUR=12.0;
const S={
  simT:0, clockMin:INTERACTIVE_START_MIN, pendPhase:0,
  timeH:0.78, strikeH:0.9, cuckoos:0,
  fast:false, strike:null, lastCallT:-100, beak:0,
  doorOpen:0, cuckooExt:0, dancePhase:0, danceBoost:0, wheelSpin:0,
  lastHalfBeat:0, stalled:false
};
function resetSim(startMin,fast){
  S.simT=0; S.clockMin=startMin; S.pendPhase=0.6;
  S.timeH=0.78; S.strikeH=0.9; S.cuckoos=0;
  S.fast=fast; S.strike=null; S.lastCallT=-100; S.beak=0;
  S.doorOpen=0; S.cuckooExt=0; S.dancePhase=0; S.danceBoost=0; S.wheelSpin=0;
  S.lastHalfBeat=0; S.stalled=false; clearSmoke();
}
function hourCountFor(boundary){ const h=((boundary%720)+720)%720/60; return h===0?12:h; }
function startStrike(count,kind){
  if(S.strike) return; // one strike at a time
  S.strike={kind,count,left:count,t0:S.simT,next:S.simT+(kind==='manual'?0.35:1.05)};
}
function doCall(){
  S.cuckoos++; S.strikeH=Math.max(0,S.strikeH-0.013);   // strike weight drops per call
  S.lastCallT=S.simT; S.danceBoost=1; spawnSmoke(6); playCuckoo();
}
function stepSim(dt){
  S.simT+=dt;
  const speed=S.fast?60:1;
  // pendulum — period fixed by its length
  S.pendPhase+=dt*(TAU/PEND_T);
  // escapement tick (half-beat)
  const half=Math.floor(S.pendPhase/Math.PI);
  if(half!==S.lastHalfBeat){ S.lastHalfBeat=half; if(!S.fast) playTick(half%2?1640:1320); }
  // hands
  const stalled=S.timeH<=0.012;
  if(stalled && !S.stalled){ S.stalled=true; toast('The time weight has run down — pull the left chain'); }
  const prevMin=S.clockMin;
  if(!stalled) S.clockMin+=dt*speed/60;
  let cur=S.clockMin;
  if(cur>=720){ cur-=720; S.clockMin=cur; }
  // boundary crossings (:00 hours and :30 halves), wrap-safe
  let p=prevMin, c=prevMin+((cur-prevMin+720)%720);
  for(let b=Math.floor(p/30)*30+30;b<=c;b+=30){
    const bb=b%720;
    if(bb%60===0) startStrike(hourCountFor(bb),'hour'); else startStrike(1,'half');
  }
  // time weight sinks (very slowly)
  if(!stalled) S.timeH=Math.max(0,S.timeH-dt*speed*(1/(5*3600)));
  // strike sequencer
  if(S.strike){
    const st=S.strike;
    if(S.simT>=st.next && st.left>0){ doCall(); st.left--; st.next+=0.62; }
    const end=st.t0+1.05+st.count*0.62+1.15;
    if(S.simT>=end && S.doorOpen<0.02) S.strike=null;
  }
  // door / cuckoo easing
  let doorTgt=0, extTgt=0;
  if(S.strike){
    const st=S.strike, end=st.t0+1.05+st.count*0.62+1.15;
    if(S.simT<end) doorTgt=1;
    if(S.simT>st.t0+0.42 && S.simT<end-0.4) extTgt=1;
  }
  S.doorOpen+=(doorTgt-S.doorOpen)*Math.min(1,dt*5.2);
  S.cuckooExt+=(extTgt-S.cuckooExt)*Math.min(1,dt*4.2);
  S.cuckooExt=clamp(S.cuckooExt,0,1);
  // beak envelope — two notes per call (note at 0 and +0.36 s)
  const since=S.simT-S.lastCallT;
  const note=u=>{ const x=(u+0.03)/0.3; return (u<-0.03||x>=1)?0:Math.sin(Math.PI*x); };
  S.beak=clamp(note(since)+note(since-0.36),0,1.35);
  // dancers & waterwheel
  S.danceBoost=Math.max(0,S.danceBoost-dt*0.15);
  S.dancePhase+=dt*(0.55+S.danceBoost*5.1);
  S.wheelSpin+=dt*(0.35+S.danceBoost*4.7);
}

// ================= audio (WebAudio, all synthesized) =================
let AC=null;
function audioCtx(){ try{
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}catch(e){ return null; } }
function cuckooTone(freq,t0,dur,vol){
  const ac=audioCtx(); if(!ac) return;
  const o1=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain(), bp=ac.createBiquadFilter();
  o1.type='sine'; o1.frequency.value=freq;
  o2.type='triangle'; o2.frequency.value=freq*2.001;
  const g2=ac.createGain(); g2.gain.value=0.32;
  // gentle vibrato
  const lfo=ac.createOscillator(), lfoG=ac.createGain();
  lfo.frequency.value=24; lfoG.gain.value=freq*0.006; lfo.connect(lfoG); lfoG.connect(o1.frequency);
  bp.type='bandpass'; bp.frequency.value=freq*1.7; bp.Q.value=2.1;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.018);
  g.gain.setValueAtTime(vol,t0+dur*0.55);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(bp); bp.connect(ac.destination);
  o1.start(t0); o2.start(t0); lfo.start(t0);
  o1.stop(t0+dur+0.02); o2.stop(t0+dur+0.02); lfo.stop(t0+dur+0.02);
}
function playCuckoo(){ // "cu-koo" — a descending minor third
  const ac=audioCtx(); if(!ac) return;
  const t=ac.currentTime+0.02;
  cuckooTone(1318.5,t,0.24,0.5);       // E6
  cuckooTone(1046.5,t+0.36,0.3,0.55);  // C6
}
function playTick(f){
  const ac=audioCtx(); if(!ac) return;
  const t=ac.currentTime; const o=ac.createOscillator(), g=ac.createGain();
  o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(0.028,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.03);
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
  o.connect(g); g.connect(hp); hp.connect(ac.destination); o.start(t); o.stop(t+0.035);
}
function playRatchet(){
  const ac=audioCtx(); if(!ac) return;
  const t=ac.currentTime; const o=ac.createOscillator(), g=ac.createGain();
  o.type='square'; o.frequency.value=2400+Math.random()*500;
  g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.022);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.025);
}

// ================= visual sync =================
function smoothDoor(v){ return smooth01(v); }
const bench={time:S.clockMin, pendulumAngle:0, cuckoos:0, weightHeight:S.timeH};
window.__bench=bench;

function updateVisuals(){
  const m=S.clockMin;
  // hands — minute hand stepped by the escapement in 2-second ticks
  const hourA=(m/720)*TAU;
  const stepMin=2/60, qMin=Math.floor(m/stepMin)*stepMin;
  const minA=(qMin/60)*TAU;
  const secA=((m*60)%60)/60*TAU;
  hourHand.rotation.z=-hourA; minuteHand.rotation.z=-minA; secondHand.rotation.z=-secA;
  // pendulum
  const pendAngle=Math.sin(S.pendPhase)*PEND_AMP;
  pendGroup.rotation.z=pendAngle;
  verge.rotation.z=-pendAngle*0.9;
  // gear train — ratios from shaft bookkeeping, driven by the stepped minute arbor
  let ang=minA, sign=1;
  for(let i=gears.length-1;i>=0;i--){
    gears[i].mesh.rotation.z=ang*sign;
    if(i>0){ const ratio=gearDefs[i].teeth/gearDefs[i-1].teeth; ang=ang*ratio; sign=-sign; }
  }
  // weights + chains
  const wTop=1.362;
  [[weightTime,S.timeH],[weightStrike,S.strikeH]].forEach(([w,H])=>{
    const y=lerp(0.52,1.155,clamp(H,0,1)); w.group.position.y=y;
    const len=Math.max(0.02,wTop-(y+0.155));
    w.chain.scale.y=len; w.chain.position.set(w.x,wTop-len/2,-1.705);
  });
  // door + cuckoo
  const open=smoothDoor(S.doorOpen);
  hinge.rotation.x=-open*1.82;
  const ext=smooth01(S.cuckooExt);
  const bob=Math.sin(S.simT*10.5)*0.017*ext + Math.sin(S.simT*2.2)*0.004*ext + S.beak*0.008;
  cuckoo.position.set(0, 2.845+bob, lerp(-1.745,-1.555,ext));
  cuckoo.rotation.y=Math.sin(S.simT*1.7)*0.28*ext;
  cuckoo.rotation.z=Math.sin(S.simT*10.5+0.6)*0.06*ext;
  cuckooHead.rotation.x=S.beak*0.38;
  beakLower.rotation.x=S.beak*0.55;
  const flap=(0.3+0.7*clamp(S.beak,0,1))*ext;
  wingL.rotation.z= 0.25+flap*(0.55+Math.sin(S.simT*16)*0.5);
  wingR.rotation.z=-0.25-flap*(0.55+Math.sin(S.simT*16+Math.PI)*0.5);
  // dancers — spin & wave while celebrating the hour
  dancers.forEach((d,i)=>{
    const ph=S.dancePhase+d.userData.phase;
    d.rotation.y=ph*1.15;
    d.position.y=balcY+0.028+Math.abs(Math.sin(ph*2))*0.018*(0.4+S.danceBoost);
    const wave=Math.sin(ph*2+i)* (0.35+S.danceBoost*0.75);
    d.userData.armL.rotation.z= 1.5+wave;
    d.userData.armR.rotation.z=-1.5-wave;
  });
  // waterwheel
  wheel.rotation.z=-S.wheelSpin;
  // sconce flames flicker
  sconces.forEach(s=>{
    const f=0.85+0.3*Math.sin(S.simT*11+s.seed*13)+0.12*Math.sin(S.simT*27+s.seed*7);
    s.flame.scale.set(1,f,1); s.glow.scale.set(0.13*f+0.06,0.17*f+0.06,1);
  });
  lampGlow.material.opacity=0.68+0.09*Math.sin(S.simT*7.3)+0.05*Math.sin(S.simT*17.7);
  updateSmoke();
  // readout UI
  const hh=Math.floor(m/60)||12, mm=Math.floor(m%60), ss=Math.floor((m*60)%60);
  clockTimeEl.textContent=hh+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  ffBadge.style.display=S.fast?'inline-block':'none';
  cuckooCountEl.textContent='Cuckoos called: '+S.cuckoos;
  // bench
  bench.time=m; bench.pendulumAngle=pendAngle; bench.cuckoos=S.cuckoos; bench.weightHeight=S.timeH;
}

// ================= interaction =================
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const clockTimeEl=document.getElementById('clockTime');
const ffBadge=document.getElementById('ffBadge');
const cuckooCountEl=document.getElementById('cuckooCount');
const toastEl=document.getElementById('toast');
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2400);
}
function setPointer(e){
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;
  pointer.y=-((e.clientY-r.top)/r.height)*2+1;
}
const dialPlane=new THREE.Plane(new THREE.Vector3(0,0,1),-(frontZ+0.055));
const chainPlane=new THREE.Plane(new THREE.Vector3(0,0,1),1.705);
let dragMode=null, dragSide=null, dragStartY=0, dragStartH=0, downPos=null, lastRatchet=0;

renderer.domElement.addEventListener('pointerdown',e=>{
  if(showcaseRunning) return;
  setPointer(e); raycaster.setFromCamera(pointer,camera);
  downPos={x:e.clientX,y:e.clientY};
  const doorHit=raycaster.intersectObjects(doorHitMeshes,false);
  const chainHit=raycaster.intersectObjects(chainHitMeshes,false);
  const handHit=raycaster.intersectObject(grabDisk,false);
  if(doorHit.length){ dragMode='door'; controls.enabled=false; }
  else if(chainHit.length){
    dragMode='chain'; dragSide=chainHit[0].object.userData.side;
    const pt=new THREE.Vector3(); raycaster.ray.intersectPlane(chainPlane,pt);
    dragStartY=pt.y; dragStartH=dragSide==='time'?S.timeH:S.strikeH; lastRatchet=dragStartH;
    controls.enabled=false;
  }
  else if(handHit.length){ dragMode='hand'; controls.enabled=false; renderer.domElement.style.cursor='grabbing'; }
  else dragMode=null;
  if(dragMode) renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(showcaseRunning) return;
  setPointer(e); raycaster.setFromCamera(pointer,camera);
  if(dragMode==='hand'){
    const pt=new THREE.Vector3();
    if(raycaster.ray.intersectPlane(dialPlane,pt)){
      const dx=pt.x, dy=pt.y-DIAL_Y;
      let ang=Math.atan2(dx,dy); if(ang<0) ang+=TAU;          // 0 at XII, clockwise
      const newMin=ang/TAU*60;
      const cur=S.clockMin, base=Math.floor(cur/60)*60, curMin=cur-base;
      let delta=newMin-curMin;
      if(delta>30) delta-=60; if(delta<=-30) delta+=60;
      S.clockMin=(cur+delta+720)%720;
    }
  } else if(dragMode==='chain'){
    const pt=new THREE.Vector3();
    if(raycaster.ray.intersectPlane(chainPlane,pt)){
      const H=clamp(dragStartH+(dragStartY-pt.y)*1.35,0.02,1);   // pull down → weight rises
      if(dragSide==='time') S.timeH=H; else S.strikeH=H;
      if(Math.abs(H-lastRatchet)>0.035){ lastRatchet=H; playRatchet(); }
    }
  } else if(!dragMode){
    const hover=raycaster.intersectObjects([...doorHitMeshes,...chainHitMeshes,grabDisk],false);
    renderer.domElement.style.cursor=hover.length?'pointer':'grab';
  }
});
window.addEventListener('pointerup',e=>{
  if(dragMode==='door' && downPos){
    const moved=Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y);
    if(moved<6){ if(!S.strike){ startStrike(1,'manual'); toast('Cuckoo!'); } }
  }
  dragMode=null; controls.enabled=true; renderer.domElement.style.cursor='default';
});
window.addEventListener('keydown',e=>{
  if(e.code==='KeyF' && !showcaseRunning){
    S.fast=!S.fast; toast(S.fast?'Fast-forward 60×':'Normal time'); 
  }
});

// ================= bloom (with graceful fallback) =================
let composer=null, bloomPass=null;
try{
  if(THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass){
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),0.34,0.72,0.82);
    composer.addPass(bloomPass);
  }
}catch(err){ composer=null; }
function render(){ if(composer) composer.render(); else renderer.render(scene,camera); }

// ================= showcase (12 s, deterministic) =================
const SHOW_KF=[
  {t:0.0,  pos:[2.45,2.32,1.75],  look:[0,1.95,-1.8]},
  {t:1.5,  pos:[1.2,2.2,-0.1],    look:[0,2.3,-1.72]},
  {t:3.3,  pos:[0.55,2.02,-0.62], look:[0,2.42,-1.64]},   // door + dial, cuckoo calls
  {t:4.9,  pos:[-0.82,1.8,-0.52], look:[-0.05,1.72,-1.54]},// balcony — dancers turning
  {t:6.8,  pos:[1.62,2.24,-0.72], look:[0.66,2.08,-1.83]}, // gear-train cut-away
  {t:8.7,  pos:[0.95,0.95,-0.3],  look:[0.05,1.18,-1.72]}, // pendulum & weights
  {t:10.7, pos:[2.6,2.5,2.15],    look:[0,1.92,-1.8]},
  {t:12.0, pos:[2.45,2.32,1.75],  look:[0,1.95,-1.8]},
];
function samplePath(t){
  t=clamp(t,0,SHOW_DUR);
  let i=0; while(i<SHOW_KF.length-2 && t>SHOW_KF[i+1].t) i++;
  const a=SHOW_KF[i], b=SHOW_KF[i+1];
  const u=smooth01((t-a.t)/Math.max(1e-6,b.t-a.t));
  return {
    pos:new THREE.Vector3(lerp(a.pos[0],b.pos[0],u),lerp(a.pos[1],b.pos[1],u),lerp(a.pos[2],b.pos[2],u)),
    look:new THREE.Vector3(lerp(a.look[0],b.look[0],u),lerp(a.look[1],b.look[1],u),lerp(a.look[2],b.look[2],u))
  };
}
function seek(t){
  t=clamp(t,0,SHOW_DUR);
  // deterministic re-run from a fixed initial state with a fixed timestep
  resetSim(SHOWCASE_START_MIN,true);
  const dt=1/240; let rem=t;
  while(rem>1e-9){ const h=Math.min(dt,rem); stepSim(h); rem-=h; }
  const cam=samplePath(t);
  camera.position.copy(cam.pos); camera.lookAt(cam.look);
  updateVisuals();
  render();
}
window.showcase={duration:SHOW_DUR, seek};

// ---------- Record video ----------
const recordBtn=document.getElementById('recordBtn');
let showcaseRunning=false, mediaRecorder=null, recordedChunks=[], showT0=0;
let savedCamPos=null, savedCamTarget=null;
function pickMime(){
  const cand=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  for(const m of cand){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return 'video/webm';
}
recordBtn.addEventListener('click',()=>{
  if(showcaseRunning) return;
  savedCamPos=camera.position.clone(); savedCamTarget=controls.target.clone();
  showcaseRunning=true; controls.enabled=false;
  recordedChunks=[];
  const stream=renderer.domElement.captureStream(60);
  const mime=pickMime();
  try{ mediaRecorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16_000_000}); }
  catch(e){ mediaRecorder=new MediaRecorder(stream); }
  mediaRecorder.ondataavailable=e=>{ if(e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop=()=>{
    const type=mediaRecorder.mimeType||'video/webm';
    const ext=type.indexOf('mp4')>=0?'mp4':'webm';
    const blob=new Blob(recordedChunks,{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='cuckoo-clock-showcase.'+ext;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    // restore the interactive scene
    showcaseRunning=false; controls.enabled=true;
    camera.position.copy(savedCamPos); controls.target.copy(savedCamTarget); controls.update();
    resetSim(INTERACTIVE_START_MIN,false);
    recordBtn.classList.remove('recording'); recordBtn.textContent='⏺ Record Showcase · 12 s';
    toast('Showcase saved as .'+ext);
  };
  recordBtn.classList.add('recording');
  showT0=performance.now();
  seek(0);
  mediaRecorder.start(250);
});

// ================= boot & main loop =================
resetSim(INTERACTIVE_START_MIN,false);
updateVisuals();

let last=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  if(showcaseRunning){
    const t=(now-showT0)/1000;
    recordBtn.textContent='⏺ Recording… '+Math.max(0,SHOW_DUR-t).toFixed(1)+' s';
    if(t>=SHOW_DUR){ seek(SHOW_DUR); if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop(); }
    else seek(t);
    return;
  }
  // interactive: fixed-ish substeps keep the escapement honest at 60×
  const sub=S.fast?4:1;
  for(let i=0;i<sub;i++) stepSim(dt/sub);
  updateVisuals();
  controls.update();
  render();
}
animate();

// ================= resize =================
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  if(composer) composer.setSize(window.innerWidth,window.innerHeight);
});
</script>

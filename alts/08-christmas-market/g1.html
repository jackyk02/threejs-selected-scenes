<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winterplatz — Christmas Market at Night</title>
<style>
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #070c1c;
        font-family: Georgia, 'Times New Roman', serif;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    .panel {
        position: fixed; z-index: 10; color: #f3e9d2;
        background: rgba(10, 14, 32, 0.62);
        border: 1px solid rgba(255, 205, 120, 0.35);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.45), inset 0 0 18px rgba(255,190,90,0.06);
    }
    #titleCard {
        top: 18px; left: 18px; padding: 12px 18px 12px 16px; max-width: 330px;
        pointer-events: none;
    }
    #titleCard h1 {
        margin: 0 0 2px 0; font-size: 22px; letter-spacing: 2.5px;
        font-variant: small-caps; color: #ffd98a;
        text-shadow: 0 0 14px rgba(255, 190, 90, 0.55);
    }
    #titleCard .sub {
        font-size: 11px; letter-spacing: 3px; color: #9fb4d8;
        text-transform: uppercase; margin-bottom: 8px;
    }
    #titleCard .hint {
        font-size: 12px; line-height: 1.75; color: #d8cfae;
    }
    #titleCard .hint b { color: #ffd98a; font-family: 'Courier New', monospace; }
    #snowLevel { color: #9fd0ff; font-weight: bold; }

    #recBtn {
        top: 18px; right: 18px; padding: 12px 20px; cursor: pointer;
        font-size: 14px; letter-spacing: 1.5px; font-variant: small-caps;
        color: #ffe9c4; border: 1px solid rgba(255,120,90,0.65);
        background: linear-gradient(180deg, rgba(120,20,20,0.75), rgba(70,10,10,0.75));
        border-radius: 10px; transition: all .2s ease;
        font-family: Georgia, serif;
    }
    #recBtn:hover { background: linear-gradient(180deg, rgba(160,30,25,0.85), rgba(95,15,12,0.85)); box-shadow: 0 0 18px rgba(255,90,60,.4); }
    #recBtn.recording { animation: pulse 1s infinite; border-color:#ff5040; color:#fff; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 8px rgba(255,60,40,.5);} 50% { box-shadow: 0 0 26px rgba(255,60,40,.9);} }

    #benchBadge {
        bottom: 16px; left: 18px; padding: 8px 14px; font-size: 11px;
        font-family: 'Courier New', monospace; color: #8fd0a0;
        letter-spacing: 0.5px; pointer-events: none;
    }
</style>
</head>
<body>
<div id="app"></div>

<div id="titleCard" class="panel">
    <h1>Winterplatz</h1>
    <div class="sub">Christmas Market · Night</div>
    <div class="hint">
        <b>Drag</b> orbit &nbsp;·&nbsp; <b>Wheel</b> zoom<br>
        <b>Space</b> carousel spin up / coast down<br>
        <b>L</b> cycle light pattern &nbsp;·&nbsp; <b>↑/↓</b> snowfall<br>
        Snowfall: <span id="snowLevel">65%</span>
    </div>
</div>

<button id="recBtn" class="panel">● Record video</button>
<div id="benchBadge" class="panel">initialising…</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
'use strict';
/* ============================================================
   WINTERPLATZ — a Christmas market on a town square at night
   All geometry, textures and simulation are generated in code.
   ============================================================ */

// ---------- deterministic RNG ----------
function mulberry32(seed){
    return function(){
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
const R = mulberry32(20241224);
const TAU = Math.PI * 2;

// ---------- palette ----------
const PAL = {
    sky: 0x0b1226, fog: 0x0d1430,
    snowLo: '#cdd8ee', snowHi: '#ffffff',
    woodA: '#6e4a2a', woodB: '#54371f', woodC: '#7d5731',
    warmLight: 0xffc37a, amber: 0xffb050,
    roofRed: '#7e2f26', greenPine: 0x1d4a2a, greenPine2: 0x276036,
    gold: 0xd4a94e, cream: 0xf3e6c8
};

// ============================================================
//  RENDERER / SCENE / CAMERA
// ============================================================
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.sky);
scene.fog = new THREE.FogExp2(PAL.fog, 0.0105);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(26, 13, 32);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 5;
controls.maxDistance = 70;

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0x2a3860, 0x0c0e18, 0.85);
scene.add(hemi);

const moonLight = new THREE.DirectionalLight(0xaFC4ff, 0.95);
moonLight.position.set(-38, 46, -28);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(4096, 4096);
moonLight.shadow.camera.left = -42; moonLight.shadow.camera.right = 42;
moonLight.shadow.camera.top = 42; moonLight.shadow.camera.bottom = -42;
moonLight.shadow.camera.near = 5; moonLight.shadow.camera.far = 130;
moonLight.shadow.bias = -0.00045;
scene.add(moonLight);

const moonMesh = new THREE.Mesh(
    new THREE.CircleGeometry(6.5, 40),
    new THREE.MeshBasicMaterial({ color: 0xf2eeda, fog: false })
);
moonMesh.position.set(-95, 82, -120);
moonMesh.lookAt(camera.position);
scene.add(moonMesh);

// ============================================================
//  PROCEDURAL CANVAS TEXTURES
// ============================================================
function makeCanvas(size, draw){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 8;
    return tex;
}
const woodTex = makeCanvas(256, (ctx, s) => {
    ctx.fillStyle = PAL.woodA; ctx.fillRect(0, 0, s, s);
    const rows = 6;
    for (let i = 0; i < rows; i++) {
        const y = i * (s / rows);
        ctx.fillStyle = i % 2 ? '#66452a' : '#715031';
        ctx.fillRect(0, y, s, s / rows);
        ctx.fillStyle = 'rgba(30,16,6,0.85)';
        ctx.fillRect(0, y, s, 3);
        // grain streaks
        for (let g = 0; g < 26; g++) {
            ctx.strokeStyle = `rgba(40,22,8,${0.12 + R() * 0.25})`;
            ctx.lineWidth = 1 + R() * 1.6;
            ctx.beginPath();
            const gy = y + 4 + R() * (s / rows - 8);
            ctx.moveTo(0, gy);
            for (let x = 0; x <= s; x += 16) ctx.lineTo(x, gy + Math.sin(x * 0.05 + i * 7 + g) * 2.2);
            ctx.stroke();
        }
    }
});
const snowTex = makeCanvas(256, (ctx, s) => {
    ctx.fillStyle = '#eef2fb'; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 2600; i++) {
        const v = 225 + R() * 30;
        ctx.fillStyle = `rgba(${v},${v},${Math.min(255, v + 12)},${0.35 + R() * 0.5})`;
        ctx.fillRect(R() * s, R() * s, 1 + R() * 2.4, 1 + R() * 2.4);
    }
    for (let i = 0; i < 130; i++) { // sparkle
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillRect(R() * s, R() * s, 1.3, 1.3);
    }
});
snowTex.repeat.set(6, 6);
const stripeTex = makeCanvas(256, (ctx, s) => {
    const bands = 12;
    for (let i = 0; i < bands; i++) {
        ctx.fillStyle = i % 2 ? '#b23127' : '#f0e4cd';
        ctx.fillRect(i * (s / bands), 0, s / bands, s);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let i = 0; i < bands; i += 2) ctx.fillRect(i * (s / bands) + s / bands - 6, 0, 6, s);
});
const stripeColTex = makeCanvas(128, (ctx, s) => {
    for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? '#a02720' : '#efe0c4'; ctx.fillRect(0, i * s / 8, s, s / 8); }
});
const groundTex = makeCanvas(512, (ctx, s) => {
    const grad = ctx.createRadialGradient(s/2, s/2, 40, s/2, s/2, s*0.72);
    grad.addColorStop(0, '#dfe6f6'); grad.addColorStop(1, '#b9c6e2');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, s, s);
    for (let i = 0; i < 5200; i++) {
        const v = 200 + R() * 55;
        ctx.fillStyle = `rgba(${v},${v},${Math.min(255, v + 14)},0.5)`;
        ctx.fillRect(R() * s, R() * s, 1.6 + R() * 2.4, 1.6 + R() * 2.4);
    }
});
groundTex.repeat.set(4, 4);

function makeSignTexture(text){
    const c = document.createElement('canvas'); c.width = 512; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#3d1f16'; ctx.fillRect(0, 0, 512, 128);
    ctx.strokeStyle = '#d4a94e'; ctx.lineWidth = 8; ctx.strokeRect(10, 10, 492, 108);
    ctx.fillStyle = '#f3d98a';
    ctx.font = 'bold 44px Georgia';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffb84e'; ctx.shadowBlur = 16;
    ctx.fillText(text, 256, 68);
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 8;
    return tex;
}

// ---------- footprint canvas (world-space 160m decal) ----------
const FP_WORLD = 160, FP_RES = 1024;
const footprintCanvas = document.createElement('canvas');
footprintCanvas.width = footprintCanvas.height = FP_RES;
const fpCtx = footprintCanvas.getContext('2d');
const footprintTex = new THREE.CanvasTexture(footprintCanvas);

function drawFootprint(wx, wz, heading, side){
    const S = FP_RES / FP_WORLD;
    const u = (wx / FP_WORLD + 0.5) * FP_RES;
    const v = (wz / FP_WORLD + 0.5) * FP_RES;
    const px = -Math.sin(heading) * side * 0.22, pz = Math.cos(heading) * side * 0.22;
    fpCtx.save();
    fpCtx.translate(u + px * S, v + pz * S);
    fpCtx.rotate(Math.atan2(Math.sin(heading), Math.cos(heading)) + Math.PI / 2 + Math.PI);
    fpCtx.fillStyle = 'rgba(52,62,88,0.42)';
    fpCtx.beginPath();
    fpCtx.ellipse(0, 0, 0.16 * S, 0.30 * S, 0, 0, TAU);
    fpCtx.fill();
    fpCtx.restore();
}
function clearFootprints(){ fpCtx.clearRect(0, 0, FP_RES, FP_RES); footprintTex.needsUpdate = true; }

// ============================================================
//  GROUND
// ============================================================
const ground = new THREE.Mesh(
    new THREE.CircleGeometry(90, 64),
    new THREE.MeshStandardMaterial({ map: groundTex, color: 0xffffff, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const footprintPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(FP_WORLD, FP_WORLD),
    new THREE.MeshBasicMaterial({ map: footprintTex, transparent: true, depthWrite: false, opacity: 1 })
);
footprintPlane.rotation.x = -Math.PI / 2;
footprintPlane.position.y = 0.025;
scene.add(footprintPlane);

// ============================================================
//  BACKDROP BUILDINGS (silhouettes with a few lit windows)
// ============================================================
(function buildBackdrop(){
    const bGeo = new THREE.BoxGeometry(1, 1, 1);
    const bMat = new THREE.MeshStandardMaterial({ color: 0x18203a, roughness: 0.9 });
    const bMat2 = new THREE.MeshStandardMaterial({ color: 0x1f2742, roughness: 0.9 });
    const winGeo = new THREE.PlaneGeometry(0.9, 1.2);
    const winLit = new THREE.MeshBasicMaterial({ color: 0xffc46a });
    const winDark = new THREE.MeshBasicMaterial({ color: 0x0d1226 });
    for (let i = 0; i < 26; i++) {
        const a = (i / 26) * TAU + R() * 0.18;
        const dist = 42 + R() * 22;
        const w = 6 + R() * 8, h = 9 + R() * 14, d = 6 + R() * 6;
        const b = new THREE.Mesh(bGeo, R() < 0.5 ? bMat : bMat2);
        b.scale.set(w, h, d);
        b.position.set(Math.cos(a) * dist, h / 2 - 0.1, Math.sin(a) * dist);
        b.lookAt(0, h / 2, 0);
        scene.add(b);
        // gable roof slab
        const roof = new THREE.Mesh(bGeo, bMat);
        roof.scale.set(w * 1.04, 0.5, d * 1.05);
        roof.position.set(b.position.x, h + 0.2, b.position.z);
        roof.rotation.y = b.rotation.y;
        scene.add(roof);
        const inward = new THREE.Vector3(-Math.cos(a), 0, -Math.sin(a));
        const rows = Math.floor(h / 3.2), cols = Math.floor(w / 2.6);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            if (R() < 0.42) continue;
            const win = new THREE.Mesh(winGeo, R() < 0.35 ? winLit : winDark);
            const local = new THREE.Vector3((c - (cols - 1) / 2) * 2.6, 2 + r * 3.2, d / 2 + 0.06);
            local.applyAxisAngle(new THREE.Vector3(0, 1, 0), b.rotation.y);
            win.position.set(b.position.x + local.x, local.y, b.position.z + local.z);
            win.rotation.y = b.rotation.y;
            scene.add(win);
        }
    }
})();

// ============================================================
//  STALL BUILDER
// ============================================================
const stallMaterials = {
    wood: new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85 }),
    woodDark: new THREE.MeshStandardMaterial({ color: 0x4a2f1c, roughness: 0.9 }),
    roofWood: new THREE.MeshStandardMaterial({ color: PAL.roofRed, roughness: 0.8 }),
    snowCap: new THREE.MeshStandardMaterial({ map: snowTex, color: 0xffffff, roughness: 0.92 }),
    brass: new THREE.MeshStandardMaterial({ color: PAL.gold, roughness: 0.3, metalness: 0.85 })
};
const signTexts = ['GLÜHWEIN','GEBR. MANDELN','PLÄTZCHEN','HEISSER KAKAO','SPIELZEUG','WEIHNACHTSDEKO','KERZEN','PFEFFERKUCHEN','HANDSCHMUCK','LEBKUCHEN','HEISSE WIRZEL','NÜRNBERGER','HOLZSPIELZEUG','CHRISTKUGELN','PUNsch BAR','MARZIPAN'];

function addGoods(group, type, rng){
    const cols = [0xd43a2f, 0xe8b53a, 0x3a7bd4, 0x59c14a, 0xc46bd4, 0xf0ead8, 0xff7f2a];
    const matFor = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55 });
    // counter display
    if (type === 0) { // ornament baubles heaped on counter
        for (let i = 0; i < 15; i++) {
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.085 + rng() * 0.05, 12, 10), matFor(cols[(rng() * cols.length) | 0]));
            s.position.set((rng() - 0.5) * 2.6, 1.16 + rng() * 0.14, 0.95 + (rng() - 0.5) * 0.25);
            s.castShadow = true; group.add(s);
        }
    } else if (type === 1) { // wrapped gift boxes
        for (let i = 0; i < 7; i++) {
            const w = 0.16 + rng() * 0.16;
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, w * 0.8, w), matFor(cols[(rng() * cols.length) | 0]));
            b.position.set((rng() - 0.5) * 2.5, 1.14 + w * 0.4, 0.9 + (rng() - 0.5) * 0.3);
            b.rotation.y = rng() * TAU; b.castShadow = true; group.add(b);
        }
    } else if (type === 2) { // candles
        for (let i = 0; i < 9; i++) {
            const h = 0.2 + rng() * 0.3;
            const cnd = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, h, 10), matFor(rng() < 0.5 ? 0xf0ead8 : 0xc46bd4));
            cnd.position.set((rng() - 0.5) * 2.5, 1.13 + h / 2, 0.9 + (rng() - 0.5) * 0.3);
            cnd.castShadow = true; group.add(cnd);
        }
    } else if (type === 3) { // fruit & nuts (apples, oranges)
        for (let i = 0; i < 14; i++) {
            const f = new THREE.Mesh(new THREE.SphereGeometry(0.075 + rng() * 0.035, 10, 8), matFor(rng() < 0.6 ? 0xc4302a : 0xff8c1a));
            f.position.set((rng() - 0.5) * 2.5, 1.15 + rng() * 0.1, 0.9 + (rng() - 0.5) * 0.28);
            group.add(f);
        }
    } else { // mugs / glühwein cups
        for (let i = 0; i < 10; i++) {
            const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.055, 0.15, 10), matFor(rng() < 0.5 ? 0xb23127 : 0xe8dcc0));
            mug.position.set((rng() - 0.5) * 2.5, 1.17, 0.9 + (rng() - 0.5) * 0.28);
            group.add(mug);
        }
    }
    // back shelves stocked
    for (let shelf = 0; shelf < 2; shelf++) {
        const y = 1.75 + shelf * 0.62;
        const board = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.07, 0.42), stallMaterials.woodDark);
        board.position.set(0, y - 0.22, -1.0); group.add(board);
        for (let i = 0; i < 6; i++) {
            const item = new THREE.Mesh(
                rng() < 0.5 ? new THREE.BoxGeometry(0.2, 0.22, 0.18) : new THREE.CylinderGeometry(0.09, 0.09, 0.22, 8),
                matFor(cols[(rng() * cols.length) | 0]));
            item.position.set(-1.15 + i * 0.46 + (rng() - 0.5) * 0.1, y, -1.0);
            group.add(item);
        }
    }
}

function buildStall(index){
    const g = new THREE.Group();
    const rng = mulberry32(777 + index * 131);
    const W = 3.4, D = 2.7, wallH = 2.5, rise = 1.15;

    // side + back walls (open front)
    const back = new THREE.Mesh(new THREE.BoxGeometry(W, wallH, 0.16), stallMaterials.wood);
    back.position.set(0, wallH / 2, -D / 2); back.castShadow = true; back.receiveShadow = true; g.add(back);
    for (const sx of [-1, 1]) {
        const side = new THREE.Mesh(new THREE.BoxGeometry(0.16, wallH, D), stallMaterials.wood);
        side.position.set(sx * W / 2, wallH / 2, 0); side.castShadow = true; side.receiveShadow = true; g.add(side);
    }
    // warm interior emissive panel (glows like a lit shop)
    const glowPanel = new THREE.Mesh(
        new THREE.PlaneGeometry(W - 0.35, 1.55),
        new THREE.MeshBasicMaterial({ color: 0xffc879 })
    );
    glowPanel.position.set(0, 1.55, -D / 2 + 0.1); g.add(glowPanel);

    // counter
    const counter = new THREE.Mesh(new THREE.BoxGeometry(W * 0.92, 0.16, 0.75), stallMaterials.woodDark);
    counter.position.set(0, 1.02, D / 2 - 0.32); counter.castShadow = true; counter.receiveShadow = true; g.add(counter);
    const counterBase = new THREE.Mesh(new THREE.BoxGeometry(W * 0.92, 0.9, 0.5), stallMaterials.wood);
    counterBase.position.set(0, 0.48, D / 2 - 0.42); counterBase.castShadow = true; g.add(counterBase);

    // gable triangles front & back
    const tri = new THREE.Shape();
    tri.moveTo(-W / 2, 0); tri.lineTo(W / 2, 0); tri.lineTo(0, rise); tri.closePath();
    const gableGeo = new THREE.ShapeGeometry(tri);
    for (const [z, flip] of [[D / 2 - 0.08, 1], [-D / 2 + 0.08, -1]]) {
        const gable = new THREE.Mesh(gableGeo, new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85, side: THREE.DoubleSide }));
        gable.position.set(0, wallH, z); if (flip < 0) gable.rotation.y = Math.PI;
        g.add(gable);
    }

    // roof: two slanted wood planes + snow caps slightly above
    const overhang = 0.4;
    const slopeLen = Math.hypot(D / 2 + overhang, rise);
    const ang = Math.atan2(rise, D / 2 + overhang);
    for (const s of [-1, 1]) {
        const roof = new THREE.Mesh(new THREE.BoxGeometry(W + 0.55, 0.09, slopeLen), stallMaterials.roofWood);
        roof.position.set(0, wallH + rise / 2 + 0.02, s * (D / 2 + overhang) / 2);
        roof.rotation.x = s * ang; roof.castShadow = true; roof.receiveShadow = true; g.add(roof);
        const snow = new THREE.Mesh(new THREE.BoxGeometry(W + 0.6, 0.075, slopeLen + 0.06), stallMaterials.snowCap);
        const off = 0.095;
        snow.position.set(0, wallH + rise / 2 + 0.02 + Math.cos(ang) * off, s * ((D / 2 + overhang) / 2 - Math.sin(ang) * off));
        snow.rotation.x = s * ang; snow.receiveShadow = true; g.add(snow);
    }
    // snowy ridge cap
    const ridge = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, W + 0.6, 10), stallMaterials.snowCap);
    ridge.rotation.z = Math.PI / 2; ridge.position.set(0, wallH + rise + 0.04, 0); g.add(ridge);

    // goods + sign
    addGoods(g, index % 5, rng);
    const sign = new THREE.Mesh(
        new THREE.PlaneGeometry(2.6, 0.62),
        new THREE.MeshStandardMaterial({ map: makeSignTexture(signTexts[index % signTexts.length]), emissive: 0x593814, emissiveMap: makeSignTexture(signTexts[index % signTexts.length]), emissiveIntensity: 0.55, roughness: 0.8 })
    );
    sign.position.set(0, wallH + 0.42, D / 2 + 0.02); g.add(sign);

    // real warm light for a subset of stalls (perf), rest fake with emissive
    if (index % 3 === 0) {

function catenaryPoints(p0, p1, sag, segments){
    const span = p0.distanceTo(p1);
    let a = (span * span) / (8 * Math.max(sag, 0.001)); // small-sag seed
    for (let i = 0; i < 32; i++) {
        const half = span / (2 * a);
        const f = a * (Math.cosh(half) - 1) - sag;
        const df = Math.cosh(half) - 1 - half * Math.sinh(half);
        if (Math.abs(df) < 1e-9) break;
        a -= f / df;
        if (a <= 0) a = 0.01;
    }
    const pts = [];
    for (let i = 0; i <= segments; i++) {
        const u = i / segments;
        const p = new THREE.Vector3().lerpVectors(p0, p1, u);
        const x = (u - 0.5) * span;
        p.y += a * Math.cosh(x / a) - a * Math.cosh(span / (2 * a));
        pts.push(p);
    }
    return pts;
}

const bulbPositions = [], bulbPhase = [], bulbIdx = [];
const wireMat = new THREE.LineBasicMaterial({ color: 0x1a1a22, transparent: true, opacity: 0.9 });
function addString(p0, p1, sag, spacing){
    const pts = catenaryPoints(p0, p1, sag, 26);
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    scene.add(new THREE.Line(lineGeo, wireMat));
    // walk arc length, drop a bulb every `spacing` metres
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
        const segLen = pts[i].distanceTo(pts[i - 1]);
        let d = spacing - (acc % spacing);
        while (d < segLen) {
            const u = d / segLen;
            const p = new THREE.Vector3().lerpVectors(pts[i - 1], pts[i], u);
            p.y -= 0.14; // bulb hangs below the wire
            bulbPositions.push(p.x, p.y, p.z);
            bulbPhase.push(R() * TAU);
            bulbIdx.push((R() * 6) | 0);
            d += spacing;
        }
        acc += segLen;
    }
}

                       + sin(uTime * 0.23 + aSeed * 0.031) * 2.3;
            float gust = sin(uTime * 0.16 + position.z * 0.02) * 2.2;
            vec3 p = vec3(position.x + sway + gust, y + 0.15,
                          position.z + cos(uTime * 0.45 + aSeed * 0.17) * 1.1);
            vSeed = aSeed;
            vFade = smoothstep(0.0, 2.5, y) * (0.55 + 0.45 * fract(aSeed * 0.317));
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (1.6 + fract(aSeed * 0.171) * 2.6) * (160.0 / -mv.z);
            gl_Position = projectionMatrix * mv;
        }`,
    fragmentShader: `
        uniform float uAmount;
        varying float vFade; varying float vSeed;
        void main(){
            if (fract(vSeed * 0.137) > uAmount) discard;   // density control
            vec2 uv = gl_PointCoord - 0.5;
            float d = length(uv);
            if (d > 0.5) discard;
            float a = smoothstep(0.5, 0.05, d) * vFade;
            gl_FragColor = vec4(0.93, 0.95, 1.0, a);
        }`
});
const snowPoints = new THREE.Points(snowGeo, snowMat);
snowPoints.frustumCulled = false;
scene.add(snowPoints);

// ============================================================
//  STEAM — from visitors' cups (CPU points, deterministic)
// ============================================================
const STEAM_COUNT = 96; // 32 cupped visitors × 3 puffs
const steamGeo = new THREE.BufferGeometry();
const steamPos = new Float32Array(STEAM_COUNT * 3);
const steamAlpha = new Float32Array(STEAM_COUNT);
steamGeo.setAttribute('position', new THREE.BufferAttribute(steamPos, 3));
steamGeo.setAttribute('aAlpha', new THREE.BufferAttribute(steamAlpha, 1));
const steamMat = new THREE.ShaderMaterial({
    uniforms: {},
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
        attribute float aAlpha; varying float vA;
        void main(){
            vA = aAlpha;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = 9.0 * (140.0 / -mv.z);
            gl_Position = projectionMatrix * mv;
        }`,
    fragmentShader: `
        varying float vA;
        void main(){
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            gl_FragColor = vec4(0.85, 0.88, 0.95, smoothstep(0.5, 0.0, d) * vA * 0.55);
        }`
});
const steamPoints = new THREE.Points(steamGeo, steamMat);
steamPoints.frustumCulled = false;
scene.add(steamPoints);

// ============================================================
//  VISITORS — 56 winter-coated figures
// ============================================================
const visitors = [];
const coatCols = [0x8a2f2b, 0x2e4d6e, 0x3f5a36, 0x5a3a63, 0x74522c, 0x37474f, 0x6e2a3d, 0x26443f, 0x7a6a3a, 0x463a56];
const skinCols = [0xe8c39a, 0xd9a87c, 0xc98f66, 0xf0d4b4];
const hatCols = [0xb23127, 0x2e4d6e, 0x276036, 0xd4a94e, 0xe8e0cc];
const sharedGeos = {
    body: new THREE.CylinderGeometry(0.21, 0.30, 0.95, 10),
    shoulder: new THREE.SphereGeometry(0.21, 10, 8),
    head: new THREE.SphereGeometry(0.145, 12, 10),
    hat: new THREE.ConeGeometry(0.155, 0.3, 10),
    pompom: new THREE.SphereGeometry(0.055, 8, 6),
    leg: new THREE.CylinderGeometry(0.075, 0.085, 0.42, 8),
    cup: new THREE.CylinderGeometry(0.07, 0.055, 0.13, 8),
    scarf: new THREE.TorusGeometry(0.115, 0.045, 6, 12)
};
const coatMats = coatCols.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.92 }));
const skinMats = skinCols.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75 }));
const hatMats = hatCols.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 }));
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1c1c22, roughness: 0.9 });

function buildVisitor(i){
    const g = new THREE.Group();
    const coat = coatMats[i % coatMats.length];
    const body = new THREE.Mesh(sharedGeos.body, coat);
    body.position.y = 0.78; body.castShadow = true; g.add(body);
    const shoulder = new THREE.Mesh(sharedGeos.shoulder, coat);
    shoulder.position.y = 1.26; shoulder.scale.set(1.05, 0.6, 1.05); g.add(shoulder);
    const head = new THREE.Mesh(sharedGeos.head, skinMats[i % skinMats.length]);
    head.position.y = 1.47; head.castShadow = true; g.add(head);
    const hat = new THREE.Mesh(sharedGeos.hat, hatMats[(i * 3 + 1) % hatMats.length]);
    hat.position.y = 1.66; g.add(hat);
    const pompom = new THREE.Mesh(sharedGeos.pompom, new THREE.MeshStandardMaterial({ color: 0xf0ead8, roughness: 0.9 }));
    pompom.position.y = 1.82; g.add(pompom);
    const scarf = new THREE.Mesh(sharedGeos.scarf, hatMats[(i * 5 + 2) % hatMats.length]);
    scarf.position.y = 1.31; scarf.rotation.x = Math.PI / 2.3; g.add(scarf);
    for (const s of [-1, 1]) {
        const leg = new THREE.Mesh(sharedGeos.leg, darkMat);
        leg.position.set(s * 0.11, 0.21, 0); g.add(leg);
    }
    // steaming cup held in front (every ~3rd visitor)
    const holdsCup = i % 3 !== 2;
    if (holdsCup) {
        const cup = new THREE.Mesh(sharedGeos.cup, new THREE.MeshStandardMaterial({ color: i % 2 ? 0xb23127 : 0xe8e0cc, roughness: 0.5 }));
        cup.position.set(0, 1.02, 0.30); g.add(cup);
    }
    return { group: g, holdsCup, seed: R() * TAU, legPhase: R() * TAU };
}

// walkers: ellipse loop around the square; gatherers: clustered at carousel
const WALKERS = 46, GATHERERS = 10;
const ellipse = { cx: 0, cz: 0, rx: 14.5, rz: 10.5 };
for (let i = 0; i < WALKERS + GATHERERS; i++) {
    const v = buildVisitor(i);
    const gatherer = i >= WALKERS;
    const dir = i % 4 === 3 ? -1 : 1;
    const ang0 = R() * TAU;
    const gatherA = R() * TAU;
    const gatherR = 5.2 + R() * 1.6;
    v.walker = !gatherer;
    v.dir = dir;
    v.ang0 = ang0;
    v.omega = 0.052 + R() * 0.028;
    v.gatherPos = gatherer ? new THREE.Vector3(carouselGroup.position.x + Math.cos(gatherA) * gatherR, 0, carouselGroup.position.z + Math.sin(gatherA) * gatherR) : null;
    v.gatherA = gatherA;
    scene.add(v.group);
    visitors.push(v);
}
function visitorPos(v, t, out){
    if (v.walker) {
        const a = v.ang0 + v.dir * v.omega * t;
        const wob = Math.sin(t * 0.3 + v.seed * 9) * 0.7;
        out.set(ellipse.cx + Math.cos(a) * (ellipse.rx + wob), 0, ellipse.cz + Math.sin(a) * (ellipse.rz + wob * 0.6));
    } else {
        const sway = Math.sin(t * 0.5 + v.seed * 7) * 0.22;
        out.set(v.gatherPos.x + Math.cos(v.gatherA + Math.PI / 2) * sway, 0, v.gatherPos.z + Math.sin(v.gatherA + Math.PI / 2) * sway);
    }
    return out;
}
const _vp = new THREE.Vector3(), _vp2 = new THREE.Vector3();
function visitorHeading(v, t){
    visitorPos(v, t - 0.05, _vp); visitorPos(v, t + 0.05, _vp2);
    return Math.atan2(_vp2.x - _vp.x, _vp2.z - _vp.z);
}

// ============================================================
//  SIMULATION STATE + INTERACTION
// ============================================================
let simTime = 0;
let mode = 'interactive';            // 'interactive' | 'showcase'
let carouselOn = true;               // Space toggles
let carouselSpeed = 0;               // rad/s (current)
let carouselAngle = 0;
let patternIdx = 0;                  // L cycles 0..2
let snowAmount = 0.65;               // ↑/↓
const snowSlider = document.getElementById('snowLevel');
const patternNames = ['Warm Twinkle', 'Fairy Multicolour', 'River of Light'];

const clock = new THREE.Clock();
const keys = {};

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); if (mode === 'interactive') carouselOn = !carouselOn; }
    else if (e.code === 'KeyL') { if (mode === 'interactive') patternIdx = (patternIdx + 1) % 3; }
    else if (e.code === 'ArrowUp') { e.preventDefault(); if (mode === 'interactive') snowAmount = Math.min(1, snowAmount + 0.12); }
    else if (e.code === 'ArrowDown') { e.preventDefault(); if (mode === 'interactive') snowAmount = Math.max(0.08, snowAmount - 0.12); }
    snowSlider.textContent = Math.round(snowAmount * 100) + '%';
});

// ---------- footprints ----------
let lastFootprintTime = 0;
const footStepOffset = visitors.map((v, i) => 0.19 + ((i * 0.6180339) % 1) * 0.42);
function dropFootprints(t){
    visitors.forEach((v, i) => {
        if (!v.walker) return;
        const interval = 0.42;
        const k = Math.floor((t - footStepOffset[i]) / interval);
        const s = footStepOffset[i] + k * interval;
        if (s > lastFootprintTime && s <= t) {
            visitorPos(v, s, _vp);
            const heading = visitorHeading(v, s);
            drawFootprint(_vp.x, _vp.z, heading, (k % 2) ? 1 : -1);
        }
    });
    footprintTex.needsUpdate = true;
    lastFootprintTime = t;
}
function rebuildFootprints(t){
    clearFootprints();
    lastFootprintTime = 0;
    const interval = 0.42;
    visitors.forEach((v, i) => {
        if (!v.walker) return;
        for (let s = footStepOffset[i]; s <= t; s += interval) {
            visitorPos(v, s, _vp);
            drawFootprint(_vp.x, _vp.z, visitorHeading(v, s), (Math.round(s / interval) % 2) ? 1 : -1);
        }
    });
    footprintTex.needsUpdate = true;
    lastFootprintTime = t;
}

// ---------- per-frame update (pure function of simTime + dt) ----------
function updateWorld(dt, t){
    // snow + bulbs + tree lights
    snowMat.uniforms.uTime.value = t;
    snowMat.uniforms.uAmount.value = snowAmount;
    bulbMat.uniforms.uTime.value = t;
    bulbMat.uniforms.uPattern.value = patternIdx;
    treeLightMat.uniforms.uTime.value = t;
    treeLightMat.uniforms.uPattern.value = patternIdx;

    // carousel spin-up / coast-down
    const target = carouselOn ? 1.15 : 0;
    carouselSpeed += (target - carouselSpeed) * Math.min(1, dt * 0.6 + (carouselOn ? 0.004 : 0.0016));
    carouselAngle += carouselSpeed * dt;
    carouselSpin.rotation.y = carouselAngle;
    for (const h of horseBodies) {
        h.group.position.y = h.baseY + Math.sin(t * 2.15 + h.phase) * 0.34;
        h.group.rotation.z = Math.sin(t * 2.15 + h.phase + 0.6) * 0.06;
    }

    // visitors
    visitors.forEach(v => {
        visitorPos(v, t, _vp);
        v.group.position.copy(_vp);
        const heading = visitorHeading(v, t);
        v.group.rotation.y = heading;
        if (v.walker) {
            v.group.position.y = Math.abs(Math.sin(t * 4.4 + v.legPhase)) * 0.06;
            v.group.rotation.z = Math.sin(t * 4.4 + v.legPhase) * 0.035;
        } else {
            v.group.rotation.y = v.gatherA + Math.PI + Math.sin(t * 0.4 + v.seed) * 0.4; // face carousel-ish
            v.group.position.y = Math.sin(t * 1.8 + v.seed) * 0.02;
        }
    });

    // steam from cups
    let si = 0;
    visitors.forEach(v => {
        if (!v.holdsCup) return;
        const cupOffset = _vp.set(0, 1.32, 0.30).applyAxisAngle(new THREE.Vector3(0, 1, 0), v.group.rotation.y);
        for (let p = 0; p < 3 && si < STEAM_COUNT; p++, si++) {
            const life = (t * 0.55 + v.seed * 3 + p * 0.37) % 1;
            steamPos[si * 3] = v.group.position.x + cupOffset.x + Math.sin(life * 9 + si) * 0.05;
            steamPos[si * 3 + 1] = v.group.position.y + 1.1 + life * 0.55;
            steamPos[si * 3 + 2] = v.group.position.z + cupOffset.z + Math.cos(life * 7 + si) * 0.05;
            steamAlpha[si] = (1 - life) * Math.min(1, life * 6);
        }
    });
    while (si < STEAM_COUNT) { steamAlpha[si] = 0; si++; }
    steamGeo.attributes.position.needsUpdate = true;
    steamGeo.attributes.aAlpha.needsUpdate = true;
}

const benchBadge = document.getElementById('benchBadge');
function updateBench(){
    window.__bench = {
        visitors: visitors.length,
        snowflakes: SNOWFLAKES,
        carouselSpeed: carouselSpeed,
        lights: TOTAL_LIGHTS
    };
    benchBadge.textContent = `bench · visitors:${visitors.length} snow:${SNOWFLAKES} lights:${TOTAL_LIGHTS} carousel:${carouselSpeed.toFixed(2)} rad/s`;
}

function renderScene(){
    composer.render();
}

// ============================================================
//  POST-PROCESSING (bloom)
// ============================================================
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.72, 0.62, 0.72);
composer.addPass(bloomPass);

// ============================================================
//  SHOWCASE — 12 s scripted camera + event timeline
// ============================================================
const SHOWCASE_DURATION = 12;
const camPosCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(30, 19, 40),    // 0.0 — high establishing wide
    new THREE.Vector3(17, 7.0, 26),   // 2.0 — descend toward the square
    new THREE.Vector3(-2, 3.4, 20.5), // 4.0 — skim the stalls, warm windows
    new THREE.Vector3(-18, 3.1, 8),   // 5.6 — drift past the west row
    new THREE.Vector3(-12, 5.2, -13), // 6.8 — around the back
    new THREE.Vector3(3.5, 4.0, 13),  // 8.0 — sweep toward carousel
    new THREE.Vector3(10.5, 2.9, 5.6),// 9.2 — carousel close-up
    new THREE.Vector3(-4.2, 6.6, 5.8),// 10.3 — tree & star close-up
    new THREE.Vector3(13, 15, 34)     // 12.0 — pull-back finale wide
], false, 'catmullrom', 0.35);
const camLookCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 3.5, 0),
    new THREE.Vector3(-2, 4.0, -2),
    new THREE.Vector3(-6.5, 5.2, 0.5),   // stalls + tree
    new THREE.Vector3(-7, 6.0, 1),       // grand tree
    new THREE.Vector3(2, 3.5, 2),
    new THREE.Vector3(6.5, 2.6, 0),
    new THREE.Vector3(8.5, 2.4, -1),     // carousel
    new THREE.Vector3(-7, 7.0, 1),       // star
    new THREE.Vector3(0, 3.2, 0)
], false, 'catmullrom', 0.35);

const _showcaseCamPos = new THREE.Vector3(), _showcaseLook = new THREE.Vector3();
const SHOWCASE = {
    duration: SHOWCASE_DURATION,
    seek(t){
        t = Math.max(0, Math.min(SHOWCASE_DURATION, t));
        mode = 'showcase';
        controls.enabled = false;
        simTime = t;

        // scripted events ------------------------------------------------
        carouselOn = t >= 1.5;                 // spin-up happens on camera
        patternIdx = t < 4.2 ? 0 : (t < 8.2 ? 1 : 2);   // L-presses on cue
        snowAmount = t < 7.3 ? 0.62 : 0.62 + Math.min(1, (t - 7.3) / 1.6) * 0.36;

        // deterministic carousel integration from t = 0
        carouselSpeed = 0; carouselAngle = 0;
        const step = 1 / 120;
        for (let s = 0; s < t; s += step) {
            const target = (s + step) >= 1.5 ? 1.15 : 0;
            carouselSpeed += (target - carouselSpeed) * Math.min(1, step * 0.6 + 0.0009);
            carouselAngle += carouselSpeed * step;
        }

        // footprints rebuilt deterministically up to t
        rebuildFootprints(t);

        // camera on the rail
        const u = t / SHOWCASE_DURATION;
        camPosCurve.getPoint(u, _showcaseCamPos);
        camLookCurve.getPoint(u, _showcaseLook);
        camera.position.copy(_showcaseCamPos);
        camera.lookAt(_showcaseLook);

        updateWorld(0, t);   // settle all time-driven uniforms/poses at t
        updateBench();
        renderScene();
    }
};
window.showcase = SHOWCASE;

// ============================================================
//  MAIN LOOP
// ============================================================
window.__bench = { visitors: visitors.length, snowflakes: SNOWFLAKES, carouselSpeed: 0, lights: TOTAL_LIGHTS };

function animate(){
    requestAnimationFrame(animate);
    if (mode !== 'interactive') { updateBench(); return; }
    const dt = Math.min(clock.getDelta(), 0.05);
    simTime += dt;
    dropFootprints(simTime);
    updateWorld(dt, simTime);
    controls.update();
    updateBench();
    renderScene();
}

// ============================================================
//  RECORD VIDEO BUTTON
// ============================================================
const recBtn = document.getElementById('recBtn');
let recording = false;
recBtn.addEventListener('click', () => {
    if (recording) return;
    recording = true;
    recBtn.classList.add('recording');
    recBtn.textContent = '● Recording…';

    const stream = renderer.domElement.captureStream(60);
    let mimeType = 'video/webm;codecs=vp9';
    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
    const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 16000000 });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'winterplatz-christmas-market.webm';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        // hand control back to the interactive scene
        mode = 'interactive';
        controls.enabled = true;
        recording = false;
        recBtn.classList.remove('recording');
        recBtn.textContent = '● Record video';
        clock.getDelta(); // flush stale delta
    };
    recorder.start();
    const start = performance.now();
    function frame(){
        const t = (performance.now() - start) / 1000;
        const tt = Math.min(t, SHOWCASE_DURATION);
        SHOWCASE.seek(tt);
        if (tt < SHOWCASE_DURATION) requestAnimationFrame(frame);
        else recorder.stop();
    }
    frame();
});

// ============================================================
//  RESIZE + GO
// ============================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

// seed the world with some footprints so the square tells a story on load
rebuildFootprints(14);
simTime = 14;
updateWorld(0.016, simTime);
animate();
</script>
</body>

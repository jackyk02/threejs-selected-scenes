<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Weihnachtsmarkt — 3D Christmas Market</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#05080f; height:100%; font-family: Georgia, 'Times New Roman', serif; }
  #scene { display:block; width:100vw; height:100vh; }
  .hud { position:fixed; color:#f3e6c8; pointer-events:none; z-index:10; text-shadow:0 2px 8px rgba(0,0,0,.8); }
  .title-block { top:18px; left:22px; }
  .title-block h1 { margin:0; font-size:26px; letter-spacing:4px; font-weight:normal; color:#ffd98a; }
  .title-block p  { margin:2px 0 0; font-size:12px; letter-spacing:2px; color:#b9c4d8; text-transform:uppercase; }
  .panel { top:18px; right:22px; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:auto; }
  #recordBtn {
    pointer-events:auto; cursor:pointer; border:1px solid #d9a84e; color:#ffd98a;
    background:linear-gradient(180deg, rgba(60,32,18,.85), rgba(34,18,10,.9));
    padding:10px 18px; font-size:13px; letter-spacing:2px; border-radius:6px;
    font-family:Georgia, serif; text-transform:uppercase; transition:all .2s ease;
    box-shadow:0 0 18px rgba(255,190,90,.25), inset 0 0 12px rgba(255,190,90,.12);
  }
  #recordBtn:hover { background:linear-gradient(180deg, rgba(84,44,22,.9), rgba(48,26,12,.95)); box-shadow:0 0 26px rgba(255,190,90,.45), inset 0 0 12px rgba(255,190,90,.2); }
  #recordBtn:disabled { opacity:.6; cursor:default; }
  #recNote { font-size:11px; color:#8fa0bb; letter-spacing:1px; }
  .bottom-bar { bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:18px; align-items:center;
    background:rgba(10,14,24,.55); border:1px solid rgba(217,168,78,.35); border-radius:10px;
    padding:8px 18px; backdrop-filter: blur(6px); font-size:12.5px; letter-spacing:1px; white-space:nowrap; }
  .key { display:inline-block; border:1px solid #d9a84e; border-radius:4px; color:#ffd98a; padding:1px 7px; font-size:11px; margin-right:5px; background:rgba(217,168,78,.08); }
  .bottom-bar b { color:#ffd98a; font-weight:normal; }
  .snow-meter { width:90px; height:6px; border:1px solid rgba(217,168,78,.5); border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px; }
  .snow-meter > div { height:100%; background:linear-gradient(90deg,#7fa8d8,#e8f2ff); width:70%; transition:width .2s; }
  .bench-hud { bottom:16px; right:18px; font-size:10.5px; letter-spacing:1px; color:#8fa0bb; text-align:right; line-height:1.7; }
  .bench-hud span { color:#ffd98a; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<canvas id="scene"></canvas>

<div class="hud title-block">
  <h1>WEIHNACHTSMARKT</h1>
  <p>Der Platz &middot; Winter Night Market</p>
</div>

<div class="hud panel">
  <button id="recordBtn">&#9210; Record video</button>
  <div id="recNote">captures the 12&#8202;s scripted showcase as .webm</div>
</div>

<div class="hud bottom-bar">
  <span><span class="key">Space</span>carousel</span>
  <span><span class="key">L</span>lights &mdash; <b id="patternName">Candle Glow</b></span>
  <span><span class="key">&#8593;</span><span class="key">&#8595;</span>snowfall<span class="snow-meter"><div id="snowFill"></div></span></span>
</div>

<div class="hud bench-hud" id="benchHud">
  visitors <span id="bVisitors">0</span> &middot; flakes <span id="bSnow">0</span><br/>
  carousel <span id="bCar">0.00</span> rad/s &middot; lights <span id="bLights">0</span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================ helpers */
function mulberry32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
let rng = mulberry32(987654321);
const STATIC_RNG = mulberry32(1337);
const clamp = THREE.MathUtils.clamp;
const TAU = Math.PI*2;
function hsl2rgb(h,s,l){const f=n=>{const k=(n+h*12)%12;const a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1));};return[f(0),f(8),f(4)];}

function makeCanvas(w,h,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); fn(ctx,w,h);
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=8;
  return {tex,canvas:c,ctx};
}

/* ============================================================ renderer / scene */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.Fog(0x10182a, 46, 135);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 400);
camera.position.set(24, 12.5, 27);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 60;
controls.maxPolarAngle = 1.52;
controls.update();

/* ============================================================ procedural textures */
const woodT = makeCanvas(256,256,(ctx)=>{
  ctx.fillStyle='#5e4026'; ctx.fillRect(0,0,256,256);
  const rows=5;
  for(let r=0;r<rows;r++){
    const y=r*52;
    const shade=0.82+STATIC_RNG()*0.36;
    ctx.fillStyle=`rgb(${Math.floor(94*shade)},${Math.floor(62*shade)},${Math.floor(36*shade)})`;
    ctx.fillRect(0,y,256,49);
    ctx.fillStyle='rgba(28,16,8,0.9)'; ctx.fillRect(0,y+49,256,3);
    ctx.fillStyle='rgba(40,22,10,0.55)';
    const seam=STATIC_RNG()*256; ctx.fillRect(seam,y,3,49);
    for(let i=0;i<26;i++){
      ctx.strokeStyle=`rgba(30,18,8,${0.12+STATIC_RNG()*0.25})`;
      ctx.lineWidth=1+STATIC_RNG()*1.6;
      ctx.beginPath();
      const gy=y+4+STATIC_RNG()*44;
      ctx.moveTo(0,gy);
      ctx.bezierCurveTo(80,gy+(STATIC_RNG()-0.5)*7, 170,gy+(STATIC_RNG()-0.5)*7, 256,gy+(STATIC_RNG()-0.5)*5);
      ctx.stroke();
    }
  }
}).tex;

const woodDarkT = makeCanvas(256,256,(ctx)=>{
  ctx.fillStyle='#3f2817'; ctx.fillRect(0,0,256,256);
  for(let r=0;r<6;r++){ const y=r*43;
    ctx.fillStyle=`rgba(${70+STATIC_RNG()*30},${44+STATIC_RNG()*20},${24+STATIC_RNG()*12},1)`;
    ctx.fillRect(0,y,256,40);
    ctx.fillStyle='rgba(16,9,4,0.9)'; ctx.fillRect(0,y+40,256,3);
  }
}).tex;

const woodLightT = makeCanvas(256,256,(ctx)=>{
  ctx.fillStyle='#8a6238'; ctx.fillRect(0,0,256,256);
  for(let r=0;r<4;r++){ const y=r*64;
    ctx.fillStyle=`rgba(${150+STATIC_RNG()*30},${110+STATIC_RNG()*24},${66+STATIC_RNG()*16},1)`;
    ctx.fillRect(0,y,256,60);
  }
}).tex;

/* ground canvas (footprint target) */
const groundBundle = makeCanvas(2048,2048,(ctx)=>{
  ctx.fillStyle='#e2e8ef'; ctx.fillRect(0,0,2048,2048);
  for(let i=0;i<9000;i++){
    const a=STATIC_RNG()*0.5+0.15;
    ctx.fillStyle = STATIC_RNG()<0.5 ? `rgba(255,255,255,${a})` : `rgba(165,180,205,${a*0.7})`;
    const r=STATIC_RNG()*3.2+0.6;
    ctx.beginPath(); ctx.arc(STATIC_RNG()*2048, STATIC_RNG()*2048, r, 0, TAU); ctx.fill();
  }
  for(let i=0;i<40;i++){ // soft drifts
    const x=STATIC_RNG()*2048, y=STATIC_RNG()*2048, r=80+STATIC_RNG()*260;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,0.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }
  const vg=ctx.createRadialGradient(1024,1024,700,1024,1024,1450);
  vg.addColorStop(0,'rgba(90,110,150,0)'); vg.addColorStop(1,'rgba(80,100,140,0.4)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,2048,2048);
});
const groundTex = groundBundle.tex; groundTex.wrapS=groundTex.wrapT=THREE.ClampToEdgeWrapping;
const groundCtx = groundBundle.ctx;

/* facade texture variants (buildings) */
function makeFacade(base, litChance){
  return makeCanvas(256,256,(ctx)=>{
    ctx.fillStyle=base; ctx.fillRect(0,0,256,256);
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,236,256,20);
    const cols=4, rows=3;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=24+c*58, y=26+r*72, w=30, h=42;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(x-3,y-3,w+6,h+6);
      if(STATIC_RNG()<litChance){
        const g=ctx.createLinearGradient(x,y,x,y+h);
        g.addColorStop(0,'#ffe6a8'); g.addColorStop(1,'#d89a4e');
        ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
        ctx.fillStyle='rgba(60,30,10,0.8)';
        ctx.fillRect(x+w/2-1.5,y,3,h); ctx.fillRect(x,y+h/2-1.5,w,3);
      } else { ctx.fillStyle='#0b0f18'; ctx.fillRect(x,y,w,h); }
    }
  }).tex;
}
const facadeTexA = makeFacade('#252c3e', 0.5);
const facadeTexB = makeFacade('#33242a', 0.45);
const facadeTexC = makeFacade('#1f2c28', 0.55);

/* carousel textures */
const carouselRoofT = makeCanvas(512,256,(ctx)=>{
  const stripes=24;
  for(let i=0;i<stripes;i++){
    ctx.fillStyle = i%2 ? '#b3232a' : '#f3e2c0';
    ctx.fillRect(Math.floor(i*512/stripes),0,Math.ceil(512/stripes)+1,256);
  }
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(0,220,512,36);
}).tex;
const carouselBaseT = makeCanvas(512,128,(ctx)=>{
  const bands=['#8f1f26','#d9a84e','#173f2c','#d9a84e','#8f1f26'];
  const bh=128/bands.length;
  bands.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(0,i*bh,512,bh+1); });
}).tex;
const mirrorT = makeCanvas(256,256,(ctx)=>{
  for(let i=0;i<8;i++){
    const x=i*32;
    const g=ctx.createLinearGradient(x,0,x+32,0);
    if(i%2){ g.addColorStop(0,'#5a4a20'); g.addColorStop(0.5,'#e8c96a'); g.addColorStop(1,'#5a4a20'); }
    else   { g.addColorStop(0,'#2a3242'); g.addColorStop(0.5,'#cfd8ea'); g.addColorStop(1,'#2a3242'); }
    ctx.fillStyle=g; ctx.fillRect(x,0,32,256);
  }
}).tex;

/* soft radial sprites */
const softCircleT = makeCanvas(64,64,(ctx)=>{
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.4,'rgba(255,255,255,0.7)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
}).tex;
const glowT = makeCanvas(128,128,(ctx)=>{
  const g=ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.25,'rgba(255,255,255,0.55)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
}).tex;
const warmPoolT = makeCanvas(128,128,(ctx)=>{
  const g=ctx.createRadialGradient(64,64,4,64,64,64);
  g.addColorStop(0,'rgba(255,205,120,0.9)'); g.addColorStop(0.5,'rgba(255,180,90,0.35)'); g.addColorStop(1,'rgba(255,180,90,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
}).tex;
const interiorGlowT = makeCanvas(128,128,(ctx)=>{
  const g=ctx.createRadialGradient(64,78,6,64,78,85);
  g.addColorStop(0,'#ffe9b0'); g.addColorStop(0.4,'#e8a85a'); g.addColorStop(1,'rgba(60,28,10,0)');
  ctx.fillStyle='#1c0f06'; ctx.fillRect(0,0,128,128); ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
}).tex;

function makeSignTexture(text){
  return makeCanvas(512,128,(ctx)=>{
    ctx.fillStyle='#3a2214'; ctx.fillRect(0,0,512,128);
    for(let i=0;i<40;i++){ ctx.strokeStyle=`rgba(20,10,4,${0.2+Math.random()*0.3})`; ctx.beginPath(); const y=Math.random()*128; ctx.moveTo(0,y); ctx.lineTo(512,y); ctx.stroke(); }
    ctx.strokeStyle='#d9a84e'; ctx.lineWidth=6; ctx.strokeRect(8,8,496,112);
    ctx.lineWidth=2; ctx.strokeRect(20,20,472,88);
    ctx.font='bold 52px Georgia, serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='#ffb85a'; ctx.shadowBlur=22;
    ctx.fillStyle='#ffd98a'; ctx.fillText(text, 256, 66);
    ctx.shadowBlur=0; ctx.fillText(text, 256, 66);
  }).tex;
}

/* ============================================================ lights */
scene.add(new THREE.HemisphereLight(0x2a3757, 0x0a0c12, 0.85));
scene.add(new THREE.AmbientLight(0x1c2438, 0.6));
const moonLight = new THREE.DirectionalLight(0xa8bde4, 1.35);
moonLight.position.set(-34, 46, -26);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(4096, 4096);
moonLight.shadow.camera.left=-36; moonLight.shadow.camera.right=36;
moonLight.shadow.camera.top=36; moonLight.shadow.camera.bottom=-36;
moonLight.shadow.camera.near=5; moonLight.shadow.camera.far=130;
moonLight.shadow.bias=-0.0005;
scene.add(moonLight);

/* ============================================================ sky, stars, moon */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(0x02040f)}, mid:{value:new THREE.Color(0x0d1830)}, bot:{value:new THREE.Color(0x332435)} },
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 top,mid,bot; varying vec3 vP;
      void main(){ float h=normalize(vP).y;
        vec3 c=mix(bot,mid,smoothstep(-0.08,0.16,h));
        c=mix(c,top,smoothstep(0.12,0.62,h));
        gl_FragColor=vec4(c,1.0); }`
  })
);
scene.add(sky);

{
  const starN=900, pos=new Float32Array(starN*3);
  const srng=mulberry32(42);
  for(let i=0;i<starN;i++){
    const theta=srng()*TAU, phi=Math.acos(srng()*0.75);
    const r=160;
    pos[i*3]=r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]=r*Math.cos(phi)+4;
    pos[i*3+2]=r*Math.sin(phi)*Math.sin(theta);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xdfe8ff, size:1.35, sizeAttenuation:false, transparent:true, opacity:0.9, fog:false })));
}
const moonMesh = new THREE.Mesh(new THREE.CircleGeometry(4.2, 40), new THREE.MeshBasicMaterial({ color:0xf6f1de, fog:false }));
moonMesh.position.set(-62, 74, -96); moonMesh.lookAt(0,0,0); scene.add(moonMesh);
function addGlowSprite(color, scale, position, opacity=1){
  const m=new THREE.SpriteMaterial({ map:glowT, color, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false, opacity });
  const s=new THREE.Sprite(m); s.scale.set(scale,scale,1); s.position.copy(position); scene.add(s); return s;
}
addGlowSprite(0xcfd8ff, 34, moonMesh.position.clone(), 0.9);

/* ============================================================ ground */
const outerGround = new THREE.Mesh(new THREE.PlaneGeometry(600,600), new THREE.MeshStandardMaterial({ color:0xd7dfe9, roughness:1 }));
outerGround.rotation.x=-Math.PI/2; outerGround.position.y=-0.06; outerGround.receiveShadow=true; scene.add(outerGround);

const innerGround = new THREE.Mesh(new THREE.PlaneGeometry(64,64), new THREE.MeshStandardMaterial({ map:groundTex, roughness:0.96 }));
innerGround.rotation.x=-Math.PI/2; innerGround.position.y=0; innerGround.receiveShadow=true; scene.add(innerGround);

const GROUND_SPAN = 64;
function stampFootprint(x,z,ang){
  const s=2048/GROUND_SPAN;
  const px=(x+GROUND_SPAN/2)*s, pz=(z+GROUND_SPAN/2)*s;
  groundCtx.save(); groundCtx.translate(px,pz); groundCtx.rotate(ang);
  groundCtx.fillStyle='rgba(88,78,66,0.5)';
  groundCtx.beginPath(); groundCtx.ellipse(-3.4, 0, 2.1, 4.6, 0, 0, TAU); groundCtx.fill();
  groundCtx.beginPath(); groundCtx.ellipse( 3.4, 1.8, 2.1, 4.6, 0, 0, TAU); groundCtx.fill();
  groundCtx.restore();
  groundTex.needsUpdate=true;
}
function fadeFootprints(){
  groundCtx.fillStyle='rgba(227,233,242,0.09)';
  groundCtx.fillRect(0,0,2048,2048);
  groundTex.needsUpdate=true;
}

/* ============================================================ materials */
const matWood      = new THREE.MeshStandardMaterial({ map:woodT, roughness:0.85 });
const matWoodDark  = new THREE.MeshStandardMaterial({ map:woodDarkT, roughness:0.9 });
const matWoodLight = new THREE.MeshStandardMaterial({ map:woodLightT, roughness:0.8 });
const matRoof      = new THREE.MeshStandardMaterial({ color:0x452a20, roughness:0.85 });
const matSnow      = new THREE.MeshStandardMaterial({ color:0xe9eef5, roughness:0.95 });
const matBrass     = new THREE.MeshStandardMaterial({ color:0xd9a84e, metalness:0.85, roughness:0.3, emissive:0x332200, emissiveIntensity:0.6 });

/* ============================================================ stalls */
const STALL_COUNT = 18, STALL_RADIUS = 13.2;
const stallApexes = [], stallFronts = [];
const stallNames = ['GLÜHWEIN','WAFFELN','ÄPFEL & HONIG','KERZEN','GEWÜRZE','SPIELZEUG','KAKAO','LEBKUCHEN','TEE & PUNCH','KÄSE','MÜTZEN','PLÄTZCHEN','HONIGKUCHEN','PUNCH','ORNAMENTE','HANDARBEIT','KASTANIEN','WINTERTEE'];
const lampSprites = [];

function goodsBottles(g){
  const cols=[0x2e5d3a,0x6e2a1e,0x1f3a5f,0x4a2c10];
  for(const shelfY of [1.76, 2.18]){
    for(let i=0;i<7;i++){
      const x=-1.12+i*0.36, col=cols[Math.floor(STATIC_RNG()*4)];
      const body=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.062,0.24,10), new THREE.MeshStandardMaterial({color:col, roughness:0.25}));
      body.position.set(x, shelfY+0.155, -0.82); body.castShadow=true; g.add(body);
      const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.03,0.1,8), body.material);
      neck.position.set(x, shelfY+0.32, -0.82); g.add(neck);
    }
  }
  const basket=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.18,0.16,10), matWoodDark);
  basket.position.set(0.6,1.17,0.55); g.add(basket);
  for(let i=0;i<5;i++){ const o=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8), new THREE.MeshStandardMaterial({color:0xe07818, roughness:0.5})); o.position.set(0.6+(STATIC_RNG()-0.5)*0.22, 1.28, 0.55+(STATIC_RNG()-0.5)*0.22); g.add(o); }
}
function goodsCrates(g){
  const appleCols=[0xc0392b,0xa93226,0xd35400,0x7b9e3a];
  for(const cx of [-0.85, 0, 0.85]){
    const crate=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.3,0.4), matWoodDark);
    crate.position.set(cx, 1.24, 0.5); crate.castShadow=true; g.add(crate);
    for(let j=0;j<3;j++){ const a=new THREE.Mesh(new THREE.SphereGeometry(0.078,10,8), new THREE.MeshStandardMaterial({color:appleCols[Math.floor(STATIC_RNG()*4)], roughness:0.4})); a.position.set(cx-0.12+j*0.12, 1.43, 0.5+(STATIC_RNG()-0.5)*0.08); g.add(a); }
    const top=new THREE.Mesh(new THREE.SphereGeometry(0.078,10,8), new THREE.MeshStandardMaterial({color:appleCols[Math.floor(STATIC_RNG()*4)], roughness:0.4})); top.position.set(cx,1.55,0.5); g.add(top);
  }

function catenary(p0, p1, sag, segments){
  const dist = Math.hypot(p1.x-p0.x, p1.z-p0.z);
  // solve a*(cosh(dist/2a)-1) = sag  (Newton)
  let a = dist*dist/(8*sag);
  for(let it=0; it<24; it++){
    const f = a*(Math.cosh(dist/(2*a))-1) - sag;
    const df = (Math.cosh(dist/(2*a))-1) - (dist/(2*a))*Math.sinh(dist/(2*a));
    a -= f/df; if(!isFinite(a) || a<=0) a = dist*dist/(8*sag);
  }
  const coshHalf = Math.cosh(dist/(2*a));
  const pts=[];
  for(let i=0;i<=segments;i++){
    const u=i/segments;
    const p=p0.clone().lerp(p1,u);
    const x=(u-0.5)*dist;
    p.y -= a*(coshHalf - Math.cosh(x/a));
    pts.push(p);
  }
  return new THREE.CatmullRomCurve3(pts);
}

const bulbPositions = [], bulbData = [];
const wireMat = new THREE.MeshBasicMaterial({ color:0x0d0d12 });
function addString(p0, p1, sag, stringIdx){
  const dist = p0.distanceTo(p1);
  const curve = catenary(p0, p1, sag, 40);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 36, 0.016, 4, false), wireMat);
  scene.add(tube);
  const spacing = 0.17;
  const count = Math.max(4, Math.floor(dist/spacing));
  const start = bulbPositions.length;
  for(let i=1;i<count;i++){
    const u=i/count;
    const p=curve.getPoint(u);
    p.y -= 0.09;
    bulbPositions.push(p);
    bulbData.push({ phase:(i*0.37 + stringIdx*1.7) % TAU + Math.sin(i*3.1+stringIdx)*0.5, u:u*dist*0.32 + stringIdx*2.0, hue:(i*0.071 + stringIdx*0.19) % 1, stringIdx });
  }
  return bulbPositions.length - start;
}

const FIXED_DT = 1/60;
const SIM_SEED = 987654321;
let simTime = 0;
let carouselAngle = 0, carouselSpeed = 0, carouselTarget = CAROUSEL_MAX, carouselOn = true;
let snowRate = 0.72;
let patternIndex = 0;
const patternNames = ['Candle Glow','Chain Reaction','Candy Mix'];
let simSeeking = false, showcasePlaying = false, recording = false;
let footprintFadeAcc = 0;
const patternNameEl = document.getElementById('patternName');

function resetSimulation(){
  simTime = 0;
  carouselAngle = 0; carouselSpeed = 0; carouselTarget = CAROUSEL_MAX; carouselOn = true;
  rng = mulberry32(SIM_SEED);
  snowPos.set(initialSnowPos);
  snowGeo.attributes.position.needsUpdate = true;
  footprintFadeAcc = 0;
  for(const v of visitors){
    const wp = v.waypoints[v.initIndex];
    v.group.position.set(wp.x, 0, wp.z);
    v.wpIndex = v.initIndex;
    v.pauseT = 0;
    v.facing = 0;
    v.footprintAcc = 0;
    v.inner.position.y = 0;
    v.inner.rotation.set(0,0,0);
  }
  for(const p of steamPuffs) p.life = 0;
  for(let i=0;i<MAX_STEAM;i++){ steamPos[i*3+1] = -100; steamCol[i*3]=steamCol[i*3+1]=steamCol[i*3+2]=0; }
  steamGeo.attributes.position.needsUpdate = true;
  steamGeo.attributes.color.needsUpdate = true;
  steamAcc = 0; steamCursor = 0;
}

function stepSim(dt){
  simTime += dt;
  // --- carousel spin-up / coast-down
  carouselSpeed += (carouselTarget - carouselSpeed) * Math.min(1, dt*1.15);
  carouselAngle += carouselSpeed * dt;
  // --- snowfall
  const fallMul = 0.55 + snowRate*1.25;
  const wind = 0.35 + Math.sin(simTime*0.23)*0.3;
  const posAttr = snowGeo.attributes.position;
  const arr = posAttr.array;
  for(let i=0;i<SNOW_COUNT;i++){
    const i3=i*3, i4=i*4;
    const fall=snowMeta[i4], phase=snowMeta[i4+1], swayAmp=snowMeta[i4+2], swayFreq=snowMeta[i4+3];
    arr[i3+1] -= fall*fallMul*dt;
    arr[i3]   += (Math.sin(simTime*swayFreq + phase)*swayAmp + wind) * dt;
    arr[i3+2] += Math.cos(simTime*swayFreq*0.85 + phase*1.31)*swayAmp*0.7 * dt;
    if(arr[i3+1] < 0){
      arr[i3+1] = 24 + rng()*3.5;
      arr[i3]   = (rng()-0.5)*78;
      arr[i3+2] = (rng()-0.5)*78;
    }
    if(arr[i3] > 40) arr[i3] -= 80; else if(arr[i3] < -40) arr[i3] += 80;
    if(arr[i3+2] > 40) arr[i3+2] -= 80; else if(arr[i3+2] < -40) arr[i3+2] += 80;
  }
  posAttr.needsUpdate = true;
  const activeFlakes = Math.floor(SNOW_COUNT * (0.15 + 0.85*snowRate));
  snowGeo.setDrawRange(0, activeFlakes);
  // --- visitors
  footprintFadeAcc += dt;
  if(footprintFadeAcc > 2.5){
    footprintFadeAcc = 0;
    if(!simSeeking) fadeFootprints();
  }
  for(const v of visitors){
    const target = v.waypoints[(v.wpIndex+1) % v.waypoints.length];
    const pos = v.group.position;
    const dx = target.x - pos.x, dz = target.z - pos.z;
    const dist = Math.hypot(dx,dz);
    if(v.pauseT > 0){
      v.pauseT -= dt;
      v.inner.position.y = Math.sin(simTime*1.7 + v.bobPhase)*0.02;
      v.inner.rotation.y = Math.sin(simTime*0.6 + v.bobPhase)*0.12;
    } else if(dist < 0.3){
      v.wpIndex = (v.wpIndex+1) % v.waypoints.length;
      v.pauseT = v.gawker ? (1.5 + rng()*5.5) : (0.3 + rng()*2.2);
    } else {
      const inv = 1/dist;
      const mv = v.speed*dt;
      pos.x += dx*inv*mv; pos.z += dz*inv*mv;
      const targetFacing = Math.atan2(dx, dz);
      let diff = targetFacing - v.facing;
      while(diff > Math.PI) diff -= TAU; while(diff < -Math.PI) diff += TAU;
      v.facing += diff * Math.min(1, dt*7);
      v.group.rotation.y = v.facing;
      v.inner.position.y = Math.abs(Math.sin(simTime*7.2 + v.bobPhase))*0.055;
      v.inner.rotation.y = 0;
      v.footprintAcc += mv;
      if(v.footprintAcc > 0.55 && !simSeeking){
        v.footprintAcc = 0;
        stampFootprint(pos.x, pos.z, v.facing);
      }
    }
  }
  // --- steam from cups
  steamAcc += dt;
  while(steamAcc > 0.055){
    steamAcc -= 0.055;
    // find next cup carrier in round-robin
    for(let tries=0; tries<visitors.length; tries++){
      steamCursor = (steamCursor+1) % visitors.length;
      const v = visitors[steamCursor];
      if(v.cupCarrier){
        const p = v.group.position;
        const fx = Math.sin(v.facing), fz = Math.cos(v.facing);
        const px = p.x + fx*0.4 + Math.cos(v.facing)*0.05;
        const pz = p.z + fz*0.4 - Math.sin(v.facing)*0.05;
        // find dead particle
        for(let k=0;k<MAX_STEAM;k++){
          if(steamPuffs[k].life <= 0){
            const s=steamPuffs[k];
            s.life = s.maxLife = 1.0 + rng()*0.6;
            s.vx = (rng()-0.5)*0.12; s.vy = 0.32+rng()*0.18; s.vz = (rng()-0.5)*0.12;
            steamPos[k*3]=px; steamPos[k*3+1]=1.06; steamPos[k*3+2]=pz;
            break;
          }
        }
        break;
      }
    }
  }
  for(let i=0;i<MAX_STEAM;i++){
    const s=steamPuffs[i];
    if(s.life > 0){
      s.life -= dt;
      steamPos[i*3]   += s.vx*dt + Math.sin(simTime*3+i)*0.03*dt;
      steamPos[i*3+1] += s.vy*dt;
      steamPos[i*3+2] += s.vz*dt;
      const f = Math.max(0, s.life/s.maxLife);
      const b = 0.42*Math.pow(f, 0.75);
      steamCol[i*3]=b*0.85; steamCol[i*3+1]=b*0.9; steamCol[i*3+2]=b;
      if(s.life <= 0){ steamPos[i*3+1] = -100; steamCol[i*3]=steamCol[i*3+1]=steamCol[i*3+2]=0; }
    }
  }
  steamGeo.attributes.position.needsUpdate = true;
  steamGeo.attributes.color.needsUpdate = true;
}

const tmpColor = new THREE.Color();
function updateTwinkles(){
  const t = simTime;
  // string bulbs
  for(let i=0;i<STRING_BULBS;i++){
    const b = bulbData[i];
    let r,g,bl;
    if(patternIndex === 0){
      const w = 0.7 + 0.3*Math.sin(t*1.7 + b.phase*3.1);
      r = 1.0*w; g = 0.76*w; bl = 0.4*w;
    } else if(patternIndex === 1){
      const wave = 0.5 + 0.5*Math.sin(t*3.4 - b.u*9.0 + b.stringIdx*0.9);
      const w = 0.14 + 0.86*Math.pow(wave, 3.2);
      r = 1.0*w; g = 0.85*w; bl = 0.45*w;
    } else {
      const h = (b.hue + t*0.16) % 1;
      const w = 0.68 + 0.32*Math.sin(t*4.2 + b.phase*6.0);
      const c = hsl2rgb(h, 0.85, 0.18 + 0.42*w);
      r = c[0]+0.15*w; g = c[1]+0.1*w; bl = c[2]+0.1*w;
    }
    tmpColor.setRGB(r,g,bl);
    bulbMesh.setColorAt(i, tmpColor);
  }
  bulbMesh.instanceColor.needsUpdate = true;
  // tree lights — eternal gentle twinkle
  for(let i=0;i<TREE_LIGHTS;i++){
    const d = treeLightData[i];
    const tw = Math.pow(0.5 + 0.5*Math.sin(t*d.speed + d.phase), 2.0);
    const base = treeLightMesh.instanceColor ? null : null;
    // warm-ish varied hues derived from index
    const hue = (i * 0.6180339887) % 1;
    const c = hsl2rgb(hue < 0.5 ? 0.09 + hue*0.1 : hue, 0.85, 0.12 + 0.5*tw);
    tmpColor.setRGB(c[0]+0.28*tw, c[1]+0.22*tw, c[2]+0.12*tw);
    treeLightMesh.setColorAt(i, tmpColor);
  }
  treeLightMesh.instanceColor.needsUpdate = true;
  // carousel bulb rings — warm breathing pulse (+ pattern 2 candy shimmer)
  for(let i=0;i<CAROUSEL_BULBS;i++){
    const d = carouselBulbData[i];
    let w = 0.72 + 0.28*Math.sin(t*2.3 + d.phase);
    let r=1.0*w, g=0.8*w, bl=0.44*w;
    if(patternIndex === 1){ const wave=0.5+0.5*Math.sin(t*5.0 - i*0.35); w=0.2+0.8*Math.pow(wave,3); r=w; g=0.85*w; bl=0.45*w; }
    else if(patternIndex === 2){ const c=hsl2rgb((i*0.09+t*0.3)%1, 0.8, 0.55); r=c[0]; g=c[1]; bl=c[2]; }
    tmpColor.setRGB(r,g,bl);
    carouselBulbMesh.setColorAt(i, tmpColor);
  }
  carouselBulbMesh.instanceColor.needsUpdate = true;
}
updateTwinkles();

function updateVisuals(){

    h.group.position.y = h.baseY + Math.sin(simTime*2.3 + h.phase)*0.3;
    h.group.rotation.z = Math.sin(simTime*2.3 + h.phase + 0.7)*0.06;
  }
  treeGroup.userData.star.rotation.y = simTime*0.8;
  for(let i=0;i<lampSprites.length;i++){
    const s = lampSprites[i];
    const sc = 1.9 + Math.sin(simTime*2.6 + i*1.7)*0.18;
    s.scale.set(sc, sc, 1);
  }
  updateTwinkles();
}

/* ============================================================ post-processing */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.62, 0.75, 0.78);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================ bench API */
window.__bench = { visitors: VISITOR_COUNT, snowflakes: SNOW_COUNT, carouselSpeed: 0, lights: TOTAL_LIGHTS };
const bV = document.getElementById('bVisitors');
const bS = document.getElementById('bSnow');
const bC = document.getElementById('bCar');
const bL = document.getElementById('bLights');
let benchHudAcc = 0;
function updateBench(dt=0.016){
  window.__bench.visitors = visitors.length;
  window.__bench.snowflakes = Math.floor(SNOW_COUNT * (0.15 + 0.85*snowRate));
  window.__bench.carouselSpeed = carouselSpeed;
  window.__bench.lights = TOTAL_LIGHTS;
  benchHudAcc += dt;
  if(benchHudAcc > 0.25){
    benchHudAcc = 0;
    bV.textContent = visitors.length;
    bS.textContent = window.__bench.snowflakes;
    bC.textContent = carouselSpeed.toFixed(2);
    bL.textContent = TOTAL_LIGHTS;
    snowFillEl.style.width = Math.round(snowRate*100) + '%';
  }
}

/* ============================================================ showcase (deterministic) */
const SHOWCASE_DURATION = 12;
const camCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(27.0, 14.0, 30.0),
  new THREE.Vector3(12.5,  3.1, 16.5),
  new THREE.Vector3( 4.8,  1.7,  6.3),
  new THREE.Vector3(12.4,  2.8,  1.2),
  new THREE.Vector3( 2.9,  3.5, -9.4),
  new THREE.Vector3(23.5, 12.5, 24.0)
], false, 'centripetal');
const tgtCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0.0, 3.5,  0.0),
  new THREE.Vector3( 1.5, 2.6, -1.0),
  new THREE.Vector3( 0.0, 7.4,  0.0),
  new THREE.Vector3( 8.5, 2.7, -6.0),
  new THREE.Vector3( 8.5, 2.9, -6.0),
  new THREE.Vector3( 0.0, 4.0,  0.0)
], false, 'centripetal');

function seek(t){
  t = clamp(t, 0, SHOWCASE_DURATION);
  simSeeking = true;
  resetSimulation();
  setPattern(t < 5.5 ? 1 : (t < 9.0 ? 2 : 0), false);
  patternNameEl.textContent = patternNames[patternIndex];
  snowRate = 0.85;
  snowFillEl.style.width = '85%';
  const steps = Math.floor(t / FIXED_DT);
  for(let i=0;i<steps;i++) stepSim(FIXED_DT);
  updateVisuals();
  const u = t / SHOWCASE_DURATION;
  const pos = camCurve.getPoint(u);
  const tgt = tgtCurve.getPoint(u);
  pos.x += Math.sin(t*2.1)*0.06;
  pos.y += Math.sin(t*1.7+1.3)*0.05;
  camera.position.copy(pos);
  camera.lookAt(tgt);
  controls.target.copy(tgt);
  composer.render();
  updateBench(0.016);
  simSeeking = false;
}
window.showcase = { duration: SHOWCASE_DURATION, seek };

/* ============================================================ record button */
const recordBtn = document.getElementById('recordBtn');
const recNote = document.getElementById('recNote');
const originalBtnLabel = recordBtn.innerHTML;

recordBtn.addEventListener('click', () => {
  if(recording) return;
  recording = true;
  recordBtn.disabled = true;
  recordBtn.textContent = '● Recording…';
  recNote.textContent = 'showcase 0:00 / 0:12';
  controls.enabled = false;

  seek(0);
  const stream = canvas.captureStream(60);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
             : MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '';
  const recOptions = mime ? { mimeType: mime, videoBitsPerSecond: 12_000_000 } : { videoBitsPerSecond: 12_000_000 };
  const recorder = new MediaRecorder(stream, recOptions);
  const chunks = [];
  recorder.ondataavailable = (e) => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'christmas-market-showcase.webm';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recording = false; showcasePlaying = false;
    recordBtn.disabled = false; recordBtn.innerHTML = originalBtnLabel;
    recNote.textContent = 'captures the 12 s scripted showcase as .webm';
    controls.enabled = true;
    controls.update();
  };
  recorder.start(200);
  showcasePlaying = true;
  const t0 = performance.now();
  function playLoop(){
    const el = (performance.now() - t0) / 1000;
    if(el >= SHOWCASE_DURATION){
      seek(SHOWCASE_DURATION);
      try { recorder.stop(); } catch(err) { recorder.onstop(); }
      return;
    }
    seek(el);
    const s = Math.floor(el);
    recNote.textContent = `showcase 0:${String(s).padStart(2,'0')} / 0:12`;
    requestAnimationFrame(playLoop);
  }
  requestAnimationFrame(playLoop);
});

/* ============================================================ input */
function toggleCarousel(){
  carouselOn = !carouselOn;
  carouselTarget = carouselOn ? CAROUSEL_MAX : 0;
}
window.addEventListener('keydown', (e) => {
  if(e.code === 'Space'){ e.preventDefault(); if(!showcasePlaying) toggleCarousel(); }
  else if(e.code === 'KeyL'){ e.preventDefault(); if(!showcasePlaying) setPattern(patternIndex + 1, true); }
  else if(e.code === 'ArrowUp'){ e.preventDefault(); snowRate = clamp(snowRate + 0.15, 0.1, 1); snowFillEl.style.width = Math.round(snowRate*100)+'%'; }
  else if(e.code === 'ArrowDown'){ e.preventDefault(); snowRate = clamp(snowRate - 0.15, 0.1, 1); snowFillEl.style.width = Math.round(snowRate*100)+'%'; }
});

/* ============================================================ resize */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});

/* ============================================================ main loop */
patternNameEl.textContent = patternNames[patternIndex];
snowFillEl.style.width = Math.round(snowRate*100)+'%';
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(!showcasePlaying){
    stepSim(dt);
    updateVisuals();
    controls.update();
    composer.render();
  }
  updateBench(dt);
}
animate();
</script>

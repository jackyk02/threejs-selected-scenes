<!DOCTYPE html>
<html lang="en">
<head>

<title>Still Water — 静水 · Japanese Garden Pond</title>
<style>

    --gold:#d9b36c;
    --gold-dim:rgba(217,179,108,.45);
    --panel:rgba(12,17,13,.62);

  #hud h1{
    font-size:27px;font-weight:400;letter-spacing:.04em;color:#f4efdf;
    line-height:1.05;
  }
  #hud h1 .jp{color:var(--gold);font-size:19px;vertical-align:2px;margin-left:6px}
  #hud .sub{font-size:11px;opacity:.62;margin-top:6px;font-style:italic}
  #hud .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  .btn{
    appearance:none;border:1px solid var(--gold-dim);
    background:linear-gradient(180deg,rgba(217,179,108,.16),rgba(217,179,108,.05));
    color:var(--gold);font-family:inherit;font-size:11.5px;letter-spacing:.12em;
    text-transform:uppercase;padding:9px 14px;border-radius:8px;cursor:pointer;
    transition:all .25s ease;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{background:linear-gradient(180deg,rgba(217,179,108,.3),rgba(217,179,108,.1));
    box-shadow:0 0 18px rgba(217,179,108,.25);color:#f4dfae}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 8px rgba(200,80,46,.9)}
  .btn.rec.recording{animation:pulse 1.1s infinite;border-color:#e0603a;color:#ffb59a}
  @keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(224,96,58,.4)}50%{box-shadow:0 0 22px rgba(224,96,58,.85)}}

  .pill{
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 10px;border-radius:999px;border:1px solid rgba(233,228,212,.16);
    color:rgba(233,228,212,.75);background:var(--panel-2);display:inline-flex;align-items:center;gap:6px;
  }
  .pill b{color:var(--gold);font-weight:400}

  #hint{
    bottom:16px;left:50%;transform:translateX(-50%);
    padding:9px 20px;border-radius:999px;font-size:11.5px;letter-spacing:.06em;
    color:rgba(233,228,212,.85);white-space:nowrap;
  }
  #hint b{color:var(--gold);font-weight:400}
  #hint .sep{opacity:.3;margin:0 8px}

  #badge{top:18px;right:18px;padding:10px 14px;font-size:10px;letter-spacing:.25em;
    text-transform:uppercase;color:rgba(233,228,212,.55);text-align:right;line-height:1.9}
  #badge span{color:var(--gold)}
  @media (max-width:720px){#badge,#hint{display:none}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   STILL WATER — a Japanese garden pond
   2D wave equation (256×256 CPU solve, GPU textured surface),
   GPU planar reflections, refraction, caustics, koi, rain.
   ============================================================ */

// ---------- seeded rng (deterministic showcase) ----------
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let R = Math.random;               // swapped for seeded rng inside seek()

// ---------- UI refs ----------
const recordBtn = document.getElementById('recordBtn');
const rainStateEl = document.getElementById('rainState');
const duskStateEl = document.getElementById('duskState');

// ---------- constants ----------
const SIM = 256;                     // wave grid 256×256 (meets requirement)
const RECT = { minX: -11.75, minZ: -8.75, w: 23.5, h: 17.5 };
const RX = 9.4, RZ = 6.7;            // pond ellipse radii
const FIXED_DT = 1 / 60;
const SHOWCASE_DURATION = 12;

// ---------- renderer / scene / camera ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xccd6cc, 30, 95);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(15.5, 9.5, 17.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4.5;
controls.maxDistance = 30;
controls.maxPolarAngle = 1.42;
controls.minPolarAngle = 0.18;
controls.update();

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0xbfd9e2, 0x51604a, 0.85);
scene.add(hemi);

const sunDirDay = new THREE.Vector3(16, 22, 12).normalize();
const sunDirDusk = new THREE.Vector3(-13, 6.0, -11).normalize();
const sun = new THREE.DirectionalLight(0xfff1d8, 2.7);
sun.position.copy(sunDirDay).multiplyScalar(38);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -17; sun.shadow.camera.right = 17;
sun.shadow.camera.top = 17; sun.shadow.camera.bottom = -17;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun);
scene.add(sun.target);

// lantern point lights (dusk only)
const lanternLightMain = new THREE.PointLight(0xffb45c, 0, 11, 2);
const lanternLightSide = new THREE.PointLight(0xffb060, 0, 8, 2);
scene.add(lanternLightMain, lanternLightSide);

/* ============================================================
   PROCEDURAL TEXTURES (canvas — no downloaded assets)
   ============================================================ */
function makeCanvas(size, fn, h){
  const c = document.createElement('canvas');
  c.width = size; c.height = h || size;
  fn(c.getContext('2d'), c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const rand01 = Math.random;

const grassTex = makeCanvas(1024, (g,w,h) => {
  g.fillStyle = '#4e6140'; g.fillRect(0,0,w,h);
  for (let i=0;i<900;i++){
    const x=rand01()*w, y=rand01()*h, r=20+rand01()*90;
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    const dark = rand01()<0.5;
    grd.addColorStop(0, dark ? 'rgba(46,62,36,0.5)' : 'rgba(112,133,84,0.42)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  for (let i=0;i<5200;i++){
    g.fillStyle = `rgba(${20+rand01()*60|0},${40+rand01()*70|0},${18+rand01()*40|0},${0.25+rand01()*0.4})`;
    g.fillRect(rand01()*w, rand01()*h, 2+rand01()*4, 2+rand01()*6);
  }
  // dry moss / earth speckle
  for (let i=0;i<500;i++){
    g.fillStyle = `rgba(${120+rand01()*60|0},${110+rand01()*50|0},${70+rand01()*40|0},${0.12+rand01()*0.2})`;
    g.beginPath(); g.arc(rand01()*w, rand01()*h, 1+rand01()*3, 0, 7); g.fill();
  }
});
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(3,3);

const sandTex = makeCanvas(512, (g,w,h) => {
  g.fillStyle = '#c9bda0'; g.fillRect(0,0,w,h);
  for (let i=0;i<8000;i++){
    g.fillStyle = `rgba(${100+rand01()*120|0},${95+rand01()*110|0},${70+rand01()*90|0},${0.2+rand01()*0.35})`;
    g.fillRect(rand01()*w, rand01()*h, 1.5, 1.5);
  }
  g.strokeStyle='rgba(120,110,84,0.35)';
  for (let y=0;y<h;y+=14){ g.beginPath(); g.moveTo(0,y); g.bezierCurveTo(w*0.3,y+6,w*0.7,y-6,w,y); g.stroke(); }
});
sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping; sandTex.repeat.set(2,6);

const pebbleTex = makeCanvas(512, (g,w,h) => {
  g.fillStyle = '#4c514a'; g.fillRect(0,0,w,h);
  const tones = ['#7b8073','#8d8672','#6a6f63','#979e90','#5e6459','#a8a793','#84755f'];
  for (let i=0;i<420;i++){
    const x=rand01()*w, y=rand01()*h, r=6+rand01()*20;
    g.save(); g.translate(x,y); g.rotate(rand01()*Math.PI);
    g.fillStyle = tones[rand01()*tones.length|0];
    g.beginPath(); g.ellipse(0,0,r,r*(0.6+rand01()*0.5),0,0,7); g.fill();
    g.strokeStyle='rgba(20,22,20,0.55)'; g.lineWidth=2; g.stroke();
    g.fillStyle='rgba(255,255,255,0.16)';
    g.beginPath(); g.ellipse(-r*0.28,-r*0.3,r*0.55,r*0.32,0,0,7); g.fill();
    g.restore();
  }
});
pebbleTex.wrapS = pebbleTex.wrapT = THREE.RepeatWrapping;

const woodTex = makeCanvas(256, (g,w,h) => {
  g.fillStyle = '#5e4128'; g.fillRect(0,0,w,h);
  for (let x=0;x<w;x+=32){
    g.fillStyle='rgba(30,18,10,0.6)'; g.fillRect(x,0,2,h);
    for (let i=0;i<16;i++){
      g.strokeStyle=`rgba(${140+rand01()*60|0},${95+rand01()*40|0},${55+rand01()*30|0},${0.25+rand01()*0.35})`;
      g.lineWidth = 1+rand01()*2;
      const gx = x+4+rand01()*26;
      g.beginPath(); g.moveTo(gx,0);
      g.bezierCurveTo(gx+6,h*0.33,gx-6,h*0.66,gx+3,h); g.stroke();
    }
  }
});

const stoneTex = makeCanvas(256, (g,w,h) => {
  g.fillStyle = '#8f8f88'; g.fillRect(0,0,w,h);
  for (let i=0;i<2600;i++){
    g.fillStyle = `rgba(${80+rand01()*90|0},${80+rand01()*88|0},${74+rand01()*80|0},${0.3+rand01()*0.5})`;
    g.fillRect(rand01()*w, rand01()*h, 2, 2);
  }
  // moss staining creeping from the base
  const grd = g.createLinearGradient(0,h*0.55,0,h);
  grd.addColorStop(0,'rgba(70,92,52,0)'); grd.addColorStop(1,'rgba(70,92,52,0.65)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
});

const barkTex = makeCanvas(256, (g,w,h) => {
  g.fillStyle = '#453326'; g.fillRect(0,0,w,h);
  for (let i=0;i<180;i++){
    g.strokeStyle = `rgba(${20+rand01()*50|0},${15+rand01()*35|0},${10+rand01()*25|0},${0.4+rand01()*0.5})`;
    g.lineWidth = 1+rand01()*5;
    const x=rand01()*w;
    g.beginPath(); g.moveTo(x,0); g.bezierCurveTo(x+10,h*0.3,x-10,h*0.6,x+5,h); g.stroke();
  }
  for (let i=0;i<600;i++){ g.fillStyle='rgba(180,160,130,0.12)'; g.fillRect(rand01()*w,rand01()*h,3,6); }
});

const mapleTex = makeCanvas(256, (g,w,h) => {
  g.fillStyle = '#7e2c14'; g.fillRect(0,0,w,h);
  const reds=['#b8401d','#d65a26','#e2792f','#a53217','#e8a13c','#c9481f','#8f3418'];
  for (let i=0;i<700;i++){
    const x=rand01()*w, y=rand01()*h, s=4+rand01()*9;
    g.save(); g.translate(x,y); g.rotate(rand01()*Math.PI*2);
    g.fillStyle = reds[rand01()*reds.length|0];
    g.beginPath();
    for (let k=0;k<5;k++){
      const a = k/5*Math.PI*2;
      g.lineTo(Math.cos(a)*s, Math.sin(a)*s);
      g.lineTo(Math.cos(a+0.31)*s*0.45, Math.sin(a+0.31)*s*0.45);
    }
    g.closePath(); g.fill(); g.restore();
  }
});

const bambooTex = makeCanvas(128, (g,w,h) => {
  const grd=g.createLinearGradient(0,0,w,0);
  grd.addColorStop(0,'#2e5426'); grd.addColorStop(0.35,'#5d8a44'); grd.addColorStop(0.6,'#79a558'); grd.addColorStop(1,'#2c5024');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  for (let y=42;y<h;y+=52){
    g.fillStyle='rgba(24,40,18,0.9)'; g.fillRect(0,y,w,5);
    g.fillStyle='rgba(210,230,160,0.45)'; g.fillRect(0,y-2,w,2);
  }
}, 256);

function koiTexture(variant){
  return makeCanvas(256, (g,w,h) => {
    if (variant === 'ogon'){
      const grd=g.createLinearGradient(0,0,0,h);
      grd.addColorStop(0,'#f4c95e'); grd.addColorStop(0.5,'#e2a544'); grd.addColorStop(1,'#fdf0d0');
      g.fillStyle=grd; g.fillRect(0,0,w,h);
    } else {
      g.fillStyle = '#f2ecdf'; g.fillRect(0,0,w,h);  // kohaku / taisho
      // faint scale arcs
      g.strokeStyle='rgba(120,110,100,0.28)'; g.lineWidth=1;
      for (let y=8;y<h;y+=14) for (let x=((y/14)%2)*8; x<w; x+=16){
        g.beginPath(); g.arc(x,y,8,0,Math.PI); g.stroke();
      }
      const blotches = variant === 'taisho' ? 4 : 5;
      for (let i=0;i<blotches;i++){
        const x=20+rand01()*(w-40), y=15+rand01()*(h-30), r=12+rand01()*26;
        g.fillStyle = i===0 && variant==='taisho' ? '#3a322c' : (rand01()<0.5 ? '#c8502a' : '#d9702e');
        g.save(); g.translate(x,y); g.rotate(rand01()*3);
        g.beginPath(); g.ellipse(0,0,r,r*(0.55+rand01()*0.5),0,0,7); g.fill(); g.restore();
      }
      // subtle red cap between eyes
      g.fillStyle='#c8502a'; g.beginPath(); g.ellipse(w*0.5,h*0.12,14,9,0,0,7); g.fill();
    }
  }, 128);
}

const padTex = makeCanvas(256, (g,w,h) => {
  const grd=g.createRadialGradient(w/2,h/2,10,w/2,h/2,w/2);
  grd.addColorStop(0,'#425f2c'); grd.addColorStop(0.55,'#4f7234'); grd.addColorStop(0.92,'#38511f'); grd.addColorStop(1,'#2c3f1a');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(190,215,130,0.35)'; g.lineWidth=2;
  for (let i=0;i<22;i++){
    const a=i/22*Math.PI*2;
    g.beginPath(); g.moveTo(w/2,h/2); g.lineTo(w/2+Math.cos(a)*w*0.48, h/2+Math.sin(a)*h*0.48); g.stroke();
  }
  g.strokeStyle='rgba(20,30,12,0.6)'; g.lineWidth=9;
  g.beginPath(); g.arc(w/2,h/2,w*0.47,0,7); g.stroke();
});

const cloudTex = makeCanvas(256, (g,w,h) => {
  g.clearRect(0,0,w,h);
  for (let i=0;i<16;i++){
    const x=40+rand01()*(w-80), y=h*0.35+rand01()*h*0.35, r=22+rand01()*34;
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,'rgba(255,255,255,0.85)'); grd.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grd; g.fillRect(0,0,w,h);
  }
}, 128);

/* ============================================================
   POND MATH — shape, mask, obstacles
   ============================================================ */
function pondRadius(theta){
  return 1 + 0.17*Math.sin(3*theta + 1.7) + 0.115*Math.sin(5*theta + 0.4) + 0.06*Math.cos(8*theta + 2.1);
}
function pondNorm(x,z){ return Math.hypot(x/RX, z/RZ); }
function inPond(x,z){
  const th = Math.atan2(z/RZ, x/RX);
  return pondNorm(x,z) < pondRadius(th);
}
function edgeDistance(x,z){
  const th = Math.atan2(z/RZ, x/RX);
  return (pondRadius(th) - pondNorm(x,z)) * Math.min(RX,RZ);
}
// in-pond rocks carve obstacles out of the wave domain
const ROCKS = [
  { x: -3.4, z:  2.3, r: 1.15 },
  { x:  4.0, z: -2.7, r: 0.95 },
  { x:  0.6, z: -4.1, r: 0.62 }
];
function clearOfRocks(x,z,pad){
  for (const r of ROCKS){ if (Math.hypot(x-r.x, z-r.z) < r.r + pad) return false; }
  return true;
}
// world-space outline of the pond (used by ground hole, walls, bed)
const OUTLINE = [];
(function(){
  const N = 150;
  for (let i=0;i<N;i++){
    const th = i/N*Math.PI*2;
    const R_ = pondRadius(th);
    OUTLINE.push(new THREE.Vector2(Math.cos(th)*RX*R_, Math.sin(th)*RZ*R_));
  }
})();
function pondShape(scale){
  const s = new THREE.Shape();
  for (let i=0;i<OUTLINE.length;i++){
    const p = OUTLINE[i];
    const x = p.x*scale, y = -p.y*scale;   // shape Y maps to world -Z after rotateX(-PI/2)
    if (i===0) s.moveTo(x,y); else s.lineTo(x,y);
  }
  s.closePath();
  return s;
}

/* ============================================================
   2D WAVE EQUATION — heightfield solver (256×256)
   next = 2h − h_prev + c·∇²h, damping, reflecting boundaries
   along the pond rim and around rocks.
   ============================================================ */
const mask = new Float32Array(SIM*SIM);
(function buildMask(){
  for (let j=0;j<SIM;j++){
    for (let i=0;i<SIM;i++){
      const x = RECT.minX + (i+0.5)/SIM*RECT.w;
      const z = RECT.minZ + (j+0.5)/SIM*RECT.h;
      mask[j*SIM+i] = (inPond(x,z) && clearOfRocks(x,z,-0.12)) ? 1 : 0;
    }
  }
  // box-blur the mask for smoother boundary response
  const tmp = new Float32Array(SIM*SIM);
  for (let pass=0; pass<3; pass++){
    tmp.set(mask);
    for (let j=1;j<SIM-1;j++) for (let i=1;i<SIM-1;i++){
      const k=j*SIM+i;
      mask[k] = (tmp[k]*2 + tmp[k-1] + tmp[k+1] + tmp[k-SIM] + tmp[k+SIM]) / 6;
    }
  }
})();
function inRockClear(x,z,pad){ return clearOfRocks(x,z,pad); }

let hCur  = new Float32Array(SIM*SIM);
let hPrev = new Float32Array(SIM*SIM);
let hNext = new Float32Array(SIM*SIM);
let lastEnergy = 0;
const C_WAVE = 0.42, DAMP = 0.992;

function applySplat(wx, wz, radius, strength){
  const gx = (wx - RECT.minX)/RECT.w * SIM;
  const gz = (wz - RECT.minZ)/RECT.h * SIM;
  const gr = radius/RECT.w * SIM;
  const x0 = Math.max(1, Math.floor(gx-gr)), x1 = Math.min(SIM-2, Math.ceil(gx+gr));
  const z0 = Math.max(1, Math.floor(gz-gr)), z1 = Math.min(SIM-2, Math.ceil(gz+gr));
  for (let j=z0;j<=z1;j++) for (let i=x0;i<=x1;i++){
    const dx = i+0.5-gx, dz = j+0.5-gz, d = Math.hypot(dx,dz);
    if (d < gr){
      const fall = 0.5*(1 + Math.cos(Math.PI*d/gr));
      hCur[j*SIM+i] += strength*fall;
    }
  }
}
function stepSimulation(){
  for (let j=1;j<SIM-1;j++){
    const row = j*SIM;
    for (let i=1;i<SIM-1;i++){
      const k = row + i;
      if (mask[k] < 0.5){ hNext[k] = 0; continue; }
      const hc = hCur[k];
      // neighbours: solid cells reflect (treated as same height as centre)
      const hl = mask[k-1]   > 0.5 ? hCur[k-1]   : hc;
      const hr = mask[k+1]   > 0.5 ? hCur[k+1]   : hc;
      const hd = mask[k-SIM] > 0.5 ? hCur[k-SIM] : hc;
      const hu = mask[k+SIM] > 0.5 ? hCur[k+SIM] : hc;
      const lap = hl + hr + hd + hu - 4*hc;
      let next = (hc + (hc - hPrev[k]) + C_WAVE*lap) * DAMP;
      if (next > 1.6) next = 1.6; else if (next < -1.6) next = -1.6;
      hNext[k] = next;
    }
  }
  const t = hPrev; hPrev = hCur; hCur = hNext; hNext = t;
  // total wave energy (½ Σ h², scaled for readability)
  let e = 0;
  for (let k=0;k<hCur.length;k++) e += hCur[k]*hCur[k];
  lastEnergy = e*0.5;
}
function getH(wx, wz){
  const fx = THREE.MathUtils.clamp((wx - RECT.minX)/RECT.w, 0, 1)*(SIM-1);
  const fz = THREE.MathUtils.clamp((wz - RECT.minZ)/RECT.h, 0, 1)*(SIM-1);
  const i = Math.floor(fx), j = Math.floor(fz);
  const i1 = Math.min(i+1, SIM-1), j1 = Math.min(j+1, SIM-1);
  const tx = fx-i, tz = fz-j;
  const a = hCur[j*SIM+i], b = hCur[j*SIM+i1], c = hCur[j1*SIM+i], d = hCur[j1*SIM+i1];
  return (a*(1-tx) + b*tx)*(1-tz) + (c*(1-tx) + d*tx)*tz;
}
const _grad = { gx: 0, gz: 0 };
function waveGradient(x,z){
  const e = 0.22;
  _grad.gx = (getH(x+e,z) - getH(x-e,z))/(2*e);
  _grad.gz = (getH(x,z+e) - getH(x,z-e))/(2*e);
  return _grad;
}

}

const bedUniforms = {
  tPebble:    { value: pebbleTex },
  tHeight:    { value: heightTex },
  uTime:      { value: 0 },
  uDusk:      { value: 0 },
  uCaustic:   { value: 0.9 },
  uCausticColor: { value: new THREE.Color(0.72, 0.96, 0.90) },
  uFogColor:  { value: new THREE.Color(0xccd6cc) },
  uCamPos:    { value: new THREE.Vector3() },
  uRectMin:   { value: new THREE.Vector2(RECT.minX, RECT.minZ) },
  uRectSize:  { value: new THREE.Vector2(RECT.w, RECT.h) }
};
const bedMat = new THREE.ShaderMaterial({
  uniforms: bedUniforms,
  vertexShader: /* glsl */`
    varying vec3 vWorldPos;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tPebble, tHeight;
    uniform float uTime, uDusk, uCaustic;
    uniform vec3 uFogColor, uCamPos, uCausticColor;
    uniform vec2 uRectMin, uRectSize;
    varying vec3 vWorldPos;
    float hgt(vec2 uv){ return texture2D(tHeight, uv).r; }
    float caustic(vec2 uv, float t){
      vec2 p = mod(uv*6.28318531, 6.28318531) - 250.0;
      vec2 i = vec2(p);
      float c = 1.0, inten = 0.005;
      for (int n = 0; n < 4; n++){
        float tt = t * (1.0 - (3.5 / float(n+1)));
        i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
        c += 1.0 / length(vec2(p.x / max(sin(i.x+tt), 1e-4) / inten,
                               p.y / max(cos(i.y+tt), 1e-4) / inten));
      }
      c /= 4.0;
      c = 1.17 - pow(c, 1.4);
      return pow(abs(c), 7.0);
    }
    void main(){
      vec2 suv = vWorldPos.xz * 0.16;
      vec3 peb = texture2D(tPebble, suv).rgb;
      vec2 wuv = (vWorldPos.xz - uRectMin) / uRectSize;
      vec2 tx = vec2(1.0/256.0, 0.0);
      float hx = hgt(wuv + tx) - hgt(wuv - tx);
      float hz = hgt(wuv + tx.yx) - hgt(wuv - tx.yx);
      vec2 cw = vec2(hx, hz);
      float ca = caustic(suv*3.1 + cw*2.8, uTime*0.6);
      ca += 0.6*caustic(suv*5.3 - cw*3.6 + 17.0, uTime*0.45);
      vec3 amb  = mix(vec3(0.36,0.40,0.38), vec3(0.21,0.19,0.25), uDusk);
      vec3 warm = mix(vec3(0.60,0.58,0.50), vec3(0.46,0.29,0.22), uDusk);
      vec3 col = peb * (amb + warm*0.8);
      col += ca * uCausticColor * uCaustic;
      float dc = length(vWorldPos.xz / vec2(${RX.toFixed(2)}, ${RZ.toFixed(2)}));
      col *= mix(0.5, 1.05, smoothstep(0.0, 1.0, dc));
      float dist = length(uCamPos - vWorldPos);
      col = mix(col, uFogColor, smoothstep(26.0, 62.0, dist));
      gl_FragColor = vec4(col, 1.0);
    }`
});

(function buildPath(){

const waterUniforms = {
  tHeight:   { value: heightTex },
  tReflect:  { value: null },
  tRefract:  { value: null },
  uTime:     { value: 0 },
  uDusk:     { value: 0 },
  uAmp:      { value: 1.15 },
  uNormalScale: { value: 4.4 },
  uSunDir:   { value: sunDirDay.clone() },
  uSunColor: { value: new THREE.Color(1.0, 0.95, 0.82) },
  uSunGlint: { value: 1.25 },
  uCamPos:   { value: new THREE.Vector3() },
  uLanternPos: { value: new THREE.Vector3(4.35, 1.6, 6.15) },
  uFogColor: { value: new THREE.Color(0xccd6cc) },
  uRectMin:  { value: new THREE.Vector2(RECT.minX, RECT.minZ) },
  uRectSize: { value: new THREE.Vector2(RECT.w, RECT.h) },
  uTexMatrix:{ value: new THREE.Matrix4() },
  uResolution: { value: new THREE.Vector2(1,1) }
};
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: /* glsl */`
    uniform sampler2D tHeight;
    uniform float uAmp;
    uniform vec2 uRectMin, uRectSize;
    varying vec3 vWorldPos;
    varying vec2 vUvRect;
    void main(){
      vec3 pos = position;
      vec2 uvRect = (pos.xz - uRectMin) / uRectSize;
      vUvRect = uvRect;
      float h = texture2D(tHeight, uvRect).r;
      pos.y += h * uAmp;
      vWorldPos = pos;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tHeight, tReflect, tRefract;
    uniform float uTime, uDusk, uNormalScale, uSunGlint;
    uniform vec3 uSunDir, uSunColor, uCamPos, uLanternPos, uFogColor;
    uniform vec2 uResolution;
    uniform mat4 uTexMatrix;
    varying vec3 vWorldPos;
    varying vec2 vUvRect;
    float hgt(vec2 uv){ return texture2D(tHeight, uv).r; }
    void main(){
      vec2 texel = vec2(1.0/256.0, 0.0);
      float hL = hgt(vUvRect - texel),       hR = hgt(vUvRect + texel);
      float hD = hgt(vUvRect - texel.yx),    hU = hgt(vUvRect + texel.yx);
      vec3 n = normalize(vec3((hL - hR) * uNormalScale, 1.0, (hD - hU) * uNormalScale));
      // micro shimmer detail
      n.xz += 0.032 * vec2(
        sin(vWorldPos.x*6.3 + uTime*1.7) + sin(vWorldPos.x*13.7 - uTime*2.4),
        sin(vWorldPos.z*5.9 - uTime*1.4) + sin(vWorldPos.z*12.3 + uTime*2.1)
      );
      n = normalize(n);
      vec3 viewDir = normalize(uCamPos - vWorldPos);

      // planar reflection (projective)
      vec4 proj = uTexMatrix * vec4(vWorldPos, 1.0);
      vec2 reflUv = clamp(proj.xy / proj.w + n.xz * 0.075, 0.002, 0.998);
      vec3 refl = texture2D(tReflect, reflUv).rgb;

      // screen-space refraction of the pond bed
      vec2 scr = gl_FragCoord.xy / uResolution;
      vec2 refrUv = clamp(scr + n.xz * 0.085, 0.002, 0.998);
      vec3 refr = texture2D(tRefract, refrUv).rgb;
      refr = mix(refr, vec3(0.045, 0.145, 0.148), 0.30);   // depth tint

      // Schlick fresnel
      float fres = 0.025 + 0.975 * pow(1.0 - max(dot(viewDir, n), 0.0), 5.0);
      fres = clamp(fres, 0.0, 1.0);
      vec3 col = mix(refr, refl, fres);

      // sun glint — tight sparkle + broad path
      vec3 hv = normalize(viewDir + uSunDir);
      col += pow(max(dot(n, hv), 0.0), 260.0) * uSunGlint * uSunColor;
      col += pow(max(dot(reflect(-uSunDir, n), viewDir), 0.0), 24.0) * uSunColor * (0.10 + 0.38*uDusk);

      // lantern glint — warm path that wakes at dusk
      vec3 toL = uLanternPos - vWorldPos;
      float ld = length(toL);
      vec3 lv = toL / ld;
      float lspec = pow(max(dot(reflect(-lv, n), viewDir), 0.0), 110.0) * uDusk * 2.4 / (1.0 + 0.12*ld);
      col += lspec * vec3(1.0, 0.62, 0.28);

      // foam on crests
      float g = length(vec2(hL - hR, hD - hU));
      float foam = smoothstep(0.26, 0.6, g) * (0.5 + 0.5*sin(uTime*3.0 + vWorldPos.x*17.0 + vWorldPos.z*14.0));
      col += foam * 0.16 * vec3(0.9, 0.97, 0.95);

      // atmospheric haze
      float dist = length(uCamPos - vWorldPos);
      col = mix(col, uFogColor, smoothstep(26.0, 62.0, dist));
      gl_FragColor = vec4(col, 1.0);
    }`
});

const mirrorCam = new THREE.PerspectiveCamera();
const texMatrix = new THREE.Matrix4();
const _camDir = new THREE.Vector3(), _camTarget = new THREE.Vector3();
function renderReflection(){
  mirrorCam.position.set(camera.position.x, -camera.position.y, camera.position.z);
  mirrorCam.up.set(0,-1,0);
  camera.getWorldDirection(_camDir);
  _camTarget.copy(camera.position).add(_camDir);
  mirrorCam.lookAt(_camTarget.x, -_camTarget.y, _camTarget.z);
  mirrorCam.projectionMatrix.copy(camera.projectionMatrix);
  mirrorCam.updateMatrixWorld();
  texMatrix.set(0.5,0,0,0.5,  0,0.5,0,0.5,  0,0,0.5,0.5,  0,0,0,1);
  texMatrix.multiply(mirrorCam.projectionMatrix);
  texMatrix.multiply(mirrorCam.matrixWorldInverse);
  waterUniforms.uTexMatrix.value.copy(texMatrix);

  water.visible = false; bed.visible = false; koiGroup.visible = false;
  renderer.setRenderTarget(rtReflect);

  water.visible = true; bed.visible = true; koiGroup.visible = true;
}

      uniform float uDusk, uTime;

// --- wooden footbridge over the pond, arcing along Z at x = 2.0 ---
const BRIDGE_CX = 2.0, BRIDGE_HALF = 8.3, BRIDGE_ARC = 1.75;
const bridgeY = z => BRIDGE_ARC * (1 - (z/BRIDGE_HALF)*(z/BRIDGE_HALF)) + 0.18;
(function buildBridge(){
  const bridge = new THREE.Group();
  const N = 26;
  for (let i=0;i<N;i++){
    const z = -BRIDGE_HALF + (i+0.5)*(2*BRIDGE_HALF/N);
    const y = bridgeY(z);
    const m = -2*BRIDGE_ARC*z/(BRIDGE_HALF*BRIDGE_HALF);
    const plank = new THREE.Mesh(new THREE.BoxGeometry(1.78, 0.09, 0.66), woodMat);
    plank.position.set(BRIDGE_CX, y, z);
    plank.rotation.x = -Math.atan(m);
    plank.castShadow = plank.receiveShadow = true;
    bridge.add(plank);
  }
  // curved handrails (both sides)
  for (const side of [-0.92, 0.92]){
    const pts = [];
    for (let i=0;i<=14;i++){
      const z = -BRIDGE_HALF + i*(2*BRIDGE_HALF/14);
      pts.push(new THREE.Vector3(BRIDGE_CX + side, bridgeY(z) + 0.74, z));
    }
    const rail = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.055, 8), darkWoodMat);
    rail.castShadow = true;
    bridge.add(rail);
  }
  // posts + finials
  for (const side of [-0.92, 0.92]){
    for (const z of [-6.2, -3.1, 0, 3.1, 6.2]){
      const y = bridgeY(z);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.095, 0.82, 8), darkWoodMat);
      post.position.set(BRIDGE_CX + side, y + 0.38, z);
      post.castShadow = true;
      bridge.add(post);
      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.095, 10, 8), new THREE.MeshStandardMaterial({ color: 0xd8c078, roughness: 0.35, metalness: 0.7 }));
      finial.position.set(BRIDGE_CX + side, y + 0.82, z);
      bridge.add(finial);
    }
  }
  // stone landings at both ends
  for (const z of [-8.55, 8.55]){
    for (const dx of [-0.5, 0.5]){
      const st = new THREE.CylinderGeometry(0.42, 0.5, 0.14, 9);
      const s = new THREE.Mesh(st, stoneMat);
      s.position.set(BRIDGE_CX + dx, 0.22, z);
      s.castShadow = s.receiveShadow = true;
      bridge.add(s);
    }
  }
  scene.add(bridge);
})();

// --- stone lanterns (tōrō); windows glow at dusk ---
const lanternWindows = [];
function makeLantern(scale, x, z, faceAngle){
  const g = new THREE.Group();
  const add = (geo, y, mat) => {
    const m = new THREE.Mesh(geo, mat || stoneMat);
    m.position.y = y; m.castShadow = m.receiveShadow = true; g.add(m); return m;
  };
  add(new THREE.BoxGeometry(1.02, 0.2, 1.02), 0.1);
  add(new THREE.CylinderGeometry(0.36, 0.43, 0.2, 10), 0.3);
  add(new THREE.CylinderGeometry(0.17, 0.21, 0.62, 10), 0.71);
  add(new THREE.BoxGeometry(0.66, 0.13, 0.66), 1.08);
  add(new THREE.BoxGeometry(0.47, 0.42, 0.47), 1.35);
  // emissive fire windows on all four faces
  const winMat = new THREE.MeshStandardMaterial({ color: 0x2a2118, emissive: 0xffb45c, emissiveIntensity: 0.06, roughness: 0.6 });
  for (let i=0;i<4;i++){
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.2), winMat);
    const a = i*Math.PI/2;
    win.position.set(Math.sin(a)*0.242, 1.35, Math.cos(a)*0.242);
    win.rotation.y = a;
    g.add(win);
  }
  lanternWindows.push(winMat);
  const roof = add(new THREE.ConeGeometry(0.66, 0.38, 4), 1.75);
  roof.rotation.y = Math.PI/4;
  add(new THREE.SphereGeometry(0.1, 10, 8), 2.02);
  g.scale.setScalar(scale);
  g.position.set(x, 0.17, z);
  g.rotation.y = faceAngle;
  scene.add(g);
  return g;
}

makeLantern(0.8, -9.3, -2.6, Math.PI*0.32);       // smaller companion lantern

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.55, 3.1, 12), trunkMat);
  trunk.position.y = 1.55; trunk.rotation.z = 0.09; trunk.castShadow = true; g.add(trunk);
  const branchData = [[0.5,3.0,-0.2, 0.9, 0.5,0.16],[-0.45,2.6,0.35, -0.8, 0.7,0.14],[0.1,3.4,0.4, 0.3, 0.9,0.12]];
  for (const [bx,by,bz, rz, len, r] of branchData){
    const br = new THREE.Mesh(new THREE.CylinderGeometry(r*0.55, r, len*2.2, 8), trunkMat);
    br.position.set(bx, by + len*0.7, bz);
    br.rotation.z = rz; br.rotation.x = (rand01()-0.5)*0.6;
    br.castShadow = true; g.add(br);
  }
  const leafMat = new THREE.MeshStandardMaterial({ map: mapleTex, roughness: 0.9, color: 0xffffff });
  const blobs = [[0,4.6,0,1.75],[1.35,3.9,0.5,1.25],[-1.3,4.0,-0.3,1.3],[0.5,3.6,1.25,1.05],[-0.6,3.8,-1.2,1.1],[0.2,5.6,-0.4,1.15]];

    blob.position.set(x,y,z);

})();

// --- bamboo clusters ---
function buildBamboo(cx, cz, count, seed){
  const g = new THREE.Group();
  const rng = mulberry32(seed);
  const stalkMat = new THREE.MeshStandardMaterial({ map: bambooTex, roughness: 0.6, color: 0xffffff });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x46703a, roughness: 0.8, side: THREE.DoubleSide });
  for (let i=0;i<count;i++){
    const a = rng()*Math.PI*2, d = rng()*1.15;
    const h = 2.6 + rng()*1.9;
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, h, 7), stalkMat);
    stalk.position.set(Math.cos(a)*d, h/2, Math.sin(a)*d);
    stalk.rotation.z = (rng()-0.5)*0.14; stalk.rotation.x = (rng()-0.5)*0.14;
    stalk.castShadow = true;
    g.add(stalk);
    for (let l=0;l<4;l++){
      const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.14), leafMat);
      leaf.position.set(stalk.position.x + (rng()-0.5)*0.5, h*(0.75+rng()*0.25), stalk.position.z + (rng()-0.5)*0.5);
      leaf.rotation.set(rng()*0.9-0.45, rng()*Math.PI*2, rng()*0.5-0.25);
      g.add(leaf);
    }
  }
  g.position.set(cx, 0.17, cz);
  scene.add(g);
}

// --- mossy rocks ---
const rockMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 1, vertexColors: true });
function makeRock(x, z, r, inWater, seed){
  const geo = new THREE.IcosahedronGeometry(r, 2);
  const posA = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i=0;i<posA.count;i++){
    v.fromBufferAttribute(posA, i);
    const d = 1 + 0.26*Math.sin(5*v.x + seed) * Math.sin(4.3*v.y + seed*2.1) * Math.sin(6.1*v.z + seed*0.7)
                 + 0.1*Math.sin(11*v.y + seed*3.3);
    v.multiplyScalar(d);
    posA.setXYZ(i, v.x, v.y*0.82, v.z);
  }
  geo.computeVertexNormals();
  // vertex colours: grey stone with moss on upward faces
  const colors = new Float32Array(posA.count*3);
  const nrm = geo.attributes.normal;
  const cStone = new THREE.Color(0x8b8d84), cMoss = new THREE.Color(0x51663c), cDark = new THREE.Color(0x3c403c);
  for (let i=0;i<posA.count;i++){
    const up = nrm.getY(i)*0.5 + 0.5;
    const c = cStone.clone().lerp(cMoss, Math.pow(up, 1.6)*0.85);
    c.lerp(cDark, Math.pow(1-up, 2.0)*0.5);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const rock = new THREE.Mesh(geo, rockMat);
  rock.position.set(x, inWater ? -r*0.28 : r*0.42, z);
  rock.rotation.y = seed*2.4;
  rock.castShadow = rock.receiveShadow = true;
  scene.add(rock);
  return rock;
}
for (const rk of ROCKS) makeRock(rk.x, rk.z, rk.r, true, rk.r*7.3);
makeRock(7.9, 3.5, 0.85, false, 3.1);
makeRock(-5.7, 6.6, 0.7, false, 5.7);

/* ============================================================
   KOI — five fish, smooth steering, wakes on the water
   ============================================================ */
const koiGroup = new THREE.Group();
scene.add(koiGroup);
const koiBodyGeo = new THREE.SphereGeometry(0.32, 22, 16);
koiBodyGeo.scale(0.74, 0.6, 1.85);
const tailShape = new THREE.Shape();
tailShape.moveTo(0,0); tailShape.lineTo(-0.52, 0.32); tailShape.lineTo(-0.36, 0); tailShape.lineTo(-0.52, -0.32); tailShape.closePath();
const tailGeo = new THREE.ShapeGeometry(tailShape, 6);
const finGeo = new THREE.CircleGeometry(0.14, 8, 0, Math.PI*0.85);
const eyeGeo = new THREE.SphereGeometry(0.035, 8, 6);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.25 });

const KOI_DEFS = [
  { tex: koiTexture('kohaku'), x: -5.0, z:  1.2, heading:  0.6, speed: 1.05 },
  { tex: koiTexture('taisho'), x: -1.6, z: -2.6, heading: -1.9, speed: 0.90 },
  { tex: koiTexture('ogon'),   x:  1.9, z:  2.8, heading:  2.4, speed: 1.15 },
  { tex: koiTexture('kohaku'), x:  4.6, z:  0.4, heading:  2.9, speed: 0.95 },
  { tex: koiTexture('taisho'), x: -3.1, z: -3.6, heading:  0.2, speed: 1.1  }
];
const koi = [];
for (const def of KOI_DEFS){
  const g = new THREE.Group();
  const body = new THREE.Mesh(koiBodyGeo, new THREE.MeshStandardMaterial({ map: def.tex, roughness: 0.45, metalness: 0.05 }));
  body.castShadow = true;
  g.add(body);
  const tail = new THREE.Mesh(tailGeo, new THREE.MeshStandardMaterial({ color: 0xd96a35, roughness: 0.6, side: THREE.DoubleSide, transparent: true, opacity: 0.96 }));
  tail.rotation.y = Math.PI/2;
  tail.position.z = -0.58;
  g.add(tail);
  for (const s of [-1, 1]){
    const fin = new THREE.Mesh(finGeo, new THREE.MeshStandardMaterial({ color: 0xe0824a, roughness: 0.6, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
    fin.position.set(s*0.22, -0.05, 0.15);
    fin.rotation.set(0.5, s*0.9, s*0.5);
    g.add(fin);
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(s*0.135, 0.075, 0.42);
    g.add(eye);
  }
  g.position.set(def.x, -0.3, def.z);
  koiGroup.add(g);
  koi.push({
    mesh: g, tail,
    pos: new THREE.Vector3(def.x, -0.3, def.z),
    vel: new THREE.Vector3(Math.sin(def.heading), 0, Math.cos(def.heading)).multiplyScalar(def.speed),
    heading: def.heading, speed: def.speed,
    wanderTarget: new THREE.Vector2(def.x*0.5, def.z*0.5),
    wanderTimer: 0, phase: rand01()*Math.PI*2, wakeTimer: 0
  });
}
function randomPointInPond(){
  for (let i=0;i<30;i++){
    const x = (R()*2-1)*RX, z = (R()*2-1)*RZ;
    if (inPond(x,z) && clearOfRocks(x,z,0.9) && edgeDistance(x,z) > 1.0) return new THREE.Vector2(x,z);
  }
  return new THREE.Vector2(0,0);
}
function updateKoi(dt, t){
  for (const k of koi){
    k.wanderTimer -= dt;
    const dTarget = k.wanderTarget.distanceTo(new THREE.Vector2(k.pos.x, k.pos.z));
    if (k.wanderTimer <= 0 || dTarget < 1.3){
      k.wanderTarget = randomPointInPond();
      k.wanderTimer = 3 + R()*3;
    }
    const desired = new THREE.Vector3(k.wanderTarget.x - k.pos.x, 0, k.wanderTarget.y - k.pos.z);
    desired.normalize().multiplyScalar(k.speed);
    // rock avoidance — steer away
    for (const rk of ROCKS){
      const dx = k.pos.x - rk.x, dz = k.pos.z - rk.z;
      const d = Math.hypot(dx, dz), range = rk.r + 1.15;
      if (d < range && d > 0.001){
        const push = (range - d)/range;
        desired.x += (dx/d)*push*2.6; desired.z += (dz/d)*push*2.6;
      }
    }
    // keep off the banks
    const ed = edgeDistance(k.pos.x, k.pos.z);
    if (ed < 1.35){
      const pull = (1.35 - ed)/1.35;
      desired.x += (-k.pos.x)*pull*0.9; desired.z += (-k.pos.z)*pull*0.9;
    }
    desired.setLength(k.speed);
    k.vel.lerp(desired, 1 - Math.exp(-dt*1.7));
    k.pos.x += k.vel.x*dt; k.pos.z += k.vel.z*dt;
    const hv = k.vel.lengthSq() > 0.001 ? Math.atan2(k.vel.x, k.vel.z) : k.heading;
    let diff = hv - k.heading;
    while (diff > Math.PI) diff -= Math.PI*2; while (diff < -Math.PI) diff += Math.PI*2;
    k.heading += diff * Math.min(1, dt*3.2);
    // bob on the surface wave field
    const h = getH(k.pos.x, k.pos.z);
    k.pos.y = -0.30 + h*0.55;
    k.mesh.position.copy(k.pos);
    const wag = Math.sin(t*6.5 + k.phase + k.pos.x*0.5);
    k.mesh.rotation.y = k.heading + wag*0.09;
    k.tail.rotation.x = wag*0.6;
    k.mesh.rotation.z = THREE.MathUtils.clamp(diff*1.6, -0.3, 0.3);
    // wake — small ripple injected behind the koi
    k.wakeTimer -= dt;
    if (k.wakeTimer <= 0){
      const bx = k.pos.x - Math.sin(k.heading)*0.55, bz = k.pos.z - Math.cos(k.heading)*0.55;
      applySplat(bx, bz, 0.55, 0.055);
      k.wakeTimer = 0.13;
    }
  }
}

/* ============================================================
   LILY PADS — bob on the waves · FALLEN PETALS — drift
   ============================================================ */
const padPositions = [[-4.6,-1.2],[-5.5,0.5],[2.6,2.6],[3.4,1.5],[-1.2,3.7],[0.9,4.0],[-6.2,-2.7]];
const pads = [];
(function buildPads(){
  for (const [x0,z0] of padPositions){
    let x = x0, z = z0, guard = 0;
    while ((!inPond(x,z) || !clearOfRocks(x,z,0.6)) && guard++ < 20){ x *= 0.85; z *= 0.85; }
    const r = 0.34 + rand01()*0.3;
    const notch = 0.4 + rand01()*0.2;
    const shape = new THREE.Shape();
    shape.absarc(0, 0, r, notch, Math.PI*2 - notch, false);
    shape.lineTo(0,0); shape.closePath();
    const geo = new THREE.ShapeGeometry(shape, 26);
    // normalize uv to [0,1] for the pad texture
    const uvA = geo.attributes.uv;
    for (let i=0;i<uvA.count;i++) uvA.setXY(i, uvA.getX(i)/(2*r) + 0.5, uvA.getY(i)/(2*r) + 0.5);
    geo.rotateX(-Math.PI/2);
    const pad = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: padTex, roughness: 0.55, side: THREE.DoubleSide }));
    pad.position.set(x, 0.02, z);
    pad.rotation.y = rand01()*Math.PI*2;
    pad.castShadow = pad.receiveShadow = true;
    scene.add(pad);
    pads.push({ mesh: pad, x, z, r, baseRot: pad.rotation.y, phase: rand01()*7 });
  }
  // two closed lotus buds for charm
  const budMat = new THREE.MeshStandardMaterial({ color: 0xe58bb0, roughness: 0.5, emissive: 0x43182a, emissiveIntensity: 0.4 });
  for (const idx of [0, 4]){
    const p = pads[idx];
    const bud = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.22, 8), budMat);
    bud.position.set(0.1, 0.16, 0.05);
    bud.castShadow = true;
    p.mesh.add(bud);
  }
})();
function updatePads(t){
  for (const p of pads){
    const g = waveGradient(p.x, p.z);
    const h = getH(p.x, p.z);
    p.mesh.position.y = 0.025 + h*0.92;
    p.mesh.rotation.x = THREE.MathUtils.clamp(g.gz*2.1, -0.35, 0.35);
    p.mesh.rotation.z = THREE.MathUtils.clamp(-g.gx*2.1, -0.35, 0.35);
    p.mesh.rotation.y = p.baseRot + Math.sin(t*0.11 + p.phase)*0.18;
  }
}

const petals = [];
(function buildPetals(){
  const shape = new THREE.Shape();
  shape.absellipse(0, 0, 0.075, 0.16, 0, Math.PI*2);
  const geo = new THREE.ShapeGeometry(shape, 12);
  geo.rotateX(-Math.PI/2);
  const tones = [0xf4a8bd, 0xeda0b6, 0xf7c3cf, 0xe58ba6];
  const rng = mulberry32(555);
  for (let i=0;i<14;i++){
    let x, z, guard = 0;
    do { x = (rng()*2-1)*RX*0.85; z = (rng()*2-1)*RZ*0.85; } while ((!inPond(x,z) || !clearOfRocks(x,z,0.5)) && guard++ < 30);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: tones[i%tones.length], roughness: 0.6, side: THREE.DoubleSide }));
    m.position.set(x, 0.03, z);
    scene.add(m);
    petals.push({ mesh: m, x, z, heading: rng()*Math.PI*2, spin: (rng()-0.5)*0.7, phase: rng()*9 });
  }
})();
function updatePetals(dt, t){
  for (const p of petals){
    const g = waveGradient(p.x, p.z);
    p.heading += Math.sin(t*0.4 + p.phase)*0.15*dt;
    p.x += (Math.cos(p.heading)*0.16 + g.gx*0.55)*dt;
    p.z += (Math.sin(p.heading)*0.16 + g.gz*0.55)*dt;
    // gentle containment — steer back into the pond
    const ed = edgeDistance(p.x, p.z);
    if (ed < 0.9){ p.x += (-p.x)*0.35*dt; p.z += (-p.z)*0.35*dt; p.heading += dt*1.5; }
    const h = getH(p.x, p.z);
    p.mesh.position.set(p.x, 0.028 + h*0.95, p.z);
    p.mesh.rotation.x = THREE.MathUtils.clamp(g.gz*2.2, -0.4, 0.4);
    p.mesh.rotation.z = THREE.MathUtils.clamp(-g.gx*2.2, -0.4, 0.4);
    p.mesh.rotation.y += p.spin*dt;
  }
}

/* ============================================================
   RAIN — drops fall, ripples ring out · splash rings
   ============================================================ */
const state = { raining: true, duskTarget: 0 };
const env = { dusk: 0, time: 0 };

const DROP_POOL = 90;
const dropGeo = new THREE.CylinderGeometry(0.008, 0.016, 0.55, 5);
const dropMat = new THREE.MeshBasicMaterial({ color: 0xd8e2ea, transparent: true, opacity: 0.55, depthWrite: false });
const drops = [];
for (let i=0;i<DROP_POOL;i++){
  const m = new THREE.Mesh(dropGeo, dropMat);
  m.visible = false;
  scene.add(m);
  drops.push({ mesh: m, active: false, vy: 0 });
}
const RING_POOL = 26;
const ringGeo = new THREE.RingGeometry(0.16, 0.24, 40);
ringGeo.rotateX(-Math.PI/2);
const rings = [];
for (let i=0;i<RING_POOL;i++){
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xe8f0ee, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  m.visible = false;
  scene.add(m);
  rings.push({ mesh: m, age: 1e9 });
}
function randomPondPoint(){
  for (let i=0;i<20;i++){
    const x = (R()*2-1)*RX, z = (R()*2-1)*RZ;
    if (inPond(x,z) && clearOfRocks(x,z,0.1)) return [x,z];
  }
  return [0,0];
}
let rainSpawnAcc = 0;
function spawnDrop(){
  const d = drops.find(d => !d.active);
  if (!d) return;
  const [x,z] = randomPondPoint();
  d.mesh.position.set(x, 6.5 + R()*2.5, z);
  d.mesh.rotation.set((R()-0.5)*0.15, 0, (R()-0.5)*0.15);
  d.vy = 8.5 + R()*2;
  d.active = true; d.mesh.visible = true;
}
function updateRain(dt){
  if (state.raining){
    rainSpawnAcc += dt*64;
    while (rainSpawnAcc >= 1){ rainSpawnAcc -= 1; spawnDrop(); }
  }
  for (const d of drops){
    if (!d.active) continue;
    d.mesh.position.y -= d.vy*dt;
    if (d.mesh.position.y <= getH(d.mesh.position.x, d.mesh.position.z) + 0.02){
      applySplat(d.mesh.position.x, d.mesh.position.z, 0.42, 0.23);
      const ring = rings.find(r => r.age > 0.9);
      if (ring){
        ring.age = 0;
        ring.mesh.position.set(d.mesh.position.x, 0.03, d.mesh.position.z);
        ring.mesh.visible = true;
      }
      d.active = false; d.mesh.visible = false;
    }
  }
  for (const r of rings){
    if (r.age > 0.9){ r.mesh.visible = false; continue; }
    r.age += dt;
    const s = 1 + r.age*7.5;
    r.mesh.scale.set(s, 1, s);
    r.mesh.position.y = 0.028 + getH(r.mesh.position.x, r.mesh.position.z)*0.9;
    r.mesh.material.opacity = Math.max(0, 0.55*(1 - r.age/0.9));
  }
}
function hideRain(){
  for (const d of drops){ d.active = false; d.mesh.visible = false; }
  for (const r of rings){ r.age = 1e9; r.mesh.visible = false; }
  rainSpawnAcc = 0;
}

/* ============================================================
   INTERACTION — click & drag ripples, Space rain, N dusk
   ============================================================ */
const raycaster = new THREE.Raycaster();
const waterPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const ndc = new THREE.Vector2();
const hitPoint = new THREE.Vector3();
let pointerDown = false;
let lastRippleX = 0, lastRippleZ = 0;
function pointerToPond(e){
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - rect.left)/rect.width)*2 - 1, -((e.clientY - rect.top)/rect.height)*2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(waterPlane, hitPoint)){
    if (inPond(hitPoint.x, hitPoint.z)) return hitPoint;
  }
  return null;
}
renderer.domElement.addEventListener('pointerdown', e => {
  const p = pointerToPond(e);
  if (p){
    pointerDown = true;
    lastRippleX = p.x; lastRippleZ = p.z;
    applySplat(p.x, p.z, 1.05, 0.85);
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!pointerDown) return;
  const p = pointerToPond(e);
  if (!p) return;
  if (Math.hypot(p.x - lastRippleX, p.z - lastRippleZ) > 0.42){
    applySplat(p.x, p.z, 0.62, 0.5);
    lastRippleX = p.x; lastRippleZ = p.z;
  }
});
const endPointer = () => { pointerDown = false; };
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', endPointer);

window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); state.raining = !state.raining; }
  else if (e.code === 'KeyN'){ state.duskTarget = state.duskTarget > 0.5 ? 0 : 1; }
});

  hemiSkyDay: new THREE.Color(0xbfd9e2), hemiSkyDusk: new THREE.Color(0x4b4364),
  hemiGndDay: new THREE.Color(0x51604a), hemiGndDusk: new THREE.Color(0x201c26),
  sunDay: new THREE.Color(0xfff1d8), sunDusk: new THREE.Color(0xff9e5e),
  waterSunDay: new THREE.Color(1.0, 0.95, 0.82), waterSunDusk: new THREE.Color(1.0, 0.62, 0.34),
  causticDay: new THREE.Color(0.72, 0.96, 0.90), causticDusk: new THREE.Color(1.0, 0.6, 0.32),
  cloudDay: new THREE.Color(0xffffff), cloudDusk: new THREE.Color(0xe8a080)
};
const _c1 = new THREE.Color(), _c2 = new THREE.Color(), _c3 = new THREE.Color();
const _v1 = new THREE.Vector3();
function applyEnvironment(d){
  scene.fog.color.copy(_c1.copy(COL.fogDay).lerp(COL.fogDusk, d));
  hemi.color.copy(_c1.copy(COL.hemiSkyDay).lerp(COL.hemiSkyDusk, d));
  hemi.groundColor.copy(_c1.copy(COL.hemiGndDay).lerp(COL.hemiGndDusk, d));
  hemi.intensity = THREE.MathUtils.lerp(0.85, 0.55, d);
  sun.color.copy(_c1.copy(COL.sunDay).lerp(COL.sunDusk, d));
  sun.intensity = THREE.MathUtils.lerp(2.7, 1.15, d);
  _v1.copy(sunDirDay).lerp(sunDirDusk, d).normalize();
  sun.position.copy(_v1).multiplyScalar(38);
  // sky + water
  skyUniforms.uDusk.value = d;
  skyUniforms.uSunDir.value.copy(_v1);
  waterUniforms.uDusk.value = d;
  waterUniforms.uSunDir.value.copy(_v1);
  waterUniforms.uSunColor.value.copy(_c1.copy(COL.waterSunDay).lerp(COL.waterSunDusk, d));
  waterUniforms.uSunGlint.value = THREE.MathUtils.lerp(1.25, 0.95, d);
  waterUniforms.uFogColor.value.copy(scene.fog.color);
  // bed caustics
  bedUniforms.uDusk.value = d;
  bedUniforms.uCaustic.value = THREE.MathUtils.lerp(0.9, 0.42, d);
  bedUniforms.uCausticColor.value.copy(_c1.copy(COL.causticDay).lerp(COL.causticDusk, d));
  bedUniforms.uFogColor.value.copy(scene.fog.color);
  // lanterns
  const flick = 1 + 0.09*Math.sin(env.time*13.7) + 0.06*Math.sin(env.time*29.3 + 1.7);
  lanternLightMain.intensity = d*26*flick;
  lanternLightSide.intensity = d*13*flick;
  for (const w of lanternWindows) w.emissiveIntensity = 0.06 + d*2.6*flick;
  // bloom + clouds
  bloomPass.strength = THREE.MathUtils.lerp(0.32, 0.8, d);
  for (const c of clouds) c.material.color.copy(_c1.copy(COL.cloudDay).lerp(COL.cloudDusk, d));
}

/* ============================================================
   POST — composer with bloom
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.32, 0.6, 0.78);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

function setRTSizes(){
  const w = Math.floor(window.innerWidth/2), h = Math.floor(window.innerHeight/2);
  rtReflect.setSize(w, h);
  rtRefract.setSize(w, h);
  waterUniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
}
setRTSizes();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  setRTSizes();
});

/* ============================================================
   RENDER FRAME + BENCH
   ============================================================ */
let heightDirty = true;
function renderFrame(){
  uploadHeightTexture();
  waterUniforms.uCamPos.value.copy(camera.position);
  bedUniforms.uCamPos.value.copy(camera.position);
  bedUniforms.uTime.value = env.time;
  waterUniforms.uTime.value = env.time;
  skyUniforms.uTime.value = env.time;
  renderReflection();
  renderRefraction();
  composer.render();
}
function updateBench(){
  window.__bench = {
    gridSize: SIM,
    raining: state.raining,
    koi: koi.map(k => ({ x: +k.pos.x.toFixed(2), z: +k.pos.z.toFixed(2), heading: +k.heading.toFixed(3), speed: +k.vel.length().toFixed(2) })),
    energy: +lastEnergy.toFixed(4)
  };
}

/* ============================================================
   SHOWCASE — deterministic 12 s cinematic
   camera dolly → rain burst → clicked ripples → dusk → lantern
   ============================================================ */
const camCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(16.5, 10.0, 18.0),
  new THREE.Vector3(11.0,  5.4, 12.6),
  new THREE.Vector3( 6.1,  1.8, 10.1),
  new THREE.Vector3(-1.2,  1.15, 7.2),
  new THREE.Vector3( 0.6,  1.35, 8.9),
  new THREE.Vector3( 6.6,  2.1, 10.6),
  new THREE.Vector3(13.2,  8.2, 16.2)
], false, 'catmullrom', 0.35);
const tgtCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0.0, -0.3,  0.0),
  new THREE.Vector3( 0.4,  0.0,  0.6),
  new THREE.Vector3(-0.6,  0.0,  1.0),
  new THREE.Vector3(-2.4, -0.2,  0.4),
  new THREE.Vector3( 2.4,  0.3,  4.2),
  new THREE.Vector3( 4.35, 1.15, 6.15),
  new THREE.Vector3( 0.0,  0.4,  0.0)
], false, 'catmullrom', 0.35);

// deterministic snapshot of the initial world (captured with the build rng)
const initialKoi = koi.map(k => ({ x: k.pos.x, z: k.pos.z, heading: k.heading, speed: k.speed }));
const initialPads = pads.map(p => ({ x: p.x, z: p.z }));
const initialPetals = petals.map(p => ({ x: p.x, z: p.z, heading: p.heading }));

let showcaseTriggers = [];
function resetShowcase(){
  R = mulberry32(0x5EED12);
  hCur.fill(0); hPrev.fill(0); hNext.fill(0); lastEnergy = 0;
  env.time = 0;
  for (let i=0;i<koi.length;i++){
    const k = koi[i], s = initialKoi[i];
    k.pos.set(s.x, -0.3, s.z);
    k.vel.set(Math.sin(s.heading), 0, Math.cos(s.heading)).multiplyScalar(s.speed);
    k.heading = s.heading; k.speed = s.speed;
    k.wanderTarget.set(s.x*0.5, s.z*0.5);
    k.wanderTimer = 0; k.wakeTimer = 0;
    k.mesh.position.copy(k.pos);
    k.mesh.rotation.set(0, s.heading, 0);
  }
  for (let i=0;i<pads.length;i++){
    const p = pads[i]; p.x = initialPads[i].x; p.z = initialPads[i].z;
    p.mesh.position.set(p.x, 0.02, p.z);
  }
  for (let i=0;i<petals.length;i++){
    const p = petals[i]; p.x = initialPetals[i].x; p.z = initialPetals[i].z; p.heading = initialPetals[i].heading;
    p.mesh.position.set(p.x, 0.03, p.z);
  }
  hideRain();
  state.raining = false;
  // scripted events fire in order as the fixed-step clock crosses them
  showcaseTriggers = [
    { t: 0.4, fn: () => { state.raining = true; } },
    { t: 2.6, fn: () => { applySplat(-1.6, 1.6, 1.3, 1.15); } },   // viewer's click
    { t: 4.8, fn: () => { applySplat( 2.6,-2.1, 1.1, 0.95); } },   // second ripple
    { t: 6.0, fn: () => { state.raining = false; } }
  ];
}
function updateShowcaseClock(prevT, nowT){
  for (const e of showcaseTriggers){
    if (prevT < e.t && nowT >= e.t) e.fn();
  }
}
const smoothstep = (a,b,x) => { const t = THREE.MathUtils.clamp((x-a)/(b-a), 0, 1); return t*t*(3-2*t); };

function seek(t){
  t = THREE.MathUtils.clamp(t, 0, SHOWCASE_DURATION);
  resetShowcase();
  controls.enabled = false;

  // re-run the simulation deterministically from t=0 in fixed steps
  const steps = Math.floor(t / FIXED_DT);
  let simT = 0;
  for (let i=0;i<steps;i++){
    stepSimulation();
    simT += FIXED_DT;
    updateShowcaseClock(simT - FIXED_DT, simT);
    updateKoi(FIXED_DT, simT);
    updateRain(FIXED_DT);
    updatePads(simT);
    updatePetals(FIXED_DT, simT);
    for (const c of clouds) c.position.x += 0.06*FIXED_DT;
    env.time = simT;
  }
  const rem = t - steps*FIXED_DT;
  if (rem > 1e-6){
    stepSimulation();
    simT += FIXED_DT;
    updateShowcaseClock(simT - FIXED_DT, simT);
    updateKoi(rem, simT);
    updateRain(rem);
    updatePads(simT);
    updatePetals(rem, simT);
    env.time = simT;
  }
  // cinematic camera on rails
  const u = t / SHOWCASE_DURATION;
  camera.position.copy(camCurve.getPoint(u));
  const tgt = tgtCurve.getPoint(u);
  camera.lookAt(tgt);
  controls.target.copy(tgt);
  // dusk rolls in for the finale
  applyEnvironment(smoothstep(7.2, 9.4, t));
  rainStateEl.textContent = state.raining ? 'ON' : 'OFF';
  duskStateEl.textContent = (smoothstep(7.2, 9.4, t) > 0.5) ? 'ON' : 'OFF';
  renderFrame();
  updateBench();
  return t;
}
window.showcase = { duration: SHOWCASE_DURATION, seek };

function enterLiveMode(){
  // return to a fresh, freely-running world
  R = Math.random;
  resetShowcase();            // zeros sim & reseeds actors…
  state.raining = true;       // …but live defaults back to gentle rain
  env.time = 0;
  controls.enabled = true;
  controls.target.set(0, 0.2, 0);
  camera.position.set(15.5, 9.5, 17.0);
  controls.update();
}

/* ============================================================
   RECORD BUTTON — captures the showcase to .webm
   ============================================================ */
let recording = false;
const prevRain = { value: true };
function pickMime(){
  const list = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const m of list) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
recordBtn.addEventListener('click', () => {
  if (recording || !window.MediaRecorder) return;
  recording = true;
  prevRain.value = state.raining;
  const label = recordBtn.innerHTML;
  recordBtn.disabled = true;
  recordBtn.classList.add('recording');
  recordBtn.innerHTML = '<span class="dot"></span>Recording…';

  const stream = renderer.domElement.captureStream(60);
  const mime = pickMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 14_000_000 } : undefined);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'still-water-showcase.webm';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recording = false;
    recordBtn.disabled = false;
    recordBtn.classList.remove('recording');
    recordBtn.innerHTML = label;
    enterLiveMode();
  };
  rec.start(250);
  const t0 = performance.now();
  const tick = () => {
    const t = (performance.now() - t0)/1000;
    if (t >= SHOWCASE_DURATION){
      seek(SHOWCASE_DURATION);
      if (rec.state !== 'inactive') rec.stop();
      return;
    }
    seek(t);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
});

/* ============================================================
   MAIN LOOP
   ============================================================ */
let simAccumulator = 0;
let lastFrame = performance.now();
function animate(){
  requestAnimationFrame(animate);
  if (recording) return;              // showcase drives the canvas while recording
  const now = performance.now();
  let dt = Math.min(0.05, (now - lastFrame)/1000);
  lastFrame = now;
  env.time += dt;

  // ease dusk blend
  env.dusk += (state.duskTarget - env.dusk)*Math.min(1, dt*1.4);
  applyEnvironment(env.dusk);

  // fixed-step wave solve (up to 3 substeps per frame)
  simAccumulator += dt;
  let steps = 0;
  while (simAccumulator >= FIXED_DT && steps < 3){
    stepSimulation();
    simAccumulator -= FIXED_DT;
    updateKoi(FIXED_DT, env.time);
    updateRain(FIXED_DT);
    updatePads(env.time);
    updatePetals(FIXED_DT, env.time);
    steps++;
  }
  if (steps === 3) simAccumulator = 0;

  // drifting clouds
  for (const c of clouds){
    c.position.x += dt*0.35;
    if (c.position.x > 95) c.position.x = -95;
  }

  rainStateEl.textContent = state.raining ? 'ON' : 'OFF';
  duskStateEl.textContent = state.duskTarget > 0.5 ? 'ON' : 'OFF';

  controls.update();
  renderFrame();
  updateBench();
}
applyEnvironment(0);
animate();
</script>

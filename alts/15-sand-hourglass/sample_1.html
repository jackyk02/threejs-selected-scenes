<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tempus Fugit — The Antiquarian's Hourglass</title>
<style>
  :root{
    --gold:#d8b46a; --gold-dim:#9a7f4d; --ink:#efe6d0; --panel:rgba(18,13,9,.72);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d0a08;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
  #app{position:fixed;inset:0;cursor:default}
  canvas{display:block}

  /* ---- cinematic overlay UI ---- */
  #ui{position:fixed;top:26px;left:32px;z-index:10;pointer-events:none;user-select:none;
      text-shadow:0 2px 14px rgba(0,0,0,.9);transition:opacity .5s}
  #ui h1{font-size:clamp(26px,3.4vw,44px);font-weight:400;letter-spacing:.34em;color:var(--gold);
         font-variant:small-caps}
  #ui .rule{width:210px;height:1px;margin:10px 0 8px;
         background:linear-gradient(90deg,var(--gold),rgba(216,180,106,0))}
  #ui p{font-size:12.5px;letter-spacing:.14em;color:#cbbc9d;font-style:italic;opacity:.92}
  #ui .tech{margin-top:6px;font-size:10.5px;letter-spacing:.18em;color:#8d7f63;font-style:normal}

  #hint{position:fixed;left:32px;bottom:22px;z-index:10;pointer-events:none;user-select:none;
        font-size:11px;letter-spacing:.12em;color:#cbbd9b;opacity:.85;text-shadow:0 1px 6px #000;
        transition:opacity .5s}
  #hint b{color:var(--gold);font-weight:400}
  #hint .sep{margin:0 .7em;color:#6f6350}

  #badge{position:fixed;right:30px;bottom:22px;z-index:10;pointer-events:none;user-select:none;
         font-size:10px;letter-spacing:.2em;color:#8d7f63;text-align:right;text-shadow:0 1px 6px #000;transition:opacity .5s}

  /* ---- record button ---- */
  #recordBtn{position:fixed;top:26px;right:30px;z-index:20;cursor:pointer;
     font-family:Georgia,serif;font-size:12px;letter-spacing:.22em;color:var(--gold);
     background:var(--panel);border:1px solid rgba(216,180,106,.55);border-radius:3px;
     padding:12px 20px 12px 16px;backdrop-filter:blur(6px);
     transition:all .25s ease;text-transform:uppercase}
  #recordBtn:hover{background:rgba(46,33,18,.85);border-color:var(--gold);
     box-shadow:0 0 22px rgba(216,180,106,.35), inset 0 0 12px rgba(216,180,106,.12)}
  #recordBtn .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
     background:#e2492f;margin-right:10px;box-shadow:0 0 8px #e2492f;vertical-align:1px}
  #recordBtn.recording{color:#ffb3a3;border-color:#e2492f;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(226,73,47,.35)}50%{box-shadow:0 0 30px rgba(226,73,47,.65)}}

  /* ---- showcase progress bar ---- */
  #showcaseBar{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:30;background:rgba(255,255,255,.07);opacity:0;transition:opacity .4s;pointer-events:none}
  #showcaseFill{height:100%;width:0%;background:linear-gradient(90deg,#8a6a34,var(--gold));box-shadow:0 0 10px rgba(216,180,106,.8)}
  #showcaseLabel{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:30;pointer-events:none;
     font-size:10.5px;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;opacity:0;transition:opacity .4s;text-shadow:0 1px 6px #000}

  body.recording #ui, body.recording #hint, body.recording #badge, body.recording #recordBtn{opacity:0;pointer-events:none}
  body.recording #showcaseBar, body.recording #showcaseLabel{opacity:1}

  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
     background:#0d0a08;transition:opacity .8s;pointer-events:none}
  #loader.gone{opacity:0}
  #loader span{font-size:13px;letter-spacing:.5em;color:var(--gold-dim);text-transform:uppercase;animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>

<div id="app"></div>

<div id="ui">
  <h1>Tempus&nbsp;Fugit</h1>
  <div class="rule"></div>
  <p>The Antiquarian&rsquo;s Hourglass &mdash; sand, candlelight &amp; time</p>
  <p class="tech">6 200 GOLDEN GRAINS &middot; SIMULATED LIVE</p>
</div>

<div id="hint">
  <b>Click</b> the hourglass to flip<span class="sep">·</span><b>Drag</b> it to tilt<span class="sep">·</span><b>Drag background</b> to orbit<span class="sep">·</span><b>Scroll</b> to zoom<span class="sep">·</span><b>R</b> reset
</div>
<div id="badge">GRANULAR SOLVER · 60&nbsp;s FALL<br>NATURAL ANGLE OF REPOSE ≈ 34°</div>

<button id="recordBtn"><span class="dot"></span>Record showcase · 12&nbsp;s</button>
<div id="showcaseBar"><div id="showcaseFill"></div></div>
<div id="showcaseLabel">Tempus Fugit</div>
<div id="loader"><span>Turning the glass…</span></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   TEMPUS FUGIT — ornate hourglass with live granular sand
   All models, textures and simulations are procedural.
   ========================================================= */

// ---------------- deterministic RNG ----------------
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const easeInOutCubic = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const smoothstep = (a,b,x)=>{ const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

// ============================================================
//  CANVAS TEXTURE FACTORY
// ============================================================
function makeCanvas(w,h,fn){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

const deskTexture = makeCanvas(1024,1024,(g,w,h)=>{
  g.fillStyle='#49291a'; g.fillRect(0,0,w,h);
  const planks = 7;
  const rng = mulberry32(1001);
  for(let p=0;p<planks;p++){
    const y0 = p*h/planks, ph = h/planks;
    const tone = 0.85+rng()*0.35;
    g.fillStyle = `rgb(${Math.floor(86*tone)},${Math.floor(48*tone)},${Math.floor(27*tone)})`;
    g.fillRect(0,y0,w,ph);
    // grain streaks
    for(let i=0;i<90;i++){
      const yy = y0 + rng()*ph;
      g.strokeStyle = rng()<0.72 ? 'rgba(28,14,6,'+(0.05+rng()*0.12)+')' : 'rgba(190,130,80,'+(0.04+rng()*0.09)+')';
      g.lineWidth = 0.6+rng()*2.2;
      g.beginPath();
      g.moveTo(-20, yy);
      for(let x=0;x<=w+20;x+=64) g.lineTo(x, yy + Math.sin(x*0.008+rng()*6)*6 + (rng()-0.5)*4);
      g.stroke();
    }
    // seam
    g.fillStyle='rgba(12,6,3,0.85)'; g.fillRect(0,y0+ph-3,w,3);
    g.fillStyle='rgba(220,160,100,0.10)'; g.fillRect(0,y0,w,1.5);
  }
  // knots
  for(let k=0;k<8;k++){
    const kx=rng()*w, ky=rng()*h, kr=8+rng()*22;
    const rad=g.createRadialGradient(kx,ky,1,kx,ky,kr);
    rad.addColorStop(0,'rgba(24,10,4,0.9)'); rad.addColorStop(0.55,'rgba(66,34,15,0.55)'); rad.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rad; g.beginPath(); g.ellipse(kx,ky,kr,kr*0.62,rng()*3,0,7); g.fill();
  }
});
deskTexture.wrapS = deskTexture.wrapT = THREE.RepeatWrapping;
deskTexture.repeat.set(2.2,1.6);

const darkWoodTexture = makeCanvas(512,512,(g,w,h)=>{
  g.fillStyle='#2a1a12'; g.fillRect(0,0,w,h);
  const rng=mulberry32(2024);
  for(let i=0;i<240;i++){
    const x=rng()*w;
    g.strokeStyle = rng()<0.7 ? `rgba(12,6,3,${0.08+rng()*0.16})` : `rgba(150,96,58,${0.05+rng()*0.1})`;
    g.lineWidth = 0.5+rng()*3;
    g.beginPath(); g.moveTo(x,0);
    for(let y=0;y<=h;y+=48) g.lineTo(x + Math.sin(y*0.02+rng()*5)*9, y);
    g.stroke();
  }
});
darkWoodTexture.wrapS = darkWoodTexture.wrapT = THREE.RepeatWrapping;

const plasterTexture = makeCanvas(512,512,(g,w,h)=>{
  g.fillStyle='#2b241d'; g.fillRect(0,0,w,h);
  const rng=mulberry32(777);
  const img=g.getImageData(0,0,w,h); const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(rng()-0.5)*22; d[i]+=n; d[i+1]+=n; d[i+2]+=n;
  }
  g.putImageData(img,0,0);
  // soft warm patch
  const rad=g.createRadialGradient(w*0.3,h*0.35,10,w*0.3,h*0.35,w*0.75);
  rad.addColorStop(0,'rgba(120,86,52,0.22)'); rad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rad; g.fillRect(0,0,w,h);
});
plasterTexture.wrapS = plasterTexture.wrapT = THREE.RepeatWrapping;
plasterTexture.repeat.set(2,1);

function bookTexture(cover, title, accent){
  return makeCanvas(512,512,(g,w,h)=>{
    g.fillStyle=cover; g.fillRect(0,0,w,h);
    const rng=mulberry32(title.length*991+7);
    // leather mottle
    for(let i=0;i<900;i++){
      g.fillStyle = rng()<0.5 ? 'rgba(0,0,0,'+(rng()*0.16)+')' : 'rgba(255,255,255,'+(rng()*0.05)+')';
      g.fillRect(rng()*w, rng()*h, 2+rng()*9, 2+rng()*9);
    }
    // gilt double border
    g.strokeStyle=accent; g.lineWidth=6; g.strokeRect(26,26,w-52,h-52);
    g.lineWidth=2; g.strokeRect(42,42,w-84,h-84);
    // corner diamonds
    const dia=(x,y)=>{ g.save(); g.translate(x,y); g.rotate(Math.PI/4); g.fillStyle=accent; g.fillRect(-7,-7,14,14); g.restore(); };
    dia(60,60); dia(w-60,60); dia(60,h-60); dia(w-60,h-60);
    // title
    g.fillStyle=accent; g.textAlign='center'; g.textBaseline='middle';
    g.font='600 44px Georgia, serif';
    const lines = title.split('|');
    lines.forEach((ln,i)=> g.fillText(ln, w/2, h/2 + (i-(lines.length-1)/2)*58 ) );
    g.beginPath(); g.moveTo(w*0.32,h/2+(lines.length/2)*58+18); g.lineTo(w*0.68,h/2+(lines.length/2)*58+18);
    g.lineWidth=2.5; g.strokeStyle=accent; g.stroke();
  });
}

const globeTexture = makeCanvas(1024,512,(g,w,h)=>{
  // ocean
  const oc=g.createLinearGradient(0,0,0,h);
  oc.addColorStop(0,'#17324a'); oc.addColorStop(0.5,'#1d4258'); oc.addColorStop(1,'#142c40');
  g.fillStyle=oc; g.fillRect(0,0,w,h);
  const rng=mulberry32(31337);
  // ocean mottling
  for(let i=0;i<260;i++){
    g.fillStyle='rgba(255,255,255,'+(rng()*0.045)+')';
    g.beginPath(); g.ellipse(rng()*w,rng()*h,20+rng()*70,10+rng()*30,rng()*3,0,7); g.fill();
  }
  // continents — seeded irregular blobs
  const blob=(cx,cy,r)=>{
    g.beginPath();
    const n=12;
    for(let i=0;i<=n;i++){
      const a=i/n*Math.PI*2, rr=r*(0.62+rng()*0.72);
      const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr*0.78;
      i===0?g.moveTo(px,py):g.lineTo(px,py);
    }
    g.closePath();
    g.fillStyle='#b99e6d'; g.fill();
    g.strokeStyle='rgba(84,64,34,0.8)'; g.lineWidth=2.5; g.stroke();
    // inner hills
    for(let i=0;i<7;i++){
      g.fillStyle='rgba(120,96,52,0.55)';
      g.beginPath(); g.ellipse(cx+(rng()-0.5)*r*1.2, cy+(rng()-0.5)*r*0.9, 3+rng()*8, 2+rng()*5, rng()*3,0,7); g.fill();
    }
  };
  [[180,150,72],[330,320,58],[430,140,96],[610,240,64],[720,150,52],[830,320,88],[930,180,44],[250,380,34],[520,380,40],[660,90,30]].forEach(b=>blob(b[0],b[1],b[2]));
  // graticule
  g.strokeStyle='rgba(240,230,200,0.20)'; g.lineWidth=1.4;
  for(let i=1;i<6;i++){ g.beginPath(); g.moveTo(0,i*h/6); g.lineTo(w,i*h/6); g.stroke(); }
  for(let i=0;i<12;i++){ g.beginPath(); g.moveTo(i*w/12,0); g.lineTo(i*w/12,h); g.stroke(); }
  g.lineWidth=3; g.strokeStyle='rgba(240,230,200,0.35)'; g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  // ice caps
  const capT=g.createLinearGradient(0,0,0,h*0.12); capT.addColorStop(0,'rgba(238,242,246,0.95)'); capT.addColorStop(1,'rgba(238,242,246,0)');
  g.fillStyle=capT; g.fillRect(0,0,w,h*0.12);
  const capB=g.createLinearGradient(0,h,0,h*0.88); capB.addColorStop(0,'rgba(238,242,246,0.95)'); capB.addColorStop(1,'rgba(238,242,246,0)');
  g.fillStyle=capB; g.fillRect(0,h*0.88,w,h*0.12);
});

const waxTexture = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#e9dfc9'; g.fillRect(0,0,w,h);
  const rng=mulberry32(555);
  for(let i=0;i<160;i++){
    const x=rng()*w;
    g.strokeStyle='rgba(160,140,105,'+(0.08+rng()*0.12)+')';
    g.lineWidth=1+rng()*3;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x+(rng()-0.5)*14,h); g.stroke();
  }
});

const paneTexture = makeCanvas(256,340,(g,w,h)=>{
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#d9e7f1'); sky.addColorStop(0.45,'#aebfcf'); sky.addColorStop(1,'#5d6d80');
  g.fillStyle=sky; g.fillRect(0,0,w,h);
  const rng=mulberry32(88);
  for(let i=0;i<9;i++){ // clouds
    g.fillStyle='rgba(255,255,255,'+(0.25+rng()*0.35)+')';
    g.beginPath(); g.ellipse(rng()*w, h*0.15+rng()*h*0.45, 24+rng()*44, 8+rng()*13, 0,0,7); g.fill();
  }
  // pale moon with glow
  const mx=w*0.72, my=h*0.24;
  const mg=g.createRadialGradient(mx,my,2,mx,my,60);
  mg.addColorStop(0,'rgba(255,255,255,1)'); mg.addColorStop(0.28,'rgba(250,250,240,0.85)'); mg.addColorStop(1,'rgba(250,250,240,0)');
  g.fillStyle=mg; g.beginPath(); g.arc(mx,my,60,0,7); g.fill();
});

const paintingTexture = makeCanvas(512,360,(g,w,h)=>{
  const sky=g.createLinearGradient(0,0,0,h*0.72);
  sky.addColorStop(0,'#33254a'); sky.addColorStop(0.55,'#6e3f3c'); sky.addColorStop(1,'#c98a54');
  g.fillStyle=sky; g.fillRect(0,0,w,h*0.72);
  // sun
  g.fillStyle='#ffd9a0'; g.beginPath(); g.arc(w*0.5,h*0.55,26,0,7); g.fill();
  g.fillStyle='rgba(255,217,160,0.35)'; g.beginPath(); g.arc(w*0.5,h*0.55,52,0,7); g.fill();
  // sea
  g.fillStyle='#241b2e'; g.fillRect(0,h*0.72,w,h*0.28);
  g.fillStyle='rgba(255,214,150,0.5)'; g.fillRect(w*0.44,h*0.72,w*0.12,h*0.2);
  // hills
  g.fillStyle='#221722';
  g.beginPath(); g.moveTo(0,h*0.66);
  for(let x=0;x<=w;x+=32) g.lineTo(x, h*0.66 - Math.abs(Math.sin(x*0.021+1.2))*46 - Math.sin(x*0.006)*22);
  g.lineTo(w,h*0.72); g.lineTo(0,h*0.72); g.fill();
  // birds
  g.strokeStyle='#1a1218'; g.lineWidth=2;
  [[150,120],[210,95],[300,140],[360,105],[260,150]].forEach(b=>{
    g.beginPath(); g.moveTo(b[0]-9,b[1]); g.quadraticCurveTo(b[0]-3,b[1]-6,b[0],b[1]); g.quadraticCurveTo(b[0]+3,b[1]-6,b[0]+9,b[1]); g.stroke();
  });
});

const shaftTexture = makeCanvas(128,512,(g,w,h)=>{
  // vertical fade (bright at window end = top) × horizontal soft edges
  const img=g.createImageData(w,h); const d=img.data;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const v = Math.pow(1-y/h, 1.9);
    const e = Math.sin(Math.PI*x/w);
    const a = clamp(v*e*1.05,0,1);
    const i=(y*w+x)*4; d[i]=255; d[i+1]=246; d[i+2]=228; d[i+3]=a*255;
  }
  g.putImageData(img,0,0);
});

// env-map: tiny gradient "room" baked to PMREM (no assets, pure canvas)
function buildEnvironment(renderer){
  const envScene = new THREE.Scene();
  const envTex = makeCanvas(1024,512,(g,w,h)=>{
    const grad=g.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#3a4552'); grad.addColorStop(0.42,'#584a3a'); grad.addColorStop(0.62,'#2c211a'); grad.addColorStop(1,'#0f0b08');
    g.fillStyle=grad; g.fillRect(0,0,w,h);
    // bright window spot upper-left
    let rg=g.createRadialGradient(w*0.22,h*0.3,4,w*0.22,h*0.3,190);
    rg.addColorStop(0,'rgba(235,244,252,1)'); rg.addColorStop(0.25,'rgba(200,214,228,0.55)'); rg.addColorStop(1,'rgba(200,214,228,0)');
    g.fillStyle=rg; g.fillRect(0,0,w,h);
    // warm candle spot right
    rg=g.createRadialGradient(w*0.78,h*0.52,4,w*0.78,h*0.52,120);
    rg.addColorStop(0,'rgba(255,205,130,0.9)'); rg.addColorStop(1,'rgba(255,205,130,0)');
    g.fillStyle=rg; g.fillRect(0,0,w,h);
  });
  envTex.colorSpace = THREE.SRGBColorSpace;
  const sphere = new THREE.Mesh(new THREE.SphereGeometry(10,32,16), new THREE.MeshBasicMaterial({map:envTex, side:THREE.BackSide}));
  envScene.add(sphere);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromScene(envScene, 0.05);
  pmrem.dispose();
  return rt.texture;
}

// ============================================================
//  RENDERER / SCENE / CAMERA / CONTROLS
// ============================================================
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16110d);
scene.fog = new THREE.FogExp2(0x16110d, 0.048);
scene.environment = buildEnvironment(renderer);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 60);
const CAM_HOME = new THREE.Vector3(3.35, 2.05, 4.15);
const TGT_HOME = new THREE.Vector3(0.3, 1.02, 0);
camera.position.copy(CAM_HOME);

let controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT_HOME);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.1;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.56;
controls.update();

// ============================================================
//  LIGHTS
// ============================================================
const hemi = new THREE.HemisphereLight(0x54483c, 0x17100b, 0.55);
scene.add(hemi);

const windowLight = new THREE.DirectionalLight(0xa9c4de, 2.35);
windowLight.position.set(-2.7, 3.25, -1.35);
windowLight.target.position.set(0.9, 0.0, 1.15);
windowLight.castShadow = true;
windowLight.shadow.mapSize.set(4096, 4096);
windowLight.shadow.camera.near = 0.5; windowLight.shadow.camera.far = 12;
windowLight.shadow.camera.left = -3.6; windowLight.shadow.camera.right = 3.6;
windowLight.shadow.camera.top = 4.0;  windowLight.shadow.camera.bottom = -2.0;

// inner profile table (top → bottom), also drives sand collisions
const HALF_PROFILE = [
  [0.915, 0.004],[0.880, 0.105],[0.825, 0.185],[0.750, 0.275],[0.660, 0.360],
  [0.560, 0.428],[0.455, 0.478],[0.350, 0.512],[0.255, 0.518],[0.170, 0.468],
  [0.100, 0.372],[0.058, 0.245],[0.026, 0.140],[0.010, 0.093],[0.000, 0.078]
];
function profileR(y){
  const ay = Math.min(Math.abs(y), 0.915);
  for (let i=0;i<HALF_PROFILE.length-1;i++){
    const a=HALF_PROFILE[i], b=HALF_PROFILE[i+1];
    if (ay <= a[0] && ay >= b[0]){
      const u=(a[0]-ay)/((a[0]-b[0])||1);
      return a[1]*(1-u)+b[1]*u;
    }
  }
  return 0.02;
}

//  SAND — granular simulation (6 200 grains)
// ============================================================
const N = 6200;
const PR = 0.02;                 // grain radius
const GRAV = 6.8;                // units / s²
const DT = 1/60;                 // fixed step
const MU = 0.72;                 // Coulomb friction (→ ~34° repose)
const P = new Float32Array(N*3);
const V = new Float32Array(N*3);

function buildInitialSand(){
  const rng = mulberry32(1337);
  let i = 0;
  const spacing = 2*PR*0.97, dy = 2*PR*0.92;
  for (let y=0.115; y<=0.885 && i<N; y+=dy){
    const R = profileR(y) - PR - 0.004;
    if (R <= 0.005) continue;
    const rowOff = rng()*spacing;
    for (let x=-R+rowOff%spacing; x<=R && i<N; x+=spacing){
      for (let z=-R; z<=R && i<N; z+=spacing){
        const xx = x + (rng()-0.5)*spacing*0.32;
        const zz = z + (rng()-0.5)*spacing*0.32;
        if (xx*xx + zz*zz > R*R) continue;
        P[i*3]=xx; P[i*3+1]=y + (rng()-0.5)*0.006; P[i*3+2]=zz; i++;
      }
    }
  }
  while (i<N){ // overflow insurance (relaxes within a step or two)
    const y = 0.25 + rng()*0.55;
    const R = profileR(y) - PR - 0.004;
    const a = rng()*Math.PI*2, rr = Math.sqrt(rng())*R*0.92;
    P[i*3]=Math.cos(a)*rr; P[i*3+1]=y; P[i*3+2]=Math.sin(a)*rr; i++;
  }
  V.fill(0);
}
buildInitialSand();

// spatial hash
const HSIZE = 4096, CS = 0.0425;
const hashHead = new Int32Array(HSIZE);
const hashNext = new Int32Array(N);
function cellHash(x,y,z){
  let h = Math.imul(x,374761393) ^ Math.imul(y,668265263) ^ Math.imul(z,982451653);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return (h ^ (h>>>16)) & (HSIZE-1);
}

// tiny deterministic stir used to unstick neck arches (imperceptible)
const stirRng = mulberry32(9001);

function glassClamp(i){
  let y = P[i*3+1];
  if (y >  0.898){ P[i*3+1] = 0.898; if (V[i*3+1] > 0) V[i*3+1] = 0; y = 0.898; }
  if (y < -0.898){ P[i*3+1] = -0.898; if (V[i*3+1] < 0) V[i*3+1] = 0; y = -0.898; }
  let R = profileR(y) - PR;
  if (R < 0.0012) R = 0.0012;
  let x = P[i*3], z = P[i*3+2];
  const d = Math.hypot(x,z);
  if (d > R){
    const inv = R/d; P[i*3]=x*inv; P[i*3+2]=z*inv;
    const nx = d>1e-6 ? x/d : 1, nz = d>1e-6 ? z/d : 0;
    const vn = V[i*3]*nx + V[i*3+2]*nz;          // outward radial speed
    if (vn > 0){ V[i*3] -= nx*vn; V[i*3+2] -= nz*vn; }
    // glass friction: kill a slice of angular + vertical tangential motion
    V[i*3+1] *= 0.90;
    const tx = -nz, tz = nx, vt = V[i*3]*tx + V[i*3+2]*tz;
    V[i*3] -= tx*vt*0.16; V[i*3+2] -= tz*vt*0.16;
  }
}

function stepSand(gLx, gLy, gLz){
  // integrate
  const damp = 0.998;
  for (let i=0;i<N;i++){
    const ix=i*3;
    V[ix]   = (V[ix]   + gLx*DT) * damp + (stirRng()-0.5)*0.0022;
    V[ix+1] = (V[ix+1] + gLy*DT) * damp + (stirRng()-0.5)*0.0022;
    V[ix+2] = (V[ix+2] + gLz*DT) * damp + (stirRng()-0.5)*0.0022;
  }
  for (let i=0;i<N;i++){
    const ix=i*3;
    P[ix]+=V[ix]*DT; P[ix+1]+=V[ix+1]*DT; P[ix+2]+=V[ix+2]*DT;
  }
  const minD = 2*PR, minD2 = minD*minD;
  for (let iter=0; iter<2; iter++){
    for (let i=0;i<N;i++) glassClamp(i);
    // rebuild hash
    hashHead.fill(-1);
    for (let i=0;i<N;i++){
      const ix=i*3;
      const h = cellHash(Math.floor(P[ix]/CS), Math.floor(P[ix+1]/CS), Math.floor(P[ix+2]/CS));
      hashNext[i]=hashHead[h]; hashHead[h]=i;
    }
    for (let i=0;i<N;i++){
      const ix=i*3;
      const cx=Math.floor(P[ix]/CS), cy=Math.floor(P[ix+1]/CS), cz=Math.floor(P[ix+2]/CS);
      for (let a=-1;a<=1;a++) for (let b=-1;b<=1;b++) for (let c=-1;c<=1;c++){
        let j = hashHead[cellHash(cx+a, cy+b, cz+c)];
        for (; j!==-1; j=hashNext[j]){
          if (j <= i) continue;
          const jx=j*3;
          const dx=P[jx]-P[ix], dy=P[jx+1]-P[ix+1], dz=P[jx+2]-P[ix+2];
          const d2 = dx*dx+dy*dy+dz*dz;
          if (d2 >= minD2 || d2 < 1e-12) continue;
          const d = Math.sqrt(d2), nx=dx/d, ny=dy/d, nz=dz/d, overlap = minD - d;
          // positional relaxation
          const corr = overlap*0.42;
          P[ix]-=nx*corr; P[ix+1]-=ny*corr; P[ix+2]-=nz*corr;
          P[jx]+=nx*corr; P[jx+1]+=ny*corr; P[jx+2]+=nz*corr;
          // normal impulse (restitution 0, equal mass)
          const rvx=V[jx]-V[ix], rvy=V[jx+1]-V[ix+1], rvz=V[jx+2]-V[ix+2];
          const vn = rvx*nx + rvy*ny + rvz*nz;
          if (vn < 0){
            const imp = -vn*0.5;
            V[ix]-=nx*imp; V[ix+1]-=ny*imp; V[ix+2]-=nz*imp;
            V[jx]+=nx*imp; V[jx+1]+=ny*imp; V[jx+2]+=nz*imp;
            // Coulomb friction on tangential relative motion
            const tx=rvx - vn*nx, ty=rvy - vn*ny, tz=rvz - vn*nz;
            const tl=Math.hypot(tx,ty,tz);
            if (tl > 1e-6){
              let jt = tl*0.5; const jmax = MU*imp; if (jt > jmax) jt = jmax;
              const inv=jt/tl;
              V[ix]+=tx*inv; V[ix+1]+=ty*inv; V[ix+2]+=tz*inv;
              V[jx]-=tx*inv; V[jx+1]-=ty*inv; V[jx+2]-=tz*inv;
            }
          }
        }
      }
    }
  }
}

// gravity expressed in a given local frame
const _q = new THREE.Quaternion(), _gLocal = new THREE.Vector3();
function localGravity(tiltQ, flipQ){
  _q.copy(tiltQ).multiply(flipQ).invert();
  _gLocal.set(0,-GRAV,0).applyQuaternion(_q);
  return _gLocal;
}

const shaftDir  = shaftTo.clone().sub(shaftFrom);
const shaftLen  = shaftDir.length(); shaftDir.normalize();
const shaftMid  = shaftFrom.clone().add(shaftTo).multiplyScalar(0.5);
const shaftQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), shaftDir.clone().negate());
const shaftMat = new THREE.MeshBasicMaterial({
  map:shaftTexture, transparent:true, blending:THREE.AdditiveBlending,
  depthWrite:false, side:THREE.DoubleSide, opacity:0.34, fog:false
});
const shaft1 = new THREE.Mesh(new THREE.PlaneGeometry(2.05, shaftLen), shaftMat);
shaft1.position.copy(shaftMid); shaft1.quaternion.copy(shaftQuat); scene.add(shaft1);
const shaft2 = shaft1.clone();
shaft2.quaternion.copy(shaftQuat).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.PI/2));
shaft2.material = shaftMat.clone(); shaft2.material.opacity = 0.18;
scene.add(shaft2);

// dust motes — deterministic shader drift
const DUST = 240;
const dustGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(DUST*3), seed = new Float32Array(DUST);
  const rng = mulberry32(4242);
  for (let i=0;i<DUST;i++){
    pos[i*3]   = (rng()-0.5)*1.7;
    pos[i*3+1] = (rng()-0.5)*shaftLen;
    pos[i*3+2] = (rng()-0.5)*0.9;
    seed[i] = rng()*100;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
}
const dustMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uTime:{value:0}, uScale:{value: window.innerHeight * Math.min(window.devicePixelRatio,2) * 0.5 } },
  vertexShader:`
    attribute float aSeed;
    uniform float uTime; uniform float uScale;
    varying float vA;
    void main(){
      vec3 p = position;
      float fall = mod(aSeed*3.1 + uTime*(0.045 + 0.035*fract(aSeed*0.713)), 4.4);
      p.y += fall - 2.2;
      p.x += sin(uTime*0.42 + aSeed*1.71) * 0.055;
      p.z += cos(uTime*0.36 + aSeed*2.33) * 0.055;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.6 + 2.6*fract(aSeed*0.373)) * (uScale / -mv.z) * 0.12;
      vA = 0.35 + 0.65*(0.5+0.5*sin(uTime*(0.7+fract(aSeed*0.913)*0.9) + aSeed*2.7));
      vA *= smoothstep(2.2, 1.35, abs(p.y));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    varying float vA;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      float a = smoothstep(0.5, 0.05, d) * vA * 0.55;
      gl_FragColor = vec4(1.0, 0.93, 0.78, a);
    }`
});
const dust = new THREE.Points(dustGeo, dustMat);
dust.position.copy(shaftMid); dust.quaternion.copy(shaftQuat);
scene.add(dust);

// ============================================================
//  POST — bloom
// ============================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.72, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ============================================================
//  INTERACTION — click to flip, drag to tilt, R to reset
// ============================================================
let userFlips = 0;
let showcaseFlipActive = 0;
let flipAngle = 0;                 // applied to flipGroup.rotation.z
let flipAnim = null;               // {t, dur, from, to}
let tiltX = 0, tiltZ = 0, tiltTargetX = 0, tiltTargetZ = 0;
let dragOnHourglass = false, dragStartX = 0, dragStartY = 0, dragMoved = 0;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function hourglassHit(clientX, clientY){
  ndc.x = (clientX / window.innerWidth) * 2 - 1;
  ndc.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  return raycaster.intersectObjects(clickTargets, false).length > 0;
}
function triggerFlip(){
  if (flipAnim) return;
  flipAnim = { t:0, dur:1.45, from: flipAngle, to: flipAngle + Math.PI };
}
function resetAll(){
  flipAnim = null; flipAngle = 0; tiltX = tiltZ = tiltTargetX = tiltTargetZ = 0;
  flipGroup.rotation.set(0,0,0); flipGroup.position.y = 0;
  tiltGroup.rotation.set(0,0,0);
  loadSandState(PRISTINE.pos, PRISTINE.vel);
  updateGrainInstances();
  userFlips = 0; showcaseFlipActive = 0;
  camera.position.copy(CAM_HOME); controls.target.copy(TGT_HOME); controls.update();
}

const dom = renderer.domElement;
dom.addEventListener('pointerdown', e=>{
  if (e.button !== 0) return;
  if (hourglassHit(e.clientX, e.clientY)){
    dragOnHourglass = true; dragMoved = 0;
    dragStartX = e.clientX; dragStartY = e.clientY;
    controls.enabled = false;
    dom.setPointerCapture(e.pointerId);
  }
});
dom.addEventListener('pointermove', e=>{
  if (dragOnHourglass){
    const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    dragMoved = Math.max(dragMoved, Math.hypot(dx, dy));
    tiltTargetZ = clamp(-dx * 0.0016, -0.17, 0.17);
    tiltTargetX = clamp( dy * 0.0016, -0.17, 0.17);
  } else if (!e.buttons){
    dom.style.cursor = hourglassHit(e.clientX, e.clientY) ? 'pointer' : 'default';
  }
});
function endDrag(e){
  if (!dragOnHourglass) return;
  dragOnHourglass = false;
  controls.enabled = true;
  tiltTargetX = 0; tiltTargetZ = 0;
  if (dragMoved < 6) triggerFlip();          // treat as click
  try { dom.releasePointerCapture(e.pointerId); } catch(_){}
}
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e=>{
  if (e.key === 'r' || e.key === 'R') resetAll();
});

// ============================================================
//  SHOWCASE — deterministic 12 s film
// ============================================================
const SHOWCASE_DURATION = 12.0;
const SHOWCASE_WARP = 4.0;         // sand runs 4× during the film
const FLIP_START = 6.9, FLIP_DUR = 1.7;
const CHECK = 0.5;

function showcaseFlipAngle(t){
  if (t <= FLIP_START) return 0;
  const u = clamp((t - FLIP_START)/FLIP_DUR, 0, 1);
  return Math.PI * easeInOutCubic(u);
}
function showcaseBob(t){
  if (t <= FLIP_START || t >= FLIP_START + FLIP_DUR) return 0;
  return Math.sin(((t - FLIP_START)/FLIP_DUR) * Math.PI) * 0.18;
}

// deterministic camera path: [t, pos, look]
const CAM_KEYS = [
  [0.0 , 4.15,2.50,5.05 , 0.35,1.00, 0.00],
  [2.0 , 2.50,2.15,2.95 , 0.52,1.25, 0.05],
  [4.0 , 1.28,1.24,1.02 , 0.55,1.10, 0.10],
  [5.2 , 1.32,0.60,1.05 , 0.55,0.70, 0.10],
  [6.8 , 2.35,2.05,2.60 , 0.55,1.15, 0.10],
  [8.6 , 2.75,1.85,3.05 , 0.55,1.12, 0.10],
  [9.8 , 1.75,1.55,2.15 , 0.55,1.10, 0.10],
  [12.0, 4.05,2.45,4.95 , 0.35,1.00, 0.00]
];
const _camPos = new THREE.Vector3(), _camLook = new THREE.Vector3();
function showcaseCamera(t){
  let i = 0;
  while (i < CAM_KEYS.length-2 && t > CAM_KEYS[i+1][0]) i++;
  const A = CAM_KEYS[i], B = CAM_KEYS[i+1];
  const u = smoothstep(A[0], B[0], t);
  _camPos.set(lerp(A[1],B[1],u), lerp(A[2],B[2],u), lerp(A[3],B[3],u));
  _camLook.set(lerp(A[4],B[4],u), lerp(A[5],B[5],u), lerp(A[6],B[6],u));
  // subtle deterministic handheld sway
  _camPos.x += Math.sin(t*0.9)*0.028; _camPos.y += Math.sin(t*1.3+2.1)*0.02;
  _camLook.x += Math.sin(t*1.1+4.0)*0.008; _camLook.y += Math.cos(t*0.8+1.0)*0.008;
  camera.position.copy(_camPos);
  camera.lookAt(_camLook);
}

// checkpoint cache → seek() is incremental yet fully deterministic
let checkpoints = [ PRISTINE ];      // checkpoints[i] = state at i*CHECK
let checkpointsBuilt = 1;
let curShowcaseT = 0;
const _zeroQ = new THREE.Quaternion();
const _flipQ = new THREE.Quaternion();
const _flipAxis = new THREE.Vector3(0,0,1);

function stepShowcaseTo(targetT){
  const steps = Math.max(0, Math.round((targetT - curShowcaseT) * SHOWCASE_WARP / DT));
  for (let k=0;k<steps;k++){
    const ang = showcaseFlipAngle(curShowcaseT);
    _flipQ.setFromAxisAngle(_flipAxis, ang);
    const gl = localGravity(_zeroQ, _flipQ);
    stepSand(gl.x, gl.y, gl.z);
    curShowcaseT += DT / SHOWCASE_WARP;
  }
  curShowcaseT = targetT;
}
function ensureCheckpoints(t){
  while (checkpointsBuilt * CHECK < t - 1e-9){
    loadSandState(checkpoints[checkpointsBuilt-1].pos, checkpoints[checkpointsBuilt-1].vel);
    stepShowcaseTo(checkpointsBuilt * CHECK);
    checkpoints[checkpointsBuilt] = saveSandState();
    checkpointsBuilt++;
  }
}
function seek(t){
  t = clamp(t, 0, SHOWCASE_DURATION);
  // rebuild deterministic trajectory on demand
  ensureCheckpoints(t);
  const baseIdx = Math.min(Math.floor(t / CHECK), checkpointsBuilt - 1);
  loadSandState(checkpoints[baseIdx].pos, checkpoints[baseIdx].vel);
  curShowcaseT = baseIdx * CHECK;
  stepShowcaseTo(t);
  // hourglass pose
  const ang = showcaseFlipAngle(t);
  flipAngle = ang;
  flipGroup.rotation.z = ang;
  flipGroup.position.y = showcaseBob(t);
  tiltGroup.rotation.set(0,0,0);
  // bench state
  showcaseFlipActive = (t >= FLIP_START + FLIP_DUR*0.55) ? 1 : 0;
  updateGrainInstances();
  showcaseCamera(t);
  renderTime = t;
  dustMat.uniforms.uTime.value = t;
  renderFrame(t);
}
window.showcase = { duration: SHOWCASE_DURATION, seek };

// ============================================================
//  RENDER + MAIN LOOP
// ============================================================
let renderTime = 0;
const clock = new THREE.Clock();
let physicsAcc = 0;

function updateFlames(t){
  // deterministic pseudo-noise flicker
  const nA = (Math.sin(t*11.3) + Math.sin(t*5.7+1.3)*0.6 + Math.sin(t*17.1+4.1)*0.4) / 2.0;
  const nB = (Math.sin(t*9.1+3.0) + Math.sin(t*6.3+0.7)*0.6 + Math.sin(t*15.7+2.2)*0.4) / 2.0;
  const fA = 0.82 + 0.30*nA, fB = 0.82 + 0.30*nB;
  candleLightA.intensity = 11 * fA;
  candleLightB.intensity = 7  * fB;
  candleA.flameOuter.scale.set(1+0.12*nA, 2.05+0.35*nA, 1+0.12*nA);
  candleB.flameOuter.scale.set(1+0.12*nB, 2.05+0.35*nB, 1+0.12*nB);
  candleA.flameOuter.position.x = Math.sin(t*7.3)*0.004;
  candleB.flameOuter.position.x = Math.sin(t*6.1+2.0)*0.004;
  candleA.flameInner.position.y = candleA.waxTop + 0.048 + 0.006*nA;
  candleB.flameInner.position.y = candleB.waxTop + 0.048 + 0.006*nB;
}
function renderFrame(t){
  updateFlames(t);
  composer.render();
}
function updateBench(){
  let top = 0, bottom = 0;
  for (let i=0;i<N;i++){ if (P[i*3+1] > 0.0005) top++; else bottom++; }
  window.__bench = { grains: N, grainsTop: top, grainsBottom: bottom, flips: userFlips + showcaseFlipActive };
}

const flipQCur = new THREE.Quaternion(), tiltQCur = new THREE.Quaternion(), eulerTmp = new THREE.Euler();
let mode = 'interactive';
let recStart = 0;
const recordBtn = document.getElementById('recordBtn');
const showcaseFill = document.getElementById('showcaseFill');
let recorder = null, recChunks = [];

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (mode === 'recording'){
    const t = (performance.now() - recStart) / 1000;
    const tc = Math.min(t, SHOWCASE_DURATION);
    seek(tc);
    showcaseFill.style.width = ((tc / SHOWCASE_DURATION) * 100).toFixed(2) + '%';
    updateBench();
    if (t >= SHOWCASE_DURATION && recorder && recorder.state === 'recording'){
      recorder.stop();
      recorder = null;
      document.body.classList.remove('recording');
      recordBtn.classList.remove('recording');
      recordBtn.innerHTML = '<span class="dot"></span>Record showcase · 12&nbsp;s';
      mode = 'interactive';
      resetAll();
      showcaseFill.style.width = '0%';
    }
    return;
  }

  renderTime = clock.elapsedTime;
  const t = renderTime;

  // flip animation
  if (flipAnim){
    flipAnim.t += dt;
    const k = clamp(flipAnim.t / flipAnim.dur, 0, 1);
    const e = easeInOutCubic(k);
    flipAngle = lerp(flipAnim.from, flipAnim.to, e);
    flipGroup.rotation.z = flipAngle;
    flipGroup.position.y = Math.sin(k * Math.PI) * 0.17;
    if (k >= 1){ userFlips++; flipAnim = null; flipGroup.position.y = 0; }
  }
  // tilt spring
  tiltX += (tiltTargetX - tiltX) * Math.min(1, 9*dt);
  tiltZ += (tiltTargetZ - tiltZ) * Math.min(1, 9*dt);
  tiltGroup.rotation.x = tiltX;
  tiltGroup.rotation.z = tiltZ;

  // sand — fixed timestep accumulator
  physicsAcc = Math.min(physicsAcc + dt, DT*4);
  tiltQCur.setFromEuler(eulerTmp.set(tiltX, 0, tiltZ));
  flipQCur.setFromAxisAngle(_flipAxis, flipAngle);
  const gl = localGravity(tiltQCur, flipQCur);
  while (physicsAcc >= DT){
    stepSand(gl.x, gl.y, gl.z);
    physicsAcc -= DT;
  }
  updateGrainInstances();

  dustMat.uniforms.uTime.value = t;
  controls.update();
  renderFrame(t);
  updateBench();
}

// ============================================================
//  RECORD BUTTON — canvas.captureStream + MediaRecorder
// ============================================================
recordBtn.addEventListener('click', ()=>{
  if (mode === 'recording' || recorder) return;
  // pick a supported mime type
  const candidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = candidates.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const stream = renderer.domElement.captureStream(60);
  recChunks = [];
  try {
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
  } catch(err){
    recorder = new MediaRecorder(stream);
  }
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = ()=>{
    const blob = new Blob(recChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'tempus-fugit-showcase.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  };
  // fresh deterministic state, fresh film
  resetAll();
  mode = 'recording';
  recStart = performance.now();
  showcaseFill.style.width = '0%';
  document.body.classList.add('recording');
  recordBtn.classList.add('recording');
  recordBtn.innerHTML = '<span class="dot"></span>Recording…';
  recorder.start(100);
});

// ============================================================
//  RESIZE / BOOT
// ============================================================
window.addEventListener('resize', ()=>{
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  dustMat.uniforms.uScale.value = h * Math.min(window.devicePixelRatio, 2) * 0.5;
});

window.__bench = { grains: N, grainsTop: N, grainsBottom: 0, flips: 0 };
animate();
requestAnimationFrame(()=>{ document.getElementById('loader').classList.add('gone'); });
</script>

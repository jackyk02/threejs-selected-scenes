<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Roth &amp; Cie Pianola — Self-Playing Upright</title>
<style>
  :root{
    --gold:#c9a24e; --gold-dim:#8a6f34; --ink:#efe3c4;
    --panel:rgba(24,16,12,0.72); --panel-edge:rgba(201,162,78,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d0908;font-family:Georgia,'Times New Roman',serif;}
  canvas{display:block;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .plate{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:4px;
    box-shadow:0 4px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,235,180,0.12);
    backdrop-filter:blur(3px);
    color:var(--ink);
  }
  #title{position:absolute;top:18px;left:20px;padding:12px 18px 11px;max-width:340px;}
  #title h1{
    font-size:19px;letter-spacing:0.22em;font-weight:400;
    color:var(--gold);text-transform:uppercase;
    text-shadow:0 1px 3px #000, 0 0 18px rgba(201,162,78,0.35);
    border-bottom:1px solid var(--panel-edge);padding-bottom:6px;margin-bottom:6px;
  }
  #title p{font-size:11.5px;font-style:italic;color:#cbbd97;letter-spacing:0.06em;}
  #title .sub2{font-size:10px;color:#8f8266;letter-spacing:0.14em;margin-top:4px;font-style:normal;text-transform:uppercase;}
  #hints{
    position:absolute;bottom:16px;left:20px;padding:9px 14px;
    font-size:11px;color:#b8ab87;letter-spacing:0.05em;line-height:1.85;
  }
  #hints b{color:var(--gold);font-weight:400;border:1px solid var(--panel-edge);border-radius:3px;
    padding:0 5px;margin-right:2px;font-size:10px;background:rgba(201,162,78,0.08);}
  #tempoReadout{color:#8f8266;font-size:10px;letter-spacing:0.15em;margin-top:2px;text-transform:uppercase;}
  #tempoReadout span{color:var(--gold);}
  #recordBtn{
    position:absolute;top:18px;right:20px;pointer-events:auto;cursor:pointer;
    padding:11px 20px;font-family:Georgia,serif;font-size:12px;letter-spacing:0.18em;
    text-transform:uppercase;color:#f3d9a0;background:linear-gradient(180deg,#5a1d1d,#3c1212);
    border:1px solid rgba(233,190,110,0.55);border-radius:4px;
    box-shadow:0 4px 18px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,220,150,0.25);
    transition:all .18s ease;
  }
  #recordBtn:hover{background:linear-gradient(180deg,#732626,#4c1818);box-shadow:0 6px 22px rgba(0,0,0,0.65),0 0 22px rgba(255,120,60,0.25), inset 0 1px 0 rgba(255,220,150,0.35);}
  #recordBtn.rec{color:#ffd0c0;border-color:#ff7a5c;animation:recPulse 1.1s infinite;}
  @keyframes recPulse{0%,100%{box-shadow:0 0 10px rgba(255,70,40,0.3);}50%{box-shadow:0 0 26px rgba(255,70,40,0.65);}}
  #recDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5a3c;margin-right:8px;vertical-align:1px;box-shadow:0 0 8px #ff5a3c;}
  #cornerMark{position:absolute;bottom:16px;right:20px;padding:7px 12px;font-size:9px;letter-spacing:0.28em;
    color:#6e6350;text-transform:uppercase;}
  @media (max-width:760px){ #title{max-width:250px} #hints{display:none} }
</style>
</head>
<body>

<div id="ui">
  <div id="title" class="plate">
    <h1>The Roth Pianola</h1>
    <p>Für Elise &mdash; self-playing upright piano, front panel removed</p>
    <div class="sub2">Est. Paris · 88 notes · Tracker-bar action</div>
  </div>
  <div id="hints" class="plate">
    <div><b>Space</b> play / pause &nbsp; <b>&#8593;</b><b>&#8595;</b> tempo</div>
    <div><b>A W S E D F T G Y H U J K</b> play keys &nbsp; <b>Click</b> keys &middot; drag to glissando</div>
    <div id="tempoReadout">Tempo <span id="tempoVal">116</span> BPM &nbsp;·&nbsp; drag to orbit &middot; scroll to zoom</div>
  </div>
  <button id="recordBtn"><span id="recDot"></span>Record Video</button>
  <div id="cornerMark" class="plate">Roth &amp; Cie · Feurich Action</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
'use strict';
/* ============================================================
   THE ROTH & Cie PIANOLA — self-playing upright in a parlour
   All geometry, textures and sound are generated procedurally.
   ============================================================ */

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141010);
scene.fog = new THREE.Fog(0x141010, 12, 26);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.05, 60);
camera.position.set(3.05, 1.85, 2.75);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, -1.15);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.9;
controls.maxDistance = 9.5;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

// ---------- Post: bloom + gamma ----------
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloomPass = new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.34, 0.65, 0.82);
composer.addPass(bloomPass);
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

// ============================================================
//  PROCEDURAL TEXTURES
// ============================================================
function makeCanvas(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}
function canvasTex(c, repeatX, repeatY){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeatX) t.repeat.set(repeatX, repeatY || repeatX);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const rand = (a,b) => a + Math.random()*(b-a);

// --- polished mahogany ---
const woodCanvas = makeCanvas(512, 512, (g,w,h) => {
  const grad = g.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'#4a2a16'); grad.addColorStop(0.5,'#5a3720'); grad.addColorStop(1,'#452718');
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){
    const x = Math.random()*w, amp = rand(2,14), wob = rand(0.5,2.2), ph = Math.random()*10;
    g.strokeStyle = Math.random()<0.5 ? 'rgba(30,16,8,'+rand(0.15,0.5)+')' : 'rgba(140,95,55,'+rand(0.12,0.4)+')';
    g.lineWidth = rand(0.6,3.4);
    g.beginPath();
    for(let y=-10;y<=h+10;y+=8){
      const xx = x + Math.sin(y*0.012*wob + ph)*amp;
      y===-10 ? g.moveTo(xx,y) : g.lineTo(xx,y);
    }
    g.stroke();
  }
  for(let i=0;i<7;i++){ // knots
    const kx=Math.random()*w, ky=Math.random()*h, kr=rand(4,11);
    const kg=g.createRadialGradient(kx,ky,1,kx,ky,kr);
    kg.addColorStop(0,'rgba(25,12,6,0.9)'); kg.addColorStop(0.6,'rgba(70,42,20,0.5)'); kg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=kg; g.beginPath(); g.ellipse(kx,ky,kr*0.7,kr*1.6,0,0,Math.PI*2); g.fill();
  }
});
const woodMat = new THREE.MeshPhysicalMaterial({
  map: canvasTex(woodCanvas), roughness:0.30, metalness:0.06,
  clearcoat:0.95, clearcoatRoughness:0.16, color:0xbf9c78
});
const woodDarkMat = new THREE.MeshPhysicalMaterial({
  map: canvasTex(woodCanvas), roughness:0.38, metalness:0.05,
  clearcoat:0.6, clearcoatRoughness:0.3, color:0x8a6a4a
});

// --- spruce soundboard ---
const spruceCanvas = makeCanvas(512,512,(g,w,h)=>{
  g.fillStyle='#c8a86a'; g.fillRect(0,0,w,h);
  for(let i=0;i<300;i++){
    g.strokeStyle='rgba(120,88,40,'+rand(0.1,0.35)+')';
    g.lineWidth=rand(0.4,1.4);
    const x=Math.random()*w;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x+rand(-8,8),h); g.stroke();
  }
  const sheen=g.createLinearGradient(0,0,w,0);
  sheen.addColorStop(0,'rgba(255,240,200,0.0)'); sheen.addColorStop(0.5,'rgba(255,240,200,0.25)'); sheen.addColorStop(1,'rgba(60,40,10,0.15)');
  g.fillStyle=sheen; g.fillRect(0,0,w,h);
});
const soundboardMat = new THREE.MeshStandardMaterial({ map:canvasTex(spruceCanvas,2,2), roughness:0.6, metalness:0.05, color:0xd9bd85 });

// --- floor planks ---
const floorCanvas = makeCanvas(512,512,(g,w,h)=>{
  const rows=6;
  for(let r=0;r<rows;r++){
    const y=r*h/rows;
    const tone=rand(0.75,1.1);
    g.fillStyle='rgb('+(86*tone|0)+','+(56*tone|0)+','+(32*tone|0)+')';
    g.fillRect(0,y,w,h/rows);
    for(let i=0;i<60;i++){
      g.strokeStyle='rgba(35,20,10,'+rand(0.15,0.4)+')'; g.lineWidth=rand(0.5,1.6);
      const yy=y+Math.random()*h/rows;
      g.beginPath(); g.moveTo(0,yy); g.bezierCurveTo(w*0.3,yy+rand(-3,3),w*0.7,yy+rand(-3,3),w,yy); g.stroke();
    }
    g.fillStyle='rgba(15,8,4,0.85)'; g.fillRect(0,y,w,3);
    g.fillRect(Math.random()*w, y, 3, h/rows);
  }
});
const floorMat = new THREE.MeshPhysicalMaterial({ map:canvasTex(floorCanvas,5,5), roughness:0.42, clearcoat:0.35, clearcoatRoughness:0.35, color:0xb08a5c });

// --- wallpaper (deep green damask) ---
const wallCanvas = makeCanvas(512,512,(g,w,h)=>{
  g.fillStyle='#31413a'; g.fillRect(0,0,w,h);
  const cell=128;
  for(let cy=-1;cy<5;cy++) for(let cx=-1;cx<5;cx++){
    const ox=(cy%2===0)?0:cell/2, x=cx*cell+ox, y=cy*cell;
    g.save(); g.translate(x,y);
    g.strokeStyle='rgba(190,158,92,0.42)'; g.lineWidth=2.2;
    g.beginPath(); g.ellipse(0,0,26,40,0,0,Math.PI*2); g.stroke();
    g.beginPath(); g.ellipse(0,0,15,26,0,0,Math.PI*2); g.stroke();
    g.fillStyle='rgba(190,158,92,0.5)';
    g.beginPath(); g.arc(0,0,4.5,0,Math.PI*2); g.fill();
    for(const s of [-1,1]){
      g.beginPath(); g.moveTo(s*26,0); g.quadraticCurveTo(s*44,-14,s*36,-34); g.stroke();
      g.beginPath(); g.moveTo(s*26,0); g.quadraticCurveTo(s*44,14,s*36,34); g.stroke();
    }
    g.restore();
    g.fillStyle='rgba(16,24,20,0.35)';
    g.beginPath(); g.arc(x+cell/2,y+cell/2,7,0,Math.PI*2); g.fill();
  }
});
const wallMat = new THREE.MeshStandardMaterial({ map:canvasTex(wallCanvas,5,2.4), roughness:0.92, color:0xa8b0a0 });

// --- rug ---
const rugCanvas = makeCanvas(1024,640,(g,w,h)=>{
  g.fillStyle='#4f1d26'; g.fillRect(0,0,w,h);
  // outer border bands
  g.fillStyle='#232c44'; g.fillRect(0,0,w,58); g.fillRect(0,h-58,w,58); g.fillRect(0,0,70,h); g.fillRect(w-70,0,70,h);
  g.fillStyle='#c9a24e'; g.fillRect(0,58,w,5); g.fillRect(0,h-63,w,5); g.fillRect(70,0,5,h); g.fillRect(w-75,0,5,h);
  g.fillRect(0,16,w,4); g.fillRect(0,h-20,w,4); g.fillRect(16,0,4,h); g.fillRect(w-20,0,4,h);
  // border motif: alternating diamonds
  for(let x=30;x<w;x+=64){ diamond(g,x,29,10,'#c9a24e'); diamond(g,x,h-29,10,'#c9a24e'); }
  for(let y=30;y<h;y+=64){ diamond(g,35,y,10,'#c9a24e'); diamond(g,w-35,y,10,'#c9a24e'); }
  // central medallion
  const cx=w/2, cy=h/2;
  const rings=[[300,150,'#31405f'],[236,112,'#c9a24e'],[210,96,'#5a2a30'],[140,64,'#31405f'],[96,40,'#c9a24e']];
  for(const [rx,ry,col] of rings){
    g.fillStyle=col; g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); g.fill();
  }
  g.fillStyle='#c9a24e'; g.beginPath(); g.ellipse(cx,cy,42,18,0,0,Math.PI*2); g.fill();
  g.fillStyle='#31405f'; g.beginPath(); g.ellipse(cx,cy,22,10,0,0,Math.PI*2); g.fill();
  // corner fans
  for(const [fx,fy,sx,sy] of [[95,88,1,1],[w-95,88,-1,1],[95,h-88,1,-1],[w-95,h-88,-1,-1]]){
    g.save(); g.translate(fx,fy); g.scale(sx,sy);
    g.strokeStyle='#c9a24e'; g.lineWidth=4;
    for(let i=0;i<5;i++){ g.beginPath(); g.arc(0,0,26+i*14,0,Math.PI/2); g.stroke(); }
    g.restore();
  }
  // scattered diamonds
  for(let i=0;i<70;i++){ diamond(g,rand(110,w-110),rand(100,h-100),rand(4,7),'rgba(201,162,78,0.55)'); }
  // fringe
  g.fillStyle='#d8c49a';
  for(let x=0;x<w;x+=12){ g.fillRect(x,0,5,14); g.fillRect(x,h-14,5,14); }
  function diamond(g,x,y,r,col){
    g.fillStyle=col; g.beginPath(); g.moveTo(x,y-r); g.lineTo(x+r*0.7,y); g.lineTo(x,y+r); g.lineTo(x-r*0.7,y); g.closePath(); g.fill();
  }
});
const rugMat = new THREE.MeshStandardMaterial({ map:canvasTex(rugCanvas), roughness:0.95 });

// --- bench velvet ---
const benchCanvas = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#5d2230'; g.fillRect(0,0,w,h);
  for(let cy=0;cy<4;cy++) for(let cx=0;cx<4;cx++){
    const x=cx*64+32+(cy%2?32:0), y=cy*64+32;
    const tg=g.createRadialGradient(x-6,y-6,2,x,y,34);
    tg.addColorStop(0,'#8a3a48'); tg.addColorStop(0.7,'#5d2230'); tg.addColorStop(1,'#3a121c');
    g.fillStyle=tg; g.beginPath(); g.arc(((x%w)+w)%w,y,32,0,Math.PI*2); g.fill();
    g.fillStyle='#2c0d16'; g.beginPath(); g.arc(((x%w)+w)%w,y,4.5,0,Math.PI*2); g.fill();
  }
});
const velvetMat = new THREE.MeshStandardMaterial({ map:canvasTex(benchCanvas,1,1), roughness:0.96 });

// --- maker's decal ---
const decalCanvas = makeCanvas(512,96,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  g.fillStyle='#d8b25a';
  g.font='small-caps bold 44px Georgia';
  g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor='rgba(255,220,130,0.6)'; g.shadowBlur=10;
  g.fillText('A. ROTH & Cie', w/2, h/2-6);
  g.font='small-caps 20px Georgia'; g.fillStyle='#b8934a';
  g.fillText('· PARIS ·', w/2, h/2+26);
});
const decalTex = new THREE.CanvasTexture(decalCanvas);
decalTex.encoding = THREE.sRGBEncoding;

// --- paintings ---
const landscapeCanvas = makeCanvas(256,192,(g,w,h)=>{
  const sky=g.createLinearGradient(0,0,0,h*0.72);
  sky.addColorStop(0,'#33264a'); sky.addColorStop(0.45,'#7a3a3c'); sky.addColorStop(0.8,'#c96f3a'); sky.addColorStop(1,'#e8a35c');
  g.fillStyle=sky; g.fillRect(0,0,w,h*0.75);
  g.fillStyle='#ffd9a0'; g.shadowColor='#ffcf80'; g.shadowBlur=26;
  g.beginPath(); g.arc(w*0.62,h*0.62,17,0,Math.PI*2); g.fill(); g.shadowBlur=0;
  g.fillStyle='#241722'; g.beginPath(); g.moveTo(0,h*0.66);
  for(let x=0;x<=w;x+=16) g.lineTo(x,h*0.66+Math.sin(x*0.05)*9+rand(-2,2));
  g.lineTo(w,h); g.lineTo(0,h); g.fill();
  g.fillStyle='#150e14'; g.beginPath(); g.moveTo(0,h*0.8);
  for(let x=0;x<=w;x+=12) g.lineTo(x,h*0.8+Math.cos(x*0.07+2)*11);
  g.lineTo(w,h); g.lineTo(0,h); g.fill();
  g.strokeStyle='#0d0810'; g.lineWidth=1.6;
  for(const [bx,by] of [[60,44],[96,30],[150,52]]){
    g.beginPath(); g.moveTo(bx-6,by); g.quadraticCurveTo(bx,by-5,bx+6,by); g.moveTo(bx+2,by-2); g.quadraticCurveTo(bx+10,by-7,bx+15,by-1); g.stroke();
  }
});
const portraitCanvas = makeCanvas(256,320,(g,w,h)=>{
  g.fillStyle='#1c1410'; g.fillRect(0,0,w,h);
  const vg=g.createRadialGradient(w/2,h*0.36,10,w/2,h*0.4,120);
  vg.addColorStop(0,'#3a2a20'); vg.addColorStop(1,'#14100c');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  // distant candelabra silhouette
  g.fillStyle='#0d0a08';
  g.beginPath(); g.ellipse(w/2,h*0.88,52,16,0,0,Math.PI*2); g.fill();
  g.fillRect(w/2-4,h*0.4,8,h*0.5);
  for(const s of [-1,0,1]){
    g.fillRect(w/2+s*36-3,h*0.46,6,h*0.32);
    g.fillRect(w/2+s*36-12,h*0.44,24,5);
  }
  // candle flames
  for(const s of [-1,0,1]){
    const fx=w/2+s*36, fy=h*0.44;
    const fg=g.createRadialGradient(fx,fy-8,1,fx,fy-8,12);
    fg.addColorStop(0,'#ffe9a8'); fg.addColorStop(0.4,'#e8a83c'); fg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=fg; g.beginPath(); g.arc(fx,fy-8,12,0,Math.PI*2); g.fill();
  }
});
function paintingMat(c){ return new THREE.MeshStandardMaterial({ map:canvasTex(c), roughness:0.85 }); }

// --- evening window (moonlit) ---
const windowCanvas = makeCanvas(256,320,(g,w,h)=>{
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#2a3350'); sky.addColorStop(0.55,'#4a5578'); sky.addColorStop(0.85,'#8a7690'); sky.addColorStop(1,'#c9a583');
  g.fillStyle=sky; g.fillRect(0,0,w,h);
  // moon
  g.fillStyle='#f2ead6'; g.shadowColor='#ffffff'; g.shadowBlur=30;
  g.beginPath(); g.arc(w*0.68,h*0.24,22,0,Math.PI*2); g.fill(); g.shadowBlur=0;
  g.fillStyle='rgba(200,195,180,0.7)';
  g.beginPath(); g.arc(w*0.62,h*0.21,4,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc(w*0.74,h*0.28,3,0,Math.PI*2); g.fill();
  // clouds
  g.fillStyle='rgba(220,214,220,0.35)';
  for(const [cx,cy,cw] of [[70,120,70],[170,180,90],[120,80,55]]){
    g.beginPath(); g.ellipse(cx,cy,cw,10,0,0,Math.PI*2); g.fill();
  }
  // rooftops
  g.fillStyle='#131020';
  g.beginPath(); g.moveTo(0,h);
  g.lineTo(0,h*0.82); g.lineTo(40,h*0.82); g.lineTo(52,h*0.7); g.lineTo(64,h*0.82);
  g.lineTo(120,h*0.82); g.lineTo(132,h*0.74); g.lineTo(144,h*0.82); g.lineTo(256,h*0.82);
  g.lineTo(256,h); g.fill();
  // lit windows
  g.fillStyle='#ffca6a';
  g.fillRect(30,h*0.87,5,6); g.fillRect(96,h*0.88,5,6); g.fillRect(180,h*0.87,5,6); g.fillRect(220,h*0.89,5,6);
});

  const x = -KB_W/2 + (whiteIdx + 0.5)*WHITE_W;
  tmpWhites.push({ midi:m, x });
  keyDefs.push({ midi:m, isBlack:false, x, whiteIndex:whiteIdx });
  whiteIdx++;
}
for(let m=21;m<=108;m++) if(isBlackMidi(m)){
  let prev=null, next=null;
  for(const w of tmpWhites){ if(w.midi<m) prev=w; if(w.midi>m && !next) next=w; }
  keyDefs.push({ midi:m, isBlack:true, x:(prev.x+next.x)/2 });
}
keyDefs.sort((a,b)=>a.midi-b.midi);

  for(let i=0;i<n;i++){
    stringPlan.push({ midi:k.midi, x:k.x + (i-(n-1)/2)*spread, wound: k.midi < 40 });
  }
}

// ============================================================
//  AUDIO — WebAudio additive synth w/ hammer noise
// ============================================================
let audioCtx = null, masterGain = null, compNode = null;
function mtof(m){ return 440 * Math.pow(2, (m-69)/12); }
function initAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.85;
  compNode = audioCtx.createDynamicsCompressor();
  compNode.threshold.value = -14; compNode.knee.value = 18;
  compNode.ratio.value = 5; compNode.attack.value = 0.004; compNode.release.value = 0.18;
  masterGain.connect(compNode); compNode.connect(audioCtx.destination);
}
function playAudioNote(midi, durBeats, velocity){
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const f = mtof(midi);
  const t0 = audioCtx.currentTime + 0.002;
  const dur = Math.max(0.18, durBeats * 60 / song.bpm);
  const vol = (velocity || 0.5) * (midi < 40 ? 0.75 : midi > 84 ? 0.32 : 0.5);
  const rel = song.pedalDown ? 1.5 : 0.85;
  const noteGain = audioCtx.createGain();
  noteGain.connect(masterGain);
  noteGain.gain.setValueAtTime(0.0001, t0);
  noteGain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  noteGain.gain.exponentialRampToValueAtTime(vol*0.42, t0 + 0.45);
  noteGain.gain.setValueAtTime(vol*0.42, t0 + dur);
  noteGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + rel);
  // slightly inharmonic partials (stiff string)
  const partials = [[1,1.0],[2.001,0.46],[3.009,0.21],[4.16,0.10],[5.42,0.045]];
  for(const [ratio, amp] of partials){
    const o = audioCtx.createOscillator();
    o.type = 'sine'; o.frequency.value = f * ratio;
    const pg = audioCtx.createGain();
    pg.gain.value = amp * (ratio > 3 ? Math.pow(2,(midi-60)/24) : 1);
    o.connect(pg); pg.connect(noteGain);
    o.start(t0); o.stop(t0 + dur + rel + 0.05);
  }
  // hammer thock — filtered noise burst
  const nb = audioCtx.createBuffer(1, 2200, audioCtx.sampleRate);
  const d = nb.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 3.2);
  const noise = audioCtx.createBufferSource(); noise.buffer = nb;
  const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 1500 + f*0.6; bp.Q.value = 1.1;
  const ng = audioCtx.createGain(); ng.gain.value = 0.5;
  noise.connect(bp); bp.connect(ng); ng.connect(masterGain);
  noise.start(t0); noise.stop(t0 + 0.06);
}

// ============================================================
//  SIMULATION STATE
// ============================================================
const song = {
  bpm: 116,
  playing: false,
  beat: 0,
  evIdx: 0,
  pedIdx: 0,
  pedalDown: false,
  loop: true
};
let simTime = 0;
let notesPlayed = 0;
const activeNotes = [];        // {midi, releaseBeat, stringT0}
const manualPresses = [];      // {midi, releaseSimTime}
const pressedSet = new Set();
const DT = 1 / 240;

const window_ = window; // alias

window.__bench = { notesPlayed: 0, activeKeys: 0, tempo: song.bpm, rollPosition: 0 };

function mtofConst(m){ return 440 * Math.pow(2,(m-69)/12); }

function triggerNote(midi, durBeats, silent){
  notesPlayed++;
  const releaseBeat = song.beat + durBeats;
  activeNotes.push({ midi, releaseBeat });
  const st = stringStates[midi];
  st.amp = 1.0; st.t0 = simTime; st.released = false;
  hammersByMidi[midi].strikeT = simTime;
  if (!silent) playAudioNote(midi, durBeats, 0.85);
}
function triggerManual(midi, silent){
  notesPlayed++;
  manualPresses.push({ midi, releaseSimTime: simTime + 1.05 });
  const st = stringStates[midi];
  st.amp = 1.0; st.t0 = simTime; st.released = false;
  hammersByMidi[midi].strikeT = simTime;
  if (!silent) playAudioNote(midi, 0.55, 0.7);
}
function resetSimulation(){
  song.beat = 0; song.evIdx = 0; song.pedIdx = 0;
  song.pedalDown = false;
  activeNotes.length = 0; manualPresses.length = 0;
  notesPlayed = 0;
  for(let m=21;m<=108;m++){
    const st = stringStates[m]; st.amp = 0; st.t0 = -10; st.released = true;
    keysByMidi[m].press = 0;
    hammersByMidi[m].strikeT = -10;
    dampersByMidi[m].lift = 0;
  }
  setRollProgress(0);
}
function restartSong(){
  // keep notesPlayed cumulative; rewind transport only
  song.beat = 0; song.evIdx = 0; song.pedIdx = 0; song.pedalDown = false;
  for(let i=activeNotes.length-1;i>=0;i--){
    stringStates[activeNotes[i].midi].released = true;
  }
  activeNotes.length = 0;
}
function stepSim(dt, silent){
  simTime += dt;
  if (song.playing){
    song.beat += dt * song.bpm / 60;
    while (song.evIdx < TUNE_EVENTS.length && TUNE_EVENTS[song.evIdx].beat <= song.beat){
      const e = TUNE_EVENTS[song.evIdx];
      // chords fire together — keep tiny human-ish spread of velocity via index
      triggerNote(e.midi, e.dur, silent);
      song.evIdx++;
    }
    while (song.pedIdx < PEDAL_EVENTS.length && PEDAL_EVENTS[song.pedIdx].beat <= song.beat){
      song.pedalDown = PEDAL_EVENTS[song.pedIdx].on;
      song.pedIdx++;
    }
    for(let i=activeNotes.length-1;i>=0;i--){
      if (song.beat >= activeNotes[i].releaseBeat){
        stringStates[activeNotes[i].midi].released = true;
        activeNotes.splice(i,1);
      }
    }
    if (song.beat > TOTAL_BEATS + 1.6){
      if (song.loop) restartSong(); else song.playing = false;
    }
  }
  // manual key expiry
  for(let i=manualPresses.length-1;i>=0;i--){
    if (simTime >= manualPresses[i].releaseSimTime){
      stringStates[manualPresses[i].midi].released = true;
      manualPresses.splice(i,1);
    }
  }
  // decay string amplitudes
  for(let m=21;m<=108;m++){
    const st = stringStates[m];
    if (st.amp > 0.001){
      const held = !st.released;
      st.amp *= Math.exp(-(held ? 0.55 : 5.2) * dt);
      if (st.amp < 0.004) st.amp = 0;
    }
  }
  // damper / key easing
  pressedSet.clear();
  for(const n of activeNotes) pressedSet.add(n.midi);
  for(const n of manualPresses) pressedSet.add(n.midi);
  const kEase = Math.min(1, dt*13), dEase = Math.min(1, dt*9);
  for(let m=21;m<=108;m++){
    const k = keysByMidi[m];
    const target = pressedSet.has(m) ? 1 : 0;
    k.press += (target - k.press) * kEase;
    k.pivot.rotation.x = k.press * 0.052;
    const d = dampersByMidi[m];
    const dTarget = (pressedSet.has(m) || song.pedalDown) ? 1 : 0;
    d.lift += (dTarget - d.lift) * dEase;
    d.pivot.rotation.x = -d.lift * 0.42;
  }
}
function hammerAngle(strikeT){
  const rest = 0.14, hit = -0.34;
  if (strikeT < 0) return rest;
  const t = simTime - strikeT;
  if (t < 0) return rest;
  if (t < 0.055){ const u = t/0.055; return rest + (hit-rest)*(1-Math.pow(1-u,3)); }
  if (t < 0.135) return hit;
  if (t < 0.62){
    const u = (t-0.135)/0.485;
    const e = 1 - Math.pow(1-u, 2.6);
    const overshoot = Math.sin(u*Math.PI)*0.05;
    return hit + (rest-hit)*e + overshoot;
  }
  return rest;
}
function updateHammers(){
  for(let m=21;m<=108;m++){
    const h = hammersByMidi[m];
    h.group.rotation.x = hammerAngle(h.strikeT);
  }
}
function updateStringVibration(){
  for(let m=21;m<=108;m++){
    const st = stringStates[m];
    const meshes = stringsByMidi[m];
    if (!meshes) continue;
    const fVis = Math.min(30, Math.max(10, st.freq/17));
    const vib = st.amp;
    for(const mesh of meshes){
      const geo = mesh.geometry;
      const posAttr = geo.attributes.position;
      const base = mesh.userData.basePos;
      const phase = mesh.userData.phase;
      if (vib > 0.012){
        const w = (simTime - st.t0) * Math.PI * 2 * fVis + phase;
        const env = vib * 0.0058;
        for(let i=0;i<posAttr.count;i++){
          const by = base[i*3+1];
          const v = (by + STRING_LEN/2) / STRING_LEN;   // 0..1
          const shape = Math.sin(Math.PI * v);
          posAttr.array[i*3]   = base[i*3]   + Math.sin(w + v*2.1) * shape * env;
          posAttr.array[i*3+2] = base[i*3+2] + Math.cos(w*0.83 + v*1.7) * shape * env * 0.4;
        }
        posAttr.needsUpdate = true;
      } else if (mesh.userData.dirty){
        posAttr.array.set(base); posAttr.needsUpdate = true; mesh.userData.dirty = false;
        continue;
      }
      if (vib > 0.012) mesh.userData.dirty = true;
    }
  }
}
function updateTrackerDots(){
  for(let i=0;i<88;i++){
    const midi = 21+i;
    const target = pressedSet.has(midi) ? 2.1 : 0.12;
    const mat = trackerDots[i];
    mat.emissiveIntensity += (target - mat.emissiveIntensity) * 0.35;
  }
}
function updateBench(){
  window.__bench.notesPlayed = notesPlayed;
  window.__bench.activeKeys = pressedSet.size;
  window.__bench.tempo = song.bpm;
  window.__bench.rollPosition = Math.min(1, Math.max(0, song.beat / TOTAL_BEATS));
}

  { t: 8.0,  pos:[-1.45, 1.05, -0.05], tgt:[ 0.0, 0.78, -1.30] },
  { t: 10.0, pos:[ 2.15, 1.62,  1.15], tgt:[ 0.0, 0.90, -1.25] },
  { t: 12.0, pos:[ 3.45, 2.15,  2.85], tgt:[ 0.0, 0.98, -1.35] }
];
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();
function cameraAt(t, outPos, outTgt){
  t = Math.min(SHOWCASE_DURATION, Math.max(0, t));
  let i = 0;
  while (i < camPath.length - 2 && camPath[i+1].t < t) i++;
  const a = camPath[i], b = camPath[i+1];
  let u = (t - a.t) / Math.max(0.0001, b.t - a.t);
  u = Math.min(1, Math.max(0, u));
  const s = u*u*(3-2*u); // smoothstep
  outPos.set(
    a.pos[0] + (b.pos[0]-a.pos[0])*s,
    a.pos[1] + (b.pos[1]-a.pos[1])*s,
    a.pos[2] + (b.pos[2]-a.pos[2])*s
  );
  outTgt.set(
    a.tgt[0] + (b.tgt[0]-a.tgt[0])*s,
    a.tgt[1] + (b.tgt[1]-a.tgt[1])*s,
    a.tgt[2] + (b.tgt[2]-a.tgt[2])*s
  );
}
function seek(t){
  t = Math.min(SHOWCASE_DURATION, Math.max(0, t));
  song.playing = true; song.loop = false;
  resetSimulation(); simTime = 0;
  const steps = Math.floor(t / DT);
  for(let i=0;i<steps;i++) stepSim(DT, true);
  const rem = t - steps*DT; if (rem > 0.0001) stepSim(rem, true);
  song.playing = false; // freeze after seek
  updateHammers(); updateStringVibration(); updateTrackerDots();
  setRollProgress(Math.min(1, song.beat / TOTAL_BEATS));
  cameraAt(t, _v1, _v2);
  camera.position.copy(_v1);
  controls.target.copy(_v2);
  controls.enabled = false;
  composer.render();
  updateBench();
}
window.showcase = { duration: SHOWCASE_DURATION, seek };

// Recording
const recordBtn = document.getElementById('recordBtn');
const tempoValEl = document.getElementById('tempoVal');
let showcaseRunning = false;
let showcaseT0 = 0, showcaseSimAcc = 0;
let mediaRecorder = null, recordedChunks = [];

function pickMime(){
  const types = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  for(const t of types){ if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t; }
  return '';
}
recordBtn.addEventListener('click', () => {
  if (showcaseRunning) return;
  initAudio(); // harmless; recording itself is silent video
  resetSimulation(); simTime = 0;
  song.playing = true; song.loop = false;
  showcaseRunning = true;
  showcaseT0 = performance.now();
  showcaseSimAcc = 0;
  controls.enabled = false;
  recordBtn.classList.add('rec');
  recordBtn.innerHTML = '<span id="recDot"></span>Recording…';
  try {
    const stream = renderer.domElement.captureStream(60);
    const mime = pickMime();
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 14_000_000 } : undefined);
    recordedChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mime || 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'roth-pianola-showcase.webm';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      recordBtn.classList.remove('rec');
      recordBtn.innerHTML = '<span id="recDot"></span>Record Video';
      controls.enabled = true;
    };
    mediaRecorder.start(120);
  } catch(err) {
    console.warn('MediaRecorder unavailable:', err);
    showcaseRunning = false;
    controls.enabled = true;
    recordBtn.classList.remove('rec');
    recordBtn.innerHTML = '<span id="recDot"></span>Record Video';
  }
});

// ============================================================
//  INTERACTION
// ============================================================
const MANUAL_MAP = {
  'a':60,'w':61,'s':62,'e':63,'d':64,'f':65,'t':66,'g':67,'y':68,'h':69,'u':70,'j':71,'k':72
};
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const key = e.key.toLowerCase();
  if (key === ' '){
    e.preventDefault();
    initAudio();
    if (song.beat >= TOTAL_BEATS + 1.5) restartSong();
    song.playing = !song.playing;
    return;
  }
  if (key === 'arrowup'){ e.preventDefault(); song.bpm = Math.min(208, song.bpm + 5); tempoValEl.textContent = song.bpm; return; }
  if (key === 'arrowdown'){ e.preventDefault(); song.bpm = Math.max(48, song.bpm - 5); tempoValEl.textContent = song.bpm; return; }
  if (MANUAL_MAP[key] !== undefined){
    initAudio();
    triggerManual(MANUAL_MAP[key], false);
  }
});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let glissDown = false, lastGlissMidi = -1;
function pickKeyMidi(clientX, clientY){
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickTargets, false);
  return hits.length ? hits[0].object.userData.midi : -1;
}
renderer.domElement.addEventListener('pointerdown', e => {
  const midi = pickKeyMidi(e.clientX, e.clientY);
  if (midi >= 0){
    initAudio();
    triggerManual(midi, false);
    glissDown = true; lastGlissMidi = midi;
  }
});
window.addEventListener('pointermove', e => {
  if (!glissDown) return;
  const midi = pickKeyMidi(e.clientX, e.clientY);
  if (midi >= 0 && midi !== lastGlissMidi){
    initAudio();
    triggerManual(midi, false);
    lastGlissMidi = midi;
  }
});
window.addEventListener('pointerup', () => { glissDown = false; lastGlissMidi = -1; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
//  MAIN LOOP
// ============================================================
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  if (showcaseRunning){
    const t = Math.min(SHOWCASE_DURATION, (performance.now() - showcaseT0) / 1000);
    // advance simulation incrementally with fixed steps (deterministic path)
    const target = t;
    while (showcaseSimAcc + DT <= target){
      stepSim(DT, true);
      showcaseSimAcc += DT;
    }
    updateHammers(); updateStringVibration(); updateTrackerDots();
    setRollProgress(Math.min(1, song.beat / TOTAL_BEATS));
    cameraAt(t, _v1, _v2);
    camera.position.copy(_v1); controls.target.copy(_v2);
    // final flourish: hold last frame until recorder stops
    if (t >= SHOWCASE_DURATION && mediaRecorder && mediaRecorder.state === 'recording'){
      mediaRecorder.stop();
      showcaseRunning = false;
      song.playing = false;
    }
  } else {
    // fixed-step simulation for stability
    let acc = dt;
    while (acc > 0){
      const h = Math.min(DT, acc);
      stepSim(h, false);
      acc -= h;
    }
    updateHammers(); updateStringVibration(); updateTrackerDots();
    setRollProgress(Math.min(1, song.beat / TOTAL_BEATS));
    if (controls.enabled) controls.update();
  }

  // ambient life
  const flick = 1 + Math.sin(simTime*13.7)*0.035 + Math.sin(simTime*29.3 + 1.7)*0.025;
  lampLight.intensity = 1.5 * flick;
  lampGroup.userData.shadeMat.emissiveIntensity = 1.05 * flick;
  const pend = metronome.userData.pendulum;
  pend.rotation.z = Math.sin(simTime * Math.PI * song.bpm / 60) * 0.38;
  // dust drift
  {
    const posAttr = dust.geometry.attributes.position;
    const seed = dust.userData.seed, base = dust.userData.base;
    for(let i=0;i<seed.length;i++){
      const s = seed[i];
      posAttr.array[i*3+1] = base[i*3+1] + Math.sin(simTime*0.28 + s)*0.14;
      posAttr.array[i*3]   = base[i*3]   + Math.sin(simTime*0.17 + s*1.7)*0.10;
    }
    posAttr.needsUpdate = true;
  }

  updateBench();
  composer.render();
}

// kick off the self-playing pianola on load
initAudioDeferred();
function initAudioDeferred(){
  // AudioContext is created on first user gesture; transport starts silently
  song.playing = true;
  song.loop = true;
}
resetSimulation();
simTime = 0;
tempoValEl.textContent = song.bpm;
animate();
</script>

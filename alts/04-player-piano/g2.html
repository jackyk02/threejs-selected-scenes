<script>
'use strict';
/* ============================================================
   THE PARLOR PLAYER — a self-playing Victorian upright piano
   All geometry, textures, music, and sound are generated in-code.
   ============================================================ */

// ---------- global handles (required top-level) ----------
let scene, camera, renderer, controls, composer;

// ---------- deterministic simulation clocks ----------
let animTime  = 0;      // continuous, deterministic under fixed-step seek()
let songBeats = 0;      // position in the tune (beats)
let songTime  = 0;      // position in seconds
let isPlaying = true;
let tempo     = 96;     // bpm
let triggerIdx = 0;
let struck    = [];     // active note records
const FIXED_DT = 1/120; // fixed step for seek() determinism

// ---------- bench ----------
const __bench = { notesPlayed: 0, activeKeys: 0, tempo: tempo, rollPosition: 0 };
window.__bench = __bench;
let notesPlayed = 0;

// ============================================================
// 1. PROCEDURAL CANVAS TEXTURES
// ============================================================
function makeTex(w, h, draw, opts){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = (opts && opts.clamp) ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  t.anisotropy = 8; t.encoding = THREE.sRGBEncoding;
  if(opts && opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  return t;
}
let seed = 1234567;
function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

const woodPianoTex = makeTex(512, 512, (g,w,h)=>{
  const grad = g.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'#432714'); grad.addColorStop(0.5,'#553019'); grad.addColorStop(1,'#3c2312');
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  for(let i=0;i<190;i++){
    const y0 = rnd()*h, amp = 2+rnd()*7, per = 90+rnd()*160, ph = rnd()*6.28;
    g.strokeStyle = rnd()<0.55 ? 'rgba(28,14,6,'+(0.16+rnd()*0.32)+')' : 'rgba(140,88,45,'+(0.10+rnd()*0.22)+')';
    g.lineWidth = 0.5 + rnd()*2.1; g.beginPath();
    for(let x=0;x<=w;x+=8){ const y = y0 + Math.sin(x/per*6.28+ph)*amp + Math.sin(x/31+ph*2)*1.5; x===0?g.moveTo(x,y):g.lineTo(x,y); }
    g.stroke();
  }
  for(let i=0;i<6;i++){ // knots
    const kx=rnd()*w, ky=rnd()*h;
    for(let r=2;r<17;r+=2.4){ g.strokeStyle='rgba(30,15,7,'+(0.42-r*0.02)+')'; g.lineWidth=1.1;
      g.beginPath(); g.ellipse(kx,ky,r*1.7,r,0.3,0,6.29); g.stroke(); }
  }
  const sheen = g.createRadialGradient(w*0.5,h*0.42,20,w*0.5,h*0.42,w*0.75);
  sheen.addColorStop(0,'rgba(255,222,160,0.14)'); sheen.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = sheen; g.fillRect(0,0,w,h);
});
const woodFloorTex = makeTex(1024, 1024, (g,w,h)=>{
  const plankH = 102;
  for(let row=0; row<h/plankH; row++){
    const offset = (row%3)*340 + rnd()*80;
    for(let x=-offset; x<w+400; ){
      const pw = 260 + rnd()*260;
      const l = 15 + rnd()*9, hue = 20 + rnd()*10, sat = 32+rnd()*14;
      g.fillStyle = 'hsl('+hue+','+sat+'%,'+l+'%)'; g.fillRect(x, row*plankH, pw, plankH);
      for(let i=0;i<26;i++){
        g.strokeStyle='rgba(20,10,5,'+(0.10+rnd()*0.25)+')'; g.lineWidth=0.6+rnd()*1.4;
        const gy = row*plankH + rnd()*plankH; g.beginPath(); g.moveTo(x,gy);
        g.bezierCurveTo(x+pw*0.3, gy+rnd()*6-3, x+pw*0.7, gy+rnd()*6-3, x+pw, gy+rnd()*4-2); g.stroke();
      }
      g.fillStyle='rgba(0,0,0,0.55)'; g.fillRect(x+pw-3, row*plankH, 3, plankH);
      x += pw;
    }
    g.fillStyle='rgba(0,0,0,0.6)'; g.fillRect(0, row*plankH, w, 4);
  }
}, {repeat:[5,5]});
const spruceTex = makeTex(512, 512, (g,w,h)=>{
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#b98d54'); grad.addColorStop(0.5,'#c9a066'); grad.addColorStop(1,'#a87c46');
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  for(let i=0;i<240;i++){
    const x=rnd()*w; g.strokeStyle='rgba(90,60,28,'+(0.10+rnd()*0.22)+')'; g.lineWidth=0.5+rnd()*1.2;
    g.beginPath(); g.moveTo(x+rnd()*6-3,0);
    g.bezierCurveTo(x+rnd()*10-5,h*0.33, x+rnd()*10-5,h*0.66, x+rnd()*8-4,h); g.stroke();
  }
});
const wallpaperTex = makeTex(512, 512, (g,w,h)=>{
  g.fillStyle='#22362c'; g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=64){ g.fillStyle='rgba(210,185,140,0.055)'; g.fillRect(x,0,26,h); }
  for(let row=0; row<4; row++) for(let col=0; col<4; col++){
    const cx = col*128 + (row%2?64:0) + 64, cy = row*128 + 64;
    g.strokeStyle='rgba(216,190,142,0.30)'; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(cx,cy-30); g.lineTo(cx+22,cy); g.lineTo(cx,cy+30); g.lineTo(cx-22,cy); g.closePath(); g.stroke();
    g.beginPath(); g.moveTo(cx,cy-13); g.lineTo(cx+10,cy); g.lineTo(cx,cy+13); g.lineTo(cx-10,cy); g.closePath(); g.stroke();
    g.fillStyle='rgba(216,190,142,0.34)';
    [[0,-40],[0,40],[-32,0],[32,0]].forEach(p=>{ g.beginPath(); g.arc(cx+p[0],cy+p[1],2.4,0,6.29); g.fill(); });
    g.beginPath(); g.arc(cx,cy,2.8,0,6.29); g.fill();
  }
  for(let i=0;i<900;i++){ g.fillStyle='rgba(0,0,0,'+rnd()*0.13+')'; g.fillRect(rnd()*w,rnd()*h,1.5,1.5); }
  const vg=g.createLinearGradient(0,0,0,h); vg.addColorStop(0,'rgba(0,0,0,0.35)'); vg.addColorStop(0.25,'rgba(0,0,0,0)'); vg.addColorStop(0.8,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.4)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
}, {repeat:[4,1.6]});
const rugTex = makeTex(1024, 768, (g,w,h)=>{
  const rg=g.createRadialGradient(w/2,h/2,60,w/2,h/2,w*0.62);
  rg.addColorStop(0,'#71301f'); rg.addColorStop(0.6,'#5d241b'); rg.addColorStop(1,'#401510');
  g.fillStyle=rg; g.fillRect(0,0,w,h);
  g.fillStyle='#26324e'; g.fillRect(0,0,w,54); g.fillRect(0,h-54,w,54); g.fillRect(0,0,54,h); g.fillRect(w-54,0,54,h);
  g.strokeStyle='#c9a24e'; g.lineWidth=5; g.strokeRect(58,58,w-116,h-116); g.strokeRect(6,6,w-12,h-12);
  g.fillStyle='#7a2c22'; g.fillRect(76,76,w-152,h-152);
  g.strokeStyle='#c9a24e'; g.lineWidth=3; g.strokeRect(88,88,w-176,h-176);
  g.fillStyle='rgba(201,162,78,0.85)';
  for(let x=110;x<w-100;x+=52){ g.beginPath(); g.arc(x,32,5,0,6.29); g.fill(); g.beginPath(); g.arc(x,h-32,5,0,6.29); g.fill(); }
  for(let y=110;y<h-100;y+=52){ g.beginPath(); g.arc(32,y,5,0,6.29); g.fill(); g.beginPath(); g.arc(w-32,y,5,0,6.29); g.fill(); }
  // medallion
  g.save(); g.translate(w/2,h/2);
  const rings=[[210,'#26324e'],[168,'#c9a24e'],[150,'#26324e'],[118,'#7a2c22'],[70,'#c9a24e'],[46,'#26324e']];
  rings.forEach(r=>{ g.fillStyle=r[1]; g.beginPath(); g.ellipse(0,0,r[0],r[0]*0.72,0,0,6.29); g.fill(); });
  g.fillStyle='#c9a24e'; g.beginPath();
  for(let i=0;i<8;i++){ const a=i/8*6.283; const px=Math.cos(a)*46, py=Math.sin(a)*46*0.72; i===0?g.moveTo(px,py):g.lineTo(px,py); }
  g.closePath(); g.fill();
  g.restore();
  // corner flourishes
  [[130,110,1,1],[w-130,110,-1,1],[130,h-110,1,-1],[w-130,h-110,-1,-1]].forEach(c=>{
    g.save(); g.translate(c[0],c[1]); g.scale(c[2],c[3]);
    g.strokeStyle='#c9a24e'; g.lineWidth=4;
    g.beginPath(); g.arc(0,0,52,0,1.6); g.stroke();
    g.beginPath(); g.arc(24,24,26,0,1.6); g.stroke();
    g.restore();
  });
  for(let i=0;i<1600;i++){ g.fillStyle='rgba(235,225,205,'+rnd()*0.06+')'; g.fillRect(rnd()*w,rnd()*h,2,2); }
}, {clamp:true});
const paintingLandscape = makeTex(256, 320, (g,w,h)=>{
  const sky=g.createLinearGradient(0,0,0,h*0.62);
  sky.addColorStop(0,'#d9c496'); sky.addColorStop(0.6,'#a9885e'); sky.addColorStop(1,'#6b5236');
  g.fillStyle=sky; g.fillRect(0,0,w,h*0.62);
  const sun=g.createRadialGradient(w*0.62,h*0.34,4,w*0.62,h*0.34,60);
  sun.addColorStop(0,'rgba(255,240,200,0.95)'); sun.addColorStop(1,'rgba(255,240,200,0)');
  g.fillStyle=sun; g.fillRect(0,0,w,h*0.62);
  const ridge=(base,amp,col)=>{ g.fillStyle=col; g.beginPath(); g.moveTo(0,base);
    for(let x=0;x<=w;x+=16) g.lineTo(x, base - Math.abs(Math.sin(x*0.045+base))*amp - Math.sin(x*0.013+base*2)*amp*0.5);
    g.lineTo(w,h*0.62); g.lineTo(0,h*0.62); g.closePath(); g.fill(); };
  ridge(h*0.40,42,'#4a4038'); ridge(h*0.50,34,'#332c26'); ridge(h*0.58,20,'#211c17');
  g.fillStyle='#14100d'; g.fillRect(0,h*0.62,w,h*0.38);
  g.fillStyle='rgba(217,196,150,0.28)'; g.fillRect(w*0.52,h*0.62,w*0.2,h*0.30);
  g.strokeStyle='rgba(20,16,12,0.8)'; g.lineWidth=1.4;
  [[60,120],[90,105],[150,95],[185,130]].forEach(b=>{ g.beginPath(); g.moveTo(b[0]-7,b[1]); g.quadraticCurveTo(b[0],b[1]-6,b[0]+1,b[1]); g.quadraticCurveTo(b[0]+2,b[1]-6,b[0]+9,b[1]); g.stroke(); });
}, {clamp:true});
const paintingPortrait = makeTex(256, 320, (g,w,h)=>{
  const bg=g.createRadialGradient(w*0.5,h*0.36,10,w*0.5,h*0.42,h*0.75);
  bg.addColorStop(0,'#3a2f24'); bg.addColorStop(0.55,'#221a13'); bg.addColorStop(1,'#100c08');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.fillStyle='#1a2530'; g.beginPath(); g.ellipse(w*0.5,h*1.02,w*0.52,h*0.46,0,Math.PI,6.29); g.fill();
  g.fillStyle='#0e141c'; g.beginPath(); g.ellipse(w*0.5,h*1.05,w*0.4,h*0.36,0,Math.PI,6.29); g.fill();
  const skin=g.createLinearGradient(w*0.35,0,w*0.65,0);
  skin.addColorStop(0,'#4a2f1e'); skin.addColorStop(0.45,'#7a5233'); skin.addColorStop(0.62,'#8a5f3a'); skin.addColorStop(1,'#40271a');
  g.fillStyle=skin; g.beginPath(); g.ellipse(w*0.5,h*0.42,w*0.185,h*0.235,0,0,6.29); g.fill();
  g.fillStyle='#241610'; g.beginPath(); g.ellipse(w*0.5,h*0.225,w*0.19,h*0.085,0,Math.PI,6.29); g.fill();
  g.strokeStyle='rgba(232,201,150,0.55)'; g.lineWidth=2.4;
  g.beginPath(); g.arc(w*0.575,h*0.40,w*0.148,-1.1,1.25); g.stroke();
  g.fillStyle='rgba(240,230,215,0.75)'; g.beginPath();
  g.moveTo(w*0.42,h*0.78); g.lineTo(w*0.5,h*0.70); g.lineTo(w*0.58,h*0.78); g.lineTo(w*0.5,h*0.86); g.closePath(); g.fill();
}, {clamp:true});
const nightWindowTex = makeTex(256, 384, (g,w,h)=>{
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#0d1830'); sky.addColorStop(0.55,'#1b2a4a'); sky.addColorStop(1,'#33405e');
  g.fillStyle=sky; g.fillRect(0,0,w,h);
  for(let i=0;i<110;i++){ g.fillStyle='rgba(255,255,255,'+(0.3+rnd()*0.7)+')'; g.fillRect(rnd()*w, rnd()*h*0.6, 1.3, 1.3); }
  const moon=g.createRadialGradient(w*0.68,h*0.22,6,w*0.68,h*0.22,80);
  moon.addColorStop(0,'rgba(240,244,255,1)'); moon.addColorStop(0.18,'rgba(220,228,250,0.9)'); moon.addColorStop(0.3,'rgba(190,205,240,0.22)'); moon.addColorStop(1,'rgba(190,205,240,0)');
  g.fillStyle=moon; g.fillRect(0,0,w,h);
  g.fillStyle='#dfe6f5'; g.beginPath(); g.arc(w*0.68,h*0.22,17,0,6.29); g.fill();
  g.fillStyle='rgba(120,135,170,0.5)'; g.beginPath(); g.arc(w*0.65,h*0.21,4,0,6.29); g.fill(); g.arc(w*0.72,h*0.25,2.6,0,6.29); g.fill();
  g.fillStyle='rgba(30,38,60,0.85)';
  g.beginPath(); g.moveTo(0,h); g.lineTo(0,h*0.78); g.lineTo(w*0.3,h*0.66); g.lineTo(w*0.55,h*0.82); g.lineTo(w*0.8,h*0.70); g.lineTo(w,h*0.8); g.lineTo(w,h); g.closePath(); g.fill();
}, {clamp:true});
const nameBoardTex = makeTex(1024, 96, (g,w,h)=>{
  g.fillStyle='#2a1a0e'; g.fillRect(0,0,w,h);
  g.strokeStyle='#c9a24e'; g.lineWidth=3; g.strokeRect(8,8,w-16,h-16);
  g.fillStyle='#e6c87a'; g.font='small-caps bold 44px Georgia, serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('A.  Parlor  &  Sons', w/2, h/2+2);
}, {clamp:true});
const cushionTex = makeTex(256, 256, (g,w,h)=>{
  g.fillStyle='#571f22'; g.fillRect(0,0,w,h);
  for(let i=0;i<9;i++) for(let j=0;j<9;j++){
    const cx=i*32+((j%2)?16:0)+16, cy=j*32+16;
    const rg=g.createRadialGradient(cx-3,cy-3,1,cx,cy,11);
    rg.addColorStop(0,'#8a3a3c'); rg.addColorStop(0.7,'#4a181b'); rg.addColorStop(1,'#2e0e10');
    g.fillStyle=rg; g.beginPath(); g.arc(cx,cy,9.5,0,6.29); g.fill();
  }
  for(let i=0;i<400;i++){ g.fillStyle='rgba(255,200,190,'+rnd()*0.06+')'; g.fillRect(rnd()*w,rnd()*h,1.5,1.5); }
});
const marbleTex = makeTex(256, 256, (g,w,h)=>{
  g.fillStyle='#cfc8bd'; g.fillRect(0,0,w,h);
  for(let i=0;i<26;i++){
    g.strokeStyle='rgba(110,108,104,'+(0.25+rnd()*0.3)+')'; g.lineWidth=0.6+rnd()*1.6;
    g.beginPath(); let x=rnd()*w, y=0; g.moveTo(x,y);
    while(y<h){ y+=14+rnd()*20; x+=rnd()*36-18; g.lineTo(x,y); } g.stroke();
  }
});
const clockTex = makeTex(128, 128, (g,w,h)=>{
  g.fillStyle='#1c130a'; g.fillRect(0,0,w,h);
  g.fillStyle='#ece0c4'; g.beginPath(); g.arc(64,64,52,0,6.29); g.fill();
  g.strokeStyle='#3a2a16'; g.lineWidth=3; g.beginPath(); g.arc(64,64,52,0,6.29); g.stroke();
  g.fillStyle='#3a2a16'; g.font='bold 15px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  const RN=['XII','III','VI','IX']; const pos=[[64,22],[106,64],[64,106],[22,64]];
  RN.forEach((r,i)=>g.fillText(r,pos[i][0],pos[i][1]));
  for(let i=0;i<12;i++){ const a=i/12*6.283; if(i%3===0) continue;

// 3. PUNCHED ROLL TEXTURE (generated from the same note data)
// ============================================================
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);
const rollTex = makeTex(4096, 256, (g,w,h)=>{
  g.fillStyle = '#e9dcbb'; g.fillRect(0,0,w,h);
  const age = g.createLinearGradient(0,0,w,0);
  age.addColorStop(0,'rgba(150,120,70,0.22)'); age.addColorStop(0.15,'rgba(0,0,0,0)');
  age.addColorStop(0.85,'rgba(0,0,0,0)'); age.addColorStop(1,'rgba(150,120,70,0.25)');
  g.fillStyle = age; g.fillRect(0,0,w,h);
  for(let i=0;i<2200;i++){ g.fillStyle='rgba(120,95,55,'+rnd()*0.16+')'; g.fillRect(rnd()*w, rnd()*h, 2+rnd()*5, 1+rnd()*2); }
  const songW = w * 0.81, x0 = w * 0.02;
  const laneH = h / 88;
  // faint lane separators
  for(let i=0;i<=88;i++){
    g.strokeStyle = (i%12===0) ? 'rgba(70,52,28,0.35)' : 'rgba(70,52,28,0.13)';
    g.lineWidth = 1; g.beginPath(); g.moveTo(0, i*laneH); g.lineTo(w, i*laneH); g.stroke();
  }
  // sprocket feed holes along both edges
  const step = songW / TOTAL_BEATS * 0.5;
  for(let x = x0; x < x0 + songW; x += step){
    [7, h-7].forEach(y=>{
      g.fillStyle='#221a10'; g.beginPath(); g.arc(x, y, 3.1, 0, 6.29); g.fill();
      g.strokeStyle='rgba(255,250,230,0.5)'; g.lineWidth=0.8; g.beginPath(); g.arc(x, y, 3.7, 0, 6.29); g.stroke();
    });
  }
  // NOTE HOLES — one per note, lane = midi-21 (midi 21 at bottom)
  SONG.forEach(e=>{
    const hx = x0 + (e.t / TOTAL_BEATS) * songW;
    e.notes.forEach(m=>{
      const lane = m - 21;
      const hy = h - (lane + 0.5) * laneH;
      g.fillStyle = '#171009';
      g.beginPath(); g.ellipse(hx, hy, 6.4, laneH*0.46, 0, 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,246,220,0.55)';
      g.beginPath(); g.ellipse(hx, hy + laneH*0.42, 5.6, 0.9, 0, 0, 6.29); g.fill();
    });
  });
  // title block at the head of the roll
  g.fillStyle = '#3a2a16'; g.font = 'small-caps bold 30px Georgia, serif'; g.textAlign='left';
  g.fillText('Für Elise', x0 + 30, h*0.30);
  g.font = 'italic 15px Georgia, serif'; g.fillText('L. van Beethoven  ·  Op. 59', x0 + 30, h*0.30 + 26);
  g.font = '12px Georgia, serif'; g.fillStyle='rgba(58,42,22,0.85)';
  g.fillText('Arr. A. Parlor & Sons, 1897', x0 + 30, h*0.30 + 46);
}, {clamp:true});

const WHITE_N = 52, BLACK_N = 36;
const isBlackPc = pc => [1,3,6,8,10].indexOf(pc) >= 0;
function whiteX(i){ return (i - 25.5) * PIANO.whiteW; }

const keys = {};             // midi -> key record
let whiteCount = -1;
const keyHitMeshes = [];
const stringMeshes = [];     // flat list for reset
let totalStrings = 0;

const stringPlain = new THREE.MeshStandardMaterial({ color: 0xd9d9d2, metalness: 0.92, roughness: 0.28 });
const stringCopper = new THREE.MeshStandardMaterial({ color: 0xb5713a, metalness: 0.78, roughness: 0.45 });
const keyGroupZ = { white: PIANO.keyBackZ, black: 0.305 };

for(let midi = 21; midi <= 108; midi++){
  const pc = midi % 12;
  const black = isBlackPc(pc);
  let x;
  if(!black){ whiteCount++; x = whiteX(whiteCount); }
  else { x = whiteX(whiteCount + 1) - PIANO.whiteW * 0.5 + 0.0; x = (whiteCount + 1 - 26) * PIANO.whiteW; }

  const rec = { midi: midi, black: black, x: x, press: 0, restHammer: 0.30, restDamper: 0, strings: [] };

  // --- key (pivot at back) ---
  const pivot = new THREE.Group();
  if(!black){
    pivot.position.set(x, 0.7095, PIANO.keyBackZ);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.0225, 0.021, PIANO.keyDepth), ivoryMat);
    mesh.position.set(0, 0, PIANO.keyDepth / 2);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.userData.midi = midi;
    pivot.add(mesh);
    // subtle ivory front lip
    const lip = new THREE.Mesh(new THREE.BoxGeometry(0.0225, 0.008, 0.006), new THREE.MeshStandardMaterial({ color: 0xd8cfb6, roughness: 0.5 }));
    lip.position.set(0, -0.0065, PIANO.keyDepth - 0.003); pivot.add(lip);
    keyHitMeshes.push(mesh);
  } else {
    pivot.position.set(x, 0.729, 0.305);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.0128, 0.019, 0.096), ebonyMat);
    mesh.position.set(0, 0, 0.0485);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.userData.midi = midi;
    pivot.add(mesh);
    keyHitMeshes.push(mesh);
  }
  piano.add(pivot);
  rec.keyPivot = pivot;

  // --- hammer (pivot low, head throws toward strings) ---
  const hPivot = new THREE.Group();
  hPivot.position.set(x, PIANO.hammerPivotY, PIANO.hammerPivotZ);
  const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.0034, 0.0034, 0.152, 6), new THREE.MeshStandardMaterial({ color: 0x8a5a30, roughness: 0.6 }));
  shank.position.y = 0.076; hPivot.add(shank);
  const knuckle = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 8), new THREE.MeshStandardMaterial({ color: 0xd8cbb0, roughness: 0.8 }));
  knuckle.position.y = 0.028; hPivot.add(knuckle);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.0128, 0.0128, 0.026, 14), feltMat);
  head.rotation.z = Math.PI/2; head.position.y = 0.152; hPivot.add(head);
  const headGlue = new THREE.Mesh(new THREE.CylinderGeometry(0.0129, 0.0129, 0.007, 14), new THREE.MeshStandardMaterial({ color: 0x5a3418, roughness: 0.6 }));
  headGlue.rotation.z = Math.PI/2; headGlue.position.set(0.011, 0.152, 0); hPivot.add(headGlue);
  hPivot.rotation.x = rec.restHammer;
  hPivot.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  piano.add(hPivot);
  rec.hammerPivot = hPivot;

  // --- damper (lever + red felt pad) ---
  const dPivot = new THREE.Group();
  dPivot.position.set(x, PIANO.damperPivotY, PIANO.damperPivotZ);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.007, 0.128, 0.005), new THREE.MeshStandardMaterial({ color: 0x6a6a6a, metalness: 0.75, roughness: 0.4 }));
  arm.position.y = -0.062; dPivot.add(arm);
  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.0135, 0.014, 0.007), damperFelt);
  pad.position.set(0, -0.128, -0.062); dPivot.add(pad);
  const spoon = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.05, 0.003), brassDark);
  spoon.position.set(0, -0.03, 0.004); dPivot.add(spoon);

// 9. WEBAUDIO — Karplus–Strong synthesis + parlour reverb
// ============================================================
let audioCtx = null, masterGain = null, convolver = null, wetGain = null;
const ksCache = {};
function ensureAudio(){
  if(audioCtx) { if(audioCtx.state === 'suspended') audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 18; comp.ratio.value = 4.5;
  comp.attack.value = 0.004; comp.release.value = 0.18;
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.85;
  masterGain.connect(comp); comp.connect(audioCtx.destination);
  // procedural parlour impulse response
  const sr = audioCtx.sampleRate, len = Math.floor(sr * 2.3);
  const impulse = audioCtx.createBuffer(2, len, sr);
  for(let ch = 0; ch < 2; ch++){
    const d = impulse.getChannelData(ch);
    for(let i = 0; i < len; i++){
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.1) * Math.exp(-i / (sr * 0.55));
    }
  }
  convolver = audioCtx.createConvolver(); convolver.buffer = impulse;
  wetGain = audioCtx.createGain(); wetGain.gain.value = 0.20;
  convolver.connect(wetGain); wetGain.connect(masterGain);
}
function getKSBuffer(midi){
  if(ksCache[midi]) return ksCache[midi];
  const sr = audioCtx.sampleRate, freq = midiToFreq(midi);
  const N = Math.max(2, Math.round(sr / freq));
  const secs = midi < 45 ? 4.2 : (midi < 72 ? 2.7 : 1.7);
  const len = Math.floor(sr * secs);
  const buf = audioCtx.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for(let i = 0; i < N; i++) d[i] = (Math.random() * 2 - 1) * 0.92;
  // soften the pluck: bass darker, treble brighter
  const passes = midi < 45 ? 3 : (midi < 72 ? 2 : 1);
  const b = 0.42;
  for(let p = 0; p < passes; p++){
    for(let i = 1; i < N; i++) d[i] = d[i] * (1 - b) + d[i - 1] * b;
  }
  let prev = d[N - 1];
  for(let i = N; i < len; i++){
    const cur = d[i - N];
    const next = (i - N + 1 < len) ? d[i - N + 1] : 0;
    const decay = 0.9965 - Math.min(0.004, (midi - 21) / 87 * 0.0035);
    d[i] = (cur + next) * 0.5 * decay;
    prev = d[i];
  }
  // normalize
  let peak = 0;
  for(let i = 0; i < len; i++){ const a = Math.abs(d[i]); if(a > peak) peak = a; }
  if(peak > 0.001){ const g = 0.88 / peak; for(let i = 0; i < len; i++) d[i] *= g; }
  ksCache[midi] = buf;
  return buf;
}
function playKS(midi, velocity){
  if(!audioCtx) return;
  const src = audioCtx.createBufferSource();
  src.buffer = getKSBuffer(midi);
  const g = audioCtx.createGain();
  g.gain.value = velocity * velocity * 0.9;
  src.connect(g);
  g.connect(masterGain);
  g.connect(convolver);
  src.start();
}

// 10. NOTE TRIGGERING + SIMULATION (deterministic fixed-step)
// ============================================================
let audioMuted = false;   // true during seek(); false for live play & recording
function strikeNote(midi, velocity, durBeats, whenBeat){
  const t0 = animTime;
  const freq = midiToFreq(midi);
  const rec = { midi: midi, t0: t0, vel: velocity, durSec: (durBeats * 60) / tempo, tEnd: t0 + (durBeats * 60) / tempo, freq: freq };
  struck.push(rec);
  notesPlayed++;
  if(!audioMuted){ ensureAudio(); playKS(midi, velocity); }
  return rec;
}
function triggerEvent(e){
  const vel = 0.62 + ((e.t * 7919) % 1) * 0.3;
  e.notes.forEach(m => strikeNote(m, vel, Math.max(0.22, e.dur * 0.92), e.t));
}
function resetSimulation(){
  animTime = 0; songBeats = 0; songTime = 0; triggerIdx = 0;
  struck = [];
  notesPlayed = 0;
  for(const m in keys){
    const k = keys[m];
    k.press = 0;
    k.keyPivot.rotation.x = 0;
    k.hammerPivot.rotation.x = k.restHammer;
    k.damperPivot.rotation.x = 0;
    k.strings.forEach(s=>{ s.mesh.position.x = s.baseX; });
  }
  pedalPos = 0;
  rollTex.offset.x = -0.13;
  spools.forEach(s => s.rotation.y = 0);
  updateBench();
}
let pedalPos = 0;
function pedalTargetAt(beats){
  for(let i = 0; i < PEDAL_WINDOWS.length; i++){
    if(beats >= PEDAL_WINDOWS[i][0] && beats <= PEDAL_WINDOWS[i][1]) return 1;
  }
  return 0;
}
const SONG_END_TAIL = 2.0;             // beats of ring-out after last note
const SHOWCASE_DURATION = 12.0;

function stepSimulation(dt){
  animTime += dt;
  if(isPlaying){
    songBeats += dt * tempo / 60;
    songTime += dt;
    while(triggerIdx < SONG.length && SONG[triggerIdx].t <= songBeats){
      triggerEvent(SONG[triggerIdx]);
      triggerIdx++;
    }
    if(songBeats > TOTAL_BEATS + SONG_END_TAIL){ isPlaying = false; }
  }
  // sustain pedal easing
  const pTarget = isPlaying || songBeats < TOTAL_BEATS ? pedalTargetAt(songBeats) : 0;
  const rate = 3.2 * dt;
  pedalPos += (pTarget - pedalPos) * Math.min(1, rate * 3.2);
  sustainPedal.rotation.x = 0.10 + pedalPos * 0.16;
  // per-key animation
  let active = 0;
  for(const m in keys){
    const k = keys[m];
    let press = 0, hammerAng = 0, damp = pedalPos * 0.92, strAmp = 0, strPhase = 0, strFreqVis = 0;
    for(let i = 0; i < struck.length; i++){
      const r = struck[i];
      if(r.midi !== k.midi) continue;
      const tA = animTime - r.t0;
      if(tA < 0) continue;
      // key press envelope: fast attack, hold, smooth release after note end
      const atk = Math.min(1, tA / 0.085);
      let e = 1 - Math.pow(1 - atk, 3);
      const relStart = r.tEnd;
      if(animTime > relStart){
        const re = Math.min(1, (animTime - relStart) / 0.24);
        e *= 1 - (re * re * (3 - 2 * re));
      }
      press = Math.max(press, e);
      damp = Math.max(damp, e * 0.96);
      // hammer: throw + damped oscillation
      const A = 0.075;
      if(tA < A){
        const p = tA / A;
        hammerAng = Math.max(hammerAng, 1 - Math.pow(1 - p, 3));
      } else {
        const rb = tA - A;
        hammerAng = Math.max(hammerAng, Math.exp(-rb * 5.0) * Math.cos(rb * 17.5));
      }
      // string vibration
      const ringK = (animTime > r.tEnd) ? 10.5 : 2.1 + (1 - r.vel) * 1.4;
      const ampMax = 0.0048 * Math.pow(0.985, r.midi - 21);
      const amp = ampMax * Math.exp(-Math.max(0, tA) * ringK) * (pedalPos > 0.05 && animTime > r.tEnd ? 1.6 : 1.0);
      if(amp > strAmp){ strAmp = amp; strPhase = tA; strFreqVis = 26 + (r.midi - 21) * 1.35; }
    }
    k.press = press;
    if(press > 0.04) active++;
    k.keyPivot.rotation.x = press * 0.075;
    k.damperPivot.rotation.x = -damp * 0.30;
    k.hammerPivot.rotation.x = k.restHammer - hammerAng * 0.60;
    // strings
    if(strAmp > 0.0006){
      const off = Math.sin(strPhase * strFreqVis * Math.PI * 2) * strAmp;
      for(let i = 0; i < k.strings.length; i++) k.strings[i].mesh.position.x = k.strings[i].baseX + off;
    } else {
      for(let i = 0; i < k.strings.length; i++) k.strings[i].mesh.position.x = k.strings[i].baseX;
    }
  }
  // drop finished records
  for(let i = struck.length - 1; i >= 0; i--){
    if(animTime - struck[i].tEnd > 1.6) struck.splice(i, 1);
  }
  __bench.activeKeys = active;
  // roll scroll — hole longitudes were drawn as u = 0.02 + 0.81 * (beat/TOTAL)
  const u = 0.02 + 0.81 * Math.min(1, songBeats / TOTAL_BEATS);
  rollTex.offset.x = u - ROLL_REPEAT - 0.0;
  const spoolRot = (u / ROLL_REPEAT) * 2.2;
  spools[0].rotation.y = spoolRot;
  spools[1].rotation.y = spoolRot;
  // fire flicker (deterministic — driven by animTime)
  fireLight.intensity = 1.15 + 0.34 * Math.sin(animTime * 13.0) + 0.19 * Math.sin(animTime * 29.0 + 1.7) + 0.11 * Math.sin(animTime * 47.0 + 0.4);
  flameUniforms.uTime.value = animTime;
  lampLight.intensity = 1.5 + 0.05 * Math.sin(animTime * 7.3 + 0.8) + 0.03 * Math.sin(animTime * 17.7);
  return active;
}
function updateBench(){
  __bench.notesPlayed = notesPlayed;
  __bench.tempo = tempo;
  __bench.rollPosition = songBeats;
}

];
const posCurve = new THREE.CatmullRomCurve3(showcaseKeys.map(k => new THREE.Vector3(k.pos[0], k.pos[1], k.pos[2])), false, 'centripetal', 0.5);
const lookCurve = new THREE.CatmullRomCurve3(showcaseKeys.map(k => new THREE.Vector3(k.look[0], k.look[1], k.look[2])), false, 'centripetal', 0.5);
let showcaseActive = false;
const _sp = new THREE.Vector3(), _sl = new THREE.Vector3();
function placeShowcaseCamera(t){
  const u = Math.min(1, Math.max(0, t / SHOWCASE_DURATION));
  posCurve.getPoint(u, _sp);
  lookCurve.getPoint(u, _sl);
  camera.position.copy(_sp);
  camera.lookAt(_sl);
}
function renderFrame(){ composer.render(); }
function seek(t){
  t = Math.min(SHOWCASE_DURATION, Math.max(0, t));
  showcaseActive = true;
  audioMuted = true;
  controls.enabled = false;
  const wasPlaying = isPlaying;
  resetSimulation();
  isPlaying = true;                 // simulation runs; seek is silent
  let acc = 0;
  while(acc < t){
    const step = Math.min(FIXED_DT, t - acc);
    stepSimulation(step);
    acc += step;
  }
  isPlaying = wasPlaying ? false : false;  // showcase holds its end state
  placeShowcaseCamera(t);
  updateBench();
  renderFrame();
}

  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

resetSimulation();
isPlaying = true;
playBtn.textContent = '❚❚ Pause';
animate();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0. UTILITIES — seeded RNG (everything deterministic)
   ============================================================ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const smooth= t => t*t*(3-2*t);

/* ============================================================
   1. RENDERER / SCENE / CAMERA / CONTROLS
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070604);
scene.fog = new THREE.Fog(0x0a0806, 10.5, 19);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.05, 60);
const CAM_HOME = new THREE.Vector3(2.55, 1.74, 2.95);
const TGT_HOME = new THREE.Vector3(0, 1.00, -1.52);
camera.position.copy(CAM_HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT_HOME);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.9;
controls.maxDistance = 8.5;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* bloom — the lamp, candles, fire and roll holes all glow */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.72, 0.78);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   2. LIGHTS — warm Victorian evening
   ============================================================ */
scene.add(new THREE.AmbientLight(0x55483c, 0.62));
const hemi = new THREE.HemisphereLight(0x2c3242, 0x1c130c, 0.5);
scene.add(hemi);

const keySpot = new THREE.SpotLight(0xffd9a6, 300, 12, 0.62, 1.0, 2.0);
keySpot.position.set(1.6, 3.35, 1.7);
keySpot.target.position.set(0, 0.85, -1.6);
keySpot.castShadow = true;
keySpot.shadow.mapSize.set(4096, 4096);
keySpot.shadow.bias = -0.0004;
keySpot.shadow.normalBias = 0.02;
keySpot.shadow.camera.near = 1; keySpot.shadow.camera.far = 10;
scene.add(keySpot, keySpot.target);

const lampLight = new THREE.PointLight(0xffb45e, 36, 8, 2.0);
lampLight.position.set(2.35, 1.30, -1.88);
scene.add(lampLight);

const fireLight = new THREE.PointLight(0xff8a33, 22, 5.5, 2.0);
fireLight.position.set(-2.85, 0.42, -2.02);
scene.add(fireLight);

const chandelierLight = new THREE.PointLight(0xffc27a, 30, 10, 2.0);
chandelierLight.position.set(0, 2.32, -0.5);
scene.add(chandelierLight);

const moonLight = new THREE.DirectionalLight(0x8fa5cc, 0.85);
moonLight.position.set(6, 3.4, -0.1);
moonLight.target.position.set(-1, 0.9, -1.7);
scene.add(moonLight, moonLight.target);

const trackerGlow = new THREE.PointLight(0xffc06a, 4.5, 1.6, 2.0);
trackerGlow.position.set(0, 1.21, -1.28);
scene.add(trackerGlow);

/* ============================================================
   3. PROCEDURAL CANVAS TEXTURES
   ============================================================ */
function makeCanvas(w,h,fn){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
/* --- rich mahogany --- */
const woodTex = makeCanvas(512,512,(g,w,h)=>{
  const r = mulberry32(101);
  g.fillStyle='#462218'; g.fillRect(0,0,w,h);
  for(let i=0;i<130;i++){
    const x0=r()*w, dark=r()<0.62;
    g.strokeStyle = dark?`rgba(30,12,6,${0.18+r()*0.3})`:`rgba(122,66,38,${0.14+r()*0.22})`;
    g.lineWidth = 1+r()*5.5; g.beginPath(); g.moveTo(x0,0);
    g.bezierCurveTo(x0+(r()-0.5)*70, h*0.33, x0+(r()-0.5)*70, h*0.66, x0+(r()-0.5)*46, h);
    g.stroke();
  }
  for(let i=0;i<900;i++){ g.fillStyle=`rgba(0,0,0,${r()*0.09})`; g.fillRect(r()*w, r()*h, 1.5, 1.5+r()*9); }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;

const darkWoodTex = makeCanvas(256,256,(g,w,h)=>{
  const r = mulberry32(202);
  g.fillStyle='#2b150c'; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){ g.strokeStyle=`rgba(12,5,2,${0.3+r()*0.4})`; g.lineWidth=1+r()*3;
    const x0=r()*w; g.beginPath(); g.moveTo(x0,0); g.bezierCurveTo(x0+(r()-0.5)*40,h/3,x0+(r()-0.5)*40,2*h/3,x0+(r()-0.5)*24,h); g.stroke(); }
});
darkWoodTex.wrapS = darkWoodTex.wrapT = THREE.RepeatWrapping;

/* --- spruce soundboard --- */
const spruceTex = makeCanvas(512,512,(g,w,h)=>{
  const r = mulberry32(303);
  g.fillStyle='#b8894e'; g.fillRect(0,0,w,h);
  for(let i=0;i<110;i++){
    g.strokeStyle=`rgba(84,52,20,${0.12+r()*0.2})`; g.lineWidth=1+r()*2.4;
    const y0=r()*h; g.beginPath(); g.moveTo(0,y0);
    g.bezierCurveTo(w*0.3, y0+(r()-0.5)*22, w*0.7, y0+(r()-0.5)*22, w, y0+(r()-0.5)*12); g.stroke();
  }
  const grad = g.createRadialGradient(w/2,h/2,40,w/2,h/2,320);
  grad.addColorStop(0,'rgba(255,235,180,0.22)'); grad.addColorStop(1,'rgba(60,35,10,0.30)');
  g.fillStyle=grad; g.fillRect(0,0,w,h);
});

/* --- floor planks --- */
const floorTex = makeCanvas(1024,1024,(g,w,h)=>{
  const r = mulberry32(404);
  g.fillStyle='#241408'; g.fillRect(0,0,w,h);
  const rows=8, rh=h/rows;
  for(let row=0; row<rows; row++){
    let x = -r()*300;
    while(x < w){
      const pw = 180+r()*260;
      const tone = 15+r()*11;
      g.fillStyle = `hsl(${22+r()*9},${34+r()*14}%,${tone}%)`;
      g.fillRect(x, row*rh+2, pw-4, rh-4);
      for(let i=0;i<26;i++){
        g.strokeStyle=`rgba(15,7,3,${0.14+r()*0.25})`; g.lineWidth=1+r()*1.6;
        const y=row*rh+4+r()*(rh-8);
        g.beginPath(); g.moveTo(x+6,y); g.bezierCurveTo(x+pw*0.3,y+(r()-0.5)*8,x+pw*0.7,y+(r()-0.5)*8,x+pw-8,y+(r()-0.5)*5); g.stroke();
      }
      g.fillStyle='#0e0703'; g.fillRect(x+pw-5, row*rh, 5, rh);
      x += pw;
    }
    g.fillStyle='#0e0703'; g.fillRect(0, row*rh, w, 3);
  }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(3,2.4);

/* --- Victorian wallpaper (deep green + gold diamond trellis) --- */
const wallTex = makeCanvas(256,256,(g,w,h)=>{
  const r = mulberry32(505);
  g.fillStyle='#25332a'; g.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){ g.fillStyle=`rgba(0,0,0,${r()*0.16})`; g.fillRect(r()*w,r()*h,2,2); }
  g.strokeStyle='rgba(197,162,92,0.42)'; g.lineWidth=2;
  const s=64;
  for(let y=-s;y<h+s;y+=s){
    for(let x=-s;x<w+s;x+=s){
      g.beginPath(); g.moveTo(x+s/2,y); g.lineTo(x+s,y+s/2); g.lineTo(x+s/2,y+s); g.lineTo(x,y+s/2); g.closePath(); g.stroke();
    }
  }
  g.fillStyle='rgba(212,178,102,0.55)';
  for(let y=0;y<=h;y+=s){
    for(let x=0;x<=w;x+=s){
      g.save(); g.translate(x,y);
      g.beginPath(); g.moveTo(0,-9); g.lineTo(7,0); g.lineTo(0,9); g.lineTo(-7,0); g.closePath(); g.fill();
      g.beginPath(); g.arc(0,0,2.2,0,Math.PI*2); g.fillStyle='#efe0b0'; g.fill();
      g.restore(); g.fillStyle='rgba(212,178,102,0.55)';
    }
  }
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(7,2.4);

/* --- wainscot panels --- */
const wainscotTex = makeCanvas(512,256,(g,w,h)=>{
  g.fillStyle='#33200f'; g.fillRect(0,0,w,h);
  const panels=4, pw=w/panels;
  for(let i=0;i<panels;i++){
    const x=i*pw;
    g.fillStyle='#402917592'; g.fillRect(x,0,4,h);
    g.fillStyle='#241408'; g.fillRect(x+14,18,pw-28,h-36);
    g.fillStyle='#4a2f1a'; g.fillRect(x+22,26,pw-44,h-52);
    g.fillStyle='#553722'; g.fillRect(x+30,34,pw-60,h-68);
    g.strokeStyle='#5f4126'; g.lineWidth=3; g.strokeRect(x+22,26,pw-44,h-52);
  }
});
wainscotTex.wrapS = wainscotTex.wrapT = THREE.RepeatWrapping;
wainscotTex.repeat.set(6,1);

/* --- the rug — crimson & gold medallion --- */
const rugTex = makeCanvas(1024,640,(g,w,h)=>{
  const r = mulberry32(606);
  g.fillStyle='#571c19'; g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){ g.fillStyle=`rgba(${r()<0.5?0:255},${r()<0.5?0:220},180,${r()*0.05})`; g.fillRect(r()*w,r()*h,2,2); }
  g.strokeStyle='#c9a961'; g.lineWidth=16; g.strokeRect(18,18,w-36,h-36);
  g.strokeStyle='#2e1c08'; g.lineWidth=5;  g.strokeRect(40,40,w-80,h-80);
  g.strokeStyle='#e2c078'; g.lineWidth=3;  g.strokeRect(52,52,w-104,h-104);
  /* border motif */
  g.fillStyle='#c9a961';
  for(let x=70;x<w-60;x+=52){ diamond(g,x,29,7); diamond(g,x,h-29,7); }
  for(let y=70;y<h-60;y+=52){ diamond(g,29,y,7); diamond(g,w-29,y,7); }
  /* central medallion */
  const cx=w/2, cy=h/2;
  const rings=[[150,'#c9a961',10],[120,'#8a2b23',26],[86,'#c9a961',6],[56,'#1f4a44',20],[26,'#c9a961',8]];
  for(const [rad,col,lw] of rings){ g.strokeStyle=col; g.lineWidth=lw; g.beginPath(); g.ellipse(cx,cy,rad,rad*0.62,0,0,Math.PI*2); g.stroke(); }
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2;
    g.save(); g.translate(cx+Math.cos(a)*104, cy+Math.sin(a)*64); g.rotate(a);
    g.fillStyle = i%2 ? '#c9a961' : '#1f4a44';
    g.beginPath(); g.ellipse(0,0,15,8,0,0,Math.PI*2); g.fill(); g.restore();
  }
  diamond(g,cx,cy,16,'#e2c078');
  /* corner fans */
  for(const [fx,fy,rot] of [[64,64,0],[w-64,64,Math.PI/2],[w-64,h-64,Math.PI],[64,h-64,-Math.PI/2]]){
    g.save(); g.translate(fx,fy); g.rotate(rot);
    for(let i=0;i<5;i++){ g.strokeStyle=i%2?'#c9a961':'#1f4a44'; g.lineWidth=6;
      g.beginPath(); g.moveTo(0,0); g.arc(0,0,26+i*15, 0.15, Math.PI/2-0.15); g.stroke(); }
    g.restore();
  }
  function diamond(g2,x,y,s,col){ if(col)g2.fillStyle=col;
    g2.beginPath(); g2.moveTo(x,y-s); g2.lineTo(x+s*0.7,y); g2.lineTo(x,y+s); g2.lineTo(x-s*0.7,y); g2.closePath(); g2.fill(); }
});

/* --- maker's name board --- */
const makerTex = makeCanvas(512,128,(g,w,h)=>{
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#241a10'); grad.addColorStop(0.5,'#120c07'); grad.addColorStop(1,'#241a10');
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  g.strokeStyle='#c9a961'; g.lineWidth=5; g.strokeRect(10,10,w-20,h-20);
  g.strokeStyle='rgba(201,169,97,.5)'; g.lineWidth=1.5; g.strokeRect(18,18,w-36,h-36);
  const tg=g.createLinearGradient(0,34,0,86);
  tg.addColorStop(0,'#f6e096'); tg.addColorStop(0.45,'#d4af5e'); tg.addColorStop(0.75,'#8a6a2a'); tg.addColorStop(1,'#e8cd8a');
  g.fillStyle=tg; g.font='600 46px Georgia,serif'; g.textAlign='center'; g.textBaseline='middle';
  g.save(); try{ g.letterSpacing='14px'; }catch(e){}
  g.fillText('HOFFMANN', w/2, 56); g.restore();
  g.fillStyle='#a8843e'; g.font='italic 12px Georgia'; g.fillText('— E S T .  1 8 9 7 —', w/2, 100);
});

/* --- moody landscape paintings --- */
function painting(seed, skyTop, skyLow){
  return makeCanvas(512,640,(g,w,h)=>{
    const r = mulberry32(seed);
    const sky=g.createLinearGradient(0,0,0,h*0.66);
    sky.addColorStop(0,skyTop); sky.addColorStop(0.75,skyLow); sky.addColorStop(1,'#c98a4a');
    g.fillStyle=sky; g.fillRect(0,0,w,h*0.66);
    const sun=g.createRadialGradient(w*0.62,h*0.52,4,w*0.62,h*0.52,150);
    sun.addColorStop(0,'rgba(255,225,160,0.9)'); sun.addColorStop(1,'rgba(255,225,160,0)');
    g.fillStyle=sun; g.fillRect(0,0,w,h*0.66);
    for(let i=0;i<9;i++){ /* brooding clouds */
      g.fillStyle=`rgba(28,26,34,${0.35+r()*0.35})`;
      const cy=r()*h*0.4, cw=90+r()*190;
      g.beginPath(); g.ellipse(r()*w, cy, cw, 13+r()*17, 0, 0, Math.PI*2); g.fill();
    }
    g.fillStyle='#191512'; /* far ridge */
    g.beginPath(); g.moveTo(0,h*0.58);
    for(let x=0;x<=w;x+=24) g.lineTo(x, h*0.58 - Math.sin(x*0.021+seed)*26 - r()*8);
    g.lineTo(w,h*0.66); g.lineTo(0,h*0.66); g.fill();
    g.fillStyle='#100d0a'; g.fillRect(0,h*0.62,w,h*0.4); /* near ground */
    /* gnarled tree */
    g.strokeStyle='#080604'; g.lineCap='round';
    (function branch(x,y,ang,len,wd){
      if(len<9) return;
      const nx=x+Math.cos(ang)*len, ny=y+Math.sin(ang)*len;
      g.lineWidth=wd; g.beginPath(); g.moveTo(x,y); g.lineTo(nx,ny); g.stroke();
      branch(nx,ny,ang-0.32-r()*0.3, len*0.74, wd*0.66);
      branch(nx,ny,ang+0.30+r()*0.3, len*0.76, wd*0.66);
      if(r()<0.6) branch(nx,ny,ang+(r()-0.5)*0.4, len*0.7, wd*0.6);
    })(w*0.24, h*0.98, -Math.PI/2+0.15, 96, 13);
    /* glaze */
    const vg=g.createRadialGradient(w/2,h/2,h*0.25,w/2,h/2,h*0.72);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
    g.fillStyle=vg; g.fillRect(0,0,w,h);
  });
}
const paintingA = painting(11,'#232030','#5a4632');
const paintingB = painting(23,'#1d2636','#4a3a30');

/* --- night window view --- */
const windowTex = makeCanvas(512,640,(g,w,h)=>{
  const r = mulberry32(707);
  const sky=g.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#060b1e'); sky.addColorStop(0.6,'#131f3a'); sky.addColorStop(0.82,'#332a3c'); sky.addColorStop(1,'#191420');
  g.fillStyle=sky; g.fillRect(0,0,w,h);
  for(let i=0;i<130;i++){ g.fillStyle=`rgba(255,255,255,${0.3+r()*0.7})`; const s=r()<0.12?2:1; g.fillRect(r()*w, r()*h*0.55, s, s); }
  const moon=g.createRadialGradient(w*0.68,h*0.24,4,w*0.68,h*0.24,90);

const ROLL_W = 2048, ROLL_H = 352;
function laneX(midi){ const lane = midi-21; return 30 + (lane+0.5)/88*(ROLL_W-60); }
function holeY(beat){ return 12 + (beat/TOTAL_BEATS)*(ROLL_H-24); }

const rollTexCanvas = document.createElement('canvas'); rollTexCanvas.width=ROLL_W; rollTexCanvas.height=ROLL_H;
{
  const g = rollTexCanvas.getContext('2d');
  const bg = g.createLinearGradient(0,0,0,ROLL_H);
  bg.addColorStop(0,'#e9d9ad'); bg.addColorStop(0.5,'#dcc992'); bg.addColorStop(1,'#cbbc85');
  g.fillStyle=bg; g.fillRect(0,0,ROLL_W,ROLL_H);
  const r = mulberry32(1111);
  for(let i=0;i<240;i++){ g.fillStyle=`rgba(120,88,40,${0.05+r()*0.09})`;
    g.beginPath(); g.ellipse(r()*ROLL_W, r()*ROLL_H, 20+r()*70, 8+r()*26, r()*3, 0, Math.PI*2); g.fill(); }
  /* lane rules */
  g.strokeStyle='rgba(110,80,36,0.34)'; g.lineWidth=1;
  for(let i=0;i<=88;i++){ const x=30+i/88*(ROLL_W-60);
    g.beginPath(); g.moveTo(x,6); g.lineTo(x,ROLL_H-6); g.stroke(); }
  g.strokeStyle='rgba(70,48,18,0.65)'; g.lineWidth=3;
  g.beginPath(); g.moveTo(30,6); g.lineTo(30,ROLL_H-6); g.moveTo(ROLL_W-30,6); g.lineTo(ROLL_W-30,ROLL_H-6); g.stroke();
  /* edge tracker perforations */
  g.fillStyle='#14100a';
  for(let y=13;y<ROLL_H-6;y+=24){ g.beginPath(); g.arc(15,y,4,0,Math.PI*2); g.arc(ROLL_W-15,y,4,0,Math.PI*2); g.fill(); }
  /* THE HOLES — one per note in the tune */
  for(const [beat,midi] of TUNE){
    g.fillStyle='#100c07';
    g.beginPath(); g.ellipse(laneX(midi), holeY(beat), 10.5, 7.2, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle='rgba(255,240,200,0.35)'; g.lineWidth=1.4; g.stroke();
  }
}

/* ============================================================
   9. AUDIO — additive synth, A4 = 440 Hz, inharmonic partials
   ============================================================ */
const midiToFreq = m => 440 * Math.pow(2, (m-69)/12);
let audioCtx = null, masterGain = null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.42;
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 5;
    masterGain.connect(comp); comp.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function synthNote(midi, durSec, vel){
  if(!audioCtx) return;
  const f0 = midiToFreq(midi);
  const sr = audioCtx.sampleRate;
  const dur = Math.min(durSec + 2.0, 4.5);
  const n = Math.floor(sr * dur);
  const buf = audioCtx.createBuffer(1, n, sr);
  const out = buf.getChannelData(0);
  const B = 0.00045; /* piano inharmonicity */
  const partials = [[1,1.0,1.6],[2,0.62,2.4],[3,0.42,3.1],[4,0.30,3.9],[5,0.20,4.8],[6,0.13,5.6],[7,0.09,6.5],[8,0.06,7.3],[9,0.04,8.2],[10,0.025,9.0]];
  for(const [p, amp, decay] of partials){
    const fp = p * f0 * Math.sqrt(1 + B*p*p);
    const a = amp * vel * Math.exp(-decay * 0.32);
    const w = 2*Math.PI*fp/sr;
    const d = Math.exp(-decay/ (dur*0.9) * 1.15);
    let phase = 0;
    const norm = 1;
    for(let i=0;i<n;i++){
      out[i] += a * Math.sin(phase) * Math.pow(d, i/n* n/sr * (1/dur) * dur + i/sr * 0 ) * Math.exp(-decay*i/sr/dur*1.9);
      phase += w;
    }
  }
  /* gentle low-pass body */
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value = Math.min(12000, 1200 + f0*6); lp.Q.value = 0.4;
  const g = audioCtx.createGain();
  const t = audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.9, t + 0.008);
  g.gain.setTargetAtTime(0.0, t + durSec*0.72, 0.42);
  src.connect(lp); lp.connect(g); g.connect(masterGain);
  src.start();
}

/* ============================================================
   10. SIMULATION STATE — deterministic, stepped
   ============================================================ */
const DEFAULT_TEMPO = 116, SHOW_TEMPO = 168, SHOW_DURATION = 12.0;
const state = {
  simTime: 0, beat: 0, nextEvent: 0,
  tunePlaying: true, tempo: DEFAULT_TEMPO,
  notesPlayed: 0, pedalV: 0, inShowcase: false
};
const sounding = [];       /* {midi, start, end} */
const recentStrikes = [];  /* {midi, t0}          */

const window_bench = { notesPlayed:0, activeKeys:[], tempo:DEFAULT_TEMPO, rollPosition:0 };
window.__bench = window_bench;

function effectiveTempo(){ return state.inShowcase ? SHOW_TEMPO : state.tempo; }

function resetSimulation(){
  state.simTime = 0; state.beat = 0; state.nextEvent = 0;
  state.notesPlayed = 0; state.pedalV = 0;
  keyHoldUntil.fill(-1); keyPress.fill(0); dampState.fill(0);
  sounding.length = 0; recentStrikes.length = 0;
  for(let m=21;m<=108;m++){
    if(keyGroups[m]){ keyGroups[m].position.y = 0; keyGroups[m].rotation.x = 0;
      hammerPivots[m].rotation.x = hammerRest;
      damperGroups[m].position.set(keyX[m]*0.92, 1.088, 0.055); }
  }
  for(const v of vibLines){ v.line.visible = false; v.line.material.opacity = 0; }
  rollMap.offset.y = rollEmissive.offset.y = 0.80;
}

function noteOn(midi, durSec, vel){
  const t = state.simTime;
  keyHoldUntil[midi] = t + durSec + 0.16;
  sounding.push({ midi, start:t, end:t + durSec });
  recentStrikes.push({ midi, t0:t });
  state.notesPlayed++;
  if(audioCtx && !state.inShowcase) synthNote(midi, durSec, vel);
}

function pedalOnAt(beat){
  for(const [a,b] of PEDAL_SEGMENTS) if(beat >= a && beat <= b) return true;
  return false;
}

function stepSimulation(dt, advanceTune){
  state.simTime += dt;
  const tempo = effectiveTempo();
  const secPerBeat = 60/tempo;

  if(advanceTune){
    state.beat += dt * tempo/60;
    while(state.nextEvent < TUNE.length && TUNE[state.nextEvent][0] <= state.beat){
      const [b, midi, durB] = TUNE[state.nextEvent];
      noteOn(midi, durB*secPerBeat, 0.82 + ((state.nextEvent*37)%13)/40);
      state.nextEvent++;
    }
  }
  /* keys ease toward targets */
  const kpRateUp = 13, kpRateDown = 8;
  for(let m=21;m<=108;m++){
    const target = state.simTime < keyHoldUntil[m] ? 1 : 0;
    const cur = keyPress[m];
    keyPress[m] = target > cur ? Math.min(target, cur + kpRateUp*dt)
                               : Math.max(target, cur - kpRateDown*dt);
  }
  /* sustain pedal eases toward segment target */
  const pedalTarget = advanceTune && pedalOnAt(state.beat) ? 1 : 0;
  state.pedalV += clamp(pedalTarget - state.pedalV, -3.2*dt, 3.2*dt);
  /* dampers follow max(key, pedal) */
  for(let m=21;m<=108;m++){
    const lift = Math.max(keyPress[m], state.pedalV);
    dampState[m] += clamp(lift - dampState[m], -9*dt, 9*dt);
  }
  /* prune finished notes / strikes */
  for(let i=sounding.length-1;i>=0;i--){
    const s = sounding[i];
    if(state.simTime > s.end + (state.pedalV > 0.5 ? 2.6 : 0.15)) sounding.splice(i,1);
  }
  for(let i=recentStrikes.length-1;i>=0;i--){
    if(state.simTime - recentStrikes[i].t0 > 1.15) recentStrikes.splice(i,1);
  }
}

/* ============================================================
   11. VISUAL UPDATE — keys, hammers, dampers, strings, roll
   ============================================================ */
const _v3 = new THREE.Vector3();

function updateVisuals(){
  const t = state.simTime;

  /* keys */
  for(let m=21;m<=108;m++){
    const p = keyPress[m];
    const g = keyGroups[m];
    g.position.y = -0.0075 * p;
    g.rotation.x = 0.030 * p;
  }
  /* hammers — swing profile per recent strike */
  const hammerAngle = new Float32Array(109).fill(hammerRest);
  for(const s of recentStrikes){
    const dt = t - s.t0;
    let swing;
    if(dt < 0) swing = 0;
    else if(dt < 0.085){ const u = dt/0.085; swing = Math.pow(u, 1.7); }
    else if(dt < 0.34){ const u = (dt-0.085)/0.255; swing = 1 - smooth(u)*0.92;
      swing += Math.sin((dt-0.085)*34)*0.055*Math.exp(-(dt-0.085)*9); }
    else swing = 0.08 * Math.exp(-(dt-0.34)*5);
    const ang = hammerRest - clamp(swing,0,1.06) * (hammerRest - hammerStrike);
    if(ang < hammerAngle[s.midi]) hammerAngle[s.midi] = ang;
  }
  for(let m=21;m<=108;m++) hammerPivots[m].rotation.x = hammerAngle[m];

  /* dampers */
  for(let m=21;m<=108;m++){
    const d = dampState[m];
    damperGroups[m].position.set(keyX[m]*0.92, 1.088 + 0.012*d, 0.055 + 0.030*d);
  }

  /* sustain pedal mesh */
  pedalPivot.rotation.x = 0.135 * state.pedalV;

  /* roll scroll — visible window of full canvas */
  const progress = clamp(state.beat / TOTAL_BEATS, 0, 1);
  rollMap.offset.y      = 0.80 * (1 - progress);
  rollEmissive.offset.y = 0.80 * (1 - progress);
  topSpool.rotation.x  = progress * Math.PI * 7;
  botRoller.rotation.x = progress * Math.PI * 11;

  /* string vibration — standing-wave ghost lines */
  for(const s of stringMeshes){ /* decay ghost visibility by nearest sounding note */ }
  for(const v of vibLines){
    let bestAmp = 0, bestAge = 0, bestDur = 1;
    for(const s of sounding){
      if(s.midi !== v.midi) continue;
      const age = t - s.start;
      let amp;
      if(t <= s.end) amp = 0.0042 * Math.exp(-2.1*age) * Math.min(1, age*30+0.12);
      else if(state.pedalV > 0.5) amp = 0.0042 * Math.exp(-2.1*(s.end-s.start)) * Math.exp(-0.85*(t-s.end));
      else amp = 0;
      if(amp > bestAmp){ bestAmp = amp; bestAge = age; }
    }
    if(bestAmp > 0.00035){
      v.line.visible = true;
      v.line.material.opacity = clamp(bestAmp/0.0042, 0, 1) * 0.9;
      const pos = v.pos, SEG = v.SEG;
      const detune = (v.x*997) % 1;
      for(let i=0;i<=SEG;i++){
        const u = i/SEG;
        const env = Math.sin(Math.PI*u);
        const w1 = Math.sin(2*Math.PI*(5.5*bestAge*3 + detune) + u*Math.PI*3.2);
        const d  = bestAmp * env * (0.75*Math.sin(Math.PI*u + w1*0.6) + 0.3*Math.sin(2*Math.PI*u + w1));
        pos[i*3]   = v.x + d;
        pos[i*3+1] = STRING_Y0 + u*STRING_H;
        pos[i*3+2] = v.z + d*0.35;
      }
      v.geo.attributes.position.needsUpdate = true;
    } else {
      v.line.visible = false;
    }
  }

  /* metronome pendulum — locked to tempo */
  pendulum.rotation.z = 0.42 * Math.sin(Math.PI * effectiveTempo()/60 * t);

  /* fire & candle flicker — pure functions of simTime (deterministic) */
  const fl = Math.sin(t*11.3)*0.5 + Math.sin(t*23.7+1.7)*0.3 + Math.sin(t*5.1+0.6)*0.2;
  fireLight.intensity = 21 + fl*6.5;
  fire.material.opacity = 0.9 + fl*0.1;
  chandelierLight.intensity = 28 + Math.sin(t*9.1+2.0)*2.4 + Math.sin(t*17.7)*1.4;
  lampLight.intensity = 35 + Math.sin(t*6.3+0.8)*1.1;
  for(let i=0;i<flames.length;i++) flames[i].scale.setScalar(1 + 0.16*Math.sin(t*13+i*2.4) + 0.08*Math.sin(t*29+i));
  for(let i=0;i<chandFlames.length;i++) chandFlames[i].scale.setScalar(1 + 0.18*Math.sin(t*12+i*1.9+3) + 0.09*Math.sin(t*27+i*0.7));

  /* dust motes drifting through lamplight */
  for(let i=0;i<DUST;i++){
    dustPos[i*3]   = dustBase[i*3]   + Math.sin(t*0.32 + i*1.7)*0.055;
    dustPos[i*3+1] = dustBase[i*3+1] + Math.sin(t*0.21 + i*2.3)*0.075 - (t*0.008 % 0.4);
    dustPos[i*3+2] = dustBase[i*3+2] + Math.cos(t*0.27 + i*1.1)*0.055;
  }
  dustGeo.attributes.position.needsUpdate = true;

  /* bench feed */
  window_bench.notesPlayed = state.notesPlayed;
  const act = [];
  for(let m=21;m<=108;m++) if(keyPress[m] > 0.08) act.push(m);
  window_bench.activeKeys = act;
  window_bench.tempo = state.tempo;
  window_bench.rollPosition = clamp(state.beat / TOTAL_BEATS, 0, 1);
}

/* ============================================================
   12. SHOWCASE — deterministic 12 s camera & simulation
   ============================================================ */
const SHOW_CAMS = [
  { t:0.0,  p:[ 3.55, 2.15,  3.65], l:[ 0.0, 1.02, -1.60] },
  { t:2.0,  p:[ 1.62, 1.42,  1.55], l:[ 0.0, 0.94, -1.35] },
  { t:4.1,  p:[ 0.72, 0.94,  0.30], l:[ 0.05, 0.80, -0.95] },
  { t:6.1,  p:[-0.62, 1.13,  0.10], l:[-0.10, 1.00, -1.70] },
  { t:8.1,  p:[ 0.30, 1.26,  0.28], l:[ 0.0, 1.24, -1.70] },
  { t:10.1, p:[-1.85, 1.55,  1.05], l:[ 0.1, 0.95, -1.65] },
  { t:12.0, p:[ 2.75, 1.90,  3.35], l:[ 0.0, 1.04, -1.55] }
];
function showcaseCamAt(t){
  let a = SHOW_CAMS[0], b = SHOW_CAMS[SHOW_CAMS.length-1];
  for(let i=0;i<SHOW_CAMS.length-1;i++){
    if(t >= SHOW_CAMS[i].t && t <= SHOW_CAMS[i+1].t){ a = SHOW_CAMS[i]; b = SHOW_CAMS[i+1]; break; }
  }
  const span = Math.max(0.0001, b.t - a.t);
  const u = smooth(clamp((t - a.t)/span, 0, 1));
  camera.position.set(lerp(a.p[0],b.p[0],u), lerp(a.p[1],b.p[1],u), lerp(a.p[2],b.p[2],u));
  _v3.set(lerp(a.l[0],b.l[0],u), lerp(a.l[1],b.l[1],u), lerp(a.l[2],b.l[2],u));
  camera.lookAt(_v3);
}

function seekShowcase(t){
  t = clamp(t, 0, SHOW_DURATION);
  const savedInShowcase = state.inShowcase;
  resetSimulation();
  state.inShowcase = true;
  state.tunePlaying = true;
  const DT = 1/240;
  let acc = 0;
  while(acc < t - 1e-9){
    const step = Math.min(DT, t - acc);
    stepSimulation(step, true);
    acc += step;
  }
  updateVisuals();
  showcaseCamAt(t);
  composer.render();
  /* restore interactive baseline; the frame above is what seek presents */
  resetSimulation();
  state.inShowcase = savedInShowcase;
  state.tunePlaying = true;
  camera.position.copy(CAM_HOME); controls.target.copy(TGT_HOME); controls.update();
  updateVisuals();
}
window.showcase = { duration: SHOW_DURATION, seek: seekShowcase };

/* ============================================================
   13. RECORD VIDEO — captureStream + MediaRecorder → .webm
   ============================================================ */
const recordBtn = document.getElementById('recordBtn');
let isRecording = false, recorder = null, recStart = 0;
function startRecording(){
  if(isRecording) return;
  ensureAudio();
  const stream = renderer.domElement.captureStream(60);
  const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
    .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond: 16_000_000 });
  recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type:'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hoffmann-upright-showcase.webm';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    recordBtn.classList.remove('busy'); recordBtn.textContent = 'Record Video';
  };
  recorder.start(250);
  isRecording = true; recStart = performance.now();
  recordBtn.classList.add('busy'); recordBtn.textContent = 'RECORDING…';
}
recordBtn.addEventListener('click', startRecording);

/* ============================================================
   14. INPUT — Space / arrows / A–K / click keys / orbit
   ============================================================ */
const KEY_MAP = { a:60, w:61, s:62, e:63, d:64, f:65, t:66, g:67, y:68, h:69, u:70, j:71, k:72 };
const tempoVal = document.getElementById('tempoVal');
const playStateEl = document.getElementById('playState');
const notesVal = document.getElementById('notesVal');

window.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); ensureAudio(); state.tunePlaying = !state.tunePlaying; }
  else if(e.code === 'ArrowUp'){ e.preventDefault(); state.tempo = clamp(state.tempo + 6, 60, 208); }
  else if(e.code === 'ArrowDown'){ e.preventDefault(); state.tempo = clamp(state.tempo - 6, 60, 208); }
  else {
    const m = KEY_MAP[e.key.toLowerCase()];
    if(m !== undefined && !e.repeat){ ensureAudio(); noteOn(m, 2.1, 0.9); }
  }
});

const ray = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if(Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return;
  pointerNDC.set((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
  ray.setFromCamera(pointerNDC, camera);
  const hits = ray.intersectObjects(clickTargets, false);
  if(hits.length){ ensureAudio(); noteOn(hits[0].object.userData.midi, 1.7, 0.95); }
});
renderer.domElement.addEventListener('pointermove', e => {
  pointerNDC.set((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
  ray.setFromCamera(pointerNDC, camera);
  renderer.domElement.style.cursor = ray.intersectObjects(clickTargets, false).length ? 'pointer' : 'grab';
});

/* ============================================================
   15. MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();
resetSimulation();
state.tunePlaying = true;   /* self-playing from the moment the page opens */

function animate(){
  requestAnimationFrame(animate);

  if(isRecording){
    const t = (performance.now() - recStart)/1000;
    seekShowcase(Math.min(t, SHOW_DURATION));
    if(t >= SHOW_DURATION + 0.08 && recorder && recorder.state === 'recording'){
      recorder.stop(); isRecording = false;
    }
  } else {
    const dt = Math.min(clock.getDelta(), 0.05);
    stepSimulation(dt, state.tunePlaying);
    updateVisuals();
    controls.update();
    composer.render();
  }
  /* HUD */
  tempoVal.textContent = state.tempo;
  notesVal.textContent = state.notesPlayed;
  playStateEl.textContent = state.tunePlaying ? 'PLAYING' : 'PAUSED';
  playStateEl.style.color = state.tunePlaying ? '#8fd694' : '#e0a080';
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>

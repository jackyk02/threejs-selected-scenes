<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

/* ============================================================
   THE SELF-PLAYING UPRIGHT — a Victorian parlour player piano
   Everything (models, textures, music, simulation) is generated
   in code. No downloaded assets.
   ============================================================ */

// ---------- deterministic pseudo-random ----------
let _seed = 1234567;
function srand(){ _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function smoothstep(a,b,x){ const t = clamp((x-a)/(b-a), 0, 1); return t*t*(3-2*t); }
function lerp(a,b,t){ return a + (b-a)*t; }

// ============================================================
//  1. MUSIC — Für Elise (Bagatelle No. 25, L. v. Beethoven)
//     Encoded as [beat, midi, durationInBeats]
// ============================================================
const LEAD = [
  [0.0,76,0.45],[0.5,75,0.45],[1.0,76,0.45],[1.5,75,0.45],[2.0,76,0.45],
  [2.5,71,0.45],[3.0,74,0.45],[3.5,72,0.45],[4.0,69,1.6],
  [6.0,60,0.45],[6.5,64,0.45],[7.0,69,0.45],[7.5,71,1.6],
  [9.0,64,0.45],[9.5,68,0.45],[10.0,71,0.45],[10.5,72,1.6],
  [12.0,64,0.45],[12.5,76,0.45],[13.0,75,0.45],[13.5,76,0.45],[14.0,75,0.45],
  [14.5,76,0.45],[15.0,71,0.45],[15.5,74,0.45],[16.0,72,0.45],[16.5,69,1.6],
  [18.0,60,0.45],[18.5,64,0.45],[19.0,69,0.45],[19.5,71,0.45],
  [20.5,64,0.45],[21.0,72,0.45],[21.5,71,0.45],[22.0,69,3.0],
  [26.0,76,0.45],[26.5,75,0.45],[27.0,76,0.45],[27.5,75,0.45],[28.0,76,0.45],
  [28.5,71,0.45],[29.0,74,0.45],[29.5,72,0.45],[30.0,69,1.6],
  [32.0,60,0.45],[32.5,64,0.45],[33.0,69,0.45],[33.5,71,1.6],
  [35.0,64,0.45],[35.5,68,0.45],[36.0,71,0.45],[36.5,72,2.6]
];
const BASS = [ // A minor colour: A2 & E2
  [0,45,1.8],[2,40,1.8],[4,45,1.8],[6,40,1.8],[8,45,1.6],[10,40,1.6],
  [12,45,1.8],[14,40,1.8],[16,45,1.8],[18,40,1.8],[20,45,1.8],[22,45,2.6],
  [26,45,1.8],[28,40,1.8],[30,45,1.8],[32,40,1.8],[34,45,2.6]
];
const CHORDS = [ // Am / E chords voiced in the mid register
  [4,[57,60,64]],[7.5,[52,56,59]],[10.5,[57,60,64]],[16.5,[57,60,64]],
  [19.5,[52,56,59]],[22,[57,60,64]],[30,[57,60,64]],[33.5,[52,56,59]],[36.5,[57,60,64]]
];
function buildNotes(){
  const arr=[];
  LEAD.forEach(([b,m,d])=>arr.push({start:b, midi:m, dur:d, vel:0.92}));
  BASS.forEach(([b,m,d])=>arr.push({start:b, midi:m, dur:d, vel:0.68}));
  CHORDS.forEach(([b,ms])=>ms.forEach(m=>arr.push({start:b, midi:m, dur:1.7, vel:0.6})));
  arr.sort((a,b)=>a.start-b.start || a.midi-b.midi);
  return arr;
}
const NOTES = buildNotes();
const NOTE_COUNT = NOTES.length;                 // ~96 notes, with chords
const SONG_END = 39.2;
const ROLL_SPAN = 42;
const SUSTAIN = [[4,5.6],[7.5,9.1],[10.5,12.1],[16.5,18.1],[19.5,21.0],[22,25.4],[30,31.7],[33.5,35.2],[36.5,40.0]];
const PEDAL_ATK = 0.16, PEDAL_REL = 0.42;
const SHOWCASE_BPM = 96;

function pedalAmountAt(beat){
  let p = 0;
  for(const [s,e] of SUSTAIN){
    p = Math.max(p, smoothstep(s, s+PEDAL_ATK, beat) * (1 - smoothstep(e, e+PEDAL_REL, beat)));
  }
  return p;
}
function keyEnvelope(n, beat){
  const l = beat - n.start;
  if(l < 0) return 0;
  const atk = smoothstep(0, 0.055, l);
  const rel = l > n.dur ? Math.max(0, 1 - (l - n.dur)/0.13) : 1;
  return atk * rel;
}
function hammerEnvelope(n, beat){
  const l = beat - n.start;
  if(l < 0) return 0;
  const up = smoothstep(0, 0.085, l);
  const down = 1 - smoothstep(0.17, 0.72, l);
  return up * down;
}
function stringAmplitude(n, beat, pedal, bpm){
  const l = beat - n.start;
  if(l <= 0) return 0;
  const lSec = l * 60 / bpm;
  let amp = Math.exp(-lSec / 5.4);                 // natural piano decay
  const sustainHold = pedal > 0.4;
  if(l > n.dur && !sustainHold) amp *= Math.exp(-(l - n.dur) * (60 / bpm) * 24);
  if(l > n.dur + 2.6) amp = 0;
  return clamp(amp, 0, 1);
}

// ============================================================
//  2. CANVAS TEXTURE FACTORY
// ============================================================
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function canvasTexture(c, {srgb=true, repeat=null, aniso=8}={}){
  const t = new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso;
  if(repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function woodTexture(base, streak, hi, vertical=true){
  const c = makeCanvas(512,512), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0,0,512,512);
  for(let i=0;i<340;i++){
    const px = srand()*512, w = 0.6+srand()*3.2, a = 0.05+srand()*0.22;
    x.strokeStyle = srand()<0.72 ? streak : hi;
    x.globalAlpha = a; x.lineWidth = w;
    x.beginPath(); x.moveTo(px,-10);
    let cx = px;
    for(let y=0;y<=512;y+=16){ cx += (srand()-0.5)*7; x.lineTo(cx + Math.sin(y*0.02+i)*3, y); }
    x.stroke();
  }
  x.globalAlpha = 1;
  // soft cathedral arcs
  for(let i=0;i<26;i++){
    const px = srand()*512, py = srand()*512;
    x.globalAlpha = 0.05+srand()*0.09; x.strokeStyle = hi; x.lineWidth = 1+srand()*2;
    for(let r=6;r<46;r+=7){ x.beginPath(); x.ellipse(px,py,r*0.55,r,0,0,Math.PI*2); x.stroke(); }
  }
  x.globalAlpha = 1;
  return c;
}
function floorTexture(){
  const c = makeCanvas(1024,1024), x = c.getContext('2d');
  x.fillStyle = '#241509'; x.fillRect(0,0,1024,1024);
  const rowH = 128;
  for(let row=0; row<8; row++){
    let px = -Math.floor(srand()*300);
    const y = row*rowH;
    while(px < 1024){
      const len = 240 + srand()*260;
      const hue = 22+srand()*14, li = 16+srand()*13;
      x.fillStyle = `hsl(${hue},42%,${li}%)`;
      x.fillRect(px+2, y+2, len-4, rowH-4);
      // grain
      for(let g=0; g<44; g++){
        x.strokeStyle = `hsla(${hue},40%,${li+ (srand()<0.5?10:-7)}%,${0.25+srand()*0.4})`;
        x.lineWidth = 0.6+srand()*1.6; const gy = y+6+srand()*(rowH-12);
        x.beginPath(); x.moveTo(px+4, gy);
        x.bezierCurveTo(px+len*0.3, gy+(srand()-0.5)*9, px+len*0.7, gy+(srand()-0.5)*9, px+len-4, gy+(srand()-0.5)*5);
        x.stroke();
      }
      // end joint
      x.fillStyle = 'rgba(8,4,2,0.85)'; x.fillRect(px+len-2, y, 4, rowH);
      px += len;
    }
    x.fillStyle = 'rgba(10,5,2,0.9)'; x.fillRect(0, y, 1024, 3);
  }
  return c;
}
function wallpaperTexture(){
  const c = makeCanvas(256,256), x = c.getContext('2d');
  x.fillStyle = '#333f33'; x.fillRect(0,0,256,256);
  // subtle vertical stripe
  for(let i=0;i<256;i+=64){ x.fillStyle='rgba(0,0,0,0.16)'; x.fillRect(i,0,10,256); x.fillStyle='rgba(255,255,255,0.03)'; x.fillRect(i+10,0,4,256); }
  // damask motif
  const motif = (mx,my,s)=>{
    x.save(); x.translate(mx,my); x.scale(s,s);
    x.strokeStyle = 'rgba(178,150,74,0.55)'; x.fillStyle='rgba(178,150,74,0.4)'; x.lineWidth=2;
    x.beginPath(); x.moveTo(0,-26); x.lineTo(17,0); x.lineTo(0,26); x.lineTo(-17,0); x.closePath(); x.stroke();
    x.beginPath(); x.ellipse(0,0,7,11,0,0,Math.PI*2); x.fill();
    for(const [dx,dy] of [[0,-26],[17,0],[0,26],[-17,0]]){
      x.beginPath(); x.arc(dx,dy,3.2,0,Math.PI*2); x.fill();
    }
    x.restore();
  };
  motif(64,64,0.85); motif(192,64,0.85); motif(0,192,0.85); motif(128,192,0.85); motif(256,192,0.85); motif(128,-0.01,0.85);
  return c;
}
function rugTexture(){
  const c = makeCanvas(1024,672), x = c.getContext('2d');
  x.fillStyle = '#571d1d'; x.fillRect(0,0,1024,672);
  // mottled field
  for(let i=0;i<2600;i++){ x.fillStyle = `rgba(${120+srand()*60|0},${30+srand()*25|0},${25+srand()*20|0},0.16)`;
    x.fillRect(srand()*1024, srand()*672, 2+srand()*5, 2+srand()*5); }
  // borders
  const band=(inset,w,col)=>{ x.strokeStyle=col; x.lineWidth=w; x.strokeRect(inset,inset,1024-inset*2,672-inset*2); };
  band(14,20,'#1d2b4a'); band(34,5,'#c9a13b'); band(52,26,'#2e1a3d'); band(80,6,'#c9a13b'); band(96,3,'#c9a13b');
  // corner motifs
  const corner=(cx,cy)=>{ x.save(); x.translate(cx,cy);
    x.strokeStyle='#c9a13b'; x.lineWidth=3;
    x.beginPath(); x.moveTo(0,-42); x.lineTo(30,0); x.lineTo(0,42); x.lineTo(-30,0); x.closePath(); x.stroke();
    x.beginPath(); x.ellipse(0,0,12,18,0,0,Math.PI*2); x.stroke(); x.restore(); };
  corner(150,150); corner(874,150); corner(150,522); corner(874,522);
  // central medallion
  x.save(); x.translate(512,336);
  for(const [rx,ry,lw] of [[300,168,5],[262,140,2.5],[210,110,10],[150,76,3]]){
    x.strokeStyle = lw>6 ? '#1d2b4a' : '#c9a13b'; x.lineWidth = lw;
    x.beginPath(); x.ellipse(0,0,rx,ry,0,0,Math.PI*2); x.stroke();
  }
  x.fillStyle='#1d2b4a'; x.beginPath(); x.ellipse(0,0,120,62,0,0,Math.PI*2); x.fill();
  x.strokeStyle='#c9a13b'; x.lineWidth=3; x.beginPath(); x.ellipse(0,0,120,62,0,0,Math.PI*2); x.stroke();
  x.beginPath(); x.ellipse(0,0,64,32,0,0,Math.PI*2); x.stroke();
  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2;
    x.beginPath(); x.arc(Math.cos(a)*88, Math.sin(a)*46, 4, 0, Math.PI*2);
    x.fillStyle='#c9a13b'; x.fill(); }
  x.restore();
  return c;
}
function tuftTexture(){
  const c = makeCanvas(512,256), x = c.getContext('2d');
  x.fillStyle = '#3d1f2e'; x.fillRect(0,0,512,256);
  x.strokeStyle='rgba(0,0,0,0.45)'; x.lineWidth=3;
  for(let i=-256;i<512+256;i+=64){
    x.beginPath(); x.moveTo(i,0); x.lineTo(i+256,256); x.stroke();
    x.beginPath(); x.moveTo(i+256,0); x.lineTo(i,256); x.stroke();
  }
  for(let ry=32;ry<256;ry+=64) for(let rx=32 + (ry%128?32:0); rx<512; rx+=64){
    const g=x.createRadialGradient(rx,ry,1,rx,ry,9);
    g.addColorStop(0,'#140a12'); g.addColorStop(0.6,'#5a3040'); g.addColorStop(1,'rgba(90,48,64,0)');
    x.fillStyle=g; x.beginPath(); x.arc(rx,ry,9,0,Math.PI*2); x.fill();
  }
  return c;
}
function bookTexture(){ // open sheet music
  const c = makeCanvas(512,320), x = c.getContext('2d');
  x.fillStyle='#efe6cf'; x.fillRect(0,0,512,320);
  x.fillStyle='#ddd2b6'; x.fillRect(252,0,8,320);
  x.strokeStyle='#2a241c';
  const page=(ox)=>{
    for(let s=0;s<3;s++){ const y0=52+s*92;
      for(let l=0;l<5;l++){ x.lineWidth=1.4; x.beginPath(); x.moveTo(ox+22,y0+l*7); x.lineTo(ox+232,y0+l*7); x.stroke(); }
      // a few note heads
      for(let n=0;n<9;n++){ const nx=ox+30+srand()*190, ny=y0+3+srand()*22;
        x.save(); x.translate(nx,ny); x.rotate(-0.3); x.fillStyle='#241f16';
        x.beginPath(); x.ellipse(0,0,4.4,3.2,0,0,Math.PI*2); x.fill(); x.restore(); }
    }
  };
  page(0); page(256);
  return c;
}
function paintingTexture(kind){
  const c = makeCanvas(512,384), x = c.getContext('2d');
  if(kind==='landscape'){
    const g=x.createLinearGradient(0,0,0,384);
    g.addColorStop(0,'#e8c187'); g.addColorStop(0.45,'#c98a5a'); g.addColorStop(0.72,'#5a4034'); g.addColorStop(1,'#241a14');
    x.fillStyle=g; x.fillRect(0,0,512,384);
    x.fillStyle='#f6e3b0'; x.beginPath(); x.arc(330,205,34,0,Math.PI*2); x.fill();
    x.fillStyle='rgba(246,227,176,0.35)'; x.beginPath(); x.arc(330,205,66,0,Math.PI*2); x.fill();
    x.fillStyle='#241a12';
    x.beginPath(); x.moveTo(0,250); x.quadraticCurveTo(120,190,240,244); x.quadraticCurveTo(330,268,430,232); x.lineTo(512,244); x.lineTo(512,384); x.lineTo(0,384); x.fill();
    x.fillStyle='#161009'; x.fillRect(0,300,512,84);
    for(let i=0;i<40;i++){ x.fillStyle='rgba(255,220,150,0.12)'; x.fillRect(240+srand()*220, 258+srand()*40, 8+srand()*26, 2); }
  } else if(kind==='moonsea'){
    const g=x.createLinearGradient(0,0,0,384);
    g.addColorStop(0,'#0e1a30'); g.addColorStop(0.55,'#27354e'); g.addColorStop(0.78,'#3d4a5e'); g.addColorStop(1,'#0a0e18');
    x.fillStyle=g; x.fillRect(0,0,512,384);
    x.fillStyle='#e8ecf2'; x.beginPath(); x.arc(150,96,30,0,Math.PI*2); x.fill();
    x.fillStyle='rgba(232,236,242,0.25)'; x.beginPath(); x.arc(150,96,58,0,Math.PI*2); x.fill();
    for(let i=0;i<70;i++){ x.fillStyle='rgba(255,255,255,0.8)'; x.fillRect(srand()*512, srand()*190, 1.6,1.6); }
    x.fillStyle='#131b29'; x.beginPath(); x.moveTo(0,268); x.lineTo(512,252); x.lineTo(512,384); x.lineTo(0,384); x.fill();
    x.fillStyle='rgba(220,230,245,0.35)';
    for(let i=0;i<26;i++){ x.fillRect(60+srand()*280, 280+srand()*70, 14+srand()*46, 2); }

{
  let w = 0;

    keyInfo[i] = { x: -KBW/2 + wc*KEY_W, isBlack:true, whiteIndex:-1 };

}

// ---------- THE PLAYER ROLL ----------
const ROLL_W = KBW + 0.12;
const ROLL_RH = 0.235;               // visible window height
const rollCanvas = makeCanvas(1024, 4096);
function drawRollTexture(){
  _seed = 987654321; // stable look
  const x = rollCanvas.getContext('2d');
  const W = 1024, H = 4096;
  const topLeader = 150, bottomTail = 170;
  const yOfBeat = b => topLeader + (b / ROLL_SPAN) * (H - topLeader - bottomTail);
  // paper
  const g = x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#ece0c2'); g.addColorStop(0.5,'#e2d3ae'); g.addColorStop(1,'#d5c49c');
  x.fillStyle = g; x.fillRect(0,0,W,H);
  // paper grain
  for(let i=0;i<2400;i++){ x.fillStyle=`rgba(120,95,55,${srand()*0.12})`; x.fillRect(srand()*W, srand()*H, 1+srand()*2, 4+srand()*26); }
  // faint vertical key guides (every 2 keys)
  const xOfKey = m => ( (keyXOfMidi(m) / ROLL_W) + 0.5 ) * W;
  for(let m=21;m<=108;m+=2){
    x.strokeStyle='rgba(90,70,40,0.22)'; x.lineWidth=1.4;
    x.beginPath(); x.moveTo(xOfKey(m), topLeader-40); x.lineTo(xOfKey(m), H-bottomTail+40); x.stroke();
  }
  // octave guide lines stronger + note names every C
  x.fillStyle='rgba(80,60,32,0.55)'; x.font='600 15px Georgia'; x.textAlign='center';
  for(let m=24;m<=108;m+=12){
    x.strokeStyle='rgba(80,60,32,0.4)'; x.lineWidth=2;
    x.beginPath(); x.moveTo(xOfKey(m)-13, topLeader-44); x.lineTo(xOfKey(m)-13, H-bottomTail+44); x.stroke();
    x.save(); x.translate(xOfKey(m)-24, 46); x.fillText('C'+(m/12-1), 0, 0); x.restore();
  }
  // sprocket holes down both margins
  for(let y=30;y<H-20;y+=56){
    for(const sx of [26, W-26]){
      x.fillStyle='#171009'; x.beginPath(); x.ellipse(sx, y, 7, 9, 0, 0, Math.PI*2); x.fill();
      x.fillStyle='rgba(255,246,220,0.35)'; x.beginPath(); x.ellipse(sx-1.5, y-2, 2.4, 3.4, 0, 0, Math.PI*2); x.fill();
    }
  }
  // punched note holes — same note data, same horizontal alignment as keys
  for(const n of NOTES){
    const px = xOfKey(n.midi), py = yOfBeat(n.start);
    x.save(); x.translate(px, py);
    x.fillStyle = '#14100b';
    const rx = n.midi < 45 ? 9.5 : 8.0;
    x.beginPath(); x.ellipse(0, 0, rx, 12.5, 0, 0, Math.PI*2); x.fill();
    x.fillStyle = 'rgba(255,250,230,0.22)';
    x.beginPath(); x.ellipse(-2, -3, rx*0.4, 4.2, 0, 0, Math.PI*2); x.fill();
    x.restore();
  }
  // title printed near the leader
  x.fillStyle='rgba(70,52,26,0.75)'; x.textAlign='center';
  x.font='600 44px Georgia'; x.fillText('FÜR  ELISE', W/2, 96);
  x.font='italic 20px Georgia'; x.fillText('L. van Beethoven · arr. for the Virtuoso Player', W/2, 126);
}

//  8. AUDIO — WebAudio additive piano synthesis
// ============================================================
let ac = null, masterGain = null, comp = null;
function ensureAudio(){
  if(ac){ if(ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  ac = new AC();
  masterGain = ac.createGain(); masterGain.gain.value = 0.85;
  comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 5.5;
  comp.attack.value = 0.003; comp.release.value = 0.24;
  masterGain.connect(comp); comp.connect(ac.destination);
}
const noteHz = m => 440 * Math.pow(2, (m - 69) / 12);
const PARTIALS = [ [1, 1.0], [2, 0.52], [3, 0.27], [4, 0.155], [5, 0.09], [6, 0.055], [7, 0.032], [8, 0.02] ];
function audioNote(midi, vel=0.85){
  ensureAudio(); if(!ac) return;
  const f = noteHz(midi);
  const t = ac.currentTime + 0.002;
  // inharmonicity grows with pitch
  const B = 0.00042 + Math.pow(f/440, 1.6) * 0.00000045 * 440;
  const tau = clamp(6.2 - (midi-21)*0.052, 1.6, 6.2);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(9200, f*9 + 500), t); lp.Q.value = 0.7;
  const out = ac.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(vel * 0.42, t + 0.006);
  out.gain.exponentialRampToValueAtTime(vel * 0.22, t + 0.22);
  out.gain.exponentialRampToValueAtTime(0.0001, t + tau + 1.2);
  lp.connect(out); out.connect(masterGain);
  for(const [k, amp] of PARTIALS){
    const pf = f * k * Math.sqrt(1 + B * k * k);
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = pf;
    // slight detuned partial pair for shimmer
    const g = ac.createGain(); g.gain.value = amp;
    const pDecay = Math.exp(-(k-1) * 0.32);
    o.connect(g); g.connect(lp);
    o.start(t); o.stop(t + tau + 1.3);
    if(pDecay < 1){
      const o2 = ac.createOscillator(); o2.type='sine'; o2.frequency.value = pf * 1.0015;
      const g2 = ac.createGain(); g2.gain.value = amp * 0.5;
      o2.connect(g2); g2.connect(lp); o2.start(t); o2.stop(t + tau + 1.3);
    }
  }
  // hammer thump — short filtered noise
  const nLen = Math.floor(ac.sampleRate * 0.03);
  const nBuf = ac.createBuffer(1, nLen, ac.sampleRate);
  const ch = nBuf.getChannelData(0);
  for(let i=0;i<nLen;i++) ch[i] = (Math.random()*2 - 1) * Math.pow(1 - i/nLen, 3.2);
  const noise = ac.createBufferSource(); noise.buffer = nBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400 + f*1.6; bp.Q.value = 1.1;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(vel * 0.5, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  noise.connect(bp); bp.connect(ng); ng.connect(masterGain);
  noise.start(t);
}

function autoCountBefore(b){
  let c = 0;
  for(const n of NOTES){ if(n.start < b) c++; else break; }
  return c;
}
function manualPressEnv(m, time){
  const e = manualEnv.get(m);
  if(!e) return 0;
  const l = time - e.start;
  if(l < 0) return 0;
  const atk = smoothstep(0, 0.045, l);
  const rel = l > e.dur ? Math.max(0, 1 - (l - e.dur)/0.22) : 1;
  return atk * rel;
}
function manualHammerEnv(m, time){
  const e = manualEnv.get(m);
  if(!e) return 0;
  const l = time - e.start;
  if(l < 0) return 0;
  const up = smoothstep(0, 0.07, l);
  const down = 1 - smoothstep(0.14, 0.6, l);
  return up * down;
}
function manualStringAmp(m, time){
  const e = manualEnv.get(m);
  if(!e) return 0;
  const l = time - e.start;
  if(l <= 0) return 0;
  let amp = Math.exp(-l / 3.4);
  if(l > e.dur) amp *= Math.exp(-(l - e.dur) * 9);
  if(l > e.dur + 1.4) return 0;
  return clamp(amp, 0, 1);
}

// ---------- master state application (pure given beat & time) ----------
function applySceneState(b, time, bpmNow){
  const pedal = pedalAmountAt(b);
  const liftFromPedal = smoothstep(0.06, 0.55, pedal);
  const chordGlow = [];

  for(let i=0;i<88;i++){
    const midi = 21 + i;
    // — auto (song) envelopes —
    let keyE = 0, hamE = 0, strA = 0, dampLift = 0, damperKey = 0;
    // notes are sorted; iterate all (cheap: ~96) but only matching this midi
    for(const n of NOTES){
      if(n.midi !== midi) continue;
      const ke = keyEnvelope(n, b);
      if(ke > keyE) keyE = ke;
      const he = hammerEnvelope(n, b);
      if(he > hamE) hamE = he;
      const sa = stringAmplitude(n, b, pedal, bpmNow);
      if(sa > strA) strA = sa;
      dampLift = Math.max(dampLift, smoothstep(0.03, 0.32, ke));
    }
    damperKey = dampLift;
    // — manual envelopes —
    const mk = manualPressEnv(midi, time);
    if(mk > 0){
      keyE = Math.max(keyE, mk);
      hamE = Math.max(hamE, manualHammerEnv(midi, time));
      strA = Math.max(strA, manualStringAmp(midi, time));
      dampLift = Math.max(dampLift, smoothstep(0.03, 0.3, mk));
    }
    const lift = clamp(Math.max(dampLift, liftFromPedal), 0, 1);

    // keys
    keyPivots[i].rotation.x = 0.052 * keyE;
    keyMats[i].emissiveIntensity = 0.30 * keyE;
    // hammers
    hammerGroups[i].rotation.x = HAMMER_REST + (HAMMER_STRIKE - HAMMER_REST) * hamE;
    // dampers
    damperGroups[i].rotation.x = 0.46 * lift;
    damperGroups[i].position.y = 1.268 + 0.008 * lift;
    // strings — shimmer & glow
    const set = stringSets[i];
    for(const s of set){
      if(strA > 0.002){
        const shimmer = Math.sin(time * s.visF * Math.PI * 2 + s.phase) * 0.0021 * strA
                      + Math.sin(time * (s.visF*1.7+3.1) + s.phase*2.3) * 0.0009 * strA;
        s.mesh.position.x = s.baseX + shimmer;
        s.mat.emissiveIntensity = 0.04 + strA * 1.35;
      } else {
        s.mesh.position.x = s.baseX;
        s.mat.emissiveIntensity = 0.04;
      }
    }
  }

  // sustain pedal
  pedalPivot.rotation.x = 0.30 * pedal;
  pedalRod.position.y = 0.42 + pedal * 0.012;
  pedalRod.rotation.x = pedal * 0.12;

  // roll scroll — holes travel downward past the tracker bar
  const clamped = clamp(b, 0, ROLL_SPAN);
  rollTex.offset.y = (1 - rollRepeat) * (1 - clamped / ROLL_SPAN);
  if(window.__topSpool) window.__topSpool.rotation.x = -(clamped / ROLL_SPAN) * Math.PI * 5.2;
  if(window.__botSpool) window.__botSpool.rotation.x = (clamped / ROLL_SPAN) * Math.PI * 5.2;

  // metronome pendulum — one beat per swing
  metronomePendulum.rotation.z = Math.sin(b * Math.PI) * 0.4;

  // flames & lamp — gentle evening flicker, deterministic in t
  for(let i=0;i<flames.length;i++){
    const f = flames[i];
    f.scale.set(1 + 0.18*Math.sin(time*11.3 + i*2.4), 1 + 0.3*Math.sin(time*13.7 + i*1.9) + 0.12*Math.sin(time*27.1 + i), 1);
    f.material.emissiveIntensity = 2.1 + 0.7*Math.sin(time*17.3 + i*3.1);
  }
  lampLight.intensity = 25 * (1 + 0.075*Math.sin(time*12.6 + Math.sin(time*5.1)*2.2) + 0.03*Math.sin(time*31.7));
  lampShadeMat.emissiveIntensity = 1.48 + 0.14*Math.sin(time*12.6 + Math.sin(time*5.1)*2.2);
  fireGlow.intensity = 5.4 + 1.1*Math.sin(time*9.4 + Math.sin(time*4.2)*1.8);

  // dust motes drift
  const pos = dustGeo.attributes.position;
  for(let i=0;i<DUST_N;i++){
    pos.array[i*3]   = dustBase[i*3]   + Math.sin(time*dustSpeed[i]*0.7 + dustPhase[i]) * 0.075;
    pos.array[i*3+1] = dustBase[i*3+1] + Math.sin(time*dustSpeed[i] + dustPhase[i]*1.7) * 0.11;
    pos.array[i*3+2] = dustBase[i*3+2] + Math.cos(time*dustSpeed[i]*0.55 + dustPhase[i]*2.3) * 0.075;
  }
  pos.needsUpdate = true;
  dustMat.opacity = 0.42 + 0.14*Math.sin(time*0.9);
}

function computeActiveKeys(b, time){
  const set = new Set();
  for(const n of NOTES){ if(keyEnvelope(n, b) > 0.12) set.add(n.midi); }
  for(const [m] of manualEnv){ if(manualPressEnv(m, time) > 0.1) set.add(m); }
  return [...set].sort((a,b)=>a-b);
}
function updateBench(b, time, bpmNow){
  window.__bench.notesPlayed = notesPlayedCounter;
  window.__bench.activeKeys = computeActiveKeys(b, time);
  window.__bench.tempo = Math.round(bpmNow);
  window.__bench.rollPosition = clamp(b / ROLL_SPAN, 0, 1);
  uiTempo.textContent = Math.round(bpmNow);
  uiNotes.textContent = notesPlayedCounter;
  uiRoll.textContent = Math.round(clamp(b / ROLL_SPAN, 0, 1) * 100) + '%';
}
function triggerNoteAudioOnly(n){ audioNote(n.midi, n.vel); notesPlayedCounter++; }
function manualStrike(midi, dur=1.0){
  ensureAudio();
  audioNote(midi, 0.88);
  manualEnv.set(midi, { start: animTime, dur });
  notesPlayedCounter++;
  manualTotal++;
}

], false, 'centripetal', 0.32);
const showCamTgt = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 1.02, -0.1),
  new THREE.Vector3(0.1, 0.95, 0.1),
  new THREE.Vector3(0, 0.86, 0.22),
  new THREE.Vector3(0, 0.885, 0.17),
  new THREE.Vector3(-1.35, 1.12, 0.55),
  new THREE.Vector3(-2.35, 1.02, 0.6),
  new THREE.Vector3(0.15, 1.0, 0.05),
  new THREE.Vector3(0, 1.0, 0)
], false, 'centripetal', 0.32);
const showCamTimes = [0, 2, 4, 6, 7.6, 9.1, 10.6, 12];
function showcaseCamAt(t){
  // map t (seconds) → curve u (0..1) using the keyframe times
  const tt = clamp(t, 0, SHOW_DUR);
  let u;
  if(tt <= showCamTimes[0]) u = 0;
  else if(tt >= showCamTimes[showCamTimes.length-1]) u = 1;
  else {
    for(let i=0;i<showCamTimes.length-1;i++){
      const a = showCamTimes[i], b2 = showCamTimes[i+1];
      if(tt >= a && tt <= b2){ u = (i + smoothstep(a, b2, tt)) / (showCamTimes.length - 1); break; }
    }
  }
  return { pos: showCamPos.getPoint(u), tgt: showCamTgt.getPoint(u) };
}
const captionEl = document.getElementById('caption');
const CAPTIONS = [
  [0.0,  'An evening in the parlour — the front panel has been taken off…'],
  [2.1,  'Für Elise — the little bagatelle begins of its own accord'],
  [4.1,  'Every key dips, the hammer flies, the string answers'],
  [6.1,  'The paper roll: 96 holes, punched from this very score'],
  [8.0,  'Dampers lift; the sustained chord blooms and fades'],
  [9.6,  'Candlelight, dust and a piano that dreams'],
  [11.1, 'The “Ambassador” — alive again']
];
function captionFor(t){
  let s = CAPTIONS[0][1];
  for(const [ct, txt] of CAPTIONS){ if(t >= ct) s = txt; }
  return s;
}
const showBeat = t => t * SHOWCASE_BPM / 60;

function applyShowcase(t){
  t = clamp(t, 0, SHOW_DUR);
  const b = showBeat(t);
  manualEnv.clear();
  notesPlayedCounter = autoCountBefore(b);
  applySceneState(b, t, SHOWCASE_BPM);
  const { pos, tgt } = showcaseCamAt(t);
  camera.position.copy(pos);
  controls.target.copy(tgt);
  camera.lookAt(tgt);
  controls.update();
  captionEl.textContent = captionFor(t);
  captionEl.style.opacity = (t > 0.25 && t < SHOW_DUR - 0.25) ? 1 : 0;
  composer.render();
  updateBench(b, t, SHOWCASE_BPM);
}
window.showcase = { duration: SHOW_DUR, seek(t){ applyShowcase(t); } };

// ============================================================
//  11. POST-PROCESSING (bloom)
// ============================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.42, 0.72, 0.78);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ============================================================
//  12. INTERACTION — keyboard, mouse, buttons
// ============================================================
const MANUAL_MAP = {
  'a':60, 'w':61, 's':62, 'e':63, 'd':64, 'f':65, 't':66,
  'g':67, 'y':68, 'h':69, 'u':70, 'j':71, 'k':72
};
const uiFlash = document.getElementById('flash');
let flashTimer = null;
function flash(msg){
  uiFlash.textContent = msg; uiFlash.style.opacity = 1;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ uiFlash.style.opacity = 0; }, 1300);
}
let recording = false;

window.addEventListener('keydown', (e) => {
  if(e.repeat) return;
  const k = e.key.toLowerCase();
  if(k === ' '){
    e.preventDefault();
    if(recording) return;
    playing = !playing;
    nowPlayingEl.style.opacity = playing ? 1 : 0;
    flash(playing ? 'Playing Für Elise' : 'Paused');
    return;
  }
  if(k === 'arrowup'){ e.preventDefault(); bpm = clamp(bpm + 6, 40, 208); flash('Tempo ' + bpm + ' BPM'); return; }
  if(k === 'arrowdown'){ e.preventDefault(); bpm = clamp(bpm - 6, 40, 208); flash('Tempo ' + bpm + ' BPM'); return; }
  if(recording) return;
  const midi = MANUAL_MAP[k];
  if(midi !== undefined){
    ensureAudio();
    if(!manualEnv.has(midi)) manualStrike(midi, 1.6);
  }
});
window.addEventListener('keyup', (e) => {
  const midi = MANUAL_MAP[e.key.toLowerCase()];
  if(midi !== undefined && manualEnv.has(midi)){
    const env = manualEnv.get(midi);
    env.dur = Math.min(env.dur, animTime - env.start + 0.14); // release tail
  }
});

// click keys
const raycaster = new THREE.Raycaster();
const pointerDown = { x:0, y:0, t:0 };
const clickTargets = [];
keyPivots.forEach((p, i) => p.traverse(o => { if(o.isMesh){ o.userData.noteIndex = i; clickTargets.push(o); } }));
canvas.addEventListener('pointerdown', (e) => {
  pointerDown.x = e.clientX; pointerDown.y = e.clientY; pointerDown.t = performance.now();
});
canvas.addEventListener('pointerup', (e) => {
  const dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y;
  if(Math.hypot(dx, dy) > 6 || performance.now() - pointerDown.t > 450) return; // it was a drag
  if(recording) return;
  const rect = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - rect.left)/rect.width)*2 - 1, -((e.clientY - rect.top)/rect.height)*2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(clickTargets, false);
  if(hits.length){
    const idx = hits[0].object.userData.noteIndex;
    ensureAudio();
    manualStrike(21 + idx, 1.15);
  }
});

// ---------- record video button ----------
const recBtn = document.getElementById('recBtn');
const recProgress = document.getElementById('recProgress');
const recProgressFill = document.getElementById('recProgressFill');
const recBtnHTML = recBtn.innerHTML;
const defaultCamPos = camera.position.clone();
const defaultTarget = controls.target.clone();

recBtn.addEventListener('click', () => {
  if(recording) return;
  if(!canvas.captureStream || typeof MediaRecorder === 'undefined'){
    flash('Recording not supported in this browser'); return;
  }
  ensureAudio(); // harmless; showcase itself is silent
  recording = true;
  playing = false;
  controls.enabled = false;
  recBtn.disabled = true;
  recBtn.innerHTML = '<span class="dot"></span>Recording…';
  nowPlayingEl.style.opacity = 0;
  recProgress.style.opacity = 1;

  const stream = canvas.captureStream(60);
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  let recorder;
  try { recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 }); }
  catch(err){ recorder = new MediaRecorder(stream); }
  const chunks = [];
  recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'self-playing-upright-showcase.webm';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    // restore the interactive scene
    recording = false;
    controls.enabled = true;
    recBtn.disabled = false;
    recBtn.innerHTML = recBtnHTML;
    captionEl.style.opacity = 0;
    recProgress.style.opacity = 0; recProgressFill.style.width = '0%';
    camera.position.copy(defaultCamPos);
    controls.target.copy(defaultTarget);
    controls.update();
    beat = 0; notePtr = 0; notesPlayedCounter = 0; manualEnv.clear();
    applySceneState(0, animTime, bpm);
    flash('Showcase saved as .webm');
  };
  recorder.start(120);

  const t0 = performance.now();
  const step = () => {
    const t = (performance.now() - t0) / 1000;
    if(t >= SHOW_DUR){
      applyShowcase(SHOW_DUR);
      recProgressFill.style.width = '100%';
      recorder.stop();
      return;
    }
    applyShowcase(t);
    recProgressFill.style.width = ((t / SHOW_DUR) * 100).toFixed(2) + '%';
    requestAnimationFrame(step);
  };
  step();
});

// ============================================================
//  13. MAIN LOOP
// ============================================================
let last = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if(recording) return; // the showcase drives the frames while recording
  animTime += dt;

  if(playing){
    const prevBeat = beat;
    beat += dt * bpm / 60;
    while(notePtr < NOTES.length && NOTES[notePtr].start <= beat){
      triggerNoteAudioOnly(NOTES[notePtr]);
      notePtr++;
    }
    if(beat >= SONG_END + 1.4){ beat = 0; notePtr = 0; } // gentle loop
  }
  // expire manual envelopes
  for(const [m, e] of manualEnv){
    if(animTime - e.start > e.dur + 1.6) manualEnv.delete(m);
  }
  applySceneState(beat, animTime, bpm);
  controls.update();
  composer.render();
  updateBench(beat, animTime, bpm);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// opening pose — draw the very first frame
applySceneState(0, 0, bpm);
composer.render();
updateBench(0, 0, bpm);
animate();
</script>
</body>

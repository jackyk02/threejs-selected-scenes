<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Forest Cuckoo — Carved Chalet Clock</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#151009; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #vignette { position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 46%, rgba(10,6,3,.38) 82%, rgba(5,3,1,.72) 100%); }
  #ui { position:fixed; inset:0; pointer-events:none; font-family:Georgia, 'Times New Roman', serif; z-index:10; }
  .panel {
    position:absolute; top:18px; left:20px; pointer-events:auto;
    background:linear-gradient(160deg, rgba(46,32,20,.92), rgba(28,19,11,.92));
    border:1px solid rgba(216,178,110,.5); border-radius:6px;
    box-shadow:0 6px 28px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,160,.25);
    padding:14px 20px 13px; color:#e8d3a8; max-width:290px;
  }
  .panel h1 { margin:0; font-size:21px; letter-spacing:.12em; font-variant:small-caps; color:#f3e2b4; text-shadow:0 2px 6px #000; }
  .panel .sub { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b99a63; margin-top:3px; border-bottom:1px solid rgba(216,178,110,.35); padding-bottom:8px; }
  #readout { margin-top:9px; font-size:26px; letter-spacing:.08em; color:#ffe9b0; display:flex; align-items:baseline; gap:12px; }
  #rateBadge { font-size:12px; color:#1d1208; background:#d8b26e; border-radius:3px; padding:2px 7px; letter-spacing:.15em; font-weight:bold; }
  #callsLine { font-size:11px; color:#a98a5c; margin-top:4px; letter-spacing:.1em; }
  #recordBtn {
    position:absolute; top:18px; right:20px; pointer-events:auto; cursor:pointer;
    font-family:Georgia, serif; font-size:14px; letter-spacing:.14em; font-variant:small-caps;
    color:#2a1a0c; background:linear-gradient(180deg,#e8c87a,#b98a3e);
    border:1px solid #6e4c1c; border-radius:6px; padding:11px 20px;
    box-shadow:0 4px 16px rgba(0,0,0,.5), inset 0 1px 0 #fff3cd; transition:transform .15s, filter .15s;
  }
  #recordBtn:hover { transform:translateY(-1px); filter:brightness(1.1); }
  #recordBtn:disabled { cursor:default; filter:grayscale(.4) brightness(.85); }
  #hints {
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%); pointer-events:none;
    font-size:12.5px; letter-spacing:.05em; color:#d9c190; white-space:nowrap;
    background:rgba(22,14,8,.72); border:1px solid rgba(216,178,110,.28); border-radius:20px;
    padding:8px 22px; text-shadow:0 1px 2px #000; backdrop-filter:blur(3px);
  }
  #hints b { color:#ffe9b0; }
  #hints.rewind { animation:pulseGlow 1.1s infinite; border-color:rgba(255,120,60,.7); color:#ffc9a0; }
  @keyframes pulseGlow { 0%,100%{box-shadow:0 0 0 rgba(255,140,60,.0);} 50%{box-shadow:0 0 22px rgba(255,140,60,.55);} }
  #toast { position:absolute; top:78px; right:20px; pointer-events:none; font-size:12px; color:#ffd9a0; background:rgba(30,18,8,.85);
    border:1px solid rgba(216,178,110,.4); padding:7px 14px; border-radius:5px; opacity:0; transition:opacity .3s; letter-spacing:.06em;}
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="ui">
  <div class="panel">
    <h1>The Black Forest<br>Cuckoo</h1>
    <div class="sub">Carved Chalet &middot; Est. 1893</div>
    <div id="readout"><span id="clockTime">10:08 AM</span><span id="rateBadge">1&times;</span></div>
    <div id="callsLine">Cuckoo calls sounded: 0</div>
  </div>
  <button id="recordBtn">&#9210; Record video</button>
  <div id="toast">Winding complete</div>
  <div id="hints"><b>Drag</b> minute hand &middot; <b>F</b> = 60&times; &middot; <b>click</b> the cuckoo door &middot; <b>drag a chain</b> down to wind</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* ============================================================
   THE BLACK FOREST CUCKOO
   A carved wooden chalet cuckoo clock in a cosy panelled room.
   Pendulum physics (period from length), escapement + 8-gear
   train whose minute wheel turns exactly once per clock hour,
   pine-cone weights, WebAudio cuckoo, fully procedural art.
   ============================================================ */
'use strict';

// ---------- constants ----------
const GRAV = 9.81;
const PEND_LENGTH = 0.25;                       // m  -> period ~1.0 s
const PEND_T = 2 * Math.PI * Math.sqrt(PEND_LENGTH / GRAV);
const PEND_AMP = 0.21;
const WALL_Z = -0.30;
const CLOCK_Y = 1.62;
const CLOCK0 = 10 * 3600 + 8 * 60 + 30;         // 10:08:30, classic clock-ad time
const SHOWCASE_START = 3 * 3600 - 6;            // 2:59:54 for the 12 s film
const SHOWCASE_RATE = 6;                        // clock runs 6x during film
const SHOWCASE_DUR = 12;
const SC_DT = 1 / 120;
const FULL_DROP = 0.42;                         // world units of chain travel = full wind
const WEIGHT_DROOP = 0.055 / 3600;              // fraction of time-weight per clock second

// ---------- renderer / scene / camera / controls ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c130c);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(1.35, 1.84, 3.35);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.1;
controls.maxDistance = 6.5;
controls.maxPolarAngle = 1.68;
controls.enablePan = false;

// ---------- canvas texture helpers ----------
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function shade(hex, dl) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r + dl)); g = Math.max(0, Math.min(255, g + dl)); b = Math.max(0, Math.min(255, b + dl));
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}
function mkCanvas(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
function tex(canvas, rx, ry, srgb) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (rx) t.repeat.set(rx, ry);
  t.anisotropy = maxAniso;
  if (srgb !== false) t.encoding = THREE.sRGBEncoding;
  return t;
}

const woodCanvas = (base, planks, vertical, W, H) => mkCanvas(W || 512, H || 512, (ctx, w, h) => {
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  const pw = vertical ? w / planks : h / planks;
  for (let i = 0; i < planks; i++) {
    ctx.fillStyle = shade(base, (Math.random() * 44 - 22) | 0);
    if (vertical) ctx.fillRect(i * pw, 0, pw, h); else ctx.fillRect(0, i * pw, w, pw);
    // grain
    for (let g = 0; g < 42; g++) {
      ctx.strokeStyle = 'rgba(' + (Math.random() < 0.72 ? '20,10,4' : '230,190,130') + ',' + (0.05 + Math.random() * 0.14).toFixed(3) + ')';
      ctx.lineWidth = 0.6 + Math.random() * 1.8;
      ctx.beginPath();
      if (vertical) {
        let x = i * pw + Math.random() * pw; ctx.moveTo(x, 0);
        for (let y = 0; y <= h; y += 32) ctx.lineTo(x + Math.sin(y * 0.02 + g) * 4 + (Math.random() - 0.5) * 5, y);
      } else {
        let y = i * pw + Math.random() * pw; ctx.moveTo(0, y);
        for (let x = 0; x <= w; x += 32) ctx.lineTo(x, y + Math.sin(x * 0.02 + g) * 4 + (Math.random() - 0.5) * 5);
      }
      ctx.stroke();
    }
    // knots
    if (Math.random() < 0.75) {
      const kx = vertical ? i * pw + pw * (0.3 + Math.random() * 0.4) : Math.random() * w;
      const ky = vertical ? Math.random() * h : i * pw + pw * (0.3 + Math.random() * 0.4);
      for (let r = 9; r > 1; r -= 2.2) {
        ctx.strokeStyle = 'rgba(25,12,5,' + (0.25 + r * 0.02) + ')'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.ellipse(kx, ky, r * 0.75, r * 1.25, 0.4, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // plank seam
    ctx.fillStyle = 'rgba(8,4,2,0.85)';
    if (vertical) ctx.fillRect(i * pw - 1, 0, 2.4, h); else ctx.fillRect(0, i * pw - 1, w, 2.4);
    ctx.fillStyle = 'rgba(255,215,150,0.16)';
    if (vertical) ctx.fillRect(i * pw + 1.4, 0, 1, h); else ctx.fillRect(0, i * pw + 1.4, w, 1);
  }
});

const caseWoodTex   = tex(woodCanvas('#6d4423', 7, true), 1, 1);
const darkWoodTex   = tex(woodCanvas('#3c2412', 5, true), 1, 1);
const wallWoodTex   = tex(woodCanvas('#54331e', 9, true, 1024, 1024), 2.4, 1);
const floorWoodTex  = tex((function(){ const c = woodCanvas('#4a2c17', 8, false, 1024, 1024);
  // staggered butt joints
  const ctx = c.getContext('2d'); ctx.strokeStyle = 'rgba(10,5,2,0.75)'; ctx.lineWidth = 3;
  const rowH = 1024 / 8;
  for (let r = 0; r < 8; r++) { let x = Math.random() * 300;
    while (x < 1024) { ctx.beginPath(); ctx.moveTo(x, r * rowH); ctx.lineTo(x, (r + 1) * rowH); ctx.stroke(); x += 260 + Math.random() * 320; } }
  return c; })(), 3, 2);
const shingleTex = tex(mkCanvas(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#3b2a1c'; ctx.fillRect(0, 0, w, h);
  const rows = 6, rh = h / rows;
  for (let r = 0; r < rows; r++) { const off = (r % 2) * 22;
    for (let x = -44; x < w + 44; x += 44) {
      const g = ctx.createLinearGradient(0, r * rh, 0, r * rh + rh);
      g.addColorStop(0, shade('#5a402a', (Math.random() * 30 - 15) | 0)); g.addColorStop(1, '#221510');
      ctx.fillStyle = g; ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x + off + 1.5, r * rh + 1.5, 41, rh - 3, 6) : ctx.rect(x + off + 1.5, r * rh + 1.5, 41, rh - 3);
      ctx.fill();
    } }
}), 3, 2);

const dialTex = tex(mkCanvas(1024, 1024, (ctx, w, h) => {
  const cx = w / 2, cy = h / 2;
  const bg = ctx.createRadialGradient(cx, cy, 60, cx, cy, 500);
  bg.addColorStop(0, '#f6ecd4'); bg.addColorStop(0.62, '#eadbb4'); bg.addColorStop(0.95, '#cbbc90'); bg.addColorStop(1, '#a89873');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, 500, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#241c12'; ctx.lineWidth = 22; ctx.beginPath(); ctx.arc(cx, cy, 468, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#241c12'; ctx.lineWidth = 4;  ctx.beginPath(); ctx.arc(cx, cy, 428, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 150, 0, Math.PI * 2); ctx.stroke();
  // minute ticks
  for (let i = 0; i < 60; i++) {
    const a = i * Math.PI / 30, big = i % 5 === 0;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
    ctx.fillStyle = '#241c12'; ctx.fillRect(big ? -5 : -2, -446, big ? 10 : 4, big ? 46 : 22); ctx.restore();
  }
  // roman numerals
  const RN = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
  ctx.fillStyle = '#241c12'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 92px Georgia, serif';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    ctx.save(); ctx.translate(cx + Math.sin(a) * 348, cy - Math.cos(a) * 348); ctx.rotate(a * 0.0); ctx.fillText(RN[i], 0, 0); ctx.restore();
  }
  ctx.font = 'bold 40px Georgia, serif'; ctx.fillStyle = '#3a2c1c';
  ctx.fillText('SCHWARZWALD', cx, cy + 218);
  ctx.font = '30px Georgia, serif'; ctx.fillText('· EST. 1893 ·', cx, cy + 272);
  ctx.font = 'italic 26px Georgia, serif'; ctx.fillStyle = '#5a4630'; ctx.fillText('cučúk · kuckuck', cx, cy - 185);
}));

const skyTex = tex(mkCanvas(512, 660, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#a8c8dc'); g.addColorStop(0.42, '#cfd9c8'); g.addColorStop(0.72, '#e8d3a0'); g.addColorStop(1, '#d8b57e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // sun + glow
  const sg = ctx.createRadialGradient(300, 330, 8, 300, 330, 150);
  sg.addColorStop(0, 'rgba(255,252,225,1)'); sg.addColorStop(0.25, 'rgba(255,244,200,0.9)'); sg.addColorStop(1, 'rgba(255,244,200,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, w, h);
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  [[120,110,66],[380,170,52],[230,230,84],[420,80,44]].forEach(c => {
    ctx.beginPath(); ctx.ellipse(c[0], c[1], c[2], c[2] * 0.38, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c[0] + c[2] * 0.6, c[1] + 8, c[2] * 0.7, c[2] * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  });
  // distant hills
  ctx.fillStyle = '#8ba06f'; ctx.beginPath(); ctx.moveTo(0, 470);
  for (let x = 0; x <= w; x += 16) ctx.lineTo(x, 470 - Math.sin(x * 0.014 + 1.2) * 55 - 22); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
  ctx.fillStyle = '#5f7350'; ctx.beginPath(); ctx.moveTo(0, 540);
  for (let x = 0; x <= w; x += 12) ctx.lineTo(x, 540 - Math.sin(x * 0.021 + 4) * 42 - 10); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
  // tiny birds
  ctx.strokeStyle = '#2c2c26'; ctx.lineWidth = 2.6;
  [[140,180],[205,140],[300,240],[390,300]].forEach(b => {
    ctx.beginPath(); ctx.moveTo(b[0] - 11, b[1]); ctx.quadraticCurveTo(b[0], b[1] - 8, b[0] + 1, b[1]);
    ctx.quadraticCurveTo(b[0] + 3, b[1] - 8, b[0] + 14, b[1]); ctx.stroke();
  });
  // bare branch from right edge
  ctx.strokeStyle = '#241a12'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(w, 300); ctx.quadraticCurveTo(400, 350, 350, 420); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(430, 345); ctx.quadraticCurveTo(400, 400, 415, 440); ctx.stroke();
}), 1, 1, true);

const rugTex = tex(mkCanvas(512, 340, (ctx, w, h) => {
  ctx.fillStyle = '#6e251d'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#83342a'; ctx.fillRect(26, 26, w - 52, h - 52);
  ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 6; ctx.strokeRect(14, 14, w - 28, h - 28);
  ctx.lineWidth = 2; ctx.strokeRect(30, 30, w - 60, h - 60);
  // diamond lattice
  ctx.strokeStyle = 'rgba(216,178,110,0.5)'; ctx.lineWidth = 2;
  for (let i = -8; i < 20; i++) {
    ctx.beginPath(); ctx.moveTo(i * 48, 0); ctx.lineTo(i * 48 + h, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i * 48, 0); ctx.lineTo(i * 48 - h, h); ctx.stroke();
  }
  // medallion
  ctx.fillStyle = '#c9a227'; ctx.beginPath(); ctx.ellipse(w/2, h/2, 62, 44, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#6e251d'; ctx.beginPath(); ctx.ellipse(w/2, h/2, 44, 30, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#c9a227'; ctx.beginPath(); ctx.ellipse(w/2, h/2, 20, 13, 0, 0, Math.PI*2); ctx.fill();
}));

const coneTex = tex(mkCanvas(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#4126140'; ctx.fillStyle = '#412614'; ctx.fillRect(0, 0, w, h);
  const rows = 7;
  for (let r = 0; r < rows; r++) { const off = (r % 2) * 17;
    for (let x = -34; x < w + 34; x += 34) {
      const y = r * (h / rows);
      const g = ctx.createLinearGradient(0, y, 0, y + h / rows);
      g.addColorStop(0, '#7d5530'); g.addColorStop(0.5, '#4a2d16'); g.addColorStop(1, '#241207');
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(x + off, y + 2); ctx.lineTo(x + off + 15, y + h / rows - 2); ctx.lineTo(x + off + 30, y + 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,214,150,0.28)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x + off + 3, y + 3); ctx.lineTo(x + off + 15, y + h / rows - 4); ctx.lineTo(x + off + 27, y + 3); ctx.stroke();
    } }
}), 3, 2);

const barredTex = tex(mkCanvas(256, 128, (ctx, w, h) => {
  ctx.fillStyle = '#8d9494'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    ctx.fillStyle = 'rgba(40,46,48,' + (0.35 + Math.random() * 0.4) + ')';
    const y = Math.random() * h; ctx.fillRect(0, y, w, 2 + Math.random() * 5);
  }
}), 1, 1);

const landscapeTex = tex(mkCanvas(384, 256, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#c7d6d8'); g.addColorStop(0.6, '#e6ce9c'); g.addColorStop(1, '#8a6a45');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#5c6b4c'; ctx.beginPath(); ctx.moveTo(0, 190);
  for (let x = 0; x <= w; x += 10) ctx.lineTo(x, 190 - Math.sin(x * 0.03 + 2) * 38); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
  ctx.fillStyle = '#3d3323'; ctx.fillRect(0, 214, w, 42);
  ctx.fillStyle = '#f4e9c8'; ctx.beginPath(); ctx.arc(96, 96, 26, 0, Math.PI * 2); ctx.fill();
}));

const shadeGlowTex = tex(mkCanvas(128, 128, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w/2, h/2, 2, w/2, h/2, w/2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.6)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}));

const shaftTex = tex(mkCanvas(128, 512, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(255,240,200,0.9)'); g.addColorStop(0.7, 'rgba(255,235,190,0.28)'); g.addColorStop(1, 'rgba(255,235,190,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const side = ctx.createLinearGradient(0, 0, w, 0);
  side.addColorStop(0, 'rgba(0,0,0,0)'); side.addColorStop(0.18, 'rgba(0,0,0,1)'); side.addColorStop(0.82, 'rgba(0,0,0,1)'); side.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.save(); ctx.translate(w/2, 0); ctx.scale(1, 1); ctx.restore();
  ctx.globalCompositeOperation = 'destination-in'; ctx.fillStyle = side; ctx.fillRect(0, 0, w, h);
}));

// ---------- materials ----------
const caseMat   = new THREE.MeshStandardMaterial({ map: caseWoodTex, roughness: 0.62, metalness: 0.05 });
const darkWoodMat = new THREE.MeshStandardMaterial({ map: darkWoodTex, roughness: 0.7, metalness: 0.05 });
const brassMat  = new THREE.MeshStandardMaterial({ color: 0xc9a24e, roughness: 0.32, metalness: 0.88 });
const brassDark = new THREE.MeshStandardMaterial({ color: 0x8a6a2e, roughness: 0.45, metalness: 0.85 });
const steelMat  = new THREE.MeshStandardMaterial({ color: 0x6e6e74, roughness: 0.3, metalness: 0.9 });
const ironMat   = new THREE.MeshStandardMaterial({ color: 0x2b2b30, roughness: 0.55, metalness: 0.7 });
const leafMat   = new THREE.MeshStandardMaterial({ color: 0x3e5626, roughness: 0.72, metalness: 0.02, side: THREE.DoubleSide });
const leafMat2  = new THREE.MeshStandardMaterial({ color: 0x59703a, roughness: 0.7, side: THREE.DoubleSide });
const handMat   = new THREE.MeshStandardMaterial({ color: 0x201b17, roughness: 0.4, metalness: 0.55 });

// ============================================================
// ROOM
// ============================================================
const room = new THREE.Group(); scene.add(room);
{

function updateWeightsAndChains() {

  clock.userData.anchor = anchor;
  // warm glint light inside the movement
  const worksLight = new THREE.PointLight(0xffd9a0, 0.55, 1.6, 2); worksLight.position.set(0.42, 0.15, 0.12); clock.add(worksLight);
}
const GEAR = {
  A: GEAR_SPEC[0].teeth, B: GEAR_SPEC[1].teeth, C: GEAR_SPEC[2].teeth, D: GEAR_SPEC[3].teeth,
  E: GEAR_SPEC[4].teeth, F: GEAR_SPEC[5].teeth, G: GEAR_SPEC[6].teeth, H: GEAR_SPEC[7].teeth
};
function updateGears(cs) {
  const wc = cs * (Math.PI * 2 * 240 / 3600);          // escape: 240 rev per clock hour
  const tA = wc;
  const tB = -tA * GEAR.A / GEAR.B + Math.PI / GEAR.B;
  const tC = tB;
  const tD = -tC * GEAR.C / GEAR.D + Math.PI / GEAR.D;
  const tE = tD;
  const tF = -tE * GEAR.E / GEAR.F + Math.PI / GEAR.F;
  const tG = tF;
  const tH = -tG * GEAR.G / GEAR.H + Math.PI / GEAR.H;  // exactly one rev per clock hour
  gearMeshes.A.rotation.x = tA; gearMeshes.B.rotation.x = tB; gearMeshes.C.rotation.x = tC; gearMeshes.D.rotation.x = tD;
  gearMeshes.E.rotation.x = tE; gearMeshes.F.rotation.x = tF; gearMeshes.G.rotation.x = tG; gearMeshes.H.rotation.x = tH;
}

// ============================================================
// SIMULATION STATE & STRIKE MACHINE
// ============================================================
const sim = {};
function resetSim(kind) {
  sim.kind = kind;
  sim.simTime = 0;
  sim.clockSeconds = (kind === 'showcase') ? SHOWCASE_START : CLOCK0;
  sim.clockRate = 1;
  sim.fast = false;
  sim.cuckoos = 0;
  sim.pendulumPhase = 0;
  sim.danceSpin = 0;
  sim.wheelAngle = 0;
  sim.strikePrev = sim.clockSeconds;
  sim.strike = { active: false, state: 'idle', t: 0, remaining: 0, total: 0, nextIn: 0, callPulse: 9, progress: 0 };
  if (kind === 'normal') { weightState.time.remaining = 0.82; weightState.strike.remaining = 0.90; }
  else { weightState.time.remaining = 0.8; weightState.strike.remaining = 0.85; }
}
resetSim('normal');

// --- WebAudio: two-tone cuckoo call ---
let audioCtx = null;
function ac() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function cuckooTone(ctxA, freq, t0, dur) {
  const o = ctxA.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(freq, t0);
  const vib = ctxA.createOscillator(); vib.frequency.setValueAtTime(26, t0);
  const vibGain = ctxA.createGain(); vibGain.setValueAtTime(6, t0);
  vib.connect(vibGain); vibGain.connect(o.frequency);
  const g = ctxA.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.018);
  g.gain.setValueAtTime(0.5, t0 + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.1);
  const lp = ctxA.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t0);
  o.connect(lp); lp.connect(g); g.connect(ctxA.destination);
  o.start(t0); o.stop(t0 + dur + 0.15); vib.start(t0); vib.stop(t0 + dur + 0.15);
}
function playCuckooCall() {
  const ctxA = ac(); if (!ctxA) return;
  const t0 = ctxA.currentTime + 0.03;
  cuckooTone(ctxA, 659.25, t0, 0.17);        // first syllable
  cuckooTone(ctxA, 493.88, t0 + 0.235, 0.2); // second syllable (minor third down)
}
function fireCuckooCall(withAudio) {
  sim.cuckoos++;
  weightState.strike.remaining = Math.max(0, weightState.strike.remaining - 0.012);
  sim.strike.callPulse = 0;
  if (withAudio) playCuckooCall();
}
function triggerStrike(count, withAudio) {
  if (sim.strike.active) return;
  sim.strike.active = true; sim.strike.state = 'emerge'; sim.strike.t = 0;
  sim.strike.remaining = count; sim.strike.total = count; sim.strike.nextIn = 0.62; sim.strike.callPulse = 9;
}
function stepSim(dt, withAudio) {
  sim.simTime += dt;
  const rateEff = (sim.kind === 'showcase') ? SHOWCASE_RATE : (sim.fast ? 60 : 1) * (weightState.time.remaining > 0 ? 1 : 0);
  const prevCS = sim.clockSeconds;
  const advanced = dt * rateEff;
  sim.clockSeconds += advanced;
  weightState.time.remaining = Math.max(0, weightState.time.remaining - advanced * WEIGHT_DROOP);

  // boundary crossing detection (forward only)
  if (advanced > 0 && sim.strikePrev === prevCS) {
    if (Math.floor(prevCS / 3600) < Math.floor(sim.clockSeconds / 3600)) {
      const h = Math.floor(sim.clockSeconds / 3600) % 24;
      triggerStrike(h % 12 === 0 ? 12 : h % 12, withAudio);
    } else if (Math.floor(prevCS / 1800) < Math.floor(sim.clockSeconds / 1800) && Math.floor(sim.clockSeconds / 1800) % 2 === 1) {
      triggerStrike(1, withAudio);   // half hour: single call
    }
  }
  sim.strikePrev = sim.clockSeconds;

  // strike machine
  const st = sim.strike;
  st.callPulse += dt;
  if (st.active) {
    st.t += dt;
    if (st.state === 'emerge') {
      st.progress = Math.min(1, st.t / 0.7);
      st.progress = 1 - Math.pow(1 - st.progress, 3);
      if (st.t >= 0.72) { st.state = 'calls'; st.t = 0; }
    } else if (st.state === 'calls') {
      st.progress = 1;
      if (st.remaining > 0) {
        st.nextIn -= dt;
        if (st.nextIn <= 0) { fireCuckooCall(withAudio); st.remaining--; st.nextIn = 1.12; }
      } else if (st.callPulse > 1.0) { st.state = 'dwell'; st.t = 0; }
    } else if (st.state === 'dwell') {
      st.progress = 1;
      if (st.t > 0.95) { st.state = 'retract'; st.t = 0; }
    } else if (st.state === 'retract') {
      const k = Math.min(1, st.t / 0.62);
      st.progress = 1 - k * k * (3 - 2 * k);
      if (k >= 1) { st.active = false; st.state = 'idle'; st.progress = 0; }
    }
    sim.danceSpin += dt * 4.4;
    sim.wheelAngle += dt * 6.5;
  } else {
    st.progress = Math.max(0, (st.progress || 0) - dt * 1.6);
  }
}

// ============================================================
// BENCH (exposed for evaluation) — updated every frame
// ============================================================
const bench = { time: 0, pendulumAngle: 0, cuckoos: 0, weightHeight: 1 };
window.__bench = bench;

// ============================================================
// VISUAL SYNC
// ============================================================
const timeReadout = document.getElementById('clockTime');
const rateBadge = document.getElementById('rateBadge');
const callsLine = document.getElementById('callsLine');
const hintsBar = document.getElementById('hints');
const dialWorldPos = new THREE.Vector3();
const tmpV = new THREE.Vector3();

function syncVisuals() {
  const cs = sim.clockSeconds;
  // pendulum (period from length)
  const theta = PEND_AMP * Math.sin(2 * Math.PI * sim.simTime / PEND_T);
  pendulum.rotation.z = theta;
  if (clock.userData.anchor) clock.userData.anchor.rotation.x = theta * 0.42;

  // hands
  const minuteA = ((cs % 3600) / 3600) * Math.PI * 2;
  const hourA = ((cs % 43200) / 43200) * Math.PI * 2;
  minuteHand.rotation.z = -minuteA;
  hourHand.rotation.z = -hourA;

  // gears
  updateGears(cs);

  // weights + chains
  updateWeightsAndChains();

  // cuckoo bird & door
  const prog = sim.strike.progress || 0;
  bird.visible = prog > 0.02;
  if (bird.visible) {
    bird.position.z = 0.28 + prog * 0.17;
    bird.position.y = 0.445 + Math.sin(sim.simTime * 9) * 0.011 * prog;
    const flap = Math.sin(sim.simTime * 21) * 0.75 * prog;
    bird.children.forEach(ch => {
      if (ch.name === 'wingL') ch.rotation.z = 0.55 + flap;
      if (ch.name === 'wingR') ch.rotation.z = -0.55 - flap;
    });
    const pulse = Math.max(0, 1 - sim.strike.callPulse / 0.55);
    bird.userData.lowerBeak.rotation.x = Math.sin(pulse * Math.PI) * 0.55;
    bird.userData.tail.rotation.x = 0.5 + Math.sin(sim.simTime * 14) * 0.18 * prog;
    bird.rotation.x = -0.08 * prog + Math.sin(sim.simTime * 4.5) * 0.05 * prog;
  }
  doorPivot.rotation.x = -prog * 1.55;

  // dancers turn while the strike sounds
  const hop = sim.strike.active ? Math.abs(Math.sin(sim.simTime * 10.5)) * 0.016 : 0;
  dancers.forEach((d, i) => {
    d.rotation.y = (i === 0 ? 0.3 : -0.3) + sim.danceSpin * (i === 0 ? 1 : 1) + i * Math.PI;
    d.position.y = 0.025 + hop;
  });
  // waterwheel spins during the strike
  if (clock.userData.waterwheel) clock.userData.waterwheel.rotation.z = -sim.wheelAngle;

  // cat breathing (driven by sim time -> deterministic under seek)
  if (catGroup.userData.body) catGroup.userData.body.scale.y = 0.58 * (1 + 0.07 * Math.sin(2 * Math.PI * sim.simTime / 3.4));

  // dust shimmer
  const dust = room.getObjectByName ? null : null; // (dust handled by material opacity below)

  // readout
  const h24 = Math.floor(cs / 3600) % 24, mn = Math.floor(cs / 60) % 60;
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  timeReadout.textContent = h12 + ':' + String(mn).padStart(2, '0') + ' ' + (h24 < 12 ? 'AM' : 'PM');
  rateBadge.textContent = (sim.kind === 'showcase' ? SHOWCASE_RATE : (sim.fast ? 60 : 1)) + '×';
  callsLine.textContent = 'Cuckoo calls sounded: ' + sim.cuckoos;
  hintsBar.classList.toggle('rewind', weightState.time.remaining <= 0.001 && sim.kind !== 'showcase');

  // expose bench
  bench.time = cs / 3600;
  bench.pendulumAngle = theta;
  bench.cuckoos = sim.cuckoos;
  bench.weightHeight = weightState.time.remaining;
}

// ============================================================
// AUDIO-TRIGGERED DOOR CLICK & DRAG INTERACTION
// ============================================================
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const drag = { mode: null, which: null, lastY: 0, lastAngle: 0, planeZ: 0.34 };

function setNDC(e) {
  const r = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}
function pointerAngleOnDial(e) {
  setNDC(e); raycaster.setFromCamera(pointerNDC, camera);
  dialGroup.getWorldPosition(dialWorldPos);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -(dialWorldPos.z + 0.05));
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, hit)) return null;
  return Math.atan2(hit.x - dialWorldPos.x, hit.y - dialWorldPos.y);
}
const wrapPi = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

renderer.domElement.addEventListener('pointerdown', e => {
  setNDC(e); raycaster.setFromCamera(pointerNDC, camera);
  // chains first (easy grab)
  let hits = raycaster.intersectObjects(chainProxies, false);
  if (hits.length) {
    drag.mode = 'chain'; drag.which = hits[0].object.userData.weight; drag.lastY = e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId); ac(); return;
  }
  // door / bird -> single cuckoo call
  hits = raycaster.intersectObjects(clickTargets, false);
  if (hits.length) { ac(); triggerStrike(1, true); return; }
  // dial -> drag minute hand
  hits = raycaster.intersectObjects(dialHit, false);
  if (hits.length) {
    const a = pointerAngleOnDial(e);
    if (a !== null) { drag.mode = 'hand'; drag.lastAngle = a; renderer.domElement.setPointerCapture(e.pointerId); ac(); }
    return;
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (drag.mode === 'chain') {
    const dy = e.clientY - drag.lastY; drag.lastY = e.clientY;
    const wMesh = weightMeshes[drag.which].group;
    wMesh.getWorldPosition(tmpV);
    const dist = camera.position.distanceTo(tmpV);
    const worldPerPixel = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / renderer.domElement.clientHeight;
    const delta = dy * worldPerPixel / FULL_DROP;          // pull down => rewind
    weightState[drag.which].remaining = THREE.MathUtils.clamp(weightState[drag.which].remaining + delta, 0, 1);
    updateWeightsAndChains(); syncVisuals();
    return;
  }
  if (drag.mode === 'hand') {
    const a = pointerAngleOnDial(e);
    if (a !== null) {
      const d = wrapPi(a - drag.lastAngle); drag.lastAngle = a;
      sim.clockSeconds += d * 3600 / (Math.PI * 2);        // clockwise => forward
      sim.strikePrev = sim.clockSeconds;                   // suppress strikes while setting
      syncVisuals();
    }
    return;
  }
  // hover cursor
  setNDC(e); raycaster.setFromCamera(pointerNDC, camera);
  const over = raycaster.intersectObjects(chainProxies, false).length ||
               raycaster.intersectObjects(clickTargets, false).length ||
               raycaster.intersectObjects(dialHit, false).length;
  renderer.domElement.style.cursor = over ? (raycaster.intersectObjects(chainProxies, false).length ? 'grab' : 'pointer') : 'default';
});
const endDrag = e => { drag.mode = null; drag.which = null; };
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

window.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    sim.fast = !sim.fast;
    const toast = document.getElementById('toast');
    toast.textContent = sim.fast ? 'Fast-forward 60×' : 'Real time';
    toast.style.opacity = 1; setTimeout(() => toast.style.opacity = 0, 1400);
  }
});

// ============================================================
// SHOWCASE — deterministic 12 s film
// ============================================================
const camKeys = [
  { t: 0.0,  pos: [2.45, 2.02, 3.70], tgt: [0, 1.40, 0] },
  { t: 1.15, pos: [0.95, 1.98, 2.15], tgt: [0, 1.78, 0.12] },
  { t: 2.7,  pos: [0.46, 2.24, 1.33], tgt: [0, 2.11, 0.33] },   // cuckoo emerges (~t=1) + calls
  { t: 4.6,  pos: [2.42, 1.72, 0.98], tgt: [0.70, 1.62, 0.0] },  // cut-away gear train
  { t: 6.9,  pos: [0.68, 0.60, 1.78], tgt: [0, 0.55, 0.08] },    // pendulum & pine-cone weights
  { t: 9.2,  pos: [-2.35, 1.82, 3.05], tgt: [0, 1.56, 0] },      // from the window side
  { t: 12.0, pos: [1.30, 1.82, 3.35], tgt: [0, 1.50, 0] }        // hero wide
];
function camAt(t) {
  const tt = THREE.MathUtils.clamp(t, 0, SHOWCASE_DUR);
  let i = 0;
  while (i < camKeys.length - 2 && tt > camKeys[i + 1].t) i++;
  const a = camKeys[i], b = camKeys[i + 1];
  const k = THREE.MathUtils.clamp((tt - a.t) / (b.t - a.t), 0, 1);
  const e = k * k * (3 - 2 * k);
  camera.position.set(
    a.pos[0] + (b.pos[0] - a.pos[0]) * e,
    a.pos[1] + (b.pos[1] - a.pos[1]) * e,
    a.pos[2] + (b.pos[2] - a.pos[2]) * e
  );
  const tx = a.tgt[0] + (b.tgt[0] - a.tgt[0]) * e, ty = a.tgt[1] + (b.tgt[1] - a.tgt[1]) * e, tz = a.tgt[2] + (b.tgt[2] - a.tgt[2]) * e;
  camera.lookAt(tx, ty, tz);
  controls.target.set(tx, ty, tz);
}
let mode = 'normal';
let showT = 0, scAccum = 0;
let recording = false, mediaRecorder = null, recChunks = [];

function stepShowcase(dt, withAudio) {
  scAccum += dt;
  let guard = 0;
  while (scAccum >= SC_DT && guard++ < 400) { stepSim(SC_DT, withAudio); scAccum -= SC_DT; showT += SC_DT; }
}
function renderFrame() {
  if (composer) composer.render(); else renderer.render(scene, camera);
}
function seekImpl(t, withAudio) {
  resetSim('showcase');
  mode = 'showcase';
  showT = 0; scAccum = 0;
  const target = THREE.MathUtils.clamp(t, 0, SHOWCASE_DUR);
  let guard = 0;
  while (showT < target - 1e-9 && guard++ < 20000) stepSim(SC_DT, withAudio);
  showT = target; scAccum = 0;
  camAt(showT);
  syncVisuals();
  renderFrame();
}

window.showcase = {
  duration: SHOWCASE_DUR,
  seek: function (t) { const prevMode = mode; seekImpl(t, false); return; }
};

const recordBtn = document.getElementById('recordBtn');
function startShowcaseRecord() {
  if (recording) return;
  ac();                                     // user gesture -> audio unlocked
  resetSim('showcase');
  mode = 'showcase'; showT = 0; scAccum = 0;
  controls.enabled = false;
  recording = true;
  recordBtn.disabled = true; recordBtn.innerHTML = '&#9210; Recording&hellip;';
  try {
    const stream = renderer.domElement.captureStream(60);
    const candidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mime = candidates.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12000000 } : undefined);
    recChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'black-forest-cuckoo-showcase.webm';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      // restore the normal interactive scene
      resetSim('normal'); mode = 'normal'; controls.enabled = true;
      recording = false; recordBtn.disabled = false; recordBtn.innerHTML = '&#9210; Record video';
    };
    mediaRecorder.start(250);
  } catch (err) {
    console.warn('MediaRecorder unavailable:', err);
    recording = false; controls.enabled = true; mode = 'normal';
    recordBtn.disabled = false; recordBtn.innerHTML = '&#9210; Record video';
    return;
  }
}
recordBtn.addEventListener('click', startShowcaseRecord);

// ============================================================
// POST-PROCESSING (bloom) & RESIZE
// ============================================================
let composer = null;
try {
  if (THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.62, 0.78);
    composer.addPass(bloom);
  }
} catch (e) { console.warn('Bloom disabled:', e); composer = null; }

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// MAIN LOOP
// ============================================================
let prevReal = 0;
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  let dt = prevReal ? now - prevReal : 0.016; prevReal = now;
  dt = Math.min(dt, 0.05);

  if (mode === 'showcase') {
    stepShowcase(dt, recording);
    camAt(showT);
    if (recording && showT >= SHOWCASE_DUR - 1e-6 && mediaRecorder && mediaRecorder.state !== 'inactive') {
      showT = SHOWCASE_DUR; camAt(showT); syncVisuals(); renderFrame();
      mediaRecorder.stop();
      return;
    }
  } else {
    stepSim(dt, true);
    controls.update();
  }
  syncVisuals();
  renderFrame();
}
syncVisuals();
animate();
</script>

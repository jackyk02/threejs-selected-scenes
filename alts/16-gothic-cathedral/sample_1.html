<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sancta Maria — Interior of a Gothic Cathedral</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#05060a; height:100%; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- HUD ---------- */
  #vignette{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 46%, rgba(4,3,8,.38) 78%, rgba(2,2,5,.82) 100%);
  }
  .hud{ position:fixed; z-index:10; color:#e8dcc3; font-family:Georgia,'Times New Roman',serif;
        text-shadow:0 1px 3px #000, 0 0 18px rgba(0,0,0,.8); pointer-events:none; user-select:none; }
  #title{ top:18px; left:24px; }
  #title h1{ margin:0; font-size:19px; letter-spacing:.22em; font-weight:normal; color:#f0e2c0; }
  #title p{ margin:3px 0 0 1px; font-size:11px; letter-spacing:.3em; color:#b39d6f; text-transform:uppercase; }
  #legend{ bottom:18px; left:24px; font-size:12px; line-height:1.9; color:#cbbd97;
           background:rgba(10,8,14,.55); border:1px solid rgba(201,162,39,.28); border-radius:6px;
           padding:8px 14px; backdrop-filter:blur(3px); }
  #legend b{ color:#f4d98a; font-weight:normal; display:inline-block; min-width:26px; }
  #tod{ bottom:18px; right:24px; text-align:right; }
  #todBadge{ display:inline-block; font-size:14px; letter-spacing:.25em; text-transform:uppercase;
        color:#ffd98f; border:1px solid rgba(233,196,110,.45); padding:6px 18px 5px; border-radius:3px;
        background:linear-gradient(180deg, rgba(60,40,14,.55), rgba(20,12,6,.65)); }
  #tod small{ display:block; font-size:9px; color:#a8905d; letter-spacing:.35em; margin-top:4px;}
  #recBtn{
    position:fixed; z-index:20; top:18px; right:24px; cursor:pointer;
    font-family:Georgia,serif; font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    color:#ffe6a8; background:linear-gradient(180deg, rgba(84,32,24,.9), rgba(38,12,10,.92));
    border:1px solid rgba(255,205,110,.5); border-radius:4px; padding:9px 20px 8px;
    box-shadow:0 0 18px rgba(255,160,60,.22), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all .2s ease;
  }
  #recBtn:hover{ background:linear-gradient(180deg, rgba(120,46,32,.95), rgba(54,18,12,.95)); box-shadow:0 0 26px rgba(255,170,70,.4); }
  #recBtn.recording{ animation:pulse 1s infinite; color:#fff; border-color:#ff8a5a; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 14px rgba(255,90,50,.35);} 50%{ box-shadow:0 0 34px rgba(255,110,60,.7);} }
  #toast{
    position:fixed; z-index:15; bottom:86px; left:50%; transform:translateX(-50%) translateY(12px);
    font-family:Georgia,serif; font-size:13px; letter-spacing:.2em; color:#ffe9b0; opacity:0;
    background:rgba(15,10,6,.78); border:1px solid rgba(233,196,110,.4); padding:8px 22px 7px; border-radius:4px;
    transition:all .35s ease; pointer-events:none; text-transform:uppercase; white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #fpsHint{
    position:fixed; z-index:15; top:50%; left:50%; transform:translate(-50%,-140%);
    font-family:Georgia,serif; font-size:13px; letter-spacing:.2em; color:#ffe9b0; display:none;
    background:rgba(10,8,14,.6); padding:8px 20px; border-radius:4px; border:1px solid rgba(233,196,110,.35);
    pointer-events:none; text-transform:uppercase;
  }
  #crosshair{ position:fixed; z-index:12; top:50%; left:50%; width:14px; height:14px; transform:translate(-50%,-50%);
    display:none; pointer-events:none; }
  #crosshair::before,#crosshair::after{ content:''; position:absolute; background:rgba(255,235,180,.85); box-shadow:0 0 4px #000; }
  #crosshair::before{ left:6px; top:0; width:2px; height:14px; }
  #crosshair::after { top:6px; left:0; height:2px; width:14px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div class="hud" id="title">
  <h1>S A N C T A &nbsp; M A R I A</h1>
  <p>Gothic Cathedral &middot; est. 1248</p>
</div>

<div class="hud" id="legend">
  <div><b>F</b> first-person &nbsp;·&nbsp; <b>W A S D</b> walk</div>
  <div><b>T</b> time of day &nbsp;·&nbsp; <b>O</b> play organ</div>
  <div><b>Drag</b> orbit &nbsp;·&nbsp; <b>Wheel</b> zoom &nbsp;·&nbsp; <b>Shift</b> walk fast</div>
</div>

<div class="hud" id="tod">
  <span id="todBadge">Morning</span>
  <small>Light of the Divine</small>
</div>

<button id="recBtn">&#9210;&nbsp; Record video</button>
<div id="toast"></div>
<div id="fpsHint">Click to look around &nbsp;·&nbsp; W A S D walk &nbsp;·&nbsp; F exit</div>
<div id="crosshair"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* =====================================================================
   SANCTA MARIA — a gothic cathedral interior, fully procedural.
   No external assets. All textures are canvas-generated; all geometry
   is built in code. Simulations are deterministic functions of simTime.
   ===================================================================== */
'use strict';

/* ---------------- deterministic RNG ---------------- */
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,k)=>a+(b-a)*k;
const smooth01 = u => { u = clamp(u,0,1); return u*u*(3-2*u); };

/* ---------------- renderer / scene / camera ---------------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputEncoding = THREE.sRGBEncoding;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0a10);
scene.fog = new THREE.FogExp2(0x0d0b12, 0.0105);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 320);
camera.position.set(0, 3.0, -46.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6.5, 12);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.5;
controls.maxDistance = 85;
controls.maxPolarAngle = Math.PI * 0.62;
controls.update();

/* ---------------- bench exposure (spec) ---------------- */
window.__bench = { dustMotes: 0, candles: 0, timeOfDay: 'morning', organPipes: 0 };

/* =====================================================================
   PROCEDURAL TEXTURES (canvas)
   ===================================================================== */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function canvasTexture(c, repeatX, repeatY){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if(repeatX) t.repeat.set(repeatX, repeatY||repeatX);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* ---- stone floor: large flagstones ---- */
function drawFloor(){
  const c = makeCanvas(512,512), g = c.getContext('2d');
  g.fillStyle = '#57524b'; g.fillRect(0,0,512,512);
  const T = 128, rnd = mulberry32(1234);
  for(let ty=0; ty<4; ty++) for(let tx=0; tx<4; tx++){
    const v = 88 + rnd()*34;
    g.fillStyle = `rgb(${v+8|0},${v+2|0},${v-6|0})`;
    g.fillRect(tx*T+3, ty*T+3, T-6, T-6);
    // inner bevel
    g.strokeStyle = 'rgba(30,28,25,.85)'; g.lineWidth = 3;
    g.strokeRect(tx*T+6, ty*T+6, T-12, T-12);
    g.strokeStyle = 'rgba(210,205,195,.10)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(tx*T+8, ty*T+T-8); g.lineTo(tx*T+8, ty*T+8); g.lineTo(tx*T+T-8, ty*T+8); g.stroke();
    // mottling
    for(let i=0;i<260;i++){
      const a = 0.05 + rnd()*0.12;
      g.fillStyle = rnd()>0.5 ? `rgba(0,0,0,${a})` : `rgba(235,230,220,${a*0.7})`;
      g.fillRect(tx*T + rnd()*T, ty*T + rnd()*T, 1+rnd()*3, 1+rnd()*3);
    }
    if(rnd() > 0.72){ // crack
      g.strokeStyle = 'rgba(25,23,20,.7)'; g.lineWidth = 1.4; g.beginPath();
      let x = tx*T + rnd()*T, y = ty*T + 6; g.moveTo(x,y);
      while(y < ty*T + T - 6){ x += (rnd()-0.5)*22; y += 8+rnd()*10; g.lineTo(x,y); }
      g.stroke();
    }
  }
  return c;
}

/* ---- ashlar wall stone ---- */
function drawWall(){
  const c = makeCanvas(512,512), g = c.getContext('2d');
  const rnd = mulberry32(777);
  g.fillStyle = '#4c463d'; g.fillRect(0,0,512,512);
  const rowH = 64, blkW = 148;
  for(let r=0; r<8; r++){
    const off = (r%2) ? blkW/2 : 0;
    for(let bx=-1; bx<5; bx++){
      const v = 118 + rnd()*36;
      g.fillStyle = `rgb(${v+6|0},${v|0},${v-12|0})`;
      g.fillRect(bx*blkW + off + 2, r*rowH + 2, blkW - 4, rowH - 4);
      // chisel marks
      for(let i=0;i<130;i++){
        const a = 0.05 + rnd()*0.10;
        g.fillStyle = rnd()>0.5 ? `rgba(0,0,0,${a})` : `rgba(240,234,220,${a*0.6})`;
        g.fillRect(bx*blkW + off + 3 + rnd()*(blkW-6), r*rowH + 3 + rnd()*(rowH-6), 1+rnd()*4, 1+rnd()*2);
      }
    }
  }
  return c;
}

/* ---- vertical wood planks ---- */
function drawWood(){
  const c = makeCanvas(256,256), g = c.getContext('2d');
  const rnd = mulberry32(4242);
  g.fillStyle = '#4a2f1c'; g.fillRect(0,0,256,256);
  for(let p=0; p<8; p++){
    const x = p*32, v = 74 + rnd()*30;
    g.fillStyle = `rgb(${v+34|0},${v|0},${v*0.55|0})`;
    g.fillRect(x+1, 0, 30, 256);
    g.strokeStyle = 'rgba(15,8,4,.9)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,256); g.stroke();
    for(let i=0;i<26;i++){ // grain
      g.strokeStyle = `rgba(30,16,8,${0.25+rnd()*0.3})`; g.lineWidth = 0.8+rnd();
      g.beginPath(); const gx = x + 4 + rnd()*24; g.moveTo(gx, 0);
      g.bezierCurveTo(gx+(rnd()-0.5)*8, 85, gx+(rnd()-0.5)*8, 170, gx+(rnd()-0.5)*10, 256);
      g.stroke();
    }
  }
  return c;
}

/* ---- stained glass lancets (three variants) ---- */
function drawStainedGlass(seed, glow){
  const c = makeCanvas(256,512), g = c.getContext('2d');
  const rnd = mulberry32(seed);
  g.fillStyle = '#0a0c16'; g.fillRect(0,0,256,512);
  const palette = ['#b53a2e','#2f5fc4','#2f9e5f','#d2ab2c','#7a44c9','#1f8f96','#a83a72','#3f70d4','#c46a1e','#2790c9'];
  // diamond quarrel lattice
  const dw = 34, dh = 44;
  for(let row=-1; row<13; row++){
    for(let col=-1; col<9; col++){
      const cx = col*dw + ((row%2)? dw/2 : 0), cy = row*dh;
      const colr = palette[(rnd()*palette.length)|0];
      const grad = g.createRadialGradient(cx, cy, 2, cx, cy, dh*0.75);
      grad.addColorStop(0, colr);
      grad.addColorStop(0.72, colr);
      grad.addColorStop(1, '#120e14');
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(cx, cy-dh/2); g.lineTo(cx+dw/2, cy); g.lineTo(cx, cy+dh/2); g.lineTo(cx-dw/2, cy);
      g.closePath(); g.fill();
      g.strokeStyle = '#0e0d10'; g.lineWidth = 5; g.stroke();
    }
  }
  // central medallion
  const mx = 128, my = 180;
  g.strokeStyle = '#0e0d10'; g.lineWidth = 10;
  const mg = g.createRadialGradient(mx,my,4, mx,my,58);
  mg.addColorStop(0,'#ffe27a'); mg.addColorStop(0.45,'#e0912c'); mg.addColorStop(1,'#5a2a08');
  g.fillStyle = mg; g.beginPath(); g.arc(mx,my,54,0,Math.PI*2); g.fill(); g.stroke();
  // star inside medallion
  g.fillStyle = '#7a1f1f'; g.strokeStyle = '#0e0d10'; g.lineWidth = 4;
  g.beginPath();
  for(let i=0;i<10;i++){
    const r = i%2 ? 13 : 30, a = -Math.PI/2 + i*Math.PI/5;
    const px = mx + Math.cos(a)*r, py = my + Math.sin(a)*r;
    i===0 ? g.moveTo(px,py) : g.lineTo(px,py);
  }
  g.closePath(); g.fill(); g.stroke();
  // vertical mullion bar (upper third)
  g.fillStyle = '#0e0d10'; g.fillRect(120, 0, 16, 150);
  // stone-ish border + gold inner line
  g.strokeStyle = '#141216'; g.lineWidth = 26; g.strokeRect(0,0,256,512);
  g.strokeStyle = 'rgba(226,186,106,.55)'; g.lineWidth = 3; g.strokeRect(15,15,226,482);
  // solar glare bloom at top
  if(glow){ const gg = g.createRadialGradient(128,30,2,128,30,180);
    gg.addColorStop(0,'rgba(255,246,214,.9)'); gg.addColorStop(1,'rgba(255,246,214,0)');
    g.globalCompositeOperation='lighter'; g.fillStyle=gg; g.fillRect(0,0,256,260); g.globalCompositeOperation='source-over'; }
  return c;
}

/* ---- rose window ---- */
function drawRose(){
  const S = 512, c = makeCanvas(S,S), g = c.getContext('2d');
  const rnd = mulberry32(9001);
  g.fillStyle = '#07070d'; g.fillRect(0,0,S,S);
  const palette = ['#b53a2e','#2f5fc4','#2f9e5f','#d2ab2c','#7a44c9','#1f8f96','#a83a72','#3f70d4'];
  const cx = S/2, cy = S/2;
  function leadCircle(x,y,r,col){
    const gr = g.createRadialGradient(x-r*0.3, y-r*0.3, r*0.08, x, y, r);
    gr.addColorStop(0,'#fff6d8'); gr.addColorStop(0.28,col); gr.addColorStop(1,'#141018');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
    g.strokeStyle = '#0d0c10'; g.lineWidth = 7; g.stroke();
  }
  // outer ring — 24 segments
  for(let i=0;i<24;i++){
    const a = i/24*Math.PI*2;
    const x = cx + Math.cos(a)*218, y = cy + Math.sin(a)*218;
    leadCircle(x, y, 44, palette[i % palette.length]);
  }
  // middle ring — 12 large petals (teardrop circles)
  for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2 + Math.PI/12;
    const x = cx + Math.cos(a)*142, y = cy + Math.sin(a)*142;
    leadCircle(x, y, 52, palette[(i*5+2) % palette.length]);
    // petal vein
    g.strokeStyle = '#0d0c10'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(cx + Math.cos(a)*96, cy + Math.sin(a)*96);
    g.lineTo(cx + Math.cos(a)*190, cy + Math.sin(a)*190); g.stroke();
  }
  // inner ring — 12 small
  for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    leadCircle(cx + Math.cos(a)*74, cy + Math.sin(a)*74, 27, palette[(i*3+5) % palette.length]);
  }
  // hub
  const hg = g.createRadialGradient(cx,cy,3,cx,cy,44);
  hg.addColorStop(0,'#fff8dc'); hg.addColorStop(0.4,'#e6b93e'); hg.addColorStop(1,'#3a1c06');
  g.fillStyle = hg; g.beginPath(); g.arc(cx,cy,42,0,Math.PI*2); g.fill();
  g.strokeStyle = '#0d0c10'; g.lineWidth = 8; g.stroke();
  // spokes
  g.strokeStyle = '#0d0c10'; g.lineWidth = 6;
  for(let i=0;i<12;i++){
    const a = i/12*Math.PI*2 + Math.PI/24;
    g.beginPath(); g.moveTo(cx + Math.cos(a)*40, cy + Math.sin(a)*40);
    g.lineTo(cx + Math.cos(a)*256, cy + Math.sin(a)*256); g.stroke();
  }
  return c;
}

/* ---- colored floor-light patch (pjols of stained light) ---- */
function drawPatch(){
  const c = makeCanvas(256,256), g = c.getContext('2d');
  g.clearRect(0,0,256,256);
  const palette = ['#c0452e','#3a62c2','#3aa065','#d8b838','#8350d0','#27909a'];
  const rnd = mulberry32(31415);
  const cw = 64, ch = 52;
  for(let y=0;y<5;y++) for(let x=0;x<4;x++){
    g.fillStyle = palette[(rnd()*palette.length)|0];
    g.globalAlpha = 0.85 + rnd()*0.15;
    g.fillRect(x*cw+2, y*ch+2, cw-4, ch-4);
    g.strokeStyle = 'rgba(8,8,10,.9)'; g.globalAlpha = 1; g.lineWidth = 5;
    g.strokeRect(x*cw+2, y*ch+2, cw-4, ch-4);
  }
  // soft-edge mask
  g.globalCompositeOperation = 'destination-in';
  const mask = g.createRadialGradient(128,128,20, 128,128,150);
  mask.addColorStop(0,'rgba(255,255,255,1)');
  mask.addColorStop(0.62,'rgba(255,255,255,.75)');
  mask.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = mask; g.fillRect(0,0,256,256);
  g.globalCompositeOperation = 'source-over';
  return c;
}

/* ---- volumetric shaft gradient (top bright -> bottom clear) ---- */
function drawShaft(){
  const c = makeCanvas(128,256), g = c.getContext('2d');
  g.clearRect(0,0,128,256);
  const vg = g.createLinearGradient(0,0,0,256);
  vg.addColorStop(0.0,'rgba(255,255,255,.95)');
  vg.addColorStop(0.35,'rgba(255,255,255,.55)');
  vg.addColorStop(0.8,'rgba(255,255,255,.10)');
  vg.addColorStop(1.0,'rgba(255,255,255,0)');
  g.fillStyle = vg; g.fillRect(0,0,128,256);
  g.globalCompositeOperation = 'destination-in';
  const hg = g.createLinearGradient(0,0,128,0);
  hg.addColorStop(0,'rgba(255,255,255,0)');
  hg.addColorStop(0.18,'rgba(255,255,255,.85)');
  hg.addColorStop(0.5,'rgba(255,255,255,1)');
  hg.addColorStop(0.82,'rgba(255,255,255,.85)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = hg; g.fillRect(0,0,128,256);
  g.globalCompositeOperation = 'source-over';
  return c;
}

/* ---- soft round sprites ---- */
function drawGlow(){
  const c = makeCanvas(128,128), g = c.getContext('2d');
  const gr = g.createRadialGradient(64,64,1, 64,64,63);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.25,'rgba(255,255,255,.75)');
  gr.addColorStop(0.6,'rgba(255,255,255,.18)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  return c;
}
function drawDot(){
  const c = makeCanvas(64,64), g = c.getContext('2d');
  const gr = g.createRadialGradient(32,32,1, 32,32,31);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.4,'rgba(255,255,255,.6)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64);
  return c;
}

const floorTex = canvasTexture(drawFloor(), 9, 32);
const wallTex  = canvasTexture(drawWall(), 10, 4);
const wallTexVault = canvasTexture(drawWall(), 7, 16); wallTexVault.color.set && 0;
const woodTex  = canvasTexture(drawWood(), 1.6, 1.6);
const glassTex = [
  canvasTexture(drawStainedGlass(11, true)),
  canvasTexture(drawStainedGlass(23, false)),
  canvasTexture(drawStainedGlass(47, true))
];
const roseTex   = canvasTexture(drawRose()); roseTex.wrapS = roseTex.wrapT = THREE.ClampToEdgeWrapping;
const patchTex  = canvasTexture(drawPatch()); patchTex.wrapS = patchTex.wrapT = THREE.ClampToEdgeWrapping;
const shaftTex  = canvasTexture(drawShaft()); shaftTex.wrapS = shaftTex.wrapT = THREE.ClampToEdgeWrapping;
const glowTex   = new THREE.CanvasTexture(drawGlow());
const dotTex    = new THREE.CanvasTexture(drawDot());

/* =====================================================================
   MATERIALS
   ===================================================================== */

/* pointed-arch holes via ExtrudeGeometry for the arcade panels */
function lancetShape(w, h){
  const s = new THREE.Shape();
  s.moveTo(-w/2, 0);
  s.quadraticCurveTo(-w/2, h*0.80, 0, h);
  s.quadraticCurveTo( w/2, h*0.80, w/2, 0);
  s.lineTo(-w/2, 0);
  return s;
}
function normalizeLancetUVs(geo, w, h){
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for(let i=0; i<uv.count; i++){
    uv.setXY(i, (pos.getX(i) + w/2) / w, pos.getY(i) / h);
  }
  uv.needsUpdate = true;
}

  const panelShape = new THREE.Shape();

  panelShape.lineTo(BAY/2, 3.5); panelShape.lineTo(-BAY/2, 3.5); panelShape.closePath();
  const hole = new THREE.Path();
  hole.moveTo(-2.0, 0.0);
  hole.quadraticCurveTo(-2.0, 2.35, 0, 3.05);
  hole.quadraticCurveTo( 2.0, 2.35, 2.0, 0.0);
  hole.lineTo(-2.0, 0.0);
  panelShape.holes.push(hole);
  const panelGeo = new THREE.ExtrudeGeometry(panelShape, { depth:0.42, bevelEnabled:false, curveSegments:18 });
  for(let b=0; b<N_BAYS; b++){

/* =====================================================================
   BUILD — ribbed vault
   ===================================================================== */
{
  // vault skin: pointed transverse profile + per-bay domical rise
  const segX = 20, segZ = 64, Z0 = -Z_END, ZLEN = 2*Z_END;
  const positions = [], uvs = [], indices = [];
  for(let iz=0; iz<=segZ; iz++){
    const z = Z0 + (iz/segZ)*ZLEN;
    const d = ((z + Z_END) % BAY + BAY) % BAY;
    const dome = 0.85 * Math.sin(Math.PI * d / BAY);
    for(let ix=0; ix<=segX; ix++){
      const x = -HALF_NAVE + (ix/segX)*2*HALF_NAVE;
      const y = VS + (VA - VS)*(1 - Math.pow(Math.abs(x)/HALF_NAVE, 1.62)) + dome;
      positions.push(x, y, z);
      uvs.push(ix/segX*8, iz/segZ*30);
    }
  }
  for(let iz=0; iz<segZ; iz++){
    for(let ix=0; ix<segX; ix++){
      const a = iz*(segX+1)+ix, b = a+1, c2 = a+segX+1, d2 = c2+1;
      indices.push(a, c2, b, b, c2, d2);
    }
  }
  const vg = new THREE.BufferGeometry();
  vg.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  vg.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  vg.setIndex(indices);
  vg.computeVertexNormals();
  const vault = new THREE.Mesh(vg, matVault);
  scene.add(vault);

  // transverse ribs at bay boundaries
  const ribPts = [];
  for(let i=0; i<=24; i++){
    const x = -HALF_NAVE + (i/24)*2*HALF_NAVE;
    ribPts.push(new THREE.Vector3(x, VS + (VA-VS)*(1 - Math.pow(Math.abs(x)/HALF_NAVE, 1.35)) - 0.02, 0));
  }
  const ribCurve = new THREE.CatmullRomCurve3(ribPts, false, 'centripetal');
  const ribGeo = new THREE.TubeGeometry(ribCurve, 40, 0.30, 10, false);
  for(let i=0; i<=N_BAYS; i++){
    const rib = new THREE.Mesh(ribGeo, matVault);
    rib.position.z = -Z_END + i*BAY;
    scene.add(rib);
  }
  // diagonal groin ribs (two per bay)
  for(let b=0; b<N_BAYS; b++){
    const zA = -Z_END + b*BAY, zB = zA + BAY, zM = (zA+zB)/2;
    for(const flip of [1, -1]){
      const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(flip*HALF_NAVE*0.98, VS+0.12, zA),
        new THREE.Vector3(0, VA + 2.35, zM),
        new THREE.Vector3(-flip*HALF_NAVE*0.98, VS+0.12, zB)
      );
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, 0.17, 8, false), matVault);
      scene.add(tube);
    }
  }
}

/* =====================================================================
   DUST — 6000 motes with beam-glint shader
   ===================================================================== */
const DUST_N = 6000;
let dustGeo, dustBase, dustPhase, dustMat;
{
  const rnd = mulberry32(20240612);
  dustBase = new Float32Array(DUST_N * 3);
  dustPhase = new Float32Array(DUST_N);
  const positions = new Float32Array(DUST_N * 3);
  const seeds = new Float32Array(DUST_N);
  for(let i=0; i<DUST_N; i++){
    const x = (rnd()*2-1) * 10.5;
    const y = rnd() * 14.5;
    const z = (rnd()*2-1) * 50;
    dustBase[i*3] = x; dustBase[i*3+1] = y; dustBase[i*3+2] = z;
    positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
    dustPhase[i] = rnd()*Math.PI*2;
    seeds[i] = rnd();
  }
  dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));

  dustMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:       { value: 0 },
      uBeamPlus:   { value: 0.9 },
      uBeamMinus:  { value: 0.04 },
      uSlant:      { value: 0.52 },
      uBeamColor:  { value: new THREE.Color(0xffc98a) },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uMap:        { value: dotTex }
    },
    vertexShader: `
      attribute float aSeed;
      uniform float uTime, uBeamPlus, uBeamMinus, uSlant, uPixelRatio;
      varying float vAlpha;
      varying vec3 vTint;

      float beamGlint(vec3 p, float side, float sideStrength, float slant){
        if(sideStrength < 0.02) return 0.0;
        vec3 d = vec3(-side * sin(slant), -cos(slant), 0.0);
        float g = 0.0;
        for(int i = 0; i < 5; i++){
          float z0;
          if(i == 0) z0 = -32.0; else if(i == 1) z0 = -16.0; else if(i == 2) z0 = 0.0; else if(i == 3) z0 = 16.0; else z0 = 32.0;
          vec3 o = vec3(side * 6.6, 11.5, z0);
          vec3 rel = p - o;
          float along = dot(rel, d);
          vec3 perpV = rel - d * along;
          float perp = length(perpV);
          float zmask = smoothstep(1.7, 0.65, abs(p.z - z0));
          float core  = smoothstep(1.45, 0.22, perp);
          float lenM  = smoothstep(16.5, 11.5, along) * smoothstep(-0.6, 1.6, along);
          g += core * zmask * lenM * (1.0 - along / 24.0);
        }
        return g * sideStrength;
      }

      void main(){
        vec3 p = position;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float dist = max(0.1, -mv.z);
        gl_PointSize = uPixelRatio * clamp(165.0 / dist, 1.1, 9.5) * (0.65 + 0.7 * aSeed);
        float plus  = beamGlint(p,  1.0, uBeamPlus,  uSlant);
        float minus = beamGlint(p, -1.0, uBeamMinus, uSlant);
        float glint = clamp(plus + minus, 0.0, 1.4);
        float twinkle = 0.6 + 0.4 * sin(uTime * 1.9 + aSeed * 43.7);
        // base ambience: faintly visible everywhere, blazing only inside beams
        vAlpha = (0.055 + 0.95 * glint) * twinkle;
        vec3 warm = vec3(1.0, 0.82 + 0.1 * aSeed, 0.55);
        vTint = mix(vec3(0.55, 0.60, 0.74), warm, clamp(glint, 0.0, 1.0));
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform sampler2D uMap;
      varying float vAlpha;
      varying vec3 vTint;
      void main(){
        vec4 tex = texture2D(uMap, gl_PointCoord);
        gl_FragColor = vec4(vTint, tex.a * vAlpha);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const points = new THREE.Points(dustGeo, dustMat);
  points.renderOrder = 8;
  points.frustumCulled = false;
  scene.add(points);
}

    patchPlusX:-2.8, patchPlusO:0.05, patchMinusX:3.0, patchMinusO:0.80, patchLen:1.28 }
];

let todAnim = { from: Object.assign({}, TOD[0]), to: Object.assign({}, TOD[0]), start: -10, dur: 1 };

const _ca = new THREE.Color(), _cb = new THREE.Color();
function mixHex(a, b, k){ _ca.setHex(a); _cb.setHex(b); _ca.lerp(_cb, k); return _ca.getHex(); }
function evaluateTOD(){
  const k = smooth01((simTime - todAnim.start) / todAnim.dur);
  const A = todAnim.from, B = todAnim.to, o = {};
  o.name = B.name;
  for(const key of Object.keys(B)){
    if(key === 'name') continue;
    if(key === 'sunPos'){ o.sunPos = [ lerp(A.sunPos[0],B.sunPos[0],k), lerp(A.sunPos[1],B.sunPos[1],k), lerp(A.sunPos[2],B.sunPos[2],k) ]; continue; }
    if(key.indexOf('Hex') === key.length - 3){ o[key] = mixHex(A[key], B[key], k); continue; }
    o[key] = lerp(A[key], B[key], k);
  }
  return o;
}
const _beamCol = new THREE.Color();
function snapshotCurrentParams(){
  const p = evaluateTOD();
  p.name = TOD[todIndex].name;
  // make snapshot colors static ints
  return Object.assign({}, p, { sunPos: p.sunPos.slice() });
}
function applyTOD(p){
  sun.position.set(p.sunPos[0], p.sunPos[1], p.sunPos[2]);
  sun.color.setHex(p.sunHex);
  sun.intensity = p.sunI;
  hemi.intensity = p.hemiI;
  amb.intensity = p.ambI;
  fill.intensity = p.fillI;
  _beamCol.setHex(p.beamHex);
  beamMatPlus.opacity = p.beamPlus;  beamMatMinus.opacity = p.beamMinus;
  beamCorePlus.opacity = p.beamPlus * 0.85; beamCoreMinus.opacity = p.beamMinus * 0.85;
  beamMatPlus.color.copy(_beamCol); beamMatMinus.color.copy(_beamCol);
  beamCorePlus.color.copy(_beamCol); beamCoreMinus.color.copy(_beamCol);
  patchMatPlus.opacity = p.patchPlusO; patchMatMinus.opacity = p.patchMinusO;
  patchMatPlus.color.copy(_beamCol); patchMatMinus.color.copy(_beamCol);
  patchPlus.position.x = p.patchPlusX;  patchPlus2.position.x = p.patchPlusX;
  patchMinus.position.x = p.patchMinusX;
  patchPlus.scale.set(1, 1, p.patchLen); patchPlus2.scale.set(1, 1, p.patchLen); patchMinus.scale.set(1, 1, p.patchLen);
  pillarGlowMatPlus.opacity = 0.42 * p.patchPlusO;
  pillarGlowMatMinus.opacity = 0.42 * p.patchMinusO;
  pillarGlowMatPlus.color.copy(_beamCol); pillarGlowMatMinus.color.copy(_beamCol);
  for(const m of beamMeshes){ m.rotation.z = -m.userData.side * p.slant; }
  dustMat.uniforms.uBeamPlus.value = p.beamPlus;
  dustMat.uniforms.uBeamMinus.value = p.beamMinus;
  dustMat.uniforms.uSlant.value = p.slant;
  dustMat.uniforms.uBeamColor.value.copy(_beamCol);
}

   ORGAN — deterministic pipe pulse sequence
   ===================================================================== */
let organPlaying = false;
let organStart = -1;
function organPlayToggle(){
  if(!organPlaying){
    organPlaying = true;
    organStart = simTime;
    showToast('The great organ sounds');
    organSwell(true);

    organPlaying = false;

function updateOrgan(){
  if(organPlaying){
    const s = simTime - organStart;
    for(const p of pipes){
      const waveFront = s * 8.5;
      const d = p.index - waveFront;
      let g = 1.15 * Math.exp(-d * d * 0.09);
      if(p.index < waveFront) g += 0.30 + 0.17 * Math.sin(s * 4.4 + p.index * 2.39);
      g += 0.05;
      p.mat.emissiveIntensity = clamp(g, 0.05, 1.5);
      p.mesh.scale.y = 1 + 0.035 * Math.min(g, 1.2);
    }
  } else {
    for(const p of pipes){ p.mat.emissiveIntensity = 0.045; p.mesh.scale.y = 1; }
  }
}
/* soft synthesized swell (no assets, fully optional) */
let audioCtx = null, organGain = null, organOscs = [];
function organSwell(on){
  try{
    if(on){
      if(audioCtx) { organSwell(false); }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      organGain = audioCtx.createGain();
      organGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      organGain.gain.exponentialRampToValueAtTime(0.085, audioCtx.currentTime + 1.8);
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 760; lp.Q.value = 4;
      organGain.connect(lp); lp.connect(audioCtx.destination);
      const freqs = [55, 82.41, 110, 138.59, 164.81, 220];
      organOscs = freqs.map((f, i) => {
        const o = audioCtx.createOscillator();
        o.type = i < 2 ? 'sine' : 'triangle';
        o.frequency.value = f;
        o.detune.value = (i * 7) % 11 - 5;
        const g = audioCtx.createGain(); g.gain.value = i < 2 ? 0.5 : 0.22;
        o.connect(g); g.connect(organGain);
        o.start();
        return o;
      });
    } else if(audioCtx){
      const ctx = audioCtx, gain = organGain, oscs = organOscs;
      audioCtx = null; organOscs = []; organGain = null;
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.setValueAtTime(Math.max(0.0001, gain.gain.value), ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.6);
      setTimeout(() => { oscs.forEach(o => { try{ o.stop(); }catch(e){} }); try{ ctx.close(); }catch(e){} }, 2200);
    }
  }catch(e){ /* audio unavailable — visuals still sing */ }
}

/* =====================================================================
   SIMULATION CORE — deterministic functions of simTime
   ===================================================================== */
let simTime = 0;
let activeScript = [];

function simStep(dt){
  const prev = simTime;
  simTime += dt;
  for(const ev of activeScript){
    if(!ev.fired && ev.t > prev && ev.t <= simTime + 1e-9){
      ev.fired = true;
      ev.fn();
    }
  }
}
function resetSim(){
  simTime = 0;
  todIndex = 0;
  todAnim = { from: Object.assign({}, TOD[0]), to: Object.assign({}, TOD[0]), start: -10, dur: 1 };
  organPlaying = false;
  organStart = -1;
  organSwell(false);
  activeScript = [];
  document.getElementById('todBadge').textContent = TOD[0].name;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), 2200);

/* per-frame visual update, driven purely by simTime */
const dustPosAttr = dustGeo.attributes.position;
function updateVisuals(){
  const t = simTime;
  // time of day blend
  applyTOD(evaluateTOD());
  // dust drift (analytic — deterministic)
  const arr = dustPosAttr.array;
  for(let i=0; i<DUST_N; i++){
    const i3 = i*3;
    const bx = dustBase[i3], by = dustBase[i3+1], bz = dustBase[i3+2];
    const ph = dustPhase[i];
    arr[i3]   = bx + Math.sin(t*0.21 + ph) * 0.6;
    arr[i3+1] = 0.4 + ((by + t*0.115) % 14.5);
    arr[i3+2] = bz + Math.cos(t*0.17 + ph*1.7) * 0.6;
  }
  dustPosAttr.needsUpdate = true;
  dustMat.uniforms.uTime.value = t;
  // candle flames
  for(const f of flames){
    const s = t * 1.0 + f.phase;
    const n1 = Math.sin(s*11.3) + 0.5*Math.sin(s*23.7 + 1.7);
    f.outer.scale.set(
      f.s * (1 + 0.17*n1),
      f.s * (1 + 0.30*Math.sin(s*14.1 + 0.9) + 0.13*Math.sin(s*29.7)),
      f.s * (1 + 0.17*n1)
    );
    f.outer.rotation.z = 0.16*Math.sin(s*8.3 + 0.4) + 0.085*Math.sin(s*19.1);
    f.inner.scale.set(
      f.s * (1 + 0.12*Math.sin(s*17.3 + 2.1)),
      f.s * (1 + 0.26*Math.sin(s*16.2 + 0.3)),
      f.s * (1 + 0.12*Math.sin(s*17.3 + 2.1))
    );
    f.inner.rotation.z = 0.13*Math.sin(s*9.6 + 1.2);
    const gs = f.s * (0.56 + 0.16*Math.sin(s*15.7 + f.phase*0.3) + 0.06*Math.sin(s*31.0));
    f.glow.scale.set(gs, gs, 1);
  }
  // warm light shimmer
  for(const L of candleLights){
    L.intensity = L.userData.base * (0.82 + 0.24*Math.abs(Math.sin(t*9.1 + L.userData.phase) * Math.sin(t*13.7 + L.userData.phase*1.3)));
  }
  updateOrgan();
  // bench exposure, refreshed every frame
  window.__bench.dustMotes = DUST_N;
  window.__bench.candles = flames.length;
  window.__bench.timeOfDay = TOD[todIndex].name;
  window.__bench.organPipes = pipes.length;
}

   SHOWCASE — 12 s deterministic camera film
   ===================================================================== */
const SHOWCASE_LEN = 12;
const showKeys = [
  { t: 0.0, p: [0, 2.7, -46.5], l: [0, 8.0, 8.0]  },
  { t: 2.6, p: [0, 3.0, -26.0], l: [0, 8.5, 18.0] },
  { t: 4.3, p: [2.5, 3.1, -9.0], l: [0, 9.5, 34.0] },
  { t: 6.1, p: [-2.7, 3.7, 10.5], l: [0, 10.0, 44.0] },
  { t: 8.2, p: [0.2, 5.3, 24.0], l: [0, 10.5, 49.0] },
  { t: 9.9, p: [1.9, 4.1, 12.0], l: [0, 11.0, 46.0] },
  { t: 12.0, p: [0, 3.4, -3.0], l: [0, 12.5, 44.0] }
];
const showcaseEvents = [
  { t: 4.2, fn: advanceTOD },   // morning -> noon: shafts swing steep
  { t: 8.0, fn: organPlayToggle }, // the organ awakens as we face the choir
  { t: 9.35, fn: advanceTOD }   // noon -> evening: warm western light floods in
];
function setShowcaseCamera(t){
  let i = 0;
  while(i < showKeys.length - 2 && t > showKeys[i+1].t) i++;
  const A = showKeys[i], B = showKeys[i+1];
  const u = smooth01((t - A.t) / (B.t - A.t));
  camera.position.set(lerp(A.p[0],B.p[0],u), lerp(A.p[1],B.p[1],u), lerp(A.p[2],B.p[2],u));
  const lk = new THREE.Vector3(lerp(A.l[0],B.l[0],u), lerp(A.l[1],B.l[1],u), lerp(A.l[2],B.l[2],u));
  camera.lookAt(lk);
}

/* composer with bloom (graceful fallback if post scripts missing) */
let composer = null;
try{
  if(THREE.EffectComposer && THREE.RenderPass && THREE.ShaderPass && THREE.UnrealBloomPass && THREE.GammaCorrectionShader){
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.62, 0.9, 0.78);
    composer.addPass(bloom);
    composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  }
}catch(e){ composer = null; }
function renderFrame(){
  if(composer) composer.render();
  else renderer.render(scene, camera);
}

function seek(t){
  t = clamp(t, 0, SHOWCASE_LEN);
  resetSim();
  activeScript = showcaseEvents.map(e => ({ t: e.t, fn: e.fn, fired: false }));
  const h = 1/120;
  let rem = t;
  while(rem > 1e-9){
    const s = Math.min(h, rem);
    simStep(s);
    rem -= s;
  }
  setShowcaseCamera(t);
  const wasControls = controls.enabled;
  controls.enabled = false;
  updateVisuals();
  renderFrame();
  controls.enabled = wasControls && !recording && !fpMode;
}
window.showcase = { duration: SHOWCASE_LEN, seek };

/* =====================================================================
   INPUT — WASD + pointer-lock mouse look (F), T, O
   ===================================================================== */
let fpMode = false;
let yaw = 0, pitch = 0;
const keysDown = {};
function floorHeightAt(x, z){
  if(z >= 38.1 && Math.abs(x) < 6.9) return 1.1;
  if(z > 36.2 && z < 38.1 && Math.abs(x) < 4.7) return clamp((z - 36.2) / 1.9, 0, 1) * 1.1;
  return 0;
}
function syncFPSFromCamera(){
  const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
  yaw = e.y; pitch = clamp(e.x, -1.35, 1.35);
}
function enterFP(){
  fpMode = true;
  syncFPSFromCamera();
  controls.enabled = false;
  document.getElementById('fpsHint').style.display = 'block';
  document.getElementById('crosshair').style.display = 'block';
  renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
}
function exitFP(){
  fpMode = false;
  document.exitPointerLock && document.exitPointerLock();
  document.getElementById('fpsHint').style.display = 'none';
  document.getElementById('crosshair').style.display = 'none';
  // hand back to orbit around a point ahead of the visitor
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const tgt = camera.position.clone().add(dir.multiplyScalar(7));
  tgt.y = clamp(tgt.y, 0.5, 16);
  controls.target.copy(tgt);
  controls.enabled = !recording;
  controls.update();
}
document.addEventListener('mousemove', (e) => {
  if(fpMode && document.pointerLockElement === renderer.domElement){
    yaw   -= e.movementX * 0.00215;
    pitch -= e.movementY * 0.00215;
    pitch  = clamp(pitch, -1.35, 1.35);
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  }
});
renderer.domElement.addEventListener('click', () => {
  if(fpMode && document.pointerLockElement !== renderer.domElement){
    renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
  }
});
window.addEventListener('keydown', (e) => {
  keysDown[e.code] = true;
  if(e.code === 'KeyT'){ advanceTOD(); }
  else if(e.code === 'KeyO'){ organPlayToggle(); }
  else if(e.code === 'KeyF'){ fpMode ? exitFP() : enterFP(); }
  if(['KeyW','KeyA','KeyS','KeyD','Space','ArrowUp','ArrowDown'].indexOf(e.code) >= 0) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keysDown[e.code] = false; });
function moveFPS(dt){
  const speed = (keysDown['ShiftLeft'] || keysDown['ShiftRight']) ? 9.5 : 5.2;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  let dx = 0, dz = 0;
  if(keysDown['KeyW'] || keysDown['ArrowUp'])   { dx -= sin; dz -= cos; }
  if(keysDown['KeyS'] || keysDown['ArrowDown']) { dx += sin; dz += cos; }
  if(keysDown['KeyA']) { dx -= cos; dz += sin; }
  if(keysDown['KeyD']) { dx += cos; dz -= sin; }
  const len = Math.hypot(dx, dz);
  if(len > 0.001){
    dx = dx/len * speed * dt; dz = dz/len * speed * dt;
    camera.position.x = clamp(camera.position.x + dx, -11.2, 11.2);
    camera.position.z = clamp(camera.position.z + dz, -50.3, 50.3);
  }
  const targetY = floorHeightAt(camera.position.x, camera.position.z) + 1.7;
  camera.position.y += (targetY - camera.position.y) * Math.min(1, dt * 10);
}

/* =====================================================================
   RECORD VIDEO — plays the showcase and saves a .webm
   ===================================================================== */
const recBtn = document.getElementById('recBtn');
let recording = false;
let recT = 0;
let mediaRecorder = null;
let recChunks = [];
recBtn.addEventListener('click', () => {
  if(recording) return;
  try{
    const stream = renderer.domElement.captureStream(60);
    let mime = 'video/webm;codecs=vp9';
    if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14000000 });
  }catch(e){
    showToast('Recording not supported in this browser');
    return;
  }
  recChunks = [];
  mediaRecorder.ondataavailable = ev => { if(ev.data && ev.data.size) recChunks.push(ev.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sancta-maria-showcase.webm';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recBtn.innerHTML = '&#9210;&nbsp; Record video';
    recBtn.classList.remove('recording');
    showToast('Showcase saved as .webm');
  };
  controls.enabled = false;
  if(fpMode) exitFP();
  recording = true;
  recT = 0;
  recBtn.textContent = 'Recording…';
  recBtn.classList.add('recording');
  mediaRecorder.start(250);
});

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
const clock = new THREE.Clock();
resetSim();
activeScript = [];   // interactive mode: no scripted events
updateVisuals();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(recording){
    recT += 1/60;
    window.showcase.seek(Math.min(recT, SHOWCASE_LEN));
    if(recT >= SHOWCASE_LEN + 1/60){
      recording = false;
      try{ mediaRecorder.stop(); }catch(e){}
      controls.enabled = !fpMode;
    }
    return;
  }

  simStep(dt);
  if(fpMode) moveFPS(dt);
  else controls.update();

  updateVisuals();
  renderFrame();
}
animate();

/* =====================================================================
   RESIZE
   ===================================================================== */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if(composer) composer.setSize(window.innerWidth, window.innerHeight);
  dustMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
});
</script>
</body>

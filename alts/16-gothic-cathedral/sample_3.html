<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurelia Cathedral — Cathedral of Light</title>
<style>
    html, body {
        margin: 0; padding: 0; overflow: hidden; background: #0e0c0a;
        font-family: Georgia, 'Times New Roman', serif; height: 100%;
    }
    #scene { display: block; width: 100vw; height: 100vh; }
    .ui { position: fixed; z-index: 10; color: #e8d9a8; user-select: none; -webkit-user-select: none; }
    #title {
        top: 18px; left: 24px; pointer-events: none;
        text-shadow: 0 2px 12px rgba(0,0,0,.9);
    }
    #title h1 {
        margin: 0; font-size: 21px; letter-spacing: 6px; font-weight: normal;
        color: #e8d9a8; text-transform: uppercase;
    }
    #title h1 span { color: #c9a94e; }
    #title p { margin: 4px 0 0; font-size: 11px; letter-spacing: 2px; color: #a89372; text-transform: uppercase; }
    #hint {
        bottom: 18px; left: 24px; font-size: 11.5px; letter-spacing: 1px;
        color: #b7a87e; background: rgba(12,10,8,.55); border: 1px solid rgba(201,169,78,.28);
        padding: 8px 14px; border-radius: 3px; backdrop-filter: blur(4px); pointer-events: none;
    }
    #hint b { color: #efd987; font-weight: normal; border: 1px solid rgba(239,217,135,.4); border-radius: 3px; padding: 0 4px; margin: 0 1px; }
    #timePill {
        top: 20px; left: 50%; transform: translateX(-50%);
        font-size: 12px; letter-spacing: 4px; text-transform: uppercase;
        color: #f0dfae; background: rgba(12,10,8,.55); border: 1px solid rgba(201,169,78,.35);
        padding: 7px 22px; border-radius: 20px; pointer-events: none;
    }
    #recordBtn {
        top: 16px; right: 20px; cursor: pointer; font-family: Georgia, serif;
        font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
        color: #1a140c; background: linear-gradient(180deg,#e3c878,#b98f3c);
        border: 1px solid #8a6a24; border-radius: 3px; padding: 10px 18px;
        box-shadow: 0 3px 14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5);
        transition: transform .15s, filter .15s;
    }
    #recordBtn:hover { filter: brightness(1.12); transform: translateY(-1px); }
    #recordBtn.recording { background: linear-gradient(180deg,#d0684e,#a83a28); color:#ffe9d8; border-color:#6e2418; }
    #crosshair {
        top: 50%; left: 50%; width: 5px; height: 5px; border-radius: 50%;
        background: rgba(240,223,174,.85); transform: translate(-50%,-50%);
        box-shadow: 0 0 6px rgba(0,0,0,.8); display: none; pointer-events: none;
    }
    #fpNote {
        bottom: 18px; left: 50%; transform: translateX(-50%); display: none;
        font-size: 12px; color: #efd987; background: rgba(12,10,8,.6);
        border: 1px solid rgba(201,169,78,.4); padding: 6px 18px; border-radius: 3px; letter-spacing: 1px;
    }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="ui" id="title"><h1>AURELIA <span>CATHEDRAL</span></h1><p>Cathedral of Light · Est. 1247</p></div>
<div class="ui" id="timePill">Morning</div>
<button class="ui" id="recordBtn">● Record Video</button>
<div class="ui" id="hint"><b>F</b> first-person &nbsp;<b>W A S D</b> move &nbsp;<b>T</b> time of day &nbsp;<b>O</b> organ &nbsp;·&nbsp; drag to orbit / scroll to zoom</div>
<div class="ui" id="crosshair"></div>
<div class="ui" id="fpNote">Click to look around · ESC releases mouse · F to exit</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ============================================================
   AURELIA CATHEDRAL — interactive gothic nave
   ============================================================ */

// ---------- renderer / scene / camera ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0c0a);
scene.fog = new THREE.FogExp2(0x0e0c0a, 0.0105);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 260);
camera.position.set(0, 3.6, -36.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6.0, 8.0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.56;
controls.minDistance = 1.5;
controls.maxDistance = 60;

// ---------- post-processing (bloom) with safe fallback ----------
let composer = null, bloomPass = null;
try {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.75, 0.78
    );
    composer.addPass(bloomPass);
} catch (e) {
    console.warn('Bloom unavailable, rendering directly.', e);
    composer = null;
}
function renderFrame() {
    if (composer) composer.render(); else renderer.render(scene, camera);
}

// ============================================================
// PROCEDURAL CANVAS TEXTURES
// ============================================================
function makeTex(w, h, fn, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    fn(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    t.encoding = THREE.sRGBEncoding;
    if (repeat) t.repeat.set(repeat[0], repeat[1]);
    return t;
}
function speckle(ctx, w, h, n, alpha, light) {
    for (let i = 0; i < n; i++) {
        const v = Math.random();
        ctx.fillStyle = light ? `rgba(255,250,235,${alpha * v})` : `rgba(0,0,0,${alpha * v})`;
        ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3);
    }
}
let seed = 7;
function srand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

const stoneTex = makeTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#8b857a'; ctx.fillRect(0, 0, w, h);
    seed = 11;
    for (let row = 0; row < 8; row++) {
        for (let col = -1; col < 4; col++) {
            const off = (row % 2) * 64;
            const g = 118 + srand() * 32;
            ctx.fillStyle = `rgb(${g + 8},${g + 2},${g - 8})`;
            ctx.fillRect(col * 128 + off + 2, row * 64 + 2, 124, 60);
        }
    }
    ctx.strokeStyle = 'rgba(52,48,42,0.9)'; ctx.lineWidth = 3;
    for (let row = 0; row <= 8; row++) { ctx.beginPath(); ctx.moveTo(0, row * 64); ctx.lineTo(w, row * 64); ctx.stroke(); }
    speckle(ctx, w, h, 1600, 0.22, false); speckle(ctx, w, h, 900, 0.14, true);
}, [6, 3]);

const darkStoneTex = makeTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#5f5a51'; ctx.fillRect(0, 0, w, h);
    seed = 29; speckle(ctx, w, h, 2200, 0.3, false); speckle(ctx, w, h, 700, 0.1, true);
    ctx.strokeStyle = 'rgba(30,27,23,0.8)'; ctx.lineWidth = 2;
    for (let y = 0; y < h; y += 86) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}, [8, 4]);

const floorTex = makeTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#7c776c'; ctx.fillRect(0, 0, w, h);
    seed = 47;
    for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
        const g = 112 + srand() * 26;
        ctx.fillStyle = `rgb(${g},${g - 4},${g - 13})`;
        ctx.fillRect(tx * 256 + 5, ty * 256 + 5, 246, 246);
        ctx.strokeStyle = 'rgba(201,169,78,0.28)'; ctx.lineWidth = 2;
        ctx.save(); ctx.translate(tx * 256 + 128, ty * 256 + 128); ctx.rotate(Math.PI / 4);
        ctx.strokeRect(-58, -58, 116, 116); ctx.restore();
    }
    ctx.strokeStyle = '#403c34'; ctx.lineWidth = 8;
    for (let i = 0; i <= 2; i++) {
        ctx.beginPath(); ctx.moveTo(0, i * 256); ctx.lineTo(w, i * 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i * 256, 0); ctx.lineTo(i * 256, h); ctx.stroke();
    }
    speckle(ctx, w, h, 1500, 0.2, false); speckle(ctx, w, h, 800, 0.12, true);
}, [5, 17]);

const woodTex = makeTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#503521'; ctx.fillRect(0, 0, w, h);
    seed = 83;
    for (let i = 0; i < 44; i++) {
        ctx.strokeStyle = `rgba(${20 + srand() * 40},${12 + srand() * 24},6,${0.35 + srand() * 0.4})`;
        ctx.lineWidth = 1 + srand() * 3;
        ctx.beginPath();
        const y = srand() * h;
        ctx.moveTo(0, y);
        for (let x = 0; x <= w; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.05 + srand() * 6) * 4);
        ctx.stroke();
    }
    speckle(ctx, w, h, 300, 0.15, true);
}, [2, 2]);

const carpetTex = makeTex(256, 512, (ctx, w, h) => {
    ctx.fillStyle = '#4d1a17'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#c9a94e'; ctx.lineWidth = 6; ctx.strokeRect(10, 0, w - 20, h);
    ctx.lineWidth = 2; ctx.strokeRect(24, 0, w - 48, h);
    ctx.save(); ctx.translate(w / 2, 0);
    for (let y = 42; y < h; y += 84) {
        ctx.save(); ctx.translate(0, y); ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = '#d4b25e'; ctx.lineWidth = 4; ctx.strokeRect(-22, -22, 44, 44);
        ctx.strokeStyle = '#7e2b21'; ctx.lineWidth = 3; ctx.strokeRect(-11, -11, 22, 22);
        ctx.restore();
    }
    ctx.restore();
}, [1, 7]);

const JEWELS = [
    ['#8e1f2f', '#c53a2e', '#d4a017', '#5a1530'],   // ruby / ember / amber
    ['#1f3f8e', '#2f6fb5', '#1f7a4d', '#7d4f9e'],   // sapphire / teal / emerald / violet
    ['#5a2a86', '#a83232', '#c9a227', '#274c9c']    // violet / garnet / gold / blue
];
function drawStainedGlass(ctx, w, h, paletteIdx) {
    const pal = JEWELS[paletteIdx % JEWELS.length];
    ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, w, h);
    seed = 101 + paletteIdx * 37;
    const pad = 20, cols = 4, rows = 7;
    const cw = (w - pad * 2) / cols, rh = (h - pad * 2) / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const x = pad + c * cw, y = pad + r * rh;
        const col = pal[(c * 3 + r * 5 + paletteIdx) % pal.length];
        const g = ctx.createLinearGradient(x, y, x + cw, y + rh);
        g.addColorStop(0, col); g.addColorStop(0.5, shade(col, 1.35)); g.addColorStop(1, shade(col, 0.7));
        ctx.fillStyle = g; ctx.fillRect(x + 3, y + 3, cw - 6, rh - 6);
        // diamond tracery inside the cell
        if ((r + c) % 2 === 0) {
            ctx.strokeStyle = '#14110e'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(x + cw / 2, y + 5); ctx.lineTo(x + cw - 5, y + rh / 2);
            ctx.lineTo(x + cw / 2, y + rh - 5); ctx.lineTo(x + 5, y + rh / 2);
            ctx.closePath(); ctx.stroke();
        }
        ctx.strokeStyle = '#14110e'; ctx.lineWidth = 5; ctx.strokeRect(x + 2, y + 2, cw - 4, rh - 4);
    }
    // leadcame border
    ctx.strokeStyle = '#100e0b'; ctx.lineWidth = 22; ctx.strokeRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(201,169,78,0.6)'; ctx.lineWidth = 2.5; ctx.strokeRect(13, 13, w - 26, h - 26);
    // glass sparkle
    for (let i = 0; i < 90; i++) {
        ctx.fillStyle = `rgba(255,255,255,${0.1 + srand() * 0.28})`;
        ctx.fillRect(srand() * w, srand() * h, 1.5, 1.5);
    }
    // soft top highlight
    const hl = ctx.createRadialGradient(w / 2, h * 0.25, 10, w / 2, h * 0.25, h * 0.75);
    hl.addColorStop(0, 'rgba(255,255,255,0.18)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl; ctx.fillRect(0, 0, w, h);
}
function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.min(255, r * f); g = Math.min(255, g * f); b = Math.min(255, b * f);
    return `rgb(${r | 0},${g | 0},${b | 0})`;
}
const stainedTex = [0, 1, 2].map(i => makeTex(256, 512, (ctx, w, h) => drawStainedGlass(ctx, w, h, i)));

const roseTex = makeTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#0b0e14'; ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    const pal = ['#8e1f2f', '#1f3f8e', '#d4a017', '#1f7a4d', '#5a2a86'];
    seed = 913;
    // outer panel ring
    for (let i = 0; i < 24; i++) {
        const a0 = (i / 24) * Math.PI * 2, a1 = ((i + 1) / 24) * Math.PI * 2;
        ctx.fillStyle = pal[i % pal.length];
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a0) * 190, cy + Math.sin(a0) * 190);
        ctx.arc(cx, cy, 226, a0, a1); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#14110e'; ctx.lineWidth = 6; ctx.stroke();
    }
    // petal ring
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
        const g = ctx.createLinearGradient(70, 0, 190, 0);
        const base = pal[(i * 2 + 1) % pal.length];
        g.addColorStop(0, shade(base, 1.4)); g.addColorStop(1, shade(base, 0.75));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(132, 0, 56, 33, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#14110e'; ctx.lineWidth = 7; ctx.stroke();
        ctx.restore();
    }
    // tracery rings
    ctx.strokeStyle = '#14110e';
    [[64, 10], [92, 8], [190, 9], [226, 12]].forEach(([r, lw]) => {
        ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(201,169,78,0.55)'; ctx.lineWidth = 2.5;
    [78, 208].forEach(r => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); });
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        ctx.strokeStyle = '#14110e'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 64, cy + Math.sin(a) * 64);
        ctx.lineTo(cx + Math.cos(a) * 226, cy + Math.sin(a) * 226); ctx.stroke();
    }
    // central medallion
    const mg = ctx.createRadialGradient(cx, cy, 4, cx, cy, 62);
    mg.addColorStop(0, '#e04b3a'); mg.addColorStop(0.6, '#8e1f2f'); mg.addColorStop(1, '#4d0e18');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c9a94e'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#e9c86a';
    ctx.fillRect(cx - 6, cy - 34, 12, 68); ctx.fillRect(cx - 24, cy - 14, 48, 12);
});

const glowTex = makeTex(128, 128, (ctx, w, h) => {
    const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,240,200,0.7)');
    g.addColorStop(0.6, 'rgba(255,200,110,0.18)'); g.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});

const beamTex = makeTex(128, 256, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const hz = ctx.createLinearGradient(0, 0, w, 0);
    hz.addColorStop(0, 'rgba(255,255,255,0)'); hz.addColorStop(0.5, 'rgba(255,255,255,1)'); hz.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hz; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'destination-in';
    const vt = ctx.createLinearGradient(0, 0, 0, h);
    vt.addColorStop(0, 'rgba(255,255,255,0.95)'); vt.addColorStop(0.35, 'rgba(255,255,255,0.5)'); vt.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = vt; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
});

const patchTex = makeTex(256, 384, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const pal = ['#a03030', '#2a4a9e', '#c09a28', '#1f7a4d', '#6a3a9e', '#a05820'];
    ctx.save();
    // lancet silhouette clip
    ctx.beginPath();
    ctx.moveTo(18, h); ctx.lineTo(18, 110);
    ctx.quadraticCurveTo(18, 34, w / 2, 6);
    ctx.quadraticCurveTo(w - 18, 34, w - 18, 110);
    ctx.lineTo(w - 18, h); ctx.closePath(); ctx.clip();
    const cols = 4, rows = 7, cw = w / cols, rh = h / rows;
    seed = 331;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        ctx.fillStyle = pal[(r * 4 + c * 7 + 3) % pal.length];
        ctx.fillRect(c * cw, r * rh, cw, rh);
        ctx.strokeStyle = 'rgba(10,10,10,0.85)'; ctx.lineWidth = 5; ctx.strokeRect(c * cw, r * rh, cw, rh);
    }
    ctx.restore();
    // feathered edge mask
    ctx.globalCompositeOperation = 'destination-in';
    const g = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w * 0.72);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.75, 'rgba(255,255,255,0.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
});

const clothTex = makeTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#e9e2d0'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#c9a94e'; ctx.fillRect(0, h - 34, w, 8); ctx.fillRect(0, h - 16, w, 4);
    ctx.fillStyle = '#7e1e14';
    ctx.fillRect(w / 2 - 9, 30, 18, 130); ctx.fillRect(w / 2 - 46, 72, 92, 18);
    ctx.strokeStyle = '#c9a94e'; ctx.lineWidth = 3; ctx.strokeRect(w / 2 - 9, 30, 18, 130);
    speckle(ctx, w, h, 200, 0.08, false);
});

// ============================================================
// MATERIALS
// ============================================================
const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.94, metalness: 0.02, color: 0xbdb6a8 });
const darkStoneMat = new THREE.MeshStandardMaterial({ map: darkStoneTex, roughness: 0.97, metalness: 0.0, color: 0x8f8a80, side: THREE.DoubleSide });
const ribMat = new THREE.MeshStandardMaterial({ color: 0xa8a294, roughness: 0.85, metalness: 0.03 });
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55, metalness: 0.08, color: 0xb9b3a6 });
const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.78, metalness: 0.02, color: 0xa9835e });
const carpetMat = new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 0.96, metalness: 0.0, color: 0xffffff });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xc4a052, roughness: 0.28, metalness: 0.9, emissive: 0x2a1e06, emissiveIntensity: 0.5 });
const brassDark = new THREE.MeshStandardMaterial({ color: 0x8a6c2e, roughness: 0.4, metalness: 0.85 });
const ironMat = new THREE.MeshStandardMaterial({ color: 0x2c2a26, roughness: 0.6, metalness: 0.7 });
const candleWaxMat = new THREE.MeshStandardMaterial({ color: 0xe9e0c8, roughness: 0.55, emissive: 0x301c08, emissiveIntensity: 0.55 });
const clothMat = new THREE.MeshStandardMaterial({ map: clothTex, roughness: 0.9, color: 0xffffff });
const altarWhite = new THREE.MeshStandardMaterial({ color: 0xe6dfd0, roughness: 0.85 });

// ============================================================
// LIGHTS
// ============================================================
const hemi = new THREE.HemisphereLight(0x3a3630, 0x0b0906, 0.55);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x241f18, 0.7);
scene.add(amb);

const sun = new THREE.DirectionalLight(0xffd9b0, 1.3);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -55;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 260;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.035;
scene.add(sun); scene.add(sun.target);

function archPoints(halfSpan, spring, apex, segments) {
    // pointed profile sampled left→right (in local XY)
    const pts = [];
    const lx = -halfSpan, rx = halfSpan, rise = apex - spring;
    for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const it = 1 - t;
        // quadratic bezier left half: P0(lx,spring) C(lx, spring+rise*0.78) P1(0,apex)
        const x = it * it * lx + 2 * it * t * lx + t * t * 0;
        const y = it * it * spring + 2 * it * t * (spring + rise * 0.78) + t * t * apex;
        pts.push(new THREE.Vector3(x, y, 0));
    }
    for (let i = 1; i <= segments; i++) {
        const t = i / segments;
        const it = 1 - t;
        const x = it * it * 0 + 2 * it * t * rx + t * t * rx;
        const y = it * it * apex + 2 * it * t * (spring + rise * 0.78) + t * t * spring;
        pts.push(new THREE.Vector3(x, y, 0));
    }
    return pts;
}
function addRib(halfSpan, spring, apex, z, radius, plane) {
    const pts = archPoints(halfSpan, spring, apex, 12);
    const mapped = pts.map(p => plane === 'z'
        ? new THREE.Vector3(p.x, p.y, z)
        : new THREE.Vector3(z, p.y, p.x));
    const curve = new THREE.CatmullRomCurve3(mapped);
    const geo = new THREE.TubeGeometry(curve, 30, radius, 7, false);
    const mesh = new THREE.Mesh(geo, ribMat);
    scene.add(mesh);
    return mesh;
}

(function buildVault() {

    s.moveTo(-hs, spring - 0.55);
    s.lineTo(-hs, spring);

    s.quadraticCurveTo(hs, spring + VAULT_RISE * 0.78, hs, spring);
    s.lineTo(hs, spring - 0.55);

    const geo = new THREE.ExtrudeGeometry(s, { depth: 84.4, bevelEnabled: false, curveSegments: 28 });

function lancetShape(w, h) {
    const s = new THREE.Shape();
    const hs = w / 2, hsTop = h * 0.60;
    s.moveTo(-hs, 0); s.lineTo(-hs, hsTop);
    s.quadraticCurveTo(-hs, h * 0.88, 0, h);
    s.quadraticCurveTo(hs, h * 0.88, hs, hsTop);
    s.lineTo(hs, 0); s.closePath();
    return s;
}
const windowMats = stainedTex.map((t, i) => new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide }));
const windowMatsDim = stainedTex.map(t => new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide, color: 0x8f8a84 }));

function addWindow(x, y, z, w, h, rotY, paletteIdx, dim) {
    const geo = new THREE.ShapeGeometry(lancetShape(w, h), 20);
    const mat = dim ? windowMatsDim[paletteIdx % 3] : windowMats[paletteIdx % 3];
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z); mesh.rotation.y = rotY;
    scene.add(mesh);
    // stone surround (thin frame)
    const frame = new THREE.Mesh(new THREE.ShapeGeometry(lancetShape(w + 0.5, h + 0.4), 12),
        new THREE.MeshStandardMaterial({ color: 0x57534a, roughness: 0.9, side: THREE.DoubleSide }));
    frame.position.set(x, y - 0.12, z - Math.sin(rotY) * 0.06); // slightly proud
    frame.rotation.y = rotY;
    frame.scale.set(1.0, 1.0, 1.0);
    // keep frame behind glass relative to viewer: offset opposite facing dir
    frame.position.x = x - Math.sin(rotY) * 0.07;
    frame.position.z = z - Math.cos(rotY) * 0.07;
    scene.add(frame);
    return mesh;
}

    centerSpire.position.set(0, baseY + 7.0, zCase); centerSpire.rotation.y = Math.PI / 4; scene.add(centerSpire);
    // carved impost board
    const impost = new THREE.Mesh(new THREE.BoxGeometry(13.2, 0.42, 1.5),
        new THREE.MeshStandardMaterial({ map: woodTex, color: 0xc8a050, roughness: 0.4, metalness: 0.35, emissive: 0x241604, emissiveIntensity: 0.7 }));
    impost.position.set(0, baseY + 1.05, zCase - 0.15); scene.add(impost);

    // pipes — three flats, arched facade
    const silver = new THREE.MeshStandardMaterial({ color: 0xcfc8b4, roughness: 0.22, metalness: 0.92, emissive: 0xff8c3a, emissiveIntensity: 0.08 });
    const goldPipe = new THREE.MeshStandardMaterial({ color: 0xb98d4a, roughness: 0.26, metalness: 0.9, emissive: 0xff8c3a, emissiveIntensity: 0.08 });
    function pipeRow(cx, count, spread, hMax, hMin, zOff, palette) {
        for (let i = 0; i < count; i++) {
            const f = count === 1 ? 0 : (i / (count - 1)) * 2 - 1;   // -1..1
            const arch = Math.cos(f * Math.PI * 0.5);                // 1 center → 0 edges
            const h = hMin + (hMax - hMin) * Math.pow(arch, 1.35);
            const r = 0.135 + 0.085 * arch;
            const p = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.06, h, 12),
                (palette(i) ? silver : goldPipe).clone());
            p.position.set(cx + f * spread, baseY + 1.26 + h / 2, zPipe + (zOff || 0));
            p.castShadow = true;
            // mouth (dark slit)
            const mouth = new THREE.Mesh(new THREE.BoxGeometry(r * 1.15, h * 0.14, 0.02), ironMat);
            mouth.position.set(p.position.x, baseY + 1.55 + h * 0.18, p.position.z - r - 0.001);
            scene.add(mouth);
            scene.add(p);
            organPipes.push(p);
        }
    }
    pipeRow(0, 15, 2.35, 5.6, 2.1, 0, i => i % 2 === 0);        // center flat   (15)
    pipeRow(-3.62, 25, 0.95, 3.4, 1.5, 0.28, i => i % 3 !== 1);  // left wing     (25)
    pipeRow(3.62, 25, 0.95, 3.4, 1.5, 0.28, i => i % 3 !== 1);   // right wing    (25)
    pipeRow(0, 9, 1.55, 1.45, 0.8, -0.42, i => i % 2 === 1);     // positif row   (9)
    // 65 pipes total
    console.log('Organ pipes:', organPipes.length);
})();

function flameGeometry() {

    profile.forEach(([x, y]) => pts.push(new THREE.Vector2(x, y)));
    return new THREE.LatheGeometry(pts, 10);
}
const flameGeo = flameGeometry();
const flameMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
        varying vec2 vUv;
        void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
        varying vec2 vUv;
        void main(){
            vec3 base = vec3(1.0, 0.30, 0.02);
            vec3 mid  = vec3(1.0, 0.62, 0.10);
            vec3 tip  = vec3(1.0, 0.96, 0.62);
            vec3 c = mix(base, mid, smoothstep(0.0, 0.45, vUv.y));
            c = mix(c, tip, smoothstep(0.45, 1.0, vUv.y));
            gl_FragColor = vec4(c * 1.7, 0.92);
        }`
});

function addCandle(x, floorY, stickH, candleH, r, stickMat) {
    if (stickH > 0.01) {
        const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.095, stickH, 10), stickMat || goldMat);
        stick.position.set(x, floorY + stickH / 2, 0); // z filled by group
        stick.position.z = addCandle._z;
        stick.castShadow = true;
        scene.add(stick);
        const dish = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.13, 0.06, 10), stickMat || goldMat);
        dish.position.set(x, floorY + stickH + 0.03, addCandle._z);
        scene.add(dish);
    }
    const z = addCandle._z;
    const wax = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.08, candleH, 12), candleWaxMat);
    wax.position.set(x, floorY + stickH + 0.06 + candleH / 2, z);
    scene.add(wax);
    const flame = new THREE.Mesh(flameGeo, flameMat);
    flame.position.set(x, floorY + stickH + 0.06 + candleH, z);
    flame.userData.phase = Math.random() * Math.PI * 2;
    flame.userData.baseX = x; flame.userData.baseZ = z;
    scene.add(flame);
    const glow = new THREE.Sprite(glowSpriteMat);
    glow.position.copy(flame.position); glow.position.y += 0.13;
    glow.scale.set(0.85, 0.85, 1);
    scene.add(glow);
    flame.userData.glow = glow;
    flames.push(flame);
    return flame;
}

// beam glow in the dust (kept just above the floor so visible in shafts)
function beamFactor(px, py, pz) {
    let best = 0;
    for (let b = 0; b < beamState.length; b++) {
        const B = beamState[b];
        const ox = px - B.origin.x, oy = py - B.origin.y, oz = pz - B.origin.z;
        const t = ox * B.dir.x + oy * B.dir.y + oz * B.dir.z;
        if (t <= 0 || t >= B.len) continue;
        const cx = B.origin.x + B.dir.x * t, cy = B.origin.y + B.dir.y * t, cz = B.origin.z + B.dir.z * t;
        const dx = px - cx, dy = py - cy, dz = pz - cz;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const bt = t / B.len;
        const rad = 0.55 + bt * 2.35;
        let f = 1 - dist / rad;
        if (f <= 0) continue;
        f = f * f * (3 - 2 * f);
        f *= Math.sin(Math.PI * Math.min(1, bt * 1.12));
        if (f > best) best = f;
    }
    return best * (beamState[0].strength);
}
function updateDust(t) {
    for (let i = 0; i < DUST_COUNT; i++) {
        const s = dustSeed[i];
        let y = dustBase[i * 3 + 1] - t * 0.055;
        y = 0.25 + (((y % 11.2) + 11.2) % 11.2);
        const x = dustBase[i * 3] + Math.sin(t * 0.13 + s * 1.7) * 0.42;
        const z = dustBase[i * 3 + 2] + Math.cos(t * 0.11 + s * 2.3) * 0.42;
        dustPos[i * 3] = x; dustPos[i * 3 + 1] = y; dustPos[i * 3 + 2] = z;
        dustGlow[i] = beamFactor(x, y, z);
    }
    dustGeo.attributes.position.needsUpdate = true;
    dustGeo.attributes.aGlow.needsUpdate = true;
}

function sunSample(s) {
    const out = { pos: new THREE.Vector3(), col: new THREE.Color(), int: 1, hemi: 0.5, patch: 0.7 };
    let a, b, f;
    if (s <= 0.5) { a = SUN_KEYS.morning; b = SUN_KEYS.noon; f = smooth01(s / 0.5); }
    else { a = SUN_KEYS.noon; b = SUN_KEYS.evening; f = smooth01((s - 0.5) / 0.5); }
    out.pos.lerpVectors(a.pos, b.pos, f);
    out.col.lerpColors(a.col, b.col, f);
    out.int = a.int + (b.int - a.int) * f;
    out.hemi = a.hemi + (b.hemi - a.hemi) * f;

}

function playOrganChord() {
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.0001, ctx.currentTime);
        master.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.5);
        master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 5.2);
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 4;
        master.connect(lp); lp.connect(ctx.destination);
        [65.41, 130.81, 196.0, 261.63, 329.63, 392.0].forEach((fr, i) => {
            const o = ctx.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle'; o.frequency.value = fr;
            const g = ctx.createGain(); g.gain.value = i < 2 ? 0.32 : 0.2;
            o.connect(g); g.connect(master);
            o.start(ctx.currentTime); o.stop(ctx.currentTime + 5.4);
        });
        setTimeout(() => { try { ctx.close(); } catch (e) {} }, 6000);
    } catch (e) { /* audio unavailable */ }
}

function updateBench() {
    window.__bench.dustMotes = dustPoints;
    window.__bench.candles = flames;
    window.__bench.organPipes = organPipes;
    window.__bench.timeOfDay = timeOfDayLabel();
    document.getElementById('timePill').textContent = timeOfDayLabel();
}

// ============================================================
// MAIN LOOP
// ============================================================
let simTime = 0;
const clock = new THREE.Clock();
function updateWorld() {
    updateLighting();
    updateDust(simTime);
    updateFlames(simTime);
    updateOrgan(simTime);
    updateBench();
}
function animate() {
    requestAnimationFrame(animate);
    if (recording) {
        const t = (performance.now() - recStart) / 1000;
        if (t >= DURATION) {
            applyShowcase(DURATION);
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        } else {
            applyShowcase(t);
        }
        return;
    }
    const dt = Math.min(0.05, clock.getDelta());
    simTime += dt;
    currentSun += (targetSun - currentSun) * Math.min(1, dt * 1.8);
    if (Math.abs(targetSun - currentSun) < 0.0008) currentSun = targetSun;
    if (fpMode) updateFP(dt); else controls.update();
    updateWorld();
    renderFrame();
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
});

updateWorld();
animate();
</script>
</body>

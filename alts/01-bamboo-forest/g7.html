<style>

  .btn:hover { background:rgba(50,70,40,.7); border-color:#ffe9b0; color:#ffe9b0; }

    top:50%; left:50%; transform:translate(-50%,-50%); color:#fff;

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   MISTVEIL — The Bamboo Path
   A misty bamboo forest with a winding flagstone path, stone
   lantern and wooden gate. Spring-cantilever stalks, travelling
   gust waves, god-ray shafts, drifting motes.
   ============================================================ */

// ---------- deterministic RNG (layout is reproducible) ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = mulberry32(20240517);
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const smoothstep = (a,b,x) => { const t = clamp((x-a)/(b-a), 0, 1); return t*t*(3-2*t); };

// ---------- top-level scene / camera / renderer / controls ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb6c8aa, 0.026);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 400);
camera.position.set(12.5, 4.6, 26.5);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 11.5);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------- sun & lights ----------
const SUN_POS = new THREE.Vector3(26, 37, -18);
const TO_SUN  = SUN_POS.clone().normalize();
const SUN_WARM = 0xffe2b0;

const sun = new THREE.DirectionalLight(SUN_WARM, 2.7);
sun.position.copy(SUN_POS);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -46; sun.shadow.camera.right = 46;
sun.shadow.camera.top  =  46; sun.shadow.camera.bottom = -46;
sun.shadow.camera.near = 4;   sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.4;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xd4e6c4, 0x2c3524, 0.85);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x9db48c, 0.35);
scene.add(amb);

// ---------- procedural canvas textures ----------
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
const noiseOn = (ctx, w, h, n, alpha, light) => {
  for (let i=0; i<n; i++) {
    const v = light ? 200+R()*55 : R()*70;
    ctx.fillStyle = `rgba(${v|0},${v|0},${(v*0.9)|0},${alpha})`;
    ctx.fillRect(R()*w, R()*h, 1+R()*3, 1+R()*3);
  }
};

const NODE_T = [...Array(8)].map((_,i) => (i+1)/9);

const stalkTex = makeCanvas(64, 512, (ctx,w,h) => {
  ctx.fillStyle = '#f4f4ee'; ctx.fillRect(0,0,w,h);
  // vertical fibre streaks
  for (let i=0; i<46; i++) {
    ctx.strokeStyle = `rgba(120,120,110,${0.06 + R()*0.12})`;
    ctx.lineWidth = 0.6 + R()*1.8;
    const x = R()*w;
    ctx.beginPath(); ctx.moveTo(x, 0);
    ctx.bezierCurveTo(x+(R()-0.5)*6, h*0.33, x+(R()-0.5)*6, h*0.66, x+(R()-0.5)*4, h);
    ctx.stroke();
  }
  // node rings (geometry bulges at NODE_T from base; uv.y=0 at base -> canvas y = (1-t)*h)
  for (const t of NODE_T) {
    const y = (1 - t) * h;
    const grad = ctx.createLinearGradient(0, y-7, 0, y+7);
    grad.addColorStop(0, 'rgba(70,72,60,0)');
    grad.addColorStop(0.5, 'rgba(70,72,60,0.55)');
    grad.addColorStop(1, 'rgba(70,72,60,0)');
    ctx.fillStyle = grad; ctx.fillRect(0, y-7, w, 14);
  }
  const gradB = ctx.createLinearGradient(0, h, 0, h-90);
  gradB.addColorStop(0,'rgba(80,80,66,0.4)'); gradB.addColorStop(1,'rgba(80,80,66,0)');
  ctx.fillStyle = gradB; ctx.fillRect(0, h-90, w, 90);
});

const leafTex = makeCanvas(128, 128, (ctx,w,h) => {
  ctx.clearRect(0,0,w,h);
  const grad = ctx.createLinearGradient(0, 8, 0, h-4);
  grad.addColorStop(0, '#7d9a44'); grad.addColorStop(0.55,'#55702f'); grad.addColorStop(1,'#37481f');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(w/2, 6);
  ctx.bezierCurveTo(w*0.86, h*0.32, w*0.78, h*0.72, w/2, h-4);
  ctx.bezierCurveTo(w*0.22, h*0.72, w*0.14, h*0.32, w/2, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(220,235,170,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(w/2, 10); ctx.lineTo(w/2, h-8); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(220,235,170,0.35)';
  for (let i=1; i<7; i++) {
    const y = 14 + i*15;
    ctx.beginPath(); ctx.moveTo(w/2, y); ctx.lineTo(w/2-34, y+18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/2, y); ctx.lineTo(w/2+34, y+18); ctx.stroke();
  }
});
leafTex.wrapS = leafTex.wrapT = THREE.ClampToEdgeWrapping;

const stoneTex = makeCanvas(256, 256, (ctx,w,h) => {
  ctx.fillStyle = '#8e918a'; ctx.fillRect(0,0,w,h);
  noiseOn(ctx, w, h, 900, 0.35, false); noiseOn(ctx, w, h, 500, 0.3, true);
  // cracks
  ctx.strokeStyle = 'rgba(50,52,48,0.5)'; ctx.lineWidth = 1.5;
  for (let i=0; i<5; i++) {
    ctx.beginPath(); let x = R()*w, y = R()*h; ctx.moveTo(x,y);
    for (let j=0; j<5; j++) { x += (R()-0.5)*70; y += (R()-0.5)*70; ctx.lineTo(x,y); }
    ctx.stroke();
  }
  // moss blotches
  for (let i=0; i<9; i++) {
    const x = R()*w, y = R()*h, r = 14+R()*34;
    const g = ctx.createRadialGradient(x,y,1,x,y,r);
    g.addColorStop(0,'rgba(96,128,62,0.75)'); g.addColorStop(1,'rgba(96,128,62,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
});

const groundTex = makeCanvas(512, 512, (ctx,w,h) => {
  ctx.fillStyle = '#47523a'; ctx.fillRect(0,0,w,h);
  for (let i=0; i<260; i++) {
    const x=R()*w, y=R()*h, r=6+R()*36;
    const g = ctx.createRadialGradient(x,y,1,x,y,r);
    const c = R()<0.5 ? '80,96,52' : '52,62,40';
    g.addColorStop(0,`rgba(${c},0.5)`); g.addColorStop(1,`rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  noiseOn(ctx, w, h, 2500, 0.35, false); noiseOn(ctx, w, h, 1400, 0.22, true);
});
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.repeat.set(11, 11);

const woodTex = makeCanvas(256, 256, (ctx,w,h) => {
  ctx.fillStyle = '#57432f'; ctx.fillRect(0,0,w,h);
  for (let p=0; p<4; p++) {
    const x0 = p*64;
    ctx.fillStyle = `rgba(${30+R()*30|0},${22+R()*20|0},${12+R()*14|0},0.55)`;
    ctx.fillRect(x0, 0, 64, h);
    ctx.strokeStyle = 'rgba(20,14,8,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, h); ctx.stroke();
    for (let i=0; i<16; i++) {
      ctx.strokeStyle = `rgba(30,22,14,${0.25+R()*0.4})`; ctx.lineWidth = 0.8+R()*1.4;
      const x = x0 + 6 + R()*52;
      ctx.beginPath(); ctx.moveTo(x, 0);
      ctx.bezierCurveTo(x+(R()-0.5)*10, h*0.33, x+(R()-0.5)*10, h*0.66, x+(R()-0.5)*8, h);
      ctx.stroke();
    }
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;

const plaqueTex = makeCanvas(128, 128, (ctx,w,h) => {
  ctx.fillStyle = '#3a2c1e'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#1d150c'; ctx.lineWidth = 8; ctx.strokeRect(4,4,w-8,h-8);
  ctx.strokeStyle = '#e8e2ce'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(w/2, h/2, 34, -0.4, Math.PI*1.55); ctx.stroke();
});

const mistTex = makeCanvas(256, 256, (ctx,w,h) => {
  const g = ctx.createRadialGradient(w/2,h/2,4,w/2,h/2,w/2);
  g.addColorStop(0,'rgba(255,255,255,0.85)');
  g.addColorStop(0.55,'rgba(255,255,255,0.32)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
});
const dustTex = makeCanvas(64, 64, (ctx,w,h) => {
  const g = ctx.createRadialGradient(32,32,1,32,32,30);
  g.addColorStop(0,'rgba(255,250,225,1)'); g.addColorStop(0.4,'rgba(255,250,225,0.5)'); g.addColorStop(1,'rgba(255,250,225,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
});
const glowTex = makeCanvas(128, 128, (ctx,w,h) => {
  const g = ctx.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(255,244,205,1)'); g.addColorStop(0.35,'rgba(255,240,190,0.5)'); g.addColorStop(1,'rgba(255,240,190,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
});
const skyTex = makeCanvas(64, 512, (ctx,w,h) => {
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0.0,'#cddcc0'); g.addColorStop(0.45,'#b6c8aa'); g.addColorStop(0.8,'#a3b294'); g.addColorStop(1,'#93a284');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
});

// ---------- sky dome ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(240, 24, 16),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })
);
scene.add(sky);

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(90, 48),
  new THREE.MeshStandardMaterial({ map: groundTex, color: 0xbfc8ae, roughness: 1.0, metalness: 0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- the winding path ----------
const pathCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 2.4, 0,  31),
  new THREE.Vector3(-3.4, 0,  22),
  new THREE.Vector3( 3.6, 0,  13),
  new THREE.Vector3(-1.7, 0,   4),
  new THREE.Vector3( 3.1, 0,  -6),
  new THREE.Vector3(-2.3, 0, -16),
  new THREE.Vector3( 1.1, 0, -28),
], false, 'catmullrom', 0.6);
const pathSamples = pathCurve.getSpacedPoints(260);
function distToPath(x, z) {
  let best = Infinity;
  for (let i=0; i<pathSamples.length; i++) {
    const p = pathSamples[i];
    const dx = p.x - x, dz = p.z - z;
    const d = dx*dx + dz*dz;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

// packed-earth ribbon under the stones
{
  const N = 170, hw = 1.62, pos = [], uv = [], idx = [];
  let arc = 0, prev = pathCurve.getPointAt(0);
  for (let i=0; i<=N; i++) {
    const t = i/N;
    const p = pathCurve.getPointAt(t);
    const tan = pathCurve.getTangentAt(t);
    const nrm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    arc += (i ? p.distanceTo(prev) : 0); prev = p.clone();
    pos.push(p.x + nrm.x*hw, 0.045, p.z + nrm.z*hw,  p.x - nrm.x*hw, 0.045, p.z - nrm.z*hw);
    uv.push(0, arc*0.35,  1, arc*0.35);
    if (i < N) { const a = i*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const ribbonTex = makeCanvas(256, 256, (ctx,w,h) => {
    ctx.fillStyle = '#57584a'; ctx.fillRect(0,0,w,h);
    noiseOn(ctx,w,h,1200,0.4,false); noiseOn(ctx,w,h,700,0.3,true);
    for (let i=0; i<24; i++) {
      const x=R()*w, y=R()*h, r=8+R()*26;
      const g2 = ctx.createRadialGradient(x,y,1,x,y,r);
      g2.addColorStop(0,'rgba(88,110,58,0.55)'); g2.addColorStop(1,'rgba(88,110,58,0)');
      ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
  });
  ribbonTex.wrapS = ribbonTex.wrapT = THREE.RepeatWrapping;
  const ribbon = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    map: ribbonTex, color: 0xb9bca4, roughness: 1, polygonOffset: true, polygonOffsetFactor: -2
  }));
  ribbon.receiveShadow = true;
  scene.add(ribbon);
}

// irregular flagstones (one deformed geometry, instanced)
{
  const SEG = 9;
  const geo = new THREE.CylinderGeometry(1, 1.1, 0.24, SEG, 1, false);
  const segScale = []; for (let i=0; i<SEG; i++) segScale.push(0.74 + R()*0.42);
  const pa = geo.attributes.position;
  for (let i=0; i<pa.count; i++) {
    const x = pa.getX(i), z = pa.getZ(i);
    const ang = Math.atan2(z, x);
    let seg = Math.round(((ang + Math.PI) / (Math.PI*2)) * SEG) % SEG;
    const s = segScale[seg];
    pa.setX(i, x*s); pa.setZ(i, z*s);
  }
  geo.computeVertexNormals();
  const stoneMat = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.92, metalness: 0.02 });
  const LEN = pathCurve.getLength();
  const COUNT = Math.floor(LEN / 1.02);
  const stones = new THREE.InstancedMesh(geo, stoneMat, COUNT);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3();
  const col = new THREE.Color();
  for (let i=0; i<COUNT; i++) {
    const t = (i + 0.5) / COUNT;
    p.copy(pathCurve.getPointAt(t));
    const tan = pathCurve.getTangentAt(t);
    const nrm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
    const lat = Math.sin(i*2.35)*0.55 + (R()-0.5)*0.75;
    p.addScaledVector(nrm, lat);
    e.set((R()-0.5)*0.06, R()*Math.PI*2, (R()-0.5)*0.06); q.setFromEuler(e);
    const sx = 0.66 + R()*0.55, sz = 0.6 + R()*0.5;
    s.set(sx, 0.85 + R()*0.5, sz);
    p.y = 0.1 + R()*0.03;
    m.compose(p, q, s);
    stones.setMatrixAt(i, m);
    const g = 0.72 + R()*0.35, moss = R() < 0.3;
    col.setRGB(g*(moss?0.78:1), g*(moss?0.95:1), g*0.92);
    stones.setColorAt(i, col);
  }
  stones.castShadow = true; stones.receiveShadow = true;
  scene.add(stones);
}

// ---------- wooden gate ----------
const gateGroup = new THREE.Group();
{
  const woodMat  = new THREE.MeshStandardMaterial({ map: woodTex, color: 0xa8896a, roughness: 0.85 });
  const woodDark = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x6e5238, roughness: 0.9 });
  const stoneBase = new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x9a9d94, roughness: 0.95 });

    float a = edge * vert * streaks * uStrength;

// ============================================================
//  WIND SIMULATION  (fixed time-step, deterministic)
// ============================================================
const DT = 1 / 60;
const WIND = new THREE.Vector2(-0.72, 0.42).normalize();   // direction gusts travel
const K_SPRING = 26, C_DAMP = 2.6;
let simTime = 0;
let gustStrength = 0.15;
const gusts = [];

function spawnGust(amp = 52, speed = 16, width = 7.5, life = 7.0) {
  gusts.push({ t0: simTime, amp, speed, width, life });
}
function windForceAt(x, z, t) {
  const s = x * WIND.x + z * WIND.y;
  let f = 0;
  for (let i=0; i<gusts.length; i++) {
    const g = gusts[i];
    const wavePos = (t - g.t0) * g.speed;
    const d = s - wavePos;
    f += g.amp * Math.exp(-(d*d) / (g.width*g.width));
  }
  return f;
}
function impulseStalk(i, dirX, dirZ, mag) {
  velX[i] += dirX * mag;
  velZ[i] += dirZ * mag;
}

const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
const _axis = new THREE.Vector3(), _up = new THREE.Vector3(0,1,0);
const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _s = new THREE.Vector3();

const showcaseEvents = [
  { t: 1.15, fired: false, fn: () => spawnGust(54, 17, 7.5, 7.0) },
  { t: 6.30, fired: false, fn: () => spawnGust(34, 15, 6.0, 6.5) },
  { t: 7.60, fired: false, fn: () => {
      const i = showcasePushIndex;
      const dx = stalkBaseX[i] - camera.position.x, dz = stalkBaseZ[i] - camera.position.z;
      const l = Math.hypot(dx, dz) || 1;
      impulseStalk(i, dx/l, dz/l, 17);
    } }
];
let showcaseEventsActive = false;

function stepSim(dt) {
  simTime += dt;

  // fire scripted showcase events
  if (showcaseEventsActive) {
    for (const ev of showcaseEvents) {
      if (!ev.fired && simTime >= ev.t) { ev.fired = true; ev.fn(); }
    }
  }
  // prune dead gusts
  for (let i=gusts.length-1; i>=0; i--) {
    if ((simTime - gusts[i].t0) / gusts[i].life > 1.15) gusts.splice(i, 1);
  }

  // stalk spring-cantilever dynamics
  for (let i=0; i<STALK_COUNT; i++) {
    const baseSway = (Math.sin(simTime*0.82 + stalkPhase[i]) * 0.68
                    + Math.sin(simTime*1.93 + stalkPhase[i]*1.71 + 1.3) * 0.32) * 6.2;
    const perpSway = Math.sin(simTime*1.21 + stalkPhase[i]*2.13 + 4.0) * 2.1;
    const gf = windForceAt(stalkBaseX[i], stalkBaseZ[i], simTime);
    const fx = WIND.x * (baseSway + gf) - WIND.y * perpSway;
    const fz = WIND.y * (baseSway + gf) + WIND.x * perpSway;
    const ax = -K_SPRING * bendX[i] - C_DAMP * velX[i] + fx;
    const az = -K_SPRING * bendZ[i] - C_DAMP * velZ[i] + fz;
    velX[i] += ax * dt; velZ[i] += az * dt;
    bendX[i] += velX[i] * dt; bendZ[i] += velZ[i] * dt;
    const bl = Math.hypot(bendX[i], bendZ[i]);
    if (bl > 3.4) { const s = 3.4 / bl; bendX[i] *= s; bendZ[i] *= s; }
    bendAttr.setXY(i, stalkLeanX[i] + bendX[i], stalkLeanZ[i] + bendZ[i]);
  }
  bendAttr.needsUpdate = true;

  // leaf clusters follow stalk tops (+ flutter)
  const flutterBase = 0.1 + gustStrength * 0.28;
  for (let i=0; i<STALK_COUNT; i++) {
    const tx = stalkLeanX[i] + bendX[i], tz = stalkLeanZ[i] + bendZ[i];
    const topX = stalkBaseX[i] + tx, topZ = stalkBaseZ[i] + tz;
    const len = Math.hypot(tx, tz);
    const tilt = Math.min(0.62, len * 0.16);
    _axis.set(tz, 0, -tx);
    if (_axis.lengthSq() > 1e-6) {
      _axis.normalize();
      _q1.setFromAxisAngle(_axis, tilt);
    } else _q1.identity();
    _q2.setFromAxisAngle(_up, stalkRotY[i]);
    const spd = Math.hypot(velX[i], velZ[i]);
    const flAmp = flutterBase + Math.min(0.38, spd * 0.05 + gustStrength * 0.12);
    const fl = Math.sin(simTime * 3.4 + stalkPhase[i] * 3.1) * flAmp
             + Math.sin(simTime * 5.7 + stalkPhase[i] * 5.3) * flAmp * 0.45;
    _q3.setFromAxisAngle(new THREE.Vector3(1, 0, 0), fl);
    _q1.multiply(_q2).multiply(_q3);
    const sc = 0.82 + (stalkRadius[i] - 0.085) * 6.5;
    _p.set(topX, stalkHeight[i] - 0.28, topZ);
    _s.set(sc, sc, sc);
    _m.compose(_p, _q1, _s);
    leafMesh.setMatrixAt(i, _m);
  }
  leafMesh.instanceMatrix.needsUpdate = true;

  // dust motes drift & twinkle inside shafts
  for (let i=0; i<MOTES; i++) {
    const sd = moteSeed[i], sh = shafts[sd.shaft];
    const L = sh.len;
    let ly = (sd.ly - simTime * sd.fall) % L; if (ly < 0) ly += L;
    const lx = sd.lx * sh.width * 0.42 + Math.sin(simTime * sd.wob + sd.ph) * 0.32;
    const lz = sd.lz + Math.cos(simTime * sd.wob * 0.8 + sd.ph * 1.7) * 0.28;
    const wx = sh.base.x + sh.up.x*ly + sh.right.x*lx + sh.fwd.x*lz;
    const wy = sh.base.y + sh.up.y*ly + sh.right.y*lx + sh.fwd.y*lz;
    const wz = sh.base.z + sh.up.z*ly + sh.right.z*lx + sh.fwd.z*lz;
    motePos[i*3] = wx; motePos[i*3+1] = wy; motePos[i*3+2] = wz;
  }
  moteGeo.attributes.position.needsUpdate = true;

  // mist breathing / drift
  for (const ms of mistSprites) {
    ms.sp.material.rotation = simTime * ms.spin + ms.ph;
    ms.sp.material.opacity = ms.op * (0.82 + 0.28 * Math.sin(simTime * 0.32 + ms.ph * 2.1));
  }
  // shaft shimmer
  for (const sh of shafts) sh.mat.uniforms.uTime.value = simTime;
  // lantern candle-flicker (deterministic)
  const fl = Math.sin(simTime * 11.3) * 0.32 + Math.sin(simTime * 5.7 + 1.3) * 0.28 + Math.sin(simTime * 23.7 + 4.1) * 0.16;
  lanternLight.intensity = 2.35 + fl;
  lanternGlassMat.emissiveIntensity = 1.7 + fl * 0.55;

  // gust strength 0..1 (base breeze + active gust envelopes)
  let g = 0.15;
  for (const gu of gusts) {
    const tc = (simTime - gu.t0) / gu.life;
    if (tc > 0 && tc < 1) g += (gu.amp / 55) * Math.pow(Math.sin(Math.PI * tc), 1.6);
  }
  gustStrength = clamp(g, 0, 1);
}

function resetSim() {
  simTime = 0; gustStrength = 0.15;
  gusts.length = 0;
  bendX.fill(0); bendZ.fill(0); velX.fill(0); velZ.fill(0);
  for (const ev of showcaseEvents) ev.fired = false;
  for (let i=0; i<STALK_COUNT; i++) bendAttr.setXY(i, stalkLeanX[i], stalkLeanZ[i]);
  bendAttr.needsUpdate = true;
}

// stalk nearest the showcase push point (deterministic selection)
const showcasePushIndex = (() => {
  const target = pathCurve.getPointAt(0.47);
  let best = Infinity, bi = 0;
  for (let i=0; i<STALK_COUNT; i++) {
    const dx = stalkBaseX[i] - target.x, dz = stalkBaseZ[i] - target.z;
    const d = dx*dx + dz*dz;
    if (d < best) { best = d; bi = i; }
  }
  return bi;
})();

// ============================================================
//  POST-PROCESSING — radial god-ray blur + vignette, bloom
// ============================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const GodRayShader = {
  uniforms: {
    tDiffuse: { value: null },
    uSun:     { value: new THREE.Vector2(0.5, 0.7) },
    uStrength:{ value: 0.85 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uSun;
    uniform float uStrength;
    varying vec2 vUv;
    void main() {
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      vec2 toSun = uSun - vUv;
      vec2 stepv = toSun / 26.0;
      vec2 coord = vUv;
      float decay = 1.0;
      vec3 rays = vec3(0.0);
      for (int i = 0; i < 26; i++) {
        coord += stepv;
        vec3 s = texture2D(tDiffuse, coord).rgb;
        float l = dot(s, vec3(0.299, 0.587, 0.114));
        float w = smoothstep(0.52, 1.05, l);
        rays += s * w * decay;
        decay *= 0.925;
      }
      rays /= 26.0;
      col += rays * uStrength * vec3(1.0, 0.95, 0.78);
      // warm highlights, cool-shadow grade
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col * vec3(0.92, 1.03, 0.96), col * vec3(1.06, 1.02, 0.92), smoothstep(0.15, 0.75, lum));
      // vignette
      float d = distance(vUv, vec2(0.5));
      col *= 1.0 - 0.36 * smoothstep(0.42, 0.94, d);
      gl_FragColor = vec4(col, 1.0);
    }
  `
};
const godRayPass = new ShaderPass(GodRayShader);
composer.addPass(godRayPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.55, 0.82
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// sun position in screen space for the radial pass
const _sunV = new THREE.Vector3();
function updateSunScreen() {
  _sunV.copy(camera.position).addScaledVector(TO_SUN, 300).project(camera);
  const behind = _sunV.z > 1;
  godRayPass.uniforms.uSun.value.set(_sunV.x * 0.5 + 0.5, _sunV.y * 0.5 + 0.5);
  godRayPass.uniforms.uStrength.value = behind ? 0.0 : 0.9;
}

// ============================================================
//  MODES — orbit / walk / showcase
// ============================================================
let mode = 'orbit';               // 'orbit' | 'walk' | 'showcase'
let yaw = 0, pitch = 0;
const keys = {};
let bobPhase = 0;

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyF') toggleWalk();
  if (e.code === 'KeyG') { spawnGust(56, 17.5, 8.0, 7.5); showToast('G U S T'); }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

const toastEl = document.getElementById('toast');
let toastTimer = 0;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
}

// pointer-lock mouse look
document.addEventListener('mousemove', (e) => {
  if (mode !== 'walk') return;
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw   -= e.movementX * 0.0023;
  pitch -= e.movementY * 0.0023;
  pitch = clamp(pitch, -1.45, 1.45);
});
document.addEventListener('pointerlockchange', () => {
  if (mode === 'walk' && document.pointerLockElement !== renderer.domElement) {
    mode = 'orbit';
    document.body.classList.remove('walking');
    controls.enabled = true;
  }
});

function enterWalk() {
  mode = 'walk';
  document.body.classList.add('walking');
  controls.enabled = false;
  const t = 0.012;
  const p = pathCurve.getPointAt(t);
  const tan = pathCurve.getTangentAt(t);
  camera.position.set(p.x, 1.7, p.z);
  yaw = Math.atan2(-tan.x, -tan.z);
  pitch = 0;
  try { renderer.domElement.requestPointerLock(); } catch (err) { /* look will fall back to keys */ }
  showToast('W A L K   T H E   P A T H');
}
function exitWalk() {
  if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
  mode = 'orbit';
  document.body.classList.remove('walking');
  controls.enabled = true;
}
function toggleWalk() {
  if (mode === 'showcase') return;
  if (mode === 'walk') exitWalk(); else enterWalk();
}

function walkUpdate(dt) {
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const move = new THREE.Vector3();
  if (keys['KeyW']) move.addScaledVector(fwd, 1);
  if (keys['KeyS']) move.addScaledVector(fwd, -1);
  if (keys['KeyD']) move.addScaledVector(right, 1);
  if (keys['KeyA']) move.addScaledVector(right, -1);
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar((sprint ? 7.0 : 4.4) * dt);
    camera.position.add(move);
    bobPhase += dt * (sprint ? 11.5 : 8.5);
  }
  // collide with stalks (circle vs circle, slide out)
  const cp = camera.position;
  for (let iter=0; iter<2; iter++) {
    for (let i=0; i<STALK_COUNT; i++) {
      const dx = cp.x - stalkBaseX[i], dz = cp.z - stalkBaseZ[i];
      const d2 = dx*dx + dz*dz, minD = 0.55;
      if (d2 < minD*minD && d2 > 1e-8) {
        const d = Math.sqrt(d2), push = (minD - d) / d;
        cp.x += dx * push; cp.z += dz * push;
      }
    }
  }
  const rad = Math.hypot(cp.x, cp.z);
  if (rad > 55) { cp.x *= 55/rad; cp.z *= 55/rad; }
  cp.y = 1.7 + Math.sin(bobPhase) * 0.045 * (move.lengthSq() > 0 ? 1 : 0);
  camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
}

// ---------- stalk pushing (click) ----------
const raycaster = new THREE.Raycaster();
function pushAtNDC(nx, ny) {
  raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
  const hits = raycaster.intersectObject(stalkMesh);
  if (hits.length) {
    const i = hits[0].instanceId;
    const dir = new THREE.Vector3().subVectors(
      new THREE.Vector3(stalkBaseX[i], 0, stalkBaseZ[i]),
      new THREE.Vector3(camera.position.x, 0, camera.position.z)
    ).normalize();
    impulseStalk(i, dir.x, dir.z, 15 + Math.random() * 5);
    return true;
  }
  return false;
}
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (mode === 'walk') {
    // centered push while walking
    pushAtNDC(0, 0);
    return;
  }
  downX = e.clientX; downY = e.clientY;
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (mode !== 'orbit') return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;  // was a drag
  pushAtNDC((e.clientX / window.innerWidth) * 2 - 1, -((e.clientY / window.innerHeight) * 2 - 1));
});

document.getElementById('gustBtn').addEventListener('click', () => {
  spawnGust(56, 17.5, 8.0, 7.5); showToast('G U S T');
});

// ============================================================
//  SHOWCASE — deterministic 12 s cinematic, re-simulated on seek
// ============================================================
const LAN = lanternPos.clone();
const PS  = new THREE.Vector3(stalkBaseX[showcasePushIndex], 4.6, stalkBaseZ[showcasePushIndex]);
const camKeys = [
  { t:  0.0, pos: [ 11.5, 4.8,  31.5], look: [ 0.0, 3.1,  15.0] },
  { t:  2.4, pos: [ -4.9, 2.3,  21.2], look: [ 1.6, 6.2,  10.0] },
  { t:  4.8, pos: [  2.6, 1.7,  13.6], look: [ LAN.x*0.55, 2.9, LAN.z - 2.0] },
  { t:  6.6, pos: [ LAN.x + 2.2, 1.35, LAN.z + 2.7], look: [ LAN.x, 1.4, LAN.z ] },
  { t:  8.3, pos: [ -2.5, 1.8,   9.4], look: [ PS.x, PS.y, PS.z ] },
  { t: 10.2, pos: [  9.2, 8.8,  15.6], look: [ 0.0, 2.0,  -5.0 ] },
  { t: 12.0, pos: [ 15.5, 5.1,  27.2], look: [-1.0, 3.1, -10.0 ] }
];
const _ka = new THREE.Vector3(), _kb = new THREE.Vector3(), _la = new THREE.Vector3(), _lb = new THREE.Vector3();
function showcaseCamera(t) {
  let i = 0;
  while (i < camKeys.length - 2 && t > camKeys[i+1].t) i++;
  const a = camKeys[i], b = camKeys[i+1];
  const u = smoothstep(a.t, b.t, t);
  _ka.fromArray(a.pos); _kb.fromArray(b.pos);
  _la.fromArray(a.look); _lb.fromArray(b.look);
  camera.position.lerpVectors(_ka, _kb, u);
  _lb.lerpVectors(_la, _lb, u);
  camera.lookAt(_lb);
}

const SHOWCASE_DURATION = 12.0;
let lastSeekT = null;
let simStepCount = 0;
let showcasePlaying = false;
let showcaseT = 0;
let recorder = null;
let recordChunks = [];

function seek(t) {
  t = clamp(t, 0, SHOWCASE_DURATION);
  if (lastSeekT === null || t < lastSeekT - 1e-6) {
    resetSim();
    simStepCount = 0;
    showcaseEventsActive = true;
  }
  const targetSteps = Math.round(t / DT);
  let guard = 0;
  while (simStepCount < targetSteps && guard++ < 10000) { stepSim(DT); simStepCount++; }
  mode = 'showcase';
  document.body.classList.add('showcase');
  controls.enabled = false;
  showcaseCamera(t);
  renderFrame();
  lastSeekT = t;
}
window.showcase = { duration: SHOWCASE_DURATION, seek };

const recordBtn = document.getElementById('recordBtn');
function startShowcasePlayback(withRecord) {
  resetSim(); simStepCount = 0; lastSeekT = null;
  showcaseEventsActive = true;
  showcaseT = 0; showcasePlaying = true;
  mode = 'showcase';
  document.body.classList.add('showcase');
  controls.enabled = false;
}
recordBtn.addEventListener('click', () => {
  if (showcasePlaying) return;
  let mime = '';
  for (const m of ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { mime = m; break; }
  }
  if (!mime) { showToast('RECORDING NOT SUPPORTED'); return; }
  try {
    const stream = renderer.domElement.captureStream(60);
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14_000_000 });
  } catch (err) { showToast('RECORDING NOT SUPPORTED'); return; }
  recordChunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) recordChunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(recordChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'mistveil-bamboo.webm';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recordBtn.textContent = '● Record Video';
    recordBtn.classList.remove('recording');
    showToast('S A V E D   . W E B M');
  };
  recorder.start(250);
  recordBtn.textContent = '● Recording…';
  recordBtn.classList.add('recording');
  startShowcasePlayback(true);
});
function finishShowcase() {
  showcasePlaying = false;
  showcaseEventsActive = false;
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  recorder = null;
  mode = 'orbit';
  document.body.classList.remove('showcase');
  controls.enabled = true;
  lastSeekT = null;
}

// ============================================================
//  RENDER LOOP
// ============================================================
window.__bench = { stalks: STALK_COUNT, gust: 0.15, walking: false };

const windBar = document.getElementById('windBar');
const clock = new THREE.Clock();
let acc = 0;

function renderFrame() {
  updateSunScreen();
  composer.render();
  window.__bench.stalks = STALK_COUNT;
  window.__bench.gust = gustStrength;
  window.__bench.walking = (mode === 'walk');
  windBar.style.width = (gustStrength * 100).toFixed(1) + '%';
}

function animate() {
  requestAnimationFrame(animate);
  const realDt = Math.min(clock.getDelta(), 0.05);

  if (showcasePlaying) {
    showcaseT += realDt;
    if (showcaseT >= SHOWCASE_DURATION) {
      seek(SHOWCASE_DURATION);
      finishShowcase();
      return;
    }
    seek(showcaseT);
    return;
  }

  // advance simulation with fixed time-step
  acc += realDt;
  let steps = 0;
  while (acc >= DT && steps++ < 6) { stepSim(DT); acc -= DT; }

  if (mode === 'walk') walkUpdate(realDt);
  else if (mode === 'orbit') controls.update();

  renderFrame();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// prime the simulation so frame 0 is alive, then hand over to the loop
resetSim();
for (let i=0; i<40; i++) stepSim(DT);   // 0.66 s of breeze history
controls.update();
animate();
</script>
</body>
</html>

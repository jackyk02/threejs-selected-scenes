  #recordBtn.rec {
    color: #ffd9c8; border-color: rgba(255,150,110,0.8);
    background: linear-gradient(180deg, rgba(84,28,18,0.88), rgba(40,14,10,0.88));
  }
  #recDot {
    display: none; color: #ff6a4d; margin-right: 10px;
    animation: blink 0.9s steps(2,start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  #recordBtn.rec #recDot { display: inline-block; }

  /* ---- cinematic letterbox bars ---- */
  .bar {
    position: fixed; left: 0; right: 0; height: 7vh; background: #05070a; z-index: 9;
    opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
  }
  #barTop { top: 0; } #barBot { bottom: 0; }
  .bar.on { opacity: 1; }

  /* ---- walk-mode crosshair ---- */
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 5px; height: 5px; z-index: 10;
    border-radius: 50%; background: rgba(245,250,235,0.9);
    box-shadow: 0 0 6px rgba(0,0,0,0.9);
    transform: translate(-50%,-50%); pointer-events: none; display: none;
  }
  #walkTag {
    position: fixed; top: 22px; right: 26px; z-index: 10; display: none;
    color: #ffe9b8; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    border: 1px solid rgba(255,233,184,0.4); padding: 8px 14px; border-radius: 3px;
    background: rgba(30,26,12,0.45); text-shadow: 0 1px 4px #000; pointer-events: none;
  }
</style>
<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   0. DETERMINISTIC RNG + NOISE
   ============================================================ */
let seed = 1337;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rr(a, b) { return a + rnd() * (b - a); }
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function smoothstep(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

/* Path centre-line (z runs from +34 near shrine to -38 far grove) */
function pathX(z) { return 5.5 * Math.sin(z * 0.075) + 2.2 * Math.sin(z * 0.021 + 1.9); }
function pathDist(x, z) { return Math.abs(x - pathX(z)); }
function groundH(x, z) {
  let h = vnoise(x * 0.018 + 13.7, z * 0.018 + 7.3) * 2.5 + vnoise(x * 0.055 + 3.1, z * 0.055 + 9.4) * 0.75 - 1.45;
  const d = pathDist(x, z);
  const f = smoothstep(2.1, 7.0, d);
  return h * (0.12 + 0.88 * f);
}

/* ============================================================
   1. RENDERER / SCENE / CAMERA  (top-level, as required)
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0xb7c5b1);
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0235);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 420);
const DEFAULT_CAM = new THREE.Vector3(15.5, 6.6, 26.5);
const DEFAULT_TGT = new THREE.Vector3(pathX(0) * 0.6, 2.6, -1.5);
camera.position.copy(DEFAULT_CAM);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(DEFAULT_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = 1.53;
controls.minDistance = 3;
controls.maxDistance = 75;
controls.update();

const sunDir = new THREE.Vector3(0.42, 0.66, 0.30).normalize(); // toward the sun

/* ---- lights ---- */
const sun = new THREE.DirectionalLight(0xfff1d8, 2.75);
sun.position.copy(sunDir).multiplyScalar(95);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -78; sun.shadow.camera.right = 78;
sun.shadow.camera.top = 78; sun.shadow.camera.bottom = -78;
sun.shadow.camera.near = 15; sun.shadow.camera.far = 210;
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.55;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xccdccc, 0x2c3826, 0.85);
scene.add(hemi);
const fill = new THREE.DirectionalLight(0xa9c2cf, 0.5);
fill.position.set(-35, 24, -30);
scene.add(fill);

/* ============================================================
   2. PROCEDURAL TEXTURES (canvas)
   ============================================================ */
function makeCanvas(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const stalkTex = makeCanvas(256, 256, (g) => {
  g.fillStyle = '#e8e4ce'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 90; i++) {
    const x = rnd() * 256, w = rr(1.5, 7), a = rr(0.05, 0.22);
    g.fillStyle = `rgba(96,104,58,${a})`;
    g.fillRect(x, 0, w, 256);
  }
  for (let i = 0; i < 40; i++) {
    const x = rnd() * 256;
    g.fillStyle = `rgba(255,255,240,${rr(0.06, 0.16)})`;
    g.fillRect(x, 0, rr(1, 3), 256);
  }
});
stalkTex.repeat.set(2, 1);

const groundTex = makeCanvas(512, 512, (g) => {
  g.fillStyle = '#3d5232'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) {
    const x = rnd() * 512, y = rnd() * 512, r = rr(4, 34);
    const shade = rnd();
    let col;
    if (shade < 0.45) col = `rgba(${30 + rnd() * 40 | 0},${60 + rnd() * 40 | 0},${28 + rnd() * 22 | 0},${rr(0.25, 0.6)})`;
    else if (shade < 0.75) col = `rgba(${64 + rnd() * 40 | 0},${86 + rnd() * 40 | 0},${40 + rnd() * 22 | 0},${rr(0.2, 0.5)})`;
    else col = `rgba(${88 + rnd() * 40 | 0},${80 + rnd() * 30 | 0},${44 + rnd() * 18 | 0},${rr(0.15, 0.4)})`;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, col); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // speckles
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = `rgba(${20 + rnd() * 120 | 0},${40 + rnd() * 120 | 0},${20 + rnd() * 60 | 0},${rr(0.2, 0.5)})`;
    g.fillRect(rnd() * 512, rnd() * 512, rr(1, 3), rr(1, 3));
  }
});
groundTex.repeat.set(9, 9);

const stoneTex = makeCanvas(256, 256, (g) => {
  g.fillStyle = '#8b8f88'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    const v = 90 + rnd() * 110 | 0;
    g.fillStyle = `rgba(${v},${v},${v - 6},${rr(0.3, 0.8)})`;
    g.fillRect(rnd() * 256, rnd() * 256, rr(1, 4), rr(1, 4));
  }
  for (let i = 0; i < 26; i++) { // moss blotches
    const x = rnd() * 256, y = rnd() * 256, r = rr(8, 34);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(72,96,46,${rr(0.4, 0.75)})`); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
});

const woodTex = makeCanvas(256, 256, (g) => {
  g.fillStyle = '#4a3524'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 48; i++) {
    const x = rnd() * 256, w = rr(2, 14);
    g.fillStyle = `rgba(${20 + rnd() * 40 | 0},${14 + rnd() * 26 | 0},${8 + rnd() * 14 | 0},${rr(0.35, 0.75)})`;
    g.fillRect(x, 0, w, 256);
    g.fillStyle = `rgba(190,150,105,${rr(0.05, 0.18)})`;
    g.fillRect(x + w, 0, rr(1, 3), 256);
  }
  for (let i = 0; i < 9; i++) { // knots
    const x = rnd() * 256, y = rnd() * 256;
    g.strokeStyle = 'rgba(28,18,10,0.6)'; g.lineWidth = rr(1.5, 3.5);
    g.beginPath(); g.ellipse(x, y, rr(3, 8), rr(6, 16), 0, 0, 7); g.stroke();
  }
});

const mistTex = makeCanvas(256, 256, (g) => {
  const grad = g.createRadialGradient(128, 128, 8, 128, 128, 126);
  grad.addColorStop(0, 'rgba(235,242,228,0.85)');
  grad.addColorStop(0.45, 'rgba(228,238,222,0.38)');
  grad.addColorStop(1, 'rgba(228,238,222,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
});
mistTex.wrapS = mistTex.wrapT = THREE.ClampToEdgeWrapping;

const dotTex = makeCanvas(64, 64, (g) => {
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,252,230,1)');
  grad.addColorStop(0.35, 'rgba(255,248,210,0.7)');
  grad.addColorStop(1, 'rgba(255,248,210,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
});
dotTex.wrapS = dotTex.wrapT = THREE.ClampToEdgeWrapping;

const shaftTex = makeCanvas(256, 512, (g) => {
  // vertical falloff (bright top -> fade bottom)
  const gv = g.createLinearGradient(0, 0, 0, 512);
  gv.addColorStop(0.0, 'rgba(255,250,220,0.95)');
  gv.addColorStop(0.35, 'rgba(255,246,205,0.55)');
  gv.addColorStop(0.8, 'rgba(255,244,200,0.12)');
  gv.addColorStop(1.0, 'rgba(255,244,200,0)');
  g.fillStyle = gv; g.fillRect(0, 0, 256, 512);
  // vertical streaks
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 26; i++) {
    const x = rnd() * 256, w = rr(3, 18);
    g.fillStyle = `rgba(255,255,235,${rr(0.15, 0.55)})`;
    g.fillRect(x, 0, w, 512);
  }
  // horizontal centre falloff
  g.globalCompositeOperation = 'destination-in';
  const gh = g.createLinearGradient(0, 0, 256, 0);
  gh.addColorStop(0, 'rgba(255,255,255,0)');
  gh.addColorStop(0.22, 'rgba(255,255,255,0.85)');
  gh.addColorStop(0.5, 'rgba(255,255,255,1)');
  gh.addColorStop(0.78, 'rgba(255,255,255,0.85)');
  gh.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gh; g.fillRect(0, 0, 256, 512);
});
shaftTex.wrapS = shaftTex.wrapT = THREE.ClampToEdgeWrapping;

const fogLayerTex = makeCanvas(512, 512, (g) => {
  g.clearRect(0, 0, 512, 512);
  for (let i = 0; i < 90; i++) {
    const x = rnd() * 512, y = rnd() * 512, r = rr(26, 96);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(232,240,224,${rr(0.28, 0.6)})`);
    grad.addColorStop(1, 'rgba(232,240,224,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
});

/* ============================================================
   3. SKY DOME + SUN GLOW
   ============================================================ */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(360, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uSunDir: { value: sunDir.clone() } },
    vertexShader: `
      varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec3 vDir; uniform vec3 uSunDir;
      void main(){
        vec3 dir = normalize(vDir);
        float h = dir.y;
        vec3 hor = vec3(0.716, 0.770, 0.686);   // == fog
        vec3 mid = vec3(0.585, 0.665, 0.615);
        vec3 zen = vec3(0.345, 0.465, 0.535);
        vec3 col = mix(hor, mix(mid, zen, smoothstep(0.10, 0.62, h)), smoothstep(-0.02, 0.15, h));
        col = mix(col, vec3(0.52, 0.575, 0.50), smoothstep(-0.03, -0.28, h));
        float s = max(dot(dir, uSunDir), 0.0);
        col += vec3(1.00, 0.93, 0.74) * pow(s, 700.0) * 4.0;   // disc
        col += vec3(0.95, 0.88, 0.66) * pow(s, 18.0) * 0.42;   // halo
        col += vec3(0.80, 0.80, 0.66) * pow(s, 5.0)  * 0.22;   // broad glow
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
sky.renderOrder = -10;
scene.add(sky);

const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: dotTex, color: 0xfff3cd, transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false
}));
sunSprite.position.copy(sunDir).multiplyScalar(300);
sunSprite.scale.set(150, 150, 1);
scene.add(sunSprite);

/* ============================================================
   4. GROUND
   ============================================================ */
const groundGeo = new THREE.PlaneGeometry(260, 260, 150, 150);
groundGeo.rotateX(-Math.PI / 2);
{
  const pos = groundGeo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = groundH(x, z);
    pos.setY(i, h);
    const n = vnoise(x * 0.09 + 40, z * 0.09 + 21);
    const low = clamp(0.62 + h * 0.28 + n * 0.45, 0.35, 1.25);
    cols[i * 3] = low * rr(0.92, 1.08);
    cols[i * 3 + 1] = low * rr(0.95, 1.1);
    cols[i * 3 + 2] = low * rr(0.9, 1.05);
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({
  map: groundTex, vertexColors: true, roughness: 0.96, metalness: 0.0
}));
ground.receiveShadow = true;
scene.add(ground);

/* Low drifting ground-fog layer */
const fogLayer = new THREE.Mesh(
  new THREE.PlaneGeometry(230, 230),
  new THREE.MeshBasicMaterial({
    map: fogLayerTex, transparent: true, opacity: 0.42, color: 0xdfe8d8,
    depthWrite: false, fog: false
  })
);
fogLayer.rotation.x = -Math.PI / 2;
fogLayer.position.y = 1.05;
fogLayer.renderOrder = 5;
scene.add(fogLayer);

/* ============================================================
   5. WIND — GLSL FIELD (mirrored in JS for the bench)
   ============================================================ */
const windDir2 = new THREE.Vector2(0.78, 0.62).normalize();
const uTime = { value: 0 };
const uUserImpulseT = { value: -1000 };
const uUserImpulseAmp = { value: 0 };
const uWindDir = { value: windDir2 };

const GUST_GLSL = `
float gustField(vec2 p, float t){
  float d = dot(p, uWindDir);
  float g = 0.0;
  g += 0.34 * (0.5 + 0.5 * sin(d * 0.10 - t * 1.05 + 1.3));
  g += 0.20 * (0.5 + 0.5 * sin(d * 0.21 - t * 1.75 + 4.0));
  g += 0.16 * (0.5 + 0.5 * sin(t * 0.55 + p.x * 0.045 + p.y * 0.055 + 2.0));
  float T = 14.0;
  float tt = mod(t + 6.0, T);
  float fr = -60.0 + 120.0 * (tt / T);
  float dd = d - fr;
  g += 0.55 * exp(-dd * dd / 170.0) * sin(3.14159 * tt / T);
  float ageS = t - 4.4;                       // scripted showcase gust
  if (ageS > 0.0) {
    float frS = -70.0 + ageS * 16.0;
    float ddS = d - frS;
    g += 1.15 * exp(-ddS * ddS / 190.0) * exp(-ageS * 0.45);
  }
  float ageU = t - uUserImpulseT;             // user (G) gust
  if (ageU > 0.0 && ageU < 20.0) {
    float frU = -70.0 + ageU * 18.0;
    float ddU = d - frU;
    g += uUserImpulseAmp * exp(-ddU * ddU / 150.0) * exp(-ageU * 0.5);
  }
  return clamp(g, 0.0, 1.15);
}`;

/* JS mirror (used for window.__bench.gust at the camera) */
let userImpulseT = -1000, userImpulseAmp = 0;
function gustFieldJS(x, z, t) {
  const wx = windDir2.x, wz = windDir2.y, d = x * wx + z * wz;
  let g = 0;
  g += 0.34 * (0.5 + 0.5 * Math.sin(d * 0.10 - t * 1.05 + 1.3));
  g += 0.20 * (0.5 + 0.5 * Math.sin(d * 0.21 - t * 1.75 + 4.0));

/* shared wind snippets per material kind */
function stalkWindHeader() {

  uniform float uUserImpulseT; uniform float uUserImpulseAmp;
  attribute float aPhase; attribute float aFlex; attribute float aLean;
  attribute float aPushStart; attribute float aPushAmp; attribute vec2 aPushDir;
  ${GUST_GLSL}`;
}
const STALK_BEND = `
  float hFrac = clamp(position.y, 0.0, 1.0);
  vec2  wxz   = instanceMatrix[3].xz;
  float iH    = length(instanceMatrix[1].xyz);
  float sx    = length(instanceMatrix[0].xyz);
  float sz    = length(instanceMatrix[2].xyz);
  float d     = dot(wxz, uWindDir);
  float g     = gustField(wxz, uTime);
  float cf    = hFrac * hFrac * (0.6 + 0.4 * hFrac);          /* cantilever */
  float osc   = sin(uTime * 2.05 - d * 0.155 + aPhase * 6.28318);

function rebuildPushStateForSeek(t) {
  clearAllPushes();

function seek(t) {
  t = clamp(t, 0, SHOWCASE_DURATION);
  simTime = t;
  userImpulseT = -1000; userImpulseAmp = 0;     // deterministic: no user gusts
  uUserImpulseT.value = -1000; uUserImpulseAmp.value = 0;
  uTime.value = simTime;

  const T = t / SHOWCASE_DURATION;

  p.y += Math.sin(t * 1.9) * 0.05;              // faint breathing

  for (const s of shaftPivots) {

    s.holder.children[1].material.opacity = s.baseOp * 0.8 * (0.78 + 0.3 * Math.sin(t * 0.65 + s.phase + 0.9));

/* ============================================================
   16. INTERACTION — walk mode, gust key, stalk pushing
   ============================================================ */
let walking = false;
let walkYaw = 0, walkPitch = 0, bobPhase = 0;
const keysDown = {};
const crosshair = document.getElementById('crosshair');
const walkTag = document.getElementById('walkTag');

function enterWalk() {
  walking = true;
  controls.enabled = false;
  const dir = camera.getWorldDirection(new THREE.Vector3());
  walkYaw = Math.atan2(-dir.x, -dir.z);
  walkPitch = Math.asin(clamp(dir.y, -1, 1));
  renderer.domElement.requestPointerLock();
  crosshair.style.display = 'block';
  walkTag.style.display = 'block';
}
function exitWalk() {
  walking = false;
  controls.enabled = true;
  camera.fov = 55; camera.updateProjectionMatrix();
  const dir = camera.getWorldDirection(new THREE.Vector3());
  controls.target.copy(camera.position).addScaledVector(dir, 6);
  controls.target.y = Math.max(1.2, controls.target.y);
  controls.update();
  crosshair.style.display = 'none';
  walkTag.style.display = 'none';
  if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
}
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== renderer.domElement && walking) {
    walking = false;
    controls.enabled = true;
    camera.fov = 55; camera.updateProjectionMatrix();
    crosshair.style.display = 'none';
    walkTag.style.display = 'none';
    const dir = camera.getWorldDirection(new THREE.Vector3());
    controls.target.copy(camera.position).addScaledVector(dir, 6);
    controls.update();
  }
});
document.addEventListener('mousemove', (e) => {
  if (!walking) return;
  walkYaw -= e.movementX * 0.0021;
  walkPitch -= e.movementY * 0.0021;
  walkPitch = clamp(walkPitch, -1.35, 1.35);
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keysDown[k] = true;
  if (k === 'f') { walking ? exitWalk() : enterWalk(); }
  if (k === 'g') {
    userImpulseT = simTime; userImpulseAmp = 1.6;
    uUserImpulseT.value = userImpulseT; uUserImpulseAmp.value = userImpulseAmp;
  }
});
document.addEventListener('keyup', (e) => { keysDown[e.key.toLowerCase()] = false; });

function updateWalk(dt) {
  const speed = (keysDown['shift'] ? 6.4 : 3.6);
  const fwd = new THREE.Vector3(-Math.sin(walkYaw), 0, -Math.cos(walkYaw));
  const right = new THREE.Vector3(Math.cos(walkYaw), 0, -Math.sin(walkYaw));
  const move = new THREE.Vector3();
  if (keysDown['w']) move.addScaledVector(fwd, 1);
  if (keysDown['s']) move.addScaledVector(fwd, -1);
  if (keysDown['d']) move.addScaledVector(right, 1);
  if (keysDown['a']) move.addScaledVector(right, -1);
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(speed * dt);
    camera.position.add(move);
    bobPhase += speed * dt * 1.6;
  }
  /* collision: push out of stalks */
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    const dx = camera.position.x - c.x, dz = camera.position.z - c.z;
    const rr2 = c.r + 0.34, d2 = dx * dx + dz * dz;
    if (d2 < rr2 * rr2 && d2 > 1e-8) {
      const d = Math.sqrt(d2), push = (rr2 - d) / d;
      camera.position.x += dx * push;
      camera.position.z += dz * push;
    }
  }
  const rad = Math.hypot(camera.position.x, camera.position.z);
  if (rad > 122) { camera.position.x *= 122 / rad; camera.position.z *= 122 / rad; }
  const targetY = groundH(camera.position.x, camera.position.z) + 1.66 + Math.sin(bobPhase) * 0.05;
  camera.position.y += (targetY - camera.position.y) * Math.min(1, dt * 9);
  camera.quaternion.setFromEuler(new THREE.Euler(walkPitch, walkYaw, 0, 'YXZ'));
  camera.fov += (62 - camera.fov) * Math.min(1, dt * 6);
  camera.updateProjectionMatrix();
}

/* click to push a stalk */
const raycaster = new THREE.Raycaster();
let downX = 0, downY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;   // was a drag
  const ndc = new THREE.Vector2((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(stalkMesh);
  if (!hits.length) return;
  const hit = hits[0];
  const id = hit.instanceId;
  const dir = new THREE.Vector3().subVectors(hit.point, camera.position);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
  dir.normalize();
  setPush(id, simTime, 1.35, dir.x, dir.z);
});

/* ============================================================
   17. RECORD BUTTON — capture showcase as .webm
   ============================================================ */
const recordBtn = document.getElementById('recordBtn');
let showcaseActive = false;
let showcaseTime = 0;
let mediaRecorder = null;
let recordChunks = [];

recordBtn.addEventListener('click', () => {
  if (showcaseActive) return;
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const stream = renderer.domElement.captureStream(60);
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
  recordChunks = [];
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recordChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'misty-bamboo-forest.webm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recordBtn.classList.remove('rec');
    recordBtn.innerHTML = '<span id="recDot">●</span>Record video';
  };
  showcaseActive = true;
  showcaseTime = 0;
  controls.enabled = false;
  if (walking) exitWalk();
  recordBtn.classList.add('rec');
  recordBtn.innerHTML = '<span id="recDot">●</span>Recording…';
  mediaRecorder.start(250);
});

/* ============================================================
   18. MAIN LOOP + BENCH
   ============================================================ */
window.__bench = { stalks: STALK_COUNT, gust: 0, walking: false };
function updateBench() {
  window.__bench.stalks = STALK_COUNT;
  window.__bench.gust = clamp(gustFieldJS(camera.position.x, camera.position.z, simTime), 0, 1);
  window.__bench.walking = walking;
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (showcaseActive) {
    showcaseTime += dt;
    if (showcaseTime >= SHOWCASE_DURATION) {
      seek(SHOWCASE_DURATION);
      showcaseActive = false;
      setBars(false);
      controls.enabled = true;
      camera.position.copy(DEFAULT_CAM);
      controls.target.copy(DEFAULT_TGT);
      controls.update();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      updateBench();
      return;
    }
    seek(showcaseTime);
    return;
  }

  simTime += dt;
  uTime.value = simTime;
  uUserImpulseT.value = userImpulseT;
  uUserImpulseAmp.value = userImpulseAmp;

  if (walking) updateWalk(dt); else controls.update();

  /* life: lantern flicker, shaft shimmer, mist drift, fog breath */
  for (const s of shaftPivots) {
    s.holder.children[0].material.opacity = s.baseOp * (0.78 + 0.3 * Math.sin(simTime * 0.65 + s.phase));
    s.holder.children[1].material.opacity = s.baseOp * 0.8 * (0.78 + 0.3 * Math.sin(simTime * 0.65 + s.phase + 0.9));
  }
  lanternLight.intensity = 28 + Math.sin(simTime * 9.3) * 3.4 + Math.sin(simTime * 23.7) * 1.7 + Math.sin(simTime * 41.0) * 0.8;
  lanternGlow.material.opacity = 0.66 + 0.16 * Math.sin(simTime * 9.3 + 0.6) + 0.06 * Math.sin(simTime * 27.0);
  fogLayer.material.opacity = 0.36 + 0.09 * Math.sin(simTime * 0.16 + 2.0);
  fogLayer.map.offset.set(simTime * 0.0045, simTime * 0.0021);
  updateMotes(simTime);
  updateMist(simTime);

  composer.render();
  updateBench();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

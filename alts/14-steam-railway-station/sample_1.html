<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Westbury Terminus — The 4:30 Stops Here</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0e0d0b;height:100%;font-family:Georgia,'Times New Roman',serif;}
  canvas{display:block;}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 46%, rgba(8,6,4,.42) 100%);}
  .panel{position:fixed;z-index:10;color:#e8dcc0;
    background:linear-gradient(160deg, rgba(24,20,14,.82), rgba(16,14,10,.86));
    border:1px solid rgba(212,175,55,.45); border-radius:6px;
    box-shadow:0 6px 28px rgba(0,0,0,.55), inset 0 0 40px rgba(212,175,55,.05);
    backdrop-filter:blur(3px);}
  #title{top:18px;left:20px;padding:10px 18px 12px;max-width:380px;}
  #title h1{margin:0;font-size:21px;letter-spacing:.14em;color:#e6c86a;font-weight:normal;
    text-shadow:0 1px 0 #000, 0 0 18px rgba(230,200,106,.35);}
  #title h1 span{color:#f4ead2;}
  #title p{margin:4px 0 0;font-size:11.5px;font-style:italic;color:#c9b98d;letter-spacing:.05em;}
  #legend{bottom:18px;left:20px;padding:9px 16px;font-size:12px;letter-spacing:.03em;color:#d8cba4;}
  #legend kbd{display:inline-block;min-width:16px;text-align:center;padding:1px 7px;margin:0 4px 0 10px;
    border:1px solid #a8863c;border-bottom:3px solid #6d5622;border-radius:4px;
    background:#241f14;color:#ffd977;font-family:Georgia;font-size:11px;}
  #legend kbd:first-child{margin-left:0;}
  #bench{bottom:18px;right:20px;padding:8px 14px;font-family:'Courier New',monospace;font-size:11px;
    color:#ffe9a8;letter-spacing:.05em;text-align:left;line-height:1.55;}
  #bench b{color:#9adc9a;}
  #recBtn{top:18px;right:20px;padding:11px 20px;cursor:pointer;font-family:Georgia;font-size:14px;
    letter-spacing:.09em;color:#f6e6b8;background:linear-gradient(180deg,#5a1d1d,#3c1010);
    border:1px solid #d4af37;border-radius:6px;transition:all .25s;}
  #recBtn:hover:not(:disabled){box-shadow:0 0 22px rgba(212,175,55,.35);color:#fff2c4;transform:translateY(-1px);}
  #recBtn:disabled{opacity:.65;cursor:default;}
  #recBtn .dot{color:#ff5a4a;}
  #toast{position:fixed;z-index:11;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);
    padding:8px 26px;color:#ffe9a8;font-style:italic;letter-spacing:.12em;font-size:15px;
    background:rgba(20,16,10,.85);border:1px solid rgba(212,175,55,.5);border-radius:4px;
    opacity:0;pointer-events:none;transition:all .35s;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="vignette"></div>

<div id="title" class="panel">
  <h1>WESTBURY <span>TERMINUS</span></h1>
  <p>The 4:30 from Aldgate &nbsp;·&nbsp; Western &amp; Southern Railway &nbsp;·&nbsp; Est. 1847</p>
</div>

<div id="legend" class="panel">
  <kbd>Drag</kbd> orbit &nbsp;<kbd>Scroll</kbd> zoom<br>
  <kbd>Space</kbd> right away! (dispatch) &nbsp;<kbd>C</kbd> ride the cab &nbsp;<kbd>T</kbd> gaslight evening
</div>

<div id="bench" class="panel">
  TRAIN&nbsp; <b id="bSpeed">0.0</b> m/s<br>
  STEAM&nbsp; <b id="bSteam">0</b> particles<br>
  SOULS&nbsp;&nbsp; <b id="bPass">0</b> ashore<br>
  DRIVER <b id="bWheel">0.00</b> rad
</div>

<button id="recBtn" class="panel"><span class="dot">●</span> Record video</button>
<div id="toast">Right away!</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* ============================================================================
   WESTBURY TERMINUS — a Victorian railway terminus, steam arriving under glass
   ========================================================================== */
'use strict';

/* ---------- deterministic RNG ---------- */
let _seed = 0x9e3779b9;
function seedRand(s){ _seed = s >>> 0 || 1; }
function rand(){ _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function randRange(a,b){ return a + (b-a)*rand(); }
function pick(arr){ return arr[Math.floor(rand()*arr.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(a,b,x){ const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfc0a0, 80, 320);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 600);
camera.position.set(30, 11.5, 45);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.2, -8);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 95;
controls.maxPolarAngle = 1.53;
controls.update();

/* lights */
const sun = new THREE.DirectionalLight(0xffe8c0, 1.55);
sun.position.set(38, 46, 28);
sun.target.position.set(0, 0, -12);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -62; sun.shadow.camera.right = 62;
sun.shadow.camera.top = 62;  sun.shadow.camera.bottom = -62;
sun.shadow.camera.near = 4;  sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0004;   sun.shadow.normalBias = 0.025;
scene.add(sun); scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xcfd8e6, 0x5a4634, 0.62);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x40382c, 0.5);
scene.add(amb);

/* ============================================================
   PROCEDURAL CANVAS TEXTURES
   ============================================================ */
function makeCanvas(w,h,fn){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const brickTex = makeCanvas(512,512,(g,w,h)=>{
  g.fillStyle='#6e4a38'; g.fillRect(0,0,w,h);
  const bh=32, bw=64;
  for(let row=0; row<h/bh; row++){
    const off = (row%2)*bw/2;
    for(let col=-1; col<w/bw+1; col++){
      const v = rand()*28-14;
      g.fillStyle = 'rgb('+(118+v|0)+','+(74+v*0.7|0)+','+(54+v*0.5|0)+')';
      g.fillRect(col*bw+off+2, row*bh+2, bw-4, bh-4);
      g.fillStyle='rgba(255,255,255,0.06)'; g.fillRect(col*bw+off+2, row*bh+2, bw-4, 4);
    }
  }
  g.fillStyle='rgba(0,0,0,0.18)'; for(let i=0;i<400;i++) g.fillRect(rand()*w, rand()*h, rand()*3+1, rand()*3+1);
});
brickTex.repeat.set(3,1.6);

const stoneTex = makeCanvas(512,256,(g,w,h)=>{
  g.fillStyle='#8d8578'; g.fillRect(0,0,w,h);
  const rows=4, bh=h/rows;
  for(let r=0;r<rows;r++){
    const off=(r%2)*70;
    for(let x=-1;x<w/140+1;x++){
      const v=rand()*22-11;
      g.fillStyle='rgb('+(140+v|0)+','+(133+v|0)+','+(120+v|0)+')';
      g.fillRect(x*140+off+2, r*bh+2, 136, bh-4);
    }
  }
  g.fillStyle='rgba(0,0,0,0.15)'; for(let i=0;i<260;i++) g.fillRect(rand()*w,rand()*h,rand()*4+1,rand()*3+1);
});
stoneTex.repeat.set(2.4,1);

const ballastTex = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#2b2926'; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){
    const v=rand()*46+18;
    g.fillStyle='rgb('+v+','+v+','+(v*0.92|0)+')';
    g.beginPath(); g.arc(rand()*w, rand()*h, rand()*4+1.2, 0, 7); g.fill();
  }
});
ballastTex.repeat.set(6,40);

const glassTex = makeCanvas(256,256,(g,w,h)=>{
  const grad=g.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,'rgba(214,234,240,0.95)');
  grad.addColorStop(0.5,'rgba(188,214,224,0.85)');
  grad.addColorStop(1,'rgba(226,240,244,0.95)');
  g.fillStyle=grad; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(30,34,36,0.9)'; g.lineWidth=5;
  for(let x=0;x<=w;x+=42){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
  for(let y=0;y<=h;y+=64){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=1.5;
  for(let x=2;x<=w;x+=42){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
});
glassTex.repeat.set(7,14);

const glowTex = makeCanvas(128,128,(g,w,h)=>{
  const gr=g.createRadialGradient(64,64,2,64,64,62);
  gr.addColorStop(0,'rgba(255,236,180,1)');
  gr.addColorStop(0.28,'rgba(255,200,110,0.75)');
  gr.addColorStop(1,'rgba(255,180,80,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
});
const smokeSprite = makeCanvas(128,128,(g,w,h)=>{
  const gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(255,255,255,0.9)');
  gr.addColorStop(0.45,'rgba(255,255,255,0.55)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<26;i++){ const gr2=g.createRadialGradient(rand()*w,rand()*h,1,rand()*w,rand()*h,rand()*26+8);
    gr2.addColorStop(0,'rgba(0,0,0,0.35)'); gr2.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr2; g.fillRect(0,0,w,h); }
});
smokeSprite.wrapS = smokeSprite.wrapT = THREE.ClampToEdgeWrapping;

const signTex = makeCanvas(1024,128,(g,w,h)=>{
  g.fillStyle='#123324'; g.fillRect(0,0,w,h);
  g.strokeStyle='#d4af37'; g.lineWidth=7; g.strokeRect(10,10,w-20,h-20);
  g.strokeStyle='#8a6d1f'; g.lineWidth=2; g.strokeRect(20,20,w-40,h-40);
  g.fillStyle='#e6c86a'; g.font='bold 62px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('W E S T B U R Y   T E R M I N U S', w/2, h/2+2);
});
signTex.wrapS = signTex.wrapT = THREE.ClampToEdgeWrapping;

const wayOutTex = makeCanvas(512,128,(g,w,h)=>{
  g.fillStyle='#1a1a1a'; g.fillRect(0,0,w,h);
  g.strokeStyle='#e8e0c8'; g.lineWidth=5; g.strokeRect(8,8,w-16,h-16);
  g.fillStyle='#f2ead0'; g.font='bold 52px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('WAY OUT  →', w/2, h/2);
});
wayOutTex.wrapS = wayOutTex.wrapT = THREE.ClampToEdgeWrapping;

const bufferFaceTex = makeCanvas(256,128,(g,w,h)=>{
  g.fillStyle='#a3231b'; g.fillRect(0,0,w,h);
  g.fillStyle='#e8e0d0'; g.fillRect(0,26,w,30); g.fillRect(0,74,w,30);
  g.fillStyle='#a3231b'; g.font='bold 30px Georgia'; g.textAlign='center';
  g.fillText('― ‖ ―', w/2, 52);
});
bufferFaceTex.wrapS = bufferFaceTex.wrapT = THREE.ClampToEdgeWrapping;

const clockFaceTex = makeCanvas(256,256,(g)=>{
  g.fillStyle='#20241f'; g.beginPath(); g.arc(128,128,126,0,7); g.fill();
  g.fillStyle='#efe6cf'; g.beginPath(); g.arc(128,128,112,0,7); g.fill();
  g.strokeStyle='#2a2a24'; g.lineWidth=5; g.beginPath(); g.arc(128,128,112,0,7); g.stroke();
  const numerals=['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
  g.fillStyle='#221f18'; g.font='bold 22px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6 - Math.PI/2;
    g.fillText(numerals[i], 128+Math.cos(a)*86, 128+Math.sin(a)*86);
  }
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30;
    const r1 = i%5===0 ? 100 : 106;
    g.strokeStyle='#221f18'; g.lineWidth = i%5===0 ? 3.4 : 1.4;
    g.beginPath(); g.moveTo(128+Math.cos(a)*r1,128+Math.sin(a)*r1); g.lineTo(128+Math.cos(a)*110,128+Math.sin(a)*110); g.stroke();
  }
  g.font='bold 15px Georgia'; g.fillStyle='#4a4030'; g.fillText('WESTBURY', 128, 74); g.fillText('TERMINUS', 128, 182);
});
clockFaceTex.wrapS = clockFaceTex.wrapT = THREE.ClampToEdgeWrapping;

const coachSideTex = makeCanvas(1024,256,(g,w,h)=>{
  const bg=g.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#6e1a1e'); bg.addColorStop(0.42,'#7f2226'); bg.addColorStop(0.5,'#5a1418');
  bg.addColorStop(0.55,'#e3d3a0'); bg.addColorStop(0.78,'#dccb94'); bg.addColorStop(0.83,'#4a0f12'); bg.addColorStop(1,'#3a0c0f');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.fillStyle='#d4af37'; g.fillRect(0,132,w,3); g.fillRect(0,196,w,3);
  for(let i=0;i<9;i++){
    const wx = 46 + i*108;
    const wg=g.createLinearGradient(0,140,0,196);
    wg.addColorStop(0,'#ffe9b0'); wg.addColorStop(0.35,'#e8b461'); wg.addColorStop(1,'#5c3a1c');
    g.fillStyle='#2a1208'; g.fillRect(wx-7,138,92,66);
    g.fillStyle=wg; g.fillRect(wx,146,78,50);
    g.strokeStyle='#2a1208'; g.lineWidth=4;
    g.strokeRect(wx,146,78,50);
    g.beginPath(); g.moveTo(wx+39,146); g.lineTo(wx+39,196); g.stroke();
  }
  g.fillStyle='#d4af37'; g.font='bold 17px Georgia'; g.textAlign='center';
  g.fillText('W E S T E R N   &   S O U T H E R N', w/2, 116);
  g.fillStyle='rgba(0,0,0,0.25)';
  for(let i=0;i<9;i++){ g.strokeRect(30+i*108, 205, 92, 34); }
});
coachSideTex.wrapS = coachSideTex.wrapT = THREE.ClampToEdgeWrapping;

const posterTexA = makeCanvas(256,384,(g,w,h)=>{
  const bg=g.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#8fb6c9'); bg.addColorStop(0.62,'#c9b287'); bg.addColorStop(1,'#3f4a3a');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.fillStyle='#2e3a44'; g.beginPath(); g.moveTo(0,220); g.lineTo(80,120); g.lineTo(150,225); g.closePath(); g.fill();
  g.fillStyle='#232d36'; g.beginPath(); g.moveTo(90,225); g.lineTo(170,95); g.lineTo(256,228); g.closePath(); g.fill();
  g.fillStyle='#e8e0c8'; g.fillRect(0,225,w,h-225);
  g.fillStyle='#28323c'; g.font='bold 34px Georgia'; g.textAlign='center';
  g.fillText('THE', w/2, 268); g.fillText('LAKES', w/2, 312);
  g.font='italic 15px Georgia'; g.fillText('by W. & S. R.', w/2, 348);
});
const posterTexB = makeCanvas(256,384,(g,w,h)=>{
  const bg=g.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#f2c96b'); bg.addColorStop(0.5,'#d8734a'); bg.addColorStop(1,'#27405a');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.fillStyle='#f7e6a0'; g.beginPath(); g.arc(w/2, 190, 46, 0, 7); g.fill();
  g.fillStyle='#1c2c40'; g.fillRect(0,215,w,h-215);
  g.fillStyle='#e8ddc0'; g.font='bold 26px Georgia'; g.textAlign='center';
  g.fillText('SEASIDE', w/2, 268); g.fillText('EXCURSIONS', w/2, 302);
  g.font='italic 14px Georgia'; g.fillText('every Saturday', w/2, 340);
});
posterTexA.wrapS = posterTexA.wrapT = THREE.ClampToEdgeWrapping;
posterTexB.wrapS = posterTexB.wrapT = THREE.ClampToEdgeWrapping;

const luggageTex = makeCanvas(256,128,(g,w,h)=>{
  g.fillStyle='#5a4026'; g.fillRect(0,0,w,h);
  g.fillStyle='#3a2617'; g.fillRect(30,0,14,h); g.fillRect(w-44,0,14,h);
  g.fillStyle='#7a5a36'; g.fillRect(0,52,w,10);
  g.fillStyle='rgba(0,0,0,0.3)'; for(let i=0;i<120;i++) g.fillRect(rand()*w,rand()*h,rand()*4,rand()*2);
});

/* sky — drawn twice (afternoon / evening) */
const skyCanvas = document.createElement('canvas'); skyCanvas.width=1024; skyCanvas.height=512;
const skyTex = new THREE.CanvasTexture(skyCanvas);
function drawSky(evening){
  const g = skyCanvas.getContext('2d'), w=1024, h=512;
  if(evening < 0.5){
    const gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'#3d6a99'); gr.addColorStop(0.42,'#7ba5bd'); gr.addColorStop(0.72,'#c8bda0'); gr.addColorStop(1,'#e0c896');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    const sunG=g.createRadialGradient(720,205,8,720,205,190);
    sunG.addColorStop(0,'rgba(255,246,214,1)'); sunG.addColorStop(0.15,'rgba(255,236,180,0.9)'); sunG.addColorStop(1,'rgba(255,230,160,0)');
    g.fillStyle=sunG; g.fillRect(0,0,w,h);
  } else {
    const gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'#181f36'); gr.addColorStop(0.45,'#3a3352'); gr.addColorStop(0.74,'#7a4638'); gr.addColorStop(0.9,'#b0603a'); gr.addColorStop(1,'#d88a4a');
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    const sunG=g.createRadialGradient(700,415,6,700,415,220);
    sunG.addColorStop(0,'rgba(255,214,150,0.95)'); sunG.addColorStop(0.25,'rgba(255,170,95,0.55)'); sunG.addColorStop(1,'rgba(255,160,80,0)');
    g.fillStyle=sunG; g.fillRect(0,0,w,h);
    seedRand(99); g.fillStyle='#fff';
    for(let i=0;i<140;i++){ const y=rand()*200; g.globalAlpha=rand()*0.8+0.15; g.fillRect(rand()*w, y, 1.6, 1.6); }
    g.globalAlpha=1;
  }
  skyTex.needsUpdate = true;
}
drawSky(0);

/* ============================================================
   MATERIALS
   ============================================================ */
const M = {
  ironGreen:  new THREE.MeshStandardMaterial({ color:0x22392c, roughness:0.52, metalness:0.72 }),
  ironDark:   new THREE.MeshStandardMaterial({ color:0x181a1c, roughness:0.46, metalness:0.85 }),
  ironBlack:  new THREE.MeshStandardMaterial({ color:0x101114, roughness:0.55, metalness:0.6 }),
  brass:      new THREE.MeshStandardMaterial({ color:0xc9a227, roughness:0.28, metalness:0.96, emissive:0x2a1e05, emissiveIntensity:0.6 }),
  copper:     new THREE.MeshStandardMaterial({ color:0xa85a32, roughness:0.34, metalness:0.92 }),
  locoGreen:  new THREE.MeshStandardMaterial({ color:0x1e3c2a, roughness:0.38, metalness:0.35 }),
  locoBlack:  new THREE.MeshStandardMaterial({ color:0x141414, roughness:0.5, metalness:0.55 }),
  redBeam:    new THREE.MeshStandardMaterial({ color:0xa3231b, roughness:0.5, metalness:0.2 }),
  wood:       new THREE.MeshStandardMaterial({ color:0x6b4a2f, roughness:0.82, metalness:0.05 }),
  woodDark:   new THREE.MeshStandardMaterial({ color:0x46301f, roughness:0.88 }),
  stone:      new THREE.MeshStandardMaterial({ map:stoneTex, roughness:0.92 }),
  brick:      new THREE.MeshStandardMaterial({ map:brickTex, roughness:0.95 }),

function box(w,h,d,mat,x,y,z,parent,castShadow){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = castShadow !== false; m.receiveShadow = true;
  (parent||scene).add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,parent,axis,seg){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||20), mat);
  if(axis==='z') m.rotation.x = Math.PI/2;
  else if(axis==='x') m.rotation.z = Math.PI/2;
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  (parent||scene).add(m); return m;
}
function sph(r,mat,x,y,z,parent,ws,hs){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, ws||18, hs||14), mat);
  m.position.set(x,y,z); m.castShadow = true; (parent||scene).add(m); return m;
}
function torus(R,t,mat,x,y,z,parent,arc,rotZ){
  const m = new THREE.Mesh(new THREE.TorusGeometry(R,t,8,36,arc||Math.PI*2), mat);
  m.position.set(x,y,z); if(rotZ!==undefined) m.rotation.z = rotZ;
  m.castShadow = true; (parent||scene).add(m); return m;
}

{

  for(let i=0;i<=40;i++){ const x=-HALF_W+(i/40)*2*HALF_W; pts.push(new THREE.Vector2(x, archCeil(x))); }
  const shape = new THREE.Shape();
  shape.moveTo(-HALF_W, 0); shape.lineTo(-HALF_W, SPRING);
  pts.forEach(p=>shape.lineTo(p.x, p.y));
  shape.lineTo(HALF_W, 0); shape.closePath();

  const backGeo = new THREE.ShapeGeometry(shape, 8);
  const back = new THREE.Mesh(backGeo, M.brick);
  back.position.set(0,0,L_BACK); back.receiveShadow = true; scene.add(back);

  // front: same profile with arched opening hole
  const iHalf=14.6, iSpring=5.4, iApex=12.0;
  const iR = ((iApex-iSpring)*(iApex-iSpring) + iHalf*iHalf)/(2*(iApex-iSpring));
  const iC = iApex - iR;
  const hole = new THREE.Path();
  hole.moveTo(-iHalf, 0); hole.lineTo(-iHalf, iSpring);
  const iPts=[];
  for(let i=0;i<=40;i++){ const x=-iHalf+(i/40)*2*iHalf; iPts.push(new THREE.Vector2(x, iC + Math.sqrt(Math.max(0,iR*iR-x*x)))); }
  for(let i=iPts.length-1;i>=0;i--) hole.lineTo(iPts[i].x, iPts[i].y);
  hole.lineTo(iHalf, 0); hole.closePath();
  const frontShape = shape.clone(); frontShape.holes.push(hole);
  const front = new THREE.Mesh(new THREE.ShapeGeometry(frontShape, 8), M.brick);
  front.position.set(0,0,L_FRONT); front.receiveShadow = true; scene.add(front);

function setRodBetween(mesh, ax, ay, az, bx, by, bz){
  mesh.position.set((ax+bx)/2, (ay+by)/2, (az+bz)/2);
  const dz = bz-az, dy = by-ay;
  mesh.rotation.x = Math.atan2(dy, dz) * -1;
}
function updateMotionGear(){
  const th = S.wheelAngle;
  [-1,1].forEach((s, idx)=>{
    const phase = th + (s>0 ? Math.PI/2 : 0);   // right side leads by 90° — quartering
    const offY = Math.sin(phase)*0.55, offZ = Math.cos(phase)*0.55;
    const sideX = s*1.14;
    const midZ = 0.72;                          // mid driver
    sideRods[idx].position.set(sideX, AXLE_Y+offY, midZ - driverZ[1]*0 + offZ - 0 + (0));
    // side rod passes through all three crank pins (they share phase)
    sideRods[idx].position.z = (driverZ[0]+driverZ[2])/2 + offZ;
    sideRods[idx].position.y = AXLE_Y + offY;
    sideRods[idx].rotation.x = 0;
    // slider-crank for the rear driver → crosshead ahead
    const pinZ = driverZ[2] + offZ, pinY = AXLE_Y + offY;
    const L = 4.35;
    const cZ = pinZ - Math.sqrt(Math.max(0.5, L*L - offY*offY));
    const cross = crossheads[idx];
    cross.position.set(sideX, AXLE_Y, cZ);
    setRodBetween(mainRods[idx], sideX, pinY, pinZ, sideX, AXLE_Y, cZ);
    // valve gear: eccentric (phase + ~75°) driving the valve via union link
    const eOffY = Math.sin(phase + 1.32)*0.32, eOffZ = Math.cos(phase + 1.32)*0.32;
    const ePinZ = driverZ[1] + eOffZ, ePinY = AXLE_Y + eOffY;
    const vZ = cZ - 0.06, vY = AXLE_Y + 0.62;
    setRodBetween(eccRods[idx], sideX + s*0.06, AXLE_Y + eOffY*0.4, ePinZ, sideX + s*0.06, vY - 0.24, vZ);
    unionLinks[idx].position.set(sideX + s*0.02, (vY + AXLE_Y)/2 + 0.16, cZ);
    setRodBetween(valveRods[idx], sideX, vY, vZ, sideX, vY, vZ - 1.15);
  });
  // wheel spin
  drivers.forEach(d=>{ d.rotation.x = th * (d.position.x>0 ? 1 : 1); });
  ponyWheels.forEach(w=>{ w.rotation.x = S.ponyAngle; });
}

   PARTICLE SYSTEMS — smoke, steam, sparks (12 000 particles)
   ============================================================ */
const MAXS = 12000, MAX_SPARK = 320;
function makePool(max, blending){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(max*3), col = new Float32Array(max*3), size = new Float32Array(max), alp = new Float32Array(max);
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col,3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(size,1).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aAlpha',   new THREE.BufferAttribute(alp,1).setUsage(THREE.DynamicDrawUsage));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0,6,0), 400);
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: smokeSprite } },
    vertexShader:
      'attribute float aSize; attribute float aAlpha; attribute vec3 aColor;' +
      'varying float vA; varying vec3 vC;' +
      'void main(){ vA=aAlpha; vC=aColor; vec4 mv=modelViewMatrix*vec4(position,1.0);' +
      ' gl_PointSize = aSize * (330.0 / max(0.5,-mv.z)); gl_Position = projectionMatrix*mv; }',
    fragmentShader:
      'uniform sampler2D map; varying float vA; varying vec3 vC;' +
      'void main(){ vec4 t = texture2D(map, gl_PointCoord); float a = t.a * vA; if(a < 0.012) discard; gl_FragColor = vec4(vC, a); }',
    transparent: true, depthWrite: false, blending: blending
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false; scene.add(points);
  return { max, n:0, pos, col, size, alp, geo, points,
           px:new Float32Array(max), py:new Float32Array(max), pz:new Float32Array(max),
           vx:new Float32Array(max), vy:new Float32Array(max), vz:new Float32Array(max),
           life:new Float32Array(max), maxLife:new Float32Array(max),
           sz:new Float32Array(max), grow:new Float32Array(max),
           cr:new Float32Array(max), cg:new Float32Array(max), cb:new Float32Array(max),
           phase:new Float32Array(max), baseA:new Float32Array(max) };
}
const smokePool = makePool(6500, THREE.NormalBlending);
const steamPool = makePool(6000, THREE.AdditiveBlending);
const sparkPool = makePool(MAX_SPARK, THREE.AdditiveBlending);

function poolSpawn(p, x,y,z, vx,vy,vz, life, size, grow, r,g,b, baseA){
  if(p.n >= p.max) return;
  const i = p.n++;
  p.px[i]=x; p.py[i]=y; p.pz[i]=z; p.vx[i]=vx; p.vy[i]=vy; p.vz[i]=vz;
  p.life[i]=life; p.maxLife[i]=life; p.sz[i]=size; p.grow[i]=grow;
  p.cr[i]=r; p.cg[i]=g; p.cb[i]=b; p.phase[i]=rand()*6.28; p.baseA[i]=baseA;
}
function poolKill(p, i){
  const last = --p.n;
  if(i !== last){
    p.px[i]=p.px[last]; p.py[i]=p.py[last]; p.pz[i]=p.pz[last];
    p.vx[i]=p.vx[last]; p.vy[i]=p.vy[last]; p.vz[i]=p.vz[last];
    p.life[i]=p.life[last]; p.maxLife[i]=p.maxLife[last];
    p.sz[i]=p.sz[last]; p.grow[i]=p.grow[last];
    p.cr[i]=p.cr[last]; p.cg[i]=p.cg[last]; p.cb[i]=p.cb[last];
    p.phase[i]=p.phase[last]; p.baseA[i]=p.baseA[last];
  }
}
function updatePool(p, dt, isSpark, isSteam){
  const pos=p.pos, col=p.col, size=p.size, alp=p.alp;
  for(let i=0;i<p.n;i++){
    p.life[i] -= dt;
    if(p.life[i] <= 0){ poolKill(p, i); i--; continue; }
    const ph = p.phase[i];
    if(isSpark){
      p.vy[i] -= 6.5*dt;
      p.vx[i] *= (1 - 0.6*dt); p.vz[i] *= (1 - 0.6*dt);
    } else {
      p.vy[i] += (isSteam ? 0.55 : 0.8) * dt;               // buoyancy
      p.vx[i] *= (1 - 0.5*dt); p.vy[i] *= (1 - 0.35*dt); p.vz[i] *= (1 - 0.5*dt);
      p.vx[i] += Math.sin(p.py[i]*0.33 + S.time*1.35 + ph) * 0.42 * dt;
      p.vz[i] += Math.cos(p.py[i]*0.29 + S.time*1.1 + ph*1.7) * 0.42 * dt;
      // pooling under the glass roof
      const ceil = archCeil(p.px[i]) - 0.55;
      if(p.py[i] > ceil){
        p.py[i] = ceil;
        p.vy[i] = -Math.abs(p.vy[i]) * 0.22;
        p.vx[i] += Math.sign(p.px[i] || 0.1) * 1.6 * dt;
        p.vz[i] += 0.9 * dt;
      }
      p.sz[i] += p.grow[i]*dt;
    }
    p.px[i] += p.vx[i]*dt; p.py[i] += p.vy[i]*dt; p.pz[i] += p.vz[i]*dt;
    if(p.py[i] < 0.12 && isSpark){ p.py[i] = 0.12; p.vy[i] = Math.abs(p.vy[i])*0.42; p.vx[i]*=0.6; p.vz[i]*=0.6; }
    const age = p.maxLife[i] - p.life[i];
    const fadeIn = Math.min(1, age / (p.maxLife[i]*0.12));
    const fadeOut = clamp(p.life[i] / (p.maxLife[i]*0.62), 0, 1);
    const a = fadeIn * fadeOut * p.baseA[i];
    const j = i*3;
    pos[j]=p.px[i]; pos[j+1]=p.py[i]; pos[j+2]=p.pz[i];
    col[j]=p.cr[i]; col[j+1]=p.cg[i]; col[j+2]=p.cb[i];
    size[i]=p.sz[i]; alp[i]=a;
  }
  p.geo.attributes.position.needsUpdate = true;
  p.geo.attributes.aColor.needsUpdate = true;
  p.geo.attributes.aSize.needsUpdate = true;
  p.geo.attributes.aAlpha.needsUpdate = true;
  p.geo.setDrawRange(0, p.n);
}
function clearPool(p){ p.n = 0; p.geo.setDrawRange(0,0); }
function emitChimney(strength){
  const z = S.trainZ - 4.45;
  for(let k=0;k<strength;k++){
    const dark = rand() < 0.42;
    const spread = 0.16;
    const vx = randRange(-spread, spread), vz = randRange(-spread, spread) + S.vel*0.25;
    const vy = randRange(3.4, 5.6);
    const shade = dark ? randRange(0.09, 0.2) : randRange(0.82, 1.0);
    const tint = dark ? shade : shade;
    if(dark) poolSpawn(smokePool, randRange(-0.12,0.12), 4.85, z + randRange(-0.1,0.1), vx, vy, vz, randRange(2.6,4.6), randRange(0.55,0.95), randRange(1.1,1.9), tint, tint, tint, 0.88);
    else     poolSpawn(steamPool, randRange(-0.12,0.12), 4.85, z + randRange(-0.1,0.1), vx, vy, vz, randRange(2.2,3.8), randRange(0.45,0.85), randRange(1.5,2.4), tint, tint, tint*0.97, 0.5);
  }
}
function emitCylinders(strength){
  const z = S.trainZ - 3.5;
  for(let k=0;k<strength;k++){
    const s = rand() < 0.5 ? -1 : 1;
    const vy = randRange(0.4, 1.5);
    poolSpawn(steamPool, s*1.25, AXLE_Y - 0.35, z + randRange(-0.5,0.5),
      s*randRange(2.2, 4.4), vy, randRange(-0.8, 0.8) + S.vel*0.35,
      randRange(1.1, 2.1), randRange(0.3, 0.55), randRange(1.4, 2.2), 0.96, 0.97, 1.0, 0.62);
  }
}
function emitSparks(strength){
  for(let k=0;k<strength;k++){
    const s = rand() < 0.5 ? -1 : 1;
    const dz = pick(driverZ);
    poolSpawn(sparkPool, s*1.05, 0.28, S.trainZ + dz + randRange(-0.3,0.3),
      s*randRange(0.6, 2.6), randRange(0.8, 3.4), randRange(2.2, 6.2) - S.vel*0.35,
      randRange(0.45, 1.05), randRange(0.05, 0.13), 0.0, 1.0, randRange(0.45, 0.78), 0.12, 1.0);
  }
}

function doorWorldZ(idx){ return S.trainZ + coachDoorLocal[idx]; }
function updatePassengers(dt){
  let ashore = 0;
  passengers.forEach((p, i)=>{
    if(S.phase === 'approach'){ return; }
    const pt = S.time - S.stopTime - p.spawnDelay;
    if(pt < 0) return;
    ashore++;
    const g = p.grp;
    g.visible = true;
    const doorZ = doorWorldZ(p.doorIdx) + p.jz;
    const doorX = p.side * 1.42;
    const platX = p.side * 4.8;
    const targetZ = clamp(doorZ + p.tzJitter, L_BACK+6, L_FRONT-8);
    const targetX = clamp(p.side * (Math.abs(p.tx)), 2.8, 6.6) * p.side;
    if(pt < 0.95){
      // stepping down: from coach floor to platform
      const u = smoothstep(0, 1, pt/0.95);
      g.position.set(lerp(doorX, doorX + p.side*0.55, u), lerp(2.0, PLAT_H, u), doorZ);
      g.rotation.y = p.side > 0 ? Math.PI/2 : -Math.PI/2;
    } else {
      // walking to muster point
      if(p.state !== 'walking' && p.state !== 'idle'){
        p.state = 'walking';
        p.fromX = doorX + p.side*0.55; p.fromZ = doorZ;
        p.dist = 0;
      }
      if(p.state === 'walking'){
        const dx = targetX - p.fromX, dz = targetZ - p.fromZ;
        const total = Math.hypot(dx, dz);
        p.dist += 1.18*dt;
        const u = clamp(p.dist / total, 0, 1);
        const bob = Math.abs(Math.sin(p.dist*6.4 + p.wob)) * 0.05;
        g.position.set(lerp(p.fromX, targetX, u), PLAT_H + bob, lerp(p.fromZ, targetZ, u));
        g.rotation.y = Math.atan2(dx, dz);
        if(u >= 1) p.state = 'idle';
      } else {
        // idle — gentle sway, looking about
        g.position.y = PLAT_H;
        g.rotation.y += Math.sin(S.time*0.7 + p.wob*3.0) * 0.0016;
      }
    }
  });
  S.passengersAshore = ashore;
}

function updatePorters(){

    const u = clamp((S.time - startT) / 13.5, 0, 1);
    if(u <= 0){ p.cart.position.set(0,0,9999); p.porter.position.set(0,-5,9999); return; }

    p.porter.rotation.y = p.dir > 0 ? Math.PI : 0;
  });

/* --- master step (fixed dt for determinism) --- */
function stepSim(dt){
  S.time += dt;
  /* evening lighting ramp */
  if(S.showcase && S.time > S.autoEveningAt) S.eveningTarget = 1;
  S.evening += (S.eveningTarget - S.evening) * Math.min(1, dt*2.2);
  if(Math.abs(S.evening - S.eveningTarget) < 0.002) S.evening = S.eveningTarget;
  applyEvening(S.evening);

  const REST = REST_Z;
  if(S.phase === 'approach'){
    const brakeDist = Math.max(0, S.trainZ - REST);
    const vProfile = Math.sqrt(Math.max(0, 2 * BRAKE_A * brakeDist));
    S.vel = Math.min(S.v0, vProfile);
    S.trainZ -= S.vel * dt;
    S.wheelVel = -S.vel / DRIVER_R;
    S.wheelAngle += S.wheelVel * dt;
    S.ponyAngle += (S.vel / 0.55) * dt;
    setTrainZ(S.trainZ);
    /* braking sparks */
    const braking = S.vel < S.v0 - 0.6;
    if(braking && S.vel > 2.5){
      S.sparkAcc += 90 * dt * (S.vel / S.v0 + 0.4);
      while(S.sparkAcc > 1){ emitSparks(1); S.sparkAcc -= 1; }
    }
    /* chimney steam while working */
    S.smokeAcc += (26 + S.vel*1.15) * dt * (0.72 + 0.4*Math.sin(S.wheelAngle*2));
    while(S.smokeAcc > 1){ emitChimney(1); S.smokeAcc -= 1; }
    if(braking && S.vel < 9){ S.cylAcc += 55*dt; while(S.cylAcc > 1){ emitCylinders(1); S.cylAcc -= 1; } }
    if(S.trainZ <= REST + 0.02){
      S.trainZ = REST; S.vel = 0; S.phase = 'stopped'; S.stopTime = S.time;
      setTrainZ(S.trainZ);
      /* sigh of relief — cylinder cocks blow off */
      emitCylinders(26); emitChimney(12);
    }
  }
  else if(S.phase === 'stopped'){
    S.wheelVel = 0;
    /* doors */
    const wantOpen = !S.doDispatch && S.time > S.stopTime + 0.45;
    const rate = dt / 1.25;
    S.doorT = clamp(S.doorT + (wantOpen ? rate : -rate), 0, 1);
    coachDoors.forEach(d=>{ d.hinge.rotation.y = d.side * S.doorT * 1.75; });
    /* idle wisps */
    S.smokeAcc += 6.5*dt;
    while(S.smokeAcc > 1){ emitChimney(1); S.smokeAcc -= 1; }
    /* dispatch trigger */
    if(S.dispatchReq || (S.showcase && S.time > S.autoDispatchAt)) S.doDispatch = true;
    if(S.doDispatch && S.doorT <= 0){
      S.phase = 'depart'; S.slipT = 0;
      emitCylinders(70); emitChimney(30);
    }
    updatePassengers(dt); updatePorters();
  }
  else if(S.phase === 'depart'){
    S.slipT += dt;
    const slipping = S.slipT < 1.15;
    const accel = slipping ? 0.85 : 3.35;
    S.vel = Math.min(S.vel + accel*dt, 10.5);
    S.trainZ += S.vel * dt;
    const slipEnv = Math.max(0, 1 - S.slipT/1.15);
    S.wheelVel = (S.vel / DRIVER_R) + 11.5*Math.pow(slipEnv, 1.6);
    S.wheelAngle += S.wheelVel * dt;
    S.ponyAngle += (S.vel / 0.55) * dt;
    setTrainZ(S.trainZ);
    updateMotionGear();
    /* door spring shut */
    S.doorT = clamp(S.doorT - dt/1.0, 0, 1);
    coachDoors.forEach(d=>{ d.hinge.rotation.y = d.side * S.doorT * 1.75; });
    /* steam — heavy at first, then working chuffs */
    const chuff = 0.62 + 0.5*Math.max(0, Math.sin(S.wheelAngle*2));
    const rate = S.slipT < 1.4 ? 210 : (30 + Math.abs(S.wheelVel)*9) * chuff;
    S.smokeAcc += rate*dt;
    while(S.smokeAcc > 1){ emitChimney(1); S.smokeAcc -= 1; }
    S.cylAcc += (S.slipT < 1.6 ? 95 : 22)*dt;
    while(S.cylAcc > 1){ emitCylinders(1); S.cylAcc -= 1; }
    if(slipEnv > 0.3){ S.sparkAcc += 60*dt; while(S.sparkAcc > 1){ emitSparks(1); S.sparkAcc -= 1; } }
    updatePassengers(dt); updatePorters();
  }

  updateMotionGear();
  updatePool(smokePool, dt, false, false);
  updatePool(steamPool, dt, false, true);
  updatePool(sparkPool, dt, true, false);
  updateMotes();
  updateClockHands();
  /* firebox glow */
  loco.userData.fireMat.emissiveIntensity = 1.9 + Math.sin(S.time*13.1)*0.45 + Math.sin(S.time*7.3)*0.3;
  /* tail signal arm drops away on dispatch */
  ...
}

  { t: 3.5,  p: [-8.6, 2.3, 2.5], l: [0, 2.1, -42] },
  { t: 5.3,  p: [6.3, 3.4, -15],  l: [0, 2.3, -50] },
  { t: 6.7,  p: [5.1, 2.15, -28], l: [3.4, 1.2, -10.5] },
  { t: 7.6,  p: [11, 6.4, 8],     l: [-1, 3.2, -34] },
  { t: 8.7,  cab: true },
  { t: 10.6, cab: true },
  { t: 11.3, p: [-7.5, 4.6, 28],  l: [0, 2.1, 12] },
  { t: 12.0, p: [2, 8.6, 47],     l: [0, 2.4, 30] }
];
function resolveKey(k){
  if(k.cab){ const c = cabPose(); return { p: c.p, l: c.l }; }
  return { p: V3(k.p[0], k.p[1], k.p[2]), l: V3(k.l[0], k.l[1], k.l[2]) };
}
const _ka = V3(0,0,0), _kb = V3(0,0,0);
function showcaseCamera(t){
  t = clamp(t, 0, 12);
  let i = 0;
  while(i < SC_KEYS.length - 2 && SC_KEYS[i+1].t < t) i++;
  const k0 = SC_KEYS[i], k1 = SC_KEYS[i+1];
  const span = Math.max(0.0001, k1.t - k0.t);
  const u = smoothstep(0, 1, (t - k0.t)/span);
  const a = resolveKey(k0), b = resolveKey(k1);
  camera.position.lerpVectors(a.p, b.p, u);
  _ka.lerpVectors(a.l, b.l, u);
  camera.lookAt(_ka);
}
function seek(t){
  mode = 'showcase';
  controls.enabled = false;
  resetSim();
  S.showcase = true;
  S.autoDispatchAt = 8.6;
  S.autoEveningAt = 7.7;
  const step = 1/60, n = Math.floor(clamp(t,0,12)/step + 1e-6);
  for(let i=0;i<n;i++) stepSim(step);
  S.showcase = false;
  showcaseCamera(t);
  /* render exactly one frame */
  composer.render();
  refreshBench();
}
window.showcase = { duration: 12, seek: seek };

/* ============================================================
   POST-PROCESSING — bloom
   ============================================================ */
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.72, 0.78);
composer.addPass(bloom);

/* ============================================================
   BENCH + UI
   ============================================================ */
window.__bench = { trainSpeed: 0, steamParticles: 0, passengers: 0, wheelAngle: 0 };
const bSpeed = document.getElementById('bSpeed');
const bSteam = document.getElementById('bSteam');
const bPass  = document.getElementById('bPass');
const bWheel = document.getElementById('bWheel');
function refreshBench(){
  window.__bench.trainSpeed = Math.abs(S.vel);
  window.__bench.steamParticles = smokePool.n + steamPool.n;
  window.__bench.passengers = S.passengersAshore || 0;
  window.__bench.wheelAngle = S.wheelAngle;
  bSpeed.textContent = (Math.abs(S.vel)*2.237).toFixed(1) + ' mph';
  bSteam.textContent = String(smokePool.n + steamPool.n);
  bPass.textContent  = String(S.passengersAshore || 0);
  bWheel.textContent = (S.wheelAngle % (Math.PI*2)).toFixed(2);
}

const toast = document.getElementById('toast');
let toastTimer = null;
function showToast(msg){
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 1900);
}

let cabMode = false;
const preCabCam = new THREE.Vector3(), preCabTarget = new THREE.Vector3();

window.addEventListener('keydown', e=>{
  if(e.code === 'Space'){
    e.preventDefault();
    if(S.phase === 'stopped' && !S.doDispatch){
      S.dispatchReq = true;
      showToast('Right away!');
      signalArm.rotation.z = 0.62;
    } else if(S.phase === 'approach'){ showToast('She’s still coming in…'); }
  }
  else if(e.code === 'KeyC'){
    cabMode = !cabMode;
    if(cabMode){
      preCabCam.copy(camera.position); preCabTarget.copy(controls.target);
      controls.enabled = false;
      showToast('Cab ride — mind the coal');
    } else {
      controls.enabled = true;
      camera.position.copy(preCabCam); controls.target.copy(preCabTarget);
      controls.update();
      showToast('Back on the platform');
    }
  }
  else if(e.code === 'KeyT'){
    S.eveningTarget = S.eveningTarget > 0.5 ? 0 : 1;
    drawSky(S.eveningTarget);
    showToast(S.eveningTarget > 0.5 ? 'Gaslight — evening service' : 'Afternoon sun');
  }
});

/* ============================================================
   RECORD VIDEO — plays the showcase, saves a .webm
   ============================================================ */
const recBtn = document.getElementById('recBtn');
let recording = false;
recBtn.addEventListener('click', ()=>{
  if(recording) return;
  recording = true;
  recBtn.disabled = true;
  recBtn.innerHTML = '<span class="dot">●</span> Recording…';
  const savedCam = camera.position.clone(), savedTgt = controls.target.clone();
  const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const stream = renderer.domElement.captureStream(60);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14000000 });
  const chunks = [];
  rec.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = ()=>{
    const blob = new Blob(chunks, { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'westbury-terminus-showcase.webm';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    camera.position.copy(savedCam); controls.target.copy(savedTgt);
    controls.enabled = true; mode = 'live';
    resetSim();
    recBtn.disabled = false; recBtn.innerHTML = '<span class="dot">●</span> Record video';
    recording = false;
    showToast('Showcase saved — westbury-terminus-showcase.webm');
  };
  mode = 'showcase'; controls.enabled = false;
  window.showcase.seek(0);
  rec.start(250);
  const t0 = performance.now();
  function frame(){
    const t = (performance.now() - t0)/1000;
    if(t >= window.showcase.duration){
      window.showcase.seek(window.showcase.duration);
      rec.stop();
      return;
    }
    window.showcase.seek(Math.max(0, t));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
});

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(mode === 'live'){
    /* sub-step for stable particle integration */
    const n = Math.max(1, Math.ceil(dt / (1/60)));
    const sub = dt / n;
    for(let i=0;i<n;i++) stepSim(sub);
    if(cabMode){
      const pose = cabPose();
      camera.position.lerp(pose.p, Math.min(1, dt*7));
      camera.lookAt(pose.l);
    } else {
      controls.update();
    }
  } else if(mode === 'showcase' && !recording){
    /* showcase frames are driven by seek(); keep the canvas alive */
    camera.lookAt(camera.position.clone().add(V3(0,0,-1)));
  }
  composer.render();
  refreshBench();
}

/* shadow flags on big props */
scene.traverse(o=>{ if(o.isMesh && o.castShadow === undefined) o.castShadow = true; });

resetSim();
refreshBench();
animate();

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>

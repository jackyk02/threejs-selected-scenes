<script>
'use strict';
/* ============================================================
   KINGSBRIDGE TERMINUS — a Victorian railway in one file.
   Everything procedural. No assets. Fixed-step simulation that
   can be re-run deterministically from t=0 (see window.showcase).
   ============================================================ */

// ---------- deterministic RNG ----------
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(20240607);

// ---------- layout constants ----------
const Z_MIN = -64, Z_MAX = 38;
const SHED_LEN = Z_MAX - Z_MIN;
const RX = 17, SPRING_Y = 8, RISE = 9.5;
const TRACKS = [-9, 0, 9];
const PLAT_X = [-4.5, 4.5];
const COL_X = [-6.4, -2.6, 2.6, 6.4];

// train dynamics
const Z0 = -52, Z_STOP = -2.8, V0 = 24, BRAKE = 5.85;
const T_ARRIVE = V0 / BRAKE;               // ≈ 4.10 s
const OPEN_T = 4.75;                        // doors begin to open
const SHOWCASE_DISPATCH = 8.8;              // scripted dispatch inside showcase
const DRIVER_R = 0.92, TENDER_R = 0.55, COACH_R = 0.50;
const FIXED_DT = 1 / 60;

// ---------- renderer / scene / camera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const ATMO = {
  afternoon: { bg:new THREE.Color(0xc9d4d8), fogNear:85, fogFar:330,
    sun:2.35, sunCol:new THREE.Color(0xffe6bd), hemiSky:new THREE.Color(0xcfe0ea), hemiGround:new THREE.Color(0x6b5646), hemi:0.62,
    lampGlow:0.35, lampLight:0.0, glassTint:new THREE.Color(0xcfe4e6), shaft:0.34, bloom:0.28, windowGlow:0.25, exposure:1.12 },
  evening:   { bg:new THREE.Color(0x0d1420), fogNear:55, fogFar:230,
    sun:0.32, sunCol:new THREE.Color(0x8496b8), hemiSky:new THREE.Color(0x232c3c), hemiGround:new THREE.Color(0x100c08), hemi:0.42,
    lampGlow:2.6, lampLight:1.35, glassTint:new THREE.Color(0x36404e), shaft:0.07, bloom:0.62, windowGlow:2.0, exposure:0.98 }
};
let timeMode = 'afternoon';

scene.background = ATMO.afternoon.bg.clone();
scene.fog = new THREE.Fog(ATMO.afternoon.bg.clone(), ATMO.afternoon.fogNear, ATMO.afternoon.fogFar);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(11.5, 4.8, 10.5);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.3, -6);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.5;
controls.maxDistance = 80;
controls.maxPolarAngle = 1.52;
controls.update();

// composer + bloom
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), ATMO.afternoon.bloom, 0.55, 0.82);
composer.addPass(bloom);

// ---------- lights ----------
const sunTarget = new THREE.Object3D();
sunTarget.position.set(-4, 0, -12); scene.add(sunTarget);
const sun = new THREE.DirectionalLight(ATMO.afternoon.sunCol, ATMO.afternoon.sun);
sun.position.set(30, 38, 4);
sun.target = sunTarget;
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -55; sun.shadow.camera.right = 55;
sun.shadow.camera.top = 55; sun.shadow.camera.bottom = -55;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);

const hemi = new THREE.HemisphereLight(ATMO.afternoon.hemiSky, ATMO.afternoon.hemiGround, ATMO.afternoon.hemi);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.12); scene.add(amb);

// evening point lights (a subset of lamps, repositioned for warmth)
const eveningLights = [];
[[-4.5, 12.6, -32],[4.5, 12.6, -8],[-4.5, 12.6, 16],[0, 10.5, 30]].forEach(p=>{
  const pl = new THREE.PointLight(0xffb45a, 0, 20, 2);
  pl.position.set(p[0], p[1], p[2]);
  scene.add(pl); eveningLights.push(pl);
});

// ============================================================
//  procedural canvas textures
// ============================================================
function makeCanvas(w,h,fn){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.encoding = THREE.sRGBEncoding;
  return t;
}

const brickTex = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#33261f'; g.fillRect(0,0,w,h);
  const bw=32, bh=16;
  const shades=['#6b4234','#74493b','#5e3a2e','#7c5041','#66402f'];
  for(let y=0;y<h;y+=bh){
    const off=((y/bh)%2)*bw/2;
    for(let x=-bw;x<w+bw;x+=bw){
      g.fillStyle=shades[(Math.sin((x*13.7+y*7.1)*12.9898)*43758.5453 % 1 + 1)%1 * shades.length | 0] || shades[0];
      g.fillRect(x+off+1,y+1,bw-2,bh-2);
      g.fillStyle='rgba(0,0,0,0.18)'; g.fillRect(x+off+1,y+bh-4,bw-2,2);
    }
  }
  for(let i=0;i<800;i++){ g.fillStyle='rgba(0,0,0,'+(Math.random()*0.15)+')'; g.fillRect(Math.random()*w,Math.random()*h,2,2); }
});
brickTex.repeat.set(0.5,0.5);

const floorTex = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#37363a'; g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){
    const v=Math.random();
    g.fillStyle = v<0.5 ? 'rgba(255,255,255,'+(Math.random()*0.05)+')' : 'rgba(0,0,0,'+(Math.random()*0.22)+')';
    g.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*3,2+Math.random()*3);
  }
});
floorTex.repeat.set(6,6);

const stoneTex = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#8d8578'; g.fillRect(0,0,w,h);
  for(let i=0;i<2000;i++){
    g.fillStyle='rgba(0,0,0,'+(Math.random()*0.12)+')';
    g.fillRect(Math.random()*w,Math.random()*h,2,2);
  }
  g.strokeStyle='rgba(40,36,30,0.85)'; g.lineWidth=3;
  for(let y=0;y<=h;y+=64){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
  for(let x=0;x<=w;x+=64){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
});
stoneTex.repeat.set(1.4,22);

function liveryTexture(mirror){
  return makeCanvas(512,160,(g,w,h)=>{
    g.fillStyle='#163a29'; g.fillRect(0,0,w,h);
    const grd=g.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,'#1d4530'); grd.addColorStop(0.5,'#163a29'); grd.addColorStop(1,'#10281c');
    g.fillStyle=grd; g.fillRect(0,0,w,h);
    // cream panel band
    g.fillStyle='#e8dcc2'; g.fillRect(0,14,w,64);
    g.fillStyle='#d8cba6'; g.fillRect(0,70,w,8);
    // gold lining
    g.fillStyle='#c9a24e'; g.fillRect(0,4,w,3); g.fillRect(0,84,w,3);
    g.fillRect(0,120,w,2); g.fillRect(0,140,w,2);
    // windows (dark, arched tops)
    g.save(); if(mirror){ g.translate(w,0); g.scale(-1,1); }
    for(let i=0;i<7;i++){
      const x=26+i*68;
      g.fillStyle='#10151c';
      g.beginPath(); g.moveTo(x,66); g.lineTo(x,34); g.quadraticCurveTo(x+17,16,x+34,34); g.lineTo(x+34,66); g.closePath(); g.fill();
      g.fillStyle='rgba(200,220,235,0.14)'; g.fillRect(x+4,30,10,30);
    }
    // lettering
    g.fillStyle='#d9b45c';
    g.font='bold 26px Georgia'; g.textAlign='center'; g.textBaseline='middle';
    g.letterSpacing='6px';
    g.fillText('GREAT NORTHERN', w/2, 112);
    g.restore();
  });
}
const liveryR = liveryTexture(false), liveryL = liveryTexture(true);

const wheelTex = makeCanvas(256,256,(g,w,h)=>{
  g.fillStyle='#0d0d0f'; g.beginPath(); g.arc(128,128,126,0,Math.PI*2); g.fill();
  g.fillStyle='#1a1a1e'; g.beginPath(); g.arc(128,128,104,0,Math.PI*2); g.fill();
  g.fillStyle='#2c2c31'; g.beginPath(); g.arc(128,128,86,0,Math.PI*2); g.fill();
  // spokes
  g.strokeStyle='#45454a'; g.lineWidth=14;
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    g.beginPath(); g.moveTo(128+Math.cos(a)*22,128+Math.sin(a)*22); g.lineTo(128+Math.cos(a)*84,128+Math.sin(a)*84); g.stroke();
  }
  // counterweight crescent
  g.fillStyle='#3a3a40'; g.beginPath(); g.arc(128,128,88,Math.PI*0.15,Math.PI*0.55); g.arc(128,128,58,Math.PI*0.55,Math.PI*0.15,true); g.fill();
  g.fillStyle='#55555c'; g.beginPath(); g.arc(128,128,22,0,Math.PI*2); g.fill();
  g.fillStyle='#77777e'; g.beginPath(); g.arc(128,128,8,0,Math.PI*2); g.fill();
});

const clockTex = makeCanvas(256,256,(g)=>{
  g.clearRect(0,0,256,256);
  g.fillStyle='#efe6cd'; g.beginPath(); g.arc(128,128,120,0,Math.PI*2); g.fill();
  g.strokeStyle='#241d12'; g.lineWidth=8; g.beginPath(); g.arc(128,128,116,0,Math.PI*2); g.stroke();
  g.lineWidth=2.5; g.beginPath(); g.arc(128,128,96,0,Math.PI*2); g.stroke();
  const RN=['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
  g.fillStyle='#241d12'; g.font='bold 26px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6 - Math.PI/2;
    g.fillText(RN[i], 128+Math.cos(a)*74, 128+Math.sin(a)*74);
  }
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30;
    g.lineWidth = i%5===0?4:1.5;
    g.beginPath();
    g.moveTo(128+Math.cos(a)*104,128+Math.sin(a)*104);
    g.lineTo(128+Math.cos(a)*112,128+Math.sin(a)*112);
    g.stroke();
  }
});

const signTex = (makeCanvas(1024,160,(g,w,h)=>{
  g.fillStyle='#12241a'; g.fillRect(0,0,w,h);
  g.strokeStyle='#c9a24e'; g.lineWidth=6; g.strokeRect(8,8,w-16,h-16);
  g.fillStyle='#e3c878'; g.font='bold 78px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('KINGSBRIDGE TERMINUS', w/2, h/2+2);
}));
const wayOutTex = (makeCanvas(512,128,(g,w,h)=>{
  g.fillStyle='#141414'; g.fillRect(0,0,w,h);
  g.strokeStyle='#c9a24e'; g.lineWidth=4; g.strokeRect(6,6,w-12,h-12);
  g.fillStyle='#e3c878'; g.font='bold 56px Georgia'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('WAY OUT', w/2, h/2);
}));
const posterTex = makeCanvas(256,340,(g,w,h)=>{
  g.fillStyle='#cfe3e2'; g.fillRect(0,0,w,h);
  const sky=g.createLinearGradient(0,0,0,h*0.55);
  sky.addColorStop(0,'#7fb2c9'); sky.addColorStop(1,'#e8d9a8');
  g.fillStyle=sky; g.fillRect(14,14,w-28,h*0.5);
  g.fillStyle='#e8b23a'; g.beginPath(); g.arc(w/2,h*0.38,34,0,Math.PI*2); g.fill();
  g.fillStyle='#3a6a8a'; g.fillRect(14,h*0.5,w-28,h*0.14);
  g.fillStyle='#20405c'; g.fillRect(14,h*0.6,w-28,h*0.14);
  g.fillStyle='#14202c'; g.font='bold 34px Georgia'; g.textAlign='center';
  g.fillText('SEASIDE', w/2, h*0.82);
  g.font='italic 15px Georgia'; g.fillText('Great Northern Railway', w/2, h*0.9);
  g.strokeStyle='#14202c'; g.lineWidth=10; g.strokeRect(0,0,w,h);
});
const archDarkTex = makeCanvas(256,384,(g,w,h)=>{
  g.fillStyle='#241a12'; g.fillRect(0,0,w,h);
  const grd=g.createRadialGradient(w/2,h*0.62,20,w/2,h*0.6,w*0.75);
  grd.addColorStop(0,'#000000'); grd.addColorStop(0.7,'#0a0805'); grd.addColorStop(1,'#241a12');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
});
const archWindowTex = makeCanvas(512,512,(g,w,h)=>{
  g.fillStyle='#0e141c'; g.fillRect(0,0,w,h);
  const grd=g.createRadialGradient(w/2,h*0.7,30,w/2,h*0.55,w*0.7);
  grd.addColorStop(0,'#3d5068'); grd.addColorStop(1,'#0e141c');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  g.strokeStyle='#c9a24e'; g.lineWidth=10;
  // radial fanlight bars
  for(let i=0;i<=8;i++){
    const a=Math.PI+(i/8)*Math.PI;
    g.beginPath(); g.moveTo(w/2,h*0.52); g.lineTo(w/2+Math.cos(a)*w*0.46, h*0.52+Math.sin(a)*w*0.46); g.stroke();
  }
  g.lineWidth=14; g.beginPath(); g.arc(w/2,h*0.52,w*0.46,Math.PI,0); g.stroke();
  g.beginPath(); g.arc(w/2,h*0.52,w*0.2,Math.PI,0); g.stroke();
  for(let x=w*0.09;x<w;x+=w*0.13){ g.beginPath(); g.moveTo(x,h*0.52); g.lineTo(x,h); g.stroke(); }
  g.lineWidth=14; g.beginPath(); g.moveTo(0,h*0.52); g.lineTo(w,h*0.52); g.stroke();
});
const softDotTex = makeCanvas(64,64,(g)=>{
  const grd=g.createRadialGradient(32,32,1,32,32,31);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(0.35,'rgba(255,255,255,0.7)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,64,64);
});
const shaftTex = makeCanvas(128,256,(g,w,h)=>{
  const grd=g.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'rgba(255,244,214,0.9)');
  grd.addColorStop(0.6,'rgba(255,244,214,0.28)');
  grd.addColorStop(1,'rgba(255,244,214,0)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  for(let i=0;i<7;i++){ g.fillStyle='rgba(255,255,255,0.28)'; const x=10+i*18+Math.random()*6; g.fillRect(x,0,3+Math.random()*4,h); }
});

function plateTex(text){
  return makeCanvas(256,128,(g,w,h)=>{
    g.fillStyle='#241a08'; g.fillRect(0,0,w,h);
    g.strokeStyle='#e8c86a'; g.lineWidth=8; g.strokeRect(6,6,w-12,h-12);
    g.fillStyle='#f4dc8e'; g.font='bold 56px Georgia'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(text, w/2, h/2+2);
  });
}

// ============================================================
//  materials
// ============================================================
const M = {
  iron:      new THREE.MeshStandardMaterial({ color:0x2c3134, roughness:0.55, metalness:0.75 }),
  ironGreen: new THREE.MeshStandardMaterial({ color:0x1e3529, roughness:0.5,  metalness:0.55 }),
  ironLight: new THREE.MeshStandardMaterial({ color:0x454e54, roughness:0.5,  metalness:0.7 }),
  brass:     new THREE.MeshStandardMaterial({ color:0xc8a24a, roughness:0.24, metalness:1.0, emissive:0x2a1e05, emissiveIntensity:0.4 }),
  copper:    new THREE.MeshStandardMaterial({ color:0xb87333, roughness:0.3,  metalness:1.0 }),

function buildClockFace(r){

  g.add(rim);

  const hourGeo = new THREE.BoxGeometry(r*0.09, r*0.5, 0.02); hourGeo.translate(0, r*0.2, 0);
  const minGeo  = new THREE.BoxGeometry(r*0.06, r*0.78, 0.02); minGeo.translate(0, r*0.32, 0);
  const hour = new THREE.Mesh(hourGeo, M.black); hour.position.z = 0.03; g.add(hour);
  const min  = new THREE.Mesh(minGeo,  M.black); min.position.z  = 0.045; g.add(min);
  const pin  = new THREE.Mesh(new THREE.CylinderGeometry(r*0.07, r*0.07, 0.05, 12), M.brass);
  pin.rotation.x = Math.PI/2; pin.position.z = 0.05; g.add(pin);
  clockHands.push({hour, min});
  return g;
}

function placeRod(mesh, ax,ay,az, bx,by,bz){
  const dy = by-ay, dz = bz-az, len = Math.hypot(dy, dz);
  mesh.position.set((ax+bx)/2, (ay+by)/2, (az+bz)/2);
  mesh.scale.z = len;
  mesh.rotation.set(-Math.atan2(dy, dz), 0, 0);
}
function updateValveGear(driverAngle){
  [-1,1].forEach(side=>{
    const x = side*1.06;
    const phase = driverAngle + (side>0 ? 0 : Math.PI/2);
    const cy = DRIVER_R, crankR = 0.45;
    const py = cy + Math.cos(phase)*crankR, pz = DRIVER_Z[0] + Math.sin(phase)*crankR;
    // side rod — the three pins share phase, so this is a pure translation
    const midZ = (DRIVER_Z[0]+DRIVER_Z[2])/2;
    const rSide = rods.find(r=>r.side===side && r.kind==='side');
    rSide.mesh.position.set(x + side*0.14, cy + Math.cos(phase)*crankR, midZ + Math.sin(phase)*crankR);
    rSide.mesh.scale.z = 4.9; rSide.mesh.rotation.set(0,0,0);
    // main rod: front driver pin → crosshead (horizontal guide at y=1.12)
    const gy = 1.12, L = 1.62;
    const dz = Math.sqrt(Math.max(0.2, L*L - (py-gy)*(py-gy)));
    const crossZ = pz + dz;
    const rMain = rods.find(r=>r.side===side && r.kind==='main');
    placeRod(rMain.mesh, x + side*0.14, py, pz, x + side*0.14, gy, crossZ);
    const rCross = rods.find(r=>r.side===side && r.kind==='cross');
    rCross.mesh.position.set(x + side*0.13, gy, crossZ);
    const rPiston = rods.find(r=>r.side===side && r.kind==='piston');
    rPiston.mesh.position.set(x + side*0.13, gy, crossZ + 0.62);
    // valve gear: eccentric rod from rear driver eccentric → rocker
    const eccPhase = phase + 2.25;
    const epy = cy + Math.cos(eccPhase)*0.36, epz = DRIVER_Z[2] + Math.sin(eccPhase)*0.36;
    const rockerPivot = { y: 2.3, z: 0.55 };
    const rockerAng = 0.42*Math.sin(phase + 0.85);
    const rEcc = rods.find(r=>r.side===side && r.kind==='ecc');
    const rTopY = rockerPivot.y + Math.cos(rockerAng)*0.42, rTopZ = rockerPivot.z + Math.sin(rockerAng)*0.42;
    placeRod(rEcc.mesh, x + side*0.13, epy, epz, x + side*0.13, rTopY, rTopZ);
    // rocker plate oscillates
    const rRocker = rods.find(r=>r.side===side && r.kind==='rocker');
    rRocker.mesh.position.set(x + side*0.16, rockerPivot.y, rockerPivot.z);
    rRocker.mesh.rotation.x = rockerAng;
    // valve rod from rocker top forward to valve chest above cylinder
    const rValve = rods.find(r=>r.side===side && r.kind==='valve');
    placeRod(rValve.mesh, x + side*0.16, rTopY, rTopZ, x + side*0.16, 2.05, 3.0);
    // drop link from rocker bottom down to expansion-link trunnion
    const rBotY = rockerPivot.y - Math.cos(rockerAng)*0.42, rBotZ = rockerPivot.z - Math.sin(rockerAng)*0.42;
    const rDrop = rods.find(r=>r.side===side && r.kind==='drop');
    placeRod(rDrop.mesh, x + side*0.16, rBotY, rBotZ, x + side*0.16, 1.62, 1.15 + 0.18*Math.sin(phase+1.6));
  });
}

// ============================================================
//  steam & smoke particle system (11,000 pooled)
// ============================================================
const STEAM_MAX = 11000;
const steamPos = new Float32Array(STEAM_MAX*3);
const steamVel = new Float32Array(STEAM_MAX*3);
const steamLife = new Float32Array(STEAM_MAX).fill(-1);
const steamMaxLife = new Float32Array(STEAM_MAX);
const steamSize = new Float32Array(STEAM_MAX);
const steamAlpha = new Float32Array(STEAM_MAX);
const steamColor = new Float32Array(STEAM_MAX*3);
const steamBaseSize = new Float32Array(STEAM_MAX);
let steamAlive = 0, steamCursor = 0;

const steamGeo = new THREE.BufferGeometry();
steamGeo.setAttribute('position', new THREE.BufferAttribute(steamPos, 3).setUsage(THREE.DynamicDrawUsage));
const steamSizeAttr = new THREE.BufferAttribute(steamSize, 1).setUsage(THREE.DynamicDrawUsage);
const steamAlphaAttr = new THREE.BufferAttribute(steamAlpha, 1).setUsage(THREE.DynamicDrawUsage);
const steamColorAttr = new THREE.BufferAttribute(steamColor, 3).setUsage(THREE.DynamicDrawUsage);
steamGeo.setAttribute('aSize', steamSizeAttr);
steamGeo.setAttribute('aAlpha', steamAlphaAttr);
steamGeo.setAttribute('aColor', steamColorAttr);
const steamMat = new THREE.ShaderMaterial({
  uniforms:{},
  vertexShader:[
    'attribute float aSize; attribute float aAlpha; attribute vec3 aColor;',
    'varying float vA; varying vec3 vC;',
    'void main(){ vA = aAlpha; vC = aColor;',
    '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
    '  gl_PointSize = aSize * (330.0 / max(1.0, -mv.z));',
    '  gl_Position = projectionMatrix * mv; }'
  ].join('\n'),
  fragmentShader:[
    'varying float vA; varying vec3 vC;',
    'void main(){ vec2 uv = gl_PointCoord - 0.5; float d = length(uv);',
    '  float a = smoothstep(0.5, 0.07, d) * vA;',
    '  if(a < 0.012) discard;',
    '  gl_FragColor = vec4(vC, a); }'
  ].join('\n'),
  transparent:true, depthWrite:false, blending:THREE.NormalBlending
});
const steamPoints = new THREE.Points(steamGeo, steamMat);
steamPoints.frustumCulled = false; scene.add(steamPoints);

function spawnSteam(x,y,z, vx,vy,vz, life, size, shade, tint){
  const i = steamCursor; steamCursor = (steamCursor+1) % STEAM_MAX;
  if(steamLife[i] >= 0) steamAlive--;
  steamPos[i*3]=x; steamPos[i*3+1]=y; steamPos[i*3+2]=z;
  steamVel[i*3]=vx; steamVel[i*3+1]=vy; steamVel[i*3+2]=vz;
  steamLife[i]=0; steamMaxLife[i]=life; steamBaseSize[i]=size;
  steamColor[i*3]=shade*tint.r; steamColor[i*3+1]=shade*tint.g; steamColor[i*3+2]=shade*tint.b;
  steamAlive++;
}
function roofCapY(x){
  const t = Math.acos(Math.min(1, Math.abs(x)/RX));
  return SPRING_Y + RISE*Math.sin(t) - 0.55;
}
const TINT_WHITE = {r:0.94,g:0.95,b:0.96}, TINT_SMOKE = {r:0.36,g:0.35,b:0.35}, TINT_CYL = {r:0.88,g:0.90,b:0.94};
function updateSteam(dt){
  for(let i=0;i<STEAM_MAX;i++){
    if(steamLife[i] < 0){ steamAlpha[i]=0; steamSize[i]=0; continue; }
    steamLife[i] += dt;
    if(steamLife[i] >= steamMaxLife[i]){ steamLife[i] = -1; steamAlive--; steamAlpha[i]=0; steamSize[i]=0; continue; }
    const i3 = i*3;
    let vx=steamVel[i3], vy=steamVel[i3+1], vz=steamVel[i3+2];
    // buoyant rise + drag
    vy += 1.55*dt;
    const drag = 1 - 0.55*dt;
    vx*=drag; vy*=drag; vz*=drag;
    let x=steamPos[i3]+vx*dt, y=steamPos[i3+1]+vy*dt, z=steamPos[i3+2]+vz*dt;
    // pool under the glass roof
    const cap = roofCapY(x);
    if(y > cap){
      y = cap;
      vy = Math.abs(vy) > 0.4 ? vy * -0.18 : 0;
      vx += (x >= 0 ? 1 : -1) * 1.35*dt + (rng()-0.5)*0.8*dt;
      vz += (rng()-0.5)*0.9*dt;
    }
    if(y < 0.15){ y = 0.15; vy = Math.abs(vy)*0.2; }
    const age = steamLife[i]/steamMaxLife[i];
    steamPos[i3]=x; steamPos[i3+1]=y; steamPos[i3+2]=z;
    steamVel[i3]=vx; steamVel[i3+1]=vy; steamVel[i3+2]=vz;
    steamSize[i] = steamBaseSize[i]*(0.55 + age*2.6);
    steamAlpha[i] = (age<0.12 ? age/0.12 : 1-(age-0.12)/0.88) * 0.52;
  }
  steamGeo.attributes.position.needsUpdate = true;
  steamSizeAttr.needsUpdate = true; steamAlphaAttr.needsUpdate = true; steamColorAttr.needsUpdate = true;
}

//  sparks (brake & wheel-slip)

const SPARK_MAX = 320;
const sparkPos = new Float32Array(SPARK_MAX*3);
const sparkVel = new Float32Array(SPARK_MAX*3);
const sparkLife = new Float32Array(SPARK_MAX).fill(-1);
const sparkMaxLife = new Float32Array(SPARK_MAX);
const sparkSize = new Float32Array(SPARK_MAX);
const sparkAlpha = new Float32Array(SPARK_MAX);
let sparkCursor = 0;
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3).setUsage(THREE.DynamicDrawUsage));
const sparkSizeAttr = new THREE.BufferAttribute(sparkSize, 1).setUsage(THREE.DynamicDrawUsage);
const sparkAlphaAttr = new THREE.BufferAttribute(sparkAlpha, 1).setUsage(THREE.DynamicDrawUsage);
sparkGeo.setAttribute('aSize', sparkSizeAttr);
sparkGeo.setAttribute('aAlpha', sparkAlphaAttr);
const sparkMat = new THREE.ShaderMaterial({
  vertexShader:[
    'attribute float aSize; attribute float aAlpha; varying float vA;',
    'void main(){ vA = aAlpha; vec4 mv = modelViewMatrix * vec4(position,1.0);',
    '  gl_PointSize = aSize * (300.0 / max(1.0,-mv.z)); gl_Position = projectionMatrix * mv; }'
  ].join('\n'),
  fragmentShader:[
    'varying float vA;',
    'void main(){ vec2 uv = gl_PointCoord - 0.5; float d = length(uv);',
    '  if(d > 0.5) discard;',
    '  vec3 col = mix(vec3(1.0,0.35,0.05), vec3(1.0,0.9,0.5), smoothstep(0.5,0.0,d));',
    '  gl_FragColor = vec4(col, vA * smoothstep(0.5,0.05,d)); }'
  ].join('\n'),
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
const sparkPoints = new THREE.Points(sparkGeo, sparkMat);

function spawnSpark(x,y,z, vx,vy,vz){
  const i = sparkCursor; sparkCursor = (sparkCursor+1)%SPARK_MAX;
  sparkPos[i*3]=x; sparkPos[i*3+1]=y; sparkPos[i*3+2]=z;
  sparkVel[i*3]=vx; sparkVel[i*3+1]=vy; sparkVel[i*3+2]=vz;
  sparkLife[i]=0; sparkMaxLife[i]=0.45+rng()*0.55; sparkSize[i]=0.10+rng()*0.14;
}
function updateSparks(dt){
  for(let i=0;i<SPARK_MAX;i++){
    if(sparkLife[i]<0){ sparkAlpha[i]=0; sparkSize[i]=0; continue; }
    sparkLife[i]+=dt;
    if(sparkLife[i]>=sparkMaxLife[i]){ sparkLife[i]=-1; sparkAlpha[i]=0; sparkSize[i]=0; continue; }
    const i3=i*3;
    sparkVel[i3+1] -= 12.5*dt;
    let x=sparkPos[i3]+sparkVel[i3]*dt, y=sparkPos[i3+1]+sparkVel[i3+1]*dt, z=sparkPos[i3+2]+sparkVel[i3+2]*dt;
    if(y<0.16){ y=0.16; sparkVel[i3+1]*=-0.35; sparkVel[i3]*=0.6; sparkVel[i3+2]*=0.6; }
    sparkPos[i3]=x; sparkPos[i3+1]=y; sparkPos[i3+2]=z;
    const age=sparkLife[i]/sparkMaxLife[i];
    sparkAlpha[i]=1-age;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkSizeAttr.needsUpdate = true; sparkAlphaAttr.needsUpdate = true;
}

// ============================================================
//  simulation state
// ============================================================
const sim = {
  z: Z0, prevZ: Z0, v: V0,
  driverAngle: 0, tenderRot: 0, coachRot: 0,
  chimAcc: 0, cylAcc: 0, sparkAcc: 0,
  dispatched: false, dispatchTime: -1,
  userDispatch: false, dispatchArmed: false, dispatchArmedAt: Infinity,
  passOut: 0
};
let simTime = 0;
let scriptDispatchAt = Infinity;
let alightedCount = 0;

function doorOpenAmount(t, dispatchTime){
  const RAMP = 0.7, CRAMP = 0.55;
  let a;
  if(t < OPEN_T) a = 0; else a = Math.min(1, (t-OPEN_T)/RAMP);
  const closeT = (dispatchTime >= 0) ? dispatchTime + 0.1 : Infinity;
  if(t > closeT) a *= Math.max(0, 1 - (t-closeT)/CRAMP);
  a = a*a*(3-2*a);
  return a;
}
function updateTrainTransforms(dz){
  train.position.z = sim.z;
  // wheel spin for non-driven axles
  sim.tenderRot += dz / TENDER_R;
  sim.coachRot  += dz / COACH_R;
  tenderWheels.forEach(w=>{ w.mesh.rotation.x = sim.tenderRot; });
  coachWheels.forEach(w=>{ w.mesh.rotation.x = sim.coachRot; });
  bogieWheels.forEach(w=>{ w.mesh.rotation.x = sim.coachRot * (COACH_R/w.r); });
  driverOrbits.forEach(d=>{ d.orbit.rotation.x = sim.driverAngle; });
  updateValveGear(sim.driverAngle);
}
function resetParticles(){
  steamLife.fill(-1); steamAlpha.fill(0); steamSize.fill(0); steamAlive = 0; steamCursor = 0;
  sparkLife.fill(-1); sparkAlpha.fill(0);
  steamGeo.attributes.position.needsUpdate = true;
  steamSizeAttr.needsUpdate = true; steamAlphaAttr.needsUpdate = true;
  sparkSizeAttr.needsUpdate = true; sparkAlphaAttr.needsUpdate = true;
}
function resetSim(dispatchAt){
  rng = mulberry32(20240607);
  simTime = 0;
  sim.z = Z0; sim.prevZ = Z0; sim.v = V0;
  sim.driverAngle = 0; sim.tenderRot = 0; sim.coachRot = 0;
  sim.chimAcc = 0; sim.cylAcc = 0; sim.sparkAcc = 0;
  sim.dispatched = false; sim.dispatchTime = -1;
  sim.userDispatch = false; sim.dispatchArmed = false; sim.dispatchArmedAt = Infinity;
  sim.passOut = 0; alightedCount = 0;
  scriptDispatchAt = (dispatchAt === undefined ? Infinity : dispatchAt);
  resetParticles();
  passengers.forEach(p=>{ p.fig.g.visible = false; });
  porters.forEach(p=>{ p.initialized = false; });
  updateTrainTransforms(0);
  applyDoorsAndPassengers(0);
}
function easeIO(k){ return k*k*(3-2*k); }

function applyDoorsAndPassengers(t){
  const open = doorOpenAmount(t, sim.dispatchTime);
  doors.forEach(d=>{
    d.pivot.rotation.y = -d.side * open * 1.72;
    d.glow.material.opacity = open * 0.85;
    if(d.win && d.win.material.emissiveIntensity !== undefined){
      d.win.material.emissiveIntensity = open * 1.4;
    }
  });
  // passengers
  alightedCount = 0;
  passengers.forEach(p=>{
    const tau = t - p.exitT;
    const g = p.fig.g;
    if(tau <= 0){ g.visible = false; return; }
    g.visible = true;
    const side = p.side;
    const sillX = side*1.5, sillY = 1.66, sillZ = sim.z + p.doorLocalZ;
    const platX = side*4.5 + p.jitter*0.4, platDrop = { x: side*2.7, y: 1.06 };
    if(tau < 0.75){
      // step down: sill → platform edge
      const k = easeIO(tau/0.75);
      const x = sillX + (platDrop.x - sillX)*k;
      const y = sillY + (platDrop.y - sillY)*k - Math.sin(k*Math.PI)*0.05;
      g.position.set(x, y, sillZ);
      g.rotation.y = side>0 ? Math.PI/2 : -Math.PI/2;
      p.fig.legL.rotation.x = Math.sin(k*Math.PI)*0.9;
      p.fig.legR.rotation.x = -Math.sin(k*Math.PI)*0.9;
      alightedCount += 0; // still stepping
      return;
    }
    alightedCount++;
    const tw = tau - 0.75;
    // walk along platform toward the Way Out (buffer end), slight sway
    const dist = p.walkSpeed * tw;
    const x = side*(2.7 + Math.min(1, dist/1.6)*(Math.abs(platX)-2.7)) + Math.sin(tw*1.25 + p.phase)*0.14;
    const z = sillZ + dist*0.62;
    const bob = Math.abs(Math.sin(tw*5.4 + p.phase))*0.05;
    if(z > 32.6){ g.visible = false; return; }
    g.position.set(x, 1.06 + bob, z);
    g.rotation.y = 0; // face +z (toward the booking hall)
    const sw = Math.sin(tw*5.4 + p.phase);
    p.fig.legL.rotation.x = sw*0.72; p.fig.legR.rotation.x = -sw*0.72;
    p.fig.armL.rotation.x = -sw*0.55; p.fig.armR.rotation.x = sw*0.55;
  });
}

function stepSim(dt){
  simTime += dt;
  const s = sim;

  // ---------- longitudinal physics ----------
  if(!s.dispatched){
    if(s.v > 0){
      s.v = Math.max(0, s.v - BRAKE*dt);
      const nz = Math.min(Z_STOP, s.z + s.v*dt);
      s.z = nz;
      if(s.v === 0 || s.z >= Z_STOP){ s.z = Z_STOP; s.v = 0; }
    }
    // dispatch trigger
    if(s.v === 0){
      if(s.userDispatch && !s.dispatchArmed){
        s.dispatchArmed = true;
        s.dispatchArmedAt = simTime + 1.5;
      }
      if(s.dispatchArmed && simTime >= s.dispatchArmedAt){
        s.dispatched = true; s.dispatchTime = simTime; s.userDispatch = false; s.dispatchArmed = false;
      } else if(simTime >= scriptDispatchAt){
        s.dispatched = true; s.dispatchTime = simTime;
      }
    }
  }
  let slip = 0;
  if(s.dispatched){
    const D = s.dispatchTime;
    const u = (simTime - D) / 1.15;
    if(u >= 0 && u <= 1){ slip = Math.sin(u*Math.PI); s.v = 0; }
    else if(u > 1){
      const tA = simTime - (D + 1.15);
      s.v = -Math.min(8.5, 1.25 + 1.5*tA + 0.42*tA*tA);
    }
    s.z = Math.max(-72, s.z + s.v*dt);
  }
  const dz = s.z - s.prevZ; s.prevZ = s.z;

  // ---------- wheels ----------
  s.driverAngle += (s.v / DRIVER_R)*dt + slip*9.2*dt;
  updateTrainTransforms(dz);

  // ---------- steam emission ----------
  let chimRate = 46;
  if(!s.dispatched && s.v > 0.5) chimRate += 34;
  if(s.dispatched){
    const u = simTime - s.dispatchTime;
    if(u < 2.2) chimRate += 950*Math.exp(-u*1.35);
    if(s.v < -0.4) chimRate += 150;
  }
  let cylRate = 8;
  if(slip > 0.1) cylRate += 520*slip;
  else if(s.dispatched && s.v < -0.4) cylRate += 130;
  s.chimAcc += chimRate*dt;
  s.cylAcc  += cylRate*dt;
  const trainZ = s.z;
  while(s.chimAcc >= 1){
    s.chimAcc -= 1;
    const burst = s.dispatched && (simTime - s.dispatchTime) < 1.4;
    const up = 5.6 + rng()*3.2 + (burst ? 4.2 : 0);
    const dark = rng() < (burst ? 0.5 : 0.3);
    spawnSteam(
      (rng()-0.5)*0.34, 4.25 + rng()*0.3, trainZ + 4.6 + (rng()-0.5)*0.3,
      (rng()-0.5)*1.3 + s.v*0.18, up, (rng()-0.5)*1.3 + s.v*0.82,
      2.6 + rng()*2.4, 1.35 + rng()*1.3 + (burst?0.9:0),
      dark ? 0.30+rng()*0.15 : 0.88+rng()*0.09, dark ? TINT_SMOKE : TINT_WHITE);
  }
  while(s.cylAcc >= 1){
    s.cylAcc -= 1;
    const side = rng() < 0.5 ? -1 : 1;
    spawnSteam(
      side*1.32 + (rng()-0.5)*0.2, 1.1 + rng()*0.3, trainZ + 3.5 + (rng()-0.5)*1.4,
      side*(2.6 + rng()*2.4), 0.6 + rng()*1.4, -1.5 - rng()*2.0 + s.v*0.4,
      1.5 + rng()*1.6, 0.95 + rng()*0.85,
      0.86+rng()*0.1, TINT_CYL);
  }
  updateSteam(dt);

  // ---------- sparks ----------
  let sparkRate = 0;
  if(!s.dispatched && s.v > 0.6) sparkRate = 120 + s.v*3.2;
  else if(slip > 0.15) sparkRate = 95*slip;
  s.sparkAcc += sparkRate*dt;
  while(s.sparkAcc >= 1){
    s.sparkAcc -= 1;
    const side = rng()<0.5 ? -1 : 1;
    spawnSpark(
      side*(0.9+rng()*0.35), 0.32+rng()*0.15, trainZ + DRIVER_Z[(rng()*3)|0] + (rng()-0.5)*0.5,
      (rng()-0.5)*1.6 - s.v*0.22, 1.6+rng()*2.6, -2.2 - rng()*3.4 - s.v*0.35);
  }
  updateSparks(dt);

  // ---------- doors & passengers ----------
  applyDoorsAndPassengers(simTime);

  // ---------- porters & carts (ping-pong, analytic) ----------
  porters.forEach(p=>{
    const P = 21, u = ((simTime/P) + p.phase) % 1;
    const tri = u < 0.5 ? u*2 : (1-u)*2;
    const k = easeIO(tri);
    const z = -14 + (30 - (-14))*k; // toward Way Out and back
    const dir = (u < 0.5) ? 1 : -1;
    if(!p.initialized){ p.prevZ = z; p.initialized = true; }
    const ddz = z - p.prevZ; p.prevZ = z;
    p.cart.g.position.set(p.side, 1.05, z);
    p.cart.g.rotation.y = dir > 0 ? 0 : Math.PI;
    p.cart.wheels.forEach(w=>{ w.rotation.x += ddz / 0.31; });
    // porter walks behind the cart
    const pz = z - dir*1.55;
    const walk = simTime*5.2 + p.phase*7;
    p.fig.g.position.set(p.side, 1.05 + Math.abs(Math.sin(walk))*0.045, pz);
    p.fig.g.rotation.y = dir > 0 ? 0 : Math.PI;
    p.fig.legL.rotation.x = Math.sin(walk)*0.75; p.fig.legR.rotation.x = -Math.sin(walk)*0.75;
    p.fig.armL.rotation.x = -1.05 + Math.sin(walk)*0.12; // hands on handle
    p.fig.armR.rotation.x = -1.05 - Math.sin(walk)*0.12;
  });

  // ---------- clocks ----------
  const minutes = 4*60 + 38 + simTime/60; // 4:38 and drifting
  const hourAng = ((minutes/60) % 12)/12 * Math.PI*2;
  const minAng  = (minutes % 60)/60 * Math.PI*2;
  clockHands.forEach(c=>{ c.hour.rotation.z = -hourAng; c.min.rotation.z = -minAng; });

  // ---------- lamp flicker (deterministic) ----------
  if(timeMode === 'evening'){
    const f = 0.86 + 0.14*Math.sin(simTime*23.7) * Math.sin(simTime*7.3+1.7) + 0.06*Math.sin(simTime*41.1+0.4);
    eveningLights.forEach((pl,i)=>{ pl.intensity = ATMO.evening.lampLight * (0.85 + 0.3*Math.abs(Math.sin(simTime*17.3 + i*2.1))); });
    lampMantles.forEach((m,i)=>{ m.material.emissiveIntensity = ATMO.evening.lampGlow * (0.82 + 0.36*Math.abs(Math.sin(simTime*19.7 + i*1.7)) * f); });
  }
}

// ============================================================
//  time of day
// ============================================================
const modeTag = document.getElementById('modeTag');
function applyTimeOfDay(mode){
  timeMode = mode;
  const A = ATMO[mode];
  scene.background = A.bg.clone();
  scene.fog.color.copy(A.bg); scene.fog.near = A.fogNear; scene.fog.far = A.fogFar;
  sun.intensity = A.sun; sun.color.copy(A.sunCol);
  hemi.color.copy(A.hemiSky); hemi.groundColor.copy(A.hemiGround); hemi.intensity = A.hemi;
  renderer.toneMappingExposure = A.exposure;
  M.glassRoof.color.copy(A.glassTint);
  lampMantles.forEach(m=>{ m.material.emissiveIntensity = A.lampGlow; });
  lampGlasses.forEach(g=>{ g.material.emissiveIntensity = A.lampGlow*0.55; });
  eveningLights.forEach(pl=>{ pl.intensity = A.lampLight; });
  shafts.forEach(s=>{ s.material.opacity = A.shaft; });
  bloom.strength = A.bloom;
  if(shed.userData.endWindow){ shed.userData.endWindow.material.emissiveIntensity = A.windowGlow; }
  modeTag.textContent = (mode === 'afternoon') ? 'Afternoon · Sun' : 'Evening · Gaslight';
}

// ============================================================
//  input & camera modes
// ============================================================
let cabMode = false;
const savedCam = { pos: camera.position.clone(), tgt: controls.target.clone() };
const CAB_LOCAL_CAM = new THREE.Vector3(0.68, 3.05, -2.35);
const CAB_LOCAL_LOOK = new THREE.Vector3(0.15, 2.15, 6.0);

function setCabMode(on){
  cabMode = on;
  document.getElementById('cabTag').style.display = on ? 'block' : 'none';
  if(on){
    savedCam.pos.copy(camera.position); savedCam.tgt.copy(controls.target);
    controls.enabled = false;
  } else {
    controls.enabled = true;
    camera.position.copy(savedCam.pos); controls.target.copy(savedCam.tgt);
    controls.update();
  }
}
function pressDispatch(){
  const s = sim;
  if(s.dispatched || s.dispatchArmed) return;
  if(s.v > 0){ s.userDispatch = true; return; }   // fires the moment it stops
  s.userDispatch = true; // armed in stepSim → 1.5 s later the word is given
}
window.addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); pressDispatch(); }
  else if(e.code === 'KeyC'){ setCabMode(!cabMode); }
  else if(e.code === 'KeyT'){ applyTimeOfDay(timeMode === 'afternoon' ? 'evening' : 'afternoon'); }
});
document.getElementById('chipDispatch').addEventListener('click', pressDispatch);
document.getElementById('chipCab').addEventListener('click', ()=>setCabMode(!cabMode));
document.getElementById('chipTime').addEventListener('click', ()=>{
  applyTimeOfDay(timeMode === 'afternoon' ? 'evening' : 'afternoon');
  document.getElementById('chipTime').textContent = timeMode === 'afternoon' ? 'Evening Gaslight (T)' : 'Afternoon Sun (T)';
});

// ============================================================
//  showcase — 12 s scripted camera & events
// ============================================================
const SHOWCASE_KEYS = [
  { t: 0.0, pos:[ 10.6, 4.4,  6.5], tgt:[ 0, 2.3, -46] },
  { t: 2.2, pos:[  9.2, 3.6, -1.5], tgt:[ 0, 2.1, -12] },
  { t: 3.4, pos:[  4.4, 2.0,  4.6], tgt:[ 0, 1.5,   1.5] },
  { t: 4.6, pos:[  6.6, 2.3, -6.5], tgt:[ 1.6, 1.6, -11.5] },
  { t: 6.2, pos:[  5.4, 2.5, -13.5],tgt:[ 3.4, 1.35, -14.5] },
  { t: 7.3, pos:[  8.8, 3.4, -2.5], tgt:[ 0, 2.2, -1.5] },
  { t: 8.6, pos:[  7.3, 2.6,  3.1], tgt:[ 0, 2.0,  1.0] },
  { t: 9.6, pos:[  9.4, 3.1,  0.5], tgt:[ 0, 2.1,  0.0] },
  { t: 10.8,pos:[ 12.2, 5.2, 11.5], tgt:[ 0, 2.5, -3.5] },
  { t: 12.0,pos:[ 13.2, 6.4, 17.5], tgt:[ 0, 2.7, -4.0] }
];
const _vA = new THREE.Vector3(), _vB = new THREE.Vector3(), _tA = new THREE.Vector3(), _tB = new THREE.Vector3();
function showcaseCamera(t){
  let i = 0;
  while(i < SHOWCASE_KEYS.length-2 && t > SHOWCASE_KEYS[i+1].t) i++;
  const a = SHOWCASE_KEYS[i], b = SHOWCASE_KEYS[i+1];
  const span = Math.max(0.0001, b.t - a.t);
  let u = THREE.MathUtils.clamp((t - a.t)/span, 0, 1);
  u = u*u*(3-2*u);
  _vA.fromArray(a.pos); _vB.fromArray(b.pos);
  _tA.fromArray(a.tgt); _tB.fromArray(b.tgt);
  camera.position.lerpVectors(_vA, _vB, u);
  controls.target.lerpVectors(_tA, _tB, u);
  // deterministic handheld micro-sway
  const amp = 0.05 + 0.03*Math.sin(t*0.9);
  camera.position.x += Math.sin(t*13.7)*amp;
  camera.position.y += Math.sin(t*17.3+1.7)*amp*0.8;
  camera.position.z += Math.sin(t*11.1+0.6)*amp;
  camera.lookAt(controls.target);
}
function renderScene(){
  if(cabMode){
    train.updateMatrixWorld(true);
    _vA.copy(CAB_LOCAL_CAM); train.localToWorld(_vA);
    _vB.copy(CAB_LOCAL_LOOK); train.localToWorld(_vB);
    const bob = Math.sin(simTime*22)*0.008*Math.min(1, Math.abs(sim.v));
    camera.position.set(_vA.x, _vA.y + bob, _vA.z);
    camera.lookAt(_vB);
  }
  composer.render();
  updateBench();
}
function seek(t){
  t = THREE.MathUtils.clamp(t, 0, SHOWCASE_DURATION);
  const wasCab = cabMode; cabMode = false; // showcase drives the camera itself
  resetSim(SHOWCASE_DISPATCH);
  const steps = Math.floor(t / FIXED_DT);
  for(let i=0;i<steps;i++) stepSim(FIXED_DT);
  const rem = t - steps*FIXED_DT;
  if(rem > 1e-6) stepSim(rem);
  const savedControls = controls.enabled; controls.enabled = false;
  showcaseCamera(simTime);
  composer.render();
  updateBench();
  controls.enabled = savedControls; cabMode = wasCab;
}
const SHOWCASE_DURATION = 12;
let showcasePlaying = false;

// Record button
const recordBtn = document.getElementById('recordBtn');
recordBtn.addEventListener('click', ()=>{
  if(showcasePlaying) return;
  showcasePlaying = true;
  recordBtn.disabled = true; recordBtn.textContent = '● Recording…';
  const wasCab = cabMode; if(cabMode) setCabMode(false);
  const stream = renderer.domElement.captureStream(60);
  let mime = 'video/webm;codecs=vp9';
  if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond: 14000000 });
  const chunks = [];
  rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop = ()=>{
    const blob = new Blob(chunks, { type:'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kingsbridge-terminus-showcase.webm';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    recordBtn.disabled = false; recordBtn.textContent = '● Record Video';
    showcasePlaying = false;
    resetSim(Infinity);      // hand the live scene back, freshly arrived
    if(wasCab) setCabMode(true);
  };
  resetSim(SHOWCASE_DISPATCH);
  rec.start(100);
  const t0 = performance.now();
  function frame(){
    const t = (performance.now() - t0) / 1000;
    if(t >= SHOWCASE_DURATION){
      seek(SHOWCASE_DURATION);
      rec.stop();
      return;
    }
    seek(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
});

window.showcase = { duration: SHOWCASE_DURATION, seek };

// ============================================================
//  bench + main loop
// ============================================================
window.__bench = { trainSpeed: 0, steamParticles: 0, passengers: 0, wheelAngle: 0 };
function updateBench(){
  window.__bench.trainSpeed = sim.v;
  window.__bench.steamParticles = steamAlive;
  window.__bench.passengers = alightedCount;
  window.__bench.wheelAngle = sim.driverAngle;
}

let lastReal = performance.now();
let acc = 0;
resetSim(Infinity);
applyTimeOfDay('afternoon');

function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  let dtReal = (now - lastReal)/1000; lastReal = now;
  dtReal = Math.min(dtReal, 0.1);
  if(!showcasePlaying){
    acc += dtReal;
    let guard = 0;
    while(acc >= FIXED_DT && guard < 6){ stepSim(FIXED_DT); acc -= FIXED_DT; guard++; }
  }
  controls.enabled = !cabMode;
  if(!cabMode) controls.update();
  renderScene();
}
loop();

// ============================================================
//  resize
// ============================================================
window.addEventListener('resize', ()=>{
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
});
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   THE SNOW GLOBE — an interactive miniature winter
   ============================================================ */

// ---------- constants ----------
const SILL_TOP = 2.3;
const RIG_BASE = new THREE.Vector3(0, SILL_TOP, -0.15);
const SPH_Y = 2.02;                 // sphere center in rig-local coords
const GLOBE_R = 1.66;               // inner collision radius
const GLASS_R = 1.74;
const GROUND_Y = 1.18;              // village platform top (rig-local)
const FLAKES = 6000;
const SHOWCASE_DURATION = 12.0;
const FIXED_DT = 1 / 60;

// ---------- top-level scene / camera / renderer / controls ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14100d);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 60);
camera.position.set(6.4, 4.7, 7.7);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 13;
controls.maxPolarAngle = 1.5;
controls.minPolarAngle = 0.35;
controls.update();

// environment reflections (procedural, no downloads)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;

// ---------- seeded RNG ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- canvas texture helpers ----------
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = t => t * t * (3 - 2 * t);

// --- wood grain ---
function drawWood(ctx, w, h, base, streak, dark) {
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    ctx.strokeStyle = i % 3 ? streak : dark;
    ctx.globalAlpha = 0.12 + Math.random() * 0.22;
    ctx.lineWidth = 1 + Math.random() * 3.5;
    ctx.beginPath();
    const y = Math.random() * h;
    ctx.moveTo(0, y);
    for (let x = 0; x <= w; x += 16) {
      ctx.lineTo(x, y + Math.sin(x * 0.02 + i) * 6 + (Math.random() - 0.5) * 4);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
const woodTex = makeCanvas(512, 512, (c, w, h) => drawWood(c, w, h, '#5a3b24', '#3d2413', '#2a1809'));
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
const floorTex = makeCanvas(1024, 1024, (c, w, h) => {
  drawWood(c, w, h, '#4b3320', '#33200f', '#241407');
  c.globalAlpha = 0.85; c.strokeStyle = '#1c0f06'; c.lineWidth = 5;
  const rows = 6;
  for (let r = 0; r <= rows; r++) { c.beginPath(); c.moveTo(0, r * h / rows); c.lineTo(w, r * h / rows); c.stroke(); }
  for (let r = 0; r < rows; r++) {
    const off = (r * 733) % w;
    c.beginPath(); c.moveTo(off, r * h / rows); c.lineTo(off, (r + 1) * h / rows); c.stroke();
  }
  c.globalAlpha = 1;
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(4, 4);

// --- plaster wall ---
const wallTex = makeCanvas(512, 512, (c, w, h) => {
  c.fillStyle = '#6e5f50'; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    c.globalAlpha = 0.05 + Math.random() * 0.07;
    c.fillStyle = Math.random() < 0.5 ? '#867566' : '#584c40';
    c.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 4, 2 + Math.random() * 4);
  }
  c.globalAlpha = 1;
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(6, 3);

// --- snow noise (ground / drifts) ---
const snowTex = makeCanvas(256, 256, (c, w, h) => {
  c.fillStyle = '#eef3f8'; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    c.globalAlpha = 0.1 + Math.random() * 0.25;
    c.fillStyle = Math.random() < 0.6 ? '#cdd9e6' : '#ffffff';
    c.beginPath(); c.arc(Math.random() * w, Math.random() * h, 0.6 + Math.random() * 2.2, 0, 7); c.fill();
  }
  c.globalAlpha = 1;
});
snowTex.wrapS = snowTex.wrapT = THREE.RepeatWrapping;

// --- flake sprite ---
const flakeSprite = makeCanvas(64, 64, (c) => {
  const g = c.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.75, 'rgba(240,248,255,0.45)');
  g.addColorStop(1, 'rgba(240,248,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
  c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 1.4;
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3;
    c.beginPath(); c.moveTo(32, 32); c.lineTo(32 + Math.cos(a) * 15, 32 + Math.sin(a) * 15); c.stroke();
  }
});

// --- steam sprite ---
const steamTex = makeCanvas(64, 64, (c) => {
  const g = c.createRadialGradient(32, 32, 4, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,0.75)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);
});

// --- frost for the window panes ---
const frostTex = makeCanvas(512, 512, (c, w, h) => {
  c.clearRect(0, 0, w, h);
  // soft haze overall
  const haze = c.createRadialGradient(w/2, h/2, h*0.18, w/2, h/2, h*0.75);
  haze.addColorStop(0, 'rgba(235,245,252,0.06)');
  haze.addColorStop(0.75, 'rgba(235,245,252,0.35)');
  haze.addColorStop(1, 'rgba(240,248,255,0.92)');
  c.fillStyle = haze; c.fillRect(0, 0, w, h);
  // crystalline feathers from the edges
  const rng = mulberry32(777);
  c.lineCap = 'round';
  for (let i = 0; i < 260; i++) {
    const edge = Math.floor(rng() * 4);
    let x = edge === 0 ? 0 : edge === 1 ? w : rng() * w;
    let y = edge === 2 ? 0 : edge === 3 ? h : rng() * h;
    let ang = Math.atan2(h/2 - y, w/2 - x) + (rng() - 0.5) * 0.9;
    const len = 30 + rng() * 150;
    c.strokeStyle = 'rgba(245,252,255,' + (0.25 + rng() * 0.5) + ')';
    c.lineWidth = 1 + rng() * 3.2;
    c.beginPath(); c.moveTo(x, y);
    let px = x, py = y;
    for (let s = 0; s < 6; s++) {
      ang += (rng() - 0.5) * 0.7;
      px += Math.cos(ang) * len / 6; py += Math.sin(ang) * len / 6;
      c.lineTo(px, py);
      // side barbs
      c.moveTo(px, py);
      c.lineTo(px + Math.cos(ang + 0.9) * 14 * rng(), py + Math.sin(ang + 0.9) * 14 * rng());
      c.moveTo(px, py);
    }
    c.stroke();
  }
  // frost speckle
  for (let i = 0; i < 1500; i++) {
    const dx = rng() - 0.5, dy = rng() - 0.5;
    const d = Math.sqrt(dx*dx + dy*dy) * 2;
    if (rng() > d * 1.15) continue;
    c.fillStyle = 'rgba(250,253,255,' + (0.3 + rng() * 0.6) + ')';
    c.beginPath(); c.arc(rng() * w, rng() * h, 0.5 + rng() * 1.8, 0, 7); c.fill();
  }
});
frostTex.wrapS = frostTex.wrapT = THREE.ClampToEdgeWrapping;

// --- book cover ---
const bookTex = makeCanvas(512, 640, (c, w, h) => {
  c.fillStyle = '#6e1f2a'; c.fillRect(0, 0, w, h);
  const g = c.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, 'rgba(255,255,255,0.14)'); g.addColorStop(0.15, 'rgba(255,255,255,0)'); g.addColorStop(0.9, 'rgba(0,0,0,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0.4)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.strokeStyle = '#d8b25c'; c.lineWidth = 6;
  c.strokeRect(36, 36, w - 72, h - 72);
  c.lineWidth = 2; c.strokeRect(52, 52, w - 104, h - 104);
  c.fillStyle = '#e6c87a';
  c.textAlign = 'center';
  c.font = '600 64px Georgia, serif';
  c.fillText('WINTER', w / 2, 200);
  c.fillText('TALES', w / 2, 275);
  // snowflake emblem
  c.save(); c.translate(w / 2, 410); c.strokeStyle = '#e6c87a'; c.lineWidth = 5;
  for (let k = 0; k < 6; k++) {
    c.rotate(Math.PI / 3);
    c.beginPath(); c.moveTo(0, -14); c.lineTo(0, -72);
    c.moveTo(0, -48); c.lineTo(-16, -60); c.moveTo(0, -48); c.lineTo(16, -60); c.stroke();
  }
  c.restore();
  c.font = 'italic 26px Georgia, serif'; c.fillText('· a frosty anthology ·', w / 2, h - 90);
});

// --- mug wrap ---
const mugTex = makeCanvas(512, 256, (c, w, h) => {
  c.fillStyle = '#f2e7d5'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#8e2f32'; c.fillRect(0, h * 0.36, w, h * 0.3);
  c.fillStyle = '#d8b25c'; c.fillRect(0, h * 0.36, w, 8); c.fillRect(0, h * 0.66 - 8, w, 8);
  c.fillStyle = '#f2e7d5'; c.font = '28px Georgia'; c.textAlign = 'center';
  for (let x = 40; x < w; x += 80) c.fillText('❄', x, h * 0.56);
});
mugTex.wrapS = THREE.RepeatWrapping;

// --- frozen pond with skate scratches ---
const pondTex = makeCanvas(256, 256, (c, w, h) => {
  const g = c.createRadialGradient(w/2, h/2, 10, w/2, h/2, w/2);
  g.addColorStop(0, '#a8d4ee'); g.addColorStop(0.6, '#7fb4dc'); g.addColorStop(1, '#5d8fb8');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(255,255,255,0.55)';
  const rng = mulberry32(4242);
  for (let i = 0; i < 40; i++) {
    c.lineWidth = 0.6 + rng() * 1.6;
    c.globalAlpha = 0.3 + rng() * 0.5;
    c.beginPath();
    const cx = rng() * w, cy = rng() * h, r = 12 + rng() * 60, a0 = rng() * 6.28;
    c.arc(cx, cy, r, a0, a0 + 0.6 + rng() * 1.6);
    c.stroke();
  }
  c.globalAlpha = 1;
});

// --- sky + street backdrops (day & night) ---
function drawBackdrop(night) {
  return makeCanvas(2048, 1024, (c, w, h) => {
    const horizon = h * 0.78;
    const sky = c.createLinearGradient(0, 0, 0, horizon);
    if (!night) {
      sky.addColorStop(0, '#9fbecd'); sky.addColorStop(0.55, '#c3d5da');
      sky.addColorStop(0.9, '#e8e2d2'); sky.addColorStop(1, '#f6e6cf');
    } else {
      sky.addColorStop(0, '#04070f'); sky.addColorStop(0.6, '#0b1626');
      sky.addColorStop(0.92, '#16233a'); sky.addColorStop(1, '#33261f');
    }
    c.fillStyle = sky; c.fillRect(0, 0, w, horizon);
    const rng = mulberry32(night ? 9001 : 1337);
    if (!night) {
      // hazy sun
      const sun = c.createRadialGradient(w * 0.7, h * 0.24, 8, w * 0.7, h * 0.24, 190);
      sun.addColorStop(0, 'rgba(255,250,225,0.95)'); sun.addColorStop(0.25, 'rgba(255,246,214,0.55)'); sun.addColorStop(1, 'rgba(255,246,214,0)');
      c.fillStyle = sun; c.fillRect(0, 0, w, horizon);
    } else {
      // stars
      for (let i = 0; i < 340; i++) {
        c.globalAlpha = 0.3 + rng() * 0.7;
        c.fillStyle = '#dfe8ff';
        c.fillRect(rng() * w, rng() * horizon * 0.55, 1.5 + rng() * 1.5, 1.5 + rng() * 1.5);
      }
      c.globalAlpha = 1;
      // moon + glow
      const mx = w * 0.72, my = h * 0.18;
      const mg = c.createRadialGradient(mx, my, 6, mx, my, 150);
      mg.addColorStop(0, 'rgba(226,236,255,0.9)'); mg.addColorStop(0.2, 'rgba(200,215,245,0.35)'); mg.addColorStop(1, 'rgba(200,215,245,0)');
      c.fillStyle = mg; c.fillRect(0, 0, w, horizon);
      c.fillStyle = '#eef2fa'; c.beginPath(); c.arc(mx, my, 26, 0, 7); c.fill();
      c.fillStyle = '#c9d2e2'; c.beginPath(); c.arc(mx - 8, my + 4, 5, 0, 7); c.arc(mx + 9, my - 6, 3.6, 0, 7); c.fill();
    }
    // distant hills
    c.fillStyle = night ? '#0d1826' : '#9db4bc';
    c.beginPath(); c.moveTo(0, horizon);
    for (let x = 0; x <= w; x += 24) c.lineTo(x, horizon - 26 - Math.sin(x * 0.004 + 2) * 34 - Math.sin(x * 0.011) * 12);
    c.lineTo(w, horizon); c.fill();
    // far town: rooftops & church spire
    const farCol = night ? '#070d17' : '#7d929c';
    c.fillStyle = farCol;
    let x = 0;
    while (x < w) {
      const bw = 60 + rng() * 150, bh = 40 + rng() * 130;
      c.fillRect(x, horizon - bh, bw, bh);
      if (rng() < 0.32) { // gable
        c.beginPath(); c.moveTo(x - 6, horizon - bh); c.lineTo(x + bw / 2, horizon - bh - 34 - rng() * 26); c.lineTo(x + bw + 6, horizon - bh); c.fill();
      }
      if (rng() < 0.14) { // church spire
        const sx = x + bw * 0.5;
        c.fillRect(sx - 12, horizon - bh - 60, 24, 62);
        c.beginPath(); c.moveTo(sx - 17, horizon - bh - 60); c.lineTo(sx, horizon - bh - 128 - rng() * 40); c.lineTo(sx + 17, horizon - bh - 60); c.fill();
      }
      x += bw + 14 + rng() * 60;
    }
    // lit windows far away (night)
    if (night) {
      for (let i = 0; i < 240; i++) {
        c.globalAlpha = 0.35 + rng() * 0.65;
        c.fillStyle = rng() < 0.8 ? '#ffc978' : '#ffe9b0';
        c.fillRect(rng() * w, horizon - 10 - rng() * 130, 4 + rng() * 5, 5 + rng() * 6);
      }
      c.globalAlpha = 1;
    }
    // street band
    const street = c.createLinearGradient(0, horizon, 0, h);
    if (!night) { street.addColorStop(0, '#b9c4c9'); street.addColorStop(0.15, '#dfe6e9'); street.addColorStop(1, '#eef1f2'); }
    else { street.addColorStop(0, '#11161f'); street.addColorStop(0.2, '#39424f'); street.addColorStop(1, '#141a24'); }
    c.fillStyle = street; c.fillRect(0, horizon, w, h - horizon);
    // snow-covered road sheen
    if (night) {
      const sheen = c.createLinearGradient(0, horizon, 0, h);
      sheen.addColorStop(0.12, 'rgba(160,180,215,0.28)'); sheen.addColorStop(0.4, 'rgba(160,180,215,0.04)'); sheen.addColorStop(1, 'rgba(160,180,215,0)');
      c.fillStyle = sheen; c.fillRect(0, horizon, w, h - horizon);
    }
    // falling snow dots
    for (let i = 0; i < (night ? 420 : 300); i++) {
      c.globalAlpha = 0.25 + rng() * 0.55;
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(rng() * w, rng() * h, 0.8 + rng() * 2.4, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
  });
}
const skyDayTex = drawBackdrop(false);
const skyNightTex = drawBackdrop(true);

// --- building facade with emissive windows ---
const facadeTex = makeCanvas(256, 256, (c, w, h) => {
  c.fillStyle = '#2b3138'; c.fillRect(0, 0, w, h);
  const rng = mulberry32(555);
  for (let y = 18; y < h - 14; y += 42) {
    for (let x = 14; x < w - 10; x += 36) {
      const lit = rng() < 0.42;
      c.fillStyle = lit ? '#ffc87a' : '#12161c';
      c.fillRect(x, y, 18, 24);
      if (lit && rng() < 0.5) { c.fillStyle = 'rgba(255,200,122,0.5)'; c.fillRect(x - 3, y - 3, 24, 30); }
    }
  }
});

/* ============================================================
   ROOM — wall with window opening, floor, windowsill
   ============================================================ */
const roomGroup = new THREE.Group();
scene.add(roomGroup);

const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, color: 0xa79a89, roughness: 0.96 });
function wallPanel(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; roomGroup.add(m); return m;

{

/* ============================================================
   FLAKE SIMULATION — 6000 flakes, curl-noise liquid + swirl
   ============================================================ */
const fPos = new Float32Array(FLAKES * 3);
const fVel = new Float32Array(FLAKES * 3);
const fSize = new Float32Array(FLAKES);   // render size
const fSizeW = new Float32Array(FLAKES);  // sim size class
const fDrag = new Float32Array(FLAKES);
const fFall = new Float32Array(FLAKES);
const fRand = new Float32Array(FLAKES);
const fRest = new Uint8Array(FLAKES);

let airVel = new THREE.Vector3(0, 0, 0);
let swirl = new THREE.Vector3(0, 0, 0);
let springWind = 0;
let villageAngle = 0;
let nightMix = 0, nightTarget = 0;
let simTime = 0;
let shakeEnergy = 0;
let airborneCount = FLAKES;
let showcaseRunning = false;

const POND = { x: 0.30, z: 0.02, r: 0.56 };
function surfaceHeight(x, z) {
  const dx = x - POND.x, dz = z - POND.z;
  const pondD = Math.sqrt(dx * dx + dz * dz);
  let sy = GROUND_Y + 0.016 * Math.sin(x * 6.7 + 1.3) * Math.sin(z * 7.9 + 2.1);
  if (pondD < POND.r) sy = GROUND_Y + 0.002;
  return sy + 0.012;
}
function curlVec(x, y, z, t, out) {
  out.x = Math.sin(y * 2.1 + t * 0.77 + Math.sin(z * 1.6 + t * 0.5) * 1.2) * 0.6
        + Math.sin(z * 3.4 - t * 0.61) * 0.35;
  out.y = Math.sin(z * 2.4 + t * 0.66 + Math.sin(x * 1.8 - t * 0.43)) * 0.38
        + Math.sin(x * 4.1 + t * 0.5) * 0.18;
  out.z = Math.cos(x * 2.2 + t * 0.71 + Math.sin(y * 1.9 + t * 0.55) * 1.1) * 0.6
        + Math.sin(y * 3.7 - t * 0.58) * 0.35;
}
const _curl = new THREE.Vector3();

function initFlakes(seed) {
  const rng = mulberry32(seed);
  for (let i = 0; i < FLAKES; i++) {
    const i3 = i * 3;
    let x = 0, y = 0, z = 0, d2 = 2;
    while (d2 >= 0.9) {
      x = rng() * 2 - 1; y = rng() * 2 - 1; z = rng() * 2 - 1;
      d2 = x * x + y * y + z * z;
    }
    x *= GLOBE_R * 0.9; y = SPH_Y + y * GLOBE_R * 0.9; z *= GLOBE_R * 0.9;
    if (y < GROUND_Y + 0.05) y = GROUND_Y + 0.05 + rng() * 0.12;
    // a few flakes start pre-settled, as if the globe has been sitting
    const preSettled = rng() < 0.14;
    if (preSettled) { y = surfaceHeight(x, z); }
    fPos[i3] = x; fPos[i3 + 1] = y; fPos[i3 + 2] = z;
    fVel[i3] = (rng() - 0.5) * 0.25; fVel[i3 + 1] = (rng() - 0.5) * 0.25; fVel[i3 + 2] = (rng() - 0.5) * 0.25;
    const sClass = Math.pow(rng(), 1.6);
    fSizeW[i] = 0.013 + sClass * 0.03;
    fSize[i] = 3.2 + sClass * 5.2;
    fDrag[i] = 1.7 + rng() * 1.7;
    fFall[i] = fDrag[i] * (0.050 + sClass * 0.042); // sized fall speed → ~20 s to settle
    fRand[i] = rng();
    fRest[i] = preSettled ? 1 : 0;
    if (preSettled) { fVel[i3] = fVel[i3 + 1] = fVel[i3 + 2] = 0; }
  }
}

// flake rendering

const flakePosAttr = new THREE.BufferAttribute(fPos, 3);
flakePosAttr.setUsage(THREE.DynamicDrawUsage);
flakeGeo.setAttribute('position', flakePosAttr);
flakeGeo.setAttribute('aSize', new THREE.BufferAttribute(fSize, 1));
const flakeMat = new THREE.ShaderMaterial({

  transparent: true, depthWrite: false,
  vertexShader: `

  fragmentShader: `
    uniform sampler2D uMap;
    void main() {
      float a = texture2D(uMap, gl_PointCoord).a;
      if (a < 0.04) discard;
      gl_FragColor = vec4(vec3(0.97, 0.985, 1.0), a);

});

// ---- one fixed simulation step (deterministic) ----
let prevSimTime = 0;
function stepFixed(dt) {
  prevSimTime = simTime;
  simTime += dt;

  // decay of the shaken liquid
  airVel.multiplyScalar(Math.exp(-dt * 0.62));
  swirl.multiplyScalar(Math.exp(-dt * 0.40));

  // scripted showcase events (deterministic)
  if (showcaseRunning) {
    if (prevSimTime < 2.4 && simTime >= 2.4) { airVel.set(1.85, 2.35, 1.3); swirl.set(0.9, 3.3, -0.7); }
    if (prevSimTime < 6.0 && simTime >= 6.0) { nightTarget = 1; }
    if (prevSimTime < 9.2 && simTime >= 9.2) { springWind = Math.min(2.2, springWind + 1.4); }
  }

  // music-box spring
  if (springWind > 0.015) {
    const omega = 0.5 * springWind;
    villageAngle += omega * dt;
    springWind = Math.max(0, springWind - 0.048 * dt);
  }
  const dAngle = villageAngle - (stepFixed._lastAngle || 0);
  stepFixed._lastAngle = villageAngle;

  // day/night easing
  if (Math.abs(nightTarget - nightMix) > 0.0008) {
    nightMix += (nightTarget - nightMix) * Math.min(1, dt * 1.7);
    applyNightMix(nightMix);
  }

  shakeEnergy = clamp01(airVel.length() / 2.4 + swirl.length() / 3.2);
  const curlAmp = 0.085 + shakeEnergy * 0.6;
  const cosD = Math.cos(-villageAngle), sinD = Math.sin(-villageAngle);
  const unrestBase = Math.max(0, shakeEnergy - 0.26);
  let restCount = 0;

  for (let i = 0; i < FLAKES; i++) {
    const i3 = i * 3;
    let px = fPos[i3], py = fPos[i3 + 1], pz = fPos[i3 + 2];

    // resting flakes slowly tour with the rotating village, and may re-lift
    if (fRest[i]) {
      if (dAngle !== 0) {
        const c = Math.cos(dAngle), s = Math.sin(dAngle);
        const nx = px * c - pz * s, nz = px * s + pz * c;
        px = nx; pz = nz; fPos[i3] = px; fPos[i3 + 2] = pz;
      }
      if (unrestBase > 0) {
        const chance = unrestBase * dt * 7.0 * (0.45 + fRand[i] * 0.9);
        if (Math.random() < chance) {
          fRest[i] = 0;
          fVel[i3] = (Math.random() - 0.5) * 0.4;
          fVel[i3 + 1] = 0.45 + Math.random() * 0.5;
          fVel[i3 + 2] = (Math.random() - 0.5) * 0.4;
        } else { restCount++; continue; }
      } else { restCount++; continue; }
    }

    // liquid velocity at the particle: bulk air + rotational swirl + curl noise
    const rx = px, ry = py - SPH_Y, rz = pz;
    curlVec(px * 1.6, py * 1.6, pz * 1.6, simTime, _curl);
    const lx = airVel.x + (swirl.y * rz - swirl.z * ry) + _curl.x * curlAmp;
    const ly = airVel.y + (swirl.z * rx - swirl.x * rz) + _curl.y * curlAmp;
    const lz = airVel.z + (swirl.x * ry - swirl.y * rx) + _curl.z * curlAmp;

    const drag = fDrag[i];
    let vx = fVel[i3], vy = fVel[i3 + 1], vz = fVel[i3 + 2];
    vx += ((lx - vx) * drag) * dt;
    vy += ((ly - vy) * drag - fFall[i]) * dt;
    vz += ((lz - vz) * drag) * dt;
    px += vx * dt; py += vy * dt; pz += vz * dt;

    // collide with the inside of the glass (sphere)
    const dx = px, dy = py - SPH_Y, dz = pz;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 > GLOBE_R * GLOBE_R) {
      const d = Math.sqrt(d2);
      const s = (GLOBE_R - 0.012) / d;
      px = dx * s; py = SPH_Y + dy * s; pz = dz * s;
      const nx = dx / d, ny = dy / d, nz = dz / d;
      const vr = vx * nx + vy * ny + vz * nz;
      if (vr > 0) { vx -= nx * vr * 1.4; vy -= ny * vr * 1.4; vz -= nz * vr * 1.4; }
    }

    // rest on village rooftops (colliders live in village-local frame)
    const vlx = px * cosD - pz * sinD, vlz = px * sinD + pz * cosD;
    let landed = false;
    for (let ci = 0; ci < colliders.length; ci++) {
      const c = colliders[ci];
      if (Math.abs(vlx - c.x) < c.hx && Math.abs(vlz - c.z) < c.hz) {
        if (py < c.top + 0.02 && vy <= 0.06 && py > c.top - 0.4) {
          py = c.top + 0.02; landed = true; break;
        }
      }
    }
    // rest on the snow / ice
    if (!landed) {
      const sy = surfaceHeight(px, pz);
      if (py <= sy) { py = sy; landed = true; }
    }
    if (landed) {
      fRest[i] = 1; vx = 0; vy = 0; vz = 0; restCount++;
    }

    fVel[i3] = vx; fVel[i3 + 1] = vy; fVel[i3 + 2] = vz;
    fPos[i3] = px; fPos[i3 + 1] = py; fPos[i3 + 2] = pz;
  }

  airborneCount = FLAKES - restCount;
  flakePosAttr.needsUpdate = true;
  villageGroup.rotation.y = villageAngle;
  skater.rotation.z = Math.sin(simTime * 2.1) * 0.05;
  skater.rotation.y = Math.sin(simTime * 0.9) * 0.22;
  outsideSnowMat.uniforms.uTime.value = simTime;
}

/* ============================================================
   INTERACTION — drag the globe to shake it
   ============================================================ */
const shakables = [glassMesh, baseMesh, skirt];
const raycaster = new THREE.Raycaster();
const dragPlane = new THREE.Plane();
const desiredOffset = new THREE.Vector3();
const grabOffset = new THREE.Vector3();
const rigVel = new THREE.Vector3();
const prevRigPos = rig.position.clone();
let dragging = false;
const ndc = new THREE.Vector2();
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

function setRayFromEvent(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
}
function clampLen(v, max) {
  const l = v.length();
  if (l > max) v.multiplyScalar(max / l);
  return v;
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (showcaseRunning) return;
  setRayFromEvent(e);
  const hits = raycaster.intersectObjects(shakables, false);
  if (hits.length) {
    dragging = true;
    controls.enabled = false;
    camera.getWorldDirection(_v1);
    dragPlane.setFromNormalAndCoplanarPoint(_v1, rig.position);
    grabOffset.copy(rig.position).sub(hits[0].point);
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  setRayFromEvent(e);
  const hit = raycaster.ray.intersectPlane(dragPlane, _v2);
  if (hit) {
    desiredOffset.copy(_v2).add(grabOffset).sub(RIG_BASE);
    clampLen(desiredOffset, 0.85);
  }
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  controls.enabled = true;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (!showcaseRunning) springWind = Math.min(2.2, springWind + 0.95);
  } else if (e.code === 'KeyN') {
    if (!showcaseRunning) nightTarget = nightTarget > 0.5 ? 0 : 1;
  }
});

];
function applyCameraTimeline(t) {
  t = Math.max(0, Math.min(SHOWCASE_DURATION, t));
  let a = camKeys[0], b = camKeys[camKeys.length - 1];
  for (let i = 0; i < camKeys.length - 1; i++) {
    if (t >= camKeys[i].t && t <= camKeys[i + 1].t) { a = camKeys[i]; b = camKeys[i + 1]; break; }
  }
  const span = Math.max(0.0001, b.t - a.t);
  const u = smooth(clamp01((t - a.t) / span));
  camera.position.set(lerp(a.pos[0], b.pos[0], u), lerp(a.pos[1], b.pos[1], u), lerp(a.pos[2], b.pos[2], u));
  _v3.set(lerp(a.tgt[0], b.tgt[0], u), lerp(a.tgt[1], b.tgt[1], u), lerp(a.tgt[2], b.tgt[2], u));
  camera.lookAt(_v3);
  if (bokehPass) bokehPass.uniforms['focus'].value = camera.position.distanceTo(_v3);
}
function showcaseJolt(t) {
  if (t < 2.4 || t > 4.3) return 0;
  const u = t - 2.4;
  return Math.sin(u * 14.5) * Math.exp(-u * 2.4);
}
function resetShowcase() {
  showcaseRunning = true;
  simTime = 0; prevSimTime = 0;
  airVel.set(0, 0, 0); swirl.set(0, 0, 0);
  springWind = 0; villageAngle = 0; stepFixed._lastAngle = 0;
  nightTarget = 0; nightMix = 0;
  applyNightMix(0);
  initFlakes(987654321);
  villageGroup.rotation.y = 0;
  desiredOffset.set(0, 0, 0);
  rig.position.copy(RIG_BASE);
}
function finishShowcaseCommon(t) {
  const j = showcaseJolt(t);
  rig.position.set(RIG_BASE.x + j * 0.16, RIG_BASE.y + Math.abs(j) * 0.1, RIG_BASE.z - j * 0.1);
  updateSteam();
  updateHUD();
}
function seek(t) {
  resetShowcase();
  const steps = Math.floor(t / FIXED_DT);
  for (let i = 0; i < steps; i++) stepFixed(FIXED_DT);
  applyCameraTimeline(t);
  finishShowcaseCommon(t);
  composer.render();
  // sync orbit controls so the interactive view resumes sanely
  controls.target.set(0, 3.9, 0);
  controls.update();
  showcaseRunning = false;
  return true;
}

// record playback state
let recorder = null, recordedChunks = [], recording = false;
let playShowcase = false, showcaseTime = 0, showcaseAcc = 0, realPrev = 0;
const recordBtn = document.getElementById('recordBtn');

function pickMime() {
  const candidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const c of candidates) if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  return 'video/webm';
}
recordBtn.addEventListener('click', () => {
  if (recording || playShowcase) return;
  try {
    const stream = renderer.domElement.captureStream(60);
    recorder = new MediaRecorder(stream, { mimeType: pickMime(), videoBitsPerSecond: 12_000_000 });
    recordedChunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) recordedChunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'snow-globe-showcase.webm';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      recording = false;
      recordBtn.disabled = false;
      recordBtn.classList.remove('recording');
      recordBtn.innerHTML = '⏺&nbsp; Record Video';
    };
    recorder.start(250);
    recording = true;
    recordBtn.disabled = true;
    recordBtn.classList.add('recording');
    recordBtn.innerHTML = '●&nbsp; Recording…';
    // start deterministic playback from t = 0
    resetShowcase();
    playShowcase = true;
    showcaseTime = 0; showcaseAcc = 0; realPrev = performance.now();
    controls.enabled = false;
  } catch (err) {
    console.error('Recording failed:', err);
    alert('Recording is not supported in this browser.');
  }
});
window.showcase = { duration: SHOWCASE_DURATION, seek };

/* ============================================================
   BENCH — window.__bench
   ============================================================ */
const bench = { flakes: FLAKES, airborne: FLAKES, shakeEnergy: 0 };
window.__bench = bench;
const stFlakes = document.getElementById('stFlakes');
const stAir = document.getElementById('stAir');
const stShake = document.getElementById('stShake');
let hudTimer = 0;
function updateHUD() {
  bench.flakes = FLAKES;
  bench.airborne = airborneCount;
  bench.shakeEnergy = shakeEnergy;
  stFlakes.textContent = FLAKES;
  stAir.textContent = airborneCount;
  stShake.textContent = shakeEnergy.toFixed(2);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
initFlakes(20240607);
updateHUD();

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dtReal = Math.min(clock.getDelta(), 1 / 20);

  if (playShowcase) {
    // fixed-timestep deterministic playback, paced to real time
    const frameDt = Math.min((now - realPrev) / 1000, 0.1);
    realPrev = now;
    showcaseAcc += frameDt;
    while (showcaseAcc >= FIXED_DT && showcaseTime < SHOWCASE_DURATION) {
      stepFixed(FIXED_DT);
      showcaseTime += FIXED_DT;
      showcaseAcc -= FIXED_DT;
    }
    applyCameraTimeline(showcaseTime);
    finishShowcaseCommon(showcaseTime);
    if (showcaseTime >= SHOWCASE_DURATION) {
      playShowcase = false;
      showcaseRunning = false;
      controls.enabled = true;
      controls.target.set(0, 3.9, 0);
      controls.update();
      if (recorder && recorder.state !== 'inactive') recorder.stop();
    }
  } else {
    // interactive mode
    stepFixed(dtReal);
    simTime = simTime; // clarity: simTime advanced inside stepFixed
    if (!dragging) desiredOffset.multiplyScalar(Math.exp(-dtReal * 2.1));
    // globe follows the cursor with spring damping; its motion shakes the liquid
    prevRigPos.copy(rig.position);
    _v1.copy(RIG_BASE).add(desiredOffset);
    rig.position.lerp(_v1, 1 - Math.exp(-dtReal * 9.5));
    rigVel.copy(rig.position).sub(prevRigPos).divideScalar(Math.max(dtReal, 1e-4));
    if (rigVel.lengthSq() > 0.0004 && !showcaseRunning) {
      airVel.addScaledVector(rigVel, -dtReal * 1.55);
      clampLen(airVel, 3.1);
      swirl.x += -rigVel.z * dtReal * 1.15;
      swirl.z += rigVel.x * dtReal * 1.15;
      swirl.y += (rigVel.x - rigVel.z) * dtReal * 0.35;
      clampLen(swirl, 4.6);
    }
    updateSteam();
    controls.update();
    // shallow DOF: track focus on the globe
    bokehPass.uniforms['focus'].value = camera.position.distanceTo(rig.position.clone().add(_v2.set(0, SPH_Y, 0)));
  }

  // warm flicker of the village light at night
  villageLight.intensity = nightMix * (1.55 + Math.sin(simTime * 11.0) * 0.14 + Math.sin(simTime * 23.7) * 0.08);

  // HUD ~4 Hz
  hudTimer += dtReal;
  if (hudTimer > 0.25) { hudTimer = 0; updateHUD(); }

  composer.render();
}
animate();

// ---------- resize ----------
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

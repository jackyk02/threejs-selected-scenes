/* =====================================================================
   THE WINTER GLOBE — an interactive snow globe
   ===================================================================== */

const FLAKE_COUNT = 6000;
const SPHERE_R    = 1.42;                 // glass outer radius
const LIQUID_R    = 1.33;                 // inner liquid radius
const SPHERE_Y    = 1.66;                 // globe-local sphere centre
const POND        = { x: 0.42, z: 0.30, level: 1.035, radius: 0.52 };

/* ---------------- deterministic RNG ---------------- */
let rngState = 1234;
function sRand(){
    rngState = (rngState + 0x6D2B79F5) | 0;
    let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function mulberry(seed){
    let s = seed >>> 0;
    return function(){
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
const clamp   = (v,a,b)=>Math.max(a,Math.min(b,v));
const smooth01= v => { v = clamp(v,0,1); return v*v*(3-2*v); };

/* ---------------- top-level scene state ---------------- */
let scene, camera, renderer, controls, composer, bokehPass, bloomPass;
let globeGroup, villageGroup, glassMesh, liquidMesh, flakePoints;

window.__bench = bench;

const flakeDrag = new Float32Array(FLAKE_COUNT);   // per-flake drag multiplier
const flakeCoup = new Float32Array(FLAKE_COUNT);   // per-flake coupling to liquid
const flakeRest = new Uint8Array(FLAKE_COUNT);
let initPos = null, initVel = null, initRest = null;
let agitation = 0, swirl = 0, spring = 0, villageRot = 0;
let simTime = 0;

/* =====================================================================
   PROCEDURAL TEXTURES (canvas)
   ===================================================================== */
function makeWoodTexture(){
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'#5d3d24'); g.addColorStop(.5,'#6e4a2b'); g.addColorStop(1,'#53351f');
    x.fillStyle = g; x.fillRect(0,0,512,512);
    for(let i=0;i<90;i++){
        x.strokeStyle = `rgba(${20+Math.random()*40|0},${12+Math.random()*24|0},6,${0.18+Math.random()*0.3})`;
        x.lineWidth = 1 + Math.random()*3.2;
        x.beginPath();
        const y0 = Math.random()*512;
        x.moveTo(0,y0);
        for(let px=0;px<=512;px+=16) x.lineTo(px, y0 + Math.sin(px*0.02+i)*6 + (Math.random()-0.5)*4);
        x.stroke();
    }
    for(let i=0;i<7;i++){ // knots
        const kx=Math.random()*512, ky=Math.random()*512;
        for(let r=9;r>0;r--){
            x.strokeStyle=`rgba(30,16,6,${0.12+ (9-r)*0.05})`; x.lineWidth=1.4;
            x.beginPath(); x.ellipse(kx,ky,r*2.4,r*1.3,0.4,0,Math.PI*2); x.stroke();
        }
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
    return t;
}
function makeWallTexture(){
    const c=document.createElement('canvas'); c.width=256; c.height=256;
    const x=c.getContext('2d');
    x.fillStyle='#71544a'; x.fillRect(0,0,256,256);
    for(let i=0;i<256;i+=32){ // faded damask stripes
        x.fillStyle='rgba(255,225,190,0.045)'; x.fillRect(i,0,10,256);
        x.fillStyle='rgba(0,0,0,0.09)'; x.fillRect(i+16,0,4,256);
    }
    for(let i=0;i<900;i++){
        x.fillStyle=`rgba(${Math.random()>.5?255:0},${Math.random()>.5?220:0},190,0.03)`;
        x.fillRect(Math.random()*256,Math.random()*256,2,2);
    }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,3);
    t.colorSpace=THREE.SRGBColorSpace; return t;
}
function makeFrostTexture(){
    const c=document.createElement('canvas'); c.width=512; c.height=512;
    const x=c.getContext('2d');
    x.clearRect(0,0,512,512);
    x.filter='blur(6px)';
    // frost creeping from the edges inward
    for(let i=0;i<240;i++){
        const edge=Math.random()*4|0; let px,py;
        if(edge===0){ px=Math.random()*512; py=Math.random()*90*Math.random(); }
        else if(edge===1){ px=Math.random()*512; py=512-Math.random()*90*Math.random(); }
        else if(edge===2){ px=Math.random()*90*Math.random(); py=Math.random()*512; }
        else { px=512-Math.random()*90*Math.random(); py=Math.random()*512; }
        const r=14+Math.random()*46;
        const g=x.createRadialGradient(px,py,0,px,py,r);
        g.addColorStop(0,'rgba(235,244,250,0.85)');
        g.addColorStop(1,'rgba(235,244,250,0)');
        x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill();
    }
    // feathery ferns
    x.strokeStyle='rgba(240,248,252,0.55)'; x.lineWidth=1.1;
    for(let i=0;i<70;i++){
        const a=Math.random()*Math.PI*2, r0=200+Math.random()*40;
        let px=256+Math.cos(a)*r0, py=256+Math.sin(a)*r0;
        x.beginPath(); x.moveTo(px,py);
        for(let s=0;s<5;s++){ px+= (256-px)*0.16 + (Math.random()-0.5)*26; py+=(256-py)*0.16+(Math.random()-0.5)*26; x.lineTo(px,py); }
        x.stroke();
    }
    x.filter='none';
    // glass glare streak
    const gg=x.createLinearGradient(0,0,512,512);
    gg.addColorStop(0.42,'rgba(255,255,255,0)'); gg.addColorStop(0.5,'rgba(255,255,255,0.16)'); gg.addColorStop(0.58,'rgba(255,255,255,0)');
    x.fillStyle=gg; x.fillRect(0,0,512,512);
    const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function makeSnowTexture(){
    const c=document.createElement('canvas'); c.width=256; c.height=256;
    const x=c.getContext('2d');
    x.fillStyle='#e9edf2'; x.fillRect(0,0,256,256);
    for(let i=0;i<2600;i++){
        const v=Math.random();
        x.fillStyle = v>0.94 ? 'rgba(255,255,255,1)' : `rgba(${170+Math.random()*60|0},${180+Math.random()*60|0},${200+Math.random()*55|0},0.6)`;
        const s=v>0.94?2:1+Math.random()*1.6;
        x.fillRect(Math.random()*256,Math.random()*256,s,s);
    }
    const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(9,5);
    t.colorSpace=THREE.SRGBColorSpace; return t;
}
function makeRoadTexture(){

    x.fillStyle='rgba(220,220,200,0.5)';
    for(let px=0;px<512;px+=64) x.fillRect(px,62,30,4);
    const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; t.repeat.set(6,1);
    t.colorSpace=THREE.SRGBColorSpace; return t;
}
function makePlaqueTexture(){

    x.fillStyle=g; x.fillRect(0,0,256,72);

function makeBookTitleTexture(){

function makeMugTexture(){
    const c=document.createElement('canvas'); c.width=256; c.height=128;
    const x=c.getContext('2d');
    x.fillStyle='#e7ddc9'; x.fillRect(0,0,256,128);

function makeSoftCircle(){
    const c=document.createElement('canvas'); c.width=64; c.height=64;
    const x=c.getContext('2d');
    const g=x.createRadialGradient(32,32,0,32,32,30);
    g.addColorStop(0,'rgba(255,255,255,.9)'); g.addColorStop(.6,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
}

/* =====================================================================
   TERRAIN  (snow mound inside the globe)
   ===================================================================== */
function terrainBase(x,z){
    let h = 0.76 + 0.36*Math.exp(-(x*x + z*z)/1.35)
          + 0.035*Math.sin(x*2.6 + 1.3)*Math.cos(z*2.15 + 0.5)
          + 0.018*Math.sin(x*3.1 - z*2.4 + 0.7);
    // frozen pond — a smooth depression
    const pdx = x - POND.x, pdz = z - POND.z;
    const pr  = Math.hypot(pdx,pdz);
    if(pr < 0.66){
        const s = smooth01((0.66 - pr)/0.20);
        h = h*(1-s) + POND.level*s;
    }
    return h;
}
function terrainAt(x,z){
    let h = terrainBase(x,z);
    for(const b of buildings){
        const dx=x-b.x, dz=z-b.z, ca=Math.cos(b.yaw), sa=Math.sin(b.yaw);
        const lx= dx*ca + dz*sa, lz=-dx*sa + dz*ca;
        if(Math.abs(lx) < b.w/2 + 0.02 && Math.abs(lz) < b.d/2 + 0.02){
            const rh = b.baseY + b.wall + b.ridge*(1 - Math.abs(lx)/(b.w/2));
            if(rh > h) h = rh;
        }
    }
    for(const t of trees){
        const d = Math.hypot(x-t.x, z-t.z);
        if(d < t.r){
            const th = t.baseY + 0.06 + t.h*(1 - d/t.r);
            if(th > h) h = th;
        }
    }
    return h;
}

/* =====================================================================
   BUILD HELPERS
   ===================================================================== */
function makeGableRoof(w,h,d){
    const hw=w/2, hd=d/2;
    const P = {
        FL:[-hw,0, hd], FR:[hw,0, hd], FB:[0,h, hd],
        BL:[-hw,0,-hd], BR:[hw,0,-hd], BB:[0,h,-hd]
    };
    const quads = [
        [P.BL,P.FL,P.FB,P.BB],   // left slope
        [P.FR,P.BR,P.BB,P.FB]    // right slope
    ];
    const tris = [
        [P.FL,P.FR,P.FB],        // front gable
        [P.BR,P.BL,P.BB]         // back gable
    ];
    const pos=[];
    for(const q of quads){ pos.push(...q[0],...q[1],...q[2], ...q[0],...q[2],...q[3]); }
    for(const t of tris){ pos.push(...t[0],...t[1],...t[2]); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.computeVertexNormals();
    return g;
}
function makeMound(){
    const rings=26, segs=64, R=1.02;
    const positions=[0, terrainBase(0,0), 0];
    for(let r=1;r<=rings;r++){
        const rad = R*(r/rings);
        for(let s=0;s<segs;s++){
            const a=s/segs*Math.PI*2, x=Math.cos(a)*rad, z=Math.sin(a)*rad;
            positions.push(x, terrainBase(x,z), z);
        }
    }
    const idx=[];
    for(let s=0;s<segs;s++) idx.push(0, 1+(s+1)%segs, 1+s);
    for(let r=1;r<rings;r++){
        const a0=1+(r-1)*segs, b0=1+r*segs;
        for(let s=0;s<segs;s++){
            const s1=(s+1)%segs;
            idx.push(a0+s, b0+s1, b0+s,  a0+s, a0+s1, b0+s1);
        }
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    g.setIndex(idx); g.computeVertexNormals();
    return g;
}

/* =====================================================================
   SCENE CONSTRUCTION
   ===================================================================== */
function buildRoom(){
    const wallTex = makeWallTexture();
    const wallMat = new THREE.MeshStandardMaterial({ map:wallTex, roughness:0.92, color:'#c9b6a6' });
    const trimMat = new THREE.MeshStandardMaterial({ color:'#33241a', roughness:0.6 });

    // back wall — four segments around the window opening (opening y 0..4.35, x ±2.3)
    const seg=(w,h,x,y,z)=>{
        const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
        m.position.set(x,y,z); m.receiveShadow=true; scene.add(m);
    };
    seg(9.4,8, -6.95, 1.4,-3.05);
    seg(9.4,8,  6.95, 1.4,-3.05);
    seg(4.6,1.05, 0, 4.875,-3.05);
    seg(4.6,2.6, 0, -1.3,-3.05);

    // side walls
    const sideL=new THREE.Mesh(new THREE.PlaneGeometry(9,8), wallMat.clone());
    sideL.material.color.set('#a8968a'); sideL.rotation.y= Math.PI/2; sideL.position.set(-8.5,1.4,0.5); scene.add(sideL);
    const sideR=sideL.clone(); sideR.rotation.y=-Math.PI/2; sideR.position.x=8.5; scene.add(sideR);

    // floor
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,12),
        new THREE.MeshStandardMaterial({ color:'#3a2a1e', roughness:0.55, metalness:0.05 }));
    floor.rotation.x=-Math.PI/2; floor.position.set(0,-2.6,1); floor.receiveShadow=true; scene.add(floor);

    // baseboards + picture rail
    const base=new THREE.Mesh(new THREE.BoxGeometry(20,0.22,0.06), trimMat);
    base.position.set(0,-2.49,-3.02); scene.add(base);
    const rail=new THREE.Mesh(new THREE.BoxGeometry(20,0.09,0.05), trimMat);
    rail.position.set(0,3.6,-3.02); scene.add(rail);

    // ceiling beams
    for(const bx of [-3.5, 0, 3.5]){
        const beam=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.3,11), trimMat);
        beam.position.set(bx,5.1,0.5); scene.add(beam);
    }
    return { wallMat };
}
function buildWindow(){
    const frameMat=new THREE.MeshStandardMaterial({ color:'#2e241c', roughness:0.5 });
    const mk=(w,h,d,x,y,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),frameMat); m.position.set(x,y,z); m.castShadow=true; scene.add(m); return m; };
    // outer frame
    mk(4.9,0.2,0.26, 0, 4.42,-3.0);
    mk(4.9,0.2,0.26, 0, 0.02,-3.0);
    mk(0.2,4.6,0.26, -2.36, 2.2,-3.0);
    mk(0.2,4.6,0.26,  2.36, 2.2,-3.0);
    // muntins
    mk(0.1,4.4,0.12, 0, 2.2,-3.0);
    mk(4.6,0.1,0.12, 0, 2.95,-3.0);
    mk(4.6,0.1,0.12, 0, 1.42,-3.0);

    // frosted-edged panes (mostly clear centre, frost at the corners)
    const frost=makeFrostTexture();
    const paneMat=new THREE.MeshBasicMaterial({ map:frost, transparent:true, depthWrite:false, color:'#ffffff' });
    const pane=new THREE.Mesh(new THREE.PlaneGeometry(4.52,4.3), paneMat);
    pane.position.set(0,2.22,-2.94); scene.add(pane);

    // wooden sill ledge — top surface at y = 0
    const sillTex=makeWoodTexture();
    const sill=new THREE.Mesh(new THREE.BoxGeometry(5.8,0.16,1.3),
        new THREE.MeshStandardMaterial({ map:sillTex, color:'#b98a5e', roughness:0.55 }));
    sill.position.set(0,-0.08,-2.55); sill.receiveShadow=true; sill.castShadow=true; scene.add(sill);
}
function buildOutside(){
    // sky dome
    skyMat = new THREE.ShaderMaterial({
        side:THREE.BackSide, depthWrite:false, fog:false,
        uniforms:{ uNight:{ value:0 } },
        vertexShader:`
            varying vec3 vDir;
            void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
        fragmentShader:`
            varying vec3 vDir; uniform float uNight;
            float hash3(vec3 p){ p=fract(p*vec3(12.9898,78.233,45.164)); p+=dot(p,p.yzx+19.19); return fract((p.x+p.y)*p.z); }
            void main(){
                vec3 n = normalize(vDir);
                float h = smoothstep(-0.08, 0.55, n.y);
                vec3 dayTop=vec3(0.55,0.66,0.75), dayHor=vec3(0.87,0.83,0.74);
                vec3 nitTop=vec3(0.015,0.03,0.09), nitHor=vec3(0.11,0.14,0.24);
                vec3 day=mix(dayHor, dayTop, pow(h,0.75));
                vec3 nit=mix(nitHor, nitTop, pow(h,0.7));
                // faint warm horizon band at night (city glow)
                nit += vec3(0.22,0.12,0.05)*pow(max(0.0,1.0-abs(n.y-0.02)*6.0),3.0);
                vec3 col = mix(day, nit, uNight);
                // stars
                vec3 cell = floor(n*210.0);
                float s = hash3(cell);
                float star = smoothstep(0.992, 1.0, s) * uNight * smoothstep(0.05, 0.35, n.y);
                col += vec3(star);
                gl_FragColor = vec4(col, 1.0);
            }`
    });
    const sky=new THREE.Mesh(new THREE.SphereGeometry(46,32,18), skyMat);
    scene.add(sky);

    // moon
    const moon=new THREE.Mesh(new THREE.CircleGeometry(1.15,32),
        new THREE.MeshBasicMaterial({ color:'#f2efe0', fog:false }));
    moon.position.set(-13,11.5,-34); moon.lookAt(0,2,0); scene.add(moon);

    // snowy ground
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,42),
        new THREE.MeshStandardMaterial({ map:makeSnowTexture(), color:'#dfe6ee', roughness:0.95 }));
    ground.rotation.x=-Math.PI/2; ground.position.set(0,-0.05,-13); scene.add(ground);

    // road
    const road=new THREE.Mesh(new THREE.PlaneGeometry(90,2.7),
        new THREE.MeshStandardMaterial({ map:makeRoadTexture(), color:'#8b8f98', roughness:0.35, metalness:0.1 }));
    road.rotation.x=-Math.PI/2; road.position.set(0,-0.02,-6.4); scene.add(road);

    // far building silhouettes with snowy roofs and lit windows
    outsideWinMat = new THREE.MeshStandardMaterial({ color:'#16161c', emissive:'#ffb45c', emissiveIntensity:0.1, roughness:0.8 });
    const bodyMats = ['#4a3a34','#39404c','#503b30','#333c40','#46362c','#2f3644','#41322e'].map(c =>
        new THREE.MeshStandardMaterial({ color:c, roughness:0.85 }));
    const roofMat = new THREE.MeshStandardMaterial({ color:'#dfe6ee', roughness:0.9 });
    const bl = [
        {x:-8.2,w:2.9,h:3.6,d:2.0},{x:-5.2,w:2.2,h:5.1,d:2.2},{x:-2.4,w:2.6,h:2.8,d:2.0},
        {x: 0.6,w:3.3,h:4.4,d:2.4},{x: 4.1,w:2.1,h:3.1,d:1.8},{x: 6.8,w:2.7,h:5.4,d:2.2},{x: 9.6,w:2.0,h:2.5,d:1.8}
    ];
    bl.forEach((b,i)=>{
        const body=new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h,b.d), bodyMats[i%bodyMats.length]);
        body.position.set(b.x, b.h/2-0.05, -10.5 - (i%2)*1.5); scene.add(body);
        const roof=new THREE.Mesh(makeGableRoof(b.w+0.15, 0.7+0.2*(i%3), b.d+0.15), roofMat);
        roof.position.set(b.x, b.h-0.05, body.position.z); scene.add(roof);
        // window grid on the street-facing side
        const cols=Math.max(2, Math.floor(b.w/0.75)), rows=Math.max(2, Math.floor(b.h/1.05));
        for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
            const w=new THREE.Mesh(new THREE.PlaneGeometry(0.34,0.42), outsideWinMat);
            w.position.set(b.x - b.w/2 + (c+0.5)*(b.w/cols), 0.62 + r*1.05, body.position.z + b.d/2 + 0.01);
            scene.add(w);
        }
    });

    // street lamps
    lampGlowMat = new THREE.MeshStandardMaterial({ color:'#3a2c14', emissive:'#ffc46a', emissiveIntensity:0.3 });
    const poleMat=new THREE.MeshStandardMaterial({ color:'#1d1f24', roughness:0.5, metalness:0.6 });
    const lampPositions=[[-3.1,-5.2],[3.4,-5.0]];
    const lampLights=[];
    for(const [lx,lz] of lampPositions){
        const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,2.5,10), poleMat);
        pole.position.set(lx,1.2,lz); scene.add(pole);
        const arm=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.08), poleMat);
        arm.position.set(lx+0.18,2.45,lz); scene.add(arm);
        const head=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.16,0.22), poleMat);
        head.position.set(lx+0.4,2.4,lz); scene.add(head);
        const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10), lampGlowMat);
        bulb.position.set(lx+0.4,2.3,lz); scene.add(bulb);
        const pl=new THREE.PointLight(0xffb45c, 0, 6, 1.8);
        pl.position.set(lx+0.4,2.25,lz); scene.add(pl); lampLights.push(pl);
    }

    // snowman neighbour
    const smMat=new THREE.MeshStandardMaterial({ color:'#eef2f7', roughness:0.9 });
    const s1=new THREE.Mesh(new THREE.SphereGeometry(0.42,18,14), smMat); s1.position.set(2.6,0.32,-4.6); scene.add(s1);
    const s2=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,12), smMat); s2.position.set(2.6,0.86,-4.6); scene.add(s2);
    const nose=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.22,8), new THREE.MeshStandardMaterial({ color:'#c96a1e' }));
    nose.rotation.z=-Math.PI/2; nose.position.set(2.82,0.9,-4.6); scene.add(nose);

    // falling snow outside (GPU, time-driven → deterministic for showcase)
    const N=900, pos=new Float32Array(N*3), phase=new Float32Array(N);
    const rr=mulberry(555);
    for(let i=0;i<N;i++){ pos[i*3]=(rr()-0.5)*22; pos[i*3+1]=rr()*7; pos[i*3+2]=-4.2-rr()*9; phase[i]=rr()*Math.PI*2; }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('aPhase', new THREE.BufferAttribute(phase,1));
    outSnowMat = new THREE.ShaderMaterial({
        transparent:true, depthWrite:false,
        uniforms:{ uTime:{ value:0 } },
        vertexShader:`
            attribute float aPhase; uniform float uTime; varying float vA;
            void main(){
                vec3 p = position;
                p.y = mod(p.y - uTime*0.55, 7.0);
                p.x += sin(uTime*0.9 + aPhase)*0.35;
                vA = 0.55 + 0.45*sin(aPhase*7.0);
                vec4 mv = modelViewMatrix * vec4(p,1.0);
                gl_PointSize = 42.0 / max(1.0,-mv.z);
                gl_Position = projectionMatrix * mv;
            }`,
        fragmentShader:`
            varying float vA;
            void main(){
                float d = length(gl_PointCoord - 0.5);
                float a = smoothstep(0.5, 0.1, d) * vA * 0.9;
                if(a < 0.02) discard;
                gl_FragColor = vec4(0.93,0.95,1.0, a);
            }`
    });
    const snow=new THREE.Points(g, outSnowMat); snow.frustumCulled=false; scene.add(snow);

    return { lampLights };
}

function buildVillage(){
    villageGroup = new THREE.Group();

    // snow mound
    const moundMat=new THREE.MeshStandardMaterial({ color:'#edf1f7', roughness:0.92 });
    const mound=new THREE.Mesh(makeMound(), moundMat);
    mound.receiveShadow=true; villageGroup.add(mound);
    // skirt closing the gap to the glass
    const skirt=new THREE.Mesh(new THREE.CylinderGeometry(1.16,0.95,0.34,40,1,true), moundMat);
    skirt.position.y=0.55; villageGroup.add(skirt);

    // frozen pond
    const pondMat=new THREE.MeshStandardMaterial({ color:'#86b6cd', roughness:0.08, metalness:0.15,
        envMapIntensity:1.4, emissive:'#16242c', emissiveIntensity:0.6 });
    const pond=new THREE.Mesh(new THREE.CircleGeometry(POND.radius,40), pondMat);
    pond.rotation.x=-Math.PI/2; pond.position.set(POND.x, POND.level+0.002, POND.z); villageGroup.add(pond);

    villageWinMat = new THREE.MeshStandardMaterial({ color:'#241c12', emissive:'#ffb45c', emissiveIntensity:0.14 });
    const plaster=new THREE.MeshStandardMaterial({ color:'#e6dcc6', roughness:0.85 });
    const terra =new THREE.MeshStandardMaterial({ color:'#a8503a', roughness:0.8 });
    const cream =new THREE.MeshStandardMaterial({ color:'#cfc0a0', roughness:0.85 });
    const slate =new THREE.MeshStandardMaterial({ color:'#33383f', roughness:0.7 });
    const roofR =new THREE.MeshStandardMaterial({ color:'#402c26', roughness:0.75 });
    const roofG =new THREE.MeshStandardMaterial({ color:'#2c3038', roughness:0.75 });
    const snowM =new THREE.MeshStandardMaterial({ color:'#f2f5fa', roughness:0.95 });
    const goldM =new THREE.MeshStandardMaterial({ color:'#d9b96a', emissive:'#7a5a10', emissiveIntensity:0.6, metalness:0.8, roughness:0.3 });
    const woodDark=new THREE.MeshStandardMaterial({ color:'#3a2a1c', roughness:0.8 });

    function addBuilding(cfg){
        const g=new THREE.Group();
        const baseY=terrainBase(cfg.x,cfg.z)-0.06;
        const walls=new THREE.Mesh(new THREE.BoxGeometry(cfg.w,cfg.wall,cfg.d), cfg.wallMat);
        walls.position.y=cfg.wall/2; g.add(walls);
        const roof=new THREE.Mesh(makeGableRoof(cfg.w*1.12,cfg.ridge,cfg.d*1.14), cfg.roofMat);
        roof.position.y=cfg.wall; g.add(roof);
        const snowCap=new THREE.Mesh(makeGableRoof(cfg.w*1.16,cfg.ridge*0.32,cfg.d*1.18), snowM);
        snowCap.position.y=cfg.wall+cfg.ridge*0.62; g.add(snowCap);
        // door
        const door=new THREE.Mesh(new THREE.PlaneGeometry(cfg.w*0.26,cfg.wall*0.42), woodDark);
        door.position.set(0, cfg.wall*0.21, cfg.d/2+0.006); g.add(door);
        // windows (emissive at night)
        const ww=cfg.w*0.2, wh=cfg.wall*0.3;
        for(const sx of [-1,1]){
            const win=new THREE.Mesh(new THREE.PlaneGeometry(ww,wh), villageWinMat);
            win.position.set(sx*cfg.w*0.26, cfg.wall*0.62, cfg.d/2+0.006); g.add(win);
        }
        g.position.set(cfg.x, baseY, cfg.z); g.rotation.y=cfg.yaw;
        g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
        villageGroup.add(g);
        buildings.push({ x:cfg.x, z:cfg.z, yaw:cfg.yaw, w:cfg.w, d:cfg.d, wall:cfg.wall, ridge:cfg.ridge, baseY });
        return { g, baseY };
    }

    // church
    const church = addBuilding({ x:-0.56, z:-0.28, yaw:0.38, w:0.46, d:0.4, wall:0.52, ridge:0.27, wallMat:plaster, roofMat:slate });
    const tower=new THREE.Mesh(new THREE.BoxGeometry(0.19,0.52,0.19), plaster);
    tower.position.set(0, 0.26+0.52, 0.1); church.g.add(tower);
    const spire=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.34,4), slate);
    spire.position.set(0, 0.52+0.52+0.17, 0.1); spire.rotation.y=Math.PI/4; church.g.add(spire);
    const crossV=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.14,0.03), goldM);
    crossV.position.set(0, 0.52+0.52+0.36, 0.1); church.g.add(crossV);
    const crossH=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.03,0.03), goldM);
    crossH.position.set(0, 0.52+0.52+0.36, 0.1); church.g.add(crossH);
    const rose=new THREE.Mesh(new THREE.CircleGeometry(0.055,16), villageWinMat);
    rose.position.set(0,0.36,0.206); church.g.add(rose);

    // houses
    const hA = addBuilding({ x:0.44, z:-0.52, yaw:-0.28, w:0.42, d:0.35, wall:0.36, ridge:0.2, wallMat:terra, roofMat:roofR });
    const chim=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.2,0.07), terra);
    chim.position.set(0.12,0.36+0.14,-0.08); hA.g.add(chim);
    const chimCap=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.03,0.09), snowM);
    chimCap.position.set(0.12,0.36+0.245,-0.08); hA.g.add(chimCap);

    addBuilding({ x:0.52, z:0.38, yaw:0.55, w:0.33, d:0.29, wall:0.3, ridge:0.17, wallMat:cream, roofMat:roofG });

    // pines (snow-dusted)
    const pineMat=new THREE.MeshStandardMaterial({ color:'#274435', roughness:0.85 });
    const trunkMat=new THREE.MeshStandardMaterial({ color:'#33231a', roughness:0.9 });
    const pineDefs=[
        {x:-0.16,z:0.06,r:0.15,h:0.6},{x:0.06,z:-0.14,r:0.12,h:0.48},
        {x:-0.84,z:0.24,r:0.16,h:0.68},{x:0.16,z:0.62,r:0.12,h:0.52},
        {x:-0.36,z:0.55,r:0.10,h:0.42},{x:0.8,z:-0.06,r:0.11,h:0.47},
        {x:-0.16,z:-0.62,r:0.12,h:0.5}
    ];
    for(const p of pineDefs){
        const g=new THREE.Group();
        const baseY=terrainBase(p.x,p.z)-0.04;
        const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.036,0.1,8), trunkMat);
        trunk.position.y=0.05; g.add(trunk);
        const layers=3;
        for(let i=0;i<layers;i++){
            const f=i/layers;
            const coneR=p.r*(1-f*0.62), coneH=p.h*0.42;
            const cone=new THREE.Mesh(new THREE.ConeGeometry(coneR,coneH,10), pineMat);
            cone.position.y=0.09 + f*p.h*0.5 + coneH*0.42; g.add(cone);
            const cap=new THREE.Mesh(new THREE.ConeGeometry(coneR*0.68,coneH*0.42,10), snowM);
            cap.position.y=cone.position.y + coneH*0.3; g.add(cap);
        }
        g.position.set(p.x,baseY,p.z);
        g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
        villageGroup.add(g);
        trees.push({ x:p.x, z:p.z, r:p.r, h:p.h*0.94, baseY });
    }

    // --- the skater on the frozen pond ---
    const skater=new THREE.Group();
    const skin=new THREE.MeshStandardMaterial({ color:'#e8c39a', roughness:0.6 });
    const coat=new THREE.MeshStandardMaterial({ color:'#b03030', roughness:0.55 });
    const dark=new THREE.MeshStandardMaterial({ color:'#23262e', roughness:0.6 });
    const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.048,0.1,4,10), coat);
    torso.position.y=0.245; torso.rotation.z=0.12; skater.add(torso);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.042,12,10), skin);
    head.position.set(0.012,0.385,0); skater.add(head);
    const hat=new THREE.Mesh(new THREE.ConeGeometry(0.038,0.07,10), coat);
    hat.position.set(0.012,0.425,0); skater.add(hat);
    const pompom=new THREE.Mesh(new THREE.SphereGeometry(0.016,8,6), snowM);
    pompom.position.set(0.012,0.465,0); skater.add(pompom);
    const scarf=new THREE.Mesh(new THREE.TorusGeometry(0.045,0.014,8,14), new THREE.MeshStandardMaterial({ color:'#d9b96a' }));
    scarf.position.set(0.006,0.345,0); scarf.rotation.x=Math.PI/2.3; skater.add(scarf);
    const armGeo=new THREE.CylinderGeometry(0.013,0.013,0.16,8);
    const armL=new THREE.Mesh(armGeo,coat); armL.position.set(-0.085,0.27,0); armL.rotation.z=1.35; skater.add(armL);
    const armR=new THREE.Mesh(armGeo,coat); armR.position.set(0.095,0.275,0.01); armR.rotation.z=-1.45; skater.add(armR);
    const legGeo=new THREE.CylinderGeometry(0.014,0.014,0.17,8);
    const legF=new THREE.Mesh(legGeo,dark); legF.position.set(0.05,0.095,0.075); legF.rotation.x=1.15; skater.add(legF);
    const legB=new THREE.Mesh(legGeo,dark); legB.position.set(-0.035,0.1,-0.045); legB.rotation.x=-0.32; skater.add(legB);
    const bladeGeo=new THREE.BoxGeometry(0.012,0.012,0.085);
    const bladeF=new THREE.Mesh(bladeGeo,goldM); bladeF.position.set(0.05,0.018,0.16); skater.add(bladeF);
    skater.position.set(POND.x, POND.level, POND.z); skater.rotation.y=-0.7;
    skater.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    villageGroup.add(skater);

    // warm light inside the village
    globeLight=new THREE.PointLight(0xffb45c, 0.25, 4.5, 1.8);
    globeLight.position.set(0,1.15,0); villageGroup.add(globeLight);

    return villageGroup;
}

    // the village inside
    villageGroup = buildVillage();

    liquidMesh = new THREE.Mesh(new THREE.SphereGeometry(LIQUID_R, 40, 28),

    liquidMesh.position.y=SPHERE_Y; liquidMesh.renderOrder=1; globeGroup.add(liquidMesh);

    // glass sphere — real refraction + specular window reflections
    glassMesh = new THREE.Mesh(new THREE.SphereGeometry(SPHERE_R, 64, 48),
        new THREE.MeshPhysicalMaterial({
            color:'#ffffff', transmission:1.0, thickness:0.14, roughness:0.045,
            ior:1.52, clearcoat:0.7, clearcoatRoughness:0.12,
            envMapIntensity:1.15, specularIntensity:1.0,
            attenuationColor:new THREE.Color('#dceef2'), attenuationDistance:2.6
        }));
    glassMesh.position.y=SPHERE_Y; globeGroup.add(glassMesh);

    scene.add(globeGroup);
}

/* =====================================================================
   FLAKES
   ===================================================================== */
function initFlakes(){
    const rand=mulberry(987654);
    let i=0, guard=0;
    while(i<FLAKE_COUNT && guard<200000){
        guard++;
        const settled = rand() < 0.85;
        if(settled){
            // random horizontal spot inside the globe, resting on the snow
            const a=rand()*Math.PI*2, r=Math.sqrt(rand())*0.97;
            const x=Math.cos(a)*r, z=Math.sin(a)*r;
            const h=terrainAt(x,z);
            const cross=Math.sqrt(Math.max(0, LIQUID_R*LIQUID_R - (h-SPHERE_Y)*(h-SPHERE_Y)));
            if(r > cross) continue;
            flakePos[i*3]=x; flakePos[i*3+1]=h+0.006+rand()*0.01; flakePos[i*3+2]=z;
            flakeRest[i]=1; flakeVel[i*3]=flakeVel[i*3+1]=flakeVel[i*3+2]=0;
        } else {
            // floating hi-altitude drifters (slowly settle on load)
            const v=new THREE.Vector3(rand()*2-1, rand()*2-1, rand()*2-1);
            if(v.lengthSq()>1 || v.lengthSq()<0.05) continue;
            v.normalize().multiplyScalar(0.55+0.75*rand());
            const x=v.x, y=SPHERE_Y+v.y, z=v.z;
            if(y < terrainAt(x,z)+0.05) continue;
            flakePos[i*3]=x; flakePos[i*3+1]=y; flakePos[i*3+2]=z;
            flakeRest[i]=0;
            flakeVel[i*3]=(rand()-0.5)*0.05; flakeVel[i*3+1]=-0.02-rand()*0.03; flakeVel[i*3+2]=(rand()-0.5)*0.05;
        }
        flakeSize[i]=0.020+rand()*0.026;
        flakeDrag[i]=0.05+rand()*0.16;
        flakeCoup[i]=1.0+rand()*0.9;
        i++;
    }
    initPos = Float32Array.from(flakePos);
    initVel = Float32Array.from(flakeVel);
    initRest= Uint8Array.from(flakeRest);

    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(flakePos,3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(flakeSize,1));
    flakeMat = new THREE.ShaderMaterial({
        transparent:true, depthWrite:false,
        uniforms:{ uScale:{ value:800 } },
        vertexShader:`
            attribute float aSize; uniform float uScale; varying float vTw;
            void main(){
                vec4 mv = modelViewMatrix * vec4(position,1.0);
                gl_PointSize = aSize * uScale / max(0.1,-mv.z);
                vTw = 0.75 + 0.25*sin(position.x*40.0 + position.y*31.0);
                gl_Position = projectionMatrix * mv;
            }`,
        fragmentShader:`
            varying float vTw;
            void main(){
                vec2 uv = gl_PointCoord - 0.5;
                float d = length(uv);
                float a = smoothstep(0.5, 0.08, d) * vTw;
                if(a < 0.03) discard;
                gl_FragColor = vec4(0.94,0.965,1.0, a*0.95);
            }`
    });
    flakePoints = new THREE.Points(geo, flakeMat);
    flakePoints.frustumCulled=false; flakePoints.renderOrder=2;
    globeGroup.add(flakePoints);
}
const _F = new THREE.Vector3();
function liquidVelocity(x,y,z,t,out){
    out.set(
        Math.sin(y*2.35 + t*1.35)*0.62 + Math.sin(z*3.15 + y*1.35 - t*0.85)*0.45 + Math.sin((x+z)*1.8 + t*0.6)*0.25,
        Math.sin(z*2.05 + t*1.10 + 1.7)*0.50 + Math.sin(x*2.60 - t*0.75 + 0.8)*0.42,
        Math.cos(x*2.45 - t*1.15 + 0.6)*0.62 + Math.sin(y*2.90 + x*1.25 + t*0.75)*0.45
    );
    return out;
}
function stepSim(dt){
    simTime += dt;
    // decay agitation & swirl
    agitation *= Math.exp(-0.42*dt);
    swirl     *= Math.exp(-0.30*dt);

    // scripted showcase events
    if(!evShake && simTime >= 1.0){ evShake = true; doFlick(1.9); }
    if(!evWind  && simTime >= 6.0){ evWind  = true; spring = 0.92; }

    // music-box turntable
    if(spring > 0){
        villageRot += (0.16 + 0.5*spring)*dt;
        spring = Math.max(0, spring - dt/26);
        villageGroup.rotation.y = villageRot;
    }

    const amp = agitation*1.55;
    const G = 0.34;
    const ca = Math.cos(villageRot), sa = Math.sin(villageRot);
    let airborne = 0;

    for(let i=0;i<FLAKE_COUNT;i++){
        const i3 = i*3;
        if(flakeRest[i]){
            // strong shaking lifts settled snow
            if(agitation > 0.35 && sRand() < (agitation-0.35)*1.8*dt){
                flakeRest[i] = 0;
                const a = sRand()*Math.PI*2, sp = 0.4 + agitation*0.5;
                flakeVel[i3]   = Math.cos(a)*sp;
                flakeVel[i3+1] = 0.55 + sRand()*0.9 + agitation*0.4;
                flakeVel[i3+2] = Math.sin(a)*sp;
                airborne++;
            }
            continue;
        }
        let px=flakePos[i3], py=flakePos[i3+1], pz=flakePos[i3+2];
        const ly = py - SPHERE_Y;

        liquidVelocity(px, ly, pz, simTime, _F);
        // swirl about the vertical axis through the globe's centre
        const tx = -pz*swirl, tz = px*swirl;
        const lift = agitation*0.5*Math.sin(px*3.1 + pz*2.4 + simTime*2.1);
        const lx = _F.x*amp + tx;
        const lyy= _F.y*amp*0.8 + lift + agitation*0.10;
        const lz = _F.z*amp + tz;

        // drag the flake toward the liquid velocity (per-flake coupling)
        const k = 1 - Math.exp(-flakeCoup[i]*2.2*dt);
        flakeVel[i3]   += (lx - flakeVel[i3])  *k;
        flakeVel[i3+1] += (lyy- flakeVel[i3+1])*k;
        flakeVel[i3+2] += (lz - flakeVel[i3+2])*k;

        // gravity + slight per-flake air drag
        flakeVel[i3+1] -= G*dt;
        const dd = Math.exp(-flakeDrag[i]*dt);
        flakeVel[i3]*=dd; flakeVel[i3+1]*=dd; flakeVel[i3+2]*=dd;

        px += flakeVel[i3]*dt; py += flakeVel[i3+1]*dt; pz += flakeVel[i3+2]*dt;

        // collide with the inside of the glass
        let dx=px, dy=py-SPHERE_Y, dz=pz;
        let len=Math.sqrt(dx*dx+dy*dy+dz*dz);
        const maxR = LIQUID_R - 0.012;
        if(len > maxR){
            const nx=dx/len, ny=dy/len, nz=dz/len;
            px = nx*maxR; py = SPHERE_Y + ny*maxR; pz = nz*maxR;
            const vn = flakeVel[i3]*nx + flakeVel[i3+1]*ny + flakeVel[i3+2]*nz;
            if(vn > 0){
                flakeVel[i3]   -= nx*vn*1.28;
                flakeVel[i3+1] -= ny*vn*1.28;
                flakeVel[i3+2] -= nz*vn*1.28;
                flakeVel[i3]*=0.86; flakeVel[i3+1]*=0.86; flakeVel[i3+2]*=0.86;
            }
        }

        // collide with terrain / roofs / pines (village frame)
        const lx2 =  px*ca - pz*sa;
        const lz2 =  px*sa + pz*ca;
        const h = terrainAt(lx2, lz2) + 0.006;
        if(py < h){
            py = h;
            const sp = Math.hypot(flakeVel[i3], flakeVel[i3+1], flakeVel[i3+2]);
            if(sp < 0.28){
                flakeRest[i] = 1;
                flakeVel[i3] = flakeVel[i3+1] = flakeVel[i3+2] = 0;
            } else {
                if(flakeVel[i3+1] < 0) flakeVel[i3+1] = -flakeVel[i3+1]*0.22;
                flakeVel[i3]*=0.6; flakeVel[i3+2]*=0.6;
            }
        }

        flakePos[i3]=px; flakePos[i3+1]=py; flakePos[i3+2]=pz;
        if(!flakeRest[i]) airborne++;
    }
    bench.airborne = airborne;
}
function doFlick(power){
    agitation = Math.min(1.6, agitation + power*0.55);
    swirl = clamp(swirl + power*0.85, -3, 3);
    for(let i=0;i<FLAKE_COUNT;i++){
        const i3=i*3;
        if(flakeRest[i]){
            if(sRand() < 0.78){
                flakeRest[i]=0;
                const a=sRand()*Math.PI*2, sp=0.35+sRand()*0.5+power*0.3;
                flakeVel[i3]=Math.cos(a)*sp;
                flakeVel[i3+1]=0.7+sRand()*1.15+power*0.3;
                flakeVel[i3+2]=Math.sin(a)*sp;
            }
        } else {
            flakeVel[i3]   += (sRand()-0.5)*power*0.55;
            flakeVel[i3+1] += 0.3*power*(0.5+sRand()*0.8);
            flakeVel[i3+2] += (sRand()-0.5)*power*0.55;
        }
    }
}
function flushFlakeGeometry(){
    flakePoints.geometry.attributes.position.needsUpdate = true;
}

const fogDay=new THREE.Color('#b9bdb9'), fogNight=new THREE.Color('#0a1018');
const _fogTmp=new THREE.Color();

/* =====================================================================
   MUSIC BOX (spring + Web Audio chimes)
   ===================================================================== */
let audioCtx = null, masterGain = null;
let tuneTimer = 0, tuneIndex = 0, tuneActive = false;
const NOTE = m => 440*Math.pow(2,(m-69)/12);
// Twinkle Twinkle — gentle music-box waltz
const MELODY = [
    [72,1],[72,1],[79,1],[79,1],[81,1],[81,1],[79,1.6],
    [77,1],[77,1],[76,1],[76,1],[74,1],[74,1],[72,1.6],
    [79,1],[79,1],[77,1],[77,1],[76,1],[76,1],[74,1.6],
    [79,1],[79,1],[77,1],[77,1],[76,1],[76,1],[74,1.6],
    [72,1],[72,1],[79,1],[79,1],[81,1],[81,1],[79,1.6],
    [77,1],[77,1],[76,1],[76,1],[74,1],[74,1],[72,2.2]
];
const BEAT = 0.34;
function ensureAudio(){
    if(audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.16;
    masterGain.connect(audioCtx.destination);
}
function playChime(midi){
    const f = NOTE(midi), t = audioCtx.currentTime;
    const o1 = audioCtx.createOscillator(), o2 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain(), g2 = audioCtx.createGain();
    o1.type='sine'; o1.frequency.value = f;
    o2.type='sine'; o2.frequency.value = f*4;           // music-box partial
    o1.connect(g1); o2.connect(g2); g1.connect(masterGain); g2.connect(masterGain);
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.exponentialRampToValueAtTime(0.9, t+0.008);
    g1.gain.exponentialRampToValueAtTime(0.0001, t+2.6);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.18, t+0.005);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+1.1);
    o1.start(t); o2.start(t); o1.stop(t+2.7); o2.stop(t+1.2);
}
function windMusicBox(){
    spring = Math.min(1.15, spring + 0.95);
    ensureAudio();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(!tuneActive){ tuneActive = true; tuneIndex = 0; tuneTimer = 0; }
}
function updateMusicBox(dt){
    if(!tuneActive || !audioCtx) return;
    if(spring <= 0.001){ tuneActive = false; return; }
    tuneTimer -= dt;
    if(tuneTimer <= 0){
        const [m,beats] = MELODY[tuneIndex % MELODY.length];
        playChime(m);
        tuneTimer = beats*BEAT;
        tuneIndex++;
    }
}

/* =====================================================================
   SHOWCASE  —  window.showcase = { duration, seek(t) }
   Deterministic: fixed 1/60 grid re-simulation from a pristine state,
   with an incremental cache so scrubbing forward is cheap.
   ===================================================================== */
const SHOWCASE_DURATION = 12;
const SIM_DT = 1/60;
const simCache = {
    step:-1,
    pos:new Float32Array(FLAKE_COUNT*3),
    vel:new Float32Array(FLAKE_COUNT*3),
    rest:new Uint8Array(FLAKE_COUNT),
    agitation:0, swirl:0, spring:0, villageRot:0, simTime:0,
    evShake:false, evWind:false, rng:1234
};
function saveCache(){
    simCache.step = Math.round(simTime/SIM_DT);
    simCache.pos.set(flakePos); simCache.vel.set(flakeVel); simCache.rest.set(flakeRest);
    simCache.agitation=agitation; simCache.swirl=swirl; simCache.spring=spring;
    simCache.villageRot=villageRot; simCache.simTime=simTime;
    simCache.evShake=evShake; simCache.evWind=evWind; simCache.rng=rngState;
}
function loadCache(){
    flakePos.set(simCache.pos); flakeVel.set(simCache.vel); flakeRest.set(simCache.rest);
    agitation=simCache.agitation; swirl=simCache.swirl; spring=simCache.spring;
    villageRot=simCache.villageRot; simTime=simCache.simTime;
    evShake=simCache.evShake; evWind=simCache.evWind; rngState=simCache.rng;
    villageGroup.rotation.y = villageRot;
}
function resetSimulation(){
    flakePos.set(initPos); flakeVel.set(initVel); flakeRest.set(initRest);
    agitation=0; swirl=0; spring=0; villageRot=0; simTime=0;
    evShake=false; evWind=false; rngState=1234;
    villageGroup.rotation.y=0;
    globeOffset.set(0,0,0); globeOffsetVel.set(0,0,0); offsetTarget.set(0,0,0);
    globeGroup.position.set(0,0,-2.55); globeGroup.rotation.set(0,0,0);
    dragging=false;
    simCache.step=-1;
}
const smooth01c = v => smooth01(v);
function showcaseNight(t){ return smooth01c((t-8.55)/1.35); }

const camCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3( 4.6, 3.15,  2.55),
    new THREE.Vector3( 1.75, 2.2,   0.55),
    new THREE.Vector3(-2.65, 2.45,  0.15),
    new THREE.Vector3( 2.35, 1.45, -0.15),
    new THREE.Vector3( 3.6,  2.6,   2.35)
], false, 'catmullrom', 0.35);
const tgtCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 1.5, -2.45),
    new THREE.Vector3(0, 1.72, -2.5),
    new THREE.Vector3(0, 1.78, -2.55),
    new THREE.Vector3(0, 1.68, -2.55),
    new THREE.Vector3(0, 1.62, -2.5)
], false, 'catmullrom', 0.35);

function seek(t){
    t = clamp(t, 0, SHOWCASE_DURATION);
    const targetStep = Math.round(t / SIM_DT);

    if(simCache.step >= 0 && targetStep >= simCache.step && (targetStep - simCache.step) <= 240){
        loadCache();                       // incremental path (recording loop)
    } else {
        resetSimulation();                 // full deterministic re-run
    }
    while(Math.round(simTime/SIM_DT) < targetStep) stepSim(SIM_DT);
    saveCache();
    flushFlakeGeometry();

    // camera
    const u = t / SHOWCASE_DURATION;
    const p = camCurve.getPoint(u), tg = tgtCurve.getPoint(u);
    camera.position.copy(p);
    controls.target.copy(tg);
    camera.lookAt(tg);

    // environment state at time t
    const n = showcaseNight(t);
    nightCur = n; nightTarget = n;
    applyNight(n);
    animTime = t;
    outSnowMat.uniforms.uTime.value = t;
    updateSteam(t);

    bench.shakeEnergy = agitation;
    // bench.airborne computed inside stepSim for the final step; ensure fresh:
    let ab=0; for(let i=0;i<FLAKE_COUNT;i++) if(!flakeRest[i]) ab++;
    bench.airborne = ab;

    composer.render();
    return t;
}
window.showcase = { duration: SHOWCASE_DURATION, seek };

/* =====================================================================
   INTERACTION — drag the globe to shake
   ===================================================================== */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const _planeHit = new THREE.Vector3();
const _camDir   = new THREE.Vector3();
const _centerW  = new THREE.Vector3();

function setNDC(e){
    const r = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((e.clientX - r.left)/r.width)*2 - 1;
    pointerNDC.y = -((e.clientY - r.top)/r.height)*2 + 1;
}
function onPointerDown(e){
    setNDC(e);
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObjects([glassMesh], false);
    // also allow grabbing the base region of the globe
    const baseHit = raycaster.intersectObject(globeGroup.children[0], false);
    if(hits.length || baseHit.length){
        dragging = true;
        controls.enabled = false;
        camera.getWorldDirection(_camDir);
        globeGroup.getWorldPosition(_centerW);
        _centerW.y += SPHERE_Y;
        dragPlane.setFromNormalAndCoplanarPoint(_camDir, _centerW);
        renderer.domElement.setPointerCapture(e.pointerId);
    }
}
function onPointerMove(e){
    if(!dragging) return;
    setNDC(e);
    raycaster.setFromCamera(pointerNDC, camera);
    if(raycaster.ray.intersectPlane(dragPlane, _planeHit)){
        _centerW.set(globeGroup.position.x, globeGroup.position.y + SPHERE_Y, globeGroup.position.z);
        offsetTarget.copy(_planeHit).sub(_centerW);
        const len = offsetTarget.length();
        if(len > 0.42) offsetTarget.multiplyScalar(0.42/len);
    }
}
function onPointerUp(e){
    if(!dragging) return;
    dragging = false;
    controls.enabled = true;
    try{ renderer.domElement.releasePointerCapture(e.pointerId); }catch(_){}
    const speed = globeVel.length();
    if(speed > 1.9) doFlick(clamp(speed*0.55, 0.9, 2.4));   // a proper flick!
    offsetTarget.set(0,0,0);
}
function updateGlobeDrag(dt){
    // spring toward the cursor while dragging; ease back to centre on release
    if(!dragging){
        offsetTarget.multiplyScalar(Math.exp(-3.2*dt));
    }
    // critically-damped-ish spring
    const K = 90, D = 13;
    globeOffsetVel.x += ((offsetTarget.x - globeOffset.x)*K - globeOffsetVel.x*D)*dt;
    globeOffsetVel.y += ((offsetTarget.y*0.55 - globeOffset.y)*K - globeOffsetVel.y*D)*dt;
    globeOffsetVel.z += ((offsetTarget.z - globeOffset.z)*K - globeOffsetVel.z*D)*dt;
    globeOffset.addScaledVector(globeOffsetVel, dt);

    globeGroup.position.set(globeOffset.x, globeOffset.y, -2.55 + globeOffset.z);
    globeGroup.rotation.z = -globeOffset.x*0.14;
    globeGroup.rotation.x =  globeOffset.z*0.12;

    globeVel.copy(globeGroup.position).sub(prevGlobePos).divideScalar(Math.max(dt,1e-4));
    prevGlobePos.copy(globeGroup.position);

    const speed = globeVel.length();
    if(dragging || speed > 0.05){
        agitation = Math.min(1.6, agitation + speed*dt*1.65);
        // angular (swirling) component of the drag
        const ox = globeOffset.x, oz = globeOffset.z;
        const r2 = Math.max(0.05, ox*ox + oz*oz);
        const omega = (oz*globeVel.x - ox*globeVel.z)/r2;
        swirl += (clamp(omega,-3,3)*0.85 - swirl)*(1 - Math.exp(-dt*2.6));
        // direct slosh pushed into the flakes
        if(speed > 0.4){
            const push = Math.min(1, speed*0.3)*dt*2.1;
            for(let i=0;i<FLAKE_COUNT;i++){
                if(flakeRest[i]) continue;
                flakeVel[i*3]   += globeVel.x*push;
                flakeVel[i*3+1] += globeVel.y*push*0.6;
                flakeVel[i*3+2] += globeVel.z*push;
            }
        }
    }
}

/* steam above the mug */
function updateSteam(t){
    for(let i=0;i<steamSprites.length;i++){
        const s = steamSprites[i];
        const cycle = (t*0.32 + i*0.27) % 1.1;
        const u = cycle/1.1;
        s.position.set(1.62 + Math.sin(t*1.7 + i*2.1)*0.03, 0.28 + u*0.34, -2.25 + Math.cos(t*1.3+i)*0.02);
        const sc = 0.055 + u*0.1; s.scale.set(sc, sc*1.5, 1);
        s.material.opacity = Math.sin(u*Math.PI)*0.4*(1-u*0.35);
    }
}

   INIT
   ===================================================================== */
function init(){
    const app = document.getElementById('app');
    renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    app.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color('#101013');
    scene.fog = new THREE.Fog(fogDay.clone(), 17, 58);

    // environment reflections (generated, no downloads)
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();

    camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 120);
    camera.position.set(2.9, 2.5, 1.95);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.58, -2.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.1;
    controls.maxDistance = 8.5;
    controls.minPolarAngle = 0.35;
    controls.maxPolarAngle = 1.52;
    controls.update();

    /* lights */
    hemi = new THREE.HemisphereLight('#d5dde2', '#46352a', 0.52);
    scene.add(hemi);

    keyLight = new THREE.DirectionalLight('#ffd7a3', 1.35);
    keyLight.position.set(3.6, 5.6, 2.6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(4096, 4096);
    keyLight.shadow.camera.left = -5.5; keyLight.shadow.camera.right = 5.5;
    keyLight.shadow.camera.top  =  6.0; keyLight.shadow.camera.bottom = -3.0;
    keyLight.shadow.camera.near = 0.5;  keyLight.shadow.camera.far = 16;
    keyLight.shadow.bias = -0.00045;
    keyLight.shadow.radius = 5;
    keyLight.target.position.set(0, 1.0, -2.5);
    scene.add(keyLight, keyLight.target);

    moonLight = new THREE.DirectionalLight('#a8c4de', 0.3);
    moonLight.position.set(-2.5, 4.2, -7);
    scene.add(moonLight);

    /* world */
    buildRoom();
    buildWindow();
    const outside = buildOutside();
    outsideLampLights = outside.lampLights;
    buildProps();
    buildGlobe();
    initFlakes();

    /* post-processing: bloom + shallow depth of field */
    composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    composer.setSize(window.innerWidth, window.innerHeight);
    composer.addPass(new RenderPass(scene, camera));
    bokehPass = new BokehPass(scene, camera, { focus: 5.1, aperture: 0.0026, maxblur: 0.0085 });
    composer.addPass(bokehPass);
    bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.45, 0.62, 0.82);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    const uScale = window.innerHeight / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
    flakeMat.uniforms.uScale.value = uScale;

    /* events */
    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerup', onPointerUp);
    renderer.domElement.addEventListener('pointercancel', onPointerUp);

    window.addEventListener('keydown', e=>{
        if(e.code === 'Space'){ e.preventDefault(); windMusicBox(); }
        else if(e.code === 'KeyN'){ nightTarget = nightTarget > 0.5 ? 0 : 1; }
    });
    window.addEventListener('resize', onResize);

    document.getElementById('nightBtn').addEventListener('click', ()=>{ nightTarget = nightTarget > 0.5 ? 0 : 1; });
    document.getElementById('windBtn').addEventListener('click', windMusicBox);
    document.getElementById('recordBtn').addEventListener('click', recordShowcase);

    prevGlobePos.copy(globeGroup.position);
    applyNight(0);
    bench.flakes = FLAKE_COUNT;
    animate();
}
function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
    flakeMat.uniforms.uScale.value =
        window.innerHeight / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
}
function recordShowcase(){
    const btn = document.getElementById('recordBtn');
    const original = btn.innerHTML;
    btn.textContent = '● Recording…';
    btn.disabled = true;
    const stream = renderer.domElement.captureStream(60);
    let mime = 'video/webm;codecs=vp9';
    if(!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
    const chunks = [];
    rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
        const blob = new Blob(chunks, { type:'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'winter-globe-showcase.webm'; a.click();
        setTimeout(()=>URL.revokeObjectURL(url), 5000);
        btn.innerHTML = original; btn.disabled = false;
        controls.enabled = true;
    };
    rec.start(150);
    const t0 = performance.now();
    controls.enabled = false;
    function tick(){
        const t = (performance.now() - t0)/1000;
        if(t >= SHOWCASE_DURATION){
            seek(SHOWCASE_DURATION);
            rec.stop();
            return;
        }
        btn.textContent = `● Recording… ${t.toFixed(1)}s`;
        seek(t);
        requestAnimationFrame(tick);
    }
    seek(0);
    tick();
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
const clock = new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    animTime += dt;

    controls.update();
    updateGlobeDrag(dt);
    stepSim(dt);
    flushFlakeGeometry();
    updateMusicBox(dt);

    // smooth day↔night
    nightCur += (nightTarget - nightCur)*(1 - Math.exp(-dt*3.2));
    if(Math.abs(nightTarget - nightCur) < 0.002) nightCur = nightTarget;
    applyNight(nightCur);

    outSnowMat.uniforms.uTime.value = animTime;
    updateSteam(animTime);

    bench.shakeEnergy = agitation;
    if(bokehPass && bokehPass.uniforms){
        bokehPass.uniforms['focus'].value = camera.position.distanceTo(controls.target);
    }

    composer.render();
}
init();
</script>
</body>

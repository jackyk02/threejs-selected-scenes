<body>

<button id="recordBtn"><span class="dot"></span><span id="recLabel">Record Video</span></button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/outputs/OutputPass.js';

/* ============================================================
   AURORA BOREALIS OVER A FROZEN TUNDRA — fully procedural
   ============================================================ */

// ---------- deterministic utilities ----------
function smoothstep(a, b, x){ x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
function lerp(a, b, t){ return a + (b - a) * t; }
function hash2(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct){
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++){ s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; }
  return s;
}
// deterministic RNG for scatter placement
function mulberry32(seed){ return function(){ seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rng = mulberry32(1337);

// ---------- world layout ----------
const LAKE = { x: 0, z: 55, r: 46 };
const CAMP = { x: 15, z: 7 };
const ICE_Y = 0.55;

function terrainHeight(x, z){
  // rolling tundra hills
  let h = fbm(x * 0.012 + 13.7, z * 0.012 + 7.3, 4);
  h = Math.pow(h, 1.65) * 15.0 - 3.2;
  // wind-carved sastrugi ridges (stretched noise)
  h += (fbm(x * 0.045, z * 0.016 + 40.0, 3) - 0.5) * 2.0;
  h += (fbm(x * 0.09, z * 0.09, 2) - 0.5) * 0.9;
  // distant rim mountains for silhouette
  const dc = Math.hypot(x, z - 20);
  h += smoothstep(150, 330, dc) * 26.0;
  // carve the frozen lake basin
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z);
  const k = smoothstep(LAKE.r + 24, LAKE.r - 10, dl);
  h = lerp(h, -2.5, Math.min(1, k * 1.08));
  // flatten a pad for the camp
  const dcamp = Math.hypot(x - CAMP.x, z - CAMP.z);
  h = lerp(h, 2.05, smoothstep(17, 6, dcamp) * 0.92);
  return h;
}

// ---------- renderer / scene / camera ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060c17, 0.0026);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1600);
camera.position.set(-10, 4.8, 97);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 12, -40);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 260;
controls.maxPolarAngle = 1.53;
controls.update();

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0x2a3c58, 0x0a0e15, 0.6);
scene.add(hemi);

const moonLight = new THREE.DirectionalLight(0xcfe0f6, 0.85);
moonLight.position.set(-70, 95, -110);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(4096, 4096);
moonLight.shadow.camera.left = -95; moonLight.shadow.camera.right = 95;
moonLight.shadow.camera.top = 95;   moonLight.shadow.camera.bottom = -95;
moonLight.shadow.camera.near = 10;  moonLight.shadow.camera.far = 350;
moonLight.shadow.bias = -0.0006;
moonLight.shadow.radius = 4;
scene.add(moonLight);
scene.add(moonLight.target);

const auroraLight = new THREE.DirectionalLight(0x3dff8f, 0.8);
auroraLight.position.set(10, 55, -85);
scene.add(auroraLight);
scene.add(auroraLight.target);

const magentaLight = new THREE.DirectionalLight(0xff3f9e, 0.32);
magentaLight.position.set(-30, 30, -70);
scene.add(magentaLight);

// ============================================================
//  SKY DOME — gradient, Milky Way band, airglow, moon, stars
// ============================================================
const GLSL_NOISE = /* glsl */`
  float hash21(vec2 p){ p = fract(p * vec2(234.34, 435.345)); p += dot(p, p + 34.23); return fract(p.x * p.y); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i), b = hash21(i + vec2(1.0, 0.0)), c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm(vec2 p){
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(17.3, 9.1); a *= 0.55; }
    return s;
  }
`;

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vDir;
    uniform float uTime;
    ${GLSL_NOISE}
    void main(){
      vec3 dir = normalize(vDir);
      float h = dir.y;
      // base night gradient
      vec3 col = mix(vec3(0.050, 0.080, 0.125), vec3(0.006, 0.010, 0.026), pow(clamp(h, 0.0, 1.0), 0.52));
      col = mix(vec3(0.028, 0.042, 0.068), col, smoothstep(-0.10, 0.02, h));
      // airglow near horizon — faint green with a whisper of orange at the very rim
      float ag = exp(-abs(h - 0.015) * 15.0);
      float agm = fbm(dir.xz * 5.0 + vec2(uTime * 0.008, 3.7));
      col += vec3(0.085, 0.175, 0.105) * ag * (0.55 + 0.75 * agm);
      col += vec3(0.135, 0.075, 0.028) * exp(-abs(h) * 26.0) * 0.55;
      // Milky Way — an inclined band of faint star clouds
      vec3 mwN = normalize(vec3(0.44, 0.36, -0.82));
      float md = dot(dir, mwN);
      float band = exp(-md * md * 8.5);
      float cl  = fbm(dir.xy * 6.5 + dir.z * 2.7);
      float cl2 = fbm(dir.xy * 16.0 - dir.z * 5.0 + 11.0);
      float lane = smoothstep(0.45, 0.85, cl) * 0.75 + smoothstep(0.5, 0.9, cl2) * 0.35;
      col += vec3(0.52, 0.60, 0.74) * band * (0.055 + 0.34 * lane) * smoothstep(-0.05, 0.22, h);
      col += vec3(0.30, 0.36, 0.48) * band * band * 0.10;
      // moon
      vec3 moonDir = normalize(vec3(-0.42, 0.36, -0.83));
      float mdd = dot(dir, moonDir);
      col += vec3(1.15, 1.18, 1.22) * smoothstep(0.99930, 0.99972, mdd) * 1.7;  // disc
      col += vec3(0.34, 0.41, 0.54) * pow(max(mdd, 0.0), 380.0) * 0.9;          // halo
      col += vec3(0.09, 0.11, 0.16) * pow(max(mdd, 0.0), 36.0) * 0.4;           // wide glow
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(950, 48, 32), skyMat);
scene.add(skyDome);

// ---------- stars (6000+ twinkling) ----------
const STAR_COUNT = 6500;
const starGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(STAR_COUNT * 3);
  const col = new Float32Array(STAR_COUNT * 3);
  const seed = new Float32Array(STAR_COUNT);
  const size = new Float32Array(STAR_COUNT);
  const r = mulberry32(9001);
  const palette = [[1,1,1],[0.75,0.85,1.0],[0.85,0.9,1.0],[1.0,0.9,0.78],[0.7,0.8,1.0]];
  for (let i = 0; i < STAR_COUNT; i++){
    // uniform on upper hemisphere shell
    let x, y, z;
    do {
      const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      x = s * Math.cos(th); y = Math.abs(u); z = s * Math.sin(th);
    } while (y < 0.02);
    const rad = 880;
    pos[i*3] = x * rad; pos[i*3+1] = y * rad; pos[i*3+2] = z * rad;
    const p = palette[Math.floor(r() * palette.length)];
    const bright = 0.35 + Math.pow(r(), 2.6) * 1.15;
    col[i*3] = p[0] * bright; col[i*3+1] = p[1] * bright; col[i*3+2] = p[2] * bright;
    seed[i] = r() * 100.0;
    size[i] = 0.9 + Math.pow(r(), 3.0) * 2.6;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  starGeo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  starGeo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  starGeo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
}
const starMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  uniforms: { uTime: { value: 0 }, uScale: { value: 800 } },
  vertexShader: /* glsl */`
    attribute vec3 aColor; attribute float aSeed; attribute float aSize;
    uniform float uTime; uniform float uScale;
    varying vec3 vColor; varying float vTw;
    void main(){
      vColor = aColor;
      float tw = 0.55 + 0.45 * sin(uTime * (0.6 + fract(aSeed * 0.37) * 2.2) + aSeed * 17.0);
      tw = pow(tw, 1.6);
      vTw = tw;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uScale / max(1.0, -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vColor; varying float vTw;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      float a = smoothstep(0.5, 0.05, d);
      a *= a;
      gl_FragColor = vec4(vColor * (0.35 + 1.25 * vTw), a * (0.45 + 0.55 * vTw));
    }
  `
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ============================================================
//  AURORA CURTAINS — long ribbon meshes, custom shaders
// ============================================================
const CURTAINS = [];

function makeCurtain(opts){
  const geo = new THREE.PlaneGeometry(opts.width, 1, 420, 28); // >400 segments along length
  geo.setAttribute('uv', new THREE.BufferAttribute(geo.attributes.uv.array, 2));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, fog: false,
    uniforms: {
      uTime:      { value: 0 },
      uFoldPhase: { value: 0 },
      uBrightness:{ value: 1 },
      uHeight:    { value: opts.height },
      uAmp:       { value: opts.amp },
      uPhase:     { value: opts.phase },
      uZBase:     { value: opts.z },
      uJitter:    { value: opts.jitter },
      uTint:      { value: opts.tint }
    },
    vertexShader: /* glsl */`
      uniform float uTime, uFoldPhase, uHeight, uAmp, uPhase, uZBase, uJitter;
      varying vec2 vUv; varying vec3 vWorldPos; varying float vFold;
      void main(){
        vUv = uv;
        float x = position.x;
        // arcing lower edge — the curtain hangs from a waving "ray arc"
        float bottom = 13.5
          + 4.5 * sin(x * 0.016 + uPhase * 1.7)
          + 2.2 * sin(x * 0.041 + uPhase * 2.6 + 1.3)
          + 1.1 * sin(x * 0.083 + uPhase * 4.1);
        // traveling folds: large swells + secondary ripple + fine shimmer
        float fold = uAmp * (
            sin(x * 0.052 + uFoldPhase + uPhase * 3.0) * 1.05
          + sin(x * 0.021 - uFoldPhase * 0.62 + 1.7) * 1.85
          + sin(x * 0.115 + uFoldPhase * 1.72 + 0.6) * 0.34
        );
        float y = bottom + uv.y * uHeight
                + (uv.y * uv.y) * 5.0 * sin(x * 0.03 + uFoldPhase * 0.8 + uPhase);   // top drifts with folds
        vec3 w = vec3(
          x + 6.0 * sin(uTime * 0.06 + uPhase),
          y,
          uZBase + fold + uJitter * sin(x * 0.007 + uPhase * 9.0)
        );
        vFold = fold;
        vWorldPos = w;
        gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime, uBrightness, uPhase, uTint;
      varying vec2 vUv; varying vec3 vWorldPos; varying float vFold;
      ${GLSL_NOISE}
      void main(){
        float x = vWorldPos.x;
        // ---- fine vertical ray striations (stretched noise: high freq in x, low in y)
        float n1 = vnoise(vec2(x * 0.075 + uPhase * 41.0, uTime * 0.13));
        float n2 = vnoise(vec2(x * 0.19  - uPhase * 23.0 + 7.0, uTime * 0.09 + 4.2));
        float n3 = vnoise(vec2(x * 0.43  + uPhase * 67.0, uTime * 0.21 + 9.7));
        float rays = pow(clamp(n1 * 0.55 + n2 * 0.38 + n3 * 0.22, 0.0, 1.0), 2.35) * 1.85;
        // ray arcs drift sideways over time
        rays *= 0.75 + 0.45 * vnoise(vec2(x * 0.012 - uTime * 0.035, uPhase * 13.0));

        // ---- ragged top edge
        float ragged = fbm(vec2(x * 0.028 + uPhase * 31.0, uTime * 0.05));
        float topEdge = 1.0 - smoothstep(0.42 + ragged * 0.35, 1.0, vUv.y);
        float shape = smoothstep(0.0, 0.045, vUv.y) * topEdge;

        // ---- color ramp: green lower → teal → magenta → deep red at the crown
        vec3 cGreen   = vec3(0.12, 1.00, 0.38);
        vec3 cTeal    = vec3(0.02, 0.78, 0.52);
        vec3 cMagenta = vec3(0.82, 0.16, 0.55);
        vec3 cRed     = vec3(0.72, 0.05, 0.24);
        vec3 col = mix(cGreen, cTeal, smoothstep(0.04, 0.34, vUv.y));
        col = mix(col, cMagenta, smoothstep(0.32, 0.72, vUv.y));
        col = mix(col, cRed, smoothstep(0.68, 1.0, vUv.y));
        // per-curtain hue nudge
        col *= vec3(1.0 + uTint * 0.25, 1.0 - uTint * 0.28, 1.0 + uTint * 0.12);

        // ---- bright ray arc at the lower border
        float lowerArc = exp(-vUv.y * 5.2);
        col += cGreen * lowerArc * 0.9;

        // ---- folds catch the light: crests glow, troughs fall dark
        float foldGlow = 0.72 + 0.55 * smoothstep(-6.0, 7.0, vFold);

        float body = shape * (0.16 + rays * 1.25) * foldGlow;
        float intensity = uBrightness;
        vec3 outCol = col * body * intensity * 1.35;
        float alpha = clamp(body * intensity, 0.0, 1.0);
        gl_FragColor = vec4(outCol, alpha);
      }
    `
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 10;
  scene.add(mesh);
  const curtain = { mesh, mat, opts };
  CURTAINS.push(curtain);
  return curtain;
}

makeCurtain({ width: 430, height: 33, amp: 6.5, phase: 0.0, z: -84, jitter: 5.0, tint: 0.00, base: 1.00 });
makeCurtain({ width: 340, height: 24, amp: 5.0, phase: 2.1, z: -62, jitter: 7.0, tint: 0.65, base: 0.85 });
makeCurtain({ width: 380, height: 41, amp: 7.5, phase: 4.5, z: -100, jitter: 4.0, tint: 0.18, base: 0.90 });
makeCurtain({ width: 280, height: 18, amp: 4.0, phase: 5.7, z: -52, jitter: 8.5, tint: 0.85, base: 0.72 });

// ---------- corona overhead (storm) ----------
const coronaMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending, fog: false,
  uniforms: { uTime: { value: 0 }, uCorona: { value: 0 } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform float uTime, uCorona;
    ${GLSL_NOISE}
    void main(){
      vec2 c = vUv - 0.5;
      float r = length(c) * 2.0;
      float ang = atan(c.y, c.x);
      // angular ray spokes rotating slowly
      float spokes = vnoise(vec2(ang * 3.4 + uTime * 0.10, r * 1.4 - uTime * 0.22));
      spokes = pow(spokes, 2.1);
      float spokes2 = vnoise(vec2(ang * 8.0 - uTime * 0.16, r * 2.6 - uTime * 0.34) + 31.0);
      spokes2 = pow(spokes2, 2.6);
      float ring = exp(-abs(r - 0.34) * 4.2) * 0.65 + exp(-r * 3.1) * 0.85;
      vec3 col = mix(vec3(0.15, 1.0, 0.42), vec3(0.85, 0.18, 0.58), smoothstep(0.05, 0.85, r));
      col += vec3(0.5, 0.1, 0.35) * spokes2 * 0.6;
      float a = ring * (0.30 + spokes * 1.15 + spokes2 * 0.6);
      a *= smoothstep(1.0, 0.55, r) * smoothstep(0.0, 0.05, r);
      gl_FragColor = vec4(col * a * uCorona * 1.6, a * uCorona);
    }
  `
});

function makeSnowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#e8ecf3'; g.fillRect(0, 0, 512, 512);
  // broad tonal patches
  for (let i = 0; i < 40; i++){
    const x = rng() * 512, y = rng() * 512, r = 40 + rng() * 130;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${205 + rng()*30|0},${215 + rng()*25|0},${232 + rng()*20|0},0.28)`);
    gr.addColorStop(1, 'rgba(232,236,243,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // wind-carved streaks (sastrugi) — elongated swept lines
  g.save(); g.translate(256, 256); g.rotate(-0.28); g.translate(-256, -256);
  for (let i = 0; i < 260; i++){
    const y = rng() * 512, len = 50 + rng() * 170, x = rng() * 512 - 80;
    g.strokeStyle = `rgba(178,196,220,${0.10 + rng() * 0.22})`;
    g.lineWidth = 1 + rng() * 3.2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (rng() - 0.5) * 3); g.stroke();
    g.strokeStyle = `rgba(255,255,255,${0.15 + rng() * 0.3})`;
    g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(x, y - 1.5); g.lineTo(x + len, y - 1.5 + (rng() - 0.5) * 2); g.stroke();
  }
  g.restore();
  // sparkle crust
  for (let i = 0; i < 2400; i++){
    g.fillStyle = `rgba(255,255,255,${0.25 + rng() * 0.55})`;
    g.fillRect(rng() * 512, rng() * 512, rng() < 0.12 ? 2 : 1, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(7, 7);
  tex.anisotropy = 8;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

  fog: false,
  uniforms: {
    tIce:       { value: iceRT.texture },
    uTexMatrix: { value: new THREE.Matrix4() },
    uTime:      { value: 0 }
  },
  vertexShader: /* glsl */`
    uniform mat4 uTexMatrix;
    varying vec4 vUvP; varying vec3 vWorldPos; varying vec3 vViewDir;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vViewDir = cameraPosition - wp.xyz;
      vUvP = uTexMatrix * wp;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tIce; uniform float uTime;
    varying vec4 vUvP; varying vec3 vWorldPos; varying vec3 vViewDir;
    ${GLSL_NOISE}
    void main(){
      vec2 p = vWorldPos.xz;
      // ---- crack network: two scales of ridged cells
      vec2 cp = p * 0.052;
      float f1 = abs(fbm(cp + vec2(3.1, 7.7)) - 0.5);
      float crack = smoothstep(0.055, 0.006, f1);
      float f2 = abs(fbm(cp * 2.6 + vec2(17.0, 5.0)) - 0.5);
      float crack2 = smoothstep(0.035, 0.005, f2) * 0.55;
      // occasional long diagonal pressure ridges
      float ridge = abs(sin(p.x * 0.021 + p.y * 0.033 + fbm(p * 0.02) * 3.0));
      float ridgeCrack = smoothstep(0.045, 0.004, ridge) * 0.8;
      float allCracks = clamp(crack + crack2 + ridgeCrack, 0.0, 1.0);
      // ---- snow dust patches
      float dust = smoothstep(0.52, 0.74, fbm(p * 0.145 + vec2(7.3, 1.9)));
      dust += smoothstep(0.62, 0.85, fbm(p * 0.42 + vec2(13.0, 29.0))) * 0.4;
      dust = clamp(dust, 0.0, 1.0);
      // ---- roughen the reflection across the cracks: perturb projected uv
      vec2 grad = vec2(fbm(cp + vec2(0.35, 0.0)) - fbm(cp - vec2(0.35, 0.0)),
                       fbm(cp + vec2(0.0, 0.35)) - fbm(cp - vec2(0.0, 0.35)));
      vec4 uvp = vUvP;
      uvp.xy += grad * (0.028 + allCracks * 0.055) * uvp.w;
      vec3 refl = texture2DProj(tIce, uvp).rgb;
      // ---- dark ice body
      vec3 base = vec3(0.014, 0.028, 0.041);
      base += vec3(0.010, 0.020, 0.026) * fbm(p * 0.08 + 41.0);
      float fres = pow(1.0 - clamp(dot(normalize(vViewDir), vec3(0.0, 1.0, 0.0)), 0.0, 1.0), 1.55);
      float reflAmt = mix(0.34, 0.92, fres) * (1.0 - dust * 0.78) * (1.0 - allCracks * 0.38);
      vec3 col = base + refl * reflAmt;
      // ---- snow dust reads as pale matte veils
      col = mix(col, vec3(0.46, 0.52, 0.585), dust * 0.60);
      // ---- cracks: faint cyanly-lit seams with dark cores
      col += vec3(0.10, 0.235, 0.27) * crack * 0.75;
      col += vec3(0.055, 0.13, 0.16) * crack2;
      col += vec3(0.13, 0.27, 0.30) * ridgeCrack * 0.7;
      col *= 1.0 - ridgeCrack * 0.35;
      // ---- frozen depth shimmer
      col += vec3(0.015, 0.035, 0.045) * (0.5 + 0.5 * sin(uTime * 0.4 + p.x * 0.05 + p.y * 0.04));
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

// ---------- planar reflection machinery ----------
const mirrorCam = new THREE.PerspectiveCamera();
const texMatrix = new THREE.Matrix4();
const biasMat = new THREE.Matrix4().set(0.5, 0, 0, 0.5,  0, 0.5, 0, 0.5,  0, 0, 0.5, 0.5,  0, 0, 0, 1);
const reflectPlane = new THREE.Plane();
const clipPlane = new THREE.Vector4();
const qVec = new THREE.Vector4();

function renderIceReflection(){
  // mirror the camera position / target / up across y = ICE_Y
  const icePoint = new THREE.Vector3(0, ICE_Y, 0);
  const camPos = camera.position.clone();
  const target = new THREE.Vector3();
  camera.getWorldDirection(target); target.multiplyScalar(20).add(camPos);
  const mPos = camPos.clone(); mPos.y = 2 * ICE_Y - mPos.y;
  const mTgt = target.clone(); mTgt.y = 2 * ICE_Y - mTgt.y;
  mirrorCam.position.copy(mPos);
  mirrorCam.up.set(0, -1, 0);
  mirrorCam.lookAt(mTgt);
  mirrorCam.fov = camera.fov; mirrorCam.aspect = camera.aspect;
  mirrorCam.near = camera.near; mirrorCam.far = camera.far;
  mirrorCam.updateMatrixWorld();
  // oblique near-plane clipping against the ice surface (Lengyel-style)
  reflectPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), icePoint);
  reflectPlane.applyMatrix4(mirrorCam.matrixWorldInverse);
  clipPlane.set(reflectPlane.normal.x, reflectPlane.normal.y, reflectPlane.normal.z, reflectPlane.constant);
  mirrorCam.projectionMatrix.copy(camera.projectionMatrix);
  const proj = mirrorCam.projectionMatrix;
  qVec.x = (Math.sign(clipPlane.x) + proj.elements[8]) / proj.elements[0];
  qVec.y = (Math.sign(clipPlane.y) + proj.elements[9]) / proj.elements[5];
  qVec.z = -1.0;
  qVec.w = (1.0 + proj.elements[10]) / proj.elements[14];
  clipPlane.multiplyScalar(2.0 / clipPlane.dot(qVec));
  proj.elements[2] = clipPlane.x;
  proj.elements[6] = clipPlane.y;
  proj.elements[10] = clipPlane.z + 1.0 - 0.0018;
  proj.elements[14] = clipPlane.w;
  mirrorCam.matrixWorldInverse.copy(mirrorCam.matrixWorld).invert();
  // projective texture matrix
  texMatrix.copy(biasMat).multiply(mirrorCam.projectionMatrix).multiply(mirrorCam.matrixWorldInverse);
  iceMat.uniforms.uTexMatrix.value.copy(texMatrix);
  // render
  ice.visible = false;
  const prevRT = renderer.getRenderTarget();
  renderer.setRenderTarget(iceRT);
  renderer.clear();
  renderer.render(scene, mirrorCam);
  renderer.setRenderTarget(prevRT);
  ice.visible = true;
}

const FOLD_RATE = [0, 0.32, 0.72, 1.38];   // fold travel speed per level
const ACT_GAIN  = [0, 0.40, 0.74, 1.12];   // curtain gain per level
const ACT_NAME  = ['', 'Quiet', 'Active', 'Storm'];

let activity = 2;           // 1 quiet · 2 active · 3 storm
let simTime = 0;
let foldPhase = 0;
let coronaAmt = 0;
let substormT = -1000;      // simTime at which the last burst was triggered

const BURST_T_SHOWCASE = 4.2;
const SHOWCASE_STORM_T = 7.0;

function burstEnv(x){
  if (x < 0 || x > 9) return 0;
  if (x < 0.45) return x / 0.45;                    // fast rise
  return Math.exp(-(x - 0.45) / 1.55);              // slow decay
}
function currentBurst(){ return burstEnv(simTime - substormT); }
function foldRate(){ return FOLD_RATE[activity] * (1 + currentBurst() * 1.6); }
function auroraBench(){ return THREE.MathUtils.clamp(0.22 + 0.29 * (activity - 1) + currentBurst() * 0.5, 0, 1); }

// numeric fold-phase integral for the deterministic showcase
function foldPhaseAt(t, activityFn){
  let p = 0;
  const dt = 1 / 30;
  for (let i = 0; i < t; i += dt){
    const a = activityFn(i);
    const b = burstEnv(i - BURST_T_SHOWCASE);
    p += dt * FOLD_RATE[a] * (1 + b * 1.6);
  }
  return p;
}

  for (const c of CURTAINS){
    c.mat.uniforms.uTime.value = simTime;
    c.mat.uniforms.uFoldPhase.value = foldPhase;
    c.mat.uniforms.uBrightness.value = c.opts.base * gain;
    c.mat.uniforms.uHeight.value = c.opts.height * (activity === 3 ? 1.35 : 1.0) * (1 + burst * 0.4);
  }
  // lights breathe with the aurora
  auroraLight.intensity = 0.35 + gain * 1.35;
  magentaLight.intensity = 0.10 + gain * 0.42;
  auroraTintUniform.value.setRGB(0.12 + gain * 0.18, 0.85, 0.34 + gain * 0.22);
  auroraBoostUniform.value = 0.12 + gain * 0.55;
  // tent lantern flicker — deterministic in simTime
  const flick = Math.sin(simTime * 9.3) * 0.5 + Math.sin(simTime * 15.7 + 1.3) * 0.3 + Math.sin(simTime * 3.1 + 4.0) * 0.2;
  lanternLight.intensity = 2.4 + flick * 0.55;
  lanternMat.emissiveIntensity = 3.1 + flick * 0.9;
  doorMat.emissiveIntensity = 2.15 + flick * 0.4;
  tentMat.emissiveIntensity = 0.36 + flick * 0.07;
  // HUD pill
  pill.textContent = ACT_NAME[activity] + (burst > 0.15 ? ' · Substorm' : '');
  pill.style.color = activity === 3 ? '#ffc2ec' : '#9fe8bd';

  // bench
  window.__bench.activity = activity;
  window.__bench.curtains = CURTAINS.length;
  window.__bench.stars = STAR_COUNT;
  window.__bench.brightness = auroraBench();
}

function renderFrame(){
  renderIceReflection();
  composer.render();
}

window.__bench = { activity, curtains: CURTAINS.length, stars: STAR_COUNT, brightness: 0.5 };

// ============================================================
//  SHOWCASE — 12 s scripted camera + events, deterministic seek
// ============================================================
const SHOWCASE_DURATION = 12.0;
const showcasePosCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-10, 4.8, 97),   // opening: low over the lake, aurora + reflection
  new THREE.Vector3(10, 5.3, 72),
  new THREE.Vector3(25, 4.4, 38),
  new THREE.Vector3(21.5, 4.4, 17),  // camp close pass as the substorm flares
  new THREE.Vector3(-16, 17, 74),    // pull up and wide — the storm front
  new THREE.Vector3(-4, 8.6, 92),
  new THREE.Vector3(-10, 4.8, 97)    // resolve back to the opening frame
], false, 'centripetal', 0.5);
const showcaseTgtCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 16, -55),
  new THREE.Vector3(10, 12, -30),
  new THREE.Vector3(17, 3.4, 9),
  new THREE.Vector3(15.5, 3.6, 7.5),
  new THREE.Vector3(0, 30, -78),     // gaze up into the corona
  new THREE.Vector3(0, 19, -55),
  new THREE.Vector3(0, 16, -55)
], false, 'centripetal', 0.5);

function showcaseActivity(t){ return t < SHOWCASE_STORM_T ? 2 : 3; }

function seek(t){
  t = THREE.MathUtils.clamp(t, 0, SHOWCASE_DURATION);
  simTime = t;
  activity = showcaseActivity(t);
  substormT = t >= BURST_T_SHOWCASE ? BURST_T_SHOWCASE : -1000;
  foldPhase = foldPhaseAt(t, showcaseActivity);
  coronaAmt = smoothstep(SHOWCASE_STORM_T, SHOWCASE_STORM_T + 1.4, t) * 0.9 + burstEnv(t - BURST_T_SHOWCASE) * 0.45;
  coronaAmt = Math.min(1, coronaAmt);
  // camera on the rail
  const u = t / SHOWCASE_DURATION;
  camera.position.copy(showcasePosCurve.getPoint(u));
  const tgt = showcaseTgtCurve.getPoint(u);
  camera.lookAt(tgt);
  applySceneState();
  renderFrame();
}

window.showcase = { duration: SHOWCASE_DURATION, seek };

// ============================================================
//  INPUT — keys 1–3, space substorm, drag orbit
// ============================================================
window.addEventListener('keydown', (e) => {
  if (e.code === 'Digit1'){ activity = 1; }
  else if (e.code === 'Digit2'){ activity = 2; }
  else if (e.code === 'Digit3'){ activity = 3; }
  else if (e.code === 'Space'){
    e.preventDefault();
    if (!showcaseActive) substormT = simTime;
  }
});

// ============================================================
//  MAIN LOOP + RECORD VIDEO BUTTON
// ============================================================
const clock = new THREE.Clock();
let showcaseActive = false;
let recording = false;

const recordBtn = document.getElementById('recordBtn');
const recLabel = document.getElementById('recLabel');

recordBtn.addEventListener('click', () => {
  if (recording) return;
  recording = true;
  showcaseActive = true;
  recordBtn.classList.add('rec');
  recLabel.textContent = 'Recording…';
  recordBtn.blur();

  const stream = renderer.domElement.captureStream(60);
  let mime = 'video/webm;codecs=vp9';
  if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
  const chunks = [];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16_000_000 });
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'aurora-borealis-showcase.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recording = false;
    showcaseActive = false;
    recordBtn.classList.remove('rec');
    recLabel.textContent = 'Record Video';
    controls.target.set(0, 12, -40);
  };
  rec.start(250);
  const started = performance.now();
  const tick = () => {
    const t = (performance.now() - started) / 1000;
    if (t >= SHOWCASE_DURATION){
      seek(SHOWCASE_DURATION);
      rec.stop();
      return;
    }
    seek(t);
    requestAnimationFrame(tick);
  };
  tick();
});

function animate(){
  requestAnimationFrame(animate);
  if (showcaseActive) return; // showcase path drives seeks + renders itself
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;
  foldPhase += dt * foldRate();
  const targetCorona = (activity === 3 ? 0.9 : 0.0) + currentBurst() * 0.45;
  coronaAmt += (Math.min(1, targetCorona) - coronaAmt) * Math.min(1, dt * 1.6);
  controls.update();
  applySceneState();
  renderFrame();
}

// star/snow point scale tracks resolution + fov
function updatePointScale(){
  const s = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  starMat.uniforms.uScale.value = s;
  snowMat.uniforms.uScale.value = s;
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  updatePointScale();
});
updatePointScale();

animate();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora Borealis over a Frozen Tundra Lake</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#02060c; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; z-index:10; color:#e8f4ff; text-shadow:0 1px 10px rgba(0,0,0,.75); user-select:none; pointer-events:none; }
  .title { left:22px; top:18px; }
  .title h1 { margin:0; font-size:17px; letter-spacing:.22em; font-weight:800; text-transform:uppercase; color:#ecfff4; }
  .title p { margin:6px 0 0; font-size:12px; letter-spacing:.08em; color:#9fc6d8; }
  .panel { left:22px; bottom:18px; max-width:430px; background:linear-gradient(180deg,rgba(7,18,30,.62),rgba(7,18,30,.34)); border:1px solid rgba(150,230,255,.18); border-radius:14px; padding:12px 14px; backdrop-filter: blur(10px); box-shadow:0 12px 50px rgba(0,0,0,.35); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:5px 10px; border-radius:999px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; border:1px solid rgba(190,255,220,.24); background:rgba(16,48,42,.55); color:#bfffe0; }
  .dot { width:8px; height:8px; border-radius:50%; background:#3cffa4; box-shadow:0 0 12px #3cffa4; }
  .hint { margin-top:8px; font-size:11px; line-height:1.55; color:#b9d2df; }
  .hint b { color:#ffffff; font-weight:700; }
  .record { position:fixed; z-index:11; right:20px; top:18px; pointer-events:auto; cursor:pointer; border:1px solid rgba(255,255,255,.25); color:#081018; background:linear-gradient(180deg,#fff,#cfe8ef); border-radius:999px; padding:11px 16px; font-weight:800; letter-spacing:.08em; font-size:12px; box-shadow:0 10px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.9); }
  .record:hover { transform:translateY(-1px); filter:brightness(1.03); }
  .record.recording { background:linear-gradient(180deg,#ff6a4d,#ff2e2e); color:#fff; border-color:rgba(255,255,255,.35); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,64,64,.55);} 50%{ box-shadow:0 0 0 9px rgba(255,64,64,.0);} }
  .vignette { position:fixed; inset:0; z-index:5; pointer-events:none; background:radial-gradient(circle at 50% 46%, transparent 42%, rgba(0,0,0,.18) 74%, rgba(0,0,0,.55) 100%); }
  @media (max-width:700px){ .panel{ max-width:calc(100vw - 44px); } .title p{ display:none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>
<div class="hud title"><h1>Kárman Ridge</h1><p>AURORA BOREALIS · FROZEN LAKE · WINTER CAMP</p></div>
<button id="recordBtn" class="record">● RECORD VIDEO</button>
<div class="hud panel">
  <div class="row"><span class="pill"><span class="dot"></span><span id="activityLabel">ACTIVE 2</span></span><span class="pill" style="color:#ffd9ec;border-color:rgba(255,170,220,.28);background:rgba(55,16,39,.48)">SUBCSTORM: SPACE</span></div>
  <div class="hint"><b>Drag</b> orbit · <b>Wheel</b> zoom · <b>1</b> quiet · <b>2</b> active · <b>3</b> storm corona · <b>Space</b> trigger substorm burst. The benchmark is live on <b>window.__bench</b>.</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

/* ============================================================
   AURORA TUNDRA — one-file procedural Three.js scene
   ============================================================ */
const app = document.getElementById('app');
const recordBtn = document.getElementById('recordBtn');
const activityLabel = document.getElementById('activityLabel');

const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const sstep = (e0,e1,x) => { const t = clamp((x-e0)/(e1-e0)); return t*t*(3-2*t); };
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash2(x,y){ const s = Math.sin(x*127.1 + y*311.7) * 43758.5453123; return s - Math.floor(s); }
function vnoise(x,y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi,yi), b = hash2(xi+1,yi), c = hash2(xi,yi+1), d = hash2(xi+1,yi+1);
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm(x,y,oct=5){
  let amp=0.5, freq=1, sum=0, norm=0;
  for(let i=0;i<oct;i++){ sum += amp*vnoise(x*freq, y*freq); norm += amp; amp*=0.5; freq*=2.03; x += 37.17; y -= 19.41; }
  return sum/norm;
}
function normAngle(a){ while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return a; }

/* ---------- world layout ---------- */
const LAKE = { x: 0, z: 28, rx: 78, rz: 44 };
function lakeEllipse(x,z){
  const dx = (x - LAKE.x) / LAKE.rx, dz = (z - LAKE.z) / LAKE.rz;
  return Math.sqrt(dx*dx + dz*dz);
}
function terrainHeight(x,z){
  const e = lakeEllipse(x,z);
  const shore = sstep(0.90, 1.38, e);
  const far = sstep(25, 165, -z);
  const side = clamp((Math.abs(x)-70)/180);
  let hills = fbm(x*0.012 + 11.3, z*0.012 - 7.7, 5) * 16;
  hills += Math.pow(fbm(x*0.035 - 3.1, z*0.035 + 8.8, 4), 1.7) * 9;
  hills += far*far*26 + side*8;
  const wind = Math.sin(x*0.105 + fbm(x*0.018,z*0.018,4)*9.0 + Math.sin(z*0.026)*2.4);
  hills += wind * (0.65 + 1.4*fbm(x*0.045+5.0,z*0.045-4.0,3));
  hills += (fbm(x*0.16,z*0.16,3)-0.5) * 1.25;
  const inside = -0.55 + (fbm(x*0.08,z*0.08,2)-0.5)*0.18;
  return lerp(inside, Math.max(0.15,hills), shore);
}

/* ---------- renderer / scene / camera / controls ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance', preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020711);
scene.fog = new THREE.FogExp2(0x06101b, 0.0105);

const camera = new THREE.PerspectiveCamera(56, window.innerWidth/window.innerHeight, 0.1, 1400);
camera.position.set(94, 27, 111);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 11, -28);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.minDistance = 14;
controls.maxDistance = 245;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0x7896b8, 0x08120e, 0.62);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0xcfe7ff, 2.15);
moon.position.set(-85, 120, 55);
moon.castShadow = true;
moon.shadow.mapSize.set(4096, 4096);
moon.shadow.camera.near = 20;
moon.shadow.camera.far = 340;
moon.shadow.camera.left = -155;
moon.shadow.camera.right = 155;
moon.shadow.camera.top = 160;
moon.shadow.camera.bottom = -125;
moon.shadow.bias = -0.00038;
moon.shadow.normalBias = 0.025;
scene.add(moon);
const auroraWash = new THREE.DirectionalLight(0x45ff9d, 1.0);
auroraWash.position.set(0, 115, -95);
auroraWash.target.position.set(0, 0, 10);
scene.add(auroraWash, auroraWash.target);
const magentaWash = new THREE.PointLight(0xff35c8, 0.8, 230, 2.1);
magentaWash.position.set(0, 56, -118);
scene.add(magentaWash);
const tentLight = new THREE.PointLight(0xffa64f, 2.5, 19, 2.0);
tentLight.position.set(45.2, terrainHeight(45.2,58.4)+1.65, 58.0);
tentLight.castShadow = true;
tentLight.shadow.mapSize.set(1024,1024);
scene.add(tentLight);

/* ============================================================
   Procedural canvas textures
   ============================================================ */
function makeSnowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,512,512);
  grad.addColorStop(0,'#f6fbff'); grad.addColorStop(.5,'#dfeaf4'); grad.addColorStop(1,'#c9d8e8');
  g.fillStyle = grad; g.fillRect(0,0,512,512);
  for(let i=0;i<2600;i++){
    const x=Math.random()*512, y=Math.random()*512, r=Math.random()*1.8+0.25;
    g.fillStyle = `rgba(255,255,255,${0.25+Math.random()*0.55})`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    if(Math.random()<0.28){ g.fillStyle='rgba(120,155,190,0.20)'; g.fillRect(x,y,1.5,1.5); }
  }
  g.globalAlpha = .33;
  for(let i=0;i<95;i++){
    g.strokeStyle = Math.random()<.5 ? '#ffffff' : '#aebfe0';
    g.lineWidth = 1 + Math.random()*4;
    g.beginPath();
    let y = Math.random()*512; g.moveTo(-20,y);
    for(let x=0;x<=560;x+=34) g.lineTo(x, y + Math.sin(x*0.018+i)*10 + (Math.random()-.5)*8);
    g.stroke();
  }
  g.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(9,7); tex.anisotropy = 8; tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeBumpTexture(){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d'); g.fillStyle='#808080'; g.fillRect(0,0,256,256);
  for(let i=0;i<170;i++){ g.strokeStyle=i%2?'#c7c7c7':'#383838'; g.globalAlpha=.32; g.lineWidth=1+Math.random()*5; g.beginPath(); const y=Math.random()*256; g.moveTo(0,y); g.lineTo(256,y+(Math.random()-.5)*38); g.stroke(); }
  g.globalAlpha=1;
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(11,8); tex.anisotropy=4; return tex;
}
function makeIceCrackTexture(){
  const c=document.createElement('canvas'); c.width=c.height=1024;
  const g=c.getContext('2d');
  g.clearRect(0,0,1024,1024);
  g.fillStyle='rgba(5,13,23,0.66)'; g.fillRect(0,0,1024,1024);
  // deep blue-green lens patches
  for(let i=0;i<42;i++){
    const x=Math.random()*1024,y=Math.random()*1024,rx=45+Math.random()*180,ry=25+Math.random()*130;
    const gr=g.createRadialGradient(x,y,2,x,y,Math.max(rx,ry));
    gr.addColorStop(0,'rgba(14,48,66,0.78)'); gr.addColorStop(.55,'rgba(7,22,36,0.54)'); gr.addColorStop(1,'rgba(7,22,36,0)');
    g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,rx,ry,Math.random()*Math.PI,0,7); g.fill();
  }
  // wind-dusted snow lies
  for(let i=0;i<150;i++){
    const x=Math.random()*1024,y=Math.random()*1024,rx=18+Math.random()*120,ry=4+Math.random()*19;
    g.fillStyle=`rgba(235,246,255,${0.12+Math.random()*0.33})`;
    g.beginPath(); g.ellipse(x,y,rx,ry,(Math.random()-.5)*0.9,0,7); g.fill();
  }
  // jagged crack webs
  function crack(x,y,angle,length,width,alpha){
    g.strokeStyle=`rgba(217,241,255,${alpha})`;
    g.lineWidth=width; g.shadowBlur=8; g.shadowColor='rgba(160,220,255,0.75)';
    g.beginPath(); g.moveTo(x,y);
    let a=angle, remaining=length;
    while(remaining>0){
      const step=18+Math.random()*34;
      a += (Math.random()-.5)*0.85;
      x += Math.cos(a)*step; y += Math.sin(a)*step; remaining -= step;
      g.lineTo(x,y);
      if(Math.random()<0.20 && width>0.8){
        g.save();
        g.globalAlpha=0.75;
        crack(x,y,a+(Math.random()<.5?1:-1)*(0.6+Math.random()*0.8), length*(0.18+Math.random()*0.28), Math.max(0.6,width*0.55), alpha*0.72);
        g.restore();
      }
    }
    g.stroke(); g.shadowBlur=0;
  }
  for(let i=0;i<24;i++) crack(Math.random()*1024, Math.random()*1024, Math.random()*Math.PI*2, 240+Math.random()*620, 1.1+Math.random()*2.7, 0.42+Math.random()*0.42);
  for(let i=0;i<900;i++){ g.fillStyle=`rgba(255,255,255,${Math.random()*0.58})`; g.fillRect(Math.random()*1024,Math.random()*1024,1.1,1.1); }
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=8; tex.colorSpace=THREE.SRGBColorSpace; return tex;
}
function makeWoodTexture(){
  const c=document.createElement('canvas'); c.width=256;c.height=128; const g=c.getContext('2d');
  g.fillStyle='#5a3521'; g.fillRect(0,0,256,128);
  for(let y=0;y<128;y+=7){ g.strokeStyle=y%14?'#7b4c2b':'#2e1c12'; g.globalAlpha=.72; g.lineWidth=2+Math.random()*3; g.beginPath(); g.moveTo(0,y+Math.random()*3); g.bezierCurveTo(70,y+Math.random()*5,150,y-Math.random()*5,256,y+Math.random()*3); g.stroke(); }
  g.globalAlpha=1; const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.colorSpace=THREE.SRGBColorSpace; return tex;
}
const snowTex = makeSnowTexture();
const bumpTex = makeBumpTexture();
const iceTex = makeIceCrackTexture();
const woodTex = makeWoodTexture();

/* ============================================================
   Sky dome, Milky Way, airglow, stars
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ uTime:{value:0}, uAurora:{value:0.65} },
  vertexShader:`
    varying vec3 vDir;
    void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader:`
    varying vec3 vDir; uniform float uTime,uAurora;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
    float fbm(vec2 p){ float v=0.0,a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.07+vec2(31.3,-17.1); a*=.5; } return v; }
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, -0.08, 1.0);
      vec3 zen = vec3(0.004,0.009,0.025);
      vec3 mid = vec3(0.014,0.034,0.064);
      vec3 hor = vec3(0.040,0.105,0.125);
      vec3 col = mix(hor, mid, smoothstep(-0.02,0.25,h));
      col = mix(col, zen, smoothstep(0.20,0.92,h));
      // horizon airglow: green band with amber/rose opposite fringe
      float glow = exp(-abs(h-0.035)*15.0);
      col += vec3(0.05,0.38,0.22) * glow * (0.42 + 0.32*uAurora);
      col += vec3(0.55,0.22,0.09) * exp(-abs(h-0.005)*30.0) * 0.34;
      col += vec3(0.20,0.05,0.25) * exp(-abs(h+0.025)*42.0) * 0.30;
      // Milky Way great-circle band diagonal across the dome
      vec3 n = normalize(vec3(0.34, 0.82, 0.45));
      float dist = abs(dot(d,n));
      float band = exp(-dist*dist*34.0);
      vec2 mwUv = vec2(atan(d.z,d.x)*2.4, d.y*5.0 + dot(d.xz, vec2(1.7,-1.2)));
      float cl = fbm(mwUv*2.6 + vec2(uTime*0.004,0.0));
      float dust = fbm(mwUv*7.5 + 13.0);
      float mw = band * smoothstep(0.24,0.78,cl) * (0.55+0.7*dust);
      col += vec3(0.72,0.82,0.95) * mw * 0.42;
      col += vec3(0.36,0.48,0.66) * band * 0.10;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(880, 64, 32), skyMat);
scene.add(skyDome);

const STAR_COUNT = 6500;
const starPos = new Float32Array(STAR_COUNT*3);
const starSize = new Float32Array(STAR_COUNT);
const starPhase = new Float32Array(STAR_COUNT);
const starTint = new Float32Array(STAR_COUNT);
const srng = mulberry32(92821);
for(let i=0;i<STAR_COUNT;i++){
  // upper hemisphere biased, more density along Milky-Way-ish plane
  let x,y,z,len;
  do{
    x = srng()*2-1; y = srng()*1.35-0.08; z = srng()*2-1;
    len = Math.sqrt(x*x+y*y+z*z);
  }while(len > 1 || len < 0.08);
  x/=len; y/=len; z/=len;
  const r = 820 + srng()*30;
  starPos[i*3+0]=x*r; starPos[i*3+1]=y*r; starPos[i*3+2]=z*r;
  starSize[i] = (srng()<0.055 ? 2.8+srng()*2.3 : 0.75+Math.pow(srng(),2.0)*1.9);
  starPhase[i] = srng()*Math.PI*2;
  starTint[i] = srng();
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize,1));
starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase,1));
starGeo.setAttribute('aTint', new THREE.BufferAttribute(starTint,1));
const starMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
  uniforms:{ uTime:{value:0}, uPixelRatio:{value:renderer.getPixelRatio()} },
  vertexShader:`
    attribute float aSize,aPhase,aTint;
    uniform float uTime,uPixelRatio;
    varying float vA; varying vec3 vC;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      float tw = 0.58 + 0.42*sin(uTime*(1.15+aTint*2.4) + aPhase) + 0.16*sin(uTime*6.0+aPhase*1.7);
      vA = clamp(tw,0.12,1.25);
      vC = mix(vec3(0.72,0.84,1.0), vec3(1.0,0.86,0.66), smoothstep(0.55,1.0,aTint));
      vC = mix(vC, vec3(0.88,0.95,1.0), smoothstep(0.25,0.0,abs(aTint-0.45))*0.7);
      gl_PointSize = aSize * uPixelRatio * (720.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    varying float vA; varying vec3 vC;
    void main(){
      vec2 p = gl_PointCoord - 0.5;
      float d = length(p);
      float core = smoothstep(0.16,0.0,d);
      float halo = exp(-d*7.0)*0.55;
      float a = (core + halo) * vA;
      if(a < 0.012) discard;
      gl_FragColor = vec4(vC*(0.72+core*1.6), a);
    }`
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

/* ============================================================
   Terrain, lake reflector, ice overlay
   ============================================================ */
const terrainGeo = new THREE.PlaneGeometry(380, 285, 255, 255); // exactly 256 x 256 vertices
terrainGeo.rotateX(-Math.PI/2);
{
  const pos = terrainGeo.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const cA = new THREE.Color(0xf4f8ff), cB = new THREE.Color(0xcfdcee), cC = new THREE.Color(0x9fb6d4);
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h=terrainHeight(x,z);
    pos.setY(i,h);
    const n = fbm(x*0.055+2.0,z*0.055-8.0,4);
    const shade = clamp(0.66 + h*0.020 + (n-0.5)*0.46);
    const col = cA.clone().lerp(cB, clamp(1-shade)).lerp(cC, sstep(12,35,h)*0.45);
    colors[i*3+0]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  terrainGeo.computeVertexNormals();
}
const snowMat = new THREE.MeshStandardMaterial({
  color:0xffffff, vertexColors:true, map:snowTex, bumpMap:bumpTex, bumpScale:0.42,
  roughness:0.93, metalness:0.0, envMapIntensity:0.25
});
const terrain = new THREE.Mesh(terrainGeo, snowMat);
terrain.receiveShadow = true;
scene.add(terrain);

const reflector = new Reflector(new THREE.CircleGeometry(1, 128), {
  clipBias: 0.0032,
  textureWidth: 2048,
  textureHeight: 2048,
  color: 0x8fa9ba
});

const curtainVert = `
  uniform float uTime, uActivity, uBurst, uPhase;
  varying vec2 vUv;

  void main(){
    vUv = uv;

    float f1 = sin(x*0.043 + uTime*speed*0.92 + uPhase) * 6.2;
    float f2 = sin(x*0.0175 - uTime*(0.34 + speed*0.38) + uPhase*1.83) * 11.5;
    float f3 = sin((x + p.y*2.2)*0.071 + uTime*speed*1.25 + uPhase*0.61) * 2.4;
    float fold = f1 + f2 + f3;
    vFold = fold;
    p.z += fold;
    p.x += sin(p.y*0.105 + uTime*speed*0.50 + uPhase) * 1.15;

  float noise1(float x){ float i=floor(x), f=fract(x); float u=f*f*(3.0-2.0*f); return mix(hash(i), hash(i+1.0), u); }

  float rays(float x, float t){
    float n = fbm1(x*68.0 + uPhase*19.0 + t*0.16);
    float fine = 0.72 + 0.38*sin(x*365.0 + t*1.7 + n*24.0 + uPhase*9.0);
    float slow = fbm1(x*13.0 - t*0.11 + uPhase*4.0);

/* ============================================================
   State, activity levels, substorm, benchmark
   ============================================================ */
let mode = 'interactive';           // 'interactive' | 'seek' | 'record'
let simTime = 0;
let activity = 2;                   // 1 quiet, 2 active, 3 storm
let burstStart = -100;              // simTime of substorm trigger
let stormFactor = 0;                // smoothed corona amount for interactive mode
let currentBrightness = 0.65;
const SHOWCASE_DURATION = 12.0;
const SHOWCASE_BURST = 6.15;

function burstEnvelope(age){
  if(age < 0 || age > 5.2) return 0;
  const attack = sstep(0.0, 0.55, age);
  const decay = Math.exp(-Math.max(0, age-0.35) / 1.72);
  const ripple = 0.86 + 0.14*Math.sin(age*8.5) * Math.exp(-age*0.9);
  return clamp(attack * decay * ripple, 0, 1);
}
function baseForActivity(a){ return a === 1 ? 0.30 : a === 2 ? 0.60 : 0.86; }
function computeAurora(t, dt, isSeek){
  let a = activity;
  let storm = stormFactor;
  if(isSeek){
    a = t < 3.45 ? 1 : (t < 7.75 ? 2 : 3);
    storm = sstep(7.65, 8.85, t);
  }else{
    const target = (activity === 3) ? 1 : 0;
    storm += (target - storm) * Math.min(1, dt * 1.85);
    stormFactor = storm;
  }
  const burstAge = t - (isSeek ? SHOWCASE_BURST : burstStart);
  const burst = burstEnvelope(burstAge);
  const flick = 0.055*Math.sin(t*1.83 + 0.7) + 0.035*Math.sin(t*4.31 + 2.1) + 0.025*Math.sin(t*7.7 + 4.2);
  const brightness = clamp(baseForActivity(a) + flick*(0.55+a*0.35) + burst*0.78, 0.035, 1.0);
  return { activity:a, storm, burst, brightness };
}

const bench = { activity: activity, curtains: curtains.length, stars: STAR_COUNT, brightness: currentBrightness };
window.__bench = bench;
function updateBench(state){
  bench.activity = state.activity;
  bench.curtains = curtains.length;
  bench.stars = STAR_COUNT;
  bench.brightness = clamp(state.brightness, 0, 1);
}

    c.material.uniforms.uTime.value = t;
    c.material.uniforms.uActivity.value = state.activity;
    c.material.uniforms.uBurst.value = state.burst;
    c.material.uniforms.uBrightness.value = state.brightness;
  }
  skyMat.uniforms.uTime.value = t;
  skyMat.uniforms.uAurora.value = state.brightness;
  starMat.uniforms.uTime.value = t;
  snowMat2.uniforms.uTime.value = t;
  snowMat2.uniforms.uBurst.value = state.burst;
  coronaMat.uniforms.uTime.value = t;
  coronaMat.uniforms.uBurst.value = state.burst;
  coronaMat.uniforms.uOpacity.value = clamp(state.storm*(0.72 + 0.28*Math.sin(t*2.7)) + state.burst*0.42, 0, 1);
  corona.lookAt(camera.position);
  auroraWash.intensity = 0.50 + state.brightness*2.15 + state.burst*2.1;
  auroraWash.color.setHSL(lerp(0.39,0.91,state.storm*0.55 + state.burst*0.25), 0.95, lerp(0.58,0.68,state.burst));
  magentaWash.intensity = 0.45 + state.brightness*1.25 + state.storm*1.25 + state.burst*1.8;
  magentaWash.color.setHSL(0.88, 0.9, 0.58);
  tentLight.intensity = 2.15 + 0.42*Math.sin(t*7.0) + 0.18*Math.sin(t*13.7+1.9);
  activityLabel.textContent = state.activity === 1 ? 'QUIET 1' : state.activity === 2 ? 'ACTIVE 2' : 'STORM 3';
  updateBench(state);
  return state;
}

function renderFrame(){ renderer.render(scene, camera); }

window.showcase = {
  duration: SHOWCASE_DURATION,
  seek(t){
    const tt = clamp(Number(t) || 0, 0, SHOWCASE_DURATION);
    mode = 'seek';
    controls.enabled = false;
    const u = tt / SHOWCASE_DURATION;
    const eased = u; // path itself is shaped; keep time linear for deterministic audio-like sync
    camera.position.copy(showPos.getPoint(eased));
    const target = showTgt.getPoint(eased);
    controls.target.copy(target);
    camera.lookAt(target);
    applySceneState(tt, 0, true);
    renderFrame();
  }
};

/* keys: activity levels and substorm */
window.addEventListener('keydown', (ev) => {
  if(ev.code === 'Space'){
    ev.preventDefault();
    if(mode === 'interactive') burstStart = simTime;
    return;
  }
  if(ev.key === '1' || ev.key === '2' || ev.key === '3'){
    activity = Number(ev.key);
    if(mode === 'interactive'){
      // immediate visual acknowledgement without leaving interactive mode
      applySceneState(simTime, 0, false);
      renderFrame();
    }
  }
});

/* buttons and recording */
let recorder = null, chunks = [], recordRaf = 0;
recordBtn.addEventListener('click', () => {
  if(recorder && recorder.state === 'recording') return;
  const stream = renderer.domElement.captureStream(60);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');
  try{ recorder = new MediaRecorder(stream, mime ? { mimeType:mime, videoBitsPerSecond:16000000 } : { videoBitsPerSecond:16000000 }); }
  catch(err){ recordBtn.textContent = 'RECORD UNSUPPORTED'; return; }
  chunks = [];
  recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'aurora-borealis-showcase.webm'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    recordBtn.classList.remove('recording'); recordBtn.textContent = '● RECORD VIDEO';
    mode = 'interactive'; controls.enabled = true;
  };
  recordBtn.classList.add('recording'); recordBtn.textContent = '● RECORDING…';
  mode = 'record'; controls.enabled = false;
  recorder.start(250);
  const t0 = performance.now();
  const tick = () => {
    const elapsed = (performance.now() - t0) / 1000;
    const t = Math.min(SHOWCASE_DURATION, elapsed);
    window.showcase.seek(t);
    if(elapsed < SHOWCASE_DURATION){ recordRaf = requestAnimationFrame(tick); }
    else{ cancelAnimationFrame(recordRaf); if(recorder && recorder.state === 'recording') recorder.stop(); }
  };
  tick();
});

/* resize */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w,h);
  starMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
  snowMat2.uniforms.uPixelRatio.value = renderer.getPixelRatio();
  if(mode === 'seek') window.showcase.seek(0);
});

/* main interactive loop; showcase is stepped only by seek/record */
let last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, Math.max(0.0001, (now - last)/1000));
  last = now;
  if(mode !== 'interactive') return;
  simTime += dt;
  controls.update();
  applySceneState(simTime, dt, false);
  renderFrame();
}
applySceneState(0, 0, false);
renderFrame();
requestAnimationFrame(animate);
</script>
</body>

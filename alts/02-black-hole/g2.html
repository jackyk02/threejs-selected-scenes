<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARGANTUA — Supermassive Black Hole · Schwarzschild Raytracer</title>
<style>
  :root{
    --amber:#ffb35c;
    --cyan:#7ee6ff;
    --dim:rgba(255,255,255,.55);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; }
  body{ font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; color:#fff; }
  canvas#view{ position:fixed; inset:0; display:block; }

  .hud{ position:fixed; z-index:10; pointer-events:none; user-select:none; }
  .panel{
    background:rgba(5,8,14,.55);
    border:1px solid rgba(255,179,92,.28);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius:4px;
    padding:12px 14px;
    box-shadow:0 0 32px rgba(0,0,0,.6), inset 0 0 18px rgba(255,179,92,.04);
  }
  #title{ top:18px; left:18px; }
  #title h1{
    font-size:15px; letter-spacing:.34em; font-weight:600; color:var(--amber);
    text-shadow:0 0 18px rgba(255,179,92,.55);
  }
  #title p{ font-size:9px; letter-spacing:.14em; color:var(--dim); margin-top:6px; }
  #title .rule{ height:1px; margin:8px 0; background:linear-gradient(90deg,var(--amber),transparent); opacity:.7; }

  #keys{ bottom:18px; left:18px; font-size:9.5px; line-height:1.9; color:var(--dim); letter-spacing:.08em; }
  #keys b{ color:var(--cyan); font-weight:600; border:1px solid rgba(126,230,255,.35); border-radius:3px; padding:0 5px; margin-right:6px; }

  #bench{ bottom:18px; right:18px; font-size:10px; letter-spacing:.12em; text-align:right; color:var(--dim); }
  #bench .val{ color:#fff; }
  #bench .ok{ color:var(--cyan); }
  #bench .off{ color:#ff8d7a; }
  #bench .row{ margin-top:3px; }

  #controlsTop{ top:18px; right:18px; display:flex; gap:10px; pointer-events:auto; }
  button.ctl{
    pointer-events:auto; cursor:pointer; font-family:inherit;
    font-size:10px; letter-spacing:.22em; font-weight:600;
    color:var(--amber); background:rgba(10,8,4,.72);
    border:1px solid rgba(255,179,92,.5); border-radius:3px;
    padding:10px 16px; backdrop-filter:blur(6px);
    text-shadow:0 0 10px rgba(255,179,92,.6);
    transition:all .18s ease;
  }
  button.ctl:hover{ background:rgba(255,179,92,.16); box-shadow:0 0 22px rgba(255,179,92,.35); color:#ffd9a0; }
  button.ctl.rec{ color:#ff6a55; border-color:rgba(255,106,85,.55); text-shadow:0 0 10px rgba(255,106,85,.6); }
  button.ctl.rec:hover{ background:rgba(255,106,85,.16); box-shadow:0 0 22px rgba(255,106,85,.4); }
  button.ctl:disabled{ opacity:.45; cursor:default; }

  #caption{
    bottom:11%; left:50%; transform:translateX(-50%) translateY(8px);
    font-size:11px; letter-spacing:.3em; color:#ffe9c9; text-align:center;
    text-shadow:0 0 16px rgba(255,150,60,.7), 0 2px 4px #000;
    opacity:0; transition:opacity .35s ease, transform .35s ease;
    white-space:nowrap;
  }
  #caption.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  #caption .sub{ display:block; font-size:8px; letter-spacing:.22em; color:var(--dim); margin-top:6px; }

  #recDot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#ff5040;
    margin-right:8px; animation:blink 1s steps(2,start) infinite; vertical-align:1px; }
  @keyframes blink{ to{ visibility:hidden; } }
</style>

{
  "imports": {

<body>

<canvas id="view"></canvas>

<div class="hud panel" id="title">
  <h1>GARGANTUA</h1>
  <div class="rule"></div>
  <p>SUPERMASSIVE BLACK HOLE · SCHWARZSCHILD GEODESIC RAYTRACER</p>
</div>

<div class="hud panel" id="keys">
  <div><b>DRAG</b> orbit camera</div>
  <div><b>SCROLL</b> zoom 6 – 60 rs</div>
  <div><b>L</b> toggle gravitational lensing</div>
  <div><b>D</b> toggle Doppler beaming</div>
  <div><b>[</b> / <b>]</b> tilt disk inclination</div>
</div>

  <div class="row">DIST <span class="val" id="bDist">24.0 rs</span></div>
  <div class="row">INCL <span class="val" id="bIncl">62°</span></div>
  <div class="row">LENS <span class="ok" id="bLens">ON</span> &nbsp; DOPPLER <span class="ok" id="bDop">ON</span></div>
</div>

  <button class="ctl" id="playBtn">▶ PLAY SHOWCASE</button>
  <button class="ctl rec" id="recBtn">⏺ RECORD VIDEO</button>
</div>

<div class="hud" id="caption"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   GARGANTUA — fullscreen gravitational-lensing raytracer
   Units: 1 unit = 1 Schwarzschild radius (rs).  μ = M = 0.5 rs.
   Shadow radius = √27·μ ≈ 2.598 rs.  Photon sphere at 1.5 rs.
   ============================================================ */

// ---------- top-level scene objects (required) ----------
const canvas = document.getElementById('view');
const scene = new THREE.Scene();                    // fullscreen quad lives here
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 6;                           // rs
controls.maxDistance = 60;                          // rs
controls.rotateSpeed = 0.55;
controls.target.set(0, 0, 0);

// initial composition: 3/4 view, moderately inclined
const INIT = { dist:24, elevDeg:27, azimDeg:-38, inclDeg:62 };
function placeCamera(dist, elevDeg, azimDeg){
  const el = THREE.MathUtils.degToRad(elevDeg), az = THREE.MathUtils.degToRad(azimDeg);
  const h = Math.cos(el) * dist;
  camera.position.set(Math.cos(az)*h, Math.sin(el)*dist, Math.sin(az)*h);
  camera.lookAt(0,0,0);
}
placeCamera(INIT.dist, INIT.elevDeg, INIT.azimDeg);

// ---------- shockingly simple state ----------
const state = {
  lensing: true,
  doppler: true,
  inclDeg: INIT.inclDeg,     // disk tilt around X axis
  diskTime: 0                // seconds of disk evolution (drives Keplerian shear)
};

// ============================================================
//  SHADERS
// ============================================================
const VERT = /* glsl */`
  void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

const FRAG = /* glsl */`
precision highp float;

uniform vec2  uRes;
uniform vec3  uCamWorld;    // camera position, world frame
uniform vec3  uCamDisk;     // camera position, disk-tilted frame
uniform vec3  uRight;
uniform vec3  uUp;
uniform vec3  uFwd;
uniform float uFov;
uniform float uTime;        // disk-evolution seconds
uniform float uLensing;     // 1 = bend rays, 0 = straight
uniform float uDoppler;     // 1 = apply Doppler beaming
uniform float uDiskTilt;    // radians

#define STEPS 300
#define PI 3.14159265359

// ---------- hashing / noise ----------
float hash12(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float hash13(vec3 p){
  p = fract(p * 0.3183099 + vec3(0.11, 0.17, 0.13));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float vnoise2(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float n000 = hash13(i);
  float n100 = hash13(i + vec3(1.0, 0.0, 0.0));
  float n010 = hash13(i + vec3(0.0, 1.0, 0.0));
  float n110 = hash13(i + vec3(1.0, 1.0, 0.0));
  float n001 = hash13(i + vec3(0.0, 0.0, 1.0));
  float n101 = hash13(i + vec3(1.0, 0.0, 1.0));
  float n011 = hash13(i + vec3(0.0, 1.0, 1.0));
  float n111 = hash13(i + vec3(1.0, 1.0, 1.0));
  float nx00 = mix(n000, n100, f.x);
  float nx10 = mix(n010, n110, f.x);
  float nx01 = mix(n001, n101, f.x);
  float nx11 = mix(n011, n111, f.x);
  return mix(mix(nx00, nx10, f.y), mix(nx01, nx11, f.y), f.z);
}
float fbm2(vec2 p){
  float v = 0.0, a = 0.5;
  mat2 R = mat2(0.80, -0.60, 0.60, 0.80);
  for (int i = 0; i < 6; i++){
    v += a * vnoise2(p);
    p = R * p * 2.03 + vec2(17.3, 9.1);
    a *= 0.52;
  }
  return v;
}
float fbm3(vec3 p){
  float v = 0.0, a = 0.55;
  for (int i = 0; i < 5; i++){
    v += a * vnoise3(p);
    p = p * 2.07 + vec3(11.7, 5.3, 8.9);
    a *= 0.55;
  }
  return v;
}

// ---------- Tanner–Helland blackbody ----------
vec3 blackbody(float kelvin){
  float t = clamp(kelvin, 1500.0, 40000.0) / 100.0;
  float r, g, b;
  if (t <= 66.0) r = 255.0;
  else           r = clamp(329.698727446 * pow(t - 60.0, -0.1332047592), 0.0, 255.0);
  if (t <= 66.0) g = clamp(99.4708025861 * log(t) - 161.1195681661, 0.0, 255.0);
  else           g = clamp(288.1221695283 * pow(t - 60.0, -0.0755148492), 0.0, 255.0);
  if (t >= 66.0) b = 255.0;
  else if (t <= 19.0) b = 0.0;
  else b = clamp(138.5177312231 * log(t - 10.0) - 305.0447927307, 0.0, 255.0);
  return vec3(r, g, b) / 255.0;
}

// ---------- procedural sky ----------
vec3 starLayer(vec3 d, float scale, float thresh, float size, float gain){
  vec3 sp = d * scale;
  vec3 id = floor(sp);
  vec3 f  = fract(sp) - 0.5;
  float h = hash13(id);
  if (h < thresh) return vec3(0.0);
  vec3 off = vec3(hash13(id + vec3(11.3, 3.1, 7.7)),
                  hash13(id + vec3(27.7, 9.2, 1.3)),
                  hash13(id + vec3(41.1, 5.5, 13.9))) - 0.5;
  float dist = length(f - off * 0.72);
  float mag  = pow(hash13(id + vec3(5.5, 8.8, 2.2)), 3.4);
  float halo = smoothstep(size, 0.0, dist);
  float core = smoothstep(size * 0.32, 0.0, dist);
  vec3 tint = mix(vec3(1.0, 0.72, 0.50), vec3(0.62, 0.78, 1.0), hash13(id + vec3(9.9, 4.4, 6.6)));
  return tint * (halo * 0.5 + core * 1.9) * mag * gain;
}

vec3 background(vec3 d){
  // faint deep-space ambient
  vec3 col = vec3(0.010, 0.012, 0.022);

  // ---- dusty galactic band ----
  vec3 bn = normalize(vec3(0.30, 0.88, 0.36));
  float b = dot(d, bn);
  float band = exp(-abs(b) * 8.5);
  if (band > 0.004){
    float clouds = fbm3(d * 4.2 + vec3(3.7, 1.1, 8.4));
    float dust   = fbm3(d * 9.5 + vec3(9.1, 2.3, 7.7));
    float wisp   = fbm3(d * 18.0 + vec3(5.2, 7.9, 1.6));
    float lane   = smoothstep(0.52, 0.82, dust) * band;
    float coreHeat = pow(clamp(1.0 - abs(b) * 1.55, 0.0, 1.0), 2.4);
    vec3 bandCol = mix(vec3(0.20, 0.17, 0.38), vec3(1.02, 0.84, 0.55), coreHeat);
    bandCol *= (0.28 + 1.35 * clouds + 0.35 * wisp);
    bandCol *= (1.0 - 0.82 * lane);                 // dark dust lanes
    col += bandCol * band * 0.85;
    col += vec3(0.55, 0.40, 0.62) * pow(band, 3.0) * clouds * 0.35; // violet rim glow
  }

  // ---- stars: two depth layers ----
  col += starLayer(d,  70.0, 0.94, 0.16, 2.6);
  col += starLayer(d, 160.0, 0.965, 0.10, 3.6);

  // sparse bright heroes with cross-ish flare
  vec3 sp = d * 22.0;
  vec3 id = floor(sp);
  float h = hash13(id + vec3(31.7));
  if (h > 0.985){
    vec3 f = fract(sp) - 0.5;
    vec3 off = vec3(hash13(id + vec3(1.7, 8.1, 3.3)),
                    hash13(id + vec3(7.9, 2.9, 5.1)),
                    hash13(id + vec3(4.3, 6.7, 9.7))) - 0.5;
    float dist = length(f - off * 0.7);
    col += vec3(1.0, 0.95, 0.85) * smoothstep(0.085, 0.0, dist) * 5.0;
  }
  return col;
}

// ---------- accretion disk ----------
// returns vec4(emission, alpha)
vec4 diskShade(vec3 hp, float rr, vec3 camDiskPos){
  const float MU = 0.5;

  // Keplerian angular frequency Ω = sqrt(μ / r³) — inner edge orbits faster.
  // Time shear factor exaggerates differential rotation for legibility.
  float omega = sqrt(MU / (rr * rr * rr)) * 8.0;
  float rot = omega * uTime;
  float c = cos(rot), s = sin(rot);
  vec2 sp = vec2(c * hp.x - s * hp.z, s * hp.x + c * hp.z);

  // turbulent structure: multi-octave fbm + ridged filaments, tangentially stretched
  float n   = fbm2(sp * 0.50);
  float n2  = fbm2(sp * 1.55 + vec2(7.3, 2.9));
  float rid = 1.0 - abs(2.0 * fbm2(vec2(sp.x * 0.42, sp.y * 1.9) + vec2(3.1, 8.7)) - 1.0);
  rid = rid * rid;
  float density = clamp(0.62 * n + 0.55 * rid * (0.4 + 0.6 * n2) + 0.18 * n2, 0.0, 1.6);

  // radial gates: sharp inner edge at 3 rs, tapering tail to 12 rs
  float innerFade = smoothstep(3.0, 3.45, rr);
  float rimBoost  = 1.0 + 1.6 * smoothstep(4.4, 3.05, rr);          // hot rim near ISCO
  float outerFade = 1.0 - smoothstep(9.0, 12.0, rr);
  float alpha = clamp((0.30 + 1.25 * density) * innerFade * outerFade, 0.0, 1.0);

  // blackbody temperature profile (Novikov–Thorne-like falloff)
  float T = 9400.0 * pow(rr / 3.0, -0.78);   // ~9400 K inner → ~3100 K rim

  // ---- relativistic shifts ----
  vec3 vdir  = normalize(vec3(-hp.z, 0.0, hp.x));     // tangential velocity direction
  float v    = clamp(sqrt(MU / rr), 0.0, 0.94);       // circular speed (c = 1), ~0.41c inner
  vec3 nToCam = normalize(camDiskPos - hp);           // photon direction toward observer
  float cosA  = dot(vdir, nToCam);
  float beta2 = v * v;
  float gamma = 1.0 / sqrt(max(1.0 - beta2, 1e-4));
  float dopp  = 1.0 / (gamma * (1.0 - v * cosA));     // > 1 approaching, < 1 receding
  float grav  = sqrt(max(1.0 - 1.0 / rr, 0.0));       // gravitational redshift, 1.0 at ∞
  float shift = mix(grav, dopp * grav, uDoppler);     // full shift (or doppler off → grav only)

  vec3 bb = blackbody(T * shift);
  float inten = (0.35 + 3.1 * density * density) * pow(shift, 3.0) * rimBoost;

  return vec4(bb * inten * innerFade * outerFade, alpha);
}

// rotate around X (disk tilt)
vec3 rotX(vec3 v, float ct, float st){ return vec3(v.x, ct * v.y - st * v.z, st * v.y + ct * v.z); }

void main(){
  vec2 ndc = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
  float tanF = tan(radians(uFov) * 0.5);
  vec3 rd = normalize(uFwd + (ndc.x * uRight + ndc.y * uUp) * tanF);
  vec3 ro = uCamWorld;

  float ct = cos(uDiskTilt), st = sin(uDiskTilt);
  vec3 p = rotX(ro, ct, st);          // work in disk-tilted frame
  vec3 d = rotX(rd, ct, st);

  float minR = 1e9;
  vec3 prevP = p;
  vec3 acc   = vec3(0.0);
  float trans = 1.0;
  bool captured = false;

  for (int i = 0; i < STEPS; i++){
    float r = length(p);
    minR = min(minR, r);

    if (r < 1.0){ captured = true; break; }        // crossed the horizon (r = rs)
    if (r > 90.0) break;                           // escaped to infinity

    // adaptive step: fine near the photon sphere, coarse far out
    float dt = clamp((r - 1.0) * 0.115 + 0.016, 0.008, 0.34);
    if (r < 2.2) dt = min(dt, 0.030 + r * 0.014);

    if (uLensing > 0.5){
      vec3 L = cross(p, d);
      float h2 = dot(L, L);                         // angular momentum² (n=0 geodesic)
      vec3 accel = -1.5 * h2 * p / pow(r, 5.0);     // 3μ = 1.5 in rs units
      d = normalize(d + accel * dt);
    }
    p += d * dt;

    // ---- disk plane crossing (y = 0 in tilted frame) ----
    float y0 = prevP.y, y1 = p.y;
    if ((y0 > 0.0) != (y1 > 0.0)){
      float f  = y0 / (y0 - y1);
      vec3 hp  = mix(prevP, p, f);
      float rr = length(hp.xz);
      if (rr > 3.0 && rr < 12.0){
        vec4 em = diskShade(hp, rr, uCamDisk);
        acc   += trans * em.rgb * em.a;
        trans *= (1.0 - em.a * 0.92);
        if (trans < 0.08) break;
      }
    }
    prevP = p;
  }

  vec3 col;
  if (captured){
    col = acc;                                      // shadow: black, only disk light in it
  } else {
    vec3 finalWorld = normalize(rotX(d, ct, -st));  // back to world frame for sky
    col = acc + trans * background(finalWorld);

    // thin photon ring: escaping rays that skimmed the photon sphere
    if (uLensing > 0.5){
      float ring = exp(-max(minR - 1.5, 0.0) * 26.0) * smoothstep(1.42, 1.5, minR);
      col += trans * ring * vec3(1.0, 0.88, 0.66) * 1.35;
    }
  }

  // ---- art direction: grade ----
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(lum), col, 1.14);                  // gentle saturation
  vec2 vc = gl_FragCoord.xy / uRes - 0.5;
  col *= 1.0 - dot(vc, vc) * 0.55;                  // vignette
  col += (hash12(gl_FragCoord.xy + vec2(0.5)) - 0.5) * 0.012;  // film grain

  gl_FragColor = vec4(col, 1.0);
}
`;

const uniforms = {
  uRes:      { value: new THREE.Vector2(1, 1) },
  uCamWorld: { value: new THREE.Vector3() },
  uCamDisk:  { value: new THREE.Vector3() },
  uRight:    { value: new THREE.Vector3() },
  uUp:       { value: new THREE.Vector3() },
  uFwd:      { value: new THREE.Vector3() },
  uFov:      { value: 55.0 },
  uTime:     { value: 0.0 },
  uLensing:  { value: 1.0 },
  uDoppler:  { value: 1.0 },
  uDiskTilt: { value: THREE.MathUtils.degToRad(state.inclDeg) }
};

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: FRAG, uniforms, depthTest:false, depthWrite:false })
);
quadScene.add(quad);
scene.add(quad);   // the required top-level `scene` holds the fullscreen pass

// ---------- bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, quadCam));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.75, 0.55, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ============================================================
//  UNIFORM / BENCH SYNC
// ============================================================
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);

function syncUniforms(){
  const tilt = THREE.MathUtils.degToRad(state.inclDeg);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  _fwd.subVectors(controls.target, camera.position).normalize();
  _right.crossVectors(_fwd, _up).normalize();
  const trueUp = new THREE.Vector3().crossVectors(_right, _fwd).normalize();

  uniforms.uCamWorld.value.copy(camera.position);
  uniforms.uCamDisk.value.set(camera.position.x, ct*camera.position.y - st*camera.position.z, st*camera.position.y + ct*camera.position.z);
  uniforms.uRight.value.copy(_right);
  uniforms.uUp.value.copy(trueUp);
  uniforms.uFwd.value.copy(_fwd);
  uniforms.uFov.value = camera.fov;
  uniforms.uTime.value = state.diskTime;
  uniforms.uLensing.value = state.lensing ? 1.0 : 0.0;
  uniforms.uDoppler.value = state.doppler ? 1.0 : 0.0;
  uniforms.uDiskTilt.value = tilt;

  const dbSize = renderer.getDrawingBufferSize(new THREE.Vector2());
  uniforms.uRes.value.copy(dbSize);
}

const bDist = document.getElementById('bDist'), bIncl = document.getElementById('bIncl');
const bLens = document.getElementById('bLens'), bDop = document.getElementById('bDop');

function syncBench(){
  const dist = camera.position.distanceTo(controls.target);
  window.__bench = {
    cameraDistance: +dist.toFixed(4),
    inclination: +state.inclDeg.toFixed(2),
    lensing: state.lensing,
    doppler: state.doppler
  };
  bDist.textContent = dist.toFixed(1) + ' rs';
  bIncl.textContent = state.inclDeg.toFixed(0) + '°';
  bLens.textContent = state.lensing ? 'ON' : 'OFF';
  bLens.className = state.lensing ? 'ok' : 'off';
  bDop.textContent = state.doppler ? 'ON' : 'OFF';
  bDop.className = state.doppler ? 'ok' : 'off';
}

// ============================================================
//  SHOWCASE — deterministic 12 s cinematic
// ============================================================
const SHOW_DURATION = 12.0;

function kf(t, keys){
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++){
    const [t0, v0] = keys[i], [t1, v1] = keys[i + 1];
    if (t <= t1){
      const u = (t - t0) / (t1 - t0);
      const s = 0.5 - 0.5 * Math.cos(Math.PI * u);   // smooth cosine ease
      return v0 + (v1 - v0) * s;
    }
  }
  return keys[keys.length - 1][1];
}

const SHOT = {
  dist: [[0,30],[2.4,19.5],[4.6,13],[7.2,11],[9.0,15.5],[10.8,22],[12,26]],
  tilt: [[0,18],[2.4,30],[4.6,54],[7.2,74],[9.0,58],[10.8,42],[12,60]],
  azim: [[0,-32],[2.4,-8],[4.6,28],[7.2,78],[9.0,118],[10.8,152],[12,178]],
  elev: [[0,16],[2.4,15],[4.6,13],[7.2,11],[9.0,15],[10.8,20],[12,19]]
};

const CAPTIONS = [
  { until: 2.3,  text: 'ESTABLISHING WIDE',   sub: 'A STAR-EATING GIANT, WRAPPED IN LIGHT' },
  { until: 4.6,  text: 'THE DIVE',            sub: 'GEODESICS BEND · THE SKY ITSELF IS LENSED' },
  { until: 7.3,  text: 'EDGE-ON CROWN',       sub: 'THE FAR SIDE OF THE DISK, MIRRORED OVER THE SHADOW' },
  { until: 9.4,  text: 'THE ORBIT',           sub: 'DOPPLER BEAMING — THE APPROACHING SIDE WINS' },
  { until: 10.55,text: 'LENSING DISABLED',    sub: 'STRAIGHT-LINE COMPARISON · PRESS L IN FREE MODE' },
  { until: Infinity, text: 'LENSING RESTORED', sub: 'SCHWARZSCHILD GEODESICS · r = 2M EVENT HORIZON' }
];
const captionEl = document.getElementById('caption');

function captionFor(t){
  for (const c of CAPTIONS) if (t < c.until) return c;
  return CAPTIONS[CAPTIONS.length - 1];
}

function seekShowcase(t){
  t = THREE.MathUtils.clamp(t, 0, SHOW_DURATION);
  const dist = kf(t, SHOT.dist);
  const tilt = kf(t, SHOT.tilt);
  const azim = kf(t, SHOT.azim);
  const elev = kf(t, SHOT.elev);

  state.inclDeg = tilt;
  state.lensing = !(t > 9.4 && t < 10.55);   // brief straight-ray comparison beat
  state.doppler = true;
  state.diskTime = t * 2.0;                  // deterministic disk evolution

  placeCamera(dist, elev, azim);
  controls.target.set(0, 0, 0);

  syncUniforms();
  composer.render();
  syncBench();

  const cap = captionFor(t);
  captionEl.innerHTML = cap.text + '<span class="sub">' + cap.sub + '</span>';
  captionEl.classList.add('on');
}

window.showcase = {
  duration: SHOW_DURATION,
  seek: (t) => { seekShowcase(t); }
};

// ============================================================
//  SHOWCASE PLAYBACK + RECORDING
// ============================================================
const playBtn = document.getElementById('playBtn');
const recBtn  = document.getElementById('recBtn');
let showcasePlaying = false;
let recording = false;

function endShowcase(){
  showcasePlaying = false;
  controls.enabled = true;
  playBtn.disabled = false;
  if (!recording) recBtn.disabled = false;
  captionEl.classList.remove('on');
  // restore an interactive default derived from final shot
  state.lensing = true;
}

function runShowcase(record){
  if (showcasePlaying) return;
  showcasePlaying = true;
  controls.enabled = false;
  playBtn.disabled = true;
  if (!record) recBtn.disabled = true;

  let recorder = null, chunks = [];
  if (record){
    recording = true;
    recBtn.innerHTML = '<span id="recDot"></span>RECORDING…';
    const stream = renderer.domElement.captureStream(60);
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9' : 'video/webm';
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 28_000_000 });
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gargantua-showcase.webm';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      recording = false;
      recBtn.textContent = '⏺ RECORD VIDEO';
      recBtn.disabled = false;
    };
    recorder.start(250);
  }

  const start = performance.now();
  const step = () => {
    const t = (performance.now() - start) / 1000;
    if (t >= SHOW_DURATION){
      seekShowcase(SHOW_DURATION);
      if (recorder && recorder.state !== 'inactive') recorder.stop();
      endShowcase();
      return;
    }
    seekShowcase(t);
    requestAnimationFrame(step);
  };
  step();
}

playBtn.addEventListener('click', () => runShowcase(false));
recBtn.addEventListener('click', () => runShowcase(true));

// ============================================================
//  INPUT — keys L / D / [ / ]
// ============================================================
function tiltBy(deg){
  state.inclDeg = THREE.MathUtils.clamp(state.inclDeg + deg, 0, 84);
}
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyL'){ state.lensing = !state.lensing; }
  else if (e.code === 'KeyD'){ state.doppler = !state.doppler; }
  else if (e.key === '['){ tiltBy(-4); }
  else if (e.key === ']'){ tiltBy(4); }
});

// ============================================================
//  RESIZE
// ============================================================
function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  syncUniforms();
}
window.addEventListener('resize', onResize);

// ============================================================
//  MAIN LOOP
// ============================================================
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (showcasePlaying) return;   // seek() owns the frame during showcase / record

  controls.update();
  state.diskTime += dt * 1.6;    // free-run disk evolution
  syncUniforms();
  composer.render();
  syncBench();
}

syncUniforms();
animate();
</script>
</body>
</html>
